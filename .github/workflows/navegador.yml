# Pruebas en un navegador real (Chromium con Playwright) contra un servidor
# estático con el repo tal cual y la base real. Cada push a main, cada push a
# una rama ci-prueba/** y todas las noches a las 5 de la mañana de Argentina
# (08:00 UTC).
#
# DOS MITADES A LA VEZ (14/10/2026): con un solo trabajo, Playwright tardaba
# ~22 de los 30 minutos de tope. Ahora son dos trabajos en paralelo ("Navegador
# 1/2" y "Navegador 2/2"); cada uno corre su mitad de los specs
# (E2E_MITAD, ver e2e/mitades.js: la mitad 1 es una lista, la 2 es todo lo
# demás). pruebas/test-navegador-en-dos.js exige que ningún spec quede afuera
# ni corra dos veces. El workflow se sigue llamando "Navegador": es una sola
# corrida por commit, con dos trabajos adentro.
#
# Los recorridos de la planta, la gestión y Accesos necesitan los secretos
# E2E_PLANTA_EMAIL, E2E_GESTION_EMAIL y E2E_SERVICE_ROLE_KEY (Settings →
# Secrets and variables → Actions). Sin ellos se saltean con un aviso.
name: Navegador

on:
  push:
    branches: [main, 'ci-prueba/**']
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  # UNA FILA POR RAMA. Antes era un solo grupo "navegador" para todo, y GitHub
  # deja UNA sola corrida esperando por grupo: si main estaba esperando y
  # llegaba un push de una rama ci-prueba/**, GitHub CANCELABA la de main (pasó
  # el 14/10/2026). Ahora main solo espera detrás de main (y del horario de la
  # noche, que corre sobre main), y cada rama solo detrás de sí misma.
  # cancel-in-progress: false = una corrida que ya empezó nunca se corta.
  group: navegador-${{ github.ref }}
  cancel-in-progress: false

jobs:
  navegador:
    name: Navegador ${{ matrix.mitad }}/2
    # 26/10/2026: la instalación de Chromium y WebKit CON SUS DEPENDENCIAS
    # (apt-get) se colgó en una de las dos máquinas cuatro veces en el día, en
    # ubuntu-latest y en 24.04, con tope y con reintento. El trabajo corre
    # adentro de la imagen oficial de Playwright, que ya trae los navegadores y
    # todo lo del sistema: no se instala nada con apt. La versión de la imagen
    # es la de @playwright/test en package-lock.json (lo controla
    # test-navegador-en-dos.js).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # Adentro de un contenedor el shell de los "run" es sh, no bash: el paso de
    # las credenciales del robot usa ${!v} (solo bash) y en main dio "exit 2"
    # (27/10/2026; en las ramas sale antes de llegar a esa línea).
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      # Si una mitad falla, la otra termina igual: así se ven todas las fallas.
      fail-fast: false
      matrix:
        mitad: [1, 2]
    env:
      E2E_MITAD: ${{ matrix.mitad }}
      # LA FÁBRICA DE PRUEBAS ES UNA SOLA: dos corridas a la vez se pisarían los
      # turnos. Con una fila por rama, main y una rama pueden correr al mismo
      # tiempo, así que los secretos del robot van SOLO a las corridas de main
      # (push, la noche y a mano sobre main). En una rama los recorridos del
      # robot se saltean, como cuando faltan los secretos. Adentro de una misma
      # corrida no hay choque: los specs del robot van todos en la misma mitad
      # (lo exige test-navegador-en-dos.js).
      E2E_PLANTA_EMAIL: ${{ github.ref == 'refs/heads/main' && secrets.E2E_PLANTA_EMAIL || '' }}
      E2E_GESTION_EMAIL: ${{ github.ref == 'refs/heads/main' && secrets.E2E_GESTION_EMAIL || '' }}
      E2E_RETIROS_EMAIL: ${{ github.ref == 'refs/heads/main' && secrets.E2E_RETIROS_EMAIL || '' }}
      E2E_SERVICE_ROLE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.E2E_SERVICE_ROLE_KEY || '' }}
      E2E_MAESTRO_NOMBRE: ${{ github.ref == 'refs/heads/main' && secrets.E2E_MAESTRO_NOMBRE || '' }}
      E2E_MAESTRO_PIN: ${{ github.ref == 'refs/heads/main' && secrets.E2E_MAESTRO_PIN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # WebKit es el iPhone de e2e/filtros-dispositivos.spec.js (04/10/2026) y
      # de e2e/detalles-dispositivos.spec.js (05/10/2026). La imagen ya los
      # trae; esto solo baja los navegadores (sin apt) si alguna vez la versión
      # de la imagen y la del proyecto no coinciden. Con tope, por las dudas.
      - name: Chromium y WebKit (vienen en la imagen)
        timeout-minutes: 8
        run: npx playwright install chromium webkit
      - name: ¿Están las credenciales del robot?
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "### Rama $GITHUB_REF_NAME: los recorridos del robot se saltean (la fábrica de pruebas la usa solo main)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          faltan=""
          for v in E2E_PLANTA_EMAIL E2E_GESTION_EMAIL E2E_SERVICE_ROLE_KEY; do
            [ -z "${!v}" ] && faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "::warning::Faltan los secretos:$faltan. Los recorridos de planta, gestión y Accesos se saltean."
            echo "### ⚠️ Faltan los secretos:$faltan — los recorridos del robot se saltean" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Playwright (mitad ${{ matrix.mitad }} de 2)
        run: npm run e2e
      - name: Resumen
        if: always()
        run: |
          n=$(ls e2e/resultados/capturas 2>/dev/null | wc -l)
          echo "### Mitad ${{ matrix.mitad }} de 2 — capturas del recorrido: $n (artefacto \"capturas-${{ matrix.mitad }}\")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-${{ matrix.mitad }}
          path: |
            e2e/resultados/
            e2e/informe/
          retention-days: 14
