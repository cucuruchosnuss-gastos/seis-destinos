<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Seis Destinos</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a2a52">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="pagina-auth">

  <div class="tarjeta-auth">
    <div class="auth-logo">
      <img src="logo.png" alt="Seis Destinos" style="max-width: 200px; height: auto; display: block; margin: 0 auto;">
    </div>

    <form class="formulario" id="formulario-login" novalidate>
      <div class="grupo-campo">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="contrasena">Contraseña</label>
        <div class="campo-contrasena">
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="btn-mostrar-contrasena"
            data-target="contrasena"
            aria-label="Mostrar u ocultar contraseña"
            title="Mostrar contraseña"
          ><i data-lucide="eye"></i></button>
        </div>
        <p style="margin: 0.5rem 0 0; text-align: right;">
          <a href="recuperar-contrasena.html" style="font-size: 0.8125rem;">¿Olvidaste tu contraseña?</a>
        </p>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEJjFW7fQjfhZCTy" data-callback="onTurnstileOk"></div>

      <div class="alerta alerta--error" id="alerta-error" role="alert"></div>

      <div class="formulario__acciones">
        <button type="submit" class="btn btn--primario" id="btn-ingresar">
          Ingresar
        </button>
      </div>
    </form>

    <p class="formulario__pie">
      ¿No tenés cuenta?
      <a href="registro.html">Solicitá acceso</a>
    </p>
  </div>

  <script type="module">
    import { verificarSesion, iniciarSesion } from './js/auth.js'
    import { mostrarBannerVersion } from './js/version-banner.js'

    mostrarBannerVersion()

    // Si ya hay sesión, ir al dashboard directamente
    await verificarSesion({ redirigirSiNoHay: false, redirigirSiHay: true })

    lucide.createIcons()

    // Toggle mostrar/ocultar contraseña — mismo patrón que registro.html y
    // restablecer-contrasena.html. El hover ahora lo resuelve el CSS compartido
    // (.btn-mostrar-contrasena:hover); ya no hacen falta los dos listeners que
    // pintaban colores hardcodeados a mano.
    document.querySelectorAll('.btn-mostrar-contrasena').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target)
        const estabaOculta = input.type === 'password'
        input.type = estabaOculta ? 'text' : 'password'
        btn.innerHTML = `<i data-lucide="${estabaOculta ? 'eye-off' : 'eye'}"></i>`
        lucide.createIcons()
      })
    })

    const formulario  = document.getElementById('formulario-login')
    const btnIngresar = document.getElementById('btn-ingresar')
    const alertaError = document.getElementById('alerta-error')

    function mostrarAlertaError(mensaje) {
      alertaError.textContent = mensaje
      alertaError.classList.add('alerta--visible')
    }

    function ocultarAlertaError() {
      alertaError.classList.remove('alerta--visible')
    }

    // Turnstile busca el data-callback por nombre en el objeto global, y este
    // script es un módulo (sus funciones NO quedan en window). Sin esta
    // asignación explícita, el callback no se dispara nunca.
    window.onTurnstileOk = () => ocultarAlertaError()

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault()
      ocultarAlertaError()

      const email      = document.getElementById('email').value.trim()
      const contrasena = document.getElementById('contrasena').value

      if (!email || !contrasena) {
        mostrarAlertaError('Completá todos los campos.')
        return
      }

      // El ?. cubre que el script de Cloudflare no haya cargado (red lenta,
      // bloqueador): sin token no se envía nada.
      const captchaToken = window.turnstile?.getResponse() ?? ''
      if (!captchaToken) {
        mostrarAlertaError('Esperá a que termine la verificación de seguridad.')
        return
      }

      btnIngresar.classList.add('btn--cargando')
      btnIngresar.disabled = true

      try {
        await iniciarSesion(email, contrasena, captchaToken)
        window.location.replace('dashboard.html')
      } catch (error) {
        mostrarAlertaError(error.message)
        // El token es de un solo uso: sin reset, el segundo intento manda un
        // token ya consumido y falla siempre, aunque la contraseña sea correcta.
        window.turnstile?.reset()
        btnIngresar.classList.remove('btn--cargando')
        btnIngresar.disabled = false
      }
    })
  </script>

</body>
</html>
