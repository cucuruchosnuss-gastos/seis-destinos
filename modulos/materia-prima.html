<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">

  <style>
    body { overflow-x: hidden; }

    /* Cualquier regla de autor con display le gana al [hidden] del user-agent —
       bug conocido del proyecto (ver CLAUDE.md). Misma solución que
       cuentas-corrientes.html: restaurar la semántica de hidden global. */
    [hidden] { display: none !important; }

    .contenedor-mp {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      min-width: 0;
    }

    /* ── Header — tarjeta blanca, mismo patrón que cuentas-corrientes ────── */

    .mp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      background: var(--color-fondo);
      border-radius: var(--radio-tarjeta);
      box-shadow: var(--sombra-suave);
      padding: 0.875rem 1.25rem;
      margin: 1.25rem 0 1.25rem;
    }
    .mp-header__marca { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
    .mp-header__logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--marron), var(--marron-oscuro));
      flex-shrink: 0;
    }
    .mp-header__marca-col { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .mp-header__marca-texto {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-texto-suave);
      text-transform: uppercase;
    }
    .mp-header__titulo {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--color-texto);
    }
    .mp-header__subtitulo {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-texto-suave);
      white-space: nowrap;
    }
    .mp-header__volver {
      padding: 0.5rem 0.875rem;
      border-radius: 999px;
      font-family: var(--fuente);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-texto-suave);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .mp-header__volver:hover { background: var(--color-superficie); color: var(--color-texto); text-decoration: none; }

    /* ── Banner resumen — gradiente marrón del boceto ─────────────────────── */

    .banner-mp {
      background: linear-gradient(135deg, var(--marron) 0%, var(--marron-oscuro) 100%);
      border-radius: 22px;
      padding: 1.25rem;
      color: #fff;
      box-shadow: 0 14px 34px -14px rgba(122, 67, 21, 0.6);
      margin-bottom: 0.875rem;
      min-width: 0;
    }
    .banner-mp__etiqueta {
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      font-weight: 600;
    }
    .banner-mp__numero {
      font-size: 2.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0.25rem;
    }
    .banner-mp__stats {
      display: flex;
      gap: 1.375rem;
      margin-top: 1rem;
      padding-top: 0.875rem;
      border-top: 1px solid rgba(255,255,255,0.16);
      min-width: 0;
    }
    .banner-mp__stat-etiqueta {
      font-size: 0.625rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      font-weight: 600;
    }
    .banner-mp__stat-valor { font-size: 1rem; font-weight: 700; margin-top: 0.125rem; }

    /* ── Filtros: buscador + chips de unidad ──────────────────────────────── */

    .buscador-mp { margin-bottom: 0.625rem; }
    .buscador-mp input {
      width: 100%;
      height: 44px;
      padding: 0 0.875rem;
      border: 1px solid var(--color-borde);
      border-radius: 14px;
      font-family: var(--fuente);
      font-size: 0.9375rem;
      background: var(--color-fondo);
      color: var(--color-texto);
      outline: none;
    }
    .buscador-mp input:focus { border-color: var(--marron); }

    .chips-unidad {
      display: flex;
      gap: 0.4375rem;
      overflow-x: auto;
      padding-bottom: 0.875rem;
      min-width: 0;
      -webkit-overflow-scrolling: touch;
    }
    .chip-unidad {
      background: var(--color-fondo);
      color: #55617d;
      border: 1px solid var(--color-borde);
      font-family: var(--fuente);
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 20px;
      padding: 0.5rem 0.9375rem;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip-unidad--activa {
      background: var(--marron);
      color: #fff;
      border-color: var(--marron);
      font-weight: 650;
    }

    .lista-contenido {
      display: flex;
      flex-direction: column;
      gap: 0.5625rem;
      min-width: 0;
    }

    /* ── Tarjetas de ingreso (usa .tarjeta-lista de main.css) ─────────────── */

    .ingreso__meta {
      display: flex;
      align-items: center;
      gap: 0.4375rem;
      margin-top: 0.375rem;
      min-width: 0;
    }
    .chip-tipo-doc-mp {
      display: inline-block;
      font-size: 0.65625rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 6px;
      padding: 0.1875rem 0.4375rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ingreso__fecha {
      font-size: 0.78125rem;
      color: var(--color-texto-suave);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .ingreso__derecha { text-align: right; flex-shrink: 0; }
    .ingreso__items-num { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.02em; color: var(--color-texto); }
    .ingreso__items-label { font-size: 0.6875rem; color: var(--color-texto-suave); }

    /* ── Modal detalle de ingreso (mismo bottom-sheet que el resto) ───────── */

    .modal-mp {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-mp[hidden] { display: none; }
    .modal-mp__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17,17,17,0.45);
    }
    .modal-mp__panel {
      position: relative;
      background: var(--color-fondo);
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.25rem 1.5rem;
      min-width: 0;
    }
    @media (min-width: 641px) {
      .modal-mp { align-items: center; }
      .modal-mp__panel {
        max-width: 520px;
        border-radius: 20px;
        box-shadow: var(--sombra-hover);
      }
    }
    .modal-cerrar-mp {
      position: absolute;
      top: 0.875rem;
      right: 0.875rem;
    }

    .detalle-ingreso__meta {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
      margin-top: 0.375rem;
      line-height: 1.5;
    }
    .detalle-ingreso__seccion {
      font-size: 0.71875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
      margin: 1.125rem 0 0.5rem;
    }
    .fila-item-mp {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--color-borde);
      min-width: 0;
    }
    .fila-item-mp:last-child { border-bottom: none; }
    .fila-item-mp__info { flex: 1; min-width: 0; }
    .fila-item-mp__nombre {
      font-size: 0.90625rem;
      font-weight: 650;
      color: var(--color-texto);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fila-item-mp__marca { font-size: 0.78125rem; color: var(--color-texto-suave); margin-top: 0.125rem; }
    .fila-item-mp__lote {
      display: inline-flex;
      align-items: center;
      gap: 0.4375rem;
      margin-top: 0.4375rem;
      font-size: 0.71875rem;
      color: #a3abbd;
      font-weight: 600;
    }
    .chip-lote {
      display: inline-block;
      font-size: 0.78125rem;
      font-weight: 700;
      border-radius: 6px;
      padding: 0.1875rem 0.5rem;
      background: var(--marron-suave);
      color: var(--marron-oscuro);
    }
    .chip-lote--ilegible { background: #FEF6E7; color: #8a6508; }
    .fila-item-mp__cantidad {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-texto);
      flex-shrink: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body class="pagina-modulo">

  <div class="contenedor-mp">

    <header class="mp-header">
      <a href="../dashboard.html" class="mp-header__volver" title="Volver al dashboard">‹ Volver</a>
      <div class="mp-header__marca">
        <div class="mp-header__logo"></div>
        <div class="mp-header__marca-col">
          <span class="mp-header__marca-texto">Seis Destinos</span>
          <span class="mp-header__titulo">Ingreso <span style="color:var(--marron); font-size:0.875rem; line-height:1;">●</span> <span class="mp-header__subtitulo">Insumos - Materia prima</span></span>
        </div>
      </div>
    </header>

    <!-- ── Listado de ingresos (única pantalla del módulo) ───────────────── -->
    <div id="pantalla-ingresos">

      <div class="banner-mp">
        <div class="banner-mp__etiqueta">Ingresos del mes</div>
        <div class="banner-mp__numero" id="banner-ingresos-mes">—</div>
        <div class="banner-mp__stats">
          <div>
            <div class="banner-mp__stat-etiqueta">Ítems</div>
            <div class="banner-mp__stat-valor" id="banner-items-mes">—</div>
          </div>
        </div>
      </div>

      <div class="buscador-mp">
        <input type="text" id="filtro-busqueda-ingresos" placeholder="🔍 Buscar proveedor o número de documento">
      </div>
      <div class="chips-unidad" id="chips-unidad-ingresos"></div>

      <div id="estado-cargando-ingresos" class="estado-vacio" hidden>
        <div class="spinner"></div>
        <p class="estado-vacio__descripcion">Cargando ingresos…</p>
      </div>

      <div class="lista-contenido" id="lista-ingresos"></div>

      <div id="estado-vacio-ingresos" class="estado-vacio" hidden>
        <div class="estado-vacio__icono">📦</div>
        <div class="estado-vacio__titulo">Sin ingresos</div>
        <p class="estado-vacio__descripcion">No hay ingresos de mercadería con los filtros actuales.</p>
      </div>
    </div>

  </div><!-- /contenedor-mp -->

  <!-- ── Modal — Detalle del ingreso ─────────────────────────────────────── -->
  <div class="modal-mp" id="modal-ingreso" hidden>
    <div class="modal-mp__backdrop"></div>
    <div class="modal-mp__panel">
      <button type="button" class="btn btn--icono modal-cerrar-mp" id="btn-cerrar-detalle" title="Cerrar">✕</button>
      <h2 id="detalle-titulo"></h2>
      <div class="detalle-ingreso__meta" id="detalle-meta"></div>

      <div class="detalle-ingreso__seccion">Ítems</div>

      <div id="detalle-cargando" class="estado-vacio" hidden>
        <div class="spinner"></div>
      </div>

      <div id="detalle-items"></div>

      <div id="detalle-foto" style="margin-top: 1.125rem;" hidden>
        <a id="detalle-foto-link" href="#" target="_blank" rel="noopener" class="btn btn--secundario" style="display:inline-flex; width:auto;">Ver foto del comprobante →</a>
      </div>
    </div>
  </div><!-- /modal-ingreso -->

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { formatearFecha, mostrarError } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    const TIPOS_DOC = {
      remito:          { label: 'Remito',          bg: 'var(--marron-suave)',        fg: 'var(--marron-oscuro)' },
      factura_a:       { label: 'Factura A',       bg: 'var(--color-acento-suave)',  fg: 'var(--color-acento)' },
      factura_x:       { label: 'Factura X',       bg: 'var(--violeta-suave)',       fg: 'var(--violeta-oscuro)' },
      sin_comprobante: { label: 'Sin comprobante', bg: 'rgba(168,184,216,0.18)',     fg: '#55617d' },
    }

    const estado = {
      sesion: null,
      miEmpleadoId: null,
      unidades: [],
      listaIngresos: [],        // todas las filas (sin filtrar) — los filtros se aplican al renderizar
      filtros: {
        ingresos: { busqueda: '', unidadId: '' },  // '' = Todas
      },
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════

    function inicialesEmpresa(nombre) {
      const palabras = (nombre || '').trim().split(/\s+/).filter(Boolean)
      if (!palabras.length) return '—'
      if (palabras.length === 1) return palabras[0].slice(0, 2).toUpperCase()
      return (palabras[0][0] + palabras[1][0]).toUpperCase()
    }

    // Cantidades en formato es-AR, solo para mostrar — el número canónico
    // vive como valor JS plano, nunca se re-parsea el string formateado.
    function formatearCantidad(n, unidadMedida) {
      const num = Number(n ?? 0).toLocaleString('es-AR', { maximumFractionDigits: 2 })
      return unidadMedida ? `${num} ${unidadMedida}` : num
    }

    function nombreUnidad(id) {
      return estado.unidades.find(u => u.id === id)?.nombre || ''
    }

    function chipTipoDoc(tipo) {
      const t = TIPOS_DOC[tipo] || { label: tipo || '—', bg: 'var(--color-superficie)', fg: 'var(--color-texto-suave)' }
      return `<span class="chip-tipo-doc-mp" style="background:${t.bg}; color:${t.fg};">${t.label}</span>`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return

      const { data: emp, error } = await supabase
        .from('empleados')
        .select('id')
        .eq('auth_user_id', estado.sesion.user.id)
        .maybeSingle()

      if (error || !emp) {
        mostrarError('No tenés permiso para acceder a este módulo.')
        setTimeout(() => window.location.replace('../dashboard.html'), 1500)
        return
      }
      estado.miEmpleadoId = emp.id

      // El RLS acota qué unidades ve cada usuario (hoy: la propia, salvo
      // super_admin) — que aparezcan menos unidades de las 4 es lo esperado.
      const { data: unids } = await supabase
        .from('unidades_negocio')
        .select('id, nombre')
        .eq('activo', true)
        .order('nombre')
      estado.unidades = unids ?? []

      renderizarChipsUnidadIngresos()

      await cargarIngresos()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LISTADO DE INGRESOS
    // ═══════════════════════════════════════════════════════════════════════

    function renderizarChipsUnidadIngresos() {
      const cont = document.getElementById('chips-unidad-ingresos')
      const chips = [{ id: '', nombre: 'Todas' }, ...estado.unidades]
      cont.innerHTML = chips.map(u => `
        <button type="button" class="chip-unidad ${estado.filtros.ingresos.unidadId === u.id ? 'chip-unidad--activa' : ''}" data-unidad="${u.id}">${u.nombre}</button>
      `).join('')
      cont.querySelectorAll('.chip-unidad').forEach(btn => {
        btn.addEventListener('click', () => {
          estado.filtros.ingresos.unidadId = btn.dataset.unidad
          renderizarChipsUnidadIngresos()
          renderizarListaIngresos()
        })
      })
    }

    async function cargarIngresos() {
      const cargandoEl = document.getElementById('estado-cargando-ingresos')
      cargandoEl.hidden = false

      const { data, error } = await supabase
        .from('materia_prima_ingresos')
        .select('id, fecha, tipo_doc, numero_doc, razon_social, nombre_fantasia, unidad_negocio_id, foto_url, created_at, materia_prima_items(count)')
        .order('fecha', { ascending: false })
        .order('created_at', { ascending: false })

      cargandoEl.hidden = true

      if (error) {
        console.error(error)
        mostrarError('Error al cargar los ingresos.')
        return
      }

      estado.listaIngresos = (data ?? []).map(i => ({
        ...i,
        cantidadItems: i.materia_prima_items?.[0]?.count ?? 0,
      }))

      renderizarBannerIngresos()
      renderizarListaIngresos()
    }

    function renderizarBannerIngresos() {
      // Stats del mes calendario actual, sobre la lista completa (sin filtros)
      const hoy = new Date()
      const prefijoMes = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`
      const delMes = estado.listaIngresos.filter(i => (i.fecha || '').startsWith(prefijoMes))
      document.getElementById('banner-ingresos-mes').textContent = delMes.length
      document.getElementById('banner-items-mes').textContent = delMes.reduce((acc, i) => acc + i.cantidadItems, 0)
    }

    function renderizarListaIngresos() {
      const listaEl = document.getElementById('lista-ingresos')
      const vacioEl = document.getElementById('estado-vacio-ingresos')

      let filas = estado.listaIngresos
      const { busqueda, unidadId } = estado.filtros.ingresos
      if (unidadId) filas = filas.filter(i => i.unidad_negocio_id === unidadId)
      const termino = busqueda.trim().toLowerCase()
      if (termino) {
        filas = filas.filter(i =>
          (i.razon_social || '').toLowerCase().includes(termino) ||
          (i.nombre_fantasia || '').toLowerCase().includes(termino) ||
          (i.numero_doc || '').toLowerCase().includes(termino)
        )
      }

      if (!filas.length) {
        listaEl.innerHTML = ''
        vacioEl.hidden = false
        return
      }
      vacioEl.hidden = true

      listaEl.innerHTML = filas.map(i => `
        <div class="tarjeta-lista" data-ingreso="${i.id}">
          <div class="tarjeta-lista__avatar" style="background:var(--marron-suave); color:var(--marron-oscuro);">${inicialesEmpresa(i.razon_social)}</div>
          <div class="tarjeta-lista__info">
            <div class="tarjeta-lista__titulo">${i.razon_social || '(sin proveedor)'}</div>
            <div class="ingreso__meta">
              ${chipTipoDoc(i.tipo_doc)}
              <span class="ingreso__fecha">${formatearFecha(i.fecha)} · ${nombreUnidad(i.unidad_negocio_id)}</span>
            </div>
          </div>
          <div class="ingreso__derecha">
            <div class="ingreso__items-num">${i.cantidadItems}</div>
            <div class="ingreso__items-label">${i.cantidadItems === 1 ? 'ítem' : 'ítems'}</div>
          </div>
        </div>
      `).join('')

      listaEl.querySelectorAll('.tarjeta-lista').forEach(card => {
        card.addEventListener('click', () => abrirDetalleIngreso(card.dataset.ingreso))
      })
    }

    document.getElementById('filtro-busqueda-ingresos').addEventListener('input', (e) => {
      estado.filtros.ingresos.busqueda = e.target.value
      renderizarListaIngresos()
    })

    // ── Detalle del ingreso (modal) ─────────────────────────────────────────

    async function abrirDetalleIngreso(ingresoId) {
      const ingreso = estado.listaIngresos.find(i => i.id === ingresoId)
      if (!ingreso) return

      const tipoDoc = TIPOS_DOC[ingreso.tipo_doc]?.label || ingreso.tipo_doc || '—'
      document.getElementById('detalle-titulo').textContent = ingreso.razon_social || '(sin proveedor)'
      document.getElementById('detalle-meta').innerHTML = [
        `${chipTipoDoc(ingreso.tipo_doc)}${ingreso.numero_doc ? ` ${ingreso.numero_doc}` : ''}`,
        `${formatearFecha(ingreso.fecha)} · ${nombreUnidad(ingreso.unidad_negocio_id)}`,
        ingreso.nombre_fantasia ? `Fantasía: ${ingreso.nombre_fantasia}` : '',
      ].filter(Boolean).join('<br>')

      const fotoEl = document.getElementById('detalle-foto')
      if (ingreso.foto_url) {
        document.getElementById('detalle-foto-link').href = ingreso.foto_url
        fotoEl.hidden = false
      } else {
        fotoEl.hidden = true
      }

      document.getElementById('detalle-items').innerHTML = ''
      document.getElementById('detalle-cargando').hidden = false
      document.getElementById('modal-ingreso').hidden = false

      const { data: items, error } = await supabase
        .from('materia_prima_items')
        .select('id, cantidad, lote, lote_ilegible, cantidad_bultos, contenido_por_bulto, insumos(nombre, marca, unidad_medida, tipo)')
        .eq('ingreso_id', ingresoId)
        .order('created_at')

      document.getElementById('detalle-cargando').hidden = true

      if (error) {
        console.error(error)
        mostrarError('Error al cargar los ítems del ingreso.')
        return
      }

      document.getElementById('detalle-items').innerHTML = (items ?? []).map(item => {
        const insumo = item.insumos || {}
        // El lote solo aplica a materia prima; los insumos no lo llevan
        let loteHtml = ''
        if (insumo.tipo === 'materia_prima') {
          const chip = item.lote_ilegible
            ? '<span class="chip-lote chip-lote--ilegible">Ilegible</span>'
            : item.lote
              ? `<span class="chip-lote">${item.lote}</span>`
              : '<span class="chip-lote chip-lote--ilegible">Sin lote</span>'
          loteHtml = `<div class="fila-item-mp__lote"><span>Lote</span>${chip}</div>`
        }
        // Desglose "N bultos de M kg" cuando el ítem lo trae
        const desglose = (item.cantidad_bultos != null && item.contenido_por_bulto != null)
          ? `<div class="fila-item-mp__marca">${Number(item.cantidad_bultos).toLocaleString('es-AR')} bultos de ${formatearCantidad(item.contenido_por_bulto, insumo.unidad_medida)}</div>`
          : ''
        return `
          <div class="fila-item-mp">
            <div class="fila-item-mp__info">
              <div class="fila-item-mp__nombre">${insumo.nombre || '(producto)'}</div>
              ${insumo.marca ? `<div class="fila-item-mp__marca">${insumo.marca}</div>` : ''}
              ${desglose}
              ${loteHtml}
            </div>
            <div class="fila-item-mp__cantidad">${formatearCantidad(item.cantidad, insumo.unidad_medida)}</div>
          </div>
        `
      }).join('') || '<p class="texto-suave texto-pequeno">Este ingreso no tiene ítems.</p>'
    }

    function cerrarDetalleIngreso() {
      document.getElementById('modal-ingreso').hidden = true
    }
    document.getElementById('btn-cerrar-detalle').addEventListener('click', cerrarDetalleIngreso)
    document.querySelector('#modal-ingreso .modal-mp__backdrop').addEventListener('click', cerrarDetalleIngreso)

    init()
  </script>

</body>
</html>
