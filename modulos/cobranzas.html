          return `<div class="cob-aviso cob-aviso--ambar">Foto ${i + 1}: ${escCob(foto.error)}</div>`
        }
        if (!foto.subida) {
          return `<div class="cob-aviso cob-aviso--ambar">Foto ${i + 1}: guardada en el celular. Se va a leer cuando vuelva la señal.</div>`
        }
        if (!foto.leida) {
          return `<div class="cob-aviso">Foto ${i + 1}: leyendo los cheques…</div>`
        }
        if (chequesDeLaFoto === 0) {
          // Una foto sin cheques no suma nada y al guardar se descarta: hay que
          // decirlo ANTES, no después.
          return `<div class="cob-aviso cob-aviso--ambar">Foto ${i + 1}: no quedó ningún cheque. Agregalo a mano o la foto se descarta al guardar.</div>`
        }
        return ''
      }).filter(Boolean).join('')

      cont.innerHTML = `
        <div class="cob-fotos" style="margin:.75rem 0">
          ${f.fotos.map((foto, i) => `
            <div class="cob-foto">
              <img data-foto-form="${escCob(foto.id)}" alt="Foto ${i + 1}">
              <div class="cob-foto__pie">Foto ${i + 1}</div>
            </div>`).join('')}
        </div>${avisos}`

      document.querySelectorAll('[data-foto-form]').forEach(async (img) => {
        const foto = f.fotos.find(x => x.id === img.dataset.fotoForm)
        const url = await urlDeFoto(foto)
        if (url) img.src = url
        img.addEventListener('click', () => abrirVisor(foto, 'Foto de los cheques'))
      })
    }

    function pintarCheques() {
      const f = estado.form
      const cont = document.getElementById('cob-lista-cheques')
      cont.innerHTML = f.cheques.map(ch => htmlTarjetaCheque(ch, f)).join('')
      conectarTarjetasCheque()
    }

    // LA TARJETA DE REVISIÓN — el corazón del módulo.
    //
    // El OCR VA A FALLAR con letra manuscrita: el importe, las fechas y las
    // letras son justo lo escrito a mano. La pantalla no está hecha para que se
    // confirme rápido, está hecha para que CORREGIR sea cómodo: lo manuscrito
    // va siempre abierto y a la vista, y lo impreso —que el dígito verificador
    // ya validó— se pliega.
    function htmlTarjetaCheque(ch, f) {
      const foto = f.fotos.find(x => x.id === ch.foto_id)
      const indiceFoto = f.fotos.findIndex(x => x.id === ch.foto_id) + 1
      const errores = ch.confirmado ? [] : erroresDeCheque(chequeParaBase(ch))
      const importeNum = parseImporteCobranza(ch.importe)

      if (ch.confirmado && !ch.abierto) {
        // Plegado: el resumen alcanza para reconocerlo sin volver a leerlo todo.
        return `
          <div class="cob-cheque cob-cheque--confirmado" data-cheque="${escCob(ch.id)}">
            <div class="cob-cheque__cabecera">
              <img class="cob-cheque__mini" data-mini="${escCob(ch.id)}" alt="Foto ${indiceFoto}">
              <div class="cob-cheque__resumen">
                <div class="cob-cheque__titulo">${escCob(nombreBanco(ch.banco_codigo))}</div>
                <div class="cob-cheque__sub">N&deg; ${escCob(ch.numero ?? '—')} · ${escCob(ch.tipo === 'diferido' ? 'Diferido' : 'Común')}${
                  ch.tipo === 'diferido' && ch.fecha_pago ? ` · paga ${escCob(formatearFechaCob(ch.fecha_pago))}` : ''}</div>
              </div>
              <span class="cob-cheque__importe">${escCob(formatearImporte(importeNum))}</span>
            </div>
            <div class="cob-acciones">
              <button type="button" class="cob-btn cob-btn--chico" data-editar-cheque="${escCob(ch.id)}">Editar</button>
              <button type="button" class="cob-btn cob-btn--chico cob-btn--alerta" data-quitar-cheque="${escCob(ch.id)}">Quitar</button>
            </div>
          </div>`
      }

      const c = ch.controles ?? {}
      const e1 = estadoRenglon(ch.r1, 11), e2 = estadoRenglon(ch.r2, 9), e3 = estadoRenglon(ch.r3, 12)
      const claseRenglon = (est) => est === 'ok' ? 'cob-renglon--ok' : est === 'mal' ? 'cob-renglon--mal' : ''
      const pieRenglon = (est) => est === 'ok'
        ? '<div class="cob-campo__ok">✓ Coincide con el dígito verificador</div>'
        : est === 'mal'
          ? '<div class="cob-campo__error">No coincide con el dígito verificador, revisá contra el papel.</div>'
          : ''

      // Si el recuadro se completó desde la CMC-7, el DV se CALCULÓ: deja de
      // ser un control y la persona tiene que mirar el papel.
      const avisoCmc7 = c.completado_desde_cmc7
        ? '<div class="cob-aviso cob-aviso--ambar">Estos números se completaron desde la banda magnética. Verificá estos números contra el papel.</div>'
        : ''
      const avisoCmc7Distinta = c.cmc7_coincide === false
        ? '<div class="cob-aviso cob-aviso--alerta">La banda magnética de abajo no coincide con el recuadro de arriba. Revisá los tres renglones.</div>'
        : ''
      const avisoLetras = c.letras_coinciden === false && ch.ocr_propuesto
        ? `<div class="cob-aviso cob-aviso--ambar">En letras dice ${escCob(formatearImporte(ch.ocr_propuesto.importe_letras_valor))}, en números ${escCob(formatearImporte(ch.ocr_propuesto.importe))}.</div>`
        : ''
      const avisoFechas = c.fechas_ok === false
        ? '<div class="cob-aviso cob-aviso--alerta">Las fechas leídas no cierran. Miralas contra el papel.</div>'
        : ''
      const avisoCuit = c.cuits_ok === false
        ? '<div class="cob-aviso cob-aviso--ambar">Algún CUIT de los titulares no es válido. Está impreso en el cheque: copialo de ahí.</div>'
        : ''
      // Los dólares no se pueden cargar acá: la cobranza es en pesos y la
      // columna moneda de la base es 'ARS'.
      const dolares = c.moneda_ok === false
      const avisoMoneda = dolares
        ? '<div class="cob-aviso cob-aviso--alerta">Cheque en dólares: no se puede cargar en este módulo.</div>'
        : ''
      const avisoNotas = ch.ocr_propuesto?.notas
        ? `<div class="cob-aviso">El lector anotó: ${escCob(ch.ocr_propuesto.notas)}</div>` : ''
      const avisoDuplicado = ch.duplicado
        ? `<div class="cob-aviso ${ch.duplicado.nivel === 'completo' ? 'cob-aviso--alerta' : 'cob-aviso--ambar'}">${escCob(ch.duplicado.texto)}</div>`
        : ''

      return `
        <div class="cob-cheque ${errores.length ? 'cob-cheque--error' : ''}" data-cheque="${escCob(ch.id)}">
          <div class="cob-cheque__cabecera">
            <img class="cob-cheque__mini" data-mini="${escCob(ch.id)}" alt="Foto ${indiceFoto}">
            <div class="cob-cheque__resumen">
              <div class="cob-cheque__titulo">${escCob(nombreBanco(ch.banco_codigo))}</div>
              <div class="cob-cheque__sub">Foto ${indiceFoto}${foto ? '' : ' · sin foto'}</div>
            </div>
          </div>

          ${avisoMoneda}${avisoCmc7}${avisoCmc7Distinta}${avisoDuplicado}

          <div class="cob-cheque__cuerpo">
            <div class="cob-renglon ${claseRenglon(e1)}">
              <label>Renglón 1 (banco-sucursal-CP y dígito)</label>
              <input type="text" inputmode="numeric" data-r1="${escCob(ch.id)}" value="${escCob(ch.r1)}" placeholder="285-386-3218 6">
              <div class="cob-campo__ayuda">${escCob(nombreBanco(ch.banco_codigo))}</div>
              ${pieRenglon(e1)}
            </div>
            <div class="cob-renglon ${claseRenglon(e2)}">
              <label>Renglón 2 (número y dígito)</label>
              <input type="text" inputmode="numeric" data-r2="${escCob(ch.id)}" value="${escCob(ch.r2)}" placeholder="66259862 8">
              ${pieRenglon(e2)}
            </div>
            <div class="cob-renglon ${claseRenglon(e3)}">
              <label>Renglón 3 (cuenta y dígito)</label>
              <input type="text" inputmode="numeric" data-r3="${escCob(ch.id)}" value="${escCob(ch.r3)}" placeholder="09420314667 0">
              ${pieRenglon(e3)}
            </div>

            <div class="cob-campo">
              <label>Tipo de cheque</label>
              <div class="cob-chips">
                <button type="button" class="cob-chip ${ch.tipo === 'comun' ? 'cob-chip--activo' : ''}" data-tipo="comun" data-cheque-tipo="${escCob(ch.id)}">Común</button>
                <button type="button" class="cob-chip ${ch.tipo === 'diferido' ? 'cob-chip--activo' : ''}" data-tipo="diferido" data-cheque-tipo="${escCob(ch.id)}">Diferido</button>
              </div>
            </div>

            <div class="cob-campo">
              <label>Fecha de emisión</label>
              <input type="date" data-emision="${escCob(ch.id)}" value="${escCob(ch.fecha_emision)}">
            </div>
            <!-- Un cheque común no tiene fecha de pago: el campo no se
                 esconde "por si acaso", se saca y el dato va en null. -->
            <div class="cob-campo" ${ch.tipo === 'diferido' ? '' : 'hidden'}>
              <label>Fecha de pago</label>
              <input type="date" data-pago="${escCob(ch.id)}" value="${escCob(ch.fecha_pago)}">
            </div>

            <div class="cob-campo">
              <label>Importe</label>
              <input type="text" inputmode="decimal" data-importe="${escCob(ch.id)}" value="${escCob(ch.importe)}" placeholder="0,00">
              <div class="cob-campo__ayuda">${escCob(importeNum === null ? 'Escribilo como en el cheque: 427.256,86' : formatearImporte(importeNum))}</div>
            </div>
            <div class="cob-campo">
              <label>Importe en letras (opcional)</label>
              <input type="text" data-letras="${escCob(ch.id)}" value="${escCob(ch.importe_letras)}" maxlength="300">
            </div>
            ${avisoLetras}${avisoFechas}${avisoNotas}

            <div class="cob-campo">
              <label>Páguese a (opcional)</label>
              <input type="text" data-beneficiario="${escCob(ch.id)}" value="${escCob(ch.beneficiario)}" maxlength="200">
            </div>

            <button type="button" class="cob-plegado" data-plegar-tit="${escCob(ch.id)}">
              <span>Titulares de la cuenta (${ch.titulares.length})</span><span>▾</span>
            </button>
            <div hidden data-tit-caja="${escCob(ch.id)}">
              ${ch.titulares.map((t, i) => `
                <div class="cob-titular">
                  <input type="text" placeholder="Nombre" data-tit-nombre="${escCob(ch.id)}" data-i="${i}" value="${escCob(t.nombre ?? '')}" maxlength="200">
                  <input type="text" inputmode="numeric" placeholder="CUIT" data-tit-cuit="${escCob(ch.id)}" data-i="${i}" value="${escCob(t.cuit ?? '')}" maxlength="13">
                </div>`).join('')}
              ${avisoCuit}
              <button type="button" class="cob-btn cob-btn--chico" data-tit-agregar="${escCob(ch.id)}">+ Agregar titular</button>
            </div>

            ${errores.length ? `<div class="cob-aviso cob-aviso--alerta">${errores.map(escCob).join('<br>')}</div>` : ''}

            <div class="cob-acciones">
              <button type="button" class="cob-btn cob-btn--primario" data-confirmar-cheque="${escCob(ch.id)}"
                ${errores.length || dolares || ch.duplicado?.nivel === 'completo' ? 'disabled' : ''}>Confirmar cheque</button>
              <button type="button" class="cob-btn cob-btn--alerta" data-quitar-cheque="${escCob(ch.id)}">Quitar</button>
            </div>
          </div>
        </div>`
    }

    // La fila tal cual va a viajar a la base. Se valida sobre ESTO y no campo
    // por campo: es lo único que el servidor va a ver.
    function chequeParaBase(ch) {
      return {
        id: ch.id,
        foto_id: ch.foto_id,
        banco_codigo: ch.banco_codigo, sucursal_codigo: ch.sucursal_codigo,
        codigo_postal: ch.codigo_postal, dv_ruta: ch.dv_ruta,
        numero: ch.numero, dv_numero: ch.dv_numero,
        cuenta: ch.cuenta, dv_cuenta: ch.dv_cuenta,
        tipo: ch.tipo,
        fecha_emision: esFechaIso(ch.fecha_emision) ? ch.fecha_emision : null,
        fecha_pago: ch.tipo === 'comun' ? null : (esFechaIso(ch.fecha_pago) ? ch.fecha_pago : null),
        importe: parseImporteCobranza(ch.importe),
        importe_letras: textoOpcional(ch.importe_letras),
        titulares: (ch.titulares ?? [])
          .map(t => ({ nombre: textoOpcional(t.nombre), cuit: (String(t.cuit ?? '').replace(/\D/g, '') || null) }))
          .filter(t => t.nombre !== null || t.cuit !== null),
        beneficiario: textoOpcional(ch.beneficiario),
        origen_datos: origenDatosDe(ch),
        ocr_propuesto: ch.ocr_propuesto ?? null,
      }
    }

    // Un texto opcional vacío va como NULL y nunca como '': la base distingue
    // "no hay dato" de "hay un dato que es la cadena vacía".
    function textoOpcional(v) {
      const t = String(v ?? '').trim()
      return t === '' ? null : t
    }

    // 'manual' si nunca hubo propuesta; 'ocr' si lo confirmado es idéntico a lo
    // propuesto; 'ocr_corregido' si se tocó algo. Sirve para saber después qué
    // tan bien lee el OCR sin preguntárselo a nadie.
    function origenDatosDe(ch) {
      const p = ch.ocr_propuesto
      if (!p) return 'manual'
      const igual =
        (p.banco_codigo ?? null) === ch.banco_codigo &&
        (p.sucursal_codigo ?? null) === ch.sucursal_codigo &&
        (p.codigo_postal ?? null) === ch.codigo_postal &&
        (p.numero ?? null) === ch.numero &&
        (p.cuenta ?? null) === ch.cuenta &&
        (p.tipo ?? null) === ch.tipo &&
        (p.fecha_emision ?? null) === (esFechaIso(ch.fecha_emision) ? ch.fecha_emision : null) &&
        (p.fecha_pago ?? null) === (ch.tipo === 'comun' ? null : (esFechaIso(ch.fecha_pago) ? ch.fecha_pago : null)) &&
        Number(p.importe ?? NaN) === Number(parseImporteCobranza(ch.importe) ?? NaN) &&
        (p.beneficiario ?? null) === textoOpcional(ch.beneficiario)
      return igual ? 'ocr' : 'ocr_corregido'
    }

    // ── Duplicados ────────────────────────────────────────────────────────
    // Se consulta cuando los tres renglones cierran: antes no hay con qué
    // preguntar. Va en su propio try/catch — sin señal no se puede chequear y
    // eso NO puede trabar la carga.
    async function chequearDuplicado(ch) {
      if (!navigator.onLine) return
      const b = chequeParaBase(ch)
      if (!b.banco_codigo || !b.numero || !b.sucursal_codigo || !b.cuenta) return
      try {
        const { data, error } = await supabase.rpc('buscar_cheque_cargado', {
          p_banco_codigo: b.banco_codigo,
          p_numero: b.numero,
          p_sucursal_codigo: b.sucursal_codigo,
          p_cuenta: b.cuenta,
          p_excluir_cobranza_id: estado.form?.id ?? null,
        })
        if (error) throw error
        const filas = data ?? []
        const completo = filas.find(x => x.coincide_completo)
        if (completo) {
          ch.duplicado = {
            nivel: 'completo',
            texto: `Este cheque ya está cargado: ${formatearFechaCob(completo.fecha)}, por ${completo.cargada_por ?? 'alguien'}, por ${formatearImporte(completo.importe)}.`,
          }
        } else if (filas.length) {
          ch.duplicado = {
            nivel: 'parcial',
            texto: 'Hay otro cheque con el mismo banco y número, de otra cuenta. Verificá que hayas copiado bien los tres renglones.',
          }
        } else {
          ch.duplicado = null
        }
        pintarCheques()
      } catch (err) {
        console.error('No se pudo chequear si el cheque ya estaba cargado:', err)
      }
    }


    function conectarTarjetasCheque() {
      const f = estado.form
      if (!f) return
      const buscar = (id) => f.cheques.find(c => c.id === id)

      // Las miniaturas se firman después de dibujar: esperar la URL antes de
      // pintar dejaría la tarjeta en blanco mientras tanto.
      document.querySelectorAll('[data-mini]').forEach(async (img) => {
        const ch = buscar(img.dataset.mini)
        const foto = f.fotos.find(x => x.id === ch?.foto_id)
        const url = await urlDeFoto(foto)
        if (url) img.src = url
        img.addEventListener('click', () => abrirVisor(foto, 'Foto de los cheques'))
      })

      // Los tres renglones: se recalcula en vivo para que el ✓ o el rojo
      // aparezcan mientras se tipea, no al salir del campo.
      const conectarRenglon = (attr, prop) => {
        document.querySelectorAll(`[data-${attr}]`).forEach(inp => {
          inp.addEventListener('input', () => {
            const ch = buscar(inp.dataset[attr])
            if (!ch) return
            ch[prop] = inp.value
            aplicarRenglones(ch)
            // Al cambiar el código el duplicado anterior ya no aplica.
            ch.duplicado = null
            guardarBorrador()
            pintarCheques()
            enfocar(`[data-${attr}="${ch.id}"]`)
            if (estadoRenglon(ch.r1, 11) === 'ok' && estadoRenglon(ch.r2, 9) === 'ok' && estadoRenglon(ch.r3, 12) === 'ok') {
              chequearDuplicado(ch)
            }
          })
        })
      }
      conectarRenglon('r1', 'r1')
      conectarRenglon('r2', 'r2')
      conectarRenglon('r3', 'r3')

      // Los campos de texto NO re-renderizan en cada tecla: un render por tecla
      // le saca el foco al input, que es un bug que este proyecto ya tuvo.
      const conectarTexto = (attr, prop) => {
        document.querySelectorAll(`[data-${attr}]`).forEach(inp => {
          inp.addEventListener('input', () => {
            const ch = buscar(inp.dataset[attr])
            if (!ch) return
            ch[prop] = inp.value
            guardarBorrador()
          })
          inp.addEventListener('change', () => { pintarCheques(); pintarTotalYGuardado() })
        })
      }
      conectarTexto('importe', 'importe')
      conectarTexto('letras', 'importe_letras')
      conectarTexto('beneficiario', 'beneficiario')
      conectarTexto('emision', 'fecha_emision')
      conectarTexto('pago', 'fecha_pago')

      document.querySelectorAll('[data-cheque-tipo]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ch = buscar(btn.dataset.chequeTipo)
          if (!ch) return
          ch.tipo = btn.dataset.tipo
          // Pasar a común BORRA la fecha de pago: dejarla escondida la mandaría
          // igual al guardar y el servidor la rechaza.
          if (ch.tipo === 'comun') ch.fecha_pago = ''
          guardarBorrador()
          pintarCheques()
        })
      })

      document.querySelectorAll('[data-plegar-tit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const caja = document.querySelector(`[data-tit-caja="${btn.dataset.plegarTit}"]`)
          if (caja) caja.hidden = !caja.hidden
        })
      })

      document.querySelectorAll('[data-tit-nombre]').forEach(inp => {
        inp.addEventListener('input', () => {
          const ch = buscar(inp.dataset.titNombre)
          if (ch) { ch.titulares[Number(inp.dataset.i)].nombre = inp.value; guardarBorrador() }
        })
      })
      document.querySelectorAll('[data-tit-cuit]').forEach(inp => {
        inp.addEventListener('input', () => {
          const ch = buscar(inp.dataset.titCuit)
          if (ch) { ch.titulares[Number(inp.dataset.i)].cuit = inp.value; guardarBorrador() }
        })
      })
      document.querySelectorAll('[data-tit-agregar]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ch = buscar(btn.dataset.titAgregar)
          if (!ch) return
          ch.titulares.push({ nombre: '', cuit: '' })
          guardarBorrador(); pintarCheques()
        })
      })

      document.querySelectorAll('[data-confirmar-cheque]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ch = buscar(btn.dataset.confirmarCheque)
          if (!ch) return
          // Se revalida con las MISMAS reglas que la base: el disabled del
          // botón es comodidad, no la validación.
          const errores = erroresDeCheque(chequeParaBase(ch))
          if (errores.length) { pintarCheques(); return }
          ch.confirmado = true
          ch.abierto = false
          guardarBorrador(); pintarCheques(); pintarTotalYGuardado()
        })
      })

      document.querySelectorAll('[data-editar-cheque]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ch = buscar(btn.dataset.editarCheque)
          if (!ch) return
          ch.confirmado = false; ch.abierto = true
          guardarBorrador(); pintarCheques(); pintarTotalYGuardado()
        })
      })

      document.querySelectorAll('[data-quitar-cheque]').forEach(btn => {
        btn.addEventListener('click', () => {
          const f2 = estado.form
          f2.cheques = f2.cheques.filter(c => c.id !== btn.dataset.quitarCheque)
          guardarBorrador(); pintarCheques(); pintarTotalYGuardado(); pintarEstadoFotos()
        })
      })
    }

    // Devolver el foco y el cursor al final después de un re-render: sin esto,
    // corregir un renglón obliga a volver a tocar el campo en cada dígito.
    function enfocar(selector) {
      const el = document.querySelector(selector)
      if (!el) return
      el.focus()
      try { el.setSelectionRange(el.value.length, el.value.length) } catch { /* los date no lo soportan */ }
    }

    // ── Total y habilitación del botón ────────────────────────────────────

    function totalDelFormulario() {
      const f = estado.form
      if (!f) return 0
      const cheques = f.cheques
        .filter(c => c.confirmado)
        .reduce((acc, c) => acc + (parseImporteCobranza(c.importe) ?? 0), 0)
      return cheques + efectivoDelFormulario()
    }

    // EL ÚNICO lugar donde el campo vacío de efectivo se convierte en 0. Vacío
    // significa "no hubo efectivo" y la base espera un número, no un null; si
    // esta conversión estuviera repetida, un día una de las copias mandaría
    // null y el insert fallaría con un mensaje que no habla de efectivo.
    function efectivoDelFormulario() {
      const t = String(estado.form?.efectivo ?? '').trim()
      if (t === '') return 0
      return parseImporteCobranza(t) ?? 0
    }

    function motivosParaNoGuardar() {
      const f = estado.form
      const motivos = []
      if (!f) return ['No hay nada que guardar.']
      if (!String(f.cliente ?? '').trim()) motivos.push('Falta el cliente.')
      if (!esFechaIso(f.fecha)) motivos.push('Falta la fecha.')
      else if (diasEntre(hoyArgentina(), f.fecha) > 0) motivos.push('La fecha no puede ser posterior a hoy.')

      const sinConfirmar = f.cheques.filter(c => !c.confirmado).length
      if (sinConfirmar) motivos.push(`Quedan ${sinConfirmar} ${sinConfirmar === 1 ? 'cheque' : 'cheques'} sin confirmar.`)

      const confirmados = f.cheques.filter(c => c.confirmado).length
      if (confirmados === 0 && efectivoDelFormulario() <= 0) {
        motivos.push('Cargá al menos un cheque o un importe en efectivo.')
      }
      const efectivoCrudo = String(f.efectivo ?? '').trim()
      if (efectivoCrudo !== '' && parseImporteCobranza(efectivoCrudo) === null) {
        motivos.push('El efectivo no se entiende. Escribilo así: 12.500,50')
      }
      return motivos
    }

    function pintarTotalYGuardado() {
      const motivos = motivosParaNoGuardar()
      document.getElementById('cob-total').textContent = formatearImporte(totalDelFormulario())
      // El disabled se aplica DESDE JS y no como atributo del HTML: si el
      // script fallara, el botón queda usable en vez de dejar el formulario
      // inutilizable.
      document.getElementById('cob-btn-guardar').disabled = motivos.length > 0

      const caja = document.getElementById('cob-form-pendientes')
      const f = estado.form
      const fotosSinCheques = f ? f.fotos.filter(x => !f.cheques.some(c => c.foto_id === x.id)).length : 0
      const extra = fotosSinCheques
        ? [`${fotosSinCheques} ${fotosSinCheques === 1 ? 'foto quedó' : 'fotos quedaron'} sin cheques y se ${fotosSinCheques === 1 ? 'descarta' : 'descartan'} al guardar.`]
        : []
      const todo = motivos.concat(extra)
      caja.hidden = todo.length === 0
      if (todo.length) caja.innerHTML = todo.map(escCob).join('<br>')
      caja.className = motivos.length ? 'cob-aviso cob-aviso--ambar' : 'cob-aviso'
    }

    // ── Guardado ──────────────────────────────────────────────────────────

    async function guardarCobranza() {
      const f = estado.form
      if (!f) return
      const motivos = motivosParaNoGuardar()
      if (motivos.length) { pintarTotalYGuardado(); return }

      const btn = document.getElementById('cob-btn-guardar')
      const err = document.getElementById('cob-error-guardar')
      btn.disabled = true
      err.hidden = true

      // La persona la dio por terminada: aunque falle la red, el celular ya
      // sabe que esto tiene que subir.
      f.estadoLocal = 'lista_para_subir'
      await guardarBorrador()

      const resultado = await subirCobranza(f)
      btn.disabled = false

      if (resultado.ok) {
        await dbBorrar(STORE_BORRADORES, f.id)
        estado.form = null
        mostrarExito(resultado.yaExistia ? 'La cobranza ya estaba guardada.' : 'Cobranza guardada.')
        mostrarVistaCob('listado')
        await Promise.all([cargarCobranzas({ reiniciar: true }), refrescarLocales()])
        return
      }

      if (resultado.tipo === 'red') {
        // Sin señal no se pierde nada: queda en el celular y el sincronizador
        // la reintenta. El alta es idempotente, así que reintentar es seguro.
        mostrarExito('Se guardó en el celular. Se va a subir sola cuando haya señal.')
        estado.form = null
        mostrarVistaCob('listado')
        await refrescarLocales()
        return
      }

      // Una validación del servidor viene redactada en español: se muestra tal
      // cual y la cobranza queda abierta para corregirla.
      err.hidden = false
      err.textContent = resultado.mensaje
      f.estadoLocal = 'borrador'
      await guardarBorrador()
    }

    // Sube las fotos que falten y llama a la RPC. La usan el botón Guardar y el
    // sincronizador, así que devuelve un resultado en vez de tocar la pantalla.
    async function subirCobranza(f) {
      for (const foto of f.fotos) {
        if (foto.subida) continue
        if (!foto.blob) {
          return { ok: false, tipo: 'validacion', mensaje: 'Una foto se perdió del celular. Sacala de nuevo.' }
        }
        try {
          const { error } = await supabase.storage.from('cobranzas')
            .upload(foto.storage_path, foto.blob, { contentType: 'image/jpeg', upsert: false })
          if (error) {
            // Ya existía = un intento anterior sí la subió.
            if (!/exist/i.test(error.message ?? '')) throw error
          }
          foto.subida = true
          await guardarBorrador()
        } catch (errSubida) {
          console.error('No se pudo subir una foto al guardar:', errSubida)
          return { ok: false, tipo: 'red', mensaje: 'No se pudieron subir las fotos.' }
        }
      }

      // Las fotos sin ningún cheque no se mandan: no aportan nada y el
      // servidor exige que cada foto exista en Storage.
      const fotosConCheques = f.fotos.filter(x => f.cheques.some(c => c.confirmado && c.foto_id === x.id))
      const payload = {
        p_id: f.id,
        p_cliente: String(f.cliente).trim(),
        p_fecha: f.fecha,
        p_efectivo: efectivoDelFormulario(),
        p_comprobante_referencia: textoOpcional(f.comprobante_referencia),
        p_observaciones: textoOpcional(f.observaciones),
        p_fotos: fotosConCheques.map(x => ({
          id: x.id, storage_path: x.storage_path,
          ocr_crudo: x.ocr_crudo ?? null, ocr_modelo: x.ocr_modelo ?? null,
        })),
        p_cheques: f.cheques.filter(c => c.confirmado).map(chequeParaBase),
      }

      try {
        const rpc = f.modo === 'edicion' ? 'editar_cobranza' : 'guardar_cobranza'
        const { data, error } = await supabase.rpc(rpc, payload)
        if (error) {
          // Distinguir "no hubo red" de "el servidor dijo que no" es lo que
          // decide si la cobranza espera o si hay que corregirla: tratarlas
          // igual haría que un error de validación se reintentara para siempre.
          if (esErrorDeRed(error)) return { ok: false, tipo: 'red', mensaje: error.message ?? '' }
          return { ok: false, tipo: 'validacion', mensaje: error.message || 'El servidor rechazó la cobranza.' }
        }
        return { ok: true, yaExistia: !!data?.ya_existia }
      } catch (errRpc) {
        console.error('Falló la RPC de guardado:', errRpc)
        return { ok: false, tipo: 'red', mensaje: 'No se pudo contactar al servidor.' }
      }
    }

    function esErrorDeRed(error) {
      const m = String(error?.message ?? '').toLowerCase()
      return !navigator.onLine || m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed')
    }


    // ═══════════════════════════════════════════════════════════════════════
    // SINCRONIZADOR
    //
    // Corre al cargar la página, en el evento 'online' y cada 60 s si hay
    // conexión. Hace tres cosas, cada una con su propio guard: sube las fotos
    // que faltan, lee con el OCR las que todavía no se leyeron, y reintenta las
    // cobranzas que la persona ya dio por terminadas.
    // ═══════════════════════════════════════════════════════════════════════

    const MS_SINCRONIZADOR = 60000

    async function refrescarLocales() {
      try {
        estado.locales = await dbTodos(STORE_BORRADORES)
      } catch (err) {
        console.error('No se pudieron leer los borradores locales:', err)
        estado.locales = []
      }
      pintarBannerLocal()
    }

    function pintarBannerLocal() {
      const banner = document.getElementById('cob-banner-local')
      const pendientes = estado.locales.filter(f => f.id !== estado.form?.id)
      // Un banner que se dibuja cuando no hay nada que avisar entrena a
      // ignorarlo: sin pendientes, no se dibuja.
      if (!pendientes.length) { banner.hidden = true; banner.innerHTML = ''; return }

      const paraSubir = pendientes.filter(f => f.estadoLocal === 'lista_para_subir').length
      const paraRevisar = pendientes.filter(f => f.estadoLocal === 'para_revisar').length
      const borradores = pendientes.filter(f => f.estadoLocal === 'borrador').length

      const partes = []
      if (paraSubir) partes.push(`${paraSubir} esperando señal para subir`)
      if (paraRevisar) partes.push(`${paraRevisar} con cheques leídos para revisar`)
      if (borradores) partes.push(`${borradores} a medio cargar`)

      banner.hidden = false
      banner.innerHTML = `
        <strong>Hay cobranzas solo en este celular.</strong><br>${escCob(partes.join(' · '))}
        <div class="cob-aviso__acciones">
          ${pendientes.map(f => `
            <button type="button" class="cob-btn cob-btn--chico" data-abrir-local="${escCob(f.id)}">
              ${escCob(f.cliente || 'Sin cliente')} · ${escCob(formatearFechaCob(f.fecha))}
            </button>
            <button type="button" class="cob-btn cob-btn--chico cob-btn--alerta" data-descartar-local="${escCob(f.id)}">Descartar</button>
          `).join('')}
        </div>`

      banner.querySelectorAll('[data-abrir-local]').forEach(b => {
        b.addEventListener('click', () => abrirFormularioLocal(b.dataset.abrirLocal))
      })
      banner.querySelectorAll('[data-descartar-local]').forEach(b => {
        b.addEventListener('click', async () => {
          // Descartar borra fotos que pueden no estar en ningún otro lado: se
          // confirma, no se hace de una.
          if (!window.confirm('¿Descartar esta cobranza guardada en el celular? No se puede recuperar.')) return
          await dbBorrar(STORE_BORRADORES, b.dataset.descartarLocal)
          await refrescarLocales()
        })
      })
    }

    async function sincronizar() {
      if (estado.sincronizando || !navigator.onLine || !estado.sesion) return
      estado.sincronizando = true
      try {
        const borradores = await dbTodos(STORE_BORRADORES)
        for (const f of borradores) {
          // El que está abierto en pantalla lo maneja la pantalla: tocarlo
          // desde acá pisaría lo que la persona está tipeando.
          if (f.id === estado.form?.id) continue

          if (f.estadoLocal === 'lista_para_subir') {
            const r = await subirCobranza(f)
            if (r.ok) {
              await dbBorrar(STORE_BORRADORES, f.id)
              mostrarExito(`Se subió la cobranza de ${f.cliente || 'un cliente'}.`)
              await cargarCobranzas({ reiniciar: true })
            } else if (r.tipo === 'validacion') {
              // El servidor la rechazó: reintentarla para siempre no la va a
              // arreglar. Vuelve a 'borrador' para que alguien la corrija.
              f.estadoLocal = 'borrador'
              await dbGuardar(STORE_BORRADORES, f.id, f)
              mostrarError(`La cobranza de ${f.cliente || 'un cliente'} no se pudo subir: ${r.mensaje}`)
            }
            continue
          }

          // Fotos que quedaron sin subir o sin leer: se completan solas y la
          // cobranza pasa a 'para_revisar' para que alguien mire los cheques
          // que el OCR agregó mientras tanto.
          const pendientes = f.fotos.filter(x => !x.leida)
          if (!pendientes.length) continue
          let hubo = false
          for (const foto of pendientes) {
            const leida = await subirYLeerFoto(f, foto)
            if (leida) hubo = true
          }
          if (hubo) {
            f.estadoLocal = 'para_revisar'
            await dbGuardar(STORE_BORRADORES, f.id, f)
            mostrarExito(`Se leyeron los cheques de ${f.cliente || 'una cobranza'}. Revisalos antes de subirla.`)
          }
        }
        await refrescarLocales()
      } catch (err) {
        console.error('Falló el sincronizador:', err)
      } finally {
        estado.sincronizando = false
      }
    }

    // Igual que procesarFoto pero sobre un borrador que NO está en pantalla:
    // muta el objeto y devuelve si quedó leída.
    async function subirYLeerFoto(f, foto) {
      if (!foto.subida) {
        if (!foto.blob) return false
        try {
          const { error } = await supabase.storage.from('cobranzas')
            .upload(foto.storage_path, foto.blob, { contentType: 'image/jpeg', upsert: false })
          if (error && !/exist/i.test(error.message ?? '')) throw error
          foto.subida = true
        } catch (err) {
          console.error('El sincronizador no pudo subir una foto:', err)
          return false
        }
      }
      try {
        const { data, error } = await supabase.functions.invoke('ocr-cheques', {
          body: { storage_path: foto.storage_path },
        })
        if (error) throw error
        foto.leida = true
        foto.ocr_modelo = data?.modelo ?? null
        foto.ocr_crudo = data?.crudo ?? null
        if (data?.ok) {
          foto.error = null
          ;(Array.isArray(data.cheques) ? data.cheques : []).forEach(p => f.cheques.push(chequeDesdeOcr(p, foto.id)))
        } else {
          foto.error = data?.mensaje || 'No se pudo leer la foto. Cargá los cheques a mano.'
        }
        return true
      } catch (err) {
        console.error('El sincronizador no pudo leer una foto:', err)
        return false
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LISTENERS
    // ═══════════════════════════════════════════════════════════════════════

    function conectarTodo() {
      // ── Listado ──
      let temporizadorBusqueda = null
      document.getElementById('cob-buscar-cliente').addEventListener('input', (ev) => {
        estado.filtros.texto = ev.target.value
        clearTimeout(temporizadorBusqueda)
        // Sin debounce, cada tecla es una consulta: con la señal de un pueblo
        // eso es una pantalla que nunca termina de cargar.
        temporizadorBusqueda = setTimeout(() => cargarCobranzas({ reiniciar: true }), 350)
      })
      document.getElementById('cob-filtro-desde').addEventListener('change', (ev) => {
        estado.filtros.desde = ev.target.value; cargarCobranzas({ reiniciar: true })
      })
      document.getElementById('cob-filtro-hasta').addEventListener('change', (ev) => {
        estado.filtros.hasta = ev.target.value; cargarCobranzas({ reiniciar: true })
      })
      document.getElementById('cob-filtro-repartidor').addEventListener('change', (ev) => {
        estado.filtros.repartidor = ev.target.value; cargarCobranzas({ reiniciar: true })
      })
      document.getElementById('cob-btn-mas').addEventListener('click', () => cargarCobranzas())
      document.getElementById('cob-btn-nueva').addEventListener('click', abrirFormularioNuevo)
      document.getElementById('cob-btn-volver-listado').addEventListener('click', () => mostrarVistaCob('listado'))

      // ── Formulario ──
      document.getElementById('cob-btn-salir-form').addEventListener('click', async () => {
        // No se descarta nada al salir: el borrador queda en el celular y el
        // banner lo muestra. Perder una cobranza a medio cargar por tocar
        // "Volver" sería el peor final posible.
        estado.form = null
        mostrarVistaCob('listado')
        await refrescarLocales()
      })

      const campos = [
        ['cob-cliente', 'cliente'], ['cob-fecha', 'fecha'], ['cob-efectivo', 'efectivo'],
        ['cob-referencia', 'comprobante_referencia'], ['cob-observaciones', 'observaciones'],
      ]
      campos.forEach(([id, prop]) => {
        const el = document.getElementById(id)
        el.addEventListener('input', () => {
          if (!estado.form) return
          estado.form[prop] = el.value
          guardarBorrador()
          pintarTotalYGuardado()
        })
      })

      document.getElementById('cob-btn-camara').addEventListener('click', () => document.getElementById('cob-file-camara').click())
      document.getElementById('cob-btn-galeria').addEventListener('click', () => document.getElementById('cob-file-galeria').click())
      ;['cob-file-camara', 'cob-file-galeria'].forEach(id => {
        document.getElementById(id).addEventListener('change', async (ev) => {
          const archivos = [...(ev.target.files ?? [])]
          // El input se limpia SIEMPRE: sin esto, sacar dos veces la misma foto
          // no dispara el change la segunda vez.
          ev.target.value = ''
          if (archivos.length) await agregarFotos(archivos)
        })
      })

      document.getElementById('cob-btn-cheque-mano').addEventListener('click', () => {
        const f = estado.form
        if (!f) return
        // La foto es OBLIGATORIA: un cheque sin foto no se puede verificar
        // después contra nada, y el servidor lo rechaza igual.
        if (!f.fotos.length) {
          mostrarError('Primero sacá la foto del cheque: cada cheque tiene que estar vinculado a una foto.')
          return
        }
        if (f.fotos.length === 1) {
          f.cheques.push(chequeVacio(f.fotos[0].id))
        } else {
          const cual = window.prompt(`¿A qué foto corresponde? Escribí un número del 1 al ${f.fotos.length}.`)
          const i = Number(cual) - 1
          if (!Number.isInteger(i) || i < 0 || i >= f.fotos.length) {
            mostrarError('No se agregó el cheque: hay que decir a qué foto corresponde.')
            return
          }
          f.cheques.push(chequeVacio(f.fotos[i].id))
        }
        guardarBorrador(); pintarCheques(); pintarTotalYGuardado()
      })

      document.getElementById('cob-btn-guardar').addEventListener('click', guardarCobranza)

      // ── Visor ──
      document.getElementById('cob-visor-cerrar').addEventListener('click', cerrarVisor)
      document.getElementById('cob-visor-img').addEventListener('click', (ev) => {
        // Tocar alterna entre "entra en pantalla" y tamaño real con scroll: es
        // la única forma de leer un número de cheque en un celular.
        ev.target.classList.toggle('cob-visor__img--real')
      })

      // ── Modal de motivo ──
      document.getElementById('cob-modal-cancelar').addEventListener('click', cerrarModalMotivo)
      document.getElementById('cob-modal-confirmar').addEventListener('click', () => {
        const texto = document.getElementById('cob-modal-texto').value.trim()
        if (!texto) {
          const err = document.getElementById('cob-modal-error')
          err.hidden = false
          err.textContent = 'El motivo es obligatorio.'
          return
        }
        if (accionDelModal) accionDelModal(texto)
      })

      // ── Sincronización ──
      window.addEventListener('online', sincronizar)
      setInterval(sincronizar, MS_SINCRONIZADOR)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return

      // Que el navegador no borre los borradores por falta de espacio: son lo
      // único que sostiene el trabajo de un día sin señal.
      try {
        if (navigator.storage?.persist) await navigator.storage.persist()
      } catch (err) {
        console.error('No se pudo pedir almacenamiento persistente:', err)
      }

      try {
        const { data: emp, error } = await supabase
          .from('empleados').select('id, rol_app')
          .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
        if (error || !emp) throw error ?? new Error('sin empleado')
        estado.miEmpleadoId = emp.id
        estado.miRolApp = emp.rol_app
      } catch (err) {
        console.error('No se pudo identificar al empleado:', err)
        document.getElementById('cob-cargando').hidden = true
        document.getElementById('cob-sin-acceso').hidden = false
        return
      }

      try {
        const { data: tareas } = await supabase
          .from('empleado_tareas').select('modulo, tarea')
          .eq('empleado_id', estado.miEmpleadoId)
          .eq('modulo', 'cobranzas')
          .eq('habilitado', true)
        estado.misTareas = new Set((tareas ?? []).map(t => `${t.modulo}:${t.tarea}`))
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
      }

      document.getElementById('cob-cargando').hidden = true

      if (!tieneAlgunAcceso()) {
        document.getElementById('cob-sin-acceso').hidden = false
        return
      }

      conectarTodo()
      renderizarChipsEstado()
      mostrarVistaCob('listado')

      await Promise.all([cargarBancos(), cargarRepartidores()])
      await Promise.all([cargarCobranzas({ reiniciar: true }), refrescarLocales()])
      sincronizar()
    }

    init()

  </script>
