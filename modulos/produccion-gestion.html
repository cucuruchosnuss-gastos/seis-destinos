        lista.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso">Elegí un "desde" que no sea posterior al "hasta".</div>'
        return
      }
      lista.innerHTML = '<p class="pr-texto-suave">Buscando…</p>'
      try {
        const { data: maquinas, error: e1 } = await supabase.from('maquinas').select('id, nombre').eq('unidad_negocio_id', h.unidadId).order('orden').order('nombre')
        if (e1) throw e1
        h.maquinas = maquinas ?? []
        const sel = document.getElementById('pr-historial-maquina')
        sel.innerHTML = '<option value="">Todas las máquinas</option>' + h.maquinas.map(m => `<option value="${esc(m.id)}">${esc(m.nombre)}</option>`).join('')
        if (!h.maquinas.some(m => m.id === h.maquina)) h.maquina = ''
        sel.value = h.maquina
        let q = supabase.from('turnos_produccion')
          .select('id, lote, maquina_id, fecha, turno, encargado_id, estado, abierto_en, cerrado_en')
          .eq('unidad_negocio_id', h.unidadId).gte('fecha', h.desde).lte('fecha', h.hasta)
        if (h.maquina) q = q.eq('maquina_id', h.maquina)
        if (h.estado) q = q.eq('estado', h.estado)
        const { data: turnos, error: e2 } = await q.order('fecha', { ascending: false }).order('abierto_en', { ascending: false })
        if (e2) throw e2
        h.turnos = turnos ?? []
        h.nombres = await nombresDeEmpleados(h.turnos.map(t => t.encargado_id))
      } catch (err) {
        console.error('historial:', err)
        lista.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el historial. Revisá la conexión.</div>'
        return
      }
      if (h.turnos.length >= TOPE_FILAS) aviso.innerHTML = `<div class="pr-aviso">Se muestran los primeros ${TOPE_FILAS} turnos: acotá las fechas para ver el resto.</div>`
      lista.innerHTML = htmlTablaTurnos(h)
    }

    function htmlTablaTurnos(h) {
      if (!h.turnos.length) return '<p class="pr-of-vacio">No hay turnos con esos filtros.</p>'
      return '<div class="pr-of-tabla"><div class="pr-of-cab pr-of-turnos">' +
        '<span>Lote</span><span>Fecha</span><span>Turno</span><span>Máquina</span><span>Encargado</span><span>Estado</span></div>' +
        h.turnos.map(t => htmlFilaHistorial(t, h)).join('') + '</div>'
    }

    function htmlFilaHistorial(t, h) {
      const maquina = h.maquinas.find(m => m.id === t.maquina_id)?.nombre ?? 'Máquina'
      const encargado = h.nombres.get(t.encargado_id) ?? '—'
      const clase = t.estado === 'abierto' ? ' pr-of-fila--abierto'
        : (t.estado === 'pendiente_completar' ? ' pr-of-fila--pendiente' : '')
      return `<button type="button" class="pr-of-fila pr-of-turnos${clase}" data-historial-turno="${esc(t.id)}">` +
        `<span class="pr-of-lote">${esc(t.lote)}</span>` +
        `<span>${esc(fechaDelDia(t.fecha))}</span>` +
        `<span>${esc(t.turno)}</span>` +
        `<span>${esc(maquina)}</span>` +
        `<span>${esc(encargado)}</span>` +
        `<span>${htmlEstadoTurno(t.estado)}</span></button>`
    }

    async function leerDetalleTurno(turnoId) {
      const leer = async (consulta) => { const { data, error } = await consulta; if (error) throw error; return data ?? [] }
      const [turno] = await leer(supabase.from('turnos_produccion')
        .select('id, lote, maquina_id, unidad_negocio_id, fecha, turno, encargado_id, estado, abierto_en, cerrado_en, hora_inicio, hora_apagado, scrap_kg, observaciones, forzado_por, forzado_en, forzado_motivo, completado_por, completado_en').eq('id', turnoId))
      if (!turno) throw new Error('El turno no existe.')
      // `desde` y `hasta`, los dos: quitar_operario_turno NO borra la fila, le
      // pone `hasta`. El que se fue estuvo en el turno y tiene que verse.
      const operarios = await leer(supabase.from('turno_operarios').select('empleado_id, desde, hasta').eq('turno_id', turnoId).order('desde'))
      const masas = await leer(supabase.from('masas').select('id, nro, hora, tipo_masa, doble, origen, receta_id, masero_id, anulada, anulada_motivo, es_chocolate').eq('turno_id', turnoId).order('nro'))
      const ids = masas.map(m => m.id)
      const items = ids.length ? await leer(supabase.from('masa_items').select('masa_id, ingrediente_id, ingrediente_libre, insumo_id, lote, lote_fuera_de_stock, cantidad_simple_kg, cantidad_kg').in('masa_id', ids)) : []
      const recetas = [...new Set(masas.map(m => m.receta_id))]
      const recItems = recetas.length ? await leer(supabase.from('receta_items').select('receta_id, ingrediente_id, cantidad_kg').in('receta_id', recetas)) : []
      const ingredientes = await leer(supabase.from('ingredientes').select('id, nombre, orden'))
      const insIds = [...new Set(items.map(i => i.insumo_id).filter(Boolean))]
      const insumos = insIds.length ? await leer(supabase.from('insumos').select('id, nombre, marca').in('id', insIds)) : []
      const paradas = await leer(supabase.from('paradas_produccion').select('id, inicio, fin, motivo, hasta_fin_de_turno').eq('turno_id', turnoId).order('inicio'))
      // ANULAR NO BORRA: le pone `anulado` al renglón. Ese sublote existió, se
      // selló en una caja y su stock entró y salió, así que se sigue trayendo.
      const producido = await leer(supabase.from('produccion_items').select('id, orden, sublote, presentacion_id, marca_id, cajas, unidades_por_caja, unidades, anulado, caja_insumo_id, embolsado').eq('turno_id', turnoId).order('orden'))
      const itemIds = producido.map(p => p.id).filter(Boolean)
      const empaque = await leerEmpaqueTurno(turno.unidad_negocio_id, itemIds)
      const insEmpIds = [...new Set([...producido.map(p => p.caja_insumo_id), ...(empaque.movimientos ?? []).map(m => m.insumo_id)].filter(Boolean))]
      const insumosEmpaque = insEmpIds.length ? await leer(supabase.from('insumos').select('id, nombre, marca').in('id', insEmpIds)) : []
      const correcciones = itemIds.length ? await leer(supabase.from('produccion_correcciones')
        .select('produccion_item_id, tipo, cajas_antes, cajas_despues, motivo, hecha_por, hecha_en').in('produccion_item_id', itemIds).order('hecha_en')) : []
      const presIds = [...new Set(producido.map(p => p.presentacion_id))]
      const presentaciones = presIds.length ? await leer(supabase.from('producto_presentaciones').select('id, producto_id, nombre, con_cono, media_caja').in('id', presIds)) : []
      const prodIds = [...new Set(presentaciones.map(p => p.producto_id))]
      const productos = prodIds.length ? await leer(supabase.from('productos_terminados').select('id, nombre').in('id', prodIds)) : []
      // Qué productos tienen alguna presentación con cono: es lo que decide si
      // un renglón dice "sin cono" (partesProducido).
      const conCono = prodIds.length ? await leer(supabase.from('producto_presentaciones').select('producto_id, con_cono').in('producto_id', prodIds).eq('con_cono', true)) : []
      const productosConCono = [...new Set(conCono.filter(x => x.con_cono === true).map(x => x.producto_id))]
      const marcaIds = [...new Set(producido.map(p => p.marca_id).filter(Boolean))]
      const marcas = marcaIds.length ? await leer(supabase.from('marcas_personalizadas').select('id, nombre').in('id', marcaIds)) : []
      // Los nombres salen de v_empleados_publico y NUNCA de un embed a
      // empleados: su RLS solo deja leer la fila propia, así que un embed
      // dejaría todos los nombres en blanco menos el tuyo.
      const nombres = await nombresDeEmpleados([turno.encargado_id, turno.forzado_por, turno.completado_por,
        ...operarios.map(o => o.empleado_id), ...masas.map(m => m.masero_id), ...correcciones.map(c => c.hecha_por)])
      return { turno, operarios, masas, items, recItems, ingredientes, insumos, paradas, producido, correcciones, presentaciones, productos, productosConCono, marcas, nombres, empaque, insumosEmpaque }
    }

    // El empaque que descontó el turno: los movimientos de stock_movimientos
    // con produccion_item_id de sus sublotes. Solo con stock:ver en la unidad
    // del turno —es el RLS de la tabla—; sin eso NO se consulta, porque la
    // respuesta vacía se leería como "no se descontó nada".
    // → { estado: 'ok' | 'sin_permiso' | 'desconocido' | 'error', movimientos }
    async function leerEmpaqueTurno(unidadId, itemIds) {
      const permiso = puedeVerStockEn(unidadId)
      if (permiso === false) return { estado: 'sin_permiso', movimientos: [] }
      if (permiso === null) return { estado: 'desconocido', movimientos: [] }
      if (!itemIds.length) return { estado: 'ok', movimientos: [] }
      try {
        const { data, error } = await supabase.from('stock_movimientos')
          .select('insumo_id, cantidad, produccion_item_id').in('produccion_item_id', itemIds)
        if (error) throw error
        return { estado: 'ok', movimientos: data ?? [] }
      } catch (err) {
        console.error('empaque del turno:', err)
        return { estado: 'error', movimientos: [] }
      }
    }

    // Lo consumido por insumo, NETO: las devoluciones (corregir hacia abajo,
    // anular) son positivas y se restan solas. Lo que se consumió es −suma.
    // Un insumo que quedó en cero (se devolvió entero) no se lista.
    function empaqueConsumido(movimientos) {
      const mapa = new Map()
      for (const m of movimientos ?? []) {
        const n = Number(m.cantidad)
        if (!Number.isFinite(n)) continue
        mapa.set(m.insumo_id, (mapa.get(m.insumo_id) ?? 0) + n)
      }
      return [...mapa.entries()]
        .map(([insumoId, suma]) => ({ insumoId, cantidad: Math.round(-suma * 1000) / 1000 }))
        .filter(f => f.cantidad !== 0)
    }

    function htmlEmpaqueTurno(d) {
      const e = d.empaque ?? { estado: 'desconocido', movimientos: [] }
      if (e.estado === 'sin_permiso') return '<div class="pr-aviso">No se puede ver el stock con este usuario: el empaque consumido lo ve quien tiene permiso de ver el stock de esta unidad.</div>'
      if (e.estado === 'desconocido') return '<div class="pr-aviso">No se pudo saber si este usuario puede ver el stock, así que el empaque consumido no se muestra.</div>'
      if (e.estado === 'error') return '<div class="pr-aviso pr-aviso--grave">No se pudo leer el empaque consumido. Revisá la conexión.</div>'
      if (!e.movimientos.length) return '<p class="pr-texto-suave">No se descontó empaque en este turno.</p>'
      const filas = empaqueConsumido(e.movimientos)
      if (!filas.length) return '<p class="pr-texto-suave">Todo el empaque que se descontó se devolvió (sublotes corregidos o anulados).</p>'
      const tope = e.movimientos.length >= TOPE_FILAS
        ? `<div class="pr-aviso pr-aviso--grave">Este turno tiene más de ${TOPE_FILAS} movimientos de empaque y solo se leyeron los primeros: los totales pueden estar incompletos.</div>`
        : ''
      const nombre = id => { const i = (d.insumosEmpaque ?? []).find(x => x.id === id); return i ? textoInsumoEmpaque(i) : 'Insumo' }
      return tope + '<ul class="pr-lista">' + filas
        .sort((a, b) => nombre(a.insumoId).localeCompare(nombre(b.insumoId), 'es'))
        .map(f => `<li class="pr-lista__item">${esc(nombre(f.insumoId))}: <strong>${esc(formatearNumeroAr(f.cantidad, { decimales: 3, minimos: 0 }))}</strong></li>`)
        .join('') + '</ul>'
    }

    // Lo consumido por insumo y lote: la suma de lo que descontaron las masas
    // NO anuladas (cantidad_kg ya es la doble ×2 cuando corresponde).
    function totalesConsumidos(d) {
      const vivas = new Set(d.masas.filter(m => !m.anulada).map(m => m.id))
      const mapa = new Map()
      for (const it of d.items) {
        if (!it.insumo_id || !vivas.has(it.masa_id)) continue
        const k = `${it.insumo_id}|${it.lote ?? ''}`
        const act = mapa.get(k) ?? { insumo_id: it.insumo_id, lote: it.lote ?? null, kg: 0 }
        const suma = sumarMedido(act.kg, it.cantidad_kg)
        act.kg = suma === null ? null : redondearKg(suma)
        mapa.set(k, act)
      }
      return [...mapa.values()]
    }

    function nombreInsumo(d, id) {
      const i = d.insumos.find(x => x.id === id)
      return i ? i.nombre + (i.marca ? ` · ${i.marca}` : '') : 'Insumo'
    }

    // PostgREST corta en 1000 filas. Si alguna de las listas que alimentan los
    // totales llegó al tope, los totales están calculados sobre una parte y la
    // pantalla lo DICE: un número que parece un resultado y no lo es sería
    // peor que no mostrarlo.
    function detalleIncompleto(d) {
      return (d.items?.length ?? 0) >= TOPE_FILAS || (d.correcciones?.length ?? 0) >= TOPE_FILAS
    }

    // Los operarios del turno CON SUS HORAS. El que se fue sigue en la lista
    // con su hora de salida: es quién estuvo en ese turno.
    function htmlOperariosHistorial(d) {
      const filas = d.operarios ?? []
      if (!filas.length) return '<p class="pr-texto-suave">Sin operarios cargados.</p>'
      return filas.map(o => {
        const desde = horaArgentina(o.desde)
        const dur = o.hasta ? duracionTexto(o.desde, o.hasta) : ''
        const rango = o.hasta
          ? `${desde || '—'} → ${horaArgentina(o.hasta) || '—'}${dur ? ` · ${dur}` : ''}`
          : (desde ? `desde ${desde} · sigue` : 'sin hora de entrada')
        return '<div class="pr-renglon">' +
          `<span class="pr-renglon__num">${esc(d.nombres.get(o.empleado_id) ?? '—')}</span>` +
          `<span class="pr-renglon__dato">${esc(rango)}</span></div>`
      }).join('')
    }

    function nombreIngredienteItem(d, it) {
      if (it.ingrediente_id) return d.ingredientes.find(g => g.id === it.ingrediente_id)?.nombre ?? 'Ingrediente'
      return it.ingrediente_libre || 'Otro'
    }

    function htmlMasaHistorial(m, d) {
      const suyos = d.items.filter(i => i.masa_id === m.id && Number(i.cantidad_kg) > 0)
      const detalle = suyos.map(i => `${nombreIngredienteItem(d, i)} ${textoKg(Number(i.cantidad_kg))}` +
        (i.insumo_id ? ` (${nombreInsumo(d, i.insumo_id)}${i.lote ? `, lote ${i.lote}` : ''}${i.lote_fuera_de_stock ? ', lote fuera de stock' : ''})` : '')).join(' · ')
      const dif = textoDiferencias(diferenciaDeMasa(m, d))
      // El chip de chocolate sale de masas.es_chocolate, que escribe
      // registrar_masa mirando los ingredientes: no se recalcula acá. Los
      // chips, con el criterio de las listas (chipsDeMasa).
      const chips = chipsDeMasa(m)
      return `<li class="pr-lista__item${m.anulada ? ' pr-masa-fila--anulada' : ''}">` +
        `<strong>Masa ${esc(m.nro)}</strong> · ${esc(horaArgentina(m.hora) || '—')} · ${esc(m.tipo_masa)} · <span class="pr-masa-tam">${textoTamanoMasa(m)}</span>` +
        `${chips ? ` ${chips}` : ''} · masero ${esc(d.nombres.get(m.masero_id) ?? '—')}` +
        (m.anulada ? `<br><strong>Anulada:</strong> ${esc(m.anulada_motivo ?? '')}` : `<br>${esc(dif)}`) +
        `<br><span class="pr-texto-suave">${esc(detalle || 'Sin ingredientes')}</span></li>`
    }

    function correccionesDe(d, itemId) {
      return (d.correcciones ?? []).filter(c => c.produccion_item_id === itemId)
    }

    const TIPO_CORRECCION = { anulado: 'Anulado', agregado: 'Agregado después del cierre' }

    function htmlCorreccion(c, d) {
      const que = c.tipo === 'cajas'
        ? `Cajas ${textoEntero(c.cajas_antes)} → ${textoEntero(c.cajas_despues)}`
        : (TIPO_CORRECCION[c.tipo] ?? c.tipo)
      const cuando = [fechaCorta(c.hecha_en), horaArgentina(c.hecha_en)].filter(Boolean).join(' ')
      return `<div class="pr-of-correccion">${esc(que)} · ${esc(c.motivo)} · ${esc(d.nombres.get(c.hecha_por) ?? '—')}${cuando ? ` · ${esc(cuando)}` : ''}</div>`
    }

    // El renglón dice qué es con la MISMA regla que la planilla
    // (partesProducido), y después las cajas y las unidades. Las unidades por
    // caja ya están en "caja ×N": no se repiten en la cuenta.
    function htmlSubloteHistorial(p, d) {
      const pr = d.presentaciones.find(x => x.id === p.presentacion_id)
      const prod = d.productos.find(x => x.id === pr?.producto_id)
      const producto = prod?.nombre ?? 'Producto'
      const marcaNombre = p.marca_id ? (d.marcas.find(x => x.id === p.marca_id)?.nombre ?? 'Cono que ya no está') : null
      const corr = correccionesDe(d, p.id).map(c => htmlCorreccion(c, d)).join('')
      const sinCaja = sinCajaDescontada(p)
      const que = [producto, ...partesProducido({
        producto, pr, marcaNombre, unidadesPorCaja: p.unidades_por_caja,
        conConoEnProducto: (d.productosConCono ?? []).includes(pr?.producto_id),
        caja: nombreCajaItem(p, d.insumosEmpaque), embolsado: p.embolsado,
      })].join(' · ')
      return `<li class="pr-lista__item${p.anulado ? ' pr-of-anulado' : ''}${sinCaja ? ' pr-of-sin-caja' : ''}">` +
        `<span class="pr-producido__sublote">${esc(p.sublote)}</span> ${esc(que)} · ` +
        `${esc(textoEntero(p.cajas))} cajas = ${esc(textoEntero(p.unidades))} unidades` +
        (p.anulado ? ' <strong>· anulado, no suma</strong>' : '') +
        (sinCaja ? ` <strong class="pr-sin-caja">· ${esc(textoSinCaja(p))}</strong>` : '') + corr + '</li>'
    }

    // El total del turno: SIN los sublotes anulados, que se siguen viendo pero
    // ya no están en el stock.
    function totalSublotes(d) {
      let cajas = 0, unidades = 0
      for (const p of d.producido ?? []) {
        if (p.anulado) continue
        cajas = sumarMedido(cajas, p.cajas)
        unidades = sumarMedido(unidades, p.unidades)
      }
      return { cajas, unidades }
    }

    function htmlDetalleTurno(d) {
      const t = d.turno
      const nom = (id) => d.nombres.get(id) ?? '—'
      const forzado = t.forzado_motivo
        ? `<div class="pr-aviso pr-aviso--grave">Esta planilla se cerró a la fuerza${t.forzado_por ? ` · ${esc(nom(t.forzado_por))}` : ''}${t.forzado_en ? ` · ${esc(fechaCorta(t.forzado_en))}` : ''}: ${esc(t.forzado_motivo)}` +
          `${t.estado === 'pendiente_completar' ? ' Lo que produjo todavía no está en el stock.' : ''}</div>`
        : ''
      const cab = `<div class="pr-datos">` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Lote</span><span class="pr-lote">${esc(t.lote)}</span></div>` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Fecha y turno</span><span class="pr-dato__valor">${esc(fechaDelDia(t.fecha))} · ${esc(t.turno)}</span></div>` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Estado</span><span class="pr-dato__valor">${htmlEstadoTurno(t.estado)}</span></div>` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Encargado</span><span class="pr-dato__valor">${esc(nom(t.encargado_id))}</span></div>` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Horario</span><span class="pr-dato__valor">${esc(String(t.hora_inicio ?? horaArgentina(t.abierto_en) ?? '').slice(0, 5) || '—')} a ${esc(String(t.hora_apagado ?? '').slice(0, 5) || (t.estado === 'abierto' ? 'sigue abierto' : '—'))}</span></div>` +
        `<div class="pr-dato"><span class="pr-dato__rotulo">Scrap</span><span class="pr-dato__valor">${t.scrap_kg == null ? '—' : esc(textoKg(Number(t.scrap_kg)))}</span></div>` +
        `</div>` + (t.observaciones ? `<p><strong>Observaciones:</strong> ${esc(t.observaciones)}</p>` : '')
      const masas = d.masas.length ? d.masas.map(m => htmlMasaHistorial(m, d)).join('') : '<li class="pr-lista__item">Sin masas.</li>'
      const tot = totalSublotes(d)
      const producido = d.producido.length ? d.producido.map(p => htmlSubloteHistorial(p, d)).join('')
        : `<li class="pr-lista__item">${t.estado === 'cerrado' ? 'No produjo nada.' : 'Todavía no cargó nada producido.'}</li>`
      const pieProducido = d.producido.length
        ? `<p class="pr-of-grupo__total">Total del turno: ${esc(textoEntero(tot.cajas))} cajas · ${esc(textoEntero(tot.unidades))} unidades</p>`
        : ''
      const consumidos = totalesConsumidos(d)
      const totales = consumidos.length ? consumidos.map(c =>
        `<li class="pr-lista__item">${esc(nombreInsumo(d, c.insumo_id))} · ${c.lote ? `lote ${esc(c.lote)}` : 'sin lote'}: <strong>${c.kg === null ? '—' : esc(textoKg(c.kg))}</strong></li>`).join('') : '<li class="pr-lista__item">Nada descontado del stock.</li>'
      const incompleto = detalleIncompleto(d)
        ? `<div class="pr-aviso pr-aviso--grave">Este turno tiene más de ${TOPE_FILAS} renglones y solo se leyeron los primeros: los totales pueden estar incompletos.</div>`
        : ''
      return forzado + cab +
        `<h2 class="pr-subtitulo">Operarios</h2>${htmlOperariosHistorial(d)}` +
        `<h2 class="pr-subtitulo">Masas</h2><ul class="pr-lista">${masas}</ul>` +
        `<h2 class="pr-subtitulo">Paradas</h2>${htmlParadas(d.paradas, accionesParadaHistorial(t))}` +
        (accionesParadaHistorial(t).editar ? '<button type="button" class="pr-btn pr-btn--secundario" id="pr-historial-anotar-parada">Anotar una parada</button>' : '') +
        `<h2 class="pr-subtitulo">Lo producido</h2><ul class="pr-lista">${producido}</ul>${pieProducido}` +
        `<h2 class="pr-subtitulo">Consumido por insumo y lote</h2>${incompleto}<ul class="pr-lista">${totales}</ul>` +
        `<h2 class="pr-subtitulo">Empaque consumido</h2>${htmlEmpaqueTurno(d)}`
    }

    async function abrirDetalleHistorial(turnoId) {
      const cont = document.getElementById('pr-historial-detalle-cuerpo')
      document.getElementById('pr-historial-listado').hidden = true
      document.getElementById('pr-historial-detalle').hidden = false
      cont.innerHTML = '<p class="pr-texto-suave">Cargando el turno…</p>'
      try {
        estado.detalleHistorial = await leerDetalleTurno(turnoId)
        cont.innerHTML = htmlDetalleTurno(estado.detalleHistorial)
      } catch (err) {
        estado.detalleHistorial = null
        console.error('detalle del turno:', err)
        cont.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el turno. Revisá la conexión.</div>'
      }
      if (window.scrollTo) window.scrollTo(0, 0)
    }

    // ── Stock de producto terminado ───────────────────────────────────────

    async function mostrarStockTerminado() {
      const unidades = unidadesDeHistorial()
      if (!unidades.length) return
      estado.stockUnidad = unidades.includes(estado.stockUnidad) ? estado.stockUnidad : unidadInicialOficina(unidades)
      pintarSelectorUnidad('pr-stock-unidad', unidades, estado.stockUnidad)
      mostrarVista('pr-stock')
      await cargarStockTerminado()
    }

    async function cargarStockTerminado() {
      const cont = document.getElementById('pr-stock-lista')
      const aviso = document.getElementById('pr-stock-aviso')
      aviso.innerHTML = ''
      cont.innerHTML = '<p class="pr-texto-suave">Cargando…</p>'
      let movs, productos, presentaciones, marcas
      try {
        const leer = async (consulta) => { const { data, error } = await consulta; if (error) throw error; return data ?? [] }
        movs = await leer(supabase.from('stock_terminado_movimientos').select('presentacion_id, marca_id, lote, cajas, unidades').eq('unidad_negocio_id', estado.stockUnidad))
        productos = await leer(supabase.from('productos_terminados').select('id, nombre, orden').eq('unidad_negocio_id', estado.stockUnidad))
        const ids = productos.map(p => p.id)
        presentaciones = ids.length ? await leer(supabase.from('producto_presentaciones').select('id, producto_id, nombre, orden').in('producto_id', ids)) : []
        marcas = await leer(supabase.from('marcas_personalizadas').select('id, nombre'))
      } catch (err) {
        console.error('stock terminado:', err)
        cont.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el stock terminado. Revisá la conexión.</div>'
        return
      }
      if (movs.length >= TOPE_FILAS) aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">Hay más de 1000 movimientos y solo se leyeron los primeros: los totales pueden estar incompletos.</div>'
      cont.innerHTML = htmlStockTerminado(agruparStockTerminado(movs), { productos, presentaciones, marcas })
    }

    // Suma por presentación, marca y sublote. Quedan solo los que tienen
    // cajas: un sublote despachado entero no se lista. Un total que NO se pudo
    // sumar queda en null —no en cero— y se lista igual (`null !== 0` es
    // verdadero, así que el filtro lo deja pasar): "no se sabe" no es lo mismo
    // que "no queda nada".
    function agruparStockTerminado(movs) {
      const mapa = new Map()
      for (const m of movs) {
        const k = `${m.presentacion_id}|${m.marca_id ?? ''}|${m.lote}`
        const act = mapa.get(k) ?? { presentacion_id: m.presentacion_id, marca_id: m.marca_id ?? null, lote: m.lote, cajas: 0, unidades: 0 }
        act.cajas = sumarMedido(act.cajas, m.cajas)
        act.unidades = sumarMedido(act.unidades, m.unidades)
        mapa.set(k, act)
      }
      return [...mapa.values()].filter(x => x.cajas !== 0 || x.unidades !== 0)
    }

    function htmlStockTerminado(filas, cat) {
      if (!filas.length) return '<p class="pr-of-vacio">No hay producto terminado en stock.</p>'
      const grupos = new Map()
      for (const f of filas) {
        const pr = cat.presentaciones.find(x => x.id === f.presentacion_id)
        const prod = cat.productos.find(x => x.id === pr?.producto_id)
        const marcaNombre = f.marca_id ? (cat.marcas.find(x => x.id === f.marca_id)?.nombre ?? 'Marca') : 'Común'
        const clave = `${prod?.nombre ?? 'Producto'} · ${pr?.nombre ?? 'Presentación'} · ${marcaNombre}`
        const g = grupos.get(clave) ?? { titulo: clave, cajas: 0, unidades: 0, sublotes: [] }
        g.cajas = sumarMedido(g.cajas, f.cajas); g.unidades = sumarMedido(g.unidades, f.unidades); g.sublotes.push(f)
        grupos.set(clave, g)
      }
      return [...grupos.values()].sort((a, b) => a.titulo.localeCompare(b.titulo, 'es')).map(g =>
        `<div class="pr-of-tabla pr-of-grupo"><div class="pr-of-grupo__cab">` +
        `<h2 class="pr-of-grupo__titulo">${esc(g.titulo)}</h2>` +
        `<span class="pr-of-grupo__total">${esc(textoEntero(g.cajas))} cajas · ${esc(textoEntero(g.unidades))} unidades</span></div>` +
        `<div class="pr-of-cab pr-of-stock"><span>Sublote</span><span class="pr-of-num">Cajas</span><span class="pr-of-num">Unidades</span></div>` +
        g.sublotes.sort((a, b) => String(a.lote).localeCompare(String(b.lote), 'es', { numeric: true })).map(s =>
          `<div class="pr-of-fila pr-of-stock"><span class="pr-producido__sublote">${esc(s.lote)}</span>` +
          `<span class="pr-of-num">${esc(textoEntero(s.cajas))}</span>` +
          `<span class="pr-of-num">${esc(textoEntero(s.unidades))}</span></div>`).join('') +
        `</div>`).join('')
    }

    function conectarHistorial() {
      document.getElementById('pr-btn-ir-historial').addEventListener('click', mostrarHistorial)
      document.getElementById('pr-btn-ir-stock').addEventListener('click', mostrarStockTerminado)
      document.getElementById('pr-historial-volver').addEventListener('click', volverDeOficina)
      document.getElementById('pr-stock-volver').addEventListener('click', volverDeOficina)
      document.getElementById('pr-historial-detalle-volver').addEventListener('click', () => {
        document.getElementById('pr-historial-detalle').hidden = true
        document.getElementById('pr-historial-listado').hidden = false
      })
      const cambio = (campo) => (ev) => { estado.historial[campo] = ev.target.value; cargarHistorial() }
      document.getElementById('pr-historial-unidad').addEventListener('change', cambio('unidadId'))
      document.getElementById('pr-historial-desde').addEventListener('change', cambio('desde'))
      document.getElementById('pr-historial-hasta').addEventListener('change', cambio('hasta'))
      document.getElementById('pr-historial-maquina').addEventListener('change', cambio('maquina'))
      document.getElementById('pr-historial-estado').addEventListener('change', cambio('estado'))
      document.getElementById('pr-historial-lista').addEventListener('click', ev => {
        const b = ev.target.closest('[data-historial-turno]'); if (b) abrirDetalleHistorial(b.dataset.historialTurno)
      })
      // Corregir, borrar y anotar paradas de una planilla CERRADA.
      document.getElementById('pr-historial-detalle-cuerpo').addEventListener('click', ev => {
        if (ev.target.closest('#pr-historial-anotar-parada')) return abrirEditorDesdeHistorial('anotar')
        const e = ev.target.closest('[data-parada-editar]'); if (e) return abrirEditorDesdeHistorial('editar', e.dataset.paradaEditar)
        const b = ev.target.closest('[data-parada-borrar]'); if (b) abrirEditorDesdeHistorial('borrar', b.dataset.paradaBorrar)
      })
      document.getElementById('pr-stock-unidad').addEventListener('change', ev => { estado.stockUnidad = ev.target.value; cargarStockTerminado() })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    // Sin permiso se dice y se vuelve al dashboard: quedarse en una pantalla
    // vacía no le dice a nadie por qué no ve nada.
    function sinAcceso(texto) {
      document.getElementById('pr-cargando').hidden = true
      const el = document.getElementById('pr-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    async function cargarPermisos() {
      const { data: emp, error } = await supabase
        .from('empleados').select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.miEmpleadoId = emp.id
      estado.miRolApp = emp.rol_app
      const { data: tareas, error: e2 } = await supabase
        .from('empleado_tareas').select('tarea, alcance')
        .eq('empleado_id', emp.id).eq('modulo', 'produccion').eq('habilitado', true)
      if (e2) throw e2
      estado.misTareas = new Map((tareas ?? []).map(t => [t.tarea, t.alcance ?? null]))
      const { data: unidades, error: e3 } = await supabase
        .from('unidades_negocio').select('id, nombre').eq('activo', true).order('nombre')
      if (e3) throw e3
      estado.unidades = new Map((unidades ?? []).map(u => [u.id, u.nombre]))
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      try {
        await cargarPermisos()
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }
      // Una cuenta de DISPOSITIVO (la de una tablet) va a la planta. Si
      // mi_sesion_produccion falla no se redirige a ciegas: se sigue, y los
      // permisos deciden qué se ve (la tablet no tiene ver ni configurar).
      try {
        const { data: ses, error } = await supabase.rpc('mi_sesion_produccion')
        if (error) throw error
        if (ses && ses.es_dispositivo === true) { window.location.replace('produccion.html'); return }
      } catch (err) {
        console.error('mi_sesion_produccion:', err)
      }
      if (!puedeVerGestion()) {
        sinAcceso(tieneTarea('cargar')
          ? 'Tu usuario carga desde la tablet de la planta: acá no hay nada que ver. Te llevamos al inicio…'
          : 'No tenés acceso a Producción. Te llevamos al inicio…')
        return
      }
      await cargarPermisoStock()
      document.getElementById('pr-cargando').hidden = true
      document.getElementById('pr-vista').hidden = false
      conectarTodo()
      if (window.lucide) window.lucide.createIcons()

      pintarAccesosOficina()
      cargarBurbujaConos()
      mostrarInicioOficina()
    }

    init()
  </script>
