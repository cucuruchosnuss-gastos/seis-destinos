      if (r.ok) await cargarPestanaConfig()
    }

    const LECTORES_CONFIG = {
      maquinas: leerMaquinasConfig, recetas: leerRecetasConfig, ingredientes: leerIngredientesConfig,
      productos: leerProductosConfig, empaque: leerEmpaqueConfig, marcas: leerMarcasConfig, personal: leerPersonalConfig,
    }
    const RENDERS_CONFIG = {
      maquinas: htmlConfigMaquinas, recetas: htmlConfigRecetas, ingredientes: htmlConfigIngredientes,
      productos: htmlConfigProductos, empaque: htmlConfigEmpaque, marcas: htmlConfigMarcas, personal: htmlConfigPersonal,
    }

    function conectarConfig() {
      // "‹ Menú" (celular) abre el menú: no se va de la sección, así que no
      // hay nada que preguntar. Irse lo pregunta irA().
      document.getElementById('pr-config-volver').addEventListener('click', abrirMenu)
      document.getElementById('pr-config-unidad').addEventListener('change', ev => {
        const unidad = ev.target.value
        if (!pedirSalida(estado.config, { unidad })) return
        estado.config.unidadId = unidad
        estado.config.recetaMaquina = null
        cargarPestanaConfig()
      })
      document.getElementById('pr-cfg-hoja-cerrar').addEventListener('click', pedirCerrarHoja)
      document.getElementById('pr-cfg-hoja-cerrar-no').addEventListener('click', volverAHojaPines)
      document.getElementById('pr-cfg-hoja-cerrar-si').addEventListener('click', cerrarHojaPines)
      document.getElementById('pr-cfg-hoja-imprimir').addEventListener('click', () => window.print?.())
      // Cerrar la pestaña del navegador con cambios sin guardar: lo único que
      // se puede hacer ahí es el aviso del propio navegador.
      window.addEventListener('beforeunload', ev => {
        if (!cambiosSinGuardar(estado.config)) return
        ev.preventDefault()
        ev.returnValue = ''
      })
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b || b.disabled) return
        const ds = b.dataset
        if (b.id === 'pr-cfg-salir-si') return confirmarSalida()
        if (b.id === 'pr-cfg-salir-no') return cancelarSalida()
        if (b.id === 'pr-cfg-personal-guardar') return guardarCambiosPersonal()
        if (b.id === 'pr-cfg-generar-pines') return generarPines()
        if (b.id === 'pr-cfg-abrir-maestro') return abrirPanelPin(null, true)
        if (b.id === 'pr-cfg-pin-cancelar') return cerrarPanelPin()
        if (b.id === 'pr-cfg-pin-guardar') return confirmarPinConfig()
        if (b.id === 'pr-cfg-abrir-temporal') return abrirPanelTemporal()
        if (b.id === 'pr-cfg-temporal-cancelar') return cerrarPanelTemporal()
        if (b.id === 'pr-cfg-temporal-dar') return confirmarTemporal()
        if (ds.pinAsignar !== undefined) return abrirPanelPin(estado.config.datos.personal.find(p => p.id === ds.pinAsignar))
        if (ds.temporalRevocar !== undefined) return revocarTemporal(ds.temporalRevocar)
        const tab = estado.config.tab
        if (tab === 'maquinas') accionMaquina(ds)
        else if (tab === 'recetas' && ds.recetaGuardar !== undefined) guardarReceta()
        else if (tab === 'ingredientes') accionIngrediente(ds)
        else if (tab === 'productos') accionProducto(ds)
        else if (tab === 'empaque') accionEmpaque(ds)
        else if (tab === 'marcas') accionMarca(ds)
      })
      cuerpo.addEventListener('change', ev => {
        const t = ev.target, c = estado.config
        if (t.dataset?.empSug !== undefined || t.dataset?.empCond !== undefined) return cambiarSelectEmpaque(t)
        if (t.dataset?.marcaDoble !== undefined) return cambiarDobleBolsa(t.dataset.marcaDoble, t.checked)
        if (t.dataset?.marcaActivo !== undefined) return tocarCono(t.dataset.marcaActivo, 'activa', t.checked)
        if (t.dataset?.recetaMaquina !== undefined) { c.recetaMaquina = t.value; c.recetaTipo = null; cargarPestanaConfig() }
        else if (t.dataset?.recetaTipo !== undefined) { c.recetaTipo = t.value; pintarPestanaConfig() }
        else if (t.dataset?.recetaPartida !== undefined) { c.recetaPartida = t.value; pintarPestanaConfig() }
        else if (t.dataset?.ingInsumo !== undefined) { t.checked ? c.insumosElegidos.add(t.dataset.ingInsumo) : c.insumosElegidos.delete(t.dataset.ingInsumo) }
        else if (t.dataset?.personalTodos !== undefined) { c.todoElPersonal = t.checked; pintarPestanaConfig() }
        else if (t.dataset?.personaPuesto !== undefined) { tocarPuestoPersonal(t.dataset.personaPuesto, t.dataset.puesto, t.checked) }
        else if (t.id === 'pr-cfg-temporal-persona') { c.temporal.personaId = t.value || null }
        else if (t.id === 'pr-cfg-temporal-puesto') { c.temporal.puesto = t.value || null }
        else if (t.id === 'pr-cfg-temporal-hasta') { c.temporal.hasta = t.value }
      })
      cuerpo.addEventListener('input', ev => {
        const t = ev.target, c = estado.config
        if (t.dataset?.recetaKg !== undefined) return marcarCambioReceta(t)
        if (['pr-config-marca-buscar', 'pr-config-personal-buscar', 'pr-config-insumo-buscar'].includes(t.id)) {
          c.busqueda = t.value
          c.listaConos = null
          pintarPestanaConfig()
          const nuevo = document.getElementById(t.id)
          nuevo.focus?.()
          nuevo.setSelectionRange?.(nuevo.value.length, nuevo.value.length)
        }
      })
    }

    // Tocar una casilla de puesto NO guarda: deja la fila marcada como
    // cambiada y la manda el botón del pie, todas juntas.
    function tocarPuestoPersonal(personaId, puesto, marcado) {
      const c = estado.config
      const p = c.datos?.personal?.find(x => x.id === personaId)
      if (!p) return
      alternarPuesto(c, p, puesto, marcado)
      pintarPestanaConfig()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HISTORIAL Y STOCK TERMINADO (produccion:ver o produccion:configurar)
    // ═══════════════════════════════════════════════════════════════════════

    const TOPE_FILAS = 1000   // PostgREST corta ahí: si se llega, se avisa.

    // Las unidades que la persona puede mirar: las de ver y las de configurar.
    function unidadesDeHistorial() {
      const set = new Set([...unidadesCon('ver'), ...unidadesCon('configurar')])
      return [...estado.unidades.keys()].filter(id => set.has(id))
    }

    function sumarDias(iso, dias) {
      const d = new Date(`${iso}T12:00:00Z`)
      d.setUTCDate(d.getUTCDate() + dias)
      return d.toISOString().slice(0, 10)
    }

    // dd/mm/aaaa de una fecha (date de la base, sin hora).
    function fechaDelDia(iso) {
      return fechaCorta(`${iso}T12:00:00Z`)
    }

    function unidadInicialOficina(unidades) {
      if (unidades.includes(estado.unidadId)) return estado.unidadId
      return unidades[0] ?? null
    }

    async function nombresDeEmpleados(ids) {
      const unicos = [...new Set(ids.filter(Boolean))]
      if (!unicos.length) return new Map()
      const { data, error } = await supabase.from('v_empleados_publico').select('id, nombre').in('id', unicos)
      if (error) throw error
      return new Map((data ?? []).map(p => [p.id, p.nombre]))
    }

    // ── Historial de turnos ───────────────────────────────────────────────

    // UN DATO AUSENTE NO SE SUMA COMO SI FUERA CERO. `Number(null)` es 0 y es
    // finito, así que un acumulador ingenuo convierte "no se pudo leer" en un
    // total plausible y falso — la familia de bugs más repetida del proyecto.
    // Acá el total pasa a null y la pantalla muestra una raya: en una pantalla
    // de totales, decir que no se sabe es mejor que decir un número.
    function sumarMedido(acumulado, valor) {
      if (acumulado === null) return null
      if (valor === null || valor === undefined || valor === '') return null
      const n = Number(valor)
      return Number.isFinite(n) ? acumulado + n : null
    }

    // Enteros para leer: formatearNumeroAr() ya devuelve "—" con null, '' o NaN.
    function textoEntero(n) {
      return formatearNumeroAr(n, { decimales: 0 })
    }

    const ESTADO_TURNO = {
      abierto: ['abierto', 'Abierto'],
      pendiente_completar: ['pendiente', 'Pendiente de completar'],
      cerrado: ['cerrado', 'Cerrado'],
    }

    function htmlEstadoTurno(estadoTurno) {
      const [clase, texto] = ESTADO_TURNO[estadoTurno] ?? ['', estadoTurno ?? '—']
      return `<span class="pr-of-chip pr-of-chip--${clase}">${esc(texto)}</span>`
    }

    // `filtro`: lo que se pisa de los filtros al entrar ({ estado, desde }).
    // Lo usan los pendientes de los indicadores.
    async function mostrarHistorial(filtro = null) {
      const unidades = unidadesDeHistorial()
      if (!unidades.length) return
      const hoy = hoyArgentina()
      estado.historial = estado.historial ?? { desde: sumarDias(hoy, -7), hasta: hoy, maquina: '', estado: '' }
      // "Planillas pendientes" del menú es este mismo historial, filtrado: el
      // menú lo marca como su renglón mientras no se cambie el filtro.
      estado.historial.desdePendientes = false
      if (filtro) Object.assign(estado.historial, { hasta: hoy, maquina: '' }, filtro)
      estado.historial.unidadId = unidades.includes(estado.historial.unidadId) ? estado.historial.unidadId : unidadInicialOficina(unidades)
      pintarSelectorUnidad('pr-historial-unidad', unidades, estado.historial.unidadId)
      document.getElementById('pr-historial-desde').value = estado.historial.desde
      document.getElementById('pr-historial-hasta').value = estado.historial.hasta
      document.getElementById('pr-historial-estado').value = estado.historial.estado
      document.getElementById('pr-historial-detalle').hidden = true
      document.getElementById('pr-historial-listado').hidden = false
      mostrarVista('pr-historial')
      await cargarHistorial()
    }

    function filtrosHistorialValidos(h) {
      return /^\d{4}-\d{2}-\d{2}$/.test(h.desde ?? '') && /^\d{4}-\d{2}-\d{2}$/.test(h.hasta ?? '') && h.desde <= h.hasta
    }

    async function cargarHistorial() {
      const h = estado.historial
      const lista = document.getElementById('pr-historial-lista')
      const aviso = document.getElementById('pr-historial-aviso')
      aviso.innerHTML = ''
      if (!filtrosHistorialValidos(h)) {
        lista.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso">Elegí un "desde" que no sea posterior al "hasta".</div>'
        return
      }
      lista.innerHTML = '<p class="pr-texto-suave">Buscando…</p>'
      try {
        const { data: maquinas, error: e1 } = await supabase.from('maquinas').select('id, nombre').eq('unidad_negocio_id', h.unidadId).order('orden').order('nombre')
        if (e1) throw e1
        h.maquinas = maquinas ?? []
        const sel = document.getElementById('pr-historial-maquina')
        sel.innerHTML = '<option value="">Todas las máquinas</option>' + h.maquinas.map(m => `<option value="${esc(m.id)}">${esc(m.nombre)}</option>`).join('')
        if (!h.maquinas.some(m => m.id === h.maquina)) h.maquina = ''
        sel.value = h.maquina
        let q = supabase.from('turnos_produccion')
          .select('id, lote, maquina_id, fecha, turno, encargado_id, estado, abierto_en, cerrado_en')
          .eq('unidad_negocio_id', h.unidadId).gte('fecha', h.desde).lte('fecha', h.hasta)
        if (h.maquina) q = q.eq('maquina_id', h.maquina)
        if (h.estado) q = q.eq('estado', h.estado)
        const { data: turnos, error: e2 } = await q.order('fecha', { ascending: false }).order('abierto_en', { ascending: false })
        if (e2) throw e2
        h.turnos = turnos ?? []
        h.nombres = await nombresDeEmpleados(h.turnos.map(t => t.encargado_id))
      } catch (err) {
        console.error('historial:', err)
        lista.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el historial. Revisá la conexión.</div>'
        return
      }
      if (h.turnos.length >= TOPE_FILAS) aviso.innerHTML = `<div class="pr-aviso">Se muestran los primeros ${TOPE_FILAS} turnos: acotá las fechas para ver el resto.</div>`
      lista.innerHTML = htmlTablaTurnos(h)
    }

    function htmlTablaTurnos(h) {
      if (!h.turnos.length) return '<p class="pr-of-vacio">No hay turnos con esos filtros.</p>'
      return '<div class="pr-of-tabla"><div class="pr-of-cab pr-of-turnos">' +
        '<span>Lote</span><span>Fecha</span><span>Turno</span><span>Máquina</span><span>Encargado</span><span>Estado</span></div>' +
        h.turnos.map(t => htmlFilaHistorial(t, h)).join('') + '</div>'
    }

    function htmlFilaHistorial(t, h) {
      const maquina = h.maquinas.find(m => m.id === t.maquina_id)?.nombre ?? 'Máquina'
      const encargado = h.nombres.get(t.encargado_id) ?? '—'
      const clase = t.estado === 'abierto' ? ' pr-of-fila--abierto'
        : (t.estado === 'pendiente_completar' ? ' pr-of-fila--pendiente' : '')
      return `<button type="button" class="pr-of-fila pr-of-turnos${clase}" data-historial-turno="${esc(t.id)}">` +
        `<span class="pr-of-lote">${esc(t.lote)}</span>` +
        `<span>${esc(fechaDelDia(t.fecha))}</span>` +
        `<span>${esc(t.turno)}</span>` +
        `<span>${esc(maquina)}</span>` +
        `<span>${esc(encargado)}</span>` +
        `<span>${htmlEstadoTurno(t.estado)}</span></button>`
    }

    async function leerDetalleTurno(turnoId) {
      const leer = async (consulta) => { const { data, error } = await consulta; if (error) throw error; return data ?? [] }
      const [turno] = await leer(supabase.from('turnos_produccion')
        .select('id, lote, maquina_id, unidad_negocio_id, fecha, turno, encargado_id, estado, abierto_en, cerrado_en, hora_inicio, hora_apagado, scrap_kg, observaciones, forzado_por, forzado_en, forzado_motivo, completado_por, completado_en').eq('id', turnoId))
      if (!turno) throw new Error('El turno no existe.')
      const maquina = (await leer(supabase.from('maquinas').select('id, nombre').eq('id', turno.maquina_id))).find(m => m.id === turno.maquina_id) ?? null
      // `desde` y `hasta`, los dos: quitar_operario_turno NO borra la fila, le
      // pone `hasta`. El que se fue estuvo en el turno y tiene que verse.
      const operarios = await leer(supabase.from('turno_operarios').select('empleado_id, desde, hasta').eq('turno_id', turnoId).order('desde'))
      const masas = await leer(supabase.from('masas').select('id, nro, hora, tipo_masa, doble, origen, receta_id, masero_id, anulada, anulada_motivo, es_chocolate').eq('turno_id', turnoId).order('nro'))
      const ids = masas.map(m => m.id)
      const items = ids.length ? await leer(supabase.from('masa_items').select('masa_id, ingrediente_id, ingrediente_libre, insumo_id, lote, lote_fuera_de_stock, cantidad_simple_kg, cantidad_kg').in('masa_id', ids)) : []
      const recetas = [...new Set(masas.map(m => m.receta_id))]
      const recItems = recetas.length ? await leer(supabase.from('receta_items').select('receta_id, ingrediente_id, cantidad_kg').in('receta_id', recetas)) : []
      const ingredientes = await leer(supabase.from('ingredientes').select('id, nombre, orden'))
      const insIds = [...new Set(items.map(i => i.insumo_id).filter(Boolean))]
      const insumos = insIds.length ? await leer(supabase.from('insumos').select('id, nombre, marca').in('id', insIds)) : []
      const paradas = await leer(supabase.from('paradas_produccion').select('id, inicio, fin, motivo, hasta_fin_de_turno').eq('turno_id', turnoId).order('inicio'))
      // ANULAR NO BORRA: le pone `anulado` al renglón. Ese sublote existió, se
      // selló en una caja y su stock entró y salió, así que se sigue trayendo.
      const producido = await leer(supabase.from('produccion_items').select('id, orden, sublote, presentacion_id, marca_id, cajas, unidades_por_caja, unidades, anulado, caja_insumo_id, embolsado').eq('turno_id', turnoId).order('orden'))
      const itemIds = producido.map(p => p.id).filter(Boolean)
      const empaque = await leerEmpaqueTurno(turno.unidad_negocio_id, itemIds)
      const insEmpIds = [...new Set([...producido.map(p => p.caja_insumo_id), ...(empaque.movimientos ?? []).map(m => m.insumo_id)].filter(Boolean))]
      const insumosEmpaque = insEmpIds.length ? await leer(supabase.from('insumos').select('id, nombre, marca').in('id', insEmpIds)) : []
      const correcciones = itemIds.length ? await leer(supabase.from('produccion_correcciones')
        .select('produccion_item_id, tipo, cajas_antes, cajas_despues, motivo, hecha_por, hecha_en').in('produccion_item_id', itemIds).order('hecha_en')) : []
      const presIds = [...new Set(producido.map(p => p.presentacion_id))]
      const presentaciones = presIds.length ? await leer(supabase.from('producto_presentaciones').select('id, producto_id, nombre, con_cono, media_caja').in('id', presIds)) : []
      const prodIds = [...new Set(presentaciones.map(p => p.producto_id))]
      const productos = prodIds.length ? await leer(supabase.from('productos_terminados').select('id, nombre').in('id', prodIds)) : []
      // Qué productos tienen alguna presentación con cono: es lo que decide si
      // un renglón dice "sin cono" (partesProducido).
      const conCono = prodIds.length ? await leer(supabase.from('producto_presentaciones').select('producto_id, con_cono').in('producto_id', prodIds).eq('con_cono', true)) : []
      const productosConCono = [...new Set(conCono.filter(x => x.con_cono === true).map(x => x.producto_id))]
      const marcaIds = [...new Set(producido.map(p => p.marca_id).filter(Boolean))]
      const marcas = marcaIds.length ? await leer(supabase.from('marcas_personalizadas').select('id, nombre').in('id', marcaIds)) : []
      // Los nombres salen de v_empleados_publico y NUNCA de un embed a
      // empleados: su RLS solo deja leer la fila propia, así que un embed
      // dejaría todos los nombres en blanco menos el tuyo.
      const nombres = await nombresDeEmpleados([turno.encargado_id, turno.forzado_por, turno.completado_por,
        ...operarios.map(o => o.empleado_id), ...masas.map(m => m.masero_id), ...correcciones.map(c => c.hecha_por)])
      return { turno, maquina, operarios, masas, items, recItems, ingredientes, insumos, paradas, producido, correcciones, presentaciones, productos, productosConCono, marcas, nombres, empaque, insumosEmpaque }
    }

    // El empaque que descontó el turno: los movimientos de stock_movimientos
    // con produccion_item_id de sus sublotes. Solo con stock:ver en la unidad
    // del turno —es el RLS de la tabla—; sin eso NO se consulta, porque la
    // respuesta vacía se leería como "no se descontó nada".
    // → { estado: 'ok' | 'sin_permiso' | 'desconocido' | 'error', movimientos }
    async function leerEmpaqueTurno(unidadId, itemIds) {
      const permiso = puedeVerStockEn(unidadId)
      if (permiso === false) return { estado: 'sin_permiso', movimientos: [] }
      if (permiso === null) return { estado: 'desconocido', movimientos: [] }
      if (!itemIds.length) return { estado: 'ok', movimientos: [] }
      try {
        const { data, error } = await supabase.from('stock_movimientos')
          .select('insumo_id, cantidad, produccion_item_id').in('produccion_item_id', itemIds)
        if (error) throw error
        return { estado: 'ok', movimientos: data ?? [] }
      } catch (err) {
        console.error('empaque del turno:', err)
        return { estado: 'error', movimientos: [] }
      }
    }

    // Lo consumido por insumo, NETO: las devoluciones (corregir hacia abajo,
    // anular) son positivas y se restan solas. Lo que se consumió es −suma.
    // Un insumo que quedó en cero (se devolvió entero) no se lista.
    function empaqueConsumido(movimientos) {
      const mapa = new Map()
      for (const m of movimientos ?? []) {
        const n = Number(m.cantidad)
        if (!Number.isFinite(n)) continue
        mapa.set(m.insumo_id, (mapa.get(m.insumo_id) ?? 0) + n)
      }
      return [...mapa.entries()]
        .map(([insumoId, suma]) => ({ insumoId, cantidad: Math.round(-suma * 1000) / 1000 }))
        .filter(f => f.cantidad !== 0)
    }

    function htmlEmpaqueTurno(d) {
      const e = d.empaque ?? { estado: 'desconocido', movimientos: [] }
      if (e.estado === 'sin_permiso') return '<div class="pr-aviso">No se puede ver el stock con este usuario: el empaque consumido lo ve quien tiene permiso de ver el stock de esta unidad.</div>'
      if (e.estado === 'desconocido') return '<div class="pr-aviso">No se pudo saber si este usuario puede ver el stock, así que el empaque consumido no se muestra.</div>'
      if (e.estado === 'error') return '<div class="pr-aviso pr-aviso--grave">No se pudo leer el empaque consumido. Revisá la conexión.</div>'
      if (!e.movimientos.length) return '<p class="pr-texto-suave">No se descontó empaque en este turno.</p>'
      const filas = empaqueConsumido(e.movimientos)
      if (!filas.length) return '<p class="pr-texto-suave">Todo el empaque que se descontó se devolvió (sublotes corregidos o anulados).</p>'
      const tope = e.movimientos.length >= TOPE_FILAS
        ? `<div class="pr-aviso pr-aviso--grave">Este turno tiene más de ${TOPE_FILAS} movimientos de empaque y solo se leyeron los primeros: los totales pueden estar incompletos.</div>`
        : ''
      const nombre = id => { const i = (d.insumosEmpaque ?? []).find(x => x.id === id); return i ? textoInsumoEmpaque(i) : 'Insumo' }
      return tope + '<ul class="pr-lista">' + filas
        .sort((a, b) => nombre(a.insumoId).localeCompare(nombre(b.insumoId), 'es'))
        .map(f => `<li class="pr-lista__item">${esc(nombre(f.insumoId))}: <strong>${esc(formatearNumeroAr(f.cantidad, { decimales: 3, minimos: 0 }))}</strong></li>`)
        .join('') + '</ul>'
    }

    // Lo consumido por insumo y lote: la suma de lo que descontaron las masas
    // NO anuladas (cantidad_kg ya es la doble ×2 cuando corresponde).
    function totalesConsumidos(d) {
      const vivas = new Set(d.masas.filter(m => !m.anulada).map(m => m.id))
      const mapa = new Map()
      for (const it of d.items) {
        if (!it.insumo_id || !vivas.has(it.masa_id)) continue
        const k = `${it.insumo_id}|${it.lote ?? ''}`
        const act = mapa.get(k) ?? { insumo_id: it.insumo_id, lote: it.lote ?? null, kg: 0 }
        const suma = sumarMedido(act.kg, it.cantidad_kg)
        act.kg = suma === null ? null : redondearKg(suma)
        mapa.set(k, act)
      }
      return [...mapa.values()]
    }

    function nombreInsumo(d, id) {
      const i = d.insumos.find(x => x.id === id)
      return i ? i.nombre + (i.marca ? ` · ${i.marca}` : '') : 'Insumo'
    }

    // PostgREST corta en 1000 filas. Si alguna de las listas que alimentan los
    // totales llegó al tope, los totales están calculados sobre una parte y la
    // pantalla lo DICE: un número que parece un resultado y no lo es sería
    // peor que no mostrarlo.
    function detalleIncompleto(d) {
      return (d.items?.length ?? 0) >= TOPE_FILAS || (d.correcciones?.length ?? 0) >= TOPE_FILAS
    }

    // Los operarios del turno CON SUS HORAS. El que se fue sigue en la lista
    // con su hora de salida: es quién estuvo en ese turno.
    function htmlOperariosHistorial(d) {
      const filas = d.operarios ?? []
      if (!filas.length) return '<p class="pr-texto-suave">Sin operarios cargados.</p>'
      return filas.map(o => {
        const desde = horaArgentina(o.desde)
        const dur = o.hasta ? duracionTexto(o.desde, o.hasta) : ''
        const rango = o.hasta
          ? `${desde || '—'} → ${horaArgentina(o.hasta) || '—'}${dur ? ` · ${dur}` : ''}`
          : (desde ? `desde ${desde} · sigue` : 'sin hora de entrada')
        return '<div class="pr-renglon">' +
          `<span class="pr-renglon__num">${esc(d.nombres.get(o.empleado_id) ?? '—')}</span>` +
          `<span class="pr-renglon__dato">${esc(rango)}</span></div>`
      }).join('')
    }

    function nombreIngredienteItem(d, it) {
      if (it.ingrediente_id) return d.ingredientes.find(g => g.id === it.ingrediente_id)?.nombre ?? 'Ingrediente'
      return it.ingrediente_libre || 'Otro'
    }

    function htmlMasaHistorial(m, d) {
      const suyos = d.items.filter(i => i.masa_id === m.id && Number(i.cantidad_kg) > 0)
      const detalle = suyos.map(i => `${nombreIngredienteItem(d, i)} ${textoKg(Number(i.cantidad_kg))}` +
        (i.insumo_id ? ` (${nombreInsumo(d, i.insumo_id)}${i.lote ? `, lote ${i.lote}` : ''}${i.lote_fuera_de_stock ? ', lote fuera de stock' : ''})` : '')).join(' · ')
      const dif = textoDiferencias(diferenciaDeMasa(m, d))
      // El chip de chocolate sale de masas.es_chocolate, que escribe
      // registrar_masa mirando los ingredientes: no se recalcula acá. Los
      // chips, con el criterio de las listas (chipsDeMasa).
      const chips = chipsDeMasa(m)
      return `<li class="pr-lista__item${m.anulada ? ' pr-masa-fila--anulada' : ''}">` +
        `<strong>Masa ${esc(m.nro)}</strong> · ${esc(horaArgentina(m.hora) || '—')} · ${esc(m.tipo_masa)} · <span class="pr-masa-tam">${textoTamanoMasa(m)}</span>` +
        `${chips ? ` ${chips}` : ''} · masero ${esc(d.nombres.get(m.masero_id) ?? '—')}` +
        (m.anulada ? `<br><strong>Anulada:</strong> ${esc(m.anulada_motivo ?? '')}` : `<br>${esc(dif)}`) +
        `<br><span class="pr-texto-suave">${esc(detalle || 'Sin ingredientes')}</span></li>`
    }

    function correccionesDe(d, itemId) {
      return (d.correcciones ?? []).filter(c => c.produccion_item_id === itemId)
    }

    const TIPO_CORRECCION = { anulado: 'Anulado', agregado: 'Agregado después del cierre' }

    function htmlCorreccion(c, d) {
      const que = c.tipo === 'cajas'
        ? `Cajas ${textoEntero(c.cajas_antes)} → ${textoEntero(c.cajas_despues)}`
        : (TIPO_CORRECCION[c.tipo] ?? c.tipo)
      const cuando = [fechaCorta(c.hecha_en), horaArgentina(c.hecha_en)].filter(Boolean).join(' ')
      return `<div class="pr-of-correccion">${esc(que)} · ${esc(c.motivo)} · ${esc(d.nombres.get(c.hecha_por) ?? '—')}${cuando ? ` · ${esc(cuando)}` : ''}</div>`
    }

    // El renglón dice qué es con la MISMA regla que la planilla
    // (partesProducido), y después las cajas y las unidades. Las unidades por
    // caja ya están en "caja ×N": no se repiten en la cuenta.
    //
    // CORREGIR Y ANULAR (diseño 4). Las dos piden motivo, y la corrección se
    // abre EN EL MISMO RENGLÓN con el error pegado a su botón. Quién puede lo
    // dice la base (corregir_produccion_item / anular_produccion_item,
    // pg_get_functiondef 26/09/2026): en una planilla CERRADA, produccion:
    // configurar en la unidad; en una abierta o pendiente de completar,
    // produccion:cargar (la de la tablet). La pantalla ofrece el botón con esa
    // misma regla; la barrera es la base.
    function puedeCorregirSublote(turno, p) {
      if (!turno || !p || p.anulado) return false
      const tarea = turno.estado === 'cerrado' ? 'configurar' : 'cargar'
      return unidadesCon(tarea).includes(turno.unidad_negocio_id)
    }

    function htmlEditorSublote(p) {
      const e = estado.corrigeHist
      const anular = e.modo === 'anular'
      const campoCajas = anular ? '' : `<label class="pr-campo pg-corr__cajas"><span class="pr-campo__rotulo">Cajas</span>` +
        `<input type="text" class="pr-input" id="pr-hist-corr-cajas" data-numero="${esc(e.cajas ?? p.cajas ?? '')}" data-decimales="0" aria-label="Cajas del sublote ${esc(p.sublote)}"></label>`
      return `<div class="pg-corr" id="pr-hist-corr">${campoCajas}` +
        `<label class="pr-campo pg-corr__motivo"><span class="pr-campo__rotulo">Motivo <span class="pr-obligatorio">· obligatorio</span></span>` +
        `<input type="text" class="pr-input" id="pr-hist-corr-motivo" maxlength="300" autocomplete="off" value="${esc(e.motivo ?? '')}"></label>` +
        `<div class="pg-corr__acc"><button type="button" class="pr-btn pr-btn--secundario" id="pr-hist-corr-cancelar">Cancelar</button>` +
        (e.error ? `<div class="pr-cfg-error" role="alert">${esc(e.error)}</div>` : '') +
        `<button type="button" class="pr-btn${anular ? ' pr-btn--peligro' : ''}" id="pr-hist-corr-guardar"${e.enviando ? ' disabled' : ''}>${anular ? 'Anular el sublote' : 'Guardar corrección'}</button></div></div>`
    }

    function htmlSubloteHistorial(p, d) {
      const pr = d.presentaciones.find(x => x.id === p.presentacion_id)
      const prod = d.productos.find(x => x.id === pr?.producto_id)
      const producto = prod?.nombre ?? 'Producto'
      const marcaNombre = p.marca_id ? (d.marcas.find(x => x.id === p.marca_id)?.nombre ?? 'Cono que ya no está') : null
      const corr = correccionesDe(d, p.id).map(c => htmlCorreccion(c, d)).join('')
      const sinCaja = sinCajaDescontada(p)
      const que = [producto, ...partesProducido({
        producto, pr, marcaNombre, unidadesPorCaja: p.unidades_por_caja,
        conConoEnProducto: (d.productosConCono ?? []).includes(pr?.producto_id),
        caja: nombreCajaItem(p, d.insumosEmpaque), embolsado: p.embolsado,
      })].join(' · ')
      const editando = estado.corrigeHist?.itemId === p.id
      const botonesSublote = !editando && puedeCorregirSublote(d.turno, p)
        ? `<span class="pg-sub-acc"><button type="button" class="pr-btn pr-btn--secundario" data-sublote-corregir="${esc(p.id)}">Corregir</button>` +
          `<button type="button" class="pr-btn pr-btn--secundario" data-sublote-anular="${esc(p.id)}">Anular</button></span>`
        : ''
      return `<li class="pr-lista__item pg-sub${p.anulado ? ' pr-of-anulado' : ''}${sinCaja ? ' pr-of-sin-caja' : ''}${editando ? ' pg-sub--editando' : ''}">` +
        `<div class="pg-sub__fila"><span class="pg-sub__que"><span class="pr-producido__sublote">${esc(p.sublote)}</span> ${esc(que)}` +
        (p.anulado ? ' <span class="pr-of-chip pr-of-chip--pendiente">Anulado</span>' : '') + `</span>` +
        `<span class="pg-sub__cajas">${esc(textoEntero(p.cajas))} cajas = ${esc(textoEntero(p.unidades))} unidades` +
        (p.anulado ? ' <strong>· anulado, no suma</strong>' : '') + `</span>${botonesSublote}</div>` +
        (sinCaja ? `<strong class="pr-sin-caja">${esc(textoSinCaja(p))}</strong>` : '') + corr +
        (editando ? htmlEditorSublote(p) : '') + '</li>'
    }

    // El total del turno: SIN los sublotes anulados, que se siguen viendo pero
    // ya no están en el stock.
    function totalSublotes(d) {
      let cajas = 0, unidades = 0
      for (const p of d.producido ?? []) {
        if (p.anulado) continue
        cajas = sumarMedido(cajas, p.cajas)
        unidades = sumarMedido(unidades, p.unidades)
      }
      return { cajas, unidades }
    }

    // "Miércoles 24/09 · 06:02 a 14:10 · fuego apagado 13:55"
    function horarioTurno(t) {
      const desde = String(t.hora_inicio ?? '').slice(0, 5) || horaArgentina(t.abierto_en) || '—'
      const hasta = t.estado === 'abierto' ? 'sigue abierto' : (horaArgentina(t.cerrado_en) || '—')
      const fuego = String(t.hora_apagado ?? '').slice(0, 5)
      return [textoDiaInd(t.fecha), `${desde} a ${hasta}`, fuego ? `fuego apagado ${fuego}` : ''].filter(Boolean).join(' · ')
    }

    // El minutero de las paradas: el total de lo que se sabe (las cerradas).
    function minutosParadasTurno(paradas) {
      let t = 0
      for (const p of paradas ?? []) {
        const a = new Date(p.inicio).getTime(), b = new Date(p.fin ?? '').getTime()
        if (Number.isFinite(a) && Number.isFinite(b) && b > a) t += (b - a) / 60000
      }
      return t
    }

    function htmlDetalleTurno(d) {
      const t = d.turno
      const nom = (id) => d.nombres.get(id) ?? '—'
      const forzado = t.forzado_motivo
        ? `<div class="pr-aviso pr-aviso--grave">Esta planilla se cerró a la fuerza${t.forzado_por ? ` · ${esc(nom(t.forzado_por))}` : ''}${t.forzado_en ? ` · ${esc(fechaCorta(t.forzado_en))}` : ''}: ${esc(t.forzado_motivo)}` +
          `${t.estado === 'pendiente_completar' ? ' Lo que produjo todavía no está en el stock.' : ''}</div>`
        : ''
      const cab = `<div class="pg-turno__cab">` +
        `<div class="pg-turno__lote"><span class="pr-dato__rotulo">Lote</span><span class="pr-lote">${esc(t.lote)}</span></div>` +
        `<div class="pg-turno__datos"><div class="pg-turno__maq"><strong>${esc(d.maquina?.nombre ?? 'Máquina')}</strong> · turno ${esc(t.turno)}</div>` +
        `<div class="pr-texto-suave">${esc(horarioTurno(t))}</div>` +
        `<div class="pg-turno__enc"><span class="pr-dato__rotulo">Encargado</span> <strong>${esc(nom(t.encargado_id))}</strong></div></div>` +
        `<div class="pg-turno__estado">${htmlEstadoTurno(t.estado)}</div></div>`
      const masas = d.masas.length ? d.masas.map(m => htmlMasaHistorial(m, d)).join('') : '<li class="pr-lista__item">Sin masas.</li>'
      const vivas = d.masas.filter(m => !m.anulada).length
      const tot = totalSublotes(d)
      const anulados = d.producido.filter(p => p.anulado).length
      const producido = d.producido.length ? d.producido.map(p => htmlSubloteHistorial(p, d)).join('')
        : `<li class="pr-lista__item">${t.estado === 'cerrado' ? 'No produjo nada.' : 'Todavía no cargó nada producido.'}</li>`
      const pieProducido = d.producido.length
        ? `<p class="pr-of-grupo__total">Total del turno: ${esc(textoEntero(tot.cajas))} cajas · ${esc(textoEntero(tot.unidades))} unidades</p>`
        : ''
      const consumidos = totalesConsumidos(d)
      const totales = consumidos.length ? consumidos.map(c =>
        `<li class="pr-lista__item">${esc(nombreInsumo(d, c.insumo_id))} · ${c.lote ? `lote ${esc(c.lote)}` : 'sin lote'}: <strong>${c.kg === null ? '—' : esc(textoKg(c.kg))}</strong></li>`).join('') : '<li class="pr-lista__item">Nada descontado del stock.</li>'
      const incompleto = detalleIncompleto(d)
        ? `<div class="pr-aviso pr-aviso--grave">Este turno tiene más de ${TOPE_FILAS} renglones y solo se leyeron los primeros: los totales pueden estar incompletos.</div>`
        : ''
      const minParada = minutosParadasTurno(d.paradas)
      const scrapPie = `<dl class="pg-turno__totales"><div><dt>Total parada</dt><dd>${esc(horasMinutosInd(minParada))}</dd></div>` +
        `<div><dt>Scrap</dt><dd>${t.scrap_kg == null ? '—' : esc(textoKg(Number(t.scrap_kg)))}</dd></div></dl>` +
        (t.observaciones ? `<p class="pg-turno__obs"><strong>Observaciones:</strong> “${esc(t.observaciones)}”</p>` : '')
      const cantidad = `${d.producido.length} ${d.producido.length === 1 ? 'renglón' : 'renglones'}${anulados ? ` · ${anulados} ${anulados === 1 ? 'anulado' : 'anulados'}` : ''}`
      return forzado + cab +
        `<div class="pg-turno__grilla">` +
        `<section class="pg-caja"><h2 class="pr-subtitulo">Operarios</h2>${htmlOperariosHistorial(d)}</section>` +
        `<section class="pg-caja"><h2 class="pr-subtitulo">Masas <span class="pg-caja__ctx">${esc(vivas)}</span></h2><ul class="pr-lista">${masas}</ul></section>` +
        `<section class="pg-caja"><h2 class="pr-subtitulo">Paradas y scrap</h2>${htmlParadas(d.paradas, accionesParadaHistorial(t))}` +
        (accionesParadaHistorial(t).editar ? '<button type="button" class="pr-btn pr-btn--secundario" id="pr-historial-anotar-parada">Anotar una parada</button>' : '') +
        scrapPie + `</section></div>` +
        `<section class="pg-caja pg-caja--ancha"><h2 class="pr-subtitulo">Lo producido <span class="pg-caja__ctx">${esc(cantidad)}</span></h2><ul class="pr-lista pg-producido">${producido}</ul>${pieProducido}</section>` +
        `<section class="pg-caja pg-caja--ancha"><h2 class="pr-subtitulo">Empaque consumido</h2>${htmlEmpaqueTurno(d)}</section>` +
        `<section class="pg-caja pg-caja--ancha"><h2 class="pr-subtitulo">Consumido por insumo y lote</h2>${incompleto}<ul class="pr-lista">${totales}</ul></section>`
    }

    // Dibuja el detalle y conecta el campo de cajas del renglón que se está
    // corrigiendo (los números se escriben con ponerNumero, nunca con value=).
    function pintarDetalleHistorial() {
      const cont = document.getElementById('pr-historial-detalle-cuerpo')
      if (!estado.detalleHistorial) return
      cont.innerHTML = htmlDetalleTurno(estado.detalleHistorial)
      const campo = document.getElementById('pr-hist-corr-cajas')
      if (estado.corrigeHist && estado.corrigeHist.modo === 'corregir' && campo && campo.dataset) {
        enlazarCampoNumero(campo, { decimales: 0 })
        ponerNumero(campo, estado.corrigeHist.cajas ?? null)
      }
    }

    function abrirCorreccionSublote(itemId, modo) {
      const d = estado.detalleHistorial
      const p = d?.producido?.find(x => x.id === itemId)
      if (!p || !puedeCorregirSublote(d.turno, p)) return false
      estado.corrigeHist = { itemId, modo, cajas: modo === 'corregir' ? numeroInd(p.cajas) : null, motivo: '', error: null, enviando: false }
      pintarDetalleHistorial()
      document.getElementById(modo === 'corregir' ? 'pr-hist-corr-cajas' : 'pr-hist-corr-motivo')?.focus?.()
      return true
    }

    function cerrarCorreccionSublote() {
      estado.corrigeHist = null
      pintarDetalleHistorial()
    }

    // Lo que falta, dicho ANTES de mandar y pegado al botón. El botón no se
    // traba por lo que falta (si no, este error no se vería nunca).
    function faltaEnCorreccion(e, p) {
      if (String(e.motivo ?? '').trim().length < 3) return 'Escribí el motivo para guardar.'
      if (e.modo === 'anular') return null
      if (!Number.isInteger(e.cajas) || e.cajas <= 0) return 'Poné las cajas: un número entero mayor a cero. Para sacarlo, anulalo.'
      if (e.cajas === numeroInd(p.cajas)) return 'Tiene esas mismas cajas: poné la cantidad corregida.'
      return null
    }

    async function guardarCorreccionSublote() {
      const e = estado.corrigeHist, d = estado.detalleHistorial
      const p = d?.producido?.find(x => x.id === e?.itemId)
      if (!e || !p || e.enviando) return false
      const falta = faltaEnCorreccion(e, p)
      if (falta) { e.error = falta; pintarDetalleHistorial(); return false }
      e.enviando = true
      e.error = null
      pintarDetalleHistorial()
      const motivo = String(e.motivo).trim()
      let error = null
      try {
        const { error: err } = e.modo === 'anular'
          ? await supabase.rpc('anular_produccion_item', { p_item_id: p.id, p_motivo: motivo })
          : await supabase.rpc('corregir_produccion_item', { p_item_id: p.id, p_cajas: e.cajas, p_motivo: motivo })
        if (err) throw err
      } catch (err) {
        console.error('corregir sublote:', err)
        error = err?.message || 'No hubo respuesta del servidor. Revisá la conexión.'
      }
      if (estado.corrigeHist !== e) return false
      e.enviando = false
      if (error) { e.error = error; pintarDetalleHistorial(); return false }
      mostrarExito(e.modo === 'anular' ? `Sublote ${p.sublote} anulado.` : `Sublote ${p.sublote} corregido.`)
      estado.corrigeHist = null
      await abrirDetalleHistorial(d.turno.id)
      return true
    }

    async function abrirDetalleHistorial(turnoId) {
      const cont = document.getElementById('pr-historial-detalle-cuerpo')
      document.getElementById('pr-historial-listado').hidden = true
      document.getElementById('pr-historial-detalle').hidden = false
      if (estado.detalleHistorial?.turno?.id !== turnoId) estado.corrigeHist = null
      cont.innerHTML = '<p class="pr-texto-suave">Cargando el turno…</p>'
      try {
        estado.detalleHistorial = await leerDetalleTurno(turnoId)
        pintarDetalleHistorial()
      } catch (err) {
        estado.detalleHistorial = null
        console.error('detalle del turno:', err)
        cont.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el turno. Revisá la conexión.</div>'
      }
      if (window.scrollTo) window.scrollTo(0, 0)
    }

    // ── Stock de producto terminado ───────────────────────────────────────

    async function mostrarStockTerminado() {
      const unidades = unidadesDeHistorial()
      if (!unidades.length) return
      estado.stockUnidad = unidades.includes(estado.stockUnidad) ? estado.stockUnidad : unidadInicialOficina(unidades)
      pintarSelectorUnidad('pr-stock-unidad', unidades, estado.stockUnidad)
      mostrarVista('pr-stock')
      await cargarStockTerminado()
    }

    async function cargarStockTerminado() {
      const cont = document.getElementById('pr-stock-lista')
      const aviso = document.getElementById('pr-stock-aviso')
      const cajaRetiros = document.getElementById('pr-stock-retiros')
      aviso.innerHTML = ''
      cajaRetiros.innerHTML = ''
      cont.innerHTML = '<p class="pr-texto-suave">Cargando…</p>'
      let movs, productos, presentaciones, marcas
      const leer = async (consulta) => { const { data, error } = await consulta; if (error) throw error; return data ?? [] }
      try {
        movs = await leer(supabase.from('stock_terminado_movimientos').select('presentacion_id, marca_id, lote, cajas, unidades, tipo, orden_retiro_id, fecha, motivo, created_at').eq('unidad_negocio_id', estado.stockUnidad))
        productos = await leer(supabase.from('productos_terminados').select('id, nombre, orden').eq('unidad_negocio_id', estado.stockUnidad))
        const ids = productos.map(p => p.id)
        presentaciones = ids.length ? await leer(supabase.from('producto_presentaciones').select('id, producto_id, nombre, orden').in('producto_id', ids)) : []
        marcas = await leer(supabase.from('marcas_personalizadas').select('id, nombre'))
      } catch (err) {
        console.error('stock terminado:', err)
        cont.innerHTML = ''
        aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer el stock terminado. Revisá la conexión.</div>'
        return
      }
      if (movs.length >= TOPE_FILAS) aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">Hay más de 1000 movimientos y solo se leyeron los primeros: los totales pueden estar incompletos.</div>'
      const cat = { productos, presentaciones, marcas }
      cont.innerHTML = htmlStockTerminado(agruparStockTerminado(movs), cat)
      // Lo que salió por retiros, con el CÓDIGO de cada orden. Sin retiros:ver
      // en esta unidad no se consulta ordenes_retiro (su RLS devolvería vacío
      // y un vacío no se distingue de "no existe"): se dice que no hay permiso.
      const salidas = salidasPorRetiro(movs)
      if (!salidas.length) return
      const unidad = estado.stockUnidad
      const permiso = puedeVerRetirosEn(unidad)
      let ordenes = [], error = false
      if (permiso !== false) {
        try {
          ordenes = await leer(supabase.from('ordenes_retiro').select('id, codigo, estado').in('id', [...new Set(salidas.map(m => m.orden_retiro_id))]))
        } catch (err) {
          console.error('órdenes de retiro:', err)
          error = true
        }
      }
      if (estado.stockUnidad !== unidad) return
      cajaRetiros.innerHTML = htmlRetirosStock(salidas, cat, { permiso, ordenes, error })
    }

    // Los movimientos de un retiro: el despacho (salió) y, si la orden se
    // anuló, el ajuste que lo devolvió. Lo más nuevo primero.
    function salidasPorRetiro(movs) {
      return (movs ?? []).filter(m => m.orden_retiro_id && (m.tipo === 'despacho' || m.tipo === 'ajuste'))
        .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.created_at ?? '').localeCompare(String(a.created_at ?? '')))
    }

    // El nombre de un retiro: el CÓDIGO de la orden ("N-0001") y nunca el
    // número suelto. Sin permiso, o si no se pudo leer, lo dice.
    function codigoRetiro(id, info) {
      if (info.permiso === false) return { codigo: null, nota: 'sin permiso para ver el código' }
      if (info.error) return { codigo: null, nota: 'no se pudo leer el código' }
      const o = (info.ordenes ?? []).find(x => x.id === id)
      if (o?.codigo) return { codigo: o.codigo, anulada: o.estado === 'anulada', nota: '' }
      return { codigo: null, nota: 'no se pudo leer el código' }
    }

    function htmlRetirosStock(salidas, cat, info) {
      if (!salidas.length) return ''
      const avisoPermisoRetiros = info.permiso === false
        ? '<p class="pr-texto-suave">Con este usuario no se ven los códigos de los retiros: hace falta retiros:ver en esta unidad.</p>' : ''
      const filas = salidas.map(m => {
        const pr = cat.presentaciones.find(x => x.id === m.presentacion_id)
        const prod = cat.productos.find(x => x.id === pr?.producto_id)
        const cono = m.marca_id ? (cat.marcas.find(x => x.id === m.marca_id)?.nombre ?? 'Marca') : 'Común'
        const queRetiro = [prod?.nombre ?? 'Producto', pr?.nombre ?? 'Presentación', cono].join(' · ')
        const r = codigoRetiro(m.orden_retiro_id, info)
        const vuelve = m.tipo === 'ajuste'
        const titulo = vuelve
          ? (r.codigo ? `Anulación del retiro ${r.codigo}` : 'Anulación de un retiro')
          : (r.codigo ? `Retiro ${r.codigo}${r.anulada ? ' · anulado' : ''}` : 'Retiro')
        const n = numeroInd(m.cajas)
        const cuenta = `${vuelve ? 'volvieron' : 'salieron'} ${n === null ? '—' : textoEntero(Math.abs(n))} ${n !== null && Math.abs(n) === 1 ? 'caja' : 'cajas'}`
        const notaRetiro = r.nota ? `<span class="pr-texto-suave"> · ${esc(r.nota)}</span>` : ''
        const motivoRetiro = vuelve && m.motivo ? `<div class="pr-texto-suave">${esc(m.motivo)}</div>` : ''
        return `<div class="pr-of-fila pr-of-retiro">` +
          `<span>${esc(fechaDelDia(m.fecha))}</span>` +
          `<span><strong>${esc(titulo)}</strong>${notaRetiro}${motivoRetiro}</span>` +
          `<span>${esc(queRetiro)}</span>` +
          `<span class="pr-producido__sublote">${esc(m.lote)}</span>` +
          `<span class="pr-of-num">${esc(cuenta)}</span></div>`
      }).join('')
      return `<h2 class="pr-subtitulo">Lo que salió por retiros</h2>${avisoPermisoRetiros}` +
        `<div class="pr-of-tabla pr-of-grupo"><div class="pr-of-cab pr-of-retiro"><span>Fecha</span><span>Retiro</span><span>Producto</span><span>Sublote</span><span class="pr-of-num">Cajas</span></div>` +
        filas + '</div>'
    }

    // Suma por presentación, marca y sublote. Quedan solo los que tienen
    // cajas: un sublote despachado entero no se lista. Un total que NO se pudo
    // sumar queda en null —no en cero— y se lista igual (`null !== 0` es
    // verdadero, así que el filtro lo deja pasar): "no se sabe" no es lo mismo
    // que "no queda nada".
    function agruparStockTerminado(movs) {
      const mapa = new Map()
      for (const m of movs) {
        const k = `${m.presentacion_id}|${m.marca_id ?? ''}|${m.lote}`
        const act = mapa.get(k) ?? { presentacion_id: m.presentacion_id, marca_id: m.marca_id ?? null, lote: m.lote, cajas: 0, unidades: 0 }
        act.cajas = sumarMedido(act.cajas, m.cajas)
        act.unidades = sumarMedido(act.unidades, m.unidades)
        mapa.set(k, act)
      }
      return [...mapa.values()].filter(x => x.cajas !== 0 || x.unidades !== 0)
    }

    function htmlStockTerminado(filas, cat) {
      if (!filas.length) return '<p class="pr-of-vacio">No hay producto terminado en stock.</p>'
      const grupos = new Map()
      for (const f of filas) {
        const pr = cat.presentaciones.find(x => x.id === f.presentacion_id)
        const prod = cat.productos.find(x => x.id === pr?.producto_id)
        const marcaNombre = f.marca_id ? (cat.marcas.find(x => x.id === f.marca_id)?.nombre ?? 'Marca') : 'Común'
        const clave = `${prod?.nombre ?? 'Producto'} · ${pr?.nombre ?? 'Presentación'} · ${marcaNombre}`
        const g = grupos.get(clave) ?? { titulo: clave, cajas: 0, unidades: 0, sublotes: [] }
        g.cajas = sumarMedido(g.cajas, f.cajas); g.unidades = sumarMedido(g.unidades, f.unidades); g.sublotes.push(f)
        grupos.set(clave, g)
      }
      return [...grupos.values()].sort((a, b) => a.titulo.localeCompare(b.titulo, 'es')).map(g =>
        `<div class="pr-of-tabla pr-of-grupo"><div class="pr-of-grupo__cab">` +
        `<h2 class="pr-of-grupo__titulo">${esc(g.titulo)}</h2>` +
        `<span class="pr-of-grupo__total">${esc(textoEntero(g.cajas))} cajas · ${esc(textoEntero(g.unidades))} unidades</span></div>` +
        `<div class="pr-of-cab pr-of-stock"><span>Sublote</span><span class="pr-of-num">Cajas</span><span class="pr-of-num">Unidades</span></div>` +
        g.sublotes.sort((a, b) => String(a.lote).localeCompare(String(b.lote), 'es', { numeric: true })).map(s =>
          `<div class="pr-of-fila pr-of-stock"><span class="pr-producido__sublote">${esc(s.lote)}</span>` +
          `<span class="pr-of-num">${esc(textoEntero(s.cajas))}</span>` +
          `<span class="pr-of-num">${esc(textoEntero(s.unidades))}</span></div>`).join('') +
        `</div>`).join('')
    }

    function conectarHistorial() {
      document.getElementById('pr-historial-volver').addEventListener('click', abrirMenu)
      document.getElementById('pr-stock-volver').addEventListener('click', abrirMenu)
      document.getElementById('pr-historial-detalle-volver').addEventListener('click', () => {
        document.getElementById('pr-historial-detalle').hidden = true
        document.getElementById('pr-historial-listado').hidden = false
      })
      const cambio = (campo) => (ev) => { estado.historial[campo] = ev.target.value; estado.historial.desdePendientes = false; pintarMenuActivo(); cargarHistorial() }
      document.getElementById('pr-historial-unidad').addEventListener('change', cambio('unidadId'))
      document.getElementById('pr-historial-desde').addEventListener('change', cambio('desde'))
      document.getElementById('pr-historial-hasta').addEventListener('change', cambio('hasta'))
      document.getElementById('pr-historial-maquina').addEventListener('change', cambio('maquina'))
      document.getElementById('pr-historial-estado').addEventListener('change', cambio('estado'))
      document.getElementById('pr-historial-lista').addEventListener('click', ev => {
        const b = ev.target.closest('[data-historial-turno]'); if (b) abrirDetalleHistorial(b.dataset.historialTurno)
      })
      // Corregir, borrar y anotar paradas de una planilla CERRADA.
      document.getElementById('pr-historial-detalle-cuerpo').addEventListener('click', ev => {
        if (ev.target.closest('#pr-historial-anotar-parada')) return abrirEditorDesdeHistorial('anotar')
        const e = ev.target.closest('[data-parada-editar]'); if (e) return abrirEditorDesdeHistorial('editar', e.dataset.paradaEditar)
        const b = ev.target.closest('[data-parada-borrar]'); if (b) return abrirEditorDesdeHistorial('borrar', b.dataset.paradaBorrar)
        const sc = ev.target.closest('[data-sublote-corregir]'); if (sc) return abrirCorreccionSublote(sc.dataset.subloteCorregir, 'corregir')
        const sa = ev.target.closest('[data-sublote-anular]'); if (sa) return abrirCorreccionSublote(sa.dataset.subloteAnular, 'anular')
        if (ev.target.closest('#pr-hist-corr-cancelar')) return cerrarCorreccionSublote()
        if (ev.target.closest('#pr-hist-corr-guardar')) return guardarCorreccionSublote()
      })
      // Lo que se escribe en la corrección va al ESTADO en cada tecla: un
      // repintado (el error, "Guardando…") no lo pierde.
      document.getElementById('pr-historial-detalle-cuerpo').addEventListener('input', ev => {
        const e = estado.corrigeHist; if (!e) return
        if (ev.target.id === 'pr-hist-corr-motivo') e.motivo = ev.target.value
        if (ev.target.id === 'pr-hist-corr-cajas') e.cajas = leerCampoNumero(ev.target)
      })
      document.getElementById('pr-stock-unidad').addEventListener('change', ev => { estado.stockUnidad = ev.target.value; cargarStockTerminado() })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    // Sin permiso se dice y se vuelve al dashboard: quedarse en una pantalla
    // vacía no le dice a nadie por qué no ve nada.
    function sinAcceso(texto) {
      document.getElementById('pr-cargando').hidden = true
      const el = document.getElementById('pr-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    // La fábrica de pruebas NO aparece para una cuenta real: ni su unidad en
    // ninguna lista de unidades, ni sus personas en ninguna lista de personas.
    // El servidor no lo filtra (personal_produccion trae a todo el personal
    // activo, sin unidad), así que se filtra acá, donde se ARMAN las listas.
    // Una cuenta de la fábrica de pruebas (la tablet y la gestión del robot)
    // las ve igual: sinUnidadesDePrueba / sinPersonasDePrueba no sacan nada.
    function mapaDeUnidades(filas, fabrica) {
      return new Map(sinUnidadesDePrueba(filas ?? [], fabrica).map(u => [u.id, u.nombre]))
    }
    function personalSinPruebas(filas) {
      return sinPersonasDePrueba(filas ?? [], estado.fabrica)
    }

    async function cargarPermisos(pFabrica = Promise.resolve(FABRICA_SIN_DATOS)) {
      const { data: emp, error } = await supabase
        .from('empleados').select('id, rol_app, nombre')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.miEmpleadoId = emp.id
      estado.miRolApp = emp.rol_app
      // Para la hoja de PINes: "generados … por Federico Silva".
      estado.miNombre = emp.nombre ?? null
      const { data: tareas, error: e2 } = await supabase
        .from('empleado_tareas').select('tarea, alcance')
        .eq('empleado_id', emp.id).eq('modulo', 'produccion').eq('habilitado', true)
      if (e2) throw e2
      estado.misTareas = new Map((tareas ?? []).map(t => [t.tarea, t.alcance ?? null]))
      const { data: unidades, error: e3 } = await supabase
        .from('unidades_negocio').select('id, nombre').eq('activo', true).order('nombre')
      if (e3) throw e3
      // cargarFabricaDePruebas nunca tira: si falla, no se saca nada.
      estado.fabrica = await pFabrica
      estado.unidades = mapaDeUnidades(unidades, estado.fabrica)
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      // En paralelo con los permisos: no frena el arranque.
      const pFabrica = cargarFabricaDePruebas(supabase)
      try {
        await cargarPermisos(pFabrica)
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }
      // Una cuenta de DISPOSITIVO (la de una tablet) va a la planta. Si
      // mi_sesion_produccion falla no se redirige a ciegas: se sigue, y los
      // permisos deciden qué se ve (la tablet no tiene ver ni configurar).
      try {
        const { data: ses, error } = await supabase.rpc('mi_sesion_produccion')
        if (error) throw error
        if (ses && ses.es_dispositivo === true) { window.location.replace('produccion.html'); return }
      } catch (err) {
        console.error('mi_sesion_produccion:', err)
      }
      if (!puedeVerGestion()) {
        sinAcceso(tieneTarea('cargar')
          ? 'Tu usuario carga desde la tablet de la planta: acá no hay nada que ver. Te llevamos al inicio…'
          : 'No tenés acceso a Producción. Te llevamos al inicio…')
        return
      }
      await cargarPermisoStock()
      await cargarPermisoRetiros()
      document.getElementById('pr-cargando').hidden = true
      document.getElementById('pr-vista').hidden = false
      conectarTodo()
      if (window.lucide) window.lucide.createIcons()

      // La unidad de la gestión: la guardada si todavía se puede, si no la primera.
      estado.unidadId = unidadGestionInicial(unidadesDeGestion(), leerPreferencia(CLAVE_UNIDAD_GESTION))
      pintarSelectorGestion()
      pintarAccesosOficina()
      cargarBurbujaConos()
      mostrarInicioOficina()
    }

    init()
  </script>
