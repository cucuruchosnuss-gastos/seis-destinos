      const muestra = activo ? (f.buffer ? f.buffer.padEnd(4, '·').replace(/^(..)(..)$/, '$1:$2') : '··:··') : (normalizarHora(valor) || '—')
      return `<div class="pr-hp__fila"><span class="pr-hp__rotulo">${esc(rotulo)}</span>` +
        `<button type="button" class="pr-hp__paso" data-hora-paso="${esc(clave)}" data-minutos="-5" aria-label="${esc(rotulo)}: 5 minutos menos">−</button>` +
        `<button type="button" class="pr-hp__num" data-hora-tocar="${esc(clave)}" aria-pressed="${activo ? 'true' : 'false'}" aria-label="${esc(rotulo)}: ${esc(normalizarHora(valor) || 'sin hora')}. Tocá para escribirla">${esc(muestra)}</button>` +
        `<button type="button" class="pr-hp__paso" data-hora-paso="${esc(clave)}" data-minutos="5" aria-label="${esc(rotulo)}: 5 minutos más">+</button></div>`
    }

    // El teclado propio de las horas: nunca el del sistema.
    function htmlTecladoHora() {
      let out = '<div class="pr-hp__teclado" role="group" aria-label="Teclado de la hora">'
      for (let d = 1; d <= 9; d++) out += `<button type="button" class="pr-hp__tecla" data-hora-tecla="${d}">${d}</button>`
      out += '<button type="button" class="pr-hp__tecla" data-hora-tecla="borrar">Borrar</button>'
      out += '<button type="button" class="pr-hp__tecla" data-hora-tecla="0">0</button>'
      out += '<button type="button" class="pr-hp__tecla pr-hp__tecla--accion" data-hora-tecla="listo">Listo</button>'
      return out + '</div>'
    }

    // En qué día cae lo que está escrito, para que se vea cuando no es el del
    // turno (una parada de la noche que siguió después de medianoche).
    function textoDiaParada(f) {
      const h = resolverHorasParada(f, f.turno)
      if (h.error) return ''
      const dIni = h.inicio.slice(0, 10), dFin = h.fin ? h.fin.slice(0, 10) : dIni
      const diaTurno = f.turno.fecha
      if (dIni === diaTurno && dFin === diaTurno) return ''
      return `Paró el ${fechaDelDia(dIni)}${h.fin ? ` y volvió el ${fechaDelDia(dFin)}` : ''}.`
    }

    function htmlHorasParada(f) {
      if (f.modo === 'borrar') return ''
      const sigue = puedeSeguirParada(f)
        ? `<button type="button" class="pr-hp__sigue" data-hora-sigue="1" aria-pressed="${f.sigue ? 'true' : 'false'}">Todavía no volvió</button>`
        : ''
      const vuelta = f.sigue ? '' : htmlCampoHora('fin', 'Volvió a las', f.fin, f)
      const dia = textoDiaParada(f)
      return '<div class="pr-hp">' + htmlCampoHora('inicio', 'Paró a las', f.inicio, f) + vuelta + sigue +
        (dia ? `<p class="pr-hp__dia">${esc(dia)}</p>` : '') +
        (f.teclado ? htmlTecladoHora() : '') + '</div>'
    }

    function tituloEditorParada(f) {
      if (f.modo === 'anotar') return 'Anotar una parada'
      if (f.modo === 'editar') return 'Corregir la parada'
      return 'Borrar la parada'
    }

    // EL ERROR VA AL ESTADO, NO AL DOM: el único que escribe el mensaje es este
    // render, que decide entre lo que falta y lo que contestó la base. Así un
    // repintado no tapa el error de la base (lo que pasó en el cierre).
    function pintarEditorParada() {
      const f = estado.paradaForm
      if (!f) return
      document.getElementById('pr-parada-editor-titulo').textContent = tituloEditorParada(f)
      const resumen = document.getElementById('pr-parada-editor-resumen')
      if (f.modo === 'borrar' && f.parada) {
        const desde = horaArgentina(f.parada.inicio) || '—'
        const hasta = f.parada.fin ? (horaArgentina(f.parada.fin) || '—') : 'sigue'
        resumen.innerHTML = `<p class="pr-hp__resumen">${esc(desde)}–${esc(hasta)} · ${esc(f.parada.motivo)}</p>`
      } else {
        resumen.innerHTML = ''
      }
      const cerrada = f.turno.estado === 'cerrado'
      document.getElementById('pr-parada-editor-campo-motivo').hidden = f.modo === 'borrar' && !cerrada
      document.getElementById('pr-parada-editor-motivo-rotulo').textContent = f.modo === 'borrar'
        ? '¿Por qué se borra? (la planilla ya está cerrada)' : 'Motivo'
      document.getElementById('pr-parada-editor-horas').innerHTML = htmlHorasParada(f)
      const faltan = faltanParaParada(f)
      const texto = f.errorBase || (f.intentado && faltan.length ? faltan[0] : '')
      const errEditor = document.getElementById('pr-parada-editor-error')
      errEditor.textContent = texto
      errEditor.hidden = !texto
      const btn = document.getElementById('pr-parada-editor-guardar')
      btn.textContent = f.modo === 'borrar' ? 'Borrar la parada' : 'Guardar'
      document.getElementById('pr-parada-editor-a-borrar').hidden = !(f.modo === 'editar' && f.puedeBorrar)
      btn.className = f.modo === 'borrar' ? 'pr-btn pr-btn--peligro' : 'pr-btn pr-btn--accion'
      // El botón se traba SOLO mientras se manda: lo que falta se dice al
      // tocarlo. Deshabilitarlo por lo que falta haría inalcanzable el error.
      btn.disabled = !!f.enviando
    }

    function cambiarHoraParada(clave, minutos) {
      const f = estado.paradaForm
      if (!f || f.modo === 'borrar') return
      tocar()
      f[clave] = horaConPaso(normalizarHora(f[clave]) || horaDeReferencia(f.turno), minutos)
      f.teclado = null
      f.errorBase = ''
      pintarEditorParada()
    }

    function tocarHoraParada(clave) {
      const f = estado.paradaForm
      if (!f) return
      tocar()
      f.teclado = f.teclado === clave ? null : clave
      f.buffer = ''
      pintarEditorParada()
    }

    // 3 o 4 números: "930" es 09:30 y "1745" es 17:45. Lo que no es una hora
    // de verdad no se escribe.
    function teclaHoraParada(t) {
      const f = estado.paradaForm
      if (!f || !f.teclado) return
      tocar()
      if (t === 'borrar') f.buffer = f.buffer.slice(0, -1)
      else if (t === 'listo') {
        if (f.buffer) {
          const h = normalizarHora(f.buffer)   // "930" ya es 09:30 para normalizarHora
          if (h) { f[f.teclado] = h; f.errorBase = '' }
          else { f.errorBase = 'Esa hora no existe. Escribila con 4 números, por ejemplo 0930.' }
        }
        f.teclado = null
        f.buffer = ''
      } else if (/^[0-9]$/.test(t) && f.buffer.length < 4) f.buffer += t
      pintarEditorParada()
    }

    function alternarSigueParada() {
      const f = estado.paradaForm
      if (!f || !puedeSeguirParada(f)) return
      tocar()
      f.sigue = !f.sigue
      if (f.teclado === 'fin') f.teclado = null
      f.errorBase = ''
      pintarEditorParada()
    }

    function parametrosParada(f, horas) {
      const motivo = String(f.motivo ?? '').trim()
      if (f.modo === 'anotar') return ['registrar_parada', { p_turno_id: f.turno.id, p_motivo: motivo, p_inicio: horas.inicio, p_fin: horas.fin }]
      if (f.modo === 'editar') return ['editar_parada', { p_parada_id: f.paradaId, p_motivo: motivo, p_inicio: horas.inicio, p_fin: horas.fin }]
      return ['borrar_parada', { p_parada_id: f.paradaId, p_motivo: f.turno.estado === 'cerrado' ? motivo : null }]
    }

    async function guardarParada() {
      const f = estado.paradaForm
      if (!f || f.enviando) return
      f.motivo = document.getElementById('pr-parada-editor-motivo').value
      f.intentado = true
      f.errorBase = ''
      const faltan = faltanParaParada(f)
      if (faltan.length) return pintarEditorParada()
      const horas = f.modo === 'borrar' ? null : resolverHorasParada(f, f.turno)
      const [rpc, params] = parametrosParada(f, horas)
      f.enviando = true
      pintarEditorParada()
      try {
        const { error } = await supabase.rpc(rpc, params)
        if (error) throw error
      } catch (e) {
        console.error(rpc + ':', e)
        f.enviando = false
        // El mensaje de la base TAL CUAL: ya viene escrito para una persona.
        f.errorBase = e?.message || 'No se pudo guardar la parada. Revisá la conexión y probá de nuevo.'
        return pintarEditorParada()
      }
      const { contexto, turno, modo } = f
      cerrarEditorParada()
      mostrarExito(modo === 'borrar' ? 'Parada borrada.' : 'Parada guardada.')
      // En la gestión el editor solo se abre desde el historial.
      if (contexto === 'historial') return abrirDetalleHistorial(turno.id)
    }

    // En el historial, SOLO en una planilla CERRADA y con los permisos que
    // piden las RPCs en esa unidad: corregir o anotar exige cargar Y
    // configurar (editar_parada y registrar_parada piden cargar siempre, y
    // configurar si está cerrada); borrar, configurar. Las abiertas se
    // manejan desde la planilla.
    function accionesParadaHistorial(turno) {
      if (!turno || turno.estado !== 'cerrado') return { editar: false, borrar: false }
      const u = turno.unidad_negocio_id
      const configura = unidadesCon('configurar').includes(u)
      const carga = unidadesCon('cargar').includes(u)
      return { editar: configura && carga, borrar: configura }
    }

    function abrirEditorDesdeHistorial(modo, paradaId = null) {
      const d = estado.detalleHistorial
      if (!d) return
      const acc = accionesParadaHistorial(d.turno)
      if (modo === 'borrar' ? !acc.borrar : !acc.editar) return
      const parada = paradaId ? (d.paradas ?? []).find(x => x.id === paradaId) ?? null : null
      if (paradaId && !parada) return
      abrirEditorParada({ modo, turno: d.turno, paradas: d.paradas, parada, contexto: 'historial', puedeBorrar: acc.borrar })
    }

    function teclaEditorParada(ev) {
      if (!estado.paradaForm) return
      if (ev.key === 'Escape') { ev.preventDefault(); cerrarEditorParada(); return }
      if (ev.key !== 'Tab') return
      const panel = document.getElementById('pr-parada-editor')
      const focos = [...panel.querySelectorAll('button:not([disabled]), input:not([disabled])')]
      if (!focos.length) return
      const i = focos.indexOf(document.activeElement)
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); focos[focos.length - 1].focus() }
      else if (!ev.shiftKey && i === focos.length - 1) { ev.preventDefault(); focos[0].focus() }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL EMPAQUE — la caja, el embolsado y lo que consume un renglón
    // ═══════════════════════════════════════════════════════════════════════
    //
    // La pantalla NO descuenta nada: lo hace registrar_produccion_item con
    // _descontar_empaque. Lo de acá es para ELEGIR (la caja y el embolsado) y
    // para DECIR lo que se va a consumir, con la MISMA regla de la base:
    // 1 caja de cartón por caja producida, y cada renglón de
    // presentacion_empaque 'siempre', o 'bolsa_grande' si el embolsado es
    // grande o doble, o 'bolsa_individual' si es individual o doble.

    const EMBOLSADOS = [
      { valor: 'grande', texto: 'Bolsa grande' },
      { valor: 'individual', texto: 'Bolsitas individuales' },
      { valor: 'doble', texto: 'Las dos' },
      { valor: 'ninguno', texto: 'Sin bolsa' },
    ]
    const TEXTO_EMBOLSADO = { grande: 'bolsa grande', individual: 'bolsitas individuales', doble: 'doble bolsa', ninguno: 'sin bolsa' }

    // "Caja N°1 Nuss": nombre y marca, que es lo que distingue las tres Caja N°1.
    function textoInsumoEmpaque(ins) {
      if (!ins) return 'insumo sin nombre'
      return ins.marca ? `${ins.nombre} ${ins.marca}` : String(ins.nombre ?? '')
    }

    // La normalización de TODOS los buscadores del módulo: sin acentos y en
    // minúsculas. textoPlano() NO recorta los bordes, para poder aplicarla
    // carácter por carácter sin que un espacio del medio desaparezca (lo usa
    // tramoCoincidencia); normalizarBusqueda() es esa misma, recortada, que es
    // lo que hace falta para comparar. Una sola regla, en un solo lugar: dos
    // normalizaciones conviviendo es exactamente cómo alguien usa la
    // equivocada.
    function textoPlano(t) {
      return String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    }

    function normalizarBusqueda(t) {
      return textoPlano(t).trim()
    }

    // Un producto es de chocolate por su TIPO DE MASA, que es el mismo dato con
    // el que la sala elige la receta. No se adivina por el nombre.
    function esProductoChocolate(p) {
      return normalizarBusqueda(p?.tipo_masa).includes('chocolate')
    }

    // Los comunes arriba y los de chocolate abajo, separados: es como se piden
    // en la fábrica, y es lo que evita tocar "Mini" cuando se quería "Mini
    // chocolate".
    function productosPorMasa(cat) {
      const todos = cat?.productos ?? []
      return { comunes: todos.filter(p => !esProductoChocolate(p)), chocolate: todos.filter(p => esProductoChocolate(p)) }
    }

    // Genérica: la usan también las listas de Configuración (conos e
    // insumos), que tienen sus propios criterios. No filtra estados.
    function marcasFiltradas(marcas, texto) {
      const q = normalizarBusqueda(texto)
      if (!q) return marcas ?? []
      return (marcas ?? []).filter(m => normalizarBusqueda(m.nombre).includes(q))
    }

    // "9:5" no es una hora; "9:05" sí y se guarda como "09:05". Lo que no sea
    // una hora del día devuelve '' y no se manda.
    function normalizarHora(t) {
      const m = /^\s*(\d{1,2})\s*[:.]?\s*(\d{2})\s*$/.exec(String(t ?? ''))
      if (!m) return ''
      const h = Number(m[1]), min = Number(m[2])
      if (h > 23 || min > 59) return ''
      return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`
    }

    // La hora de a 5 minutos, dando la vuelta en medianoche.
    function horaConPaso(hora, minutos) {
      const base = normalizarHora(hora)
      if (!base) return ''
      const total = ((Number(base.slice(0, 2)) * 60 + Number(base.slice(3)) + minutos) % 1440 + 1440) % 1440
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SALA DE MASA — cantidades y diferencias contra la receta
    // ═══════════════════════════════════════════════════════════════════════

    // Kilos con hasta 3 decimales, sin ruido de coma flotante.
    function redondearKg(n) {
      return Math.round(n * 1000) / 1000
    }

    // Diferencia contra la original, en gramos, solo los que cambian.
    function diferencias(cantidades, original) {
      const out = []
      for (const it of original.items) {
        const g = Math.round(((cantidades[it.ingrediente_id] ?? 0) - Number(it.cantidad_kg)) * 1000)
        if (g !== 0) out.push({ ingrediente_id: it.ingrediente_id, nombre: it.ingrediente, gramos: g })
      }
      return out
    }

    function textoGramos(g) {
      return `${g > 0 ? '+' : '−'}${formatearNumeroAr(Math.abs(g), { decimales: 0 })} g`
    }

    function textoDiferencias(difs, max = Infinity) {
      if (!difs.length) return 'Igual a la original'
      const partes = difs.slice(0, max).map(d => `${textoGramos(d.gramos)} ${d.nombre}`)
      return partes.join(' · ') + (difs.length > max ? ' · …' : '')
    }

    function textoKg(kg) {
      return `${formatearNumeroAr(kg, { decimales: 3, minimos: 0 })} kg`
    }

    // La diferencia de una masa YA REGISTRADA contra SU receta (la versión con
    // la que se hizo, no la vigente de hoy). La usa el detalle del turno en el
    // historial.
    function diferenciaDeMasa(masa, datos) {
      const nombres = new Map(datos.ingredientes.map(i => [i.id, i.nombre]))
      const original = {
        items: datos.recItems.filter(r => r.receta_id === masa.receta_id)
          .map(r => ({ ingrediente_id: r.ingrediente_id, ingrediente: nombres.get(r.ingrediente_id) ?? 'ingrediente', cantidad_kg: r.cantidad_kg })),
      }
      const cantidades = {}
      for (const it of datos.items.filter(x => x.masa_id === masa.id)) cantidades[it.ingrediente_id] = Number(it.cantidad_simple_kg)
      return diferencias(cantidades, original)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CONFIGURACIÓN (produccion:configurar), por unidad
    // ═══════════════════════════════════════════════════════════════════════

    const PESTANAS_CONFIG = [
      ['maquinas', 'Máquinas'], ['recetas', 'Recetas'], ['ingredientes', 'Ingredientes'],
      ['productos', 'Productos'], ['empaque', 'Empaque'], ['marcas', 'Marcas / Conos'], ['personal', 'Personal y PINes'],
    ]
    const PUESTOS = [['encargado', 'Encargado'], ['masero', 'Masero'], ['operario', 'Operario']]
    const CLAVE_AVISO_PRODUCTOS = 'produccion.aviso-productos-revisado'

    // ── La unidad de la gestión ──────────────────────────────────────────
    //
    // Una sola para toda la gestión: los indicadores, y con la que abren el
    // historial, el stock terminado y la configuración. Las posibles son las
    // de produccion:ver y las de :configurar, con la MISMA regla que
    // tiene_tarea_alcance() (unidadesCon). Se recuerda en este navegador, con
    // try/catch: sin storage se elige la primera y listo.
    const CLAVE_UNIDAD_GESTION = 'produccion.gestion.unidad'

    function unidadesDeGestion() {
      return unidadesDeHistorial()
    }

    function unidadGestionInicial(unidades, guardada) {
      if (guardada && unidades.includes(guardada)) return guardada
      return unidades[0] ?? null
    }

    function pintarSelectorGestion() {
      const unidades = unidadesDeGestion()
      const sel = document.getElementById('pr-gestion-unidad')
      sel.innerHTML = unidades.map(id => `<option value="${esc(id)}"${id === estado.unidadId ? ' selected' : ''}>${esc(estado.unidades.get(id) ?? id)}</option>`).join('')
      sel.value = estado.unidadId ?? ''
      // En la compu, un segmentado (diseño 1a); en el celular, el select
      // ("Cucuruchos Nuss ▾", 1b). Los dos dicen lo mismo y lo decide el CSS.
      document.getElementById('pr-gestion-unidad-seg').innerHTML = unidades.map(id =>
        `<button type="button" class="pg-seg__op" data-gestion-unidad="${esc(id)}" aria-pressed="${id === estado.unidadId ? 'true' : 'false'}">${esc(estado.unidades.get(id) ?? id)}</button>`).join('')
      document.getElementById('pr-gestion-unidad-campo').hidden = unidades.length < 2
    }

    function elegirUnidadGestion(id) {
      if (!unidadesDeGestion().includes(id)) return false
      estado.unidadId = id
      guardarPreferencia(CLAVE_UNIDAD_GESTION, id)
      // Lo que se abra después, abre en esta unidad. La configuración con
      // cambios sin guardar se queda donde está: esos cambios son de su unidad.
      if (estado.historial) estado.historial.unidadId = id
      const configEnOtra = estado.config && estado.config.unidadId !== id && !cambiosSinGuardar(estado.config) && unidadesDeConfig().includes(id)
      if (configEnOtra) { estado.config.unidadId = id; estado.config.recetaMaquina = null }
      estado.stockUnidad = id
      // El número de planillas pendientes del menú era de la otra unidad.
      estado.indicadores = null
      pintarNumerosMenu()
      pintarSelectorGestion()
      pintarCabecera()
      // La sección que se está mirando pasa a la unidad nueva en el acto.
      if (estado.vista === 'pr-inicio') cargarIndicadores()
      else if (estado.vista === 'pr-historial') {
        pintarSelectorUnidad('pr-historial-unidad', unidadesDeHistorial(), id)
        document.getElementById('pr-historial-detalle').hidden = true
        document.getElementById('pr-historial-listado').hidden = false
        cargarHistorial()
      } else if (estado.vista === 'pr-stock') {
        pintarSelectorUnidad('pr-stock-unidad', unidadesDeHistorial(), id)
        cargarStockTerminado()
      } else if (estado.vista === 'pr-config' && configEnOtra) {
        pintarSelectorUnidad('pr-config-unidad', unidadesDeConfig(), id)
        cargarPestanaConfig()
      }
      return true
    }

    // ── Los indicadores (indicadores_produccion) ─────────────────────────
    //
    // UNA TARJETA POR BLOQUE, y cada una se dibuja sola: TARJETAS_INDICADORES
    // es un arreglo de { id, titulo, render(datos), contexto(datos), ancha }
    // que se recorre, así que una tarjeta nueva es UNA entrada más. render()
    // devuelve el HTML de su bloque, o null si el bloque vino null o con otra
    // forma: esa tarjeta dice "Esta tarjeta no se pudo cargar" con Reintentar
    // y las demás se ven igual. Si la RPC entera falla, cada tarjeta dice el
    // error, pegado a su Reintentar.
    //
    // EL ORDEN DEL ARREGLO ES EL DEL CELULAR (decisión de Facu, 26/09/2026):
    // primero lo que se mira varias veces por día — Ahora · Hoy · Pendientes
    // · Semana · Rendimiento — y después el scrap. En la compu la grilla de 3
    // columnas pone las mismas tarjetas en ese orden de izquierda a derecha,
    // que es el orden del diseño (1a): no hay un `order` por CSS.
    //
    // NUNCA un cero de un null: un dato que falta dice "—".

    function numeroInd(v) {
      if (v === null || v === undefined || v === '') return null
      const n = Number(v)
      return Number.isFinite(n) ? n : null
    }

    function enteroInd(v) {
      return formatearNumeroAr(numeroInd(v), { decimales: 0 })
    }

    // La diferencia con su flecha, así la dirección no depende del color:
    // "▲ +7", "▼ −3", "= 0", o "—" si falta cualquiera de los dos.
    function diferenciaInd(hoy, antes) {
      const a = numeroInd(hoy), b = numeroInd(antes)
      if (a === null || b === null) return { texto: '—', clase: '' }
      const d = a - b
      if (d === 0) return { texto: '= 0', clase: 'pr-ind-igual' }
      return { texto: `${d > 0 ? '▲ +' : '▼ −'}${formatearNumeroAr(Math.abs(d), { decimales: 0 })}`, clase: d > 0 ? 'pr-ind-mas' : 'pr-ind-menos' }
    }

    // Minutos → "2 h 15 min" / "40 min"; null → "—".
    function horasMinutosInd(v) {
      const m = numeroInd(v)
      if (m === null || m < 0) return '—'
      const t = Math.round(m)
      if (t < 60) return `${t} min`
      return `${Math.floor(t / 60)} h ${t % 60} min`
    }

    // Scrap como % de la masa: masa en 0 o sin dato → "—".
    function porcentajeScrapInd(scrap, masa) {
      const s = numeroInd(scrap), m = numeroInd(masa)
      if (s === null || m === null || m <= 0) return '—'
      return `${formatearNumeroAr((s / m) * 100, { decimales: 1 })} %`
    }

    // Una tarjeta sin datos mantiene su título y dice qué pasó, en una línea
    // grande y una de contexto. Sin ceros ni barras vacías (diseño 1d).
    function htmlSinDatosInd(que, contexto = '') {
      return `<div class="pg-ind-sin"><p class="pg-ind-sin__que">${esc(que)}</p>${contexto ? `<p class="pg-ind-sin__ctx">${esc(contexto)}</p>` : ''}</div>`
    }

    const DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado']

    // El día de la semana de un 'aaaa-mm-dd', o null.
    function diaSemanaInd(iso) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso ?? ''))) return null
      const d = new Date(`${iso}T12:00:00Z`)
      return Number.isNaN(d.getTime()) ? null : DIAS_SEMANA[d.getUTCDay()]
    }

    // "Jueves 25/09" (con mayúscula) de un 'aaaa-mm-dd'.
    function textoDiaInd(iso) {
      const dia = diaSemanaInd(iso)
      if (!dia) return ''
      return `${dia[0].toUpperCase()}${dia.slice(1)} ${iso.slice(8, 10)}/${iso.slice(5, 7)}`
    }

    // "lun 22" de un 'aaaa-mm-dd'.
    function diaCortoInd(iso) {
      const dia = diaSemanaInd(iso)
      return dia ? `${dia.slice(0, 3)} ${iso.slice(8, 10)}` : ''
    }

    // La fecha de los indicadores: la que devolvió la base, o la elegida, o hoy.
    function fechaInd(d) {
      return d?.fecha ?? estado.fechaInd ?? hoyArgentina()
    }

    // AHORA: las máquinas abiertas (y las pendientes de completar). LAS
    // PARADAS PRIMERO, en bordó, con el chip PARADA: el color no va solo.
    function tieneParadaInd(m) {
      return !!(m?.parada_en_curso && typeof m.parada_en_curso === 'object')
    }

    function renderAhora(d) {
      const lista = d?.ahora
      if (!Array.isArray(lista)) return null
      if (!lista.length) return htmlSinDatosInd('Ninguna máquina abierta', 'Cuando el encargado abra un turno en la tablet de la planta, aparece acá.')
      const ahora = new Date()
      const orden = [...lista.filter(tieneParadaInd), ...lista.filter(m => !tieneParadaInd(m))]
      return '<ul class="pr-ind__lista">' + orden.map(m => {
        const p = tieneParadaInd(m) ? m.parada_en_curso : null
        const pendiente = m?.estado === 'pendiente_completar'
        const clase = p ? 'parada' : (pendiente ? 'pendiente' : 'abierta')
        const masas = numeroInd(m?.masas), cajas = numeroInd(m?.cajas)
        const textoMasas = `${enteroInd(masas)} ${masas === 1 ? 'masa' : 'masas'}`
        const textoCajas = `${enteroInd(cajas)} ${cajas === 1 ? 'caja' : 'cajas'}`
        const quien = [m?.turno, m?.encargado].filter(Boolean).map(esc).join(' · ')
        const hace = p ? duracionTexto(p.desde, null, ahora) : ''
        const parada = p
          ? `<div class="pr-ind-parada">${hace ? `Hace ${esc(hace)} · ` : ''}desde las ${esc(horaArgentina(p.desde) || '—')} · ${esc(p.motivo ?? '')}</div>`
          : ''
        const chip = p ? '<span class="pg-chip pg-chip--parada">PARADA</span>'
          : (pendiente ? '<span class="pr-ind-chip">Pendiente de completar</span>' : `<span class="pg-maq__cajas">${esc(textoCajas)}</span>`)
        const dato = [quien, esc(textoMasas), p || pendiente ? esc(textoCajas) : ''].filter(Boolean).join(' · ')
        return `<li class="pr-ind-maq pr-ind-maq--${clase}">` +
          `<div class="pg-maq__fila"><span class="pr-ind-maq__que">${esc(m?.maquina ?? 'Máquina')} · lote ${esc(m?.lote ?? '—')}</span>${chip}</div>` +
          parada + `<div class="pr-ind-maq__dato">${dato}</div></li>`
      }).join('') + '</ul>'
    }

    function contextoAhora(d) {
      const lista = Array.isArray(d?.ahora) ? d.ahora : null
      if (!lista || !lista.length) return ''
      const abiertas = lista.filter(m => m?.estado !== 'pendiente_completar').length
      const pend = lista.length - abiertas
      return [abiertas ? `${abiertas} ${abiertas === 1 ? 'máquina abierta' : 'máquinas abiertas'}` : '',
        pend ? `${pend} ${pend === 1 ? 'pendiente' : 'pendientes'}` : ''].filter(Boolean).join(' · ')
    }

    // HOY contra el mismo día de la semana pasada. En cajas_por_producto un
    // null NO es "no se sabe": la base suma con `sum(...) filter (where ...)`
    // sobre los renglones de ESE día (pg_get_functiondef, 26/09/2026), y sin
    // ningún renglón la suma da null — o sea, ese día ese producto no salió.
    // Por eso acá (y solo acá) null cuenta como cero cajas: se muestra "—" en
    // las cajas y la diferencia se calcula (diseño 1a: "Barquillo — ▼ −2").
    // Un valor que no es un número sigue siendo "no se sabe": "—".
    function cajasDelDiaInd(v) {
      if (v === null || v === undefined) return 0
      return numeroInd(v)
    }

    function sumaInd(valores) {
      let t = 0
      for (const v of valores) { if (v === null) return null; t += v }
      return t
    }

    function htmlDiferenciaInd(dif) {
      return `<span class="pg-dif${dif.clase ? ` ${dif.clase}` : ''}">${esc(dif.texto)}</span>`
    }

    function renderHoy(d) {
      const lista = d?.cajas_por_producto
      if (!Array.isArray(lista)) return null
      const filas = lista.map(f => ({ producto: f?.producto, hoy: cajasDelDiaInd(f?.hoy), antes: cajasDelDiaInd(f?.semana_pasada), salio: f?.hoy != null }))
      const totalHoy = sumaInd(filas.map(f => f.hoy)), totalAntes = sumaInd(filas.map(f => f.antes))
      const dia = diaSemanaInd(fechaInd(d)) ?? 'mismo día'
      const esHoy = fechaInd(d) === hoyArgentina()
      if (!filas.some(f => f.salio)) {
        const antes = totalAntes === null ? '' : (totalAntes > 0
          ? `El ${dia} pasado salieron ${formatearNumeroAr(totalAntes, { decimales: 0 })} ${totalAntes === 1 ? 'caja' : 'cajas'}.`
          : `El ${dia} pasado tampoco.`)
        return htmlSinDatosInd(esHoy ? 'Hoy no se produjo' : 'Ese día no se produjo', antes)
      }
      const total = diferenciaInd(totalHoy, totalAntes)
      return `<div class="pg-total"><span class="pg-total__n">${esc(enteroInd(totalHoy))}</span><span class="pg-total__u">cajas</span>${htmlDiferenciaInd(total)}</div>` +
        '<ul class="pg-prods">' + filas.map(f =>
          `<li class="pg-prod"><span class="pg-prod__nombre">${esc(f.producto ?? '—')}</span>` +
          `<span class="pg-prod__cajas">${f.salio ? `${esc(enteroInd(f.hoy))}<span class="pg-prod__u"> cajas</span>` : '—'}</span>` +
          `${htmlDiferenciaInd(diferenciaInd(f.hoy, f.antes))}</li>`).join('') + '</ul>'
    }

    function contextoHoy(d) {
      const dia = diaSemanaInd(fechaInd(d))
      return dia ? `vs. ${dia} pasado` : ''
    }

    // SEMANA: los últimos 7 días.
    function renderSemana(d) {
      const s = d?.semana
      if (!s || typeof s !== 'object' || Array.isArray(s)) return null
      if (numeroInd(s.turnos) === 0) return htmlSinDatosInd('Sin producción esta semana', 'En los últimos 7 días no se abrió ningún turno.')
      const masas = numeroInd(s.masas)
      const mod = numeroInd(s.masas_modificadas), choco = numeroInd(s.masas_chocolate)
      const notaMasas = masas === null ? '' : `${enteroInd(mod)} ${mod === 1 ? 'modificada' : 'modificadas'} · ${enteroInd(choco)} de chocolate`
      const scrap = numeroInd(s.scrap_kg)
      const renglon = (rotulo, valor, nota) => `<li class="pg-renglon"><span class="pg-renglon__rot">${esc(rotulo)}</span>` +
        `<span class="pg-renglon__val"><strong>${esc(valor)}</strong>${nota ? ` · ${esc(nota)}` : ''}</span></li>`
      return `<div class="pg-grande"><div><span class="pg-grande__n">${esc(enteroInd(s.cajas))}</span> cajas</div>` +
        `<div><span class="pg-grande__n">${esc(enteroInd(s.unidades))}</span> unidades</div></div>` +
        '<ul class="pg-renglones">' +
        renglon('Turnos', enteroInd(s.turnos), '') +
        renglon('Masas', enteroInd(s.masas), notaMasas) +
        renglon('Scrap', scrap === null ? '—' : `${formatearNumeroAr(scrap, { decimales: 1, minimos: 0 })} kg`, `${porcentajeScrapInd(s.scrap_kg, s.masa_kg)} de la masa`) +
        renglon('Paradas', horasMinutosInd(s.minutos_parada), s.motivo_parada_mas_comun ? `más común: ${s.motivo_parada_mas_comun}` : 'sin un motivo que se repita') +
        '</ul>'
    }

    function contextoSemana(d) {
      const s = d?.semana
      if (!s || typeof s !== 'object') return ''
      const desde = diaCortoInd(s.desde), hasta = diaCortoInd(s.hasta)
      return desde && hasta ? `${desde} – ${hasta}/${String(s.hasta).slice(5, 7)}` : ''
    }

    // RENDIMIENTO DE LA HARINA, POR PRODUCTO. La base (26/09/2026) devuelve
    // cada lote con las unidades por kilo DE UN PRODUCTO y el promedio de ese
    // producto: un lote se compara SOLO contra su producto — comparar un Mini
    // contra un Grande no dice nada del lote.
    //
    // "RINDE POCO" (decisión de Facu, 26/09/2026): MÁS DE 10% por debajo del
    // promedio de SU producto, o sea diferencia_pct < −10, estricto. Nunca un
    // número fijo. Un diferencia_pct null (el promedio da 0 o no se pudo
    // calcular) no se marca y nunca se pinta como 0.
    const UMBRAL_RINDE_POCO = -10

    function rindePoco(f) {
      const dif = numeroInd(f?.diferencia_pct)
      return dif !== null && dif < UMBRAL_RINDE_POCO
    }

    // Agrupa por producto (en el orden en que llegan) y ordena cada grupo de
    // peor a mejor, con los lotes sin dato al final.
    function gruposRendimiento(lista) {
      const grupos = new Map()
      for (const f of lista) {
        const k = f?.producto ?? '—'
        if (!grupos.has(k)) grupos.set(k, [])
        grupos.get(k).push(f)
      }
      return [...grupos.entries()].map(([producto, filas]) => ({
        producto,
        promedio: numeroInd(filas.find(f => numeroInd(f?.promedio_del_producto) !== null)?.promedio_del_producto),
        filas: [...filas].sort((a, b) => {
          const x = numeroInd(a?.unidades_por_kg), y = numeroInd(b?.unidades_por_kg)
          if (x === null && y === null) return 0
          if (x === null) return 1
          if (y === null) return -1
          return x - y
        }),
      }))
    }

    function renderRendimiento(d) {
      const lista = d?.rendimiento_harina
      if (!Array.isArray(lista)) return null
      if (!lista.length) return htmlSinDatosInd('Sin turnos cerrados con harina', 'En los últimos 30 días no hay turnos cerrados de un solo producto con la harina cargada.')
      const explica = '<p class="pg-rend__explica">Cuántos cucuruchos salen de cada kilo de harina, por lote. <strong>Más es mejor.</strong> ' +
        'Cada lote se compara con el promedio de su producto; en bordó, los que rinden más de 10 % menos.</p>'
      return explica + gruposRendimiento(lista).map(g => {
        const valores = g.filas.map(f => numeroInd(f?.unidades_por_kg)).filter(v => v !== null)
        const max = valores.length ? Math.max(...valores) : null
        const mejor = valores.length >= 2 ? max : null
        const promedio = g.promedio === null ? '—' : `${formatearNumeroAr(g.promedio, { decimales: 1, minimos: 0 })} u/kg`
        return `<div class="pg-rend__grupo"><div class="pg-rend__prod"><strong>${esc(g.producto)}</strong>` +
          `<span class="pg-rend__prom">promedio ${esc(promedio)}</span></div><ul class="pg-rend__lista">` +
          g.filas.map(f => {
            const v = numeroInd(f?.unidades_por_kg)
            const bajo = rindePoco(f)
            const clase = bajo ? 'bajo' : (v !== null && v === mejor ? 'mejor' : 'medio')
            const ancho = v !== null && max > 0 ? Math.max(2, Math.round((v / max) * 100)) : 0
            const fraseRinde = bajo
              ? `<p class="pg-rend__frase">Rinde ${esc(formatearNumeroAr(Math.abs(numeroInd(f.diferencia_pct)), { decimales: 1 }))} % menos que el promedio de ${esc(g.producto)}.</p>`
              : ''
            return `<li class="pg-rend pg-rend--${clase}"><span class="pg-rend__lote">Lote ${esc(f?.lote ?? 'sin lote')}</span>` +
              `<span class="pg-rend__barra">${ancho ? `<span class="pg-rend__relleno" style="width: ${ancho}%"></span>` : ''}</span>` +
              `<span class="pg-rend__valor">${v === null ? '—' : `${esc(formatearNumeroAr(v, { decimales: 1, minimos: 0 }))} u/kg`}</span>${fraseRinde}</li>`
          }).join('') + '</ul></div>'
      }).join('')
    }

    // SCRAP POR LOTE DE HARINA: el % de la masa que terminó en scrap en los
    // turnos que usaron ese lote (30 días). Neutro: no hay un umbral decidido
    // para marcarlo, y un color sin regla sería inventar un juicio.
    function renderScrap(d) {
      const lista = d?.scrap_por_lote
      if (!Array.isArray(lista)) return null
      if (!lista.length) return htmlSinDatosInd('Sin turnos cerrados con harina', 'En los últimos 30 días no hay scrap que repartir por lote.')
      const valores = lista.map(f => numeroInd(f?.scrap_pct)).filter(v => v !== null)
      const max = valores.length ? Math.max(...valores) : null
      return '<ul class="pg-rend__lista">' + lista.map(f => {
        const v = numeroInd(f?.scrap_pct)
        const ancho = v !== null && max > 0 ? Math.max(2, Math.round((v / max) * 100)) : 0
        return `<li class="pg-rend pg-rend--medio"><span class="pg-rend__lote">Lote ${esc(f?.lote ?? 'sin lote')}</span>` +
          `<span class="pg-rend__barra">${ancho ? `<span class="pg-rend__relleno" style="width: ${ancho}%"></span>` : ''}</span>` +
          `<span class="pg-rend__valor">${v === null ? '—' : `${esc(formatearNumeroAr(v, { decimales: 1, minimos: 0 }))} %`}</span></li>`
      }).join('') + '</ul>'
    }

    // PENDIENTES: un botón por tipo, con su número, que lleva a resolverlo.
    // "Turno abierto de otro día" va primero y en bordó: es lo más urgente.
    // Sin nada pendiente, un bloque verde tranquilo.
    function renderPendientes(d) {
      const p = d?.pendientes
      if (!p || typeof p !== 'object' || Array.isArray(p)) return null
      const turnos = numeroInd(p.turnos_abiertos_de_otro_dia), planillas = numeroInd(p.planillas_por_completar), conos = numeroInd(p.conos_por_revisar)
      if (turnos === 0 && planillas === 0 && conos === 0) {
        return '<div class="pg-nada"><span class="pg-nada__ok" aria-hidden="true">✓</span><div><strong>Nada pendiente</strong>' +
          '<div class="pg-nada__ctx">Planillas, turnos y conos al día.</div></div></div>'
      }
      const cuerpoPend = (n, largo, corto) => `<span class="pg-pend__n">${esc(enteroInd(n))}</span>` +
        `<span class="pg-pend__que"><span class="pg-largo">${esc(largo)}</span><span class="pg-corto">${esc(corto)}</span></span>`
      // `destinoInd` es una constante del código: 'abiertos', 'pendientes' o 'conos'.
      const boton = (n, destinoInd, largo, corto, grave) => {
        if (n === 0) return ''
        if (n === null) return `<div class="pg-pend pg-pend--nose">${cuerpoPend(null, largo, corto)}</div>`
        return `<button type="button" class="pg-pend${grave ? ' pg-pend--grave' : ''}" data-ind-ir="${destinoInd}">${cuerpoPend(n, largo, corto)}<span class="pg-pend__ir" aria-hidden="true">›</span></button>`
      }
      const botonConos = () => {
        if (tieneTarea('configurar')) return boton(conos, 'conos', 'Conos nuevos por revisar', conos === 1 ? 'cono' : 'conos', false)
        if (!conos) return ''
        return `<div class="pg-pend pg-pend--nose">${cuerpoPend(conos, 'Conos nuevos por revisar · los revisa quien configura producción', conos === 1 ? 'cono' : 'conos')}</div>`
      }
      return '<div class="pg-pends">' +
        boton(turnos, 'abiertos', turnos === 1 ? 'Turno abierto de otro día' : 'Turnos abiertos de otro día', turnos === 1 ? 'turno de otro día' : 'turnos de otro día', true) +
        boton(planillas, 'pendientes', planillas === 1 ? 'Planilla por completar' : 'Planillas por completar', planillas === 1 ? 'planilla' : 'planillas', false) +
        botonConos() + '</div>'
    }

    const TARJETAS_INDICADORES = [
      { id: 'ahora', titulo: 'Ahora', render: renderAhora, contexto: contextoAhora },
      { id: 'hoy', titulo: 'Hoy', render: renderHoy, contexto: contextoHoy },
      { id: 'pendientes', titulo: 'Pendientes', render: renderPendientes },
      { id: 'semana', titulo: 'Semana', render: renderSemana, contexto: contextoSemana },
      { id: 'rendimiento', titulo: 'Rendimiento de la harina', render: renderRendimiento, contexto: () => 'unidades por kilo · de peor a mejor', ancha: true },
      { id: 'scrap', titulo: 'Scrap por lote de harina', render: renderScrap, contexto: () => '% de la masa · 30 días' },
    ]

    // La falla de una tarjeta: el texto, y el detalle PEGADO a "Reintentar".
    function htmlFallaInd(que, detalle) {
      const hora = horaArgentina(new Date())
      return `<div class="pg-ind-falla"><p class="pg-ind-falla__que">${esc(que)}</p><div class="pg-ind-falla__pie">` +
        `<div class="pr-ind__error" role="alert">${esc(detalle)}${hora ? ` (${esc(hora)})` : ''}</div>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-ind-reintentar="1">Reintentar</button></div></div>`
    }

    function htmlTarjetaIndicador(t, datos, error, cargando) {
      let cuerpo, ctx = ''
      if (cargando) cuerpo = '<p class="pr-ind__vacio">Cargando…</p>'
      else if (error) cuerpo = htmlFallaInd('No se pudieron cargar los indicadores.', error)
      else {
        try { cuerpo = t.render(datos); ctx = t.contexto ? t.contexto(datos) : '' } catch (err) { console.error(`indicador ${t.id}:`, err); cuerpo = null }
        if (cuerpo == null) cuerpo = htmlFallaInd('Esta tarjeta no se pudo cargar. Las demás están bien.', 'Vino un dato que la pantalla no entiende.')
      }
      return `<section class="pr-tarjeta pr-ind${t.ancha ? ' pg-ind--ancha' : ''}" id="pr-ind-${esc(t.id)}">` +
        `<div class="pg-ind__cab"><h2 class="pr-ind__titulo">${esc(t.titulo)}</h2>${ctx ? `<span class="pg-ind__ctx">${esc(ctx)}</span>` : ''}</div>${cuerpo}</section>`
    }

    function htmlIndicadores(datos, error, cargando = false) {
      return TARJETAS_INDICADORES.map(t => htmlTarjetaIndicador(t, datos, error, cargando)).join('')
    }

    // La fecha: ‹ un día antes, › uno después, que no pasa de hoy. Hoy se
    // pide SIN p_fecha (la base usa la fecha de Argentina); otro día, con él.
    function pintarDiaIndicadores() {
      const hoy = hoyArgentina()
      const f = estado.fechaInd ?? hoy
      document.getElementById('pr-ind-dia-texto').textContent = `${textoDiaInd(f)}${f === hoy ? ' · hoy' : ''}`
      document.getElementById('pr-ind-dia-despues').disabled = f >= hoy
    }

    function cambiarDiaIndicadores(delta) {
      const hoy = hoyArgentina()
      const nueva = sumarDias(estado.fechaInd ?? hoy, delta)
      if (nueva > hoy) return false
      estado.fechaInd = nueva === hoy ? null : nueva
      cargarIndicadores()
      return true
    }

    // Con un turno: la respuesta de una unidad (o de un día) que ya no está
    // elegida no pisa la de la nueva.
    let turnoIndicadores = 0
    async function cargarIndicadores() {
      const turno = ++turnoIndicadores
      const cont = document.getElementById('pr-indicadores')
      pintarDiaIndicadores()
      if (!estado.unidadId) { cont.innerHTML = ''; return }
      cont.innerHTML = htmlIndicadores(null, null, true)
      let datos = null, error = null
      const params = { p_unidad_negocio_id: estado.unidadId }
      if (estado.fechaInd) params.p_fecha = estado.fechaInd
      try {
        const { data, error: e } = await supabase.rpc('indicadores_produccion', params)
        if (e) throw e
        datos = data
      } catch (err) {
        console.error('indicadores_produccion:', err)
        error = err?.message || 'No hubo respuesta del servidor. Revisá la conexión.'
      }
      if (turno !== turnoIndicadores) return
      estado.indicadores = { unidadId: params.p_unidad_negocio_id, datos, error }
      cont.innerHTML = htmlIndicadores(datos, error)
      pintarNumerosMenu()
    }

    // Los números del menú. Planillas pendientes sale de los indicadores de
    // la unidad elegida (no depende del día); si no se pudieron leer, no se
    // dibuja ninguno: nunca un número viejo ni inventado.
    function htmlNumeroMenu(el, n, texto) {
      const ok = Number.isInteger(n) && n > 0
      el.hidden = !ok
      el.textContent = ok ? (n > 99 ? '99+' : String(n)) : ''
      if (ok) { el.setAttribute('title', texto); el.setAttribute('aria-label', texto) }
      else { el.removeAttribute('title'); el.removeAttribute('aria-label') }
    }

    function pintarNumerosMenu() {
      const i = estado.indicadores
      const n = i && !i.error && i.unidadId === estado.unidadId ? numeroInd(i.datos?.pendientes?.planillas_por_completar) : null
      htmlNumeroMenu(document.getElementById('pr-menu-n-pendientes'), n,
        n === 1 ? '1 planilla por completar' : `${n} planillas por completar`)
    }

    // A dónde lleva cada pendiente. Los turnos abiertos de otro día se ven en
    // el historial (la planta es de la tablet).
    function irDesdeIndicador(que) {
      const hoy = hoyArgentina()
      if (que === 'pendientes') return mostrarHistorial({ estado: 'pendiente_completar', desde: sumarDias(hoy, -365), desdePendientes: true })
      if (que === 'abiertos') return mostrarHistorial({ estado: 'abierto', desde: sumarDias(hoy, -365) })
      if (que === 'conos') return mostrarConfig('marcas')
    }

    // A dónde vuelve "Salir sin guardar" sin otro destino: al inicio.
    function volverDeOficina() {
      mostrarInicioOficina()
    }

    // El inicio de la gestión: los indicadores de la unidad.
    function mostrarInicioOficina() {
      pintarAccesosOficina()
      mostrarVista('pr-inicio')
      cargarIndicadores()
    }

    const puedeVerHistorial = () => tieneTarea('ver') || tieneTarea('configurar')

    // ── El número de conos por revisar (la misma cifra del dashboard) ─────
    //
    // Sale de mis_pendientes() —('produccion', 'conos_por_revisar')—, que ya
    // filtra por produccion:configurar. Se pide al abrir y al volver a la
    // pestaña, con un turno para que una respuesta vieja no pise la nueva.
    // Va al lado de "Marcas / Conos" en el menú. Si la llamada falla, o da 0,
    // no se dibuja nada: nunca un número viejo ni inventado.
    // `estado.conosPendientes`: un entero > 0, o null.
    let turnoBurbujaConos = 0

    async function cargarBurbujaConos() {
      const turno = ++turnoBurbujaConos
      if (!tieneTarea('configurar')) {
        estado.conosPendientes = null
        return pintarBurbujaConos()
      }
      let n = null
      try {
        const { data, error } = await supabase.rpc('mis_pendientes')
        if (error) throw error
        const fila = (data ?? []).find(f => f?.modulo === 'produccion' && f?.clave === 'conos_por_revisar')
        const c = fila && fila.cantidad !== null && fila.cantidad !== '' ? Number(fila.cantidad) : NaN
        n = Number.isInteger(c) && c > 0 ? c : null
      } catch (err) {
        console.error('conos por revisar:', err)
        n = null
      }
      if (turno !== turnoBurbujaConos) return
      estado.conosPendientes = n
      pintarBurbujaConos()
    }

    function textoConosPendientes(n) {
      return `${n} ${n === 1 ? 'cono nuevo por revisar' : 'conos nuevos por revisar'}`
    }

    function pintarBurbujaConos() {
      const n = tieneTarea('configurar') ? estado.conosPendientes : null
      htmlNumeroMenu(document.getElementById('pr-menu-n-conos'), n, Number.isInteger(n) ? textoConosPendientes(n) : '')
    }

    // Qué secciones del menú ve esta cuenta: Control con ver o configurar;
    // Catálogo y Personas solo con configurar. Un bloque sin renglones no se
    // dibuja.
    function pintarAccesosOficina() {
      const ver = puedeVerHistorial(), conf = tieneTarea('configurar')
      document.getElementById('pr-menu').hidden = false
      document.body.classList.add('pg-con-menu')
      for (const id of ['pr-btn-ir-pendientes', 'pr-menu-historial', 'pr-menu-stock']) document.getElementById(id).hidden = !ver
      for (const b of document.querySelectorAll('[data-ir-config]')) b.hidden = !tieneTarea('configurar')
      document.getElementById('pr-menu-bloque-control').hidden = !ver
      document.getElementById('pr-menu-bloque-catalogo').hidden = !conf
      document.getElementById('pr-menu-bloque-personas').hidden = !conf
    }

    function unidadesDeConfig() {
      return unidadesCon('configurar')
    }

    function pintarSelectorUnidad(selectId, unidades, elegida) {
      const sel = document.getElementById(selectId)
      sel.innerHTML = unidades.map(id => `<option value="${esc(id)}"${id === elegida ? ' selected' : ''}>${esc(estado.unidades.get(id) ?? id)}</option>`).join('')
      sel.value = elegida ?? ''
      sel.closest?.('.pr-campo')?.toggleAttribute?.('hidden', unidades.length < 2)
    }

    // `tabPedida`: la sección con la que abre (Máquinas, Recetas, … Personal
    // y PINes): cada una es un renglón del menú. No hay fila de pestañas.
    async function mostrarConfig(tabPedida) {
      const unidades = unidadesDeConfig()
      if (!unidades.length) return
      const actual = estado.config?.unidadId
      const tab = PESTANAS_CONFIG.some(([k]) => k === tabPedida) ? tabPedida : (estado.config?.tab ?? 'maquinas')
      estado.config = {
        unidadId: unidades.includes(actual) ? actual : (unidades.includes(estado.unidadId) ? estado.unidadId : unidades[0]),
        tab,
        busqueda: '', datos: null, recetaMaquina: null, recetaTipo: null,
        // Lo que se tocó en Personal y todavía no se guardó: id → puestos.
        cambios: new Map(),
        error: null,          // { texto, donde } — el error vive en el ESTADO
        hoja: null,           // los PINes recién generados, SOLO en memoria
        hojaConfirma: false,  // "¿Ya la imprimiste?" abierto
        salida: null,         // a dónde se quería ir con cambios sin guardar
        pinPara: null, temporal: null, guardando: false,
        // Marcas / Conos: el filtro, y el error y los conos que se están
        // guardando (cada interruptor se guarda al tocarlo).
        filtroConos: 'activos', errorCono: null, conosOcupados: new Set(), listaConos: null,
      }
      pintarSelectorUnidad('pr-config-unidad', unidades, estado.config.unidadId)
      pintarTituloConfig()
      mostrarVista('pr-config')
      await cargarPestanaConfig()
    }

    // El título de la sección de Configuración: el mismo nombre del menú.
    function pintarTituloConfig() {
      const tab = estado.config?.tab
      document.getElementById('pr-config-titulo').textContent = PESTANAS_CONFIG.find(([k]) => k === tab)?.[1] ?? 'Configuración'
    }

    // EL ERROR VA AL ESTADO, NO AL DOM: el catch guarda el mensaje y el único
    // que escribe en el DOM es el render, que lo dibuja PEGADO a su botón.
    // `donde` es el id de ese botón, y ahí va también el foco.
    function errorConfig(texto, donde = null) {
      const c = estado.config
      const habia = !!c?.error
      if (c) c.error = texto ? { texto: String(texto), donde } : null
      // Sin pestaña dibujada (falló la lectura) no hay botón al que pegarlo.
      const suelto = !!texto && !c?.datos
      const arriba = document.getElementById('pr-config-error')
      arriba.textContent = suelto ? texto : ''
      arriba.hidden = !suelto
      if (c?.datos && (texto || habia)) pintarPestanaConfig()
      if (texto && donde) document.getElementById(donde)?.focus?.()
    }

    // El error de ESTE botón, justo al lado del botón. Nunca arriba de todo.
    function htmlErrorPegado(c, donde) {
      return c?.error && c.error.donde === donde ? `<div class="pr-cfg-error" role="alert">${esc(c.error.texto)}</div>` : ''
    }

    async function cargarPestanaConfig() {
      const c = estado.config
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.innerHTML = '<p class="pr-texto-suave">Cargando…</p>'
      c.error = null
      c.errorCono = null
      c.listaConos = null
      document.getElementById('pr-config-error').hidden = true
      try {
        c.datos = await LECTORES_CONFIG[c.tab](c)
      } catch (err) {
        console.error('configuración:', err)
        c.datos = null
        cuerpo.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer la configuración. Revisá la conexión.</div>'
        return
      }
      pintarPestanaConfig()
    }

    function pintarPestanaConfig() {
      const c = estado.config
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.innerHTML = c.salida ? htmlSalirSinGuardar(c) : RENDERS_CONFIG[c.tab](c)
      // Los números se escriben con ponerNumero, nunca con value=.
      for (const input of cuerpo.querySelectorAll('[data-numero]')) {
        enlazarCampoNumero(input, { decimales: Number(input.dataset.decimales ?? 3) })
        ponerNumero(input, input.dataset.numero === '' ? null : Number(input.dataset.numero))
      }
    }

    // ── Salir con cambios sin guardar ─────────────────────────────────────

    // Hoy solo Personal acumula cambios sin guardar (un solo botón al pie).
    function cambiosSinGuardar(c) {
      return c?.cambios instanceof Map ? c.cambios.size : 0
    }

    // Devuelve true si se puede seguir; si no, deja pedida la confirmación.
    // Sin datos dibujados no hay dónde preguntar, así que deja salir: los
    // cambios de Personal solo existen cuando su pestaña se pudo leer.
    function pedirSalida(c, accion) {
      if (!cambiosSinGuardar(c) || !c.datos) return true
      c.salida = accion
      pintarPestanaConfig()
      return false
    }

    function htmlSalirSinGuardar(c) {
      const n = cambiosSinGuardar(c)
      return `<div class="pr-aviso pr-aviso--grave">Tenés ${esc(n)} ${n === 1 ? 'fila cambiada' : 'filas cambiadas'} sin guardar en Personal y PINes. Si salís de acá, se pierden.</div>` +
        `<div class="pr-acciones"><button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-salir-no">Seguir acá</button>` +
        `<button type="button" class="pr-btn pr-btn--peligro" id="pr-cfg-salir-si">Salir sin guardar</button></div>`
    }

    function cancelarSalida() {
      estado.config.salida = null
      pintarPestanaConfig()
    }

    async function confirmarSalida() {
      const c = estado.config
      const accion = c.salida
      c.salida = null
      c.cambios = new Map()
      if (!accion) return pintarPestanaConfig()
      if (accion.volver) return volverDeOficina()
      if (accion.ir) return navegar(accion.ir)
      if (accion.unidad) { c.unidadId = accion.unidad; c.recetaMaquina = null }
      if (accion.tab) { c.tab = accion.tab; c.busqueda = ''; pintarTituloConfig(); pintarMenuActivo() }
      await cargarPestanaConfig()
    }

    // ── Máquinas ──────────────────────────────────────────────────────────

    async function leerMaquinasConfig(c) {
      const { data, error } = await supabase.from('maquinas').select('id, nombre, activa, orden')
        .eq('unidad_negocio_id', c.unidadId).order('orden').order('nombre')
      if (error) throw error
      return { maquinas: data ?? [] }
    }

    function htmlConfigMaquinas(c) {
      const lista = c.datos.maquinas
      const filas = lista.map((m, i) => `<div class="pr-config-fila${m.activa ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-maq-nombre="${esc(m.id)}" value="${esc(m.nombre)}" maxlength="60" aria-label="Nombre de la máquina">` +
        `<div class="pr-config-fila__botones">` +
        `<button type="button" class="pr-btn-icono" data-maq-subir="${i}" aria-label="Subir ${esc(m.nombre)}"${i === 0 ? ' disabled' : ''}>▲</button>` +
        `<button type="button" class="pr-btn-icono" data-maq-bajar="${i}" aria-label="Bajar ${esc(m.nombre)}"${i === lista.length - 1 ? ' disabled' : ''}>▼</button>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-maq-guardar="${esc(m.id)}">Guardar nombre</button>` +
        `<button type="button" class="pr-btn ${m.activa ? 'pr-btn--peligro' : 'pr-btn--secundario'}" data-maq-activa="${esc(m.id)}">${m.activa ? 'Desactivar' : 'Activar'}</button>` +
        `</div></div>`).join('')
      return (filas || '<p class="pr-texto-suave">Esta unidad todavía no tiene máquinas.</p>') +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-maq-nueva" maxlength="60" placeholder="Nombre de la máquina nueva" aria-label="Nombre de la máquina nueva">` +
        htmlErrorPegado(c, 'pr-cfg-maq-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-maq-agregar" data-maq-agregar="1">Agregar máquina</button></div>`
    }

    // El orden que quedaría al mover una máquina: 1, 2, 3… en el orden de la
    // lista. Devuelve SOLO las que cambian de número, para mandar lo mínimo.
    // Mover un renglón una posición arriba (-1) o abajo (+1). Devuelve una
    // lista nueva; fuera de rango, la MISMA (y de eso se apoya ordenTrasMover
    // para no mandar nada).
    function moverProducto(lista, i, delta) {
      const j = i + delta
      if (i < 0 || i >= lista.length || j < 0 || j >= lista.length) return lista
      const nueva = [...lista]
      ;[nueva[i], nueva[j]] = [nueva[j], nueva[i]]
      return nueva
    }

    function ordenTrasMover(lista, i, delta) {
      const nueva = moverProducto(lista, i, delta)
      if (nueva === lista) return []
      return nueva.map((m, k) => ({ ...m, orden: k + 1 })).filter((m, k) => lista.find(x => x.id === m.id).orden !== k + 1)
    }

    function parametrosGuardarMaquina(m, unidadId, cambios = {}) {
      return {
        p_id: m?.id ?? null,
        p_unidad_negocio_id: unidadId,
        p_nombre: (cambios.nombre ?? m?.nombre ?? '').trim(),
        p_activa: cambios.activa ?? m?.activa ?? true,
        p_orden: cambios.orden ?? m?.orden ?? 0,
      }
    }

    async function guardarEnConfig(rpc, params, exito, donde = null) {
      errorConfig(null)
      const { data, error } = await supabase.rpc(rpc, params)
      if (error) {
        // El mensaje de la base TAL CUAL ("La máquina tiene un turno abierto:
        // cerralo antes de desactivarla.", "Puesto inválido."), pegado al botón.
        errorConfig(error.message || 'No se pudo guardar.', donde)
        return { ok: false }
      }
      if (exito) mostrarExito(exito)
      return { ok: true, data }
    }

    async function accionMaquina(ds) {
      const c = estado.config, lista = c.datos.maquinas
      const DONDE = 'pr-cfg-maq-agregar'
      if (ds.maqAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-maq-nueva').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre de la máquina.', DONDE); return }
        const orden = lista.reduce((mx, m) => Math.max(mx, m.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(null, c.unidadId, { nombre, activa: true, orden }), 'Máquina agregada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.maqSubir !== undefined || ds.maqBajar !== undefined) {
        const i = Number(ds.maqSubir ?? ds.maqBajar)
        for (const m of ordenTrasMover(lista, i, ds.maqSubir !== undefined ? -1 : +1)) {
          const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { orden: m.orden }), null, DONDE)
          if (!r.ok) break
        }
        await cargarPestanaConfig()
        return
      }
      const id = ds.maqGuardar ?? ds.maqActiva
      const m = lista.find(x => x.id === id)
      if (!m) return
      if (ds.maqGuardar !== undefined) {
        const input = [...document.getElementById('pr-config-cuerpo').querySelectorAll('[data-maq-nombre]')].find(x => x.dataset.maqNombre === id)
        const nombre = (input?.value ?? '').trim()
        if (!nombre) { errorConfig('El nombre no puede quedar vacío.', DONDE); return }
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { nombre }), 'Nombre guardado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      } else {
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { activa: !m.activa }), m.activa ? 'Máquina desactivada.' : 'Máquina activada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      }
    }

    // ── Recetas ───────────────────────────────────────────────────────────

    async function leerRecetasConfig(c) {
      const { data: maquinas, error: e1 } = await supabase.from('maquinas').select('id, nombre')
        .eq('unidad_negocio_id', c.unidadId).eq('activa', true).order('orden').order('nombre')
      if (e1) throw e1
      const maquinaId = (maquinas ?? []).some(m => m.id === c.recetaMaquina) ? c.recetaMaquina : (maquinas?.[0]?.id ?? null)
      c.recetaMaquina = maquinaId
      let recetas = [], items = [], nombres = new Map()
      if (maquinaId) {
        const r = await supabase.from('recetas').select('id, tipo_masa, version, nota, creada_por, created_at').eq('maquina_id', maquinaId).order('version', { ascending: false })
        if (r.error) throw r.error
        recetas = r.data ?? []
        const ids = recetas.map(x => x.id)
        if (ids.length) {
          const ri = await supabase.from('receta_items').select('receta_id, ingrediente_id, cantidad_kg, insumo_preferido_id').in('receta_id', ids)
          if (ri.error) throw ri.error
          items = ri.data ?? []
          const autores = [...new Set(recetas.map(x => x.creada_por).filter(Boolean))]
          if (autores.length) {
            const pe = await supabase.from('v_empleados_publico').select('id, nombre').in('id', autores)
            if (pe.error) throw pe.error
            nombres = new Map((pe.data ?? []).map(p => [p.id, p.nombre]))
          }
        }
      }
      const { data: ingredientes, error: e2 } = await supabase.from('ingredientes').select('id, nombre, descuenta_stock, orden, activo').order('orden')
      if (e2) throw e2
      const cat = await leerInsumosDeIngredientes()
      const tipos = [...new Set(recetas.map(r => r.tipo_masa))].sort((a, b) => a.localeCompare(b, 'es'))
      if (!tipos.includes(c.recetaTipo) && c.recetaTipo !== NUEVO_TIPO) c.recetaTipo = tipos[0] ?? NUEVO_TIPO
      return { maquinas: maquinas ?? [], recetas, items, nombres, ingredientes: ingredientes ?? [], tipos, ...cat }
    }

    const NUEVO_TIPO = '__nuevo__'

    async function leerInsumosDeIngredientes() {
      const { data: rel, error: e1 } = await supabase.from('ingrediente_insumos').select('ingrediente_id, insumo_id')
      if (e1) throw e1
      const { data: insumos, error: e2 } = await supabase.from('insumos').select('id, nombre, marca, tipo').eq('activo', true).order('nombre')
      if (e2) throw e2
      return { relaciones: rel ?? [], insumos: insumos ?? [] }
    }

    // La versión vigente de un tipo: la de número más alto (igual que
    // _receta_vigente() en la base).
    function recetaVigente(recetas, tipo) {
      return recetas.filter(r => r.tipo_masa === tipo).sort((a, b) => b.version - a.version)[0] ?? null
    }

    // La receta vino del prototipo si su nota lo dice: hay que revisarla.
    function recetaParaRevisar(receta) {
      return !!receta && /prototipo|revisar/i.test(receta.nota ?? '')
    }

    // Las filas del editor: cada ingrediente activo, con la cantidad y el
    // insumo preferido de la receta de partida (vacío si no lo lleva).
    function filasEditorReceta(ingredientes, itemsPartida) {
      return ingredientes.filter(g => g.activo).map(g => {
        const it = itemsPartida.find(x => x.ingrediente_id === g.id)
        return { ingrediente_id: g.id, nombre: g.nombre, kg: it ? Number(it.cantidad_kg) : null, preferido: it?.insumo_preferido_id ?? '' }
      })
    }

    // El payload de guardar_receta_original: los ingredientes con número
    // (0 incluido: "lleva 0" es un dato); los vacíos no van.
    function parametrosGuardarReceta(maquinaId, tipo, filas, nota) {
      return {
        p_maquina_id: maquinaId,
        p_tipo_masa: String(tipo ?? '').trim(),
        p_items: filas.filter(f => f.kg != null).map(f => ({ ingrediente_id: f.ingrediente_id, cantidad_kg: f.kg, insumo_preferido_id: f.preferido || null })),
        p_nota: String(nota ?? '').trim() === '' ? null : String(nota).trim(),
      }
    }

    // La nota es OBLIGATORIA acá, aunque guardar_receta_original la acepte en
    // null: una versión sin decir qué cambió deja un historial que no explica
    // nada, que es justo para lo que existe el historial.
    function faltanEnReceta(p) {
      const faltan = []
      if (!p.p_maquina_id) faltan.push('la máquina')
      if (!p.p_tipo_masa) faltan.push('el tipo de masa')
      else if (p.p_tipo_masa.length > 40) faltan.push('un tipo de masa de hasta 40 letras')
      if (!p.p_items.length) faltan.push('al menos un ingrediente con cantidad')
      if (!p.p_nota) faltan.push('una nota que diga qué cambió')
      return faltan
    }

    // El número que va a tener la versión que se está por guardar.
    function proximaVersion(recetas, tipo) {
      return (recetaVigente(recetas, tipo)?.version ?? 0) + 1
    }

    // "antes 2,5" al lado de una cantidad que se cambió. Null si no cambió.
    function textoAntes(original, actual) {
      if (original == null || actual == null) return null
      if (Math.abs(Number(original) - Number(actual)) < 1e-9) return null
      return `antes ${formatearNumeroAr(Number(original), { decimales: 3, minimos: 0 })}`
    }

    function htmlConfigRecetas(c) {
      const d = c.datos
      if (!d.maquinas.length) return '<p class="pr-texto-suave">Esta unidad no tiene máquinas activas.</p>'
      const selMaq = `<label class="pr-campo"><span class="pr-campo__rotulo">Máquina</span><select class="pr-select" data-receta-maquina="1">` +
        d.maquinas.map(m => `<option value="${esc(m.id)}"${m.id === c.recetaMaquina ? ' selected' : ''}>${esc(m.nombre)}</option>`).join('') + `</select></label>`
      const selTipo = `<label class="pr-campo"><span class="pr-campo__rotulo">Tipo de masa</span><select class="pr-select" data-receta-tipo="1">` +
        d.tipos.map(t => `<option value="${esc(t)}"${t === c.recetaTipo ? ' selected' : ''}>${esc(t)}</option>`).join('') +
        `<option value="${NUEVO_TIPO}"${c.recetaTipo === NUEVO_TIPO ? ' selected' : ''}>Tipo nuevo…</option></select></label>`
      const nuevo = c.recetaTipo === NUEVO_TIPO
      const vigente = nuevo ? null : recetaVigente(d.recetas, c.recetaTipo)
      const partida = nuevo ? recetaVigente(d.recetas, c.recetaPartida ?? d.tipos[0]) : vigente
      const itemsPartida = partida ? d.items.filter(i => i.receta_id === partida.id) : []
      const filas = filasEditorReceta(d.ingredientes, itemsPartida)
      const aviso = recetaParaRevisar(vigente)
        ? `<div class="pr-aviso pr-aviso--grave">Revisar: esta receta vino del prototipo. Confirmá las cantidades con la fábrica y guardá una versión nueva.</div>` : ''
      const cabNuevo = nuevo
        ? `<div class="pr-campos"><label class="pr-campo"><span class="pr-campo__rotulo">Nombre del tipo nuevo</span><input type="text" class="pr-input" id="pr-config-tipo-nuevo" maxlength="40" placeholder="Ej.: Chocolate"></label>` +
          (d.tipos.length ? `<label class="pr-campo"><span class="pr-campo__rotulo">Partir de</span><select class="pr-select" data-receta-partida="1">` +
            d.tipos.map(t => `<option value="${esc(t)}"${t === (c.recetaPartida ?? d.tipos[0]) ? ' selected' : ''}>${esc(t)}</option>`).join('') + `</select></label>` : '') + `</div>`
        : `<p class="pr-texto-suave">Vigente: versión ${esc(vigente?.version ?? '—')}. Guardar crea una versión NUEVA; las masas ya hechas no cambian.</p>`
      const editor = filas.map(f => {
        const opciones = d.relaciones.filter(r => r.ingrediente_id === f.ingrediente_id)
          .map(r => d.insumos.find(i => i.id === r.insumo_id)).filter(Boolean)
        return `<div class="pr-config-fila"><span class="pr-ing__nombre">${esc(f.nombre)}</span>` +
          `<label class="pr-campo"><span class="pr-campo__rotulo">kg por masa simple</span><input type="text" class="pr-input" data-receta-kg="${esc(f.ingrediente_id)}" data-numero="${f.kg == null ? '' : esc(f.kg)}" data-decimales="3" aria-label="Kilos de ${esc(f.nombre)}"></label>` +
          `<span class="pr-cfg-antes" data-receta-antes="${esc(f.ingrediente_id)}" hidden></span>` +
          (opciones.length ? `<label class="pr-campo"><span class="pr-campo__rotulo">Insumo preferido</span><select class="pr-select" data-receta-pref="${esc(f.ingrediente_id)}"><option value="">Ninguno</option>` +
            opciones.map(o => `<option value="${esc(o.id)}"${o.id === f.preferido ? ' selected' : ''}>${esc(o.nombre)}${o.marca ? ` · ${esc(o.marca)}` : ''}</option>`).join('') + `</select></label>` : '') +
          `</div>`
      }).join('')
      const historial = nuevo ? '' : '<h3 class="pr-subtitulo">Versiones</h3>' +
        d.recetas.filter(r => r.tipo_masa === c.recetaTipo).map((r, i) =>
          `<div class="pr-cfg-version${i === 0 ? ' pr-cfg-version--vigente' : ''}"><strong>Versión ${esc(r.version)}${i === 0 ? ' · vigente' : ''}</strong> · ${esc(fechaCorta(r.created_at))} · ${esc(d.nombres.get(r.creada_por) ?? '—')}` +
          `<div class="pr-texto-suave">${esc(r.nota ?? 'Sin nota')}</div></div>`).join('')
      const version = nuevo ? 1 : proximaVersion(d.recetas, c.recetaTipo)
      return `<div class="pr-cfg-recetas"><div>${selMaq}${selTipo}</div>` +
        `<div>${aviso}${cabNuevo}${editor}` +
        `<label class="pr-campo pr-espacio-arriba"><span class="pr-campo__rotulo">Nota (qué cambió y por qué) <span class="pr-obligatorio">· obligatoria</span></span><textarea class="pr-textarea" id="pr-config-receta-nota" maxlength="300"></textarea></label>` +
        `<div class="pr-cfg-pie">${htmlErrorPegado(c, 'pr-cfg-receta-guardar')}` +
        `<button type="button" class="pr-btn" id="pr-cfg-receta-guardar" data-receta-guardar="1">Guardar versión ${esc(version)}</button></div></div>` +
        `<div>${historial}</div></div>`
    }

    // dd/mm/aaaa de un timestamp, en Argentina; '' si no se puede leer.
    function fechaCorta(momento) {
      if (!momento) return ''
      const d = new Date(momento)
      if (Number.isNaN(d.getTime())) return ''
      return new Intl.DateTimeFormat('es-AR', { timeZone: ZONA_AR, day: '2-digit', month: '2-digit', year: 'numeric' }).format(d)
    }

    function leerEditorReceta() {
      const cuerpo = document.getElementById('pr-config-cuerpo')
      const prefs = new Map([...cuerpo.querySelectorAll('[data-receta-pref]')].map(s => [s.dataset.recetaPref, s.value]))
      return [...cuerpo.querySelectorAll('[data-receta-kg]')].map(i => ({
        ingrediente_id: i.dataset.recetaKg, kg: leerCampoNumero(i), preferido: prefs.get(i.dataset.recetaKg) ?? '',
      }))
    }

    // Al tocar una cantidad se marca contra la de la versión vigente. Se
    // escribe DIRECTO en el DOM y no con un re-render, porque re-renderizar
    // mientras se escribe le saca el foco al campo.
    function marcarCambioReceta(input) {
      const cuerpo = document.getElementById('pr-config-cuerpo')
      const antes = [...cuerpo.querySelectorAll('[data-receta-antes]')].find(x => x.dataset.recetaAntes === input.dataset.recetaKg)
      if (!antes) return
      const original = input.dataset.numero === '' ? null : Number(input.dataset.numero)
      const texto = textoAntes(original, leerCampoNumero(input))
      antes.textContent = texto ?? ''
      antes.hidden = !texto
    }

    async function guardarReceta() {
      const c = estado.config
      const DONDE = 'pr-cfg-receta-guardar'
      const tipo = c.recetaTipo === NUEVO_TIPO ? document.getElementById('pr-config-tipo-nuevo')?.value : c.recetaTipo
      const p = parametrosGuardarReceta(c.recetaMaquina, tipo, leerEditorReceta(), document.getElementById('pr-config-receta-nota').value)
      const faltan = faltanEnReceta(p)
      if (faltan.length) { errorConfig(`Falta ${faltan.join(', ')}.`, DONDE); return }
      const r = await guardarEnConfig('guardar_receta_original', p, null, DONDE)
      if (r.ok) {
        mostrarExito(`Receta guardada: ${p.p_tipo_masa}, versión ${r.data?.version ?? ''}.`)
        c.recetaTipo = p.p_tipo_masa
        await cargarPestanaConfig()
      }
    }

    // ── Ingredientes ──────────────────────────────────────────────────────

    async function leerIngredientesConfig() {
      const { data, error } = await supabase.from('ingredientes').select('id, nombre, descuenta_stock, orden, activo').order('orden')
      if (error) throw error
      return { ingredientes: data ?? [], ...(await leerInsumosDeIngredientes()) }
    }

    // Los que descuentan stock pero no tienen ningún insumo del catálogo: sus
    // masas no descuentan nada (hoy grasa, fécula y colorante).
    function ingredientesSinInsumo(d) {
      return d.ingredientes.filter(g => g.activo && g.descuenta_stock && !d.relaciones.some(r => r.ingrediente_id === g.id))
    }

    function htmlConfigIngredientes(c) {
      const d = c.datos
      const sin = ingredientesSinInsumo(d)
      const aviso = sin.length
        ? `<div class="pr-aviso pr-aviso--grave">No descuentan stock porque no tienen ningún insumo del catálogo: ${esc(sin.map(g => g.nombre).join(', '))}. Asignales el insumo que corresponde.</div>` : ''
      const filas = d.ingredientes.map(g => {
        const suyos = d.relaciones.filter(r => r.ingrediente_id === g.id).map(r => d.insumos.find(i => i.id === r.insumo_id)).filter(Boolean)
        const abierto = c.ingredienteAbierto === g.id
        const panelInsumos = abierto ? `<div class="pr-config-insumos">` +
          `<input type="text" class="pr-input" id="pr-config-insumo-buscar" placeholder="Buscar en el catálogo" aria-label="Buscar insumo" value="${esc(c.busqueda)}">` +
          marcasFiltradas(d.insumos.map(i => ({ ...i, nombre: i.nombre + (i.marca ? ' ' + i.marca : '') })), c.busqueda).slice(0, 60).map(i =>
            `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-insumo="${esc(i.id)}"${c.insumosElegidos?.has(i.id) ? ' checked' : ''}> ${esc(i.nombre)}</label>`).join('') +
          `<div class="pr-acciones"><button type="button" class="pr-btn pr-btn--secundario" data-ing-cerrar="1">Cancelar</button>` +
          `<button type="button" class="pr-btn" data-ing-guardar-insumos="${esc(g.id)}">Guardar insumos</button></div></div>` : ''
        return `<div class="pr-config-fila${g.activo ? '' : ' pr-config-fila--inactiva'}">` +
          `<input type="text" class="pr-input" data-ing-nombre="${esc(g.id)}" value="${esc(g.nombre)}" maxlength="60" aria-label="Nombre del ingrediente">` +
          `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-descuenta="${esc(g.id)}"${g.descuenta_stock ? ' checked' : ''}> Descuenta stock</label>` +
          `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-activo="${esc(g.id)}"${g.activo ? ' checked' : ''}> Activo</label>` +
          `<p class="pr-texto-suave">Insumos: ${suyos.length ? esc(suyos.map(i => i.nombre + (i.marca ? ' · ' + i.marca : '')).join(', ')) : 'ninguno'}</p>` +
          `<div class="pr-config-fila__botones"><button type="button" class="pr-btn pr-btn--secundario" data-ing-guardar="${esc(g.id)}">Guardar</button>` +
          `<button type="button" class="pr-btn pr-btn--secundario" data-ing-insumos="${esc(g.id)}">Elegir insumos</button></div>${panelInsumos}</div>`
      }).join('')
      return aviso + filas +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-ing-nuevo" maxlength="60" placeholder="Ingrediente nuevo" aria-label="Ingrediente nuevo">` +
        htmlErrorPegado(c, 'pr-cfg-ing-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-ing-agregar" data-ing-agregar="1">Agregar ingrediente</button></div>`
    }

    function parametrosGuardarIngrediente(g, cambios = {}) {
      return {
        p_id: g?.id ?? null,
        p_nombre: (cambios.nombre ?? g?.nombre ?? '').trim(),
        p_descuenta_stock: cambios.descuenta_stock ?? g?.descuenta_stock ?? true,
        p_orden: g?.orden ?? cambios.orden ?? 0,
        p_activo: cambios.activo ?? g?.activo ?? true,
      }
    }

    function valorDe(selector, id, prop = 'value') {
      const el = [...document.getElementById('pr-config-cuerpo').querySelectorAll(`[${selector}]`)]
        .find(x => x.getAttribute(selector) === id)
      return el ? el[prop] : undefined
    }

    async function accionIngrediente(ds) {
      const c = estado.config, d = c.datos
      const DONDE = 'pr-cfg-ing-agregar'
      if (ds.ingAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-ing-nuevo').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre del ingrediente.', DONDE); return }
        const orden = d.ingredientes.reduce((mx, g) => Math.max(mx, g.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_ingrediente', parametrosGuardarIngrediente(null, { nombre, orden }), 'Ingrediente agregado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.ingCerrar !== undefined) { c.ingredienteAbierto = null; c.busqueda = ''; pintarPestanaConfig(); return }
      if (ds.ingInsumos !== undefined) {
        c.ingredienteAbierto = ds.ingInsumos
        c.busqueda = ''
        c.insumosElegidos = new Set(d.relaciones.filter(r => r.ingrediente_id === ds.ingInsumos).map(r => r.insumo_id))
        pintarPestanaConfig()
        return
      }
      if (ds.ingGuardarInsumos !== undefined) {
        const r = await guardarEnConfig('guardar_ingrediente_insumos',
          { p_ingrediente_id: ds.ingGuardarInsumos, p_insumo_ids: [...(c.insumosElegidos ?? [])] }, 'Insumos guardados.', DONDE)
        if (r.ok) { c.ingredienteAbierto = null; await cargarPestanaConfig() }
        return
      }
      if (ds.ingGuardar !== undefined) {
        const g = d.ingredientes.find(x => x.id === ds.ingGuardar)
        if (!g) return
        const nombre = String(valorDe('data-ing-nombre', g.id) ?? g.nombre).trim()
        if (!nombre) { errorConfig('El nombre no puede quedar vacío.', DONDE); return }
        const r = await guardarEnConfig('guardar_ingrediente', parametrosGuardarIngrediente(g, {
          nombre, descuenta_stock: valorDe('data-ing-descuenta', g.id, 'checked') ?? g.descuenta_stock, activo: valorDe('data-ing-activo', g.id, 'checked') ?? g.activo,
        }), 'Ingrediente guardado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      }
    }

    // ── Productos y presentaciones ────────────────────────────────────────

    async function leerProductosConfig(c) {
      const { data: productos, error: e1 } = await supabase.from('productos_terminados').select('id, nombre, tipo_masa, activo, orden')
        .eq('unidad_negocio_id', c.unidadId).order('orden').order('nombre')
      if (e1) throw e1
      const ids = (productos ?? []).map(p => p.id)
      let presentaciones = []
      if (ids.length) {
        const r = await supabase.from('producto_presentaciones')
          .select('id, producto_id, nombre, con_cono, media_caja, empaque, unidades_por_caja, activa, orden').in('producto_id', ids).order('orden')
        if (r.error) throw r.error
        presentaciones = r.data ?? []
      }
      return { productos: productos ?? [], presentaciones }
    }

    function avisoProductosRevisado() {
      return leerPreferencia(CLAVE_AVISO_PRODUCTOS) === '1'
    }

    function htmlPresentacionConfig(pr) {
      return `<div class="pr-config-sub${pr.activa ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-pres-nombre="${esc(pr.id)}" value="${esc(pr.nombre)}" maxlength="80" aria-label="Nombre de la presentación">` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-cono="${esc(pr.id)}"${pr.con_cono ? ' checked' : ''}> Con cono</label>` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-media="${esc(pr.id)}"${pr.media_caja ? ' checked' : ''}> Media caja</label>` +
        `<input type="text" class="pr-input" data-pres-empaque="${esc(pr.id)}" value="${esc(pr.empaque ?? '')}" maxlength="80" placeholder="Empaque (ej. bolsa granel)" aria-label="Empaque">` +
        `<label class="pr-campo"><span class="pr-campo__rotulo">Unidades por caja</span><input type="text" class="pr-input" data-pres-unidades="${esc(pr.id)}" data-numero="${esc(pr.unidades_por_caja)}" data-decimales="0"></label>` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-activa="${esc(pr.id)}"${pr.activa ? ' checked' : ''}> Activa</label>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-pres-guardar="${esc(pr.id)}">Guardar presentación</button></div>`
    }

    function htmlConfigProductos(c) {
      const d = c.datos
      const aviso = d.productos.length && !avisoProductosRevisado()
        ? `<div class="pr-aviso pr-aviso--grave">Los productos que ya están cargados vinieron del prototipo: revisá nombres, presentaciones y unidades por caja.` +
          ` <button type="button" class="pr-btn pr-btn--secundario" data-productos-revisados="1">Ya los revisé</button></div>` : ''
      const nota = '<p class="pr-texto-suave">Cambiar las unidades por caja no toca lo ya producido: cada sublote guardó las suyas.</p>'
      const bloque = (p) => `<div class="pr-config-fila${p.activo ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-prod-nombre="${esc(p.id)}" value="${esc(p.nombre)}" maxlength="80" aria-label="Nombre del producto">` +
