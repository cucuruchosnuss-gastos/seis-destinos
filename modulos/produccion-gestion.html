<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Producción · Gestión — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- PRODUCCIÓN · GESTIÓN (25/09/2026). La parte de Producción que se usa
       en la compu y en el celular, con una cuenta PERSONAL (produccion:ver o
       produccion:configurar): la configuración, el historial de turnos (con
       las planillas pendientes de completar y la corrección de sus paradas) y
       el stock terminado. Sin PIN ni "¿Quién sos?": quien entra es quien está
       logueado. Salió de modulos/produccion.html, que quedó SOLO para la
       tablet de la planta: una cuenta de dispositivo que llega acá se manda
       a la planta.

       Lo de abajo es la historia del módulo entero, de cuando era un solo
       archivo; vale para lo que se mudó acá.

       PRODUCCIÓN (22/09/2026). La tablet de la fábrica, en modo kiosco.

       Cómo trabaja la fábrica, y es lo que manda sobre el diseño:
       1. El ENCARGADO abre el turno: quién es, qué turno, qué máquinas
          arrancan y con qué operario. Cada máquina abierta recibe su LOTE.
       2. Recién ahí esas máquinas le aparecen al MASERO en la sala de masa.
       3. Al terminar, el encargado cierra la planilla de CADA máquina: la
          hora en que se apagó el fuego, el scrap y lo producido EN ORDEN. Cada
          renglón es un SUBLOTE (7023-1, 7023-2…), el número que se sella en la
          caja; suma al stock de producto terminado.
       4. Una máquina que sigue al turno siguiente se vuelve a abrir: es un
          lote nuevo.

       Todas las reglas de fondo (el origen de la masa, el descuento de los
       lotes, el sublote, quién puede figurar como encargado o masero) viven en
       la base. La pantalla no las repite ni las contradice. -->

  <style>
    [hidden] { display: none !important; }

    body {
      overflow-x: hidden;
      --borde-tarjeta:  rgba(26, 42, 82, 0.10);
      --sombra-tarjeta: 0 1px 2px rgba(26, 42, 82, 0.05);
      --pr-texto-secundario: #4a5670;
      /* Tablet: todo más grande. Botones de 56 px como mínimo y texto de 18 px
         o más, porque se usa de pie, con guantes o harina en las manos. */
      --pr-alto-boton: 56px;
      font-size: 18px;

      /* ── COLORES DE MODO ───────────────────────────────────────────────
         Los dos modos se separan por LUMINOSIDAD y no por tono: Producción es
         oscuro con letra blanca y Sala de masa es claro con letra oscura. Así
         se distinguen en escala de grises, con el reflejo del galpón y para
         alguien que no distingue colores. El color nunca va solo: siempre
         acompaña al nombre del modo en mayúsculas grandes.

         Van como variables LOCALES del módulo (el precedente de
         --borde-tarjeta en stock.html): son valores de una sola pantalla y el
         :root global se reserva para los acentos compartidos. Donde el hex ya
         tiene nombre en css/main.css se usa la variable global en vez de
         repetirlo. */
      --pr-prod-activo:         #3F4655;   /* botón activo: 9,6:1 con blanco */
      --pr-prod-letra:          var(--color-fondo);
      --pr-prod-apagado-borde:  #9AA1AE;
      --pr-prod-apagado-letra:  #55617d;
      --pr-prod-fondo:          #E4E7EC;   /* fondo de TODA la pantalla */
      --pr-masa-activo:         #F3D774;
      --pr-masa-activo-borde:   #B8961F;
      --pr-masa-letra:          #3B2E00;   /* 11:1 sobre el amarillo */
      --pr-masa-apagado-borde:  #D9C476;
      --pr-masa-apagado-letra:  #6B5A1E;
      --pr-masa-fondo:          #FBF4D9;
      --pr-masa-barra-borde:    #EADFAE;
      /* Deshabilitado: el punteado distingue "no se puede todavía" de
         "apagado" sin depender del color. */
      --pr-off-fondo:           #F1F2F4;
      --pr-off-borde:           #C3C8D1;
      --pr-borde-control:       #D5D9E0;   /* borde de control de tablet, 2px */
      --pr-panel-gris:          #F4F5F7;
      /* El bordó, aclarado, para un borde punteado de "no se puede todavía"
         que igual se lee como bordó. No hay equivalente global. */
      --pr-bordo-borde:         #C9A0AC;
      /* El borde de un botón secundario y de una casilla sin marcar. Ninguno
         de los grises de main.css llega a 3:1 como borde de control
         (--color-borde da 1,2:1 y --pr-borde-control 1,45:1 sobre blanco). */
      --pr-borde-boton:         #737C8D;   /* 4,20:1 blanco · 3,39:1 fondo Producción · 3,8:1 fondo Sala */
    }

    /* ── EL ACENTO: NARANJA, NO AZUL (parte 1 de "terminar la tablet") ─────
       El handoff de diseño decía que la tablet no tuviera azules: el acento
       es el de la app, el naranja de css/main.css. Naranja para lo que SE
       TOCA (botones, foco, lo elegido); los grises de texto y borde para lo
       que solo se lee. Verde y bordó siguen siendo solo de validez.

       Lo ELEGIDO adentro de un modo (la máquina, Simple/Doble, el turno, la
       persona, un chip, una casilla) va en naranja en los DOS modos: los
       colores de modo (--pr-prod-*, --pr-masa-*) quedan para el fondo de la
       pantalla y la barra, y el amarillo fuerte ya no marca una elección
       adentro de la Sala de masa, donde competía con todo.

       Contrastes medidos (WCAG 2.1; texto normal >= 4,5:1, texto grande y
       bordes >= 3:1):
         blanco sobre --naranja ............................... 5,18:1
         --naranja-oscuro sobre --naranja-suave ............... 7,19:1
         --color-texto sobre --naranja-suave ................. 16,66:1
         borde --naranja sobre blanco ......................... 5,18:1
         borde --naranja sobre --naranja-suave ................ 4,57:1
         foco/borde --naranja sobre el fondo de Producción .... 4,18:1 (borde sí; texto chico NO:
                                                                ahí va --naranja-oscuro, 6,57:1)
         foco/borde --naranja sobre el fondo de Sala de masa .. 4,70:1
         --naranja-oscuro sobre el fondo de Sala de masa ...... 7,39:1
         borde --pr-borde-boton sobre blanco .................. 4,20:1
         --color-texto sobre blanco (botón secundario) ....... 18,88:1
         separador --pr-borde-boton sobre blanco .............. 4,20:1
       El naranja NUNCA va sobre --pr-prod-activo (el gris oscuro del botón
       PRODUCCIÓN): ahí da 1,83:1. Por eso la barra de modos no lleva naranja. */

    /* El fondo de toda la pantalla toma el color del modo: desde la puerta se
       sabe en qué modo está la tablet aunque no se llegue a leer la barra.
       Le gana a .pagina-modulo de main.css por especificidad (0,1,1 contra
       0,1,0) y porque este <style> carga después. */
    body.pr-modo-produccion { background-color: var(--pr-prod-fondo); }
    body.pr-modo-masa       { background-color: var(--pr-masa-fondo); }

    .pr-app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem calc(2rem + env(safe-area-inset-bottom));
      min-width: 0;
    }

    /* ── Cabecera ─────────────────────────────────────────────────────── */
    .pr-header {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.875rem 1rem; margin: 0.75rem 0 1rem;
      background: var(--color-fondo); border-radius: var(--radio-tarjeta);
      border: 1px solid var(--borde-tarjeta); box-shadow: var(--sombra-tarjeta);
    }
    .pr-header__volver {
      display: inline-flex; align-items: center; min-height: var(--pr-alto-boton);
      padding: 0 0.75rem; color: var(--color-acento); font-weight: 600;
      text-decoration: none; border-radius: var(--radio-boton);
    }
    .pr-header__col { display: flex; flex-direction: column; min-width: 0; flex: 1 1 12rem; }
    .pr-header__marca { font-size: 1.125rem; color: var(--pr-texto-secundario); font-weight: 600; letter-spacing: 0.02em; }
    /* El nombre del módulo UNA sola vez y, al lado y en chico, la unidad y la
       persona activa. Antes decía "Producción • Producción" y otra vez
       "Producción" abajo: la sección repetía el nombre del modo. */
    .pr-header__fila { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; min-width: 0; }
    .pr-header__titulo { font-size: 1.35rem; font-weight: 800; color: var(--color-texto); }
    .pr-header__contexto { font-size: 1.125rem; color: var(--pr-texto-secundario); overflow-wrap: anywhere; min-width: 0; }
    .pr-header__acciones { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* ── Botones ──────────────────────────────────────────────────────── */
    .pr-btn {
      min-height: var(--pr-alto-boton); padding: 0 1.25rem;
      font: inherit; font-size: 1.125rem; font-weight: 700;
      border-radius: var(--radio-boton); border: 2px solid var(--naranja);
      background: var(--naranja); color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      text-align: center; touch-action: manipulation;
    }
    .pr-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .pr-btn--secundario { background: var(--color-fondo); border-color: var(--pr-borde-boton); color: var(--color-texto); }
    .pr-btn--peligro { background: var(--bordo); border-color: var(--bordo); color: #fff; }
    .pr-btn--ancho { width: 100%; }
    .pr-btn--grande { min-height: 80px; font-size: 1.35rem; }
    /* La acción principal de una pantalla de tablet: 64px y naranja, que en
       este proyecto significa "esto es lo que hay que tocar acá". Mismo
       precedente que la tecla Entrar del PIN (rediseño parte 1). */
    .pr-btn--accion {
      min-height: 64px; font-size: 1.25rem; font-weight: 800;
      background: var(--naranja); border-color: var(--naranja); color: #fff;
    }
    /* "Cerrar planilla de ayer" lleva las DOS clases, y --accion está definida
       DESPUÉS de --peligro: con la misma especificidad gana la de abajo, así
       que sin esta regla el botón saldría naranja en vez de bordó. Es la
       trampa del orden entre variantes de la misma clase, ya documentada. */
    .pr-btn--peligro.pr-btn--accion { background: var(--bordo); border-color: var(--bordo); }

    /* ── Tarjetas y avisos ────────────────────────────────────────────── */
    .pr-tarjeta {
      background: var(--color-fondo); border-radius: var(--radio-tarjeta);
      border: 1px solid var(--borde-tarjeta); box-shadow: var(--sombra-tarjeta);
      padding: 1.25rem; margin-bottom: 1rem; min-width: 0;
    }
    .pr-titulo { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.75rem; color: var(--color-texto); }
    .pr-subtitulo { font-size: 1.2rem; font-weight: 700; margin: 1rem 0 0.5rem; color: var(--color-texto); }
    .pr-texto-suave { color: var(--pr-texto-secundario); }
    .pr-vacio { padding: 2rem 1rem; text-align: center; font-size: 1.2rem; color: var(--pr-texto-secundario); }
    .pr-aviso {
      padding: 0.875rem 1rem; border-radius: var(--radio-input); margin: 0.75rem 0;
      background: var(--color-superficie); border-left: 5px solid var(--color-acento-gris);
      color: var(--color-texto); font-size: 1.125rem;
    }
    .pr-aviso--grave { background: var(--bordo-suave); border-left-color: var(--bordo); color: var(--bordo-oscuro); font-weight: 600; }

    /* ── Grillas de botones grandes (modo, unidad, "¿Quién sos?") ─────── */
    .pr-grilla {
      display: grid; gap: 0.875rem;
      /* auto-fit + ancho máximo + centrado: con pocas opciones no quedan
         pegadas a la izquierda con media pantalla vacía. */
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 22rem));
      justify-content: center;
    }
    .pr-opcion {
      min-height: 88px; padding: 1rem; font: inherit; font-size: 1.3rem; font-weight: 700;
      text-align: left; border-radius: var(--radio-tarjeta); cursor: pointer;
      border: 2px solid var(--borde-tarjeta); background: var(--color-fondo); color: var(--color-texto);
      box-shadow: var(--sombra-tarjeta); display: flex; flex-direction: column; justify-content: center; gap: 0.25rem;
      overflow-wrap: anywhere; touch-action: manipulation;
    }
    .pr-opcion:focus-visible, .pr-btn:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .pr-opcion__detalle { font-size: 1.125rem; font-weight: 500; color: var(--pr-texto-secundario); }

    /* ── Barra de modos ───────────────────────────────────────────────────
       Fija arriba en toda la tablet. Los dos modos se reparten el ancho; a la
       derecha la persona, la unidad y Salir. NO hay "Volver": la tablet está
       en modo kiosco y el cambio de modo son estos dos botones. */
    .pr-barra {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 0.375rem; padding: 4px; margin: 0 0 1rem;
      min-height: 64px; align-items: stretch;
      background: var(--color-fondo); border-radius: 16px;
      border: 1px solid var(--pr-borde-control); box-shadow: var(--sombra-tarjeta);
    }
    .pr-modo {
      flex: 1 1 0; min-width: 0; min-height: 56px;
      display: flex; align-items: center; justify-content: center; gap: 0.625rem; flex-wrap: wrap;
      font: inherit; font-size: 1.375rem; font-weight: 800; letter-spacing: 0.1em;
      border-radius: 12px; cursor: pointer; touch-action: manipulation; text-align: center;
      border: 2px solid var(--pr-prod-apagado-borde); background: var(--color-fondo);
      color: var(--pr-prod-apagado-letra);
    }
    .pr-modo--masa { border-color: var(--pr-masa-apagado-borde); color: var(--pr-masa-apagado-letra); }
    .pr-modo[aria-pressed="true"] {
      background: var(--pr-prod-activo); border-color: var(--pr-prod-activo);
      color: var(--pr-prod-letra); font-weight: 900;
    }
    .pr-modo--masa[aria-pressed="true"] {
      background: var(--pr-masa-activo); border: 3px solid var(--pr-masa-activo-borde);
      color: var(--pr-masa-letra); font-weight: 900;
    }
    /* Deshabilitado ≠ apagado: el BORDE PUNTEADO lo dice sin usar color. */
    .pr-modo:disabled {
      background: var(--pr-off-fondo); border: 2px dashed var(--pr-off-borde);
      color: var(--color-texto-suave); cursor: not-allowed; opacity: 1;
    }
    .pr-modo__nota { font-size: 1.125rem; font-weight: 600; letter-spacing: normal; }
    .pr-barra__persona {
      display: flex; align-items: center; gap: 0.875rem; padding: 0 0.125rem 0 1rem;
      min-width: 0; flex-wrap: wrap; justify-content: flex-end;
    }
    .pr-barra__quien { text-align: right; font-size: 1.125rem; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
    .pr-barra__rol { font-weight: 600; color: var(--pr-prod-apagado-letra); }
    .pr-barra__nombre { font-weight: 700; }
    .pr-barra__unidad { color: var(--color-texto-suave); }
    /* "Tocá para entrar": un botón de verdad, con el alto de la tablet. */
    .pr-barra__entrar {
      min-height: var(--pr-alto-boton); padding: 0 1.25rem; font: inherit; font-size: 1.125rem; font-weight: 800;
      border-radius: var(--radio-boton); border: 2px solid var(--naranja); background: var(--naranja-suave);
      color: var(--naranja-oscuro); cursor: pointer; touch-action: manipulation;
    }
    .pr-barra__entrar:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    /* ¿Quién sos? con la persona del modo ya guardada. */
    .pr-quien__fija { display: flex; flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    .pr-quien__fija-texto { font-size: 1.75rem; font-weight: 800; overflow-wrap: anywhere; }
    /* En el tablero: quién está adentro de Sala de masa, y sacarlo. */
    .pr-masero-adentro {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.625rem 1rem; margin: 0.75rem 0; border-radius: var(--radio-input);
      background: var(--pr-panel-gris); font-size: 1.125rem; overflow-wrap: anywhere;
    }
    @media (max-width: 900px) {
      .pr-barra { flex-wrap: wrap; }
      .pr-modo { flex: 1 1 45%; }
      .pr-barra__persona { flex: 1 1 100%; padding: 0.375rem 0.25rem 0; justify-content: space-between; }
    }

    /* El acceso maestro, mientras está activo, se dice arriba de todo: lo que
       se haga queda a nombre de esa persona. */
    .pr-maestro {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.875rem 1.125rem; margin-bottom: 1rem; border-radius: var(--radio-tarjeta);
      background: var(--pr-panel-gris); border: 2px solid var(--pr-prod-activo);
      color: var(--color-texto); font-size: 1.125rem; font-weight: 700; overflow-wrap: anywhere;
    }
    .pr-maestro__botones { display: flex; gap: 0.5rem; flex-wrap: wrap; }


    /* ── "¿Quién sos?" + PIN ──────────────────────────────────────────────
       Nombres a la izquierda y teclado siempre a la derecha: se elige y se
       tipea sin cambiar de pantalla. */
    .pr-quien { display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 1.25rem; align-items: start; }
    .pr-quien__col { display: flex; flex-direction: column; gap: 1.125rem; min-width: 0; }
    .pr-quien__puesto { font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-quien__buscar { min-height: 60px; font-size: 1.25rem; }
    .pr-quien__nombres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
    .pr-quien__nombres .pr-opcion { min-height: 76px; font-size: 1.375rem; padding: 0 1.375rem; }
    .pr-quien__nombres .pr-opcion[aria-pressed="true"] {
      border: 3px solid var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro);
    }
    .pr-quien__hoy {
      display: inline-block; margin-left: 0.5rem; padding: 0.1rem 0.625rem; border-radius: 999px;
      font-size: 1.125rem; font-weight: 700; background: var(--naranja-suave); color: var(--naranja-oscuro);
    }
    /* Las salidas discretas de la pantalla, abajo a la izquierda. */
    .pr-quien__pie { margin-top: auto; display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .pr-link {
      min-height: var(--pr-alto-boton); padding: 0 1.125rem; font: inherit; font-size: 1.125rem; font-weight: 600;
      border: none; background: none; color: var(--pr-texto-secundario); text-decoration: underline;
      cursor: pointer; touch-action: manipulation;
    }
    @media (max-width: 1000px) {
      .pr-quien { grid-template-columns: minmax(0, 1fr); }
      .pr-quien__nombres { grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); }
    }

    .pr-pin { display: flex; flex-direction: column; gap: 1.125rem; }
    .pr-pin--maestro { background: var(--pr-panel-gris); }
    .pr-pin__cab { text-align: center; }
    .pr-pin__saludo { font-size: 1.625rem; font-weight: 800; overflow-wrap: anywhere; }
    .pr-pin__sub { font-size: 1.25rem; color: var(--pr-texto-secundario); margin-top: 0.25rem; }
    .pr-pin__tramos { display: flex; gap: 0.5rem; }
    .pr-pin__tramo { flex: 1; height: 8px; border-radius: 4px; background: var(--pr-borde-control); }
    .pr-pin__tramo--hecho { background: var(--color-texto); }
    .pr-pin__pasos { display: flex; justify-content: space-between; font-size: 1.125rem; font-weight: 700; }
    .pr-pin__paso--falta { color: var(--color-texto-suave); }
    /* Los puntos: NUNCA el número tipeado. Son formas, no texto. */
    .pr-pin__puntos { display: flex; gap: 1.375rem; justify-content: center; padding: 0.5rem 0; flex-wrap: wrap; }
    .pr-pin__punto { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--pr-prod-apagado-borde); }
    .pr-pin__punto--lleno { background: var(--color-texto); border-color: var(--color-texto); }
    .pr-pin__punto--mal { border-color: var(--bordo); background: none; }
    .pr-pin--maestro .pr-pin__puntos { gap: 0.75rem; }
    .pr-pin--maestro .pr-pin__punto { width: 22px; height: 22px; }
    .pr-pin--maestro .pr-pin__punto--lleno { background: var(--pr-prod-activo); border-color: var(--pr-prod-activo); }
    /* El mensaje va entre los puntos y el teclado: donde está mirando. */
    .pr-pin__mensaje {
      background: var(--bordo-suave); border-left: 6px solid var(--bordo); border-radius: var(--radio-input);
      padding: 0.875rem 1rem; font-size: 1.25rem; font-weight: 700; color: var(--bordo-oscuro); text-align: center;
      overflow-wrap: anywhere;
    }
    .pr-pin__bloqueo {
      background: var(--bordo-suave); border: 2px solid var(--bordo); border-radius: 16px;
      padding: 1.375rem; text-align: center; color: var(--bordo-oscuro);
    }
    .pr-pin__bloqueo-rotulo { font-size: 1.25rem; font-weight: 700; }
    .pr-pin__reloj { font-size: 4.5rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -0.02em; }
    .pr-pin__teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: auto; }
    .pr-pin__teclado--off { opacity: 0.35; }
    .pr-tecla {
      min-height: 84px; font: inherit; font-size: 2.25rem; font-weight: 700;
      border-radius: 14px; border: 2px solid var(--pr-borde-control); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-tecla--texto { font-size: 1.25rem; background: var(--pr-panel-gris); }
    .pr-tecla--accion { font-size: 1.375rem; font-weight: 800; border: none; background: var(--naranja); color: #fff; }
    /* El acceso maestro es de excepción: su tecla de acción no compite con el
       naranja, que en este proyecto significa "la acción de esta pantalla". */
    .pr-pin--maestro .pr-tecla--accion { background: var(--pr-prod-activo); }
    .pr-tecla:disabled { cursor: not-allowed; }
    @media (max-width: 420px) { .pr-tecla { min-height: 72px; } }

    /* El PIN temporal que devuelve otorgar_puesto_temporal: se muestra UNA vez
       y no se guarda en ningún lado. */
    .pr-pin-nuevo { font-size: 4.5rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }

    /* El menú de la tablet: un panel que se despliega bajo la cabecera. */
    .pr-menu { display: grid; gap: 0.625rem; }
    .pr-menu .pr-btn { justify-content: flex-start; }

    /* ── Formularios ───────────────────────────────────────────────────── */
    .pr-fila-titulo { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .pr-fila-titulo .pr-titulo { margin: 0; }
    .pr-fila-titulo__col { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; min-width: 0; }
    .pr-fila-titulo__botones { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; }
    .pr-espacio-arriba { margin-top: 1rem; }
    .pr-campos { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
    .pr-campo { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
    .pr-campo__rotulo { font-weight: 700; font-size: 1.125rem; }
    .pr-input, .pr-select, .pr-textarea {
      min-height: var(--pr-alto-boton); padding: 0 0.875rem; font: inherit; font-size: 1.125rem;
      border: 2px solid var(--color-borde); border-radius: var(--radio-input); background: var(--color-fondo);
      color: var(--color-texto); width: 100%; min-width: 0; box-sizing: border-box;
    }
    .pr-textarea { padding: 0.75rem 0.875rem; min-height: 96px; resize: vertical; }
    .pr-input:focus, .pr-select:focus, .pr-textarea:focus { outline: none; border-color: var(--naranja); }
    .pr-error { color: var(--bordo); font-weight: 700; margin: 0.75rem 0 0; }
    .pr-acciones { display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1.25rem; }
    .pr-acciones .pr-btn { flex: 1 1 12rem; }

    /* Segmentado grande (turno, simple/doble). */
    .pr-segmento { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pr-segmento__opcion {
      flex: 1 1 6rem; min-height: var(--pr-alto-boton); font: inherit; font-size: 1.15rem; font-weight: 700;
      border-radius: var(--radio-boton); border: 2px solid var(--color-borde); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-segmento__opcion[aria-pressed="true"] { background: var(--naranja); border-color: var(--naranja); color: #fff; }

    /* ── Tarjeta de máquina, la base ──────────────────────────────────────
       La comparten el TABLERO del encargado, la elección de máquina de la Sala
       de masa y el historial. Lo que sigue acá es lo de siempre; el rediseño
       del tablero (parte 2) va abajo, ACOTADO a .pr-tablero, para no cambiarle
       el aspecto a las otras dos pantallas, que se rehacen en otra parte. */
    .pr-maquina {
      min-height: 120px; padding: 1rem 1.125rem; border-radius: var(--radio-tarjeta);
      border: 2px solid var(--borde-tarjeta); background: var(--color-fondo); box-shadow: var(--sombra-tarjeta);
      display: flex; flex-direction: column; gap: 0.375rem; text-align: left; font: inherit; color: var(--color-texto);
      overflow-wrap: anywhere; min-width: 0;
    }
    button.pr-maquina { cursor: pointer; touch-action: manipulation; }
    .pr-maquina__nombre { font-size: 1.35rem; font-weight: 800; }
    .pr-maquina__estado { font-size: 1.125rem; font-weight: 600; color: var(--pr-texto-secundario); }

    /* ── Tablero de máquinas ──────────────────────────────────────────────
       Una tarjeta por máquina. El LOTE es el número más grande de la tarjeta
       porque es lo que se copia a la planilla de papel. El orden lo decide
       ordenTablero(): abierta de ayer → paradas → abiertas → libres. */
    /* 32px y 28px son los del diseño para estas dos pantallas. Van acotados:
       .pr-titulo la usan todas las pantallas del módulo. */
    #pr-produccion .pr-titulo { font-size: 2rem; }
    .pr-abrir__panel .pr-titulo { font-size: 1.75rem; }
    /* auto-FIT y no auto-fill: con dos máquinas en 1280 px, auto-fill dejaba
       una tercera columna vacía y las tarjetas pegadas a la izquierda. Con
       auto-fit las columnas vacías colapsan y las que hay se reparten el
       ancho. Una sola tarjeta no se estira a 1248 px: se centra con un ancho
       razonable. */
    .pr-tablero { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }
    .pr-tablero:not(:has(> :nth-child(2))) { max-width: 36rem; margin-inline: auto; }
    .pr-tablero .pr-maquina { min-height: 150px; padding: 1.125rem 1.375rem; }
    .pr-tablero .pr-maquina__nombre { font-size: 1.5rem; }
    .pr-tablero .pr-maquina__estado { font-size: 1.25rem; font-weight: 400; color: var(--pr-texto-secundario); margin-top: auto; }
    .pr-maquina__cab { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .pr-maquina__chip {
      font-size: 1.125rem; font-weight: 700; border-radius: 999px; padding: 0.15rem 0.75rem; white-space: nowrap;
      background: var(--pr-prod-fondo); color: var(--pr-prod-activo);
    }
    .pr-maquina__lote { font-size: 3.25rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.05; }
    .pr-maquina__cuenta { font-size: 1.25rem; font-weight: 700; }
    /* Abierta hoy: franja izquierda de 8px en el gris del modo Producción. */
    .pr-maquina--activa { border-left: 8px solid var(--pr-prod-activo); }
    /* Parada: la MISMA franja pero en bordó, y el chip dice "Parada". El color
       nunca va solo: el renglón dice desde cuándo y por qué. */
    .pr-maquina--parada { border-left: 8px solid var(--bordo); }
    .pr-maquina--parada .pr-maquina__chip { background: var(--bordo); color: #fff; }
    .pr-tablero .pr-maquina--parada .pr-maquina__estado { color: var(--bordo-oscuro); font-weight: 700; }
    /* Libre: gris y con el borde PUNTEADO, que dice "acá no hay nada" sin
       depender del color. No es un botón: no lleva a ninguna planilla. */
    .pr-maquina--libre { background: var(--pr-panel-gris); border: 2px dashed var(--pr-off-borde); box-shadow: none; }
    .pr-maquina--libre .pr-maquina__nombre { color: var(--pr-texto-secundario); }
    .pr-maquina__libre { font-size: 2.5rem; font-weight: 800; color: var(--color-texto-suave); margin-top: auto; }
    /* La abierta de AYER va a TODO EL ANCHO y antes que todas: esa máquina no
       se puede volver a abrir hasta que alguien cierre su planilla, así que no
       se puede pasar por alto. */
    .pr-maquina--ayer {
      grid-column: 1 / -1; min-height: 0; border: 3px solid var(--bordo);
      flex-direction: row; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    }
    .pr-sello {
      background: var(--bordo); color: #fff; border-radius: 12px; padding: 0.625rem 1rem;
      font-size: 1.125rem; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
    }
    .pr-maquina--ayer .pr-maquina__cuerpo { flex: 1 1 18rem; min-width: 0; }
    .pr-maquina--ayer .pr-maquina__cab { display: flex; align-items: baseline; justify-content: flex-start; gap: 1rem; flex-wrap: wrap; }
    .pr-maquina--ayer .pr-maquina__nombre { font-size: 1.625rem; }
    .pr-maquina--ayer .pr-maquina__lote { font-size: 2.5rem; color: var(--bordo-oscuro); }
    .pr-tablero .pr-maquina--ayer .pr-maquina__estado { font-size: 1.25rem; color: var(--bordo-oscuro); margin-top: 0.125rem; }

    /* ── Abrir turno ──────────────────────────────────────────────────────
       Fecha y turno a la izquierda; a la derecha una fila por máquina con su
       casilla y sus operarios. */
    .pr-abrir { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 1.25rem; align-items: stretch; }
    /* El margen de .pr-tarjeta sobra adentro de una grilla que ya tiene gap. */
    .pr-abrir > .pr-tarjeta { margin-bottom: 0; }
    .pr-abrir__panel { display: flex; flex-direction: column; gap: 1.375rem; }
    .pr-abrir__pie { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .pr-abrir__resumen { font-size: 1.125rem; color: var(--pr-texto-secundario); text-align: center; }
    /* La fecha va con ‹ ›: en la tablet, con harina en las manos, el
       calendario nativo no se puede usar. Nunca va hacia adelante de hoy. */
    .pr-fecha { display: flex; gap: 0.5rem; align-items: stretch; }
    .pr-fecha__paso {
      width: 56px; min-height: 64px; flex-shrink: 0; font: inherit; font-size: 1.625rem; font-weight: 700;
      border-radius: 14px; border: 2px solid var(--pr-borde-control); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-fecha__paso:disabled { opacity: 0.4; cursor: not-allowed; }
    .pr-fecha__valor {
      flex: 1; min-height: 64px; min-width: 0; border: 2px solid var(--pr-borde-control); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
    }
    .pr-fecha__dia { font-size: 1.375rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pr-fecha__nota { font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-segmento--columna { flex-direction: column; flex-wrap: nowrap; }
    .pr-segmento--columna .pr-segmento__opcion { min-height: 64px; font-size: 1.375rem; flex: 0 0 auto; }
    .pr-segmento--columna .pr-segmento__opcion[aria-pressed="true"] {
      background: var(--naranja); border-color: var(--naranja); color: #fff;
    }
    .pr-abrir-fila { padding: 0.75rem 0; border-bottom: 1px solid var(--color-borde); }
    .pr-abrir-fila__cab { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    /* La casilla es un checkbox DE VERDAD —lo lee un lector de pantalla—
       dibujado a 56×56 para marcarlo con el dedo. */
    .pr-casilla {
      width: 56px; height: 56px; flex-shrink: 0; margin: 0; appearance: none; -webkit-appearance: none;
      border: 3px solid var(--pr-borde-boton); border-radius: 12px; background: var(--color-fondo);
      cursor: pointer; touch-action: manipulation; display: grid; place-content: center;
    }
    .pr-casilla::after { content: '\2713'; font-size: 1.875rem; font-weight: 900; color: #fff; visibility: hidden; }
    .pr-casilla:checked { background: var(--naranja); border-color: var(--naranja); }
    .pr-casilla:checked::after { visibility: visible; }
    .pr-casilla:disabled { cursor: not-allowed; border-style: dashed; border-color: var(--pr-bordo-borde); background: var(--bordo-suave); }
    .pr-abrir-fila__nombre { width: 150px; flex-shrink: 0; font-size: 1.375rem; font-weight: 800; overflow-wrap: anywhere; }
    /* La tira de chips de operarios: la comparten la fila de Abrir turno y el
       bloque de la planilla, por eso el nombre no nombra ninguna de las dos. */
    .pr-ops { flex: 1 1 12rem; display: flex; gap: 0.5rem; flex-wrap: wrap; min-width: 0; }
    .pr-abrir-fila__nota { flex: 1 1 12rem; font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-abrir-fila--bloqueada .pr-abrir-fila__nombre { color: var(--bordo-oscuro); }
    .pr-abrir-fila--bloqueada .pr-abrir-fila__nota { color: var(--bordo-oscuro); font-weight: 700; }
    .pr-chip-op {
      min-height: 56px; max-width: 100%; display: inline-flex; align-items: center; padding-left: 1rem;
      border-radius: 12px; background: var(--pr-prod-fondo); font-size: 1.25rem; font-weight: 700;
      color: var(--color-texto); overflow-wrap: anywhere;
    }
    .pr-chip-op--fuera { background: var(--pr-panel-gris); color: var(--pr-texto-secundario); font-weight: 600; padding-right: 1rem; }
    .pr-chip-op__x {
      width: 52px; min-height: 56px; flex-shrink: 0; border: none; background: none; font: inherit;
      font-size: 1.5rem; color: var(--pr-texto-secundario); cursor: pointer; touch-action: manipulation;
    }
    /* El buscador se abre DENTRO de la fila que lo pidió y no en un modal: así
       no se pierde de vista a qué máquina se le está poniendo el operario. */
    .pr-buscador-op {
      margin: 0.625rem 0 0 72px; border: 2px solid var(--pr-prod-activo); border-radius: 14px;
      padding: 0.625rem; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0;
    }
    .pr-buscador-op__linea { display: flex; gap: 0.5rem; }
    .pr-buscador-op__linea .pr-input { flex: 1; min-height: 56px; font-size: 1.25rem; min-width: 0; }
    .pr-buscador-op__res { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pr-op {
      flex: 1 1 12rem; min-height: 56px; padding: 0 1rem; border-radius: 12px;
      border: 2px solid var(--pr-borde-control); background: var(--color-fondo); color: var(--color-texto);
      font: inherit; font-size: 1.25rem; font-weight: 700; text-align: left;
      cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere;
    }
    .pr-op:disabled {
      background: var(--pr-panel-gris); border-color: var(--borde-tarjeta); color: var(--color-texto-suave);
      font-size: 1.125rem; font-weight: 600; cursor: not-allowed;
    }
    .pr-op__nada { font-size: 1.125rem; color: var(--pr-texto-secundario); }

    /* Los lotes recién asignados: el número se copia a la planilla de papel
       desde un metro de distancia. */
    .pr-exito-turno { display: flex; align-items: center; gap: 1rem; }
    .pr-exito-turno__tilde {
      width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: var(--verde); color: #fff;
      font-size: 2rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .pr-exito-turno__titulo { font-size: 2rem; font-weight: 900; }
    .pr-lotes { display: grid; gap: 1.125rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
    .pr-lote-tarjeta {
      background: var(--color-fondo); border: 2px solid var(--borde-tarjeta); border-radius: var(--radio-tarjeta);
      padding: 1.625rem; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; overflow-wrap: anywhere;
    }
    .pr-lote-tarjeta__maquina { font-size: 1.625rem; font-weight: 800; }
    .pr-lote-tarjeta__lote { font-size: 7.75rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
    .pr-lote-tarjeta__ops { font-size: 1.25rem; color: var(--pr-texto-secundario); }

    @media (max-width: 1000px) {
      .pr-abrir { grid-template-columns: minmax(0, 1fr); }
      .pr-buscador-op { margin-left: 0; }
    }
    @media (max-width: 600px) {
      .pr-abrir-fila__nombre { width: auto; }
      .pr-lote-tarjeta__lote { font-size: 4.5rem; }
      /* En el celular las tarjetas se apilan y el diseño las achica: nombre de
         22px y lote de 40px, contra 24 y 52 de la tablet. */
      .pr-tablero .pr-maquina__nombre { font-size: 1.375rem; }
      .pr-maquina__lote { font-size: 2.5rem; }
      .pr-maquina--ayer .pr-maquina__lote { font-size: 1.75rem; }
    }

    /* ── Planilla ──────────────────────────────────────────────────────── */
    .pr-datos { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); margin: 0.5rem 0; }
    .pr-dato { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; overflow-wrap: anywhere; }
    .pr-dato__rotulo { font-size: 1.125rem; color: var(--pr-texto-secundario); font-weight: 600; }
    .pr-dato__valor { font-size: 1.25rem; font-weight: 800; }
    /* La franja de parada: 80px, fija bajo la barra MIENTRAS DURE, con
       "Reanudar" al alcance. Sin parada en curso no existe (ver el handoff,
       5a), y el botón "Parada" aparece al lado de "Cerrar planilla". */
    .pr-parada-activa {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
      gap: 1.25rem; flex-wrap: wrap; padding: 0.625rem 1.25rem 0.625rem 1.75rem; margin-bottom: 0.875rem;
      min-height: 80px; box-sizing: border-box;
      background: var(--bordo); color: #fff; border-radius: var(--radio-tarjeta);
      overflow-wrap: anywhere;
    }
    .pr-parada-activa__sello {
      border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 10px; padding: 0.375rem 0.75rem;
      font-size: 1.125rem; font-weight: 900; letter-spacing: 0.1em; white-space: nowrap;
    }
    .pr-parada-activa__que { font-size: 1.625rem; font-weight: 800; min-width: 0; }
    .pr-parada-activa__hace { font-size: 1.25rem; opacity: 0.85; font-variant-numeric: tabular-nums; }
    .pr-parada-activa .pr-btn { margin-left: auto; background: #fff; color: var(--bordo-oscuro); border-color: #fff; }
    .pr-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
    .pr-lista__item { padding: 0.75rem 1rem; border-radius: var(--radio-input); background: var(--color-superficie); overflow-wrap: anywhere; }
    .pr-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
    .pr-chip {
      min-height: var(--pr-alto-boton); padding: 0 1rem; font: inherit; font-size: 1.125rem; font-weight: 600;
      border-radius: 999px; border: 2px solid var(--color-borde); background: var(--color-fondo); color: var(--color-texto);
      cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere; text-align: left;
    }
    .pr-chip[aria-pressed="true"] { border-color: var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); }

    /* ── La planilla: dos columnas ────────────────────────────────────────
       A la izquierda lo que se MIRA (operarios, masas, paradas) y a la derecha
       lo que se CARGA: lo producido, que desde el rediseño parte 3 se carga
       DURANTE el turno y no al cerrar. */
    .pr-planilla { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 0.875rem; align-items: start; }
    .pr-planilla > .pr-tarjeta, .pr-planilla .pr-col > .pr-tarjeta { margin-bottom: 0; }
    .pr-col { display: flex; flex-direction: column; gap: 0.875rem; min-width: 0; }

    /* La cabecera: el LOTE es el número más grande de la pantalla porque es lo
       que se copia a la planilla de papel. */
    .pr-planilla-cab {
      display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
      background: var(--color-fondo); border-radius: var(--radio-tarjeta);
      border: 1px solid var(--borde-tarjeta); box-shadow: var(--sombra-tarjeta);
      padding: 0.625rem 0.875rem 0.625rem 1.5rem; margin-bottom: 0.875rem;
    }
    .pr-planilla-cab__lote { display: flex; align-items: baseline; gap: 0.875rem; min-width: 0; }
    .pr-planilla-cab__rotulo { font-size: 1.25rem; font-weight: 800; color: var(--color-texto-suave); letter-spacing: 0.08em; }
    .pr-planilla-cab__numero { font-size: 4rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
    .pr-planilla-cab__que { font-size: 1.25rem; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
    .pr-planilla-cab__maquina { font-weight: 800; }
    .pr-planilla-cab__turno { color: var(--pr-texto-secundario); }
    .pr-planilla-cab__botones { margin-left: auto; display: flex; gap: 0.625rem; flex-wrap: wrap; }
    .pr-planilla-cab .pr-btn--accion { border: 2px solid var(--pr-prod-activo); background: var(--color-fondo); color: var(--pr-prod-activo); }
    /* "Cerrar planilla" TERMINA el turno de esa máquina: no puede verse igual
       que "Parada" y "Máquinas". Va lleno en naranja, más ancho y separado de
       los otros dos por una raya. Esta regla va DESPUÉS de la de arriba y con
       la misma especificidad (0,2,0): si se mueve antes, la pisa y el botón
       vuelve a salir blanco. */
    .pr-planilla-cab .pr-planilla-cab__cerrar {
      background: var(--naranja); border-color: var(--naranja); color: #fff;
      min-width: 16rem; padding: 0 2rem; font-size: 1.35rem; font-weight: 900;
    }
    .pr-planilla-cab__sep { align-self: stretch; width: 2px; margin: 0.25rem 0.625rem; background: var(--pr-borde-boton); border-radius: 1px; }

    /* Los bloques de la columna izquierda. */
    .pr-bloque__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
    .pr-bloque__titulo { font-size: 1.25rem; font-weight: 800; }
    .pr-bloque__nota { font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-masas__cuenta { display: flex; align-items: baseline; gap: 0.625rem; flex-wrap: wrap; margin: 0.375rem 0; }
    .pr-masas__numero { font-size: 2.5rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
    .pr-masas__ultima { font-size: 1.25rem; color: var(--pr-texto-secundario); }
    .pr-renglon {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.4375rem 0; border-top: 1px solid var(--color-borde); font-size: 1.125rem; overflow-wrap: anywhere;
    }
    .pr-renglon__num { font-variant-numeric: tabular-nums; }
    .pr-renglon__dato { color: var(--pr-texto-secundario); }
    /* La parada en curso va primera y en bordó: es la única que sigue pasando. */
    .pr-renglon--curso .pr-renglon__dato { color: var(--bordo-oscuro); font-weight: 800; }

    /* ── Lo producido ─────────────────────────────────────────────────────
       Cada renglón es un SUBLOTE que ya existe en la base: registrarlo suma el
       stock terminado en el acto. Por eso se corrige o se anula con motivo, y
       un anulado NO se esconde: se muestra anulado. */
    .pr-producido-col { display: flex; flex-direction: column; min-height: 0; }
    .pr-producido-col .pr-bloque__cab { align-items: center; margin-bottom: 0.25rem; }
    .pr-producido {
      display: grid; grid-template-columns: 104px minmax(0, 1fr) 100px 110px auto; gap: 0.875rem;
      align-items: center; padding: 0.625rem 0; border-top: 1px solid var(--color-borde);
    }
    .pr-producido--anulado { opacity: 0.55; }
    .pr-producido--anulado .pr-producido__sublote { text-decoration: line-through; }
    .pr-producido--invalido { border-top-color: var(--bordo); background: var(--bordo-suave); }
    /* Un renglón que entró SIN CAJA: la caja no se descontó. En bordó, porque
       es un faltante de stock que alguien tiene que corregir a mano. */
    .pr-producido--sin-caja { border-top-color: var(--bordo); background: var(--bordo-suave); }
    .pr-sin-caja { color: var(--bordo-oscuro); font-weight: 700; }
    .pr-producido__sublote { font-size: 1.375rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pr-producido__desc { min-width: 0; line-height: 1.25; overflow-wrap: anywhere; }
    .pr-producido__nombre { font-size: 1.25rem; font-weight: 800; }
    .pr-producido__detalle { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-producido__cajas { font-size: 1.25rem; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
    .pr-producido__unidades { font-size: 1.25rem; color: var(--pr-texto-secundario); text-align: right; font-variant-numeric: tabular-nums; }
    .pr-producido__botones { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .pr-btn-icono {
      min-width: var(--pr-alto-boton); min-height: var(--pr-alto-boton); padding: 0 1rem; font: inherit;
      font-size: 1.125rem; font-weight: 700;
      border-radius: var(--radio-boton); border: 2px solid var(--pr-borde-control); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-btn-icono:disabled { opacity: 0.35; cursor: not-allowed; }
    .pr-btn-icono--borrar { color: var(--bordo-oscuro); border-color: var(--pr-bordo-borde); }
    .pr-total {
      margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
      flex-wrap: wrap; padding-top: 0.75rem; border-top: 2px solid var(--color-texto);
    }
    .pr-total__rotulo { font-size: 1.25rem; font-weight: 800; }
    .pr-total__valor { font-size: 1.625rem; font-weight: 900; font-variant-numeric: tabular-nums; }

    /* El panel de corregir o anular un sublote: los dos piden motivo, porque
       la base los exige (>= 3 caracteres). */
    .pr-corregir { margin-top: 1rem; padding: 1rem; border: 2px solid var(--bordo); border-radius: var(--radio-tarjeta); }

    /* ── Agregar producto, en pasos ───────────────────────────────────────
       Los 5 pasos a la izquierda: el actual pintado, los hechos con lo
       elegido y tocables para volver, los que faltan apagados. Los pasos de
       cono y cajas comparten pantalla para ahorrar un toque. */
    .pr-ag { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 1rem; align-items: stretch; }
    .pr-ag--cono-cajas { grid-template-columns: 320px minmax(0, 1fr) 360px; }
    .pr-ag > .pr-tarjeta { margin-bottom: 0; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
    .pr-ag__lote { font-size: 1.125rem; font-weight: 700; color: var(--color-texto-suave); }
    .pr-ag .pr-titulo { font-size: 1.625rem; margin: 0 0 0.5rem; }
    .pr-paso-bloque {
      min-height: 64px; width: 100%; border-radius: 14px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; text-align: left;
      padding: 0.5rem 1rem; display: flex; flex-direction: column; justify-content: center; gap: 0.125rem;
      overflow-wrap: anywhere; box-sizing: border-box;
    }
    button.pr-paso-bloque { cursor: pointer; touch-action: manipulation; }
    .pr-paso-bloque__n { font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-paso-bloque__valor { font-size: 1.25rem; font-weight: 800; }
    .pr-paso-bloque--actual { background: var(--pr-prod-activo); border-color: var(--pr-prod-activo); color: var(--pr-prod-letra); }
    .pr-paso-bloque--actual .pr-paso-bloque__n { color: rgba(255, 255, 255, 0.85); }
    .pr-paso-bloque--falta { border-color: var(--borde-tarjeta); color: var(--color-texto-suave); font-weight: 700; font-size: 1.25rem; }
    .pr-ag__cancelar { margin-top: auto; }
    .pr-ag__titulo { font-size: 1.75rem; font-weight: 900; }
    .pr-ag__grilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
    .pr-ag__opcion {
      min-height: 88px; border-radius: 14px; border: 2px solid var(--pr-borde-control); background: var(--color-fondo);
      color: var(--color-texto); font: inherit; font-size: 1.375rem; font-weight: 800; text-align: left;
      padding: 0 1.25rem; cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere;
      display: flex; flex-direction: column; justify-content: center; gap: 0.125rem;
    }
    .pr-ag__opcion:disabled { background: var(--pr-panel-gris); color: var(--color-texto-suave); border-style: dashed; cursor: not-allowed; }
    .pr-ag__opcion[aria-pressed="true"] { border: 3px solid var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); }
    .pr-ag__opcion-nota { font-size: 1.125rem; font-weight: 600; color: var(--pr-texto-secundario); }
    /* Los de chocolate van ABAJO y separados por una línea de 3px con su
       nombre: es como se piden en la fábrica, y el marrón es el color que este
       proyecto ya usa para el chocolate (insumos). */
    .pr-ag__corte { display: flex; align-items: center; gap: 0.875rem; margin: 0.5rem 0 0.125rem; }
    .pr-ag__corte-texto { font-size: 1.25rem; font-weight: 800; color: var(--marron-oscuro); }
    .pr-ag__corte-linea { flex: 1; height: 3px; border-radius: 2px; background: var(--marron-oscuro); }
    .pr-ag__buscar { min-height: 64px; font-size: 1.375rem; }
    .pr-ag__lista { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
    .pr-cono {
      min-height: 72px; border-radius: 14px; border: 2px solid var(--pr-borde-control); background: var(--color-fondo);
      color: var(--color-texto); font: inherit; font-size: 1.375rem; font-weight: 700; text-align: left;
      padding: 0.5rem 1.25rem; cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere;
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
    }
    .pr-cono[aria-pressed="true"] { border: 3px solid var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); font-weight: 800; }
    .pr-cono__nota { font-size: 1.125rem; font-weight: 600; }
    /* Un cono propuesto desde la tablet se puede usar igual: lo dice el chip,
       no lo esconde. */
    .pr-cono__pendiente {
      font-size: 1.125rem; font-weight: 700; color: var(--naranja-oscuro); background: var(--naranja-suave);
      border-radius: 999px; padding: 0.1rem 0.75rem; white-space: nowrap;
    }
    .pr-ag__nuevo { min-height: 64px; border: 2px dashed var(--pr-prod-apagado-borde); background: var(--color-fondo); color: var(--pr-prod-activo); font-weight: 800; }
    .pr-ag__nota { font-size: 1.125rem; color: var(--color-texto-suave); text-align: center; }
    .pr-ag__alta { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pr-ag__alta .pr-input { flex: 1 1 10rem; min-height: 64px; font-size: 1.25rem; }
    /* − / número / + de 96px: el número se tipea igual, con enlazarCampoNumero. */
    .pr-contador { display: flex; gap: 0.625rem; align-items: stretch; }
    .pr-contador__paso {
      width: 80px; flex-shrink: 0; min-height: 96px; border-radius: 14px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; font-size: 2.75rem; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
    }
    .pr-contador .pr-input {
      flex: 1; min-width: 0; min-height: 96px; text-align: center; font-size: 3.5rem; font-weight: 900;
      font-variant-numeric: tabular-nums; border-color: var(--pr-prod-activo);
    }
    .pr-calculo { background: var(--pr-panel-gris); border-radius: 14px; padding: 1rem; text-align: center; }
    .pr-calculo__cuenta { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-calculo__total { font-size: 2.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pr-ag__confirmar { margin-top: auto; min-height: 72px; }
    /* ── La caja y el embolsado (empaque) ─────────────────────────────────
       La caja viene puesta (la de la unidad, o la única habilitada) y el
       paso se saltea: cambiarla es un toque sobre el resumen. Lo que va a
       consumir el renglón va en gris y chico: es informativo, lo descuenta
       la base. */
    .pr-ag__subtitulo { font-size: 1.25rem; font-weight: 800; margin-top: 0.25rem; }
    .pr-ag__grilla--emb { grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
    .pr-ag__grilla--emb .pr-ag__opcion { min-height: 64px; font-size: 1.25rem; }
    .pr-ag__consumo { font-size: 1.125rem; color: var(--pr-texto-secundario); margin: 0; overflow-wrap: anywhere; }
    .pr-ag__seguir { min-height: 64px; margin-top: auto; }
    .pr-ag__caja {
      min-height: 56px; width: 100%; border-radius: 14px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; font-size: 1.125rem; font-weight: 700;
      text-align: left; padding: 0.375rem 1rem; cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere;
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .pr-ag__caja-cambiar { color: var(--naranja-oscuro); font-weight: 800; white-space: nowrap; }
    .pr-ag__caja--falta { border-color: var(--bordo); background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .pr-ag__empaque { display: flex; flex-direction: column; gap: 0.5rem; }
    .pr-ag__empaque .pr-aviso { margin: 0; font-size: 1.125rem; }

    /* ── Cerrar planilla ──────────────────────────────────────────────────
       El error va PEGADO al botón y el campo que falta se marca; nunca un
       banner arriba de todo (regla del handoff). */
    .pr-cierre { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 1rem; align-items: stretch; }
    .pr-cierre > .pr-tarjeta { margin-bottom: 0; display: flex; flex-direction: column; gap: 1.125rem; min-width: 0; }
    .pr-rota {
      min-height: 72px; width: 100%; border-radius: 14px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; text-align: left;
      display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1.125rem; cursor: pointer;
      touch-action: manipulation; font-size: 1.375rem; font-weight: 800; overflow-wrap: anywhere;
    }
    .pr-rota__casilla {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 3px solid var(--pr-prod-apagado-borde);
      display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 900; color: transparent;
    }
    .pr-rota[aria-pressed="true"] { border: 3px solid var(--bordo); background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .pr-rota[aria-pressed="true"] .pr-rota__casilla { background: var(--bordo); border-color: var(--bordo); color: #fff; }
    .pr-cierre__campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 1.125rem; }
    .pr-campo__nota { font-size: 1.125rem; color: var(--color-texto-suave); margin: 0.375rem 0 0; }
    .pr-campo--mal .pr-campo__nota { color: var(--bordo-oscuro); font-weight: 700; }
    .pr-campo--mal .pr-contador .pr-input { border: 3px solid var(--bordo); background: var(--bordo-suave); }
    .pr-campo--mal .pr-textarea { border: 3px solid var(--bordo); background: var(--bordo-suave); }
    .pr-contador--chico .pr-contador__paso { width: 64px; min-height: 72px; font-size: 2.125rem; }
    .pr-contador--chico .pr-input { min-height: 72px; font-size: 2.125rem; }
    .pr-cierre__obs { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 0.5rem; }
    .pr-cierre__obs .pr-textarea { flex: 1; min-height: 100px; font-size: 1.25rem; }
    .pr-obligatorio { font-weight: 600; color: var(--bordo-oscuro); }
    .pr-resumen { display: flex; flex-direction: column; gap: 0.25rem; }
    .pr-resumen__fila { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 1.25rem; padding: 0.375rem 0; border-top: 1px solid var(--color-borde); overflow-wrap: anywhere; }
    .pr-resumen__rotulo { color: var(--pr-texto-secundario); }
    .pr-resumen__sub { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 1.1875rem; padding: 0.25rem 0; overflow-wrap: anywhere; }
    /* El error del cierre: pegado al botón, con su franja bordó. */
    .pr-error-pegado {
      background: var(--bordo-suave); border-left: 6px solid var(--bordo); border-radius: 12px;
      padding: 0.75rem 0.875rem; font-size: 1.1875rem; font-weight: 700; color: var(--bordo-oscuro); margin: 0;
    }
    .pr-cierre__pie { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }

    @media (max-width: 1100px) {
      .pr-planilla, .pr-cierre, .pr-ag, .pr-ag--cono-cajas { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 700px) {
      .pr-ag__grilla { grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr)); }
      .pr-producido { grid-template-columns: auto minmax(0, 1fr); }
      .pr-producido__cajas, .pr-producido__unidades { text-align: left; }
      .pr-producido__botones { grid-column: 1 / -1; }
      .pr-planilla-cab__numero { font-size: 3rem; }
      /* En el celular "Cerrar planilla" baja a su propio renglón: la raya
         quedaría colgando al final del de arriba, y el renglón propio ya lo
         separa. */
      .pr-planilla-cab__sep { display: none; }
      .pr-planilla-cab .pr-planilla-cab__cerrar { flex: 1 1 100%; min-width: 0; }
    }

    /* ── Sala de masa · 6a + 6b ───────────────────────────────────────
       Dos columnas: las máquinas abiertas a la izquierda (440px, filas de
       84px) y a la derecha el tamaño y de dónde sale la masa. La derecha
       arranca apagada hasta que se elige máquina. */
    .pr-sala { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 1rem; align-items: stretch; }
    .pr-sala > .pr-tarjeta { margin-bottom: 0; display: flex; flex-direction: column; gap: 0.625rem; min-width: 0; }
    .pr-sala__maquinas { display: flex; flex-direction: column; gap: 0.625rem; min-width: 0; }
    .pr-sala__masas { margin-top: auto; min-height: 64px; font-size: 1.25rem; font-weight: 800;
      border-color: var(--pr-masa-activo-borde); color: var(--pr-masa-letra); }
    .pr-sala-maq {
      min-height: 84px; display: flex; align-items: center; gap: 0.875rem; text-align: left;
      padding: 0 1.125rem; border-radius: 14px; border: 2px solid var(--pr-masa-barra-borde);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; cursor: pointer;
      touch-action: manipulation; min-width: 0;
    }
    .pr-sala-maq[aria-pressed="true"] { border: 3px solid var(--naranja); background: var(--naranja-suave); }
    .pr-sala-maq:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .pr-sala-maq__col { flex: 1; min-width: 0; line-height: 1.2; }
    .pr-sala-maq__nombre { font-size: 1.35rem; font-weight: 900; overflow-wrap: anywhere; }
    .pr-sala-maq__sub { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-sala-maq[aria-pressed="true"] .pr-sala-maq__sub { color: var(--naranja-oscuro); }
    .pr-sala-maq__der { text-align: right; line-height: 1.2; flex-shrink: 0; }
    .pr-sala-maq__cuenta { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pr-sala-maq__ultima { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-sala-maq[aria-pressed="true"] .pr-sala-maq__ultima { color: var(--naranja-oscuro); }
    .pr-sala-maq__parada, .pr-sala-maq__primera { color: var(--bordo-oscuro); font-weight: 800; }
    .pr-sala__vacio { min-height: var(--pr-alto-boton); display: flex; align-items: center;
      font-size: 1.25rem; font-weight: 700; color: var(--color-texto-suave); }
    .pr-sala__que { min-height: var(--pr-alto-boton); display: flex; align-items: baseline; gap: 0.875rem; flex-wrap: wrap; }
    .pr-sala__maq { font-size: 1.5rem; font-weight: 900; overflow-wrap: anywhere; }
    .pr-sala__sub { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-sala__bloque { display: flex; flex-direction: column; gap: 0.5rem; }
    .pr-sala__rotulo { font-size: 1.125rem; font-weight: 800; color: var(--pr-texto-secundario); }
    .pr-sala__tamano { display: flex; gap: 0.625rem; max-width: 520px; }
    .pr-sala__tamano .pr-segmento__opcion { flex: 1; min-height: 64px; font-size: 1.25rem; }
    .pr-sala__tamano .pr-segmento__opcion[aria-pressed="true"] {
      background: var(--naranja); border: 3px solid var(--naranja); color: #fff; font-weight: 900;
    }
    .pr-sala__comos { display: flex; flex-direction: column; gap: 0.625rem; }
    .pr-como {
      min-height: 80px; display: flex; align-items: center; gap: 1rem; text-align: left;
      padding: 0.625rem 1.25rem; border-radius: 14px; border: 2px solid var(--pr-masa-activo-borde);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; cursor: pointer;
      touch-action: manipulation; min-width: 0;
    }
    .pr-como:disabled { border-color: var(--borde-tarjeta); opacity: 0.45; cursor: not-allowed; }
    .pr-como:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .pr-como__col { flex: 1; min-width: 0; line-height: 1.3; }
    .pr-como__titulo { font-size: 1.25rem; font-weight: 800; }
    .pr-como__detalle { font-size: 1.125rem; color: var(--pr-texto-secundario); overflow-wrap: anywhere; }
    .pr-como__choco { font-weight: 800; color: var(--bordo-oscuro); }
    .pr-como__flecha { font-size: 1.7rem; font-weight: 700; color: var(--pr-masa-activo-borde); }
    .pr-sala__apagado { opacity: 0.45; }
    /* Bandas de arriba: la verde de "registrada" y la bordó de "sin conexión". */
    .pr-banda {
      display: flex; align-items: center; gap: 0.875rem; flex-wrap: wrap;
      border-radius: 16px; padding: 0.75rem 1.25rem; margin-bottom: 0.875rem; min-width: 0;
    }
    .pr-banda--ok { background: var(--verde); color: #fff; }
    .pr-banda--mal { background: var(--bordo); color: #fff; }
    .pr-banda__tilde {
      width: 40px; height: 40px; border-radius: 50%; background: var(--color-fondo); color: var(--verde);
      font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pr-banda__titulo { font-size: 1.25rem; font-weight: 900; }
    .pr-banda__detalle { font-size: 1.125rem; min-width: 0; overflow-wrap: anywhere; }
    .pr-banda__btn { margin-left: auto; background: var(--color-fondo); color: var(--bordo-oscuro); border-color: var(--color-fondo); }
    .pr-sello-sin {
      font-size: 1.125rem; font-weight: 900; letter-spacing: 0.08em; white-space: nowrap;
      border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 10px; padding: 0.3rem 0.75rem;
    }

    /* ── Sala de masa · 6c, LA RECETA ─────────────────────────────────── */
    .pr-receta { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.875rem; }
    .pr-receta__cab { display: flex; align-items: center; gap: 0.875rem; flex-wrap: wrap; min-height: 64px; }
    .pr-receta__que { display: flex; align-items: center; gap: 0.875rem; flex-wrap: wrap; flex: 1; min-width: 0; }
    .pr-receta__maq { font-size: 1.5rem; font-weight: 900; overflow-wrap: anywhere; }
    .pr-receta__sub { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-chip-rec {
      font-size: 1.125rem; font-weight: 800; border-radius: 999px; padding: 0.25rem 0.875rem;
      background: var(--pr-panel-gris); border: 2px solid var(--pr-borde-control);
    }
    .pr-chip-choco { font-size: 1.125rem; font-weight: 800; border-radius: 999px; padding: 0.35rem 0.875rem;
      background: var(--marron-suave); color: var(--marron-oscuro); }
    .pr-receta__tabla { display: flex; flex-direction: column; min-width: 0; }
    .pr-rec, .pr-rec--cab {
      display: grid; grid-template-columns: 200px 150px 272px 100px 220px minmax(0, 1fr);
      gap: 0.875rem; align-items: center; min-height: 64px; border-bottom: 1px solid var(--color-borde);
      min-width: 0;
    }
    .pr-rec--cab { min-height: 0; padding: 0.25rem 0 0.375rem; border-bottom: 2px solid var(--color-borde);
      font-size: 1.125rem; font-weight: 700; color: var(--color-texto-suave); }
    .pr-rec__cant-cab { text-align: center; }
    .pr-rec__queda-cab, .pr-rec__queda { text-align: right; }
    .pr-rec--floja { background: var(--bordo-suave); }
    .pr-rec--cero { color: var(--color-texto-suave); }
    .pr-rec__nombre { font-size: 1.25rem; font-weight: 800; overflow-wrap: anywhere; }
    .pr-rec--cero .pr-rec__nombre { font-weight: 700; }
    .pr-rec__marca, .pr-rec__nota { font-size: 1.125rem; color: var(--pr-texto-secundario); overflow-wrap: anywhere; }
    .pr-rec--cero .pr-rec__marca, .pr-rec--cero .pr-rec__nota { color: inherit; }
    .pr-rec__sello { font-size: 1.125rem; font-weight: 800; color: var(--naranja-oscuro); }
    .pr-rec__cant { display: flex; gap: 0.5rem; }
    .pr-rec__paso {
      width: 60px; min-height: var(--pr-alto-boton); border-radius: 12px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); font-size: 1.65rem; font-weight: 700; color: var(--color-texto);
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    .pr-rec__paso:disabled { color: var(--color-texto-suave); border-color: var(--borde-tarjeta); cursor: not-allowed; }
    .pr-rec__num {
      width: 136px; min-height: var(--pr-alto-boton); text-align: center; font-size: 1.25rem; font-weight: 800;
      font-variant-numeric: tabular-nums; border-radius: 12px; border: 2px solid var(--pr-borde-control);
      background: var(--color-fondo); color: var(--color-texto); padding: 0 0.5rem; min-width: 0;
    }
    .pr-rec__num--aleja { border: 3px solid var(--bordo); }
    .pr-rec--cero .pr-rec__num { background: var(--pr-panel-gris); color: var(--color-texto-suave); font-weight: 700; }
    .pr-rec__igual { font-size: 1.125rem; color: var(--color-texto-suave); }
    .pr-rec__dif { font-size: 1.125rem; font-weight: 700; color: var(--pr-texto-secundario); font-variant-numeric: tabular-nums; }
    .pr-rec__dif--aleja {
      font-weight: 900; color: var(--bordo-oscuro); background: var(--bordo-suave);
      border-radius: 8px; padding: 0.2rem 0.5rem; justify-self: start;
    }
    /* El lote del renglón ya no es un <select> del sistema: es un botón que
       abre el panel de lotes (terminar la tablet, parte 3). */
    .pr-rec__lote {
      min-height: var(--pr-alto-boton); border-radius: 12px; border: 2px solid var(--pr-borde-boton);
      background: var(--color-fondo); color: var(--color-texto); font: inherit; font-size: 1.125rem;
      font-weight: 700; padding: 0.25rem 0.75rem; min-width: 0; width: 100%; text-align: left; cursor: pointer;
      touch-action: manipulation; display: flex; flex-direction: column; justify-content: center; line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .pr-rec__lote:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .pr-rec__lote--vacio { border-style: dashed; color: var(--pr-texto-secundario); }
    .pr-rec__lote--terminado { border: 3px solid var(--bordo); background: var(--bordo-suave); color: var(--bordo-oscuro); font-weight: 800; }
    .pr-rec__lote-nota { font-size: 1.125rem; font-weight: 600; color: var(--pr-texto-secundario); }

    /* ── El panel de lotes ───────────────────────────────────────────────
       UNA TARJETA POR LOTE, separadas (10 px) y de 88 px de alto, para tocar
       con las manos sucias: la marca grande, el lote, la fecha si se sabe y
       cuánto queda bien a la vista. Abajo de todo, apartado, "Otro lote de
       este insumo". Tiene su propio scroll: la página no se mueve. */
    .pr-lp {
      position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: rgba(17, 17, 17, 0.45);
    }
    .pr-lp__caja {
      width: min(760px, 100%); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; gap: 0.875rem;
      background: var(--color-fondo); border-radius: 18px; padding: 1.25rem; box-shadow: 0 12px 40px rgba(17, 17, 17, 0.25);
      min-width: 0;
    }
    .pr-lp__cab { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .pr-lp__titulo { font-size: 1.5rem; font-weight: 800; margin: 0; overflow-wrap: anywhere; }
    .pr-lp__tarjetas { display: flex; flex-direction: column; gap: 0.625rem; overflow-y: auto; min-height: 0; padding: 0.25rem; }
    .pr-lp__tarjeta {
      min-height: 88px; display: flex; align-items: center; gap: 1rem; text-align: left; padding: 0.625rem 1.125rem;
      border-radius: 14px; border: 2px solid var(--pr-borde-boton); background: var(--color-fondo); color: var(--color-texto);
      font: inherit; cursor: pointer; touch-action: manipulation; min-width: 0; flex-shrink: 0;
    }
    .pr-lp__tarjeta[aria-pressed="true"] { border: 3px solid var(--naranja); background: var(--naranja-suave); }
    .pr-lp__tarjeta:focus-visible, .pr-lp .pr-btn:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .pr-lp__izq { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.125rem; overflow-wrap: anywhere; }
    .pr-lp__marca { font-size: 1.5rem; font-weight: 900; }
    .pr-lp__insumo, .pr-lp__fecha { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-lp__lote { font-size: 1.25rem; font-weight: 700; }
    .pr-lp__queda { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; line-height: 1.1; }
    .pr-lp__queda-rotulo { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-lp__queda-num { font-size: 1.625rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pr-lp__vacio { font-size: 1.125rem; color: var(--pr-texto-secundario); padding: 0.5rem 0; }
    .pr-lp__otros { display: flex; flex-direction: column; gap: 0.625rem; padding-top: 0.875rem; border-top: 2px dashed var(--pr-borde-boton); }
    .pr-lp__pie { display: flex; gap: 0.625rem; flex-wrap: wrap; }
    .pr-lp__pie .pr-btn { flex: 1 1 12rem; }

    /* ── Anotar / corregir / borrar una parada (terminar la tablet, parte 4)
       Reusa la caja del panel de lotes. Las horas NUNCA van en un input del
       sistema: − / + de a 5 minutos, y tocando el número se abre el teclado
       propio de abajo. */
    /* El editor tiene su propio scroll: con el teclado de horas abierto, en una
       pantalla chica, "Guardar" tiene que seguir alcanzándose sin mover la página. */
    #pr-parada-editor .pr-lp__caja { overflow-y: auto; }
    .pr-hp { display: flex; flex-direction: column; gap: 0.5rem; }
    .pr-hp__fila { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; }
    .pr-hp__rotulo { font-size: 1.125rem; font-weight: 700; min-width: 8.5rem; }
    .pr-hp__paso {
      width: 64px; min-height: 64px; flex-shrink: 0; font: inherit; font-size: 1.75rem; font-weight: 700;
      border-radius: 14px; border: 2px solid var(--pr-borde-boton); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-hp__num {
      min-width: 8rem; min-height: 64px; font: inherit; font-size: 1.75rem; font-weight: 900;
      font-variant-numeric: tabular-nums; border-radius: 14px; border: 2px solid var(--pr-borde-boton);
      background: var(--color-fondo); color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-hp__num[aria-pressed="true"] { border: 3px solid var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); }
    .pr-hp__paso:focus-visible, .pr-hp__num:focus-visible, .pr-hp__tecla:focus-visible, .pr-hp__sigue:focus-visible {
      outline: 3px solid var(--naranja); outline-offset: 2px;
    }
    .pr-hp__dia { font-size: 1.125rem; color: var(--pr-texto-secundario); }
    .pr-hp__sigue {
      min-height: var(--pr-alto-boton); padding: 0 1.125rem; font: inherit; font-size: 1.125rem; font-weight: 700;
      border-radius: var(--radio-boton); border: 2px solid var(--pr-borde-boton); background: var(--color-fondo);
      color: var(--color-texto); cursor: pointer; touch-action: manipulation;
    }
    .pr-hp__sigue[aria-pressed="true"] { border: 3px solid var(--bordo); background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .pr-hp__teclado { display: grid; grid-template-columns: repeat(3, minmax(0, 88px)); gap: 0.5rem; }
    .pr-hp__tecla {
      min-height: 60px; font: inherit; font-size: 1.5rem; font-weight: 800; border-radius: 14px;
      border: 2px solid var(--pr-borde-boton); background: var(--color-fondo); color: var(--color-texto);
      cursor: pointer; touch-action: manipulation;
    }
    .pr-hp__tecla--accion { background: var(--naranja); border-color: var(--naranja); color: #fff; }
    .pr-hp__resumen { font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
    /* Corregir y borrar, en el renglón de cada parada. */
    /* Corregir, en el renglón de cada parada: UN botón a la derecha (borrar
       está adentro del editor). Dos botones no entran al lado del texto en
       la columna de la planilla y cada parada pasaba a ocupar dos renglones. */
    .pr-renglon--acc { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.625rem; }
    .pr-renglon__texto { display: flex; flex-direction: column; min-width: 0; }
    .pr-bloque__cab--boton { align-items: center; }
    .pr-bloque__cab--boton .pr-btn { font-size: 1.125rem; padding: 0 1rem; }
    .pr-renglon__accion { min-height: var(--pr-alto-boton); font-size: 1.125rem; padding: 0 1rem; }
    .pr-rec__manual { margin-top: 0.375rem; width: 100%; min-height: var(--pr-alto-boton); font-size: 1.125rem; }
    .pr-rec__queda { font-size: 1.125rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .pr-rec__queda--poco { color: var(--bordo-oscuro); font-weight: 900; }
    .pr-rec__alcanza { display: block; font-size: 1.125rem; font-weight: 700; color: var(--bordo-oscuro); }
    .pr-rec__quitar { min-height: var(--pr-alto-boton); padding: 0 1rem; border-radius: 12px; font-size: 1.125rem;
      font-weight: 700; border: 2px solid var(--pr-bordo-borde); background: var(--color-fondo);
      color: var(--bordo-oscuro); cursor: pointer; touch-action: manipulation; }
    .pr-receta__pie { display: flex; align-items: center; gap: 0.875rem; flex-wrap: wrap; }
    .pr-receta__mas { min-height: 64px; border: 2px dashed var(--pr-masa-activo-borde); color: var(--pr-masa-letra);
      font-size: 1.25rem; font-weight: 800; }
    .pr-receta__falta {
      flex: 1; min-width: 12rem; margin: 0; display: flex; align-items: center; min-height: 64px;
      background: var(--bordo-suave); border-left: 6px solid var(--bordo); border-radius: 12px;
      padding: 0 1rem; color: var(--bordo-oscuro); font-size: 1.25rem; font-weight: 700;
    }
    .pr-receta__registrar { min-height: 64px; width: 340px; max-width: 100%; font-size: 1.35rem; font-weight: 900; }
    .pr-otro { display: flex; flex-direction: column; gap: 0.75rem; }
    .pr-otro__campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 1rem; }
    .pr-otro .pr-input { min-height: 64px; font-size: 1.25rem; }

    /* ── Sala de masa · 6d, las masas del turno ───────────────────────── */
    .pr-masas__titulo { margin-bottom: 0.875rem; }
    .pr-masas { display: flex; flex-direction: column; min-width: 0; }
    .pr-masas__cab, .pr-masa-fila {
      display: grid; grid-template-columns: 70px 100px minmax(0, 1fr) 120px 160px 220px;
      gap: 0.875rem; align-items: center; min-width: 0;
    }
    .pr-masas__cab { padding: 0.5rem 0; font-size: 1.125rem; font-weight: 700; color: var(--color-texto-suave);
      border-bottom: 2px solid var(--color-borde); }
    .pr-masas__der { text-align: right; }
    .pr-masa-fila { min-height: 60px; border-bottom: 1px solid var(--color-borde); font-size: 1.125rem; overflow-wrap: anywhere; }
    .pr-masa-fila--espera { background: var(--bordo-suave); }
    .pr-masa-fila--anulada { opacity: 0.6; }
    .pr-masa-fila--anulada .pr-masa-fila__nro { text-decoration: line-through; }
    .pr-masa-fila__nro { font-size: 1.25rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pr-masa-fila__hora { font-variant-numeric: tabular-nums; }
    .pr-masa-fila__maq { font-weight: 700; }
    .pr-masa-fila__estado { text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 0.625rem; flex-wrap: wrap; }
    .pr-masa-fila__espera { font-size: 1.125rem; font-weight: 800; color: var(--bordo-oscuro); }
    .pr-masa-fila__ok { font-size: 1.125rem; font-weight: 700; color: var(--verde-oscuro); }
    /* Los chips de origen quedan SOLO en la cabecera de la receta que se está
       armando (ahí dicen de dónde sale esa masa). En las LISTAS de masas el
       criterio es otro desde la parte 5 de terminar la tablet: ver
       htmlChipsMasa(). "Modificada" va en bordó en los dos lugares. */
    .pr-chip-origen { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 1.125rem; font-weight: 800;
      background: var(--pr-prod-fondo); color: var(--pr-prod-activo); }
    .pr-chip-origen--original { background: var(--color-fondo); border: 2px solid var(--pr-prod-apagado-borde);
      color: var(--pr-prod-activo); padding: 0.1rem 0.75rem; }
    .pr-chip-origen--modificada { background: var(--bordo-suave); color: var(--bordo-oscuro); }
    /* Las listas de masas (planilla, sala e historial): lo grande es SIMPLE o
       DOBLE; "Modificada" en bordó y "Chocolate" solo cuando lo son. */
    .pr-masa-tam { font-size: 1.375rem; font-weight: 900; letter-spacing: 0.03em; }
    .pr-chip-modificada { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 1.125rem; font-weight: 800;
      background: var(--bordo-suave); color: var(--bordo-oscuro); border: 2px solid var(--bordo); }
    .pr-masa-chips { display: inline-flex; gap: 0.375rem; flex-wrap: wrap; align-items: center; }

    @media (max-width: 1100px) {
      .pr-sala { grid-template-columns: minmax(0, 1fr); }
      /* Tablet vertical (6e): cada renglón pasa a dos líneas —arriba qué es y
         cuánto se aleja, abajo los controles— y entra sin scroll. */
      .pr-rec--cab { display: none; }
      .pr-rec {
        grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5rem 0.625rem;
        padding: 0.625rem 0; align-items: center;
      }
      .pr-rec__nombre { grid-column: 1; }
      .pr-rec__marca { grid-column: 2; }
      .pr-rec__dif, .pr-rec__igual { grid-column: 3; justify-self: end; }
      .pr-rec__cant { grid-column: 1 / -1; }
      .pr-rec__lote-celda { grid-column: 1 / -1; }
      .pr-rec__queda { grid-column: 1 / -1; text-align: left; }
      /* Tablet vertical: se va la HORA, no el tamaño (SIMPLE / DOBLE es lo
         grande de la fila). */
      .pr-masas__cab, .pr-masa-fila { grid-template-columns: 60px minmax(0, 1fr) 110px minmax(0, auto) 150px; }
      .pr-masas__cab span:nth-child(2), .pr-masa-fila__hora { display: none; }
    }
    @media (max-width: 760px) {
      .pr-receta__registrar { width: 100%; }
      .pr-masas__cab { display: none; }
      .pr-masa-fila { grid-template-columns: 56px minmax(0, 1fr); }
      .pr-masa-fila__hora, .pr-masa-fila__origen { display: none; }
      .pr-masa-fila__estado { grid-column: 1 / -1; justify-content: flex-start; }
    }

    /* ── Configuración ────────────────────────────────────────────────── */
    .pr-config-fila { display: grid; gap: 0.625rem; padding: 0.875rem; border: 2px solid var(--color-borde);
      border-radius: var(--radio-input); margin-bottom: 0.75rem; min-width: 0; }
    .pr-config-fila--inactiva { opacity: 0.6; }
    .pr-config-fila__botones { display: flex; gap: 0.5rem; flex-wrap: wrap; }
