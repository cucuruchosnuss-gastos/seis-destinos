    // ── Salir con cambios sin guardar ─────────────────────────────────────

    // Hoy solo Personal acumula cambios sin guardar (un solo botón al pie).
    function cambiosSinGuardar(c) {
      return c?.cambios instanceof Map ? c.cambios.size : 0
    }

    // Devuelve true si se puede seguir; si no, deja pedida la confirmación.
    // Sin datos dibujados no hay dónde preguntar, así que deja salir: los
    // cambios de Personal solo existen cuando su pestaña se pudo leer.
    function pedirSalida(c, accion) {
      if (!cambiosSinGuardar(c) || !c.datos) return true
      c.salida = accion
      pintarPestanaConfig()
      return false
    }

    function htmlSalirSinGuardar(c) {
      const n = cambiosSinGuardar(c)
      return `<div class="pr-aviso pr-aviso--grave">Tenés ${esc(n)} ${n === 1 ? 'fila cambiada' : 'filas cambiadas'} sin guardar en Personal. Si salís de acá, se pierden.</div>` +
        `<div class="pr-acciones"><button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-salir-no">Seguir acá</button>` +
        `<button type="button" class="pr-btn pr-btn--peligro" id="pr-cfg-salir-si">Salir sin guardar</button></div>`
    }

    function cancelarSalida() {
      estado.config.salida = null
      pintarPestanaConfig()
    }

    async function confirmarSalida() {
      const c = estado.config
      const accion = c.salida
      c.salida = null
      c.cambios = new Map()
      if (!accion) return pintarPestanaConfig()
      if (accion.volver) return volverDeOficina()
      if (accion.unidad) { c.unidadId = accion.unidad; c.recetaMaquina = null }
      if (accion.tab) { c.tab = accion.tab; c.busqueda = '' }
      await cargarPestanaConfig()
    }

    // ── Máquinas ──────────────────────────────────────────────────────────

    async function leerMaquinasConfig(c) {
      const { data, error } = await supabase.from('maquinas').select('id, nombre, activa, orden')
        .eq('unidad_negocio_id', c.unidadId).order('orden').order('nombre')
      if (error) throw error
      return { maquinas: data ?? [] }
    }

    function htmlConfigMaquinas(c) {
      const lista = c.datos.maquinas
      const filas = lista.map((m, i) => `<div class="pr-config-fila${m.activa ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-maq-nombre="${esc(m.id)}" value="${esc(m.nombre)}" maxlength="60" aria-label="Nombre de la máquina">` +
        `<div class="pr-config-fila__botones">` +
        `<button type="button" class="pr-btn-icono" data-maq-subir="${i}" aria-label="Subir ${esc(m.nombre)}"${i === 0 ? ' disabled' : ''}>▲</button>` +
        `<button type="button" class="pr-btn-icono" data-maq-bajar="${i}" aria-label="Bajar ${esc(m.nombre)}"${i === lista.length - 1 ? ' disabled' : ''}>▼</button>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-maq-guardar="${esc(m.id)}">Guardar nombre</button>` +
        `<button type="button" class="pr-btn ${m.activa ? 'pr-btn--peligro' : 'pr-btn--secundario'}" data-maq-activa="${esc(m.id)}">${m.activa ? 'Desactivar' : 'Activar'}</button>` +
        `</div></div>`).join('')
      return (filas || '<p class="pr-texto-suave">Esta unidad todavía no tiene máquinas.</p>') +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-maq-nueva" maxlength="60" placeholder="Nombre de la máquina nueva" aria-label="Nombre de la máquina nueva">` +
        htmlErrorPegado(c, 'pr-cfg-maq-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-maq-agregar" data-maq-agregar="1">Agregar máquina</button></div>`
    }

    // El orden que quedaría al mover una máquina: 1, 2, 3… en el orden de la
    // lista. Devuelve SOLO las que cambian de número, para mandar lo mínimo.
    // Mover un renglón una posición arriba (-1) o abajo (+1). Devuelve una
    // lista nueva; fuera de rango, la MISMA (y de eso se apoya ordenTrasMover
    // para no mandar nada).
    function moverProducto(lista, i, delta) {
      const j = i + delta
      if (i < 0 || i >= lista.length || j < 0 || j >= lista.length) return lista
      const nueva = [...lista]
      ;[nueva[i], nueva[j]] = [nueva[j], nueva[i]]
      return nueva
    }

    function ordenTrasMover(lista, i, delta) {
      const nueva = moverProducto(lista, i, delta)
      if (nueva === lista) return []
      return nueva.map((m, k) => ({ ...m, orden: k + 1 })).filter((m, k) => lista.find(x => x.id === m.id).orden !== k + 1)
    }

    function parametrosGuardarMaquina(m, unidadId, cambios = {}) {
      return {
        p_id: m?.id ?? null,
        p_unidad_negocio_id: unidadId,
        p_nombre: (cambios.nombre ?? m?.nombre ?? '').trim(),
        p_activa: cambios.activa ?? m?.activa ?? true,
        p_orden: cambios.orden ?? m?.orden ?? 0,
      }
    }

    async function guardarEnConfig(rpc, params, exito, donde = null) {
      errorConfig(null)
      const { data, error } = await supabase.rpc(rpc, params)
      if (error) {
        // El mensaje de la base TAL CUAL ("La máquina tiene un turno abierto:
        // cerralo antes de desactivarla.", "Puesto inválido."), pegado al botón.
        errorConfig(error.message || 'No se pudo guardar.', donde)
        return { ok: false }
      }
      if (exito) mostrarExito(exito)
      return { ok: true, data }
    }

    async function accionMaquina(ds) {
      const c = estado.config, lista = c.datos.maquinas
      const DONDE = 'pr-cfg-maq-agregar'
      if (ds.maqAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-maq-nueva').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre de la máquina.', DONDE); return }
        const orden = lista.reduce((mx, m) => Math.max(mx, m.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(null, c.unidadId, { nombre, activa: true, orden }), 'Máquina agregada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.maqSubir !== undefined || ds.maqBajar !== undefined) {
        const i = Number(ds.maqSubir ?? ds.maqBajar)
        for (const m of ordenTrasMover(lista, i, ds.maqSubir !== undefined ? -1 : +1)) {
          const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { orden: m.orden }), null, DONDE)
          if (!r.ok) break
        }
        await cargarPestanaConfig()
        return
      }
      const id = ds.maqGuardar ?? ds.maqActiva
      const m = lista.find(x => x.id === id)
      if (!m) return
      if (ds.maqGuardar !== undefined) {
        const input = [...document.getElementById('pr-config-cuerpo').querySelectorAll('[data-maq-nombre]')].find(x => x.dataset.maqNombre === id)
        const nombre = (input?.value ?? '').trim()
        if (!nombre) { errorConfig('El nombre no puede quedar vacío.', DONDE); return }
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { nombre }), 'Nombre guardado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      } else {
        const r = await guardarEnConfig('guardar_maquina', parametrosGuardarMaquina(m, c.unidadId, { activa: !m.activa }), m.activa ? 'Máquina desactivada.' : 'Máquina activada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      }
    }

    // ── Recetas ───────────────────────────────────────────────────────────

    async function leerRecetasConfig(c) {
      const { data: maquinas, error: e1 } = await supabase.from('maquinas').select('id, nombre')
        .eq('unidad_negocio_id', c.unidadId).eq('activa', true).order('orden').order('nombre')
      if (e1) throw e1
      const maquinaId = (maquinas ?? []).some(m => m.id === c.recetaMaquina) ? c.recetaMaquina : (maquinas?.[0]?.id ?? null)
      c.recetaMaquina = maquinaId
      let recetas = [], items = [], nombres = new Map()
      if (maquinaId) {
        const r = await supabase.from('recetas').select('id, tipo_masa, version, nota, creada_por, created_at').eq('maquina_id', maquinaId).order('version', { ascending: false })
        if (r.error) throw r.error
        recetas = r.data ?? []
        const ids = recetas.map(x => x.id)
        if (ids.length) {
          const ri = await supabase.from('receta_items').select('receta_id, ingrediente_id, cantidad_kg, insumo_preferido_id').in('receta_id', ids)
          if (ri.error) throw ri.error
          items = ri.data ?? []
          const autores = [...new Set(recetas.map(x => x.creada_por).filter(Boolean))]
          if (autores.length) {
            const pe = await supabase.from('v_empleados_publico').select('id, nombre').in('id', autores)
            if (pe.error) throw pe.error
            nombres = new Map((pe.data ?? []).map(p => [p.id, p.nombre]))
          }
        }
      }
      const { data: ingredientes, error: e2 } = await supabase.from('ingredientes').select('id, nombre, descuenta_stock, orden, activo').order('orden')
      if (e2) throw e2
      const cat = await leerInsumosDeIngredientes()
      const tipos = [...new Set(recetas.map(r => r.tipo_masa))].sort((a, b) => a.localeCompare(b, 'es'))
      if (!tipos.includes(c.recetaTipo) && c.recetaTipo !== NUEVO_TIPO) c.recetaTipo = tipos[0] ?? NUEVO_TIPO
      return { maquinas: maquinas ?? [], recetas, items, nombres, ingredientes: ingredientes ?? [], tipos, ...cat }
    }

    const NUEVO_TIPO = '__nuevo__'

    async function leerInsumosDeIngredientes() {
      const { data: rel, error: e1 } = await supabase.from('ingrediente_insumos').select('ingrediente_id, insumo_id')
      if (e1) throw e1
      const { data: insumos, error: e2 } = await supabase.from('insumos').select('id, nombre, marca, tipo').eq('activo', true).order('nombre')
      if (e2) throw e2
      return { relaciones: rel ?? [], insumos: insumos ?? [] }
    }

    // La versión vigente de un tipo: la de número más alto (igual que
    // _receta_vigente() en la base).
    function recetaVigente(recetas, tipo) {
      return recetas.filter(r => r.tipo_masa === tipo).sort((a, b) => b.version - a.version)[0] ?? null
    }

    // La receta vino del prototipo si su nota lo dice: hay que revisarla.
    function recetaParaRevisar(receta) {
      return !!receta && /prototipo|revisar/i.test(receta.nota ?? '')
    }

    // Las filas del editor: cada ingrediente activo, con la cantidad y el
    // insumo preferido de la receta de partida (vacío si no lo lleva).
    function filasEditorReceta(ingredientes, itemsPartida) {
      return ingredientes.filter(g => g.activo).map(g => {
        const it = itemsPartida.find(x => x.ingrediente_id === g.id)
        return { ingrediente_id: g.id, nombre: g.nombre, kg: it ? Number(it.cantidad_kg) : null, preferido: it?.insumo_preferido_id ?? '' }
      })
    }

    // El payload de guardar_receta_original: los ingredientes con número
    // (0 incluido: "lleva 0" es un dato); los vacíos no van.
    function parametrosGuardarReceta(maquinaId, tipo, filas, nota) {
      return {
        p_maquina_id: maquinaId,
        p_tipo_masa: String(tipo ?? '').trim(),
        p_items: filas.filter(f => f.kg != null).map(f => ({ ingrediente_id: f.ingrediente_id, cantidad_kg: f.kg, insumo_preferido_id: f.preferido || null })),
        p_nota: String(nota ?? '').trim() === '' ? null : String(nota).trim(),
      }
    }

    // La nota es OBLIGATORIA acá, aunque guardar_receta_original la acepte en
    // null: una versión sin decir qué cambió deja un historial que no explica
    // nada, que es justo para lo que existe el historial.
    function faltanEnReceta(p) {
      const faltan = []
      if (!p.p_maquina_id) faltan.push('la máquina')
      if (!p.p_tipo_masa) faltan.push('el tipo de masa')
      else if (p.p_tipo_masa.length > 40) faltan.push('un tipo de masa de hasta 40 letras')
      if (!p.p_items.length) faltan.push('al menos un ingrediente con cantidad')
      if (!p.p_nota) faltan.push('una nota que diga qué cambió')
      return faltan
    }

    // El número que va a tener la versión que se está por guardar.
    function proximaVersion(recetas, tipo) {
      return (recetaVigente(recetas, tipo)?.version ?? 0) + 1
    }

    // "antes 2,5" al lado de una cantidad que se cambió. Null si no cambió.
    function textoAntes(original, actual) {
      if (original == null || actual == null) return null
      if (Math.abs(Number(original) - Number(actual)) < 1e-9) return null
      return `antes ${formatearNumeroAr(Number(original), { decimales: 3, minimos: 0 })}`
    }

    function htmlConfigRecetas(c) {
      const d = c.datos
      if (!d.maquinas.length) return '<p class="pr-texto-suave">Esta unidad no tiene máquinas activas.</p>'
      const selMaq = `<label class="pr-campo"><span class="pr-campo__rotulo">Máquina</span><select class="pr-select" data-receta-maquina="1">` +
        d.maquinas.map(m => `<option value="${esc(m.id)}"${m.id === c.recetaMaquina ? ' selected' : ''}>${esc(m.nombre)}</option>`).join('') + `</select></label>`
      const selTipo = `<label class="pr-campo"><span class="pr-campo__rotulo">Tipo de masa</span><select class="pr-select" data-receta-tipo="1">` +
        d.tipos.map(t => `<option value="${esc(t)}"${t === c.recetaTipo ? ' selected' : ''}>${esc(t)}</option>`).join('') +
        `<option value="${NUEVO_TIPO}"${c.recetaTipo === NUEVO_TIPO ? ' selected' : ''}>Tipo nuevo…</option></select></label>`
      const nuevo = c.recetaTipo === NUEVO_TIPO
      const vigente = nuevo ? null : recetaVigente(d.recetas, c.recetaTipo)
      const partida = nuevo ? recetaVigente(d.recetas, c.recetaPartida ?? d.tipos[0]) : vigente
      const itemsPartida = partida ? d.items.filter(i => i.receta_id === partida.id) : []
      const filas = filasEditorReceta(d.ingredientes, itemsPartida)
      const aviso = recetaParaRevisar(vigente)
        ? `<div class="pr-aviso pr-aviso--grave">Revisar: esta receta vino del prototipo. Confirmá las cantidades con la fábrica y guardá una versión nueva.</div>` : ''
      const cabNuevo = nuevo
        ? `<div class="pr-campos"><label class="pr-campo"><span class="pr-campo__rotulo">Nombre del tipo nuevo</span><input type="text" class="pr-input" id="pr-config-tipo-nuevo" maxlength="40" placeholder="Ej.: Chocolate"></label>` +
          (d.tipos.length ? `<label class="pr-campo"><span class="pr-campo__rotulo">Partir de</span><select class="pr-select" data-receta-partida="1">` +
            d.tipos.map(t => `<option value="${esc(t)}"${t === (c.recetaPartida ?? d.tipos[0]) ? ' selected' : ''}>${esc(t)}</option>`).join('') + `</select></label>` : '') + `</div>`
        : `<p class="pr-texto-suave">Vigente: versión ${esc(vigente?.version ?? '—')}. Guardar crea una versión NUEVA; las masas ya hechas no cambian.</p>`
      const editor = filas.map(f => {
        const opciones = d.relaciones.filter(r => r.ingrediente_id === f.ingrediente_id)
          .map(r => d.insumos.find(i => i.id === r.insumo_id)).filter(Boolean)
        return `<div class="pr-config-fila"><span class="pr-ing__nombre">${esc(f.nombre)}</span>` +
          `<label class="pr-campo"><span class="pr-campo__rotulo">kg por masa simple</span><input type="text" class="pr-input" data-receta-kg="${esc(f.ingrediente_id)}" data-numero="${f.kg == null ? '' : esc(f.kg)}" data-decimales="3" aria-label="Kilos de ${esc(f.nombre)}"></label>` +
          `<span class="pr-cfg-antes" data-receta-antes="${esc(f.ingrediente_id)}" hidden></span>` +
          (opciones.length ? `<label class="pr-campo"><span class="pr-campo__rotulo">Insumo preferido</span><select class="pr-select" data-receta-pref="${esc(f.ingrediente_id)}"><option value="">Ninguno</option>` +
            opciones.map(o => `<option value="${esc(o.id)}"${o.id === f.preferido ? ' selected' : ''}>${esc(o.nombre)}${o.marca ? ` · ${esc(o.marca)}` : ''}</option>`).join('') + `</select></label>` : '') +
          `</div>`
      }).join('')
      const historial = nuevo ? '' : '<h3 class="pr-subtitulo">Versiones</h3>' +
        d.recetas.filter(r => r.tipo_masa === c.recetaTipo).map((r, i) =>
          `<div class="pr-cfg-version${i === 0 ? ' pr-cfg-version--vigente' : ''}"><strong>Versión ${esc(r.version)}${i === 0 ? ' · vigente' : ''}</strong> · ${esc(fechaCorta(r.created_at))} · ${esc(d.nombres.get(r.creada_por) ?? '—')}` +
          `<div class="pr-texto-suave">${esc(r.nota ?? 'Sin nota')}</div></div>`).join('')
      const version = nuevo ? 1 : proximaVersion(d.recetas, c.recetaTipo)
      return `<div class="pr-cfg-recetas"><div>${selMaq}${selTipo}</div>` +
        `<div>${aviso}${cabNuevo}${editor}` +
        `<label class="pr-campo pr-espacio-arriba"><span class="pr-campo__rotulo">Nota (qué cambió y por qué) <span class="pr-obligatorio">· obligatoria</span></span><textarea class="pr-textarea" id="pr-config-receta-nota" maxlength="300"></textarea></label>` +
        `<div class="pr-cfg-pie">${htmlErrorPegado(c, 'pr-cfg-receta-guardar')}` +
        `<button type="button" class="pr-btn" id="pr-cfg-receta-guardar" data-receta-guardar="1">Guardar versión ${esc(version)}</button></div></div>` +
        `<div>${historial}</div></div>`
    }

    // dd/mm/aaaa de un timestamp, en Argentina; '' si no se puede leer.
    function fechaCorta(momento) {
      if (!momento) return ''
      const d = new Date(momento)
      if (Number.isNaN(d.getTime())) return ''
      return new Intl.DateTimeFormat('es-AR', { timeZone: ZONA_AR, day: '2-digit', month: '2-digit', year: 'numeric' }).format(d)
    }

    function leerEditorReceta() {
      const cuerpo = document.getElementById('pr-config-cuerpo')
      const prefs = new Map([...cuerpo.querySelectorAll('[data-receta-pref]')].map(s => [s.dataset.recetaPref, s.value]))
      return [...cuerpo.querySelectorAll('[data-receta-kg]')].map(i => ({
        ingrediente_id: i.dataset.recetaKg, kg: leerCampoNumero(i), preferido: prefs.get(i.dataset.recetaKg) ?? '',
      }))
    }

    // Al tocar una cantidad se marca contra la de la versión vigente. Se
    // escribe DIRECTO en el DOM y no con un re-render, porque re-renderizar
    // mientras se escribe le saca el foco al campo.
    function marcarCambioReceta(input) {
      const cuerpo = document.getElementById('pr-config-cuerpo')
      const antes = [...cuerpo.querySelectorAll('[data-receta-antes]')].find(x => x.dataset.recetaAntes === input.dataset.recetaKg)
      if (!antes) return
      const original = input.dataset.numero === '' ? null : Number(input.dataset.numero)
      const texto = textoAntes(original, leerCampoNumero(input))
      antes.textContent = texto ?? ''
      antes.hidden = !texto
    }

    async function guardarReceta() {
      const c = estado.config
      const DONDE = 'pr-cfg-receta-guardar'
      const tipo = c.recetaTipo === NUEVO_TIPO ? document.getElementById('pr-config-tipo-nuevo')?.value : c.recetaTipo
      const p = parametrosGuardarReceta(c.recetaMaquina, tipo, leerEditorReceta(), document.getElementById('pr-config-receta-nota').value)
      const faltan = faltanEnReceta(p)
      if (faltan.length) { errorConfig(`Falta ${faltan.join(', ')}.`, DONDE); return }
      const r = await guardarEnConfig('guardar_receta_original', p, null, DONDE)
      if (r.ok) {
        mostrarExito(`Receta guardada: ${p.p_tipo_masa}, versión ${r.data?.version ?? ''}.`)
        c.recetaTipo = p.p_tipo_masa
        await cargarPestanaConfig()
      }
    }

    // ── Ingredientes ──────────────────────────────────────────────────────

    async function leerIngredientesConfig() {
      const { data, error } = await supabase.from('ingredientes').select('id, nombre, descuenta_stock, orden, activo').order('orden')
      if (error) throw error
      return { ingredientes: data ?? [], ...(await leerInsumosDeIngredientes()) }
    }

    // Los que descuentan stock pero no tienen ningún insumo del catálogo: sus
    // masas no descuentan nada (hoy grasa, fécula y colorante).
    function ingredientesSinInsumo(d) {
      return d.ingredientes.filter(g => g.activo && g.descuenta_stock && !d.relaciones.some(r => r.ingrediente_id === g.id))
    }

    function htmlConfigIngredientes(c) {
      const d = c.datos
      const sin = ingredientesSinInsumo(d)
      const aviso = sin.length
        ? `<div class="pr-aviso pr-aviso--grave">No descuentan stock porque no tienen ningún insumo del catálogo: ${esc(sin.map(g => g.nombre).join(', '))}. Asignales el insumo que corresponde.</div>` : ''
      const filas = d.ingredientes.map(g => {
        const suyos = d.relaciones.filter(r => r.ingrediente_id === g.id).map(r => d.insumos.find(i => i.id === r.insumo_id)).filter(Boolean)
        const abierto = c.ingredienteAbierto === g.id
        const panelInsumos = abierto ? `<div class="pr-config-insumos">` +
          `<input type="text" class="pr-input" id="pr-config-insumo-buscar" placeholder="Buscar en el catálogo" aria-label="Buscar insumo" value="${esc(c.busqueda)}">` +
          marcasFiltradas(d.insumos.map(i => ({ ...i, nombre: i.nombre + (i.marca ? ' ' + i.marca : '') })), c.busqueda).slice(0, 60).map(i =>
            `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-insumo="${esc(i.id)}"${c.insumosElegidos?.has(i.id) ? ' checked' : ''}> ${esc(i.nombre)}</label>`).join('') +
          `<div class="pr-acciones"><button type="button" class="pr-btn pr-btn--secundario" data-ing-cerrar="1">Cancelar</button>` +
          `<button type="button" class="pr-btn" data-ing-guardar-insumos="${esc(g.id)}">Guardar insumos</button></div></div>` : ''
        return `<div class="pr-config-fila${g.activo ? '' : ' pr-config-fila--inactiva'}">` +
          `<input type="text" class="pr-input" data-ing-nombre="${esc(g.id)}" value="${esc(g.nombre)}" maxlength="60" aria-label="Nombre del ingrediente">` +
          `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-descuenta="${esc(g.id)}"${g.descuenta_stock ? ' checked' : ''}> Descuenta stock</label>` +
          `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-ing-activo="${esc(g.id)}"${g.activo ? ' checked' : ''}> Activo</label>` +
          `<p class="pr-texto-suave">Insumos: ${suyos.length ? esc(suyos.map(i => i.nombre + (i.marca ? ' · ' + i.marca : '')).join(', ')) : 'ninguno'}</p>` +
          `<div class="pr-config-fila__botones"><button type="button" class="pr-btn pr-btn--secundario" data-ing-guardar="${esc(g.id)}">Guardar</button>` +
          `<button type="button" class="pr-btn pr-btn--secundario" data-ing-insumos="${esc(g.id)}">Elegir insumos</button></div>${panelInsumos}</div>`
      }).join('')
      return aviso + filas +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-ing-nuevo" maxlength="60" placeholder="Ingrediente nuevo" aria-label="Ingrediente nuevo">` +
        htmlErrorPegado(c, 'pr-cfg-ing-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-ing-agregar" data-ing-agregar="1">Agregar ingrediente</button></div>`
    }

    function parametrosGuardarIngrediente(g, cambios = {}) {
      return {
        p_id: g?.id ?? null,
        p_nombre: (cambios.nombre ?? g?.nombre ?? '').trim(),
        p_descuenta_stock: cambios.descuenta_stock ?? g?.descuenta_stock ?? true,
        p_orden: g?.orden ?? cambios.orden ?? 0,
        p_activo: cambios.activo ?? g?.activo ?? true,
      }
    }

    function valorDe(selector, id, prop = 'value') {
      const el = [...document.getElementById('pr-config-cuerpo').querySelectorAll(`[${selector}]`)]
        .find(x => x.getAttribute(selector) === id)
      return el ? el[prop] : undefined
    }

    async function accionIngrediente(ds) {
      const c = estado.config, d = c.datos
      const DONDE = 'pr-cfg-ing-agregar'
      if (ds.ingAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-ing-nuevo').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre del ingrediente.', DONDE); return }
        const orden = d.ingredientes.reduce((mx, g) => Math.max(mx, g.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_ingrediente', parametrosGuardarIngrediente(null, { nombre, orden }), 'Ingrediente agregado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.ingCerrar !== undefined) { c.ingredienteAbierto = null; c.busqueda = ''; pintarPestanaConfig(); return }
      if (ds.ingInsumos !== undefined) {
        c.ingredienteAbierto = ds.ingInsumos
        c.busqueda = ''
        c.insumosElegidos = new Set(d.relaciones.filter(r => r.ingrediente_id === ds.ingInsumos).map(r => r.insumo_id))
        pintarPestanaConfig()
        return
      }
      if (ds.ingGuardarInsumos !== undefined) {
        const r = await guardarEnConfig('guardar_ingrediente_insumos',
          { p_ingrediente_id: ds.ingGuardarInsumos, p_insumo_ids: [...(c.insumosElegidos ?? [])] }, 'Insumos guardados.', DONDE)
        if (r.ok) { c.ingredienteAbierto = null; await cargarPestanaConfig() }
        return
      }
      if (ds.ingGuardar !== undefined) {
        const g = d.ingredientes.find(x => x.id === ds.ingGuardar)
        if (!g) return
        const nombre = String(valorDe('data-ing-nombre', g.id) ?? g.nombre).trim()
        if (!nombre) { errorConfig('El nombre no puede quedar vacío.', DONDE); return }
        const r = await guardarEnConfig('guardar_ingrediente', parametrosGuardarIngrediente(g, {
          nombre, descuenta_stock: valorDe('data-ing-descuenta', g.id, 'checked') ?? g.descuenta_stock, activo: valorDe('data-ing-activo', g.id, 'checked') ?? g.activo,
        }), 'Ingrediente guardado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      }
    }

    // ── Productos y presentaciones ────────────────────────────────────────

    async function leerProductosConfig(c) {
      const { data: productos, error: e1 } = await supabase.from('productos_terminados').select('id, nombre, tipo_masa, activo, orden')
        .eq('unidad_negocio_id', c.unidadId).order('orden').order('nombre')
      if (e1) throw e1
      const ids = (productos ?? []).map(p => p.id)
      let presentaciones = []
      if (ids.length) {
        const r = await supabase.from('producto_presentaciones')
          .select('id, producto_id, nombre, con_cono, media_caja, empaque, unidades_por_caja, activa, orden').in('producto_id', ids).order('orden')
        if (r.error) throw r.error
        presentaciones = r.data ?? []
      }
      return { productos: productos ?? [], presentaciones }
    }

    function avisoProductosRevisado() {
      return leerPreferencia(CLAVE_AVISO_PRODUCTOS) === '1'
    }

    function htmlPresentacionConfig(pr) {
      return `<div class="pr-config-sub${pr.activa ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-pres-nombre="${esc(pr.id)}" value="${esc(pr.nombre)}" maxlength="80" aria-label="Nombre de la presentación">` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-cono="${esc(pr.id)}"${pr.con_cono ? ' checked' : ''}> Con cono</label>` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-media="${esc(pr.id)}"${pr.media_caja ? ' checked' : ''}> Media caja</label>` +
        `<input type="text" class="pr-input" data-pres-empaque="${esc(pr.id)}" value="${esc(pr.empaque ?? '')}" maxlength="80" placeholder="Empaque (ej. bolsa granel)" aria-label="Empaque">` +
        `<label class="pr-campo"><span class="pr-campo__rotulo">Unidades por caja</span><input type="text" class="pr-input" data-pres-unidades="${esc(pr.id)}" data-numero="${esc(pr.unidades_por_caja)}" data-decimales="0"></label>` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-pres-activa="${esc(pr.id)}"${pr.activa ? ' checked' : ''}> Activa</label>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-pres-guardar="${esc(pr.id)}">Guardar presentación</button></div>`
    }

    function htmlConfigProductos(c) {
      const d = c.datos
      const aviso = d.productos.length && !avisoProductosRevisado()
        ? `<div class="pr-aviso pr-aviso--grave">Los productos que ya están cargados vinieron del prototipo: revisá nombres, presentaciones y unidades por caja.` +
          ` <button type="button" class="pr-btn pr-btn--secundario" data-productos-revisados="1">Ya los revisé</button></div>` : ''
      const nota = '<p class="pr-texto-suave">Cambiar las unidades por caja no toca lo ya producido: cada sublote guardó las suyas.</p>'
      const bloque = (p) => `<div class="pr-config-fila${p.activo ? '' : ' pr-config-fila--inactiva'}">` +
        `<input type="text" class="pr-input" data-prod-nombre="${esc(p.id)}" value="${esc(p.nombre)}" maxlength="80" aria-label="Nombre del producto">` +
        `<input type="text" class="pr-input" data-prod-tipo="${esc(p.id)}" value="${esc(p.tipo_masa ?? '')}" maxlength="40" placeholder="Tipo de masa" aria-label="Tipo de masa">` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-prod-activo="${esc(p.id)}"${p.activo ? ' checked' : ''}> Activo</label>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-prod-guardar="${esc(p.id)}">Guardar producto</button>` +
        d.presentaciones.filter(pr => pr.producto_id === p.id).map(htmlPresentacionConfig).join('') +
        `<div class="pr-config-alta"><input type="text" class="pr-input" data-pres-nueva="${esc(p.id)}" maxlength="80" placeholder="Presentación nueva" aria-label="Presentación nueva">` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-pres-agregar="${esc(p.id)}">Agregar presentación</button></div></div>`
      // Los de chocolate abajo y separados, igual que en la carga (P5b). Lo
      // decide tipo_masa, no el nombre: es el mismo dato con el que la sala
      // elige la receta.
      const { comunes, chocolate } = productosPorMasa(d)
      const corte = `<div class="pr-ag__corte"><span class="pr-ag__corte-texto">Chocolate</span><span class="pr-ag__corte-linea"></span></div>`
      const bloques = comunes.map(bloque).join('') +
        (chocolate.length ? corte + chocolate.map(bloque).join('') : '')
      return aviso + nota + bloques +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-prod-nuevo" maxlength="80" placeholder="Producto nuevo" aria-label="Producto nuevo">` +
        htmlErrorPegado(c, 'pr-cfg-prod-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-prod-agregar" data-prod-agregar="1">Agregar producto</button></div>`
    }

    function parametrosGuardarProducto(p, unidadId, cambios = {}) {
      const tipo = String(cambios.tipo_masa ?? p?.tipo_masa ?? '').trim()
      return {
        p_id: p?.id ?? null, p_unidad_negocio_id: unidadId,
        p_nombre: String(cambios.nombre ?? p?.nombre ?? '').trim(),
        p_tipo_masa: tipo === '' ? null : tipo,
        p_activo: cambios.activo ?? p?.activo ?? true,
        p_orden: p?.orden ?? cambios.orden ?? 0,
      }
    }

    function parametrosGuardarPresentacion(pr, productoId, cambios = {}) {
      const empaque = String(cambios.empaque ?? pr?.empaque ?? '').trim()
      return {
        p_id: pr?.id ?? null, p_producto_id: productoId,
        p_nombre: String(cambios.nombre ?? pr?.nombre ?? '').trim(),
        p_con_cono: cambios.con_cono ?? pr?.con_cono ?? false,
        p_media_caja: cambios.media_caja ?? pr?.media_caja ?? false,
        p_empaque: empaque === '' ? null : empaque,
        p_unidades_por_caja: cambios.unidades_por_caja ?? pr?.unidades_por_caja ?? null,
        p_activa: cambios.activa ?? pr?.activa ?? true,
        p_orden: pr?.orden ?? cambios.orden ?? 0,
      }
    }

    function campoNumero(selector, id) {
      const el = [...document.getElementById('pr-config-cuerpo').querySelectorAll(`[${selector}]`)].find(x => x.getAttribute(selector) === id)
      return el ? leerCampoNumero(el) : undefined
    }

    async function accionProducto(ds) {
      const c = estado.config, d = c.datos
      const DONDE = 'pr-cfg-prod-agregar'
      if (ds.productosRevisados !== undefined) { guardarPreferencia(CLAVE_AVISO_PRODUCTOS, '1'); pintarPestanaConfig(); return }
      if (ds.prodAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-prod-nuevo').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre del producto.', DONDE); return }
        const orden = d.productos.reduce((mx, p) => Math.max(mx, p.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_producto', parametrosGuardarProducto(null, c.unidadId, { nombre, orden }), 'Producto agregado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.prodGuardar !== undefined) {
        const p = d.productos.find(x => x.id === ds.prodGuardar)
        if (!p) return
        const r = await guardarEnConfig('guardar_producto', parametrosGuardarProducto(p, c.unidadId, {
          nombre: valorDe('data-prod-nombre', p.id) ?? p.nombre, tipo_masa: valorDe('data-prod-tipo', p.id) ?? p.tipo_masa,
          activo: valorDe('data-prod-activo', p.id, 'checked') ?? p.activo,
        }), 'Producto guardado.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.presAgregar !== undefined) {
        const nombre = String(valorDe('data-pres-nueva', ds.presAgregar) ?? '').trim()
        if (!nombre) { errorConfig('Escribí el nombre de la presentación.', DONDE); return }
        // Una presentación nueva arranca con 1 por caja: se corrige al lado.
        const orden = d.presentaciones.filter(x => x.producto_id === ds.presAgregar).reduce((mx, x) => Math.max(mx, x.orden ?? 0), 0) + 1
        const r = await guardarEnConfig('guardar_presentacion', parametrosGuardarPresentacion(null, ds.presAgregar, { nombre, unidades_por_caja: 1, orden }), 'Presentación agregada: revisá sus unidades por caja.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.presGuardar !== undefined) {
        const pr = d.presentaciones.find(x => x.id === ds.presGuardar)
        if (!pr) return
        const upc = campoNumero('data-pres-unidades', pr.id)
        if (upc !== undefined && (!Number.isInteger(upc) || upc <= 0)) { errorConfig('Las unidades por caja tienen que ser un número entero mayor a cero.', DONDE); return }
        const r = await guardarEnConfig('guardar_presentacion', parametrosGuardarPresentacion(pr, pr.producto_id, {
          nombre: valorDe('data-pres-nombre', pr.id) ?? pr.nombre, con_cono: valorDe('data-pres-cono', pr.id, 'checked') ?? pr.con_cono,
          media_caja: valorDe('data-pres-media', pr.id, 'checked') ?? pr.media_caja, empaque: valorDe('data-pres-empaque', pr.id) ?? pr.empaque,
          unidades_por_caja: upc ?? pr.unidades_por_caja, activa: valorDe('data-pres-activa', pr.id, 'checked') ?? pr.activa,
        }), 'Presentación guardada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
      }
    }

    // ── Empaque de cada presentación ──────────────────────────────────────
    //
    // Qué cajas admite cada presentación (con su embolsado sugerido) y qué
    // consume UNA caja armada. Se edita en un BORRADOR por presentación y se
    // guarda con UNA llamada a guardar_empaque_presentacion, que borra y
    // reinserta las dos listas: todo o nada. El descuento lo hace la base al
    // cargar lo producido; acá no se toca el stock.

    const CONDICIONES_EMPAQUE = [
      ['siempre', 'Siempre'], ['bolsa_grande', 'Solo con bolsa grande'], ['bolsa_individual', 'Solo con bolsa individual'],
    ]

    async function leerEmpaqueConfig(c) {
      const leer = async (consulta) => { const { data, error } = await consulta; if (error) throw error; return data ?? [] }
      const productos = await leer(supabase.from('productos_terminados').select('id, nombre, tipo_masa, activo, orden')
        .eq('unidad_negocio_id', c.unidadId).order('orden').order('nombre'))
      const ids = productos.map(p => p.id)
      const presentaciones = ids.length ? await leer(supabase.from('producto_presentaciones')
        .select('id, producto_id, nombre, media_caja, activa, orden').in('producto_id', ids).order('orden')) : []
      const presIds = presentaciones.map(p => p.id)
      const cajas = presIds.length ? await leer(supabase.from('presentacion_cajas')
        .select('presentacion_id, insumo_id, embolsado_sugerido').in('presentacion_id', presIds)) : []
      const empaque = presIds.length ? await leer(supabase.from('presentacion_empaque')
        .select('id, presentacion_id, insumo_id, cantidad, condicion').in('presentacion_id', presIds)) : []
      // TODOS los insumos (el catálogo es chico): los activos para ofrecer, y
      // cualquiera para nombrar lo que ya está configurado aunque se haya
      // desactivado después.
      const insumos = await leer(supabase.from('insumos').select('id, nombre, marca, categoria, activo').order('nombre'))
      // El borrador arranca igual a lo guardado.
      const borradores = new Map(presentaciones.map(pr => [pr.id, {
        cajas: cajas.filter(x => x.presentacion_id === pr.id).map(x => ({ insumo_id: x.insumo_id, embolsado_sugerido: x.embolsado_sugerido })),
        empaque: empaque.filter(x => x.presentacion_id === pr.id).map(x => ({ insumo_id: x.insumo_id, cantidad: Number(x.cantidad), condicion: x.condicion })),
        tocado: false,
      }]))
      return { productos, presentaciones, cajas, empaque, insumos, borradores }
    }

    // Lo que falta en lo GUARDADO (que es con lo que produce la base).
    function faltaEmpaque(d, presId) {
      const sinCaja = !(d.cajas ?? []).some(x => x.presentacion_id === presId)
      const sinEmpaque = !(d.empaque ?? []).some(x => x.presentacion_id === presId)
      if (sinCaja && sinEmpaque) return 'Produce sin descontar la caja ni el empaque.'
      if (sinCaja) return 'Produce sin descontar la caja: no tiene ninguna caja habilitada.'
      if (sinEmpaque) return 'Produce sin descontar el empaque: no tiene ningún renglón.'
      return ''
    }

    function nombreInsumoConfig(d, id) {
      const i = (d.insumos ?? []).find(x => x.id === id)
      return i ? textoInsumoEmpaque(i) + (i.activo === false ? ' (desactivado)' : '') : 'Insumo que ya no está'
    }

    function htmlEmpaquePresentacion(pr, c) {
      const d = c.datos
      const b = d.borradores.get(pr.id) ?? { cajas: [], empaque: [], tocado: false }
      const falta = pr.activa ? faltaEmpaque(d, pr.id) : ''
      const opcionesSug = (v) => EMBOLSADOS.map(o => `<option value="${esc(o.valor)}"${o.valor === v ? ' selected' : ''}>${esc(o.texto)}</option>`).join('')
      const filasCajas = b.cajas.map((x, i) => `<div class="pr-emp-fila">` +
        `<span class="pr-emp-fila__nombre">${esc(nombreInsumoConfig(d, x.insumo_id))}</span>` +
        `<label class="pr-emp-fila__campo">Embolsado sugerido <select class="pr-input" data-emp-sug="${esc(pr.id)}|${esc(i)}">${opcionesSug(x.embolsado_sugerido)}</select></label>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-emp-quitar-caja="${esc(pr.id)}|${esc(i)}">Quitar</button></div>`).join('')
      const cajasLibres = (d.insumos ?? []).filter(i => i.activo !== false && i.categoria === 'Cajas' && !b.cajas.some(x => x.insumo_id === i.id))
      const altaCaja = cajasLibres.length
        ? `<div class="pr-config-alta"><select class="pr-input" data-emp-caja-nueva="${esc(pr.id)}" aria-label="Caja para agregar"><option value="">Elegí una caja…</option>` +
          cajasLibres.map(i => `<option value="${esc(i.id)}">${esc(textoInsumoEmpaque(i))}</option>`).join('') + `</select>` +
          `<button type="button" class="pr-btn pr-btn--secundario" data-emp-agregar-caja="${esc(pr.id)}">Agregar caja</button></div>`
        : ''
      const opcionesCond = (v) => CONDICIONES_EMPAQUE.map(([k, t]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(t)}</option>`).join('')
      const filasEmp = b.empaque.map((x, i) => `<div class="pr-emp-fila">` +
        `<span class="pr-emp-fila__nombre">${esc(nombreInsumoConfig(d, x.insumo_id))}</span>` +
        `<input type="text" class="pr-input pr-emp-fila__cant" data-emp-cant="${esc(pr.id)}|${esc(i)}" data-numero="${x.cantidad == null ? '' : esc(x.cantidad)}" data-decimales="3" aria-label="Cantidad por caja">` +
        `<select class="pr-input" data-emp-cond="${esc(pr.id)}|${esc(i)}" aria-label="Cuándo se descuenta">${opcionesCond(x.condicion)}</select>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-emp-quitar="${esc(pr.id)}|${esc(i)}">Quitar</button></div>`).join('')
      const donde = `pr-cfg-emp-${pr.id}`
      return `<div class="pr-config-sub pr-emp${pr.activa ? '' : ' pr-config-fila--inactiva'}${b.tocado ? ' pr-emp--tocado' : ''}">` +
        `<div class="pr-emp__titulo">${esc(pr.nombre)}${pr.activa ? '' : ' · inactiva'}${b.tocado ? ' <span class="pr-emp__sin-guardar">sin guardar</span>' : ''}</div>` +
        (falta ? `<div class="pr-aviso pr-aviso--grave">${esc(falta)}</div>` : '') +
        `<p class="pr-cfg-rotulo pr-cfg-rotulo--gris">Cajas que admite</p>` +
        (filasCajas || '<p class="pr-texto-suave">Ninguna caja habilitada.</p>') + altaCaja +
        `<p class="pr-cfg-rotulo pr-cfg-rotulo--gris">Lo que consume una caja</p>` +
        (filasEmp || '<p class="pr-texto-suave">Ningún renglón.</p>') +
        `<div class="pr-config-alta"><input type="text" class="pr-input" list="pr-emp-insumos" data-emp-insumo-nuevo="${esc(pr.id)}" placeholder="Buscar un insumo…" aria-label="Insumo para agregar" autocomplete="off">` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-emp-agregar="${esc(pr.id)}">Agregar insumo</button></div>` +
        htmlErrorPegado(c, donde) +
        `<button type="button" class="pr-btn" id="${esc(donde)}" data-emp-guardar="${esc(pr.id)}">Guardar empaque</button></div>`
    }

    function htmlConfigEmpaque(c) {
      const d = c.datos
      const nota = '<p class="pr-texto-suave">Lo que consume UNA caja armada de cada presentación: la caja de cartón (1 por caja producida, también en media caja) y el resto. Se descuenta solo al cargar lo producido.</p>'
      if (!d.productos.length) return nota + '<p class="pr-texto-suave">Esta unidad no tiene productos cargados.</p>'
      // El buscador de insumos es un datalist: la pestaña es de oficina, y así
      // no se redibuja nada mientras se escribe.
      const opcionesInsumos = (d.insumos ?? []).filter(i => i.activo !== false)
        .map(i => `<option value="${esc(textoInsumoEmpaque(i))}"></option>`).join('')
      const lista = `<datalist id="pr-emp-insumos">${opcionesInsumos}</datalist>`
      const { comunes, chocolate } = productosPorMasa(d)
      const bloque = p => `<div class="pr-config-fila${p.activo ? '' : ' pr-config-fila--inactiva'}"><strong class="pr-emp__producto">${esc(p.nombre)}</strong>` +
        (d.presentaciones.filter(pr => pr.producto_id === p.id).map(pr => htmlEmpaquePresentacion(pr, c)).join('') || '<p class="pr-texto-suave">Sin presentaciones.</p>') + `</div>`
      const corte = `<div class="pr-ag__corte"><span class="pr-ag__corte-texto">Chocolate</span><span class="pr-ag__corte-linea"></span></div>`
      return nota + lista + comunes.map(bloque).join('') + (chocolate.length ? corte + chocolate.map(bloque).join('') : '')
    }

    // Las cantidades tipeadas viven en los campos hasta que algo redibuja: se
    // pasan al borrador ANTES de cualquier cambio, o se perderían.
    function sincronizarCantidadesEmpaque(c) {
      const cuerpo = document.getElementById('pr-config-cuerpo')
      for (const input of cuerpo.querySelectorAll('[data-emp-cant]')) {
        const [presId, i] = input.dataset.empCant.split('|')
        const fila = c.datos.borradores.get(presId)?.empaque[Number(i)]
        if (fila) {
          const v = leerCampoNumero(input)
          if (v !== fila.cantidad) { fila.cantidad = v; c.datos.borradores.get(presId).tocado = true }
        }
      }
    }

    // El texto del buscador contra el catálogo: igual (sin acentos ni
    // mayúsculas) a "nombre marca"; si no, el ÚNICO que lo contiene.
    function insumoPorTexto(d, texto) {
      const q = normalizarBusqueda(texto)
      if (!q) return null
      const activos = (d.insumos ?? []).filter(i => i.activo !== false)
      const exacto = activos.find(i => normalizarBusqueda(textoInsumoEmpaque(i)) === q)
      if (exacto) return exacto
      const parecidos = activos.filter(i => normalizarBusqueda(textoInsumoEmpaque(i)).includes(q))
      return parecidos.length === 1 ? parecidos[0] : null
    }

    // Lo que viaja: las dos listas completas. null si algo no se puede mandar,
    // con el texto de por qué.
    function parametrosGuardarEmpaque(presId, b) {
      for (const x of b.empaque) {
        if (!(typeof x.cantidad === 'number' && x.cantidad > 0)) return { error: 'Las cantidades tienen que ser mayores a cero.' }
      }
      const claves = b.empaque.map(x => `${x.insumo_id}|${x.condicion}`)
      if (new Set(claves).size !== claves.length) return { error: 'Hay un insumo repetido con la misma condición: dejalo una sola vez.' }
      return {
        p_presentacion_id: presId,
        p_cajas: b.cajas.map(x => ({ insumo_id: x.insumo_id, embolsado_sugerido: x.embolsado_sugerido })),
        p_empaque: b.empaque.map(x => ({ insumo_id: x.insumo_id, cantidad: x.cantidad, condicion: x.condicion })),
      }
    }

    function valorEmpaque(atributo, presId) {
      const el = [...document.getElementById('pr-config-cuerpo').querySelectorAll(`[${atributo}]`)].find(x => x.getAttribute(atributo) === presId)
      return el ? el.value : ''
    }

    async function accionEmpaque(ds) {
      const c = estado.config, d = c.datos
      if (!d?.borradores) return
      sincronizarCantidadesEmpaque(c)
      const clave = ds.empGuardar ?? ds.empAgregar ?? ds.empAgregarCaja
        ?? (ds.empQuitar ?? ds.empQuitarCaja ?? '').split('|')[0]
      const b = d.borradores.get(clave)
      if (!b) return
      const donde = `pr-cfg-emp-${clave}`
      if (ds.empGuardar !== undefined) {
        const params = parametrosGuardarEmpaque(clave, b)
        if (params.error) { errorConfig(params.error, donde); return }
        const r = await guardarEnConfig('guardar_empaque_presentacion', params, 'Empaque guardado.', donde)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.empAgregarCaja !== undefined) {
        const id = valorEmpaque('data-emp-caja-nueva', clave)
        if (!id) { errorConfig('Elegí la caja para agregar.', donde); return }
        b.cajas.push({ insumo_id: id, embolsado_sugerido: 'grande' })
      } else if (ds.empAgregar !== undefined) {
        const ins = insumoPorTexto(d, valorEmpaque('data-emp-insumo-nuevo', clave))
        if (!ins) { errorConfig('Elegí un insumo de la lista.', donde); return }
        b.empaque.push({ insumo_id: ins.id, cantidad: null, condicion: 'siempre' })
      } else if (ds.empQuitarCaja !== undefined) {
        b.cajas.splice(Number(ds.empQuitarCaja.split('|')[1]), 1)
      } else if (ds.empQuitar !== undefined) {
        b.empaque.splice(Number(ds.empQuitar.split('|')[1]), 1)
      }
      b.tocado = true
      errorConfig(null)
      pintarPestanaConfig()
    }

    function cambiarSelectEmpaque(t) {
      const c = estado.config
      if (!c?.datos?.borradores) return
      sincronizarCantidadesEmpaque(c)
      const [presId, i] = (t.dataset.empSug ?? t.dataset.empCond).split('|')
      const b = c.datos.borradores.get(presId)
      if (!b) return
      if (t.dataset.empSug !== undefined) { if (b.cajas[Number(i)]) b.cajas[Number(i)].embolsado_sugerido = t.value }
      else if (b.empaque[Number(i)]) b.empaque[Number(i)].condicion = t.value
      b.tocado = true
      pintarPestanaConfig()
    }

    // El tilde "Doble bolsa" de un cono: se guarda en el acto.
    async function cambiarDobleBolsa(marcaId, doble) {
      const r = await guardarEnConfig('marcar_doble_bolsa', { p_marca_id: marcaId, p_doble: !!doble },
        doble ? 'Ese cono va con doble bolsa.' : 'Ese cono ya no va con doble bolsa.', 'pr-cfg-marcas-lista')
      if (r.ok) await cargarPestanaConfig()
    }

    // ── Marcas / Conos ────────────────────────────────────────────────────

    async function leerMarcasConfig() {
      const { data, error } = await supabase.from('marcas_personalizadas')
        .select('id, nombre, activa, estado_alta, creada_por, creada_en, doble_bolsa').order('nombre')
      if (error) throw error
      const marcas = data ?? []
      const nombres = await nombresDeEmpleados(marcasPendientes({ marcas }).map(m => m.creada_por))
      return { marcas, nombres }
    }

    // Los conos que propuso alguien desde la tablet y todavía nadie revisó.
    function marcasPendientes(d) {
      return (d?.marcas ?? []).filter(m => m.estado_alta === 'pendiente_revision')
    }

    // El catálogo: todo lo que no está pendiente ni rechazado.
    function marcasDelCatalogo(d) {
      return (d?.marcas ?? []).filter(m => m.estado_alta !== 'pendiente_revision' && m.estado_alta !== 'rechazada')
    }

    function parametrosRevisarMarca(id, aprobar, nombre) {
      const n = String(nombre ?? '').trim()
      return { p_marca_id: id, p_aprobar: aprobar, p_nombre: n === '' ? null : n }
    }

    // Quién lo cargó y cuándo. El sublote del diseño (7c) no se puede decir:
    // marcas_personalizadas no guarda de qué producción salió.
    function htmlPendienteMarca(m, nombres) {
      const quien = nombres?.get(m.creada_por)
      const cuando = [fechaCorta(m.creada_en), horaArgentina(m.creada_en)].filter(Boolean).join(' ')
      const pie = [quien ? `Lo cargó ${quien}` : null, cuando || null].filter(Boolean).join(' · ')
      return `<div class="pr-cfg-pendiente"><div class="pr-cfg-pendiente__datos">` +
        `<input type="text" class="pr-input" data-pend-nombre="${esc(m.id)}" value="${esc(m.nombre)}" maxlength="80" aria-label="Nombre del cono">` +
        (pie ? `<div class="pr-texto-suave">${esc(pie)}</div>` : '') + `</div>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-pend-no="${esc(m.id)}">Rechazar</button>` +
        `<button type="button" class="pr-btn" data-pend-si="${esc(m.id)}">Aceptar</button></div>`
    }

    function htmlConfigMarcas(c) {
      const d = c.datos
      const pend = marcasPendientes(d)
      const arriba = pend.length
        ? `<div id="pr-cfg-pendientes" tabindex="-1"><p class="pr-cfg-rotulo">Pendientes de revisar · ${esc(pend.length)}</p>` +
          htmlErrorPegado(c, 'pr-cfg-pendientes') +
          `<p class="pr-texto-suave">Se pueden usar igual mientras tanto. Al aceptar podés corregirle el nombre.</p>` +
          pend.map(m => htmlPendienteMarca(m, d.nombres)).join('') + `</div>` : ''
      const lista = marcasFiltradas(marcasDelCatalogo(d), c.busqueda)
      return arriba + `<p class="pr-cfg-rotulo pr-cfg-rotulo--gris">Catálogo · ${esc(marcasDelCatalogo(d).length)} conos</p>` +
        `<input type="text" class="pr-input" id="pr-config-marca-buscar" placeholder="Buscar marca" aria-label="Buscar marca" value="${esc(c.busqueda)}">` +
        `<p class="pr-texto-suave" id="pr-cfg-marcas-lista" tabindex="-1">"Doble bolsa" es para los conos que van al norte, por la humedad: llevan siempre la bolsa grande y las bolsitas individuales, y en la tablet no se puede bajar.</p>` +
        htmlErrorPegado(c, 'pr-cfg-marcas-lista') +
        `<ul class="pr-lista pr-espacio-arriba">` + (lista.length ? lista.map(m =>
          `<li class="pr-lista__item pr-config-marca${m.activa ? '' : ' pr-config-fila--inactiva'}"><strong>${esc(m.nombre)}</strong>${m.activa ? '' : ' (dada de baja)'} ` +
          `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-marca-doble="${esc(m.id)}"${m.doble_bolsa ? ' checked' : ''}> Doble bolsa</label> ` +
          `<button type="button" class="pr-btn pr-btn--secundario" data-marca-activa="${esc(m.id)}">${m.activa ? 'Dar de baja' : 'Reactivar'}</button></li>`).join('')
          : `<li class="pr-lista__item">Ninguna marca coincide.</li>`) + `</ul>` +
        `<div class="pr-config-alta"><input type="text" class="pr-input" id="pr-config-marca-nueva" maxlength="80" placeholder="Marca nueva" aria-label="Marca nueva">` +
        htmlErrorPegado(c, 'pr-cfg-marca-agregar') +
        `<button type="button" class="pr-btn" id="pr-cfg-marca-agregar" data-marca-agregar="1">Agregar marca</button></div>`
    }

    async function accionMarca(ds) {
      const c = estado.config
      const DONDE = 'pr-cfg-marca-agregar'
      if (ds.marcaAgregar !== undefined) {
        const nombre = document.getElementById('pr-config-marca-nueva').value.trim()
        if (!nombre) { errorConfig('Escribí el nombre de la marca.', DONDE); return }
        const r = await guardarEnConfig('guardar_marca', { p_id: null, p_nombre: nombre, p_activa: true }, 'Marca agregada.', DONDE)
        if (r.ok) await cargarPestanaConfig()
        return
      }
      if (ds.pendSi !== undefined || ds.pendNo !== undefined) {
        const id = ds.pendSi ?? ds.pendNo
        const aprobar = ds.pendSi !== undefined
        // Al aceptar se manda el nombre del campo, que puede estar corregido.
        const nombre = aprobar ? valorDe('data-pend-nombre', id) : null
        const r = await guardarEnConfig('revisar_marca', parametrosRevisarMarca(id, aprobar, nombre),
          aprobar ? 'Cono aceptado.' : 'Cono rechazado.', 'pr-cfg-pendientes')
        // La burbuja de los accesos también baja: se vuelve a pedir la cifra.
        if (r.ok) { cargarBurbujaConos(); await cargarPestanaConfig() }
        return
      }
      const m = c.datos.marcas.find(x => x.id === ds.marcaActiva)
      if (!m) return
      const r = await guardarEnConfig('guardar_marca', { p_id: m.id, p_nombre: m.nombre, p_activa: !m.activa }, m.activa ? 'Marca dada de baja.' : 'Marca reactivada.', DONDE)
      if (r.ok) await cargarPestanaConfig()
    }

    // ── Personal: puestos, PINes y accesos temporales ─────────────────────

    async function leerPersonalConfig(c) {
      const { data, error } = await supabase.rpc('personal_produccion', { p_unidad_negocio_id: c.unidadId })
      if (error) throw error
      const t = await supabase.from('puestos_temporales').select('id, empleado_id, puesto, desde, hasta, otorgado_por')
        .eq('unidad_negocio_id', c.unidadId).is('revocado_en', null).order('hasta')
      if (t.error) throw t.error
      // Vigentes: el vencimiento se mira acá porque `hasta` es un timestamptz
      // y la consulta no puede compararlo contra el "ahora" del servidor.
      const temporales = (t.data ?? []).filter(x => temporalVigente(x))
      const nombres = await nombresDeEmpleados(temporales.map(x => x.otorgado_por))
      return { personal: data ?? [], temporales, nombres }
    }

    function temporalVigente(t, ahora = Date.now()) {
      const hasta = new Date(t?.hasta ?? '').getTime()
      return Number.isFinite(hasta) && hasta > ahora
    }

    function personalVisible(personal, busqueda, todos) {
      const base = todos ? personal : personal.filter(p => p.misma_unidad || (p.puestos ?? []).length)
      return marcasFiltradas(base, busqueda)
    }

    // El estado del PIN, tal como lo devuelve personal_produccion(). No hay
    // "Bloqueado": la RPC no lo dice, y un chip que no se puede saber sería
    // inventarlo.
    function estadoDelPin(p) {
      if (!p?.tiene_pin) return { texto: 'Sin PIN', clase: 'pr-cfg-chip--gris' }
      if (p.debe_cambiar_pin) return { texto: 'PIN pendiente de cambiar', clase: 'pr-cfg-chip--alerta' }
      return { texto: 'PIN propio', clase: 'pr-cfg-chip--ok' }
    }

    // Los puestos que muestra la fila: los tocados si se tocó, los de la base
    // si no.
    function puestosDe(c, p) {
      return c.cambios.get(p.id) ?? (p.puestos ?? [])
    }

    // Marcar o desmarcar un puesto. Si la fila vuelve a quedar como está en la
    // base deja de contar como cambiada: el número del botón tiene que decir
    // cuántas filas se van a mandar, ni una más.
    function alternarPuesto(c, persona, puesto, marcado) {
      const set = new Set(puestosDe(c, persona))
      if (marcado) set.add(puesto)
      else set.delete(puesto)
      const nuevos = PUESTOS.map(([k]) => k).filter(k => set.has(k))
      const antes = [...(persona.puestos ?? [])].sort().join(',')
      if (nuevos.slice().sort().join(',') === antes) c.cambios.delete(persona.id)
      else c.cambios.set(persona.id, nuevos)
    }

    function textoBotonPersonal(n) {
      return n ? `Guardar los cambios · ${n} ${n === 1 ? 'fila' : 'filas'}` : 'Guardar los cambios'
    }

    function htmlFilaPersonal(c, p) {
      const puestos = puestosDe(c, p)
      const tocada = c.cambios.has(p.id)
      const pin = estadoDelPin(p)
      const temp = p.pin_temporal ? ` <span class="pr-cfg-chip pr-cfg-chip--gris">temporal</span>` : ''
      return `<div class="pr-cfg-fila pr-cfg-personal${tocada ? ' pr-cfg-fila--tocada' : ''}"><strong>${esc(p.nombre)}</strong>` +
        PUESTOS.map(([puestoClave, puestoRotulo]) => `<input type="checkbox" class="pr-casilla pr-cfg-centro" data-puesto="${puestoClave}" data-persona-puesto="${esc(p.id)}"${puestos.includes(puestoClave) ? ' checked' : ''} aria-label="${puestoRotulo}: ${esc(p.nombre)}">`).join('') +
        `<span><span class="pr-cfg-chip ${pin.clase}">${esc(pin.texto)}</span>${temp}</span>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-pin-asignar="${esc(p.id)}">${p.tiene_pin ? 'Resetear PIN' : 'Asignar PIN'}</button>` +
        `<span class="pr-cfg-fila__aviso">${tocada ? 'Cambiada' : ''}</span></div>`
    }

    // El panel del PIN. Un PIN es un IDENTIFICADOR, no una cantidad: va como
    // texto y NUNCA por enlazarCampoNumero, que le metería separador de miles.
    function htmlPanelPin(c) {
      if (!c.pinPara) return ''
      const maestro = c.pinPara.maestro
      const largo = maestro ? LARGO_PIN_MAESTRO : LARGO_PIN
      return `<div class="pr-cfg-panel"><strong>${maestro ? 'Mi PIN maestro' : `PIN para ${esc(c.pinPara.nombre)}`}</strong>` +
        `<p class="pr-texto-suave">${maestro ? `${largo} números. Con él se entra a cualquier modo y se dan accesos por hoy.` : `${largo} números. Se los pasás a mano; la primera vez que entre va a tener que elegir uno suyo.`}</p>` +
        `<input type="text" class="pr-input" id="pr-cfg-pin-valor" inputmode="numeric" autocomplete="off" maxlength="${largo}" placeholder="${'0'.repeat(largo)}" aria-label="PIN">` +
        `<div class="pr-cfg-pie">${htmlErrorPegado(c, 'pr-cfg-pin-guardar')}` +
        `<button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-pin-cancelar">Cancelar</button>` +
        `<button type="button" class="pr-btn" id="pr-cfg-pin-guardar">Guardar el PIN</button></div></div>`
    }

    function htmlPanelTemporal(c) {
      if (!c.temporal) return ''
      const personas = personalVisible(c.datos.personal, '', true)
      return `<div class="pr-cfg-panel"><strong>Dar acceso temporal</strong>` +
        `<p class="pr-texto-suave">Dura como mucho 7 días. Si esa persona todavía no tiene PIN, se le genera uno y se muestra una sola vez.</p>` +
        `<label class="pr-campo"><span class="pr-campo__rotulo">Quién</span><select class="pr-select" id="pr-cfg-temporal-persona">` +
        `<option value="">Elegí a quién</option>` +
        personas.map(p => `<option value="${esc(p.id)}"${p.id === c.temporal.personaId ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('') + `</select></label>` +
        `<label class="pr-campo"><span class="pr-campo__rotulo">Puesto</span><select class="pr-select" id="pr-cfg-temporal-puesto">` +
        `<option value="">Elegí el puesto</option>` +
        PUESTOS.map(([k, r]) => `<option value="${k}"${k === c.temporal.puesto ? ' selected' : ''}>${r}</option>`).join('') + `</select></label>` +
        `<label class="pr-campo"><span class="pr-campo__rotulo">Hasta</span><input type="date" class="pr-input" id="pr-cfg-temporal-hasta" value="${esc(c.temporal.hasta ?? '')}"></label>` +
        `<div class="pr-cfg-pie">${htmlErrorPegado(c, 'pr-cfg-temporal-dar')}` +
        `<button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-temporal-cancelar">Cancelar</button>` +
        `<button type="button" class="pr-btn" id="pr-cfg-temporal-dar">Dar el acceso</button></div></div>`
    }

    // Los puestos temporales vigentes: quién los dio, hasta cuándo, y Revocar.
    function htmlTemporales(c) {
      const lista = c.datos.temporales ?? []
      if (!lista.length) return '<p class="pr-texto-suave">No hay ningún acceso temporal vigente.</p>'
      const nombre = (id) => c.datos.personal.find(p => p.id === id)?.nombre ?? '—'
      return lista.map(t => `<div class="pr-cfg-temporal"><span><strong>${esc(nombre(t.empleado_id))}</strong> · ${esc(t.puesto)}` +
        `<div class="pr-texto-suave">Lo dio ${esc(c.datos.nombres.get(t.otorgado_por) ?? '—')} · hasta ${esc(fechaCorta(t.hasta))} ${esc(horaArgentina(t.hasta))}</div></span>` +
        `<button type="button" class="pr-btn pr-btn--secundario" data-temporal-revocar="${esc(t.id)}">Revocar</button></div>`).join('')
    }

    function htmlConfigPersonal(c) {
      const lista = personalVisible(c.datos.personal, c.busqueda, c.todoElPersonal)
      const n = cambiosSinGuardar(c)
      const cab = `<div class="pr-cfg-cab pr-cfg-personal"><span>Persona</span>` +
        PUESTOS.map(([, r]) => `<span class="pr-cfg-centro">${r}</span>`).join('') +
        `<span>PIN</span><span></span><span></span></div>`
      return `<input type="text" class="pr-input" id="pr-config-personal-buscar" placeholder="Buscar por nombre…" aria-label="Buscar persona" value="${esc(c.busqueda)}">` +
        `<label class="pr-check"><input type="checkbox" class="pr-casilla" data-personal-todos="1"${c.todoElPersonal ? ' checked' : ''}> Mostrar también el personal de otras unidades</label>` +
        `<div class="pr-cfg-tabla pr-espacio-arriba">${cab}` +
        (lista.length ? lista.map(p => htmlFilaPersonal(c, p)).join('') : '<div class="pr-cfg-fila pr-cfg-personal"><span>Nadie coincide con la búsqueda.</span></div>') +
        `</div>` +
        `<div class="pr-cfg-pie">${htmlErrorPegado(c, 'pr-cfg-personal-guardar')}` +
        `<button type="button" class="pr-btn" id="pr-cfg-personal-guardar"${c.guardando ? ' disabled' : ''}>${esc(textoBotonPersonal(n))}</button></div>` +
        `<h3 class="pr-subtitulo">PINes</h3>` +
        `<div class="pr-config-fila__botones">${htmlErrorPegado(c, 'pr-cfg-generar-pines')}` +
        `<button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-generar-pines">Generar PIN para los que no tienen</button>` +
        (tieneTarea('configurar') ? `<button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-abrir-maestro">Mi PIN maestro</button>` : '') +
        `</div>${htmlPanelPin(c)}` +
        `<h3 class="pr-subtitulo">Accesos temporales</h3>${htmlTemporales(c)}` +
        `<div class="pr-config-fila__botones pr-espacio-arriba">${htmlErrorPegado(c, 'pr-cfg-abrir-temporal')}` +
        `<button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-abrir-temporal">Dar acceso temporal</button></div>${htmlPanelTemporal(c)}`
    }

    // Manda SOLO las filas tocadas, de a una, y para en la primera que falla.
    // El botón se traba mientras manda, nunca por lo que falta: si no, el
    // error que cuelga de él sería imposible de ver.
    async function guardarCambiosPersonal() {
      const c = estado.config
      const DONDE = 'pr-cfg-personal-guardar'
      if (c.guardando) return
      const ids = [...c.cambios.keys()]
      if (!ids.length) { errorConfig('No cambiaste nada todavía.', DONDE); return }
      c.guardando = true
      pintarPestanaConfig()
      let hechas = 0
      try {
        for (const id of ids) {
          const r = await guardarEnConfig('guardar_puestos', { p_empleado_id: id, p_unidad_negocio_id: c.unidadId, p_puestos: c.cambios.get(id) }, null, DONDE)
          if (!r.ok) break
          c.cambios.delete(id)
          hechas++
        }
      } finally {
        c.guardando = false
      }
      if (hechas) mostrarExito(`${hechas} ${hechas === 1 ? 'fila guardada' : 'filas guardadas'}.`)
      // Con algo sin guardar no se recarga: la recarga traería los puestos de
      // la base y borraría lo que todavía no entró.
      if (c.cambios.size) pintarPestanaConfig()
      else await cargarPestanaConfig()
    }

    // ── PINes ─────────────────────────────────────────────────────────────

    function pinValido(texto, largo) {
      return new RegExp(`^[0-9]{${largo}}$`).test(String(texto ?? ''))
    }

    function abrirPanelPin(persona, maestro = false) {
      const c = estado.config
      c.pinPara = { id: persona?.id ?? null, nombre: persona?.nombre ?? '', maestro }
      errorConfig(null)
      pintarPestanaConfig()
      document.getElementById('pr-cfg-pin-valor')?.focus?.()
    }

    // El campo se vacía a mano antes de soltarlo. El re-render lo reemplaza
    // igual, pero un PIN tipeado no tiene que sobrevivir ni un instante de más.
    function olvidarCampoPin() {
      const el = document.getElementById('pr-cfg-pin-valor')
      if (el) el.value = ''
    }

    function cerrarPanelPin() {
      olvidarCampoPin()
      estado.config.pinPara = null
      errorConfig(null)
      pintarPestanaConfig()
    }

    async function confirmarPinConfig() {
      const c = estado.config
      const DONDE = 'pr-cfg-pin-guardar'
      if (!c.pinPara) return
      const maestro = c.pinPara.maestro
      const largo = maestro ? LARGO_PIN_MAESTRO : LARGO_PIN
      const pin = String(document.getElementById('pr-cfg-pin-valor')?.value ?? '').trim()
      if (!pinValido(pin, largo)) { errorConfig(`El PIN tiene que ser de ${largo} números.`, DONDE); return }
      const r = maestro
        ? await guardarEnConfig('asignar_mi_pin_maestro', { p_pin: pin }, 'PIN maestro guardado.', DONDE)
        : await guardarEnConfig('asignar_pin_produccion', { p_empleado_id: c.pinPara.id, p_pin: pin }, 'PIN asignado.', DONDE)
      if (!r.ok) return
      olvidarCampoPin()
      c.pinPara = null
      await cargarPestanaConfig()
    }

    // ── La hoja de PINes: se ve UNA vez, se imprime y se borra ────────────

    function htmlTiraPin(t) {
      return `<div class="pr-tira"><div><strong>${esc(t.nombre)}</strong>` +
        `<div class="pr-tira__nota">PIN de un solo uso: la primera vez vas a elegir uno tuyo.</div></div>` +
        `<div class="pr-tira__pin">${esc(t.pin)}</div></div>`
    }

    function mostrarHojaPines(lista, aviso) {
      estado.config.hoja = lista
      document.getElementById('pr-cfg-hoja-aviso').textContent = aviso
      document.getElementById('pr-cfg-hoja-tiras').innerHTML = lista.map(htmlTiraPin).join('')
      document.getElementById('pr-cfg-hoja').hidden = false
    }

    // Al cerrar, los PINes se van de la memoria Y del DOM. Nunca estuvieron en
    // localStorage ni en sessionStorage, y no tienen que quedar en ningún lado.
    function cerrarHojaPines() {
      if (estado.config) estado.config.hoja = null
      document.getElementById('pr-cfg-hoja-tiras').innerHTML = ''
      document.getElementById('pr-cfg-hoja-aviso').textContent = ''
      document.getElementById('pr-cfg-hoja').hidden = true
    }

    async function generarPines() {
      const c = estado.config
      const DONDE = 'pr-cfg-generar-pines'
      const r = await guardarEnConfig('generar_pines_iniciales', { p_unidad_negocio_id: c.unidadId }, null, DONDE)
      if (!r.ok) return
      const lista = (r.data ?? []).map(x => ({ nombre: x.nombre, pin: x.pin }))
      // Sin nadie sin PIN no se abre una hoja vacía: se dice.
      if (!lista.length) { errorConfig('Ya todos tienen PIN: no hizo falta generar ninguno.', DONDE); return }
      mostrarExito(`${lista.length} ${lista.length === 1 ? 'PIN generado' : 'PINes generados'}.`)
      await cargarPestanaConfig()
      mostrarHojaPines(lista, 'Se muestran UNA sola vez. Imprimí, recortá y repartí antes de cerrar.')
    }

    // ── Accesos temporales ────────────────────────────────────────────────

    function abrirPanelTemporal() {
      const c = estado.config
      c.temporal = { personaId: null, puesto: null, hasta: hoyArgentina() }
      errorConfig(null)
      pintarPestanaConfig()
    }

    function cerrarPanelTemporal() {
      estado.config.temporal = null
      errorConfig(null)
      pintarPestanaConfig()
    }

    function parametrosDarTemporal(c, hoy) {
      return {
        p_empleado_id: c.temporal?.personaId ?? null,
        p_unidad_negocio_id: c.unidadId,
        p_puesto: c.temporal?.puesto ?? null,
        p_hasta: hastaDesdeFecha(c.temporal?.hasta, hoy),
      }
    }

    async function confirmarTemporal() {
      const c = estado.config
      const DONDE = 'pr-cfg-temporal-dar'
      const hoy = hoyArgentina()
      const faltan = faltanParaAcceso(c.temporal, hoy)
      if (faltan.length) { errorConfig(`Falta: ${faltan.join(' · ')}.`, DONDE); return }
      const persona = c.datos.personal.find(p => p.id === c.temporal.personaId)
      const r = await guardarEnConfig('otorgar_puesto_temporal', parametrosDarTemporal(c, hoy), null, DONDE)
      if (!r.ok) return
      if (r.data && r.data.ok === false) { errorConfig(r.data.motivo ?? 'No se pudo dar el acceso.', DONDE); return }
      mostrarExito('Acceso dado.')
      c.temporal = null
      await cargarPestanaConfig()
      // El PIN temporal viene en null cuando esa persona ya tenía el suyo.
      if (r.data?.pin_temporal) {
        mostrarHojaPines([{ nombre: persona?.nombre ?? '', pin: r.data.pin_temporal }],
          'Se muestra UNA sola vez. Anotalo y pasáselo antes de cerrar.')
      }
    }

    async function revocarTemporal(id) {
      const r = await guardarEnConfig('revocar_puesto_temporal', { p_id: id }, 'Acceso revocado.', 'pr-cfg-abrir-temporal')
      if (r.ok) await cargarPestanaConfig()
    }

    const LECTORES_CONFIG = {
      maquinas: leerMaquinasConfig, recetas: leerRecetasConfig, ingredientes: leerIngredientesConfig,
      productos: leerProductosConfig, empaque: leerEmpaqueConfig, marcas: leerMarcasConfig, personal: leerPersonalConfig,
    }
    const RENDERS_CONFIG = {
      maquinas: htmlConfigMaquinas, recetas: htmlConfigRecetas, ingredientes: htmlConfigIngredientes,
      productos: htmlConfigProductos, empaque: htmlConfigEmpaque, marcas: htmlConfigMarcas, personal: htmlConfigPersonal,
    }

    function conectarConfig() {
      document.getElementById('pr-btn-ir-config').addEventListener('click', abrirConfigDesdeAcceso)
      document.getElementById('pr-config-volver').addEventListener('click', () => {
        if (pedirSalida(estado.config, { volver: true })) volverDeOficina()
      })
      document.getElementById('pr-config-unidad').addEventListener('change', ev => {
        const unidad = ev.target.value
        if (!pedirSalida(estado.config, { unidad })) return
        estado.config.unidadId = unidad
        estado.config.recetaMaquina = null
        cargarPestanaConfig()
      })
      document.getElementById('pr-config-tabs').addEventListener('click', ev => {
        const b = ev.target.closest('[data-config-tab]'); if (!b) return
        const tab = b.dataset.configTab
        if (tab === estado.config.tab) return
        if (!pedirSalida(estado.config, { tab })) return
        estado.config.tab = tab
        estado.config.busqueda = ''
        cargarPestanaConfig()
      })
      document.getElementById('pr-cfg-hoja-cerrar').addEventListener('click', cerrarHojaPines)
      document.getElementById('pr-cfg-hoja-imprimir').addEventListener('click', () => window.print?.())
      // Cerrar la pestaña del navegador con cambios sin guardar: lo único que
      // se puede hacer ahí es el aviso del propio navegador.
      window.addEventListener('beforeunload', ev => {
        if (!cambiosSinGuardar(estado.config)) return
        ev.preventDefault()
        ev.returnValue = ''
      })
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b || b.disabled) return
        const ds = b.dataset
        if (b.id === 'pr-cfg-salir-si') return confirmarSalida()
        if (b.id === 'pr-cfg-salir-no') return cancelarSalida()
        if (b.id === 'pr-cfg-personal-guardar') return guardarCambiosPersonal()
        if (b.id === 'pr-cfg-generar-pines') return generarPines()
        if (b.id === 'pr-cfg-abrir-maestro') return abrirPanelPin(null, true)
        if (b.id === 'pr-cfg-pin-cancelar') return cerrarPanelPin()
        if (b.id === 'pr-cfg-pin-guardar') return confirmarPinConfig()
        if (b.id === 'pr-cfg-abrir-temporal') return abrirPanelTemporal()
        if (b.id === 'pr-cfg-temporal-cancelar') return cerrarPanelTemporal()
        if (b.id === 'pr-cfg-temporal-dar') return confirmarTemporal()
        if (ds.pinAsignar !== undefined) return abrirPanelPin(estado.config.datos.personal.find(p => p.id === ds.pinAsignar))
        if (ds.temporalRevocar !== undefined) return revocarTemporal(ds.temporalRevocar)
        const tab = estado.config.tab
        if (tab === 'maquinas') accionMaquina(ds)
        else if (tab === 'recetas' && ds.recetaGuardar !== undefined) guardarReceta()
        else if (tab === 'ingredientes') accionIngrediente(ds)
        else if (tab === 'productos') accionProducto(ds)
        else if (tab === 'empaque') accionEmpaque(ds)
        else if (tab === 'marcas') accionMarca(ds)
      })
      cuerpo.addEventListener('change', ev => {
        const t = ev.target, c = estado.config
        if (t.dataset?.empSug !== undefined || t.dataset?.empCond !== undefined) return cambiarSelectEmpaque(t)
        if (t.dataset?.marcaDoble !== undefined) return cambiarDobleBolsa(t.dataset.marcaDoble, t.checked)
        if (t.dataset?.recetaMaquina !== undefined) { c.recetaMaquina = t.value; c.recetaTipo = null; cargarPestanaConfig() }
        else if (t.dataset?.recetaTipo !== undefined) { c.recetaTipo = t.value; pintarPestanaConfig() }
        else if (t.dataset?.recetaPartida !== undefined) { c.recetaPartida = t.value; pintarPestanaConfig() }
        else if (t.dataset?.ingInsumo !== undefined) { t.checked ? c.insumosElegidos.add(t.dataset.ingInsumo) : c.insumosElegidos.delete(t.dataset.ingInsumo) }
        else if (t.dataset?.personalTodos !== undefined) { c.todoElPersonal = t.checked; pintarPestanaConfig() }
        else if (t.dataset?.personaPuesto !== undefined) { tocarPuestoPersonal(t.dataset.personaPuesto, t.dataset.puesto, t.checked) }
        else if (t.id === 'pr-cfg-temporal-persona') { c.temporal.personaId = t.value || null }
        else if (t.id === 'pr-cfg-temporal-puesto') { c.temporal.puesto = t.value || null }
        else if (t.id === 'pr-cfg-temporal-hasta') { c.temporal.hasta = t.value }
      })
      cuerpo.addEventListener('input', ev => {
        const t = ev.target, c = estado.config
        if (t.dataset?.recetaKg !== undefined) return marcarCambioReceta(t)
        if (['pr-config-marca-buscar', 'pr-config-personal-buscar', 'pr-config-insumo-buscar'].includes(t.id)) {
          c.busqueda = t.value
          pintarPestanaConfig()
          const nuevo = document.getElementById(t.id)
          nuevo.focus?.()
          nuevo.setSelectionRange?.(nuevo.value.length, nuevo.value.length)
        }
      })
    }

    // Tocar una casilla de puesto NO guarda: deja la fila marcada como
    // cambiada y la manda el botón del pie, todas juntas.
    function tocarPuestoPersonal(personaId, puesto, marcado) {
      const c = estado.config
      const p = c.datos?.personal?.find(x => x.id === personaId)
      if (!p) return
      alternarPuesto(c, p, puesto, marcado)
      pintarPestanaConfig()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HISTORIAL Y STOCK TERMINADO (produccion:ver o produccion:configurar)
    // ═══════════════════════════════════════════════════════════════════════

    const TOPE_FILAS = 1000   // PostgREST corta ahí: si se llega, se avisa.

    // Las unidades que la persona puede mirar: las de ver y las de configurar.
    function unidadesDeHistorial() {
      const set = new Set([...unidadesCon('ver'), ...unidadesCon('configurar')])
      return [...estado.unidades.keys()].filter(id => set.has(id))
    }

    function sumarDias(iso, dias) {
      const d = new Date(`${iso}T12:00:00Z`)
      d.setUTCDate(d.getUTCDate() + dias)
      return d.toISOString().slice(0, 10)
    }

    // dd/mm/aaaa de una fecha (date de la base, sin hora).
    function fechaDelDia(iso) {
      return fechaCorta(`${iso}T12:00:00Z`)
    }

    function unidadInicialOficina(unidades) {
      if (unidades.includes(estado.unidadId)) return estado.unidadId
      return unidades[0] ?? null
    }

    async function nombresDeEmpleados(ids) {
      const unicos = [...new Set(ids.filter(Boolean))]
      if (!unicos.length) return new Map()
      const { data, error } = await supabase.from('v_empleados_publico').select('id, nombre').in('id', unicos)
      if (error) throw error
      return new Map((data ?? []).map(p => [p.id, p.nombre]))
    }

    // ── Historial de turnos ───────────────────────────────────────────────

    // UN DATO AUSENTE NO SE SUMA COMO SI FUERA CERO. `Number(null)` es 0 y es
    // finito, así que un acumulador ingenuo convierte "no se pudo leer" en un
    // total plausible y falso — la familia de bugs más repetida del proyecto.
    // Acá el total pasa a null y la pantalla muestra una raya: en una pantalla
    // de totales, decir que no se sabe es mejor que decir un número.
    function sumarMedido(acumulado, valor) {
      if (acumulado === null) return null
      if (valor === null || valor === undefined || valor === '') return null
      const n = Number(valor)
      return Number.isFinite(n) ? acumulado + n : null
    }

    // Enteros para leer: formatearNumeroAr() ya devuelve "—" con null, '' o NaN.
    function textoEntero(n) {
      return formatearNumeroAr(n, { decimales: 0 })
    }

    const ESTADO_TURNO = {
      abierto: ['abierto', 'Abierto'],
      pendiente_completar: ['pendiente', 'Pendiente de completar'],
      cerrado: ['cerrado', 'Cerrado'],
    }

    function htmlEstadoTurno(estadoTurno) {
      const [clase, texto] = ESTADO_TURNO[estadoTurno] ?? ['', estadoTurno ?? '—']
      return `<span class="pr-of-chip pr-of-chip--${clase}">${esc(texto)}</span>`
    }

    async function mostrarHistorial() {
      const unidades = unidadesDeHistorial()
      if (!unidades.length) return
      const hoy = hoyArgentina()
      estado.historial = estado.historial ?? { desde: sumarDias(hoy, -7), hasta: hoy, maquina: '', estado: '' }
      estado.historial.unidadId = unidades.includes(estado.historial.unidadId) ? estado.historial.unidadId : unidadInicialOficina(unidades)
      pintarSelectorUnidad('pr-historial-unidad', unidades, estado.historial.unidadId)
      document.getElementById('pr-historial-desde').value = estado.historial.desde
      document.getElementById('pr-historial-hasta').value = estado.historial.hasta
      document.getElementById('pr-historial-estado').value = estado.historial.estado
      document.getElementById('pr-historial-detalle').hidden = true
      document.getElementById('pr-historial-listado').hidden = false
      mostrarVista('pr-historial')
      await cargarHistorial()
    }

    function filtrosHistorialValidos(h) {
      return /^\d{4}-\d{2}-\d{2}$/.test(h.desde ?? '') && /^\d{4}-\d{2}-\d{2}$/.test(h.hasta ?? '') && h.desde <= h.hasta
    }

    async function cargarHistorial() {
      const h = estado.historial
      const lista = document.getElementById('pr-historial-lista')
      const aviso = document.getElementById('pr-historial-aviso')
      aviso.innerHTML = ''
      if (!filtrosHistorialValidos(h)) {
