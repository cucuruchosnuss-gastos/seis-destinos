    .pr-config-sub { display: grid; gap: 0.5rem; padding: 0.75rem; margin-left: 0.75rem; border-left: 4px solid var(--pr-borde-boton); }
    .pr-config-alta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .pr-config-alta .pr-input { flex: 1 1 14rem; }
    .pr-config-insumos { display: grid; gap: 0.375rem; max-height: 28rem; overflow-y: auto; padding: 0.5rem;
      border: 2px dashed var(--pr-borde-boton); border-radius: var(--radio-input); }
    .pr-check { display: flex; align-items: center; gap: 0.625rem; min-height: var(--pr-alto-boton); font-size: 1.125rem; overflow-wrap: anywhere; }
    .pr-config-marca { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    /* Empaque de cada presentación: sus cajas y lo que consume una caja. */
    .pr-emp__producto { font-size: 1.125rem; }
    .pr-emp__titulo { font-weight: 800; }
    .pr-emp--tocado { border-left-color: var(--naranja); }
    .pr-emp__sin-guardar { font-weight: 700; color: var(--naranja-oscuro); background: var(--naranja-suave); border-radius: 999px; padding: 0.05rem 0.5rem; }
    .pr-emp-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 0.5rem; align-items: center; min-width: 0; }
    .pr-emp-fila__nombre { overflow-wrap: anywhere; }
    .pr-emp-fila__campo { display: flex; align-items: center; gap: 0.5rem; }
    .pr-emp-fila__cant { width: 7rem; text-align: right; }
    @media (max-width: 700px) { .pr-emp-fila { grid-template-columns: minmax(0, 1fr); } .pr-emp-fila__cant { width: 100%; } }

    /* ── Configuración: LA EXCEPCIÓN DEL MÓDULO ───────────────────────────
       Todo lo demás se usa en la tablet, de pie y con harina en las manos.
       Configuración se usa en la COMPU, sentado, así que la densidad sube:
       texto de 15 px, filas de 52 px y controles de 40 px (README 7a). El
       ancho también: la tabla de Personal tiene seis columnas y a 1280 px el
       nombre queda apretado. */
    .pr-app:has(#pr-config:not([hidden])) { max-width: 1440px; }
    .pr-cfg { font-size: 0.9375rem; }
    .pr-cfg .pr-input, .pr-cfg .pr-select, .pr-cfg .pr-textarea { min-height: 40px; font-size: 0.9375rem; }
    .pr-cfg .pr-textarea { min-height: 56px; }
    .pr-cfg .pr-btn { min-height: 40px; font-size: 0.9375rem; padding: 0 1rem; }
    .pr-cfg .pr-check { min-height: 40px; font-size: 0.9375rem; }
    /* La casilla de la tablet mide 56 px porque se toca con el dedo. Acá se
       toca con el mouse, así que baja a los 22 px del diseño (7a) — que es lo
       que deja la fila en 52 px. */
    .pr-cfg .pr-casilla { width: 22px; height: 22px; border-width: 2px; border-radius: 6px; }
    .pr-cfg .pr-casilla::after { font-size: 0.875rem; }
    .pr-cfg .pr-titulo { font-size: 1.375rem; }
    .pr-cfg .pr-config-fila { padding: 0.75rem; }

    .pr-cfg-tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; border-bottom: 1px solid var(--color-borde); margin-top: 0.75rem; }
    .pr-cfg-tab {
      border: none; background: none; cursor: pointer; padding: 0.625rem 1rem; font: inherit; font-size: 0.9375rem;
      font-weight: 600; color: var(--pr-texto-secundario); border-bottom: 3px solid transparent; margin-bottom: -1px;
      display: flex; align-items: center; gap: 0.5rem; min-height: 44px;
    }
    .pr-cfg-tab--activa { color: var(--color-texto); font-weight: 800; border-bottom-color: var(--naranja); }
    /* El contador de pendientes: solo se dibuja si la cuenta se pudo leer. */
    /* La burbuja de conos por revisar en los accesos a Configuración: la misma
       receta que .tarjeta-modulo__burbuja del dashboard, pero en línea, al
       lado del texto del botón (acá el botón no es posicionado). */
    .pr-burbuja {
      display: inline-flex; align-items: center; justify-content: center; margin-left: 0.5rem;
      min-width: 1.75rem; height: 1.75rem; padding: 0 0.4rem; border-radius: 999px;
      background: var(--rojo); color: #fff; font-size: 0.9375rem; font-weight: 700; line-height: 1; vertical-align: middle;
    }
    .pr-cfg-tab__pend { background: var(--naranja); color: #fff; border-radius: 999px; padding: 0.05rem 0.45rem;
      font-size: 0.75rem; font-weight: 800; }

    .pr-cfg-tabla { border: 1px solid var(--color-borde); border-radius: 16px; overflow: hidden; background: #fff; }
    .pr-cfg-cab, .pr-cfg-fila { display: grid; align-items: center; gap: 1rem; padding: 0 1.5rem 0 1.25rem;
      border-left: 4px solid transparent; }
    .pr-cfg-cab { background: var(--color-superficie); border-bottom: 1px solid var(--color-borde); padding-top: 0.75rem;
      padding-bottom: 0.75rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--color-texto-suave); }
    .pr-cfg-fila { min-height: 52px; border-bottom: 1px solid var(--color-borde); }
    .pr-cfg-fila:last-child { border-bottom: none; }
    /* La fila tocada: franja naranja Y fondo Y la palabra "Cambiada". Tres
       señales, ninguna solo de color. */
    .pr-cfg-fila--tocada { border-left-color: var(--naranja); background: var(--naranja-suave); }
    .pr-cfg-fila__aviso { font-size: 0.8125rem; font-weight: 700; color: var(--naranja-oscuro); text-align: right; }
    .pr-cfg-personal { grid-template-columns: minmax(0, 1fr) 96px 96px 96px 190px 150px 108px; }
    .pr-cfg-centro { justify-self: center; }
    .pr-cfg-chip { display: inline-block; border-radius: 999px; padding: 0.2rem 0.625rem; font-size: 0.8125rem; font-weight: 700; }
    .pr-cfg-chip--ok { background: var(--verde-suave); color: var(--verde-oscuro); }
    .pr-cfg-chip--alerta { background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .pr-cfg-chip--gris { color: var(--color-texto-suave); font-weight: 600; }

    /* El pie con el botón de guardar, y EL ERROR PEGADO A ÉL (nunca arriba de
       todo): a su izquierda, en la misma línea. */
    .pr-cfg-pie { display: flex; align-items: center; justify-content: flex-end; gap: 0.875rem; flex-wrap: wrap;
      margin-top: 1rem; padding-top: 0.875rem; border-top: 1px solid var(--color-borde); }
    .pr-cfg-error { background: var(--bordo-suave); border-left: 4px solid var(--bordo); border-radius: 10px;
      padding: 0.625rem 0.875rem; font-size: 0.875rem; font-weight: 600; color: var(--bordo-oscuro); max-width: 520px; }
    .pr-cfg-panel { border: 2px solid var(--naranja); background: var(--naranja-suave); border-radius: 14px;
      padding: 0.875rem 1rem; margin-top: 0.75rem; display: grid; gap: 0.625rem; }
    .pr-cfg-temporal { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      flex-wrap: wrap; padding: 0.5rem 0; border-bottom: 1px solid var(--color-borde); }

    /* Conos pendientes de revisar (7c): arriba, en naranja. */
    .pr-cfg-pendiente { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 0.875rem 1rem;
      border: 1.5px solid var(--naranja); background: var(--naranja-suave); border-radius: 12px; margin-bottom: 0.625rem; }
    .pr-cfg-pendiente__datos { flex: 1 1 14rem; min-width: 0; }
    .pr-cfg-rotulo { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--naranja-oscuro); margin: 0.75rem 0 0.5rem; }
    .pr-cfg-rotulo--gris { color: var(--color-texto-suave); }
    .pr-cfg-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: 0.375rem 1.25rem; }

    /* Recetas (7b): recetas a la izquierda, editor al medio, historial a la
       derecha. */
    .pr-cfg-recetas { display: grid; grid-template-columns: 240px minmax(0, 1fr) 360px; gap: 1.25rem; align-items: start; }
    .pr-cfg-version { border-left: 3px solid var(--color-borde); padding-left: 0.75rem; margin-bottom: 0.75rem; }
    .pr-cfg-version--vigente { border-left-color: var(--naranja); }
    /* Una cantidad cambiada respecto de la versión vigente: naranja y el valor
       anterior al lado. */
    .pr-cfg-antes { color: var(--naranja-oscuro); font-weight: 700; font-size: 0.8125rem; }

    @media (max-width: 1100px) {
      .pr-cfg-recetas { grid-template-columns: minmax(0, 1fr); }
      .pr-cfg-personal { grid-template-columns: minmax(0, 1fr) 72px 72px 72px; }
      .pr-cfg-personal > :nth-child(n+5) { grid-column: 1 / -1; justify-self: start; text-align: left; }
      .pr-cfg-fila { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    }

    /* ── OFICINA: Historial y Stock terminado ─────────────────────────────
       Estas dos pantallas se miran en la COMPU y no en la tablet (están en
       VISTAS_OFICINA), así que van densas como Configuración: texto de 15px,
       controles de 40px y filas de tabla de 52px. No se toca .pr-cfg —es de
       Configuración— sino una clase propia sobre las dos secciones. */
    .pr-of { font-size: 0.9375rem; }
    .pr-of .pr-input, .pr-of .pr-select { min-height: 40px; font-size: 0.9375rem; }
    .pr-of .pr-btn { min-height: 40px; font-size: 0.9375rem; padding: 0 1rem; }
    .pr-of .pr-titulo { font-size: 1.375rem; }
    .pr-of .pr-subtitulo { font-size: 1.0625rem; margin: 1.25rem 0 0.5rem; }
    .pr-of .pr-campo__rotulo, .pr-of .pr-dato__rotulo {
      font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--color-texto-suave);
    }
    .pr-of .pr-dato__valor { font-size: 1rem; }
    .pr-of .pr-lista__item { font-size: 0.9375rem; padding: 0.5rem 0.75rem; }
    .pr-of .pr-renglon { font-size: 0.9375rem; }
    .pr-of .pr-chip-origen, .pr-of .pr-chip-choco, .pr-of .pr-chip-modificada { font-size: 0.8125rem; padding: 0.15rem 0.625rem; }
    .pr-of .pr-masa-tam { font-size: 1rem; }

    .pr-of-tabla { border: 1px solid var(--color-borde); border-radius: 16px; overflow: hidden; background: #fff; }
    .pr-of-cab, .pr-of-fila {
      display: grid; align-items: center; gap: 1rem; padding: 0.5rem 1.25rem;
      border-left: 4px solid transparent; text-align: left; min-width: 0;
    }
    .pr-of-cab {
      background: var(--color-superficie); border-bottom: 1px solid var(--color-borde);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--color-texto-suave);
    }
    .pr-of-fila { min-height: 52px; background: #fff; border-bottom: 1px solid var(--color-borde); }
    .pr-of-fila:last-child { border-bottom: none; }
    /* La fila de un turno es un botón que abre su detalle. El hover NO pisa el
       fondo: si lo pisara, taparía el bordó de una pendiente de completar, que
       es la variante que tiene que saltar (la trampa de dos reglas hermanas
       con la misma especificidad, ya documentada). */
    button.pr-of-fila { width: 100%; font: inherit; color: inherit; cursor: pointer; border-top: none;
      border-right: none; }
    button.pr-of-fila:hover, button.pr-of-fila:focus-visible { filter: brightness(0.97); }
    /* Un turno todavía ABIERTO: franja naranja, que en este módulo es lo que
       espera una acción. PENDIENTE DE COMPLETAR: bordó, porque lo que produjo
       todavía no entró al stock. */
    .pr-of-fila--abierto { border-left-color: var(--naranja); }
    .pr-of-fila--pendiente { border-left-color: var(--bordo); background: var(--bordo-suave); }
    .pr-of-turnos { grid-template-columns: 88px 116px 88px minmax(0, 1fr) minmax(0, 1fr) 168px; }
    .pr-of-stock { grid-template-columns: minmax(0, 1fr) 110px 140px; }
    .pr-of-num { font-variant-numeric: tabular-nums; text-align: right; }
    .pr-of-lote { font-size: 1.125rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pr-of-chip { display: inline-block; border-radius: 999px; padding: 0.15rem 0.625rem;
      font-size: 0.8125rem; font-weight: 800; }
    .pr-of-chip--cerrado { background: var(--verde-suave); color: var(--verde-oscuro); }
    .pr-of-chip--abierto { background: var(--naranja-suave); color: var(--naranja-oscuro); }
    .pr-of-chip--pendiente { background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .pr-of-grupo { margin-bottom: 0.875rem; }
    .pr-of-grupo__cab {
      display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 0.625rem 1.25rem; background: var(--color-superficie); border-bottom: 1px solid var(--color-borde);
    }
    .pr-of-grupo__titulo { font-size: 1.0625rem; font-weight: 800; margin: 0; }
    .pr-of-grupo__total { font-size: 1.0625rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    /* Un sublote ANULADO no se esconde: existió, se selló en una caja y su
       stock entró y salió. Se muestra tachado y no suma. */
    .pr-of-anulado { opacity: 0.6; }
    .pr-of-sin-caja { background: var(--bordo-suave); border-left: 4px solid var(--bordo); padding-left: 0.5rem; }
    .pr-of-anulado .pr-producido__sublote { text-decoration: line-through; }
    .pr-of-correccion { font-size: 0.8125rem; color: var(--color-texto-suave); margin-top: 0.125rem; }
    .pr-of-vacio { padding: 1rem 1.25rem; color: var(--color-texto-suave); }
    /* Una parada que cerró el turno (hasta_fin_de_turno): la máquina no volvió. */
    .pr-renglon--novolvio .pr-renglon__dato { color: var(--bordo-oscuro); font-weight: 800; }

    @media (max-width: 1100px) {
      .pr-of-cab { display: none; }
      .pr-of-turnos, .pr-of-stock { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .pr-of-num { text-align: left; }
    }

    /* LA HOJA DE PINES: se muestra UNA vez y se imprime. Al cerrarla, los
       PINes se borran de la memoria y del DOM. */
    .pr-hoja {
      position: fixed; inset: 0; z-index: 60; background: #fff; overflow-y: auto; padding: 1.5rem;
    }
    .pr-tira { border: 1px dashed var(--pr-off-borde); border-radius: 10px; padding: 0.875rem 1rem; margin-bottom: 0.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; break-inside: avoid; }
    .pr-tira__pin { font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 0.25em; }
    .pr-tira__nota { font-size: 0.8125rem; color: var(--pr-texto-secundario); }

    @media print {
      body { background: #fff !important; }
      .pr-barra, .pr-maestro, .pr-app > main, .pr-hoja__botones { display: none !important; }
      .pr-hoja { position: static; padding: 0; overflow: visible; }
    }
    /* ── fin de Configuración: de acá para abajo vuelve a mandar la tablet ── */

    /* El lote asignado: el número se lee de lejos. */
    .pr-lote { font-size: 3rem; font-weight: 900; color: var(--color-texto); letter-spacing: 0.02em; line-height: 1.1; }

    @media (max-width: 600px) {
      .pr-header__acciones { width: 100%; }
      .pr-header__acciones .pr-btn { flex: 1 1 auto; }
    }
  </style>
</head>

<body class="pagina-modulo">
  <div class="pr-app">

    <!-- La cabecera de la gestión, con el menú para ir a cada pantalla. -->
    <header class="pr-header" id="pr-header" hidden>
      <div class="pr-header__col">
        <span class="pr-header__marca">Seis Destinos</span>
        <div class="pr-header__fila">
          <span class="pr-header__titulo">Producción</span>
          <span class="pr-header__contexto" id="pr-header-contexto"></span>
        </div>
      </div>
      <div class="pr-header__acciones" id="pr-header-acciones">
        <button type="button" class="pr-btn pr-btn--secundario" id="pr-btn-menu" aria-expanded="false" aria-controls="pr-menu" hidden>Menú</button>
      </div>
    </header>

    <nav class="pr-tarjeta pr-menu" id="pr-menu" hidden aria-label="Menú de producción">
      <button type="button" class="pr-btn pr-btn--secundario" data-menu="historial" id="pr-menu-historial" hidden>Historial de producción</button>
      <button type="button" class="pr-btn pr-btn--secundario" data-menu="stock" id="pr-menu-stock" hidden>Stock terminado</button>
      <button type="button" class="pr-btn pr-btn--secundario" data-menu="config" id="pr-menu-config" hidden>Configuración</button>
      <a class="pr-btn pr-btn--secundario" href="../dashboard.html" id="pr-menu-dashboard">Volver al inicio de la app</a>
    </nav>

    <!-- Sin ninguna de las tres tareas no hay nada que mostrar: se dice y se
         vuelve al dashboard. El frontend solo oculta: la barrera real son las
         policies y las RPCs. -->
    <div class="pr-vacio" id="pr-sin-acceso" hidden></div>
    <div class="pr-vacio" id="pr-cargando">Cargando…</div>

    <main id="pr-vista" hidden>
      <section class="pr-tarjeta" id="pr-inicio">
        <h1 class="pr-titulo">¿Qué querés ver?</h1>
        <p class="pr-texto-suave" id="pr-inicio-texto"></p>
        <div class="pr-grilla pr-espacio-arriba" id="pr-oficina">
          <button type="button" class="pr-opcion" id="pr-btn-ir-historial" hidden>Historial de producción</button>
          <button type="button" class="pr-opcion" id="pr-btn-ir-stock" hidden>Stock terminado</button>
          <button type="button" class="pr-opcion" id="pr-btn-ir-config" hidden>Configuración</button>
        </div>
      </section>

      <!-- Anotar, corregir o borrar una parada. Lo abren la planilla y el
           detalle del historial. Las horas se cargan con − / + y el teclado
           propio: nada de input type=time. -->
      <div class="pr-lp" id="pr-parada-editor" hidden role="dialog" aria-modal="true" aria-labelledby="pr-parada-editor-titulo">
        <div class="pr-lp__caja">
          <h2 class="pr-lp__titulo" id="pr-parada-editor-titulo" tabindex="-1"></h2>
          <div id="pr-parada-editor-resumen"></div>
          <label class="pr-campo" id="pr-parada-editor-campo-motivo">
            <span class="pr-campo__rotulo" id="pr-parada-editor-motivo-rotulo">Motivo</span>
            <input type="text" id="pr-parada-editor-motivo" class="pr-input" maxlength="300" autocomplete="off">
          </label>
          <div id="pr-parada-editor-horas"></div>
          <p class="pr-error" id="pr-parada-editor-error" hidden></p>
          <div class="pr-acciones">
            <button type="button" class="pr-btn pr-btn--secundario" id="pr-parada-editor-cancelar">Cancelar</button>
            <button type="button" class="pr-btn pr-btn--secundario" id="pr-parada-editor-a-borrar" hidden>Borrar esta parada</button>
            <button type="button" class="pr-btn pr-btn--accion" id="pr-parada-editor-guardar">Guardar</button>
          </div>
        </div>
      </div>

      <!-- B6: configuración (produccion:configurar), por unidad.
           Es la ÚNICA pantalla del módulo que se usa en la compu y no en la
           tablet, así que sube la densidad (.pr-cfg): texto de 15 px, filas de
           52 px y controles de 40 px. -->
      <section id="pr-config" class="pr-cfg" hidden>
        <div class="pr-tarjeta">
          <div class="pr-fila-titulo">
            <h1 class="pr-titulo">Configuración</h1>
            <button type="button" class="pr-btn pr-btn--secundario" id="pr-config-volver">‹ Volver</button>
          </div>
          <label class="pr-campo">
            <span class="pr-campo__rotulo">Unidad</span>
            <select id="pr-config-unidad" class="pr-select"></select>
          </label>
          <div class="pr-cfg-tabs" id="pr-config-tabs" role="group" aria-label="Qué configurar"></div>
          <p class="pr-error" id="pr-config-error" hidden></p>
        </div>
        <div class="pr-tarjeta" id="pr-config-cuerpo"></div>
      </section>

      <!-- B7: historial de turnos (produccion:ver o :configurar). Se mira en
           la compu, así que va con la densidad de oficina (.pr-of). -->
      <section id="pr-historial" class="pr-of" hidden>
        <div id="pr-historial-listado">
          <div class="pr-tarjeta">
            <div class="pr-fila-titulo">
              <h1 class="pr-titulo">Historial de producción</h1>
              <button type="button" class="pr-btn pr-btn--secundario" id="pr-historial-volver">‹ Volver</button>
            </div>
            <div class="pr-campos">
              <label class="pr-campo"><span class="pr-campo__rotulo">Unidad</span><select id="pr-historial-unidad" class="pr-select"></select></label>
              <label class="pr-campo"><span class="pr-campo__rotulo">Desde</span><input type="date" id="pr-historial-desde" class="pr-input"></label>
              <label class="pr-campo"><span class="pr-campo__rotulo">Hasta</span><input type="date" id="pr-historial-hasta" class="pr-input"></label>
              <label class="pr-campo"><span class="pr-campo__rotulo">Máquina</span><select id="pr-historial-maquina" class="pr-select"></select></label>
              <label class="pr-campo"><span class="pr-campo__rotulo">Estado</span>
                <select id="pr-historial-estado" class="pr-select">
                  <option value="">Todos</option>
                  <option value="abierto">Abiertos</option>
                  <option value="pendiente_completar">Pendientes de completar</option>
                  <option value="cerrado">Cerrados</option>
                </select>
              </label>
            </div>
          </div>
          <div id="pr-historial-aviso"></div>
          <div id="pr-historial-lista"></div>
        </div>
        <div class="pr-tarjeta" id="pr-historial-detalle" hidden>
          <div class="pr-fila-titulo">
            <h1 class="pr-titulo">Turno</h1>
            <button type="button" class="pr-btn pr-btn--secundario" id="pr-historial-detalle-volver">‹ Historial</button>
          </div>
          <div id="pr-historial-detalle-cuerpo"></div>
        </div>
      </section>

      <!-- B7: stock de producto terminado. Solo lectura, y también de oficina. -->
      <section id="pr-stock" class="pr-of" hidden>
        <div class="pr-tarjeta">
          <div class="pr-fila-titulo">
            <h1 class="pr-titulo">Stock terminado</h1>
            <button type="button" class="pr-btn pr-btn--secundario" id="pr-stock-volver">‹ Volver</button>
          </div>
          <label class="pr-campo"><span class="pr-campo__rotulo">Unidad</span><select id="pr-stock-unidad" class="pr-select"></select></label>
        </div>
        <div id="pr-stock-aviso"></div>
        <div id="pr-stock-lista"></div>
      </section>

    </main>

    <!-- LA HOJA DE PINES. Los PINes que devuelve generar_pines_iniciales se
         muestran UNA sola vez: se imprime, se recorta y se reparte. Al cerrar,
         se borran de la memoria (estado.config.hoja) y del DOM. Vive fuera de
         <main> para que @media print pueda esconder todo lo demás. -->
    <div class="pr-hoja" id="pr-cfg-hoja" hidden>
      <div class="pr-fila-titulo pr-hoja__botones">
        <h1 class="pr-titulo">PINes para repartir</h1>
        <div class="pr-config-fila__botones">
          <button type="button" class="pr-btn" id="pr-cfg-hoja-imprimir">Imprimir</button>
          <button type="button" class="pr-btn pr-btn--secundario" id="pr-cfg-hoja-cerrar">Cerrar</button>
        </div>
      </div>
      <p class="pr-hoja__botones pr-texto-suave" id="pr-cfg-hoja-aviso"></p>
      <div id="pr-cfg-hoja-tiras"></div>
    </div>
  </div>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import {
      mostrarError, mostrarExito, enlazarCampoNumero, leerCampoNumero, ponerNumero, formatearNumeroAr,
    } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion: null,
      miEmpleadoId: null,
      miRolApp: null,
      // Tareas de produccion habilitadas: tarea → alcance (jsonb o null).
      misTareas: new Map(),
      // Todas las unidades activas: id → nombre.
      unidades: new Map(),
      // La tablet: en qué unidad está, en qué modo, y quién la está usando.
      unidadId: null,
      unidadesPosibles: [],
      modo: null,          // 'produccion' | 'masa'
      persona: null,       // { id, nombre, puesto } — verificada con su PIN
      personal: [],        // lo que devuelve personal_produccion
      vista: null,         // el id de la pantalla que se está mostrando
      quienBusqueda: '',
      // El panel del PIN en curso. Sus dígitos viven acá, EN MEMORIA, y no
      // llegan nunca al DOM ni a ningún storage.
      pin: null,
      maestro: null,       // { id, nombre } mientras el acceso maestro está activo
      acceso: null,        // el formulario de "Dar acceso por hoy"
      ultimoToque: null,   // para cerrar sola por inactividad
      // ¿Hay alguna máquina abierta? Es lo que habilita SALA DE MASA.
      // `abiertasConocido` dice si se PUDO medir: sin eso, un false de "no se
      // leyó" se leería igual que un false de "el encargado no abrió nada".
      abiertasConocido: false,
      // Modo Producción
      tablero: null,       // estadoMaquinas() de la unidad, o null si no se pudo leer
      hayTurnoAbierto: false,
      abrir: null,         // el formulario de abrir turno
      operarios: [],       // las personas que pueden ser operario en esta unidad
      abriendo: false,
      planilla: null,      // { turno, operarios, masas, paradas, items, maquinaNombre }
      opsPlanilla: { buscando: false, busqueda: '', guardando: false },
      catalogo: null,      // { productos, presentaciones, marcas } de la unidad
      cierre: null,        // el borrador del cierre: { hora, scrap, obs, rota }
      agregar: null,       // el producto que se está agregando, paso por paso
      corregir: null,      // { id, modo: 'corregir' | 'anular' } del sublote que se está tocando
      cerrando: false,
      // Sala de masa
      salaTurno: null,     // { id, lote, maquinaId, maquinaNombre, nro } de la máquina elegida
      salaDoble: false,    // el tamaño elegido en 6b, antes de que exista el borrador
      masa: null,          // el borrador de la masa en curso (con su client_uuid)
      datosMasa: null,     // lo que devolvió datos_para_masa: { original, anterior, insumos }
      tiposMasa: null,     // los tipos de masa de esa máquina (uno solo = no se pregunta)
      tipoMasa: null,
      defineChocolate: null, // los ingredientes con define_chocolate, de la tabla
      errorSala: null,     // lo que salió mal al leer la receta y los lotes
      errorReceta: null,   // lo que dijo la base al rechazar la masa
      exitoMasa: null,     // la banda verde de "Masa N registrada"
      masasTurno: null,
      enviandoMasa: false,
      anulando: null,
      // Configuración
      config: null,        // { unidadId, tab, busqueda, datos, … }
      // Historial y stock terminado
      historial: null,     // { unidadId, desde, hasta, maquina, estado, turnos, … }
      stockUnidad: null,
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS PROPIOS
    // ═══════════════════════════════════════════════════════════════════════

    // Escape de TODO texto que venga de una persona o de la base antes de
    // meterlo en un innerHTML. Cada módulo tiene el suyo.
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    // Con bypass de super_admin, igual que tiene_tarea() en la base.
    function tieneTarea(tarea) {
      return estado.miRolApp === 'super_admin' || estado.misTareas.has(tarea)
    }
    // A la gestión se entra con ver o configurar: cargar es de la tablet.
    const puedeVerGestion = () => tieneTarea('ver') || tieneTarea('configurar')

    // Las unidades donde la persona tiene esa tarea, con la MISMA regla que
    // tiene_tarea_alcance(): super_admin todas; {"todas": true} todas; si no,
    // las de {"unidades": [...]}. Solo unidades activas. No hay una vista
    // v_mis_unidades_* para producción, así que se resuelve acá — si la regla
    // del servidor cambia, esto tiene que cambiar con ella.
    function unidadesCon(tarea) {
      const activas = [...estado.unidades.keys()]
      if (estado.miRolApp === 'super_admin') return activas
      if (!estado.misTareas.has(tarea)) return []
      const alcance = estado.misTareas.get(tarea)
      if (alcance && alcance.todas === true) return activas
      const lista = Array.isArray(alcance?.unidades) ? alcance.unidades.map(String) : []
      return activas.filter(id => lista.includes(id))
    }

    // stock:ver, que es lo que deja leer stock_movimientos y v_stock_insumos
    // (su RLS es tiene_tarea_alcance('stock','ver', unidad)). Hace falta
    // saberlo ANTES de leer: una consulta vacía por RLS no se distingue de
    // "no hay nada", y la pantalla diría un cero que no es cierto.
    // estado.stockVer: undefined = no se pudo leer; null = no la tiene; si no,
    // su alcance ({} cuando la fila no trae alcance).
    async function cargarPermisoStock() {
      try {
        const { data, error } = await supabase.from('empleado_tareas').select('tarea, alcance')
          .eq('empleado_id', estado.miEmpleadoId).eq('modulo', 'stock').eq('tarea', 'ver').eq('habilitado', true)
        if (error) throw error
        const fila = (data ?? []).find(t => t.tarea === 'ver')
        estado.stockVer = fila ? (fila.alcance ?? {}) : null
      } catch (err) {
        console.error('permiso de stock:', err)
        estado.stockVer = undefined
      }
    }

    // true / false, o null si no se sabe (no se pudo leer el permiso). Misma
    // regla que tiene_tarea_alcance(): super_admin siempre; {"todas": true};
    // o la unidad en {"unidades": [...]}.
    function puedeVerStockEn(unidadId) {
      if (estado.miRolApp === 'super_admin') return true
      if (estado.stockVer === undefined) return null
      if (estado.stockVer === null) return false
      if (estado.stockVer.todas === true) return true
      const lista = Array.isArray(estado.stockVer.unidades) ? estado.stockVer.unidades.map(String) : []
      return lista.includes(String(unidadId))
    }

    // En un navegador privado, sin espacio o con el sitio bloqueado,
    // localStorage puede tirar: la tablet sigue andando, solo que no recuerda.
    function leerPreferencia(clave) {
      try { return localStorage.getItem(clave) } catch { return null }
    }
    function guardarPreferencia(clave, valor) {
      try {
        if (valor == null) localStorage.removeItem(clave)
        else localStorage.setItem(clave, valor)
      } catch { /* sin memoria: se vuelve a preguntar la próxima vez */ }
    }

    function tocar() {
      estado.ultimoToque = Date.now()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // NAVEGACIÓN
    // ═══════════════════════════════════════════════════════════════════════

    // La gestión: todas sus pantallas son "de oficina". La tablet quedó en
    // produccion.html.
    const VISTAS = ['pr-inicio', 'pr-config', 'pr-historial', 'pr-stock']
    function mostrarVista(id) {
      estado.vista = id
      for (const v of VISTAS) document.getElementById(v).hidden = v !== id
      cerrarMenu()
      pintarCabecera()
      if (window.scrollTo) window.scrollTo(0, 0)
    }

    // La cabecera se ve siempre: al lado del nombre, la unidad elegida.
    function pintarCabecera() {
      document.getElementById('pr-header').hidden = false
      document.getElementById('pr-header-contexto').textContent = estado.unidadId ? (estado.unidades.get(estado.unidadId) ?? '') : ''
      document.getElementById('pr-btn-menu').hidden = false
    }

    function cerrarMenu() {
      document.getElementById('pr-menu').hidden = true
      document.getElementById('pr-btn-menu').setAttribute('aria-expanded', 'false')
    }

    function alternarMenu() {
      const menu = document.getElementById('pr-menu')
      menu.hidden = !menu.hidden
      document.getElementById('pr-btn-menu').setAttribute('aria-expanded', menu.hidden ? 'false' : 'true')
    }

    function accionDelMenu(que) {
      if (que === 'config') return abrirConfigDesdeAcceso()
      if (que === 'historial') return mostrarHistorial()
      if (que === 'stock') return mostrarStockTerminado()
      return mostrarInicioOficina()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL PIN
    // ═══════════════════════════════════════════════════════════════════════
    //
    // EL PIN NO SE GUARDA EN NINGÚN LADO. Vive en estado.pin.digitos, en
    // memoria, mientras se lo tipea; los puntos de la pantalla son FORMAS, no
    // el número. Ni el PIN común, ni el maestro, ni el pin_temporal que
    // devuelve otorgar_puesto_temporal tocan localStorage, sessionStorage ni
    // el DOM. Por eso también el teclado es propio: un <input> pondría el
    // número en el DOM y levantaría el teclado del sistema, que en una tablet
    // con harina en las manos tapa media pantalla.
    //
    // Los rechazos de verificar_pin_produccion se DEVUELVEN como jsonb con su
    // motivo (leído con pg_get_functiondef el 22/09/2026), no se lanzan: se
    // tratan mirando `motivo`, no el texto del error.

    const LARGO_PIN = 4
    const LARGO_PIN_MAESTRO = 8

    // ═══════════════════════════════════════════════════════════════════════
    // DAR ACCESO POR HOY
    // ═══════════════════════════════════════════════════════════════════════

    // p_hasta null lo resuelve la base: medianoche de hoy, hora argentina. Para
    // otro día se manda el comienzo del día siguiente con el huso de Argentina,
    // que es fijo en -03:00 (no hay horario de verano).
    function hastaDesdeFecha(fecha, hoy) {
      if (!fecha || fecha === hoy) return null
      return `${sumarDias(fecha, 1)}T00:00:00-03:00`
    }

    function faltanParaAcceso(a, hoy) {
      const faltan = []
      if (!a?.personaId) faltan.push('elegí a quién')
      if (!a?.puesto) faltan.push('elegí el puesto')
      if (a?.hasta && a.hasta < hoy) faltan.push('la fecha ya pasó')
      if (a?.hasta && a.hasta > sumarDias(hoy, 6)) faltan.push('como mucho dura 7 días')
      return faltan
    }

    function conectarTodo() {
      document.getElementById('pr-btn-menu').addEventListener('click', alternarMenu)
      document.getElementById('pr-menu').addEventListener('click', ev => {
        const b = ev.target.closest('[data-menu]'); if (b) accionDelMenu(b.dataset.menu)
      })
      conectarEditorParada()
      conectarConfig()
      conectarHistorial()
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          cargarBurbujaConos()
        }
      })
    }

    // El editor de paradas: en la gestión lo abre el detalle del historial.
    function conectarEditorParada() {
      const editor = document.getElementById('pr-parada-editor')
      editor.addEventListener('click', ev => {
        if (ev.target === editor || ev.target.closest('#pr-parada-editor-cancelar')) return cerrarEditorParada()
        if (ev.target.closest('#pr-parada-editor-guardar')) return guardarParada()
        if (ev.target.closest('#pr-parada-editor-a-borrar')) return pasarABorrarParada()
        const paso = ev.target.closest('[data-hora-paso]'); if (paso) return cambiarHoraParada(paso.dataset.horaPaso, Number(paso.dataset.minutos))
        const num = ev.target.closest('[data-hora-tocar]'); if (num) return tocarHoraParada(num.dataset.horaTocar)
        const tecla = ev.target.closest('[data-hora-tecla]'); if (tecla) return teclaHoraParada(tecla.dataset.horaTecla)
        if (ev.target.closest('[data-hora-sigue]')) return alternarSigueParada()
      })
      editor.addEventListener('keydown', teclaEditorParada)
      document.getElementById('pr-parada-editor-motivo').addEventListener('input', ev => {
        if (estado.paradaForm) { estado.paradaForm.motivo = ev.target.value; estado.paradaForm.errorBase = '' }
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // FECHAS Y HORAS DE ARGENTINA
    // ═══════════════════════════════════════════════════════════════════════

    // Supabase y la tablet pueden estar en otra zona: "hoy" y la hora que se
    // muestran son siempre los de Argentina.
    const ZONA_AR = 'America/Argentina/Buenos_Aires'

    function hoyArgentina(fecha = new Date()) {
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AR, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(fecha)
      const v = (t) => p.find(x => x.type === t)?.value
      return `${v('year')}-${v('month')}-${v('day')}`
    }

    // 'HH:MM' de un timestamp; '' si no se puede leer (nunca "NaN:NaN").
    function horaArgentina(momento) {
      if (momento == null || momento === '') return ''
      const d = new Date(momento)
      if (Number.isNaN(d.getTime())) return ''
      return new Intl.DateTimeFormat('es-AR', { timeZone: ZONA_AR, hour: '2-digit', minute: '2-digit', hour12: false }).format(d)
    }

    // Duración legible entre dos momentos: "1 h 05 min", "12 min". Sin fin,
    // hasta ahora. '' si no se puede calcular.
    function textoMinutos(min) {
      if (!Number.isFinite(min) || min < 0) return ''
      if (min < 60) return `${min} min`
      return `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')} min`
    }

    function duracionTexto(inicio, fin, ahora = new Date()) {
      const a = new Date(inicio), b = fin ? new Date(fin) : ahora
      if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime()) || b < a) return ''
      return textoMinutos(Math.floor((b - a) / 60000))
    }

    // ── La columna de la izquierda: lo que se MIRA ────────────────────────

    // LAS LISTAS DE MASAS (planilla, sala e historial), terminar la tablet,
    // parte 5: lo GRANDE es SIMPLE o DOBLE, que es lo que se controla. Los
    // chips aparecen SOLO cuando dicen algo fuera de lo normal: "Modificada"
    // en bordó cuando la masa se apartó de la receta, y "Chocolate" cuando
    // lleva cacao (masas.es_chocolate, que escribe la base; en una masa que
    // todavía no se mandó, la misma regla de la sala: esChocolate()).
    // Original y Anterior NO llevan chip: son lo normal. Esto REEMPLAZA el
    // criterio anterior de un chip por origen (blanco / gris / naranja).
    function textoTamanoMasa(m) {
      return m?.doble ? 'DOBLE' : 'SIMPLE'
    }

    function htmlChipsMasa({ modificada = false, chocolate = false } = {}) {
      const chips = (modificada ? '<span class="pr-chip-modificada">Modificada</span>' : '') +
        (chocolate ? '<span class="pr-chip-choco">Chocolate</span>' : '')
      return chips ? `<span class="pr-masa-chips">${chips}</span>` : ''
    }

    function chipsDeMasa(m) {
      return htmlChipsMasa({ modificada: m?.origen === 'modificada', chocolate: !!m?.es_chocolate })
    }

    // Las paradas: la EN CURSO primero y en bordó, porque es la única que
    // sigue pasando; las terminadas con su rango y su duración.
    //
    // Con `acciones` ({ editar, borrar }), cada renglón lleva UN botón
    // (terminar la tablet, parte 4): "Corregir" si se puede corregir —y ahí
    // adentro está "Borrar esta parada" si también se puede borrar—, o
    // "Borrar" si solo se puede borrar (configurar sin cargar, en el
    // historial). Qué se ofrece lo decide quien llama, según dónde está y qué
    // permisos hay.
    function htmlAccionesParada(p, acciones) {
      if (acciones?.editar) return `<button type="button" class="pr-btn pr-btn--secundario pr-renglon__accion" data-parada-editar="${esc(p.id)}">Corregir</button>`
      if (acciones?.borrar) return `<button type="button" class="pr-btn pr-btn--secundario pr-renglon__accion" data-parada-borrar="${esc(p.id)}">Borrar</button>`
      return ''
    }

    function htmlParadas(paradas, acciones = null) {
      const lista = paradas ?? []
      if (!lista.length) return '<p class="pr-texto-suave">Sin paradas en este turno.</p>'
      const orden = [...lista.filter(p => !p.fin), ...lista.filter(p => p.fin)]
      return orden.map(p => {
        const desde = horaArgentina(p.inicio) || '—'
        const dur = duracionTexto(p.inicio, p.fin)
        // Con botón, el texto va en su propia columna y el botón a la derecha;
        // sin botón, el renglón es el de siempre.
        const acc = htmlAccionesParada(p, acciones)
        const conAcc = acc ? ' pr-renglon--acc' : ''
        const abre = acc ? '<span class="pr-renglon__texto">' : ''
        const cierra = acc ? `</span>${acc}` : ''
        if (!p.fin) {
          return `<div class="pr-renglon pr-renglon--curso${conAcc}">${abre}` +
            `<span class="pr-renglon__num"><strong>${esc(desde)}</strong> · ${esc(p.motivo)}</span>` +
            `<span class="pr-renglon__dato">en curso${dur ? ` · ${esc(dur)}` : ''}</span>${cierra}</div>`
        }
        // hasta_fin_de_turno lo pone cerrar_turno sobre la parada que quedó
        // abierta: la máquina NO volvió en todo el turno. En la planilla nunca
        // llega en true (se escribe al cerrar) y el historial sí lo trae.
        const novolvio = p.hasta_fin_de_turno ? ' pr-renglon--novolvio' : ''
        return `<div class="pr-renglon${novolvio}${conAcc}">${abre}` +
          `<span class="pr-renglon__num"><strong>${esc(desde)}–${esc(horaArgentina(p.fin) || '—')}</strong> · ${esc(p.motivo)}</span>` +
          `<span class="pr-renglon__dato">${esc(dur)}${p.hasta_fin_de_turno ? ' · no volvió en todo el turno' : ''}</span>${cierra}</div>`
      }).join('')
    }

    // Un renglón de lo producido. Un ANULADO no se esconde: se muestra
    // anulado, porque ese sublote existió, se selló en una caja y su stock
    // entró y salió.
    // La caja de empaque de un renglón ya cargado ("Caja N°1 Nuss"), o '' si
    // no tiene. Una caja cuyo nombre no llegó no queda muda. Texto plano.
    function nombreCajaItem(it, insumos) {
      if (!it?.caja_insumo_id) return ''
      const ins = (insumos ?? []).find(i => i.id === it.caja_insumo_id)
      return ins ? textoInsumoEmpaque(ins) : 'caja sin nombre'
    }

    // ── QUÉ ES UN RENGLÓN DE LO PRODUCIDO, DICHO UNA SOLA VEZ (terminar la
    // tablet, parte 5). Antes decía "Caja con cono · con cono · Común · caja
    // ×320": el nombre de la presentación, su detalle y el cono repetían lo
    // mismo. Ahora, en este orden y sin nada repetido:
    //
    //   producto · con cono / sin cono · cono · caja ×N · caja de empaque · embolsado
    //
    //  - "con cono" si la presentación es con cono, y ahí el CONO: su marca, o
    //    "Común" si no tiene. Sin cono, el cono no se nombra.
    //  - "sin cono" SOLO si ese producto tiene alguna presentación con cono: en
    //    un Vaso o una Oblea no hay nada que distinguir y sería ruido.
    //  - El envase sale del nombre de la presentación SIN el "con cono" / "sin
    //    cono" (que ya se dijo): "Caja con cono" → "caja", "Media caja" →
    //    "media caja", "Caja N°2" → "caja N°2". Con las unidades por caja.
    //  - La caja de empaque si tiene, y el embolsado en palabras si no es
    //    'ninguno' (sin bolsa no se dice: es lo que no se consumió).
    //  - Una parte cuyo texto (sin acentos ni mayúsculas) ya apareció, o que
    //    es el nombre del producto, no se repite.
    // La usan la planilla y el historial: una regla, un lugar. Devuelve texto
    // plano; quien lo mete en HTML lo escapa.
    function envasePresentacion(pr, producto) {
      let t = String(pr?.nombre ?? '').replace(/(^|\s)(con|sin)\s+cono(?=\s|$)/gi, ' ').replace(/\s+/g, ' ').trim()
      const k = normalizarBusqueda(t)
      if (!k || k === 'caja' || normalizarBusqueda(producto).includes(k)) t = pr?.media_caja ? 'media caja' : 'caja'
      return t.charAt(0).toLocaleLowerCase('es') + t.slice(1)
    }

    function partesProducido({ producto, pr, conConoEnProducto = false, marcaNombre = null, unidadesPorCaja, caja = '', embolsado = null }) {
      const partes = []
      const vistos = new Set([normalizarBusqueda(producto)])
      const sumar = (t) => {
        const k = normalizarBusqueda(t)
        if (!k || vistos.has(k)) return
        vistos.add(k)
        partes.push(String(t))
      }
      if (pr?.con_cono) {
        sumar('con cono')
        sumar(marcaNombre ?? 'Común')
      } else if (conConoEnProducto) {
        sumar('sin cono')
      }
      // Si el nombre del envase ya trae las unidades ("Caja x600"), no se
      // vuelven a poner.
      const envase = envasePresentacion(pr, producto)
      const cuantas = formatearNumeroAr(unidadesPorCaja, { decimales: 0 })
      const yaLasDice = new RegExp(`[x×]\\s*${String(cuantas).replace(/\./g, '\\.?')}(?!\\d)`, 'i').test(envase)
      sumar(yaLasDice ? envase : `${envase} ×${cuantas}`)
      // Una caja de empaque que se llama como el envase ("Caja capelina" de la
      // presentación y el insumo "Caja capelina") ya está dicha.
      vistos.add(normalizarBusqueda(envase))
      sumar(caja)
      if (embolsado && embolsado !== 'ninguno') sumar(TEXTO_EMBOLSADO[embolsado] ?? embolsado)
      return partes
    }

    // Un renglón que entró SIN CAJA: la caja no se descontó del stock.
    // El criterio sale de los datos del propio renglón, no del catálogo:
    // desde el empaque (24/09/2026) la base guarda SIEMPRE el embolsado
    // (registrar_produccion_item y cerrar_turno ponen 'ninguno' como mínimo),
    // así que `caja_insumo_id` null CON embolsado es un renglón posterior al
    // empaque que no descontó caja. Los anteriores tienen los dos en null y
    // no se marcan: no es un error, el empaque no existía. Un anulado
    // tampoco: su empaque ya se devolvió.
    // Entra también el de una presentación SIN cajas configuradas: ahí la caja
    // tampoco se descontó, y es verdad decirlo.
    function sinCajaDescontada(it) {
      return !!it && !it.anulado && !it.caja_insumo_id && !!it.embolsado
    }

    // Texto plano. Las bolsas no se descuentan si el embolsado quedó en
    // 'ninguno'; con 'doble' sí.
    function textoSinCaja(it) {
      return 'Sin empaque descontado: no se descontó la caja' + (it.embolsado === 'ninguno' ? ' ni las bolsas' : '')
    }

    // ── Anotar, corregir y borrar una parada (terminar la tablet, parte 4)
    //
    // "PARÓ AHORA" SIGUE CON iniciar_parada, a propósito: la hora la pone el
    // now() del servidor (un reloj de tablet atrasado no la corre) y la RPC solo
    // vale con el turno 'abierto', que es justo cuando "ahora" tiene sentido.
    // Por eso el botón se esconde en una planilla pendiente de completar.
    // "Anotar una parada" es para después de arreglar la máquina:
    // registrar_parada con las dos horas, o sin la de vuelta si sigue parada.
    //
    // OJO — las RPCs nuevas (registrar/editar/borrar_parada) solo tratan
    // 'cerrado' como cerrado: una planilla 'pendiente_completar' entra por la
    // rama de abierta (alcanza con produccion:cargar y borrar no pide motivo).
    // La pantalla hace lo mismo: 'pendiente_completar' se maneja desde la
    // planilla, como una abierta, salvo que ahí NO se ofrece "Todavía no
    // volvió" (la máquina ya no está en marcha).
    //
    // A QUÉ DÍA VA CADA HORA. La fecha es la del turno. El huso de Argentina es
    // fijo (−03:00, sin horario de verano), así que el ISO se arma a mano y da
    // lo mismo la zona del dispositivo. La hora de PARADA va a la PRIMERA vez
    // que esa hora cae desde la apertura menos 1 hora (el mismo piso de la
    // base): en un turno de noche, 23:50 es el día del turno y 02:10 el
    // siguiente. Si así queda después del tope ("ahora" más los 5 minutos de
    // la base, o el cierre si la planilla está cerrada) se dice antes de
    // mandar. La de VUELTA va a la primera vez que esa hora cae DESPUÉS de la
    // parada: si es menor, es del día siguiente (CRUCE DE MEDIANOCHE), pero
    // solo si la parada queda en 12 horas o menos —lo que dura un turno—; más
    // que eso es un error de tipeo ("paró 14:00, volvió 13:55") y se dice.

    // La tolerancia de "no futura" y el piso de 1 hora antes de abrir son los
    // de registrar_parada. Una parada que cruza medianoche dura como mucho un
    // turno (12 horas).
    const MS_DIA = 86400000
    const TOLERANCIA_FUTURO_MS = 5 * 60000
    const PISO_APERTURA_MS = 3600000
    const MAX_CRUCE_MS = 12 * 3600000

    function instanteAr(dia, hhmm) {
      return new Date(`${dia}T${hhmm}:00-03:00`).getTime()
    }

    function isoAr(ms) {
      const d = new Date(ms)
      return `${hoyArgentina(d)}T${horaArgentina(d)}:00-03:00`
    }

    // Piso y tope del turno, en milisegundos.
    function limitesParada(turno, ahora = new Date()) {
      const piso = turno?.abierto_en ? new Date(turno.abierto_en).getTime() - PISO_APERTURA_MS
        : instanteAr(turno?.fecha ?? hoyArgentina(ahora), '00:00')
      const cerrado = turno?.estado === 'cerrado' && !!turno?.cerrado_en
      const tope = Math.min(new Date(ahora).getTime(), cerrado ? new Date(turno.cerrado_en).getTime() : Infinity) + TOLERANCIA_FUTURO_MS
      return { piso, tope, cerrado }
    }

    // { inicio, fin } en ISO con −03:00, o { error } en palabras.
    function resolverHorasParada(f, turno, ahora = new Date()) {
      const h1 = normalizarHora(f.inicio)
      if (!h1) return { error: 'Poné la hora en que paró.' }
      const { piso, tope, cerrado } = limitesParada(turno, ahora)
      let ini = instanteAr(hoyArgentina(new Date(piso)), h1)
      if (ini < piso) ini += MS_DIA
      if (ini > tope) return { error: 'La hora en que paró no entra en el turno.' }
      if (f.sigue) return { inicio: isoAr(ini), fin: null }
      const h2 = normalizarHora(f.fin)
      if (!h2) return { error: 'Poné la hora en que volvió, o marcá que todavía no volvió.' }
      let fin = instanteAr(hoyArgentina(new Date(ini)), h2)
      if (fin <= ini) fin += MS_DIA
      if (h2 <= h1 && fin - ini > MAX_CRUCE_MS) return { error: 'La hora de vuelta tiene que ser después de la de parada.' }
      if (fin > tope) return { error: cerrado ? 'La hora de vuelta es posterior al cierre de la planilla.' : 'La hora de vuelta no puede ser futura.' }
      return { inicio: isoAr(ini), fin: isoAr(fin) }
    }

    // Lo que falta, en palabras. Lista vacía = se puede mandar.
    function faltanParaParada(f, ahora = new Date()) {
      const faltan = []
      const motivo = String(f.motivo ?? '').trim()
      if (f.modo === 'borrar') {
        if (f.turno.estado === 'cerrado' && motivo.length < 3) faltan.push('Escribí por qué se borra, con tres letras por lo menos.')
        return faltan
      }
      if (motivo.length < 2) faltan.push('Escribí el motivo de la parada.')
      const h = resolverHorasParada(f, f.turno, ahora)
      if (h.error) faltan.push(h.error)
      // editar_parada NO valida que queden dos abiertas: lo ataja la pantalla.
      if (f.sigue && (f.paradas ?? []).some(p => !p.fin && p.id !== f.paradaId)) {
        faltan.push('Ya hay una parada sin terminar en esta planilla: terminala primero.')
      }
      return faltan
    }

    // Una hora de a 5 minutos, redondeada para abajo.
    function horaRedondeada(fecha = new Date()) {
      const h = horaArgentina(fecha)
      if (!h) return ''
      const min = Number(h.slice(3))
      return `${h.slice(0, 3)}${String(min - (min % 5)).padStart(2, '0')}`
    }

    // La hora "de ahora" para arrancar el formulario: el cierre si la planilla
    // está cerrada, cuándo se la cerró a la fuerza si quedó pendiente de
    // completar (puede estar completándose días después), si no ahora mismo.
    function horaDeReferencia(turno, ahora = new Date()) {
      if (turno?.estado === 'cerrado' && turno.cerrado_en) return horaRedondeada(new Date(turno.cerrado_en))
      if (turno?.estado === 'pendiente_completar' && turno.forzado_en) return horaRedondeada(new Date(turno.forzado_en))
      return horaRedondeada(ahora)
    }

    function abrirEditorParada({ modo, turno, paradas, parada = null, contexto, puedeBorrar = false }) {
      tocar()
      const ref = horaDeReferencia(turno)
      estado.paradaForm = {
        modo, contexto, turno, paradas: paradas ?? [], puedeBorrar: !!puedeBorrar,
        paradaId: parada?.id ?? null,
        motivo: modo === 'borrar' ? '' : (parada?.motivo ?? ''),
        inicio: parada ? (horaArgentina(parada.inicio) || '') : horaConPaso(ref, -15),
        fin: parada ? (parada.fin ? (horaArgentina(parada.fin) || '') : ref) : ref,
        // Una parada abierta arranca "todavía no volvió" SOLO si el turno está
        // abierto: en otro estado el botón no se dibuja y la vuelta tiene que
        // poder escribirse.
        sigue: !!parada && !parada.fin && turno?.estado === 'abierto',
        parada,
        teclado: null, buffer: '',
        intentado: false, enviando: false, errorBase: '',
      }
      document.getElementById('pr-parada-editor-motivo').value = estado.paradaForm.motivo
      pintarEditorParada()
      document.getElementById('pr-parada-editor').hidden = false
      // El foco va al título y NO al motivo: en la tablet, enfocar el campo
      // de texto abre el teclado del sistema y tapa las horas.
      document.getElementById('pr-parada-editor-titulo').focus()
    }

    function cerrarEditorParada() {
      estado.paradaForm = null
      document.getElementById('pr-parada-editor').hidden = true
    }

    // "Borrar esta parada", desde el editor: el MISMO panel pasa a ser la
    // confirmación (qué parada es, y el motivo si la planilla está cerrada).
    // Nada se borra hasta tocar "Borrar la parada".
    function pasarABorrarParada() {
      const f = estado.paradaForm
      if (!f || f.modo !== 'editar' || !f.puedeBorrar) return
      tocar()
      Object.assign(f, { modo: 'borrar', motivo: '', teclado: null, buffer: '', intentado: false, errorBase: '' })
      document.getElementById('pr-parada-editor-motivo').value = ''
      pintarEditorParada()
      document.getElementById('pr-parada-editor-titulo').focus()
    }

    // "Todavía no volvió" solo tiene sentido con el turno ABIERTO: una
    // planilla cerrada o pendiente de completar ya no tiene la máquina parada.
    function puedeSeguirParada(f) {
      return f.turno.estado === 'abierto'
    }

    function htmlCampoHora(clave, rotulo, valor, f) {
      const activo = f.teclado === clave
      const muestra = activo ? (f.buffer ? f.buffer.padEnd(4, '·').replace(/^(..)(..)$/, '$1:$2') : '··:··') : (normalizarHora(valor) || '—')
      return `<div class="pr-hp__fila"><span class="pr-hp__rotulo">${esc(rotulo)}</span>` +
        `<button type="button" class="pr-hp__paso" data-hora-paso="${esc(clave)}" data-minutos="-5" aria-label="${esc(rotulo)}: 5 minutos menos">−</button>` +
        `<button type="button" class="pr-hp__num" data-hora-tocar="${esc(clave)}" aria-pressed="${activo ? 'true' : 'false'}" aria-label="${esc(rotulo)}: ${esc(normalizarHora(valor) || 'sin hora')}. Tocá para escribirla">${esc(muestra)}</button>` +
        `<button type="button" class="pr-hp__paso" data-hora-paso="${esc(clave)}" data-minutos="5" aria-label="${esc(rotulo)}: 5 minutos más">+</button></div>`
    }

    // El teclado propio de las horas: nunca el del sistema.
    function htmlTecladoHora() {
      let out = '<div class="pr-hp__teclado" role="group" aria-label="Teclado de la hora">'
      for (let d = 1; d <= 9; d++) out += `<button type="button" class="pr-hp__tecla" data-hora-tecla="${d}">${d}</button>`
      out += '<button type="button" class="pr-hp__tecla" data-hora-tecla="borrar">Borrar</button>'
      out += '<button type="button" class="pr-hp__tecla" data-hora-tecla="0">0</button>'
      out += '<button type="button" class="pr-hp__tecla pr-hp__tecla--accion" data-hora-tecla="listo">Listo</button>'
      return out + '</div>'
    }

    // En qué día cae lo que está escrito, para que se vea cuando no es el del
    // turno (una parada de la noche que siguió después de medianoche).
    function textoDiaParada(f) {
      const h = resolverHorasParada(f, f.turno)
      if (h.error) return ''
      const dIni = h.inicio.slice(0, 10), dFin = h.fin ? h.fin.slice(0, 10) : dIni
      const diaTurno = f.turno.fecha
      if (dIni === diaTurno && dFin === diaTurno) return ''
      return `Paró el ${fechaDelDia(dIni)}${h.fin ? ` y volvió el ${fechaDelDia(dFin)}` : ''}.`
    }

    function htmlHorasParada(f) {
      if (f.modo === 'borrar') return ''
      const sigue = puedeSeguirParada(f)
        ? `<button type="button" class="pr-hp__sigue" data-hora-sigue="1" aria-pressed="${f.sigue ? 'true' : 'false'}">Todavía no volvió</button>`
        : ''
      const vuelta = f.sigue ? '' : htmlCampoHora('fin', 'Volvió a las', f.fin, f)
      const dia = textoDiaParada(f)
      return '<div class="pr-hp">' + htmlCampoHora('inicio', 'Paró a las', f.inicio, f) + vuelta + sigue +
        (dia ? `<p class="pr-hp__dia">${esc(dia)}</p>` : '') +
        (f.teclado ? htmlTecladoHora() : '') + '</div>'
    }

    function tituloEditorParada(f) {
      if (f.modo === 'anotar') return 'Anotar una parada'
      if (f.modo === 'editar') return 'Corregir la parada'
      return 'Borrar la parada'
    }

    // EL ERROR VA AL ESTADO, NO AL DOM: el único que escribe el mensaje es este
    // render, que decide entre lo que falta y lo que contestó la base. Así un
    // repintado no tapa el error de la base (lo que pasó en el cierre).
    function pintarEditorParada() {
      const f = estado.paradaForm
      if (!f) return
      document.getElementById('pr-parada-editor-titulo').textContent = tituloEditorParada(f)
      const resumen = document.getElementById('pr-parada-editor-resumen')
      if (f.modo === 'borrar' && f.parada) {
        const desde = horaArgentina(f.parada.inicio) || '—'
        const hasta = f.parada.fin ? (horaArgentina(f.parada.fin) || '—') : 'sigue'
        resumen.innerHTML = `<p class="pr-hp__resumen">${esc(desde)}–${esc(hasta)} · ${esc(f.parada.motivo)}</p>`
      } else {
        resumen.innerHTML = ''
      }
      const cerrada = f.turno.estado === 'cerrado'
      document.getElementById('pr-parada-editor-campo-motivo').hidden = f.modo === 'borrar' && !cerrada
      document.getElementById('pr-parada-editor-motivo-rotulo').textContent = f.modo === 'borrar'
        ? '¿Por qué se borra? (la planilla ya está cerrada)' : 'Motivo'
      document.getElementById('pr-parada-editor-horas').innerHTML = htmlHorasParada(f)
      const faltan = faltanParaParada(f)
      const texto = f.errorBase || (f.intentado && faltan.length ? faltan[0] : '')
      const errEditor = document.getElementById('pr-parada-editor-error')
      errEditor.textContent = texto
      errEditor.hidden = !texto
      const btn = document.getElementById('pr-parada-editor-guardar')
      btn.textContent = f.modo === 'borrar' ? 'Borrar la parada' : 'Guardar'
      document.getElementById('pr-parada-editor-a-borrar').hidden = !(f.modo === 'editar' && f.puedeBorrar)
      btn.className = f.modo === 'borrar' ? 'pr-btn pr-btn--peligro' : 'pr-btn pr-btn--accion'
      // El botón se traba SOLO mientras se manda: lo que falta se dice al
      // tocarlo. Deshabilitarlo por lo que falta haría inalcanzable el error.
      btn.disabled = !!f.enviando
    }

    function cambiarHoraParada(clave, minutos) {
      const f = estado.paradaForm
      if (!f || f.modo === 'borrar') return
      tocar()
      f[clave] = horaConPaso(normalizarHora(f[clave]) || horaDeReferencia(f.turno), minutos)
      f.teclado = null
      f.errorBase = ''
      pintarEditorParada()
    }

    function tocarHoraParada(clave) {
      const f = estado.paradaForm
      if (!f) return
      tocar()
      f.teclado = f.teclado === clave ? null : clave
      f.buffer = ''
      pintarEditorParada()
    }

    // 3 o 4 números: "930" es 09:30 y "1745" es 17:45. Lo que no es una hora
    // de verdad no se escribe.
    function teclaHoraParada(t) {
      const f = estado.paradaForm
      if (!f || !f.teclado) return
      tocar()
      if (t === 'borrar') f.buffer = f.buffer.slice(0, -1)
      else if (t === 'listo') {
        if (f.buffer) {
          const h = normalizarHora(f.buffer)   // "930" ya es 09:30 para normalizarHora
          if (h) { f[f.teclado] = h; f.errorBase = '' }
          else { f.errorBase = 'Esa hora no existe. Escribila con 4 números, por ejemplo 0930.' }
        }
        f.teclado = null
        f.buffer = ''
      } else if (/^[0-9]$/.test(t) && f.buffer.length < 4) f.buffer += t
      pintarEditorParada()
    }

    function alternarSigueParada() {
      const f = estado.paradaForm
      if (!f || !puedeSeguirParada(f)) return
      tocar()
      f.sigue = !f.sigue
      if (f.teclado === 'fin') f.teclado = null
      f.errorBase = ''
      pintarEditorParada()
    }

    function parametrosParada(f, horas) {
      const motivo = String(f.motivo ?? '').trim()
      if (f.modo === 'anotar') return ['registrar_parada', { p_turno_id: f.turno.id, p_motivo: motivo, p_inicio: horas.inicio, p_fin: horas.fin }]
      if (f.modo === 'editar') return ['editar_parada', { p_parada_id: f.paradaId, p_motivo: motivo, p_inicio: horas.inicio, p_fin: horas.fin }]
      return ['borrar_parada', { p_parada_id: f.paradaId, p_motivo: f.turno.estado === 'cerrado' ? motivo : null }]
    }

    async function guardarParada() {
      const f = estado.paradaForm
      if (!f || f.enviando) return
      f.motivo = document.getElementById('pr-parada-editor-motivo').value
      f.intentado = true
      f.errorBase = ''
      const faltan = faltanParaParada(f)
      if (faltan.length) return pintarEditorParada()
      const horas = f.modo === 'borrar' ? null : resolverHorasParada(f, f.turno)
      const [rpc, params] = parametrosParada(f, horas)
      f.enviando = true
      pintarEditorParada()
      try {
        const { error } = await supabase.rpc(rpc, params)
        if (error) throw error
      } catch (e) {
        console.error(rpc + ':', e)
        f.enviando = false
        // El mensaje de la base TAL CUAL: ya viene escrito para una persona.
        f.errorBase = e?.message || 'No se pudo guardar la parada. Revisá la conexión y probá de nuevo.'
        return pintarEditorParada()
      }
      const { contexto, turno, modo } = f
      cerrarEditorParada()
      mostrarExito(modo === 'borrar' ? 'Parada borrada.' : 'Parada guardada.')
      // En la gestión el editor solo se abre desde el historial.
      if (contexto === 'historial') return abrirDetalleHistorial(turno.id)
    }

    // En el historial, SOLO en una planilla CERRADA y con los permisos que
    // piden las RPCs en esa unidad: corregir o anotar exige cargar Y
    // configurar (editar_parada y registrar_parada piden cargar siempre, y
    // configurar si está cerrada); borrar, configurar. Las abiertas se
    // manejan desde la planilla.
    function accionesParadaHistorial(turno) {
      if (!turno || turno.estado !== 'cerrado') return { editar: false, borrar: false }
      const u = turno.unidad_negocio_id
      const configura = unidadesCon('configurar').includes(u)
      const carga = unidadesCon('cargar').includes(u)
      return { editar: configura && carga, borrar: configura }
    }

    function abrirEditorDesdeHistorial(modo, paradaId = null) {
      const d = estado.detalleHistorial
      if (!d) return
      const acc = accionesParadaHistorial(d.turno)
      if (modo === 'borrar' ? !acc.borrar : !acc.editar) return
      const parada = paradaId ? (d.paradas ?? []).find(x => x.id === paradaId) ?? null : null
      if (paradaId && !parada) return
      abrirEditorParada({ modo, turno: d.turno, paradas: d.paradas, parada, contexto: 'historial', puedeBorrar: acc.borrar })
    }

    function teclaEditorParada(ev) {
      if (!estado.paradaForm) return
      if (ev.key === 'Escape') { ev.preventDefault(); cerrarEditorParada(); return }
      if (ev.key !== 'Tab') return
      const panel = document.getElementById('pr-parada-editor')
      const focos = [...panel.querySelectorAll('button:not([disabled]), input:not([disabled])')]
      if (!focos.length) return
      const i = focos.indexOf(document.activeElement)
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); focos[focos.length - 1].focus() }
      else if (!ev.shiftKey && i === focos.length - 1) { ev.preventDefault(); focos[0].focus() }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL EMPAQUE — la caja, el embolsado y lo que consume un renglón
    // ═══════════════════════════════════════════════════════════════════════
    //
    // La pantalla NO descuenta nada: lo hace registrar_produccion_item con
    // _descontar_empaque. Lo de acá es para ELEGIR (la caja y el embolsado) y
    // para DECIR lo que se va a consumir, con la MISMA regla de la base:
    // 1 caja de cartón por caja producida, y cada renglón de
    // presentacion_empaque 'siempre', o 'bolsa_grande' si el embolsado es
    // grande o doble, o 'bolsa_individual' si es individual o doble.

    const EMBOLSADOS = [
      { valor: 'grande', texto: 'Bolsa grande' },
      { valor: 'individual', texto: 'Bolsitas individuales' },
      { valor: 'doble', texto: 'Las dos' },
      { valor: 'ninguno', texto: 'Sin bolsa' },
    ]
    const TEXTO_EMBOLSADO = { grande: 'bolsa grande', individual: 'bolsitas individuales', doble: 'doble bolsa', ninguno: 'sin bolsa' }

    // "Caja N°1 Nuss": nombre y marca, que es lo que distingue las tres Caja N°1.
    function textoInsumoEmpaque(ins) {
      if (!ins) return 'insumo sin nombre'
      return ins.marca ? `${ins.nombre} ${ins.marca}` : String(ins.nombre ?? '')
    }

    // La normalización de TODOS los buscadores del módulo: sin acentos y en
    // minúsculas. textoPlano() NO recorta los bordes, para poder aplicarla
    // carácter por carácter sin que un espacio del medio desaparezca (lo usa
    // tramoCoincidencia); normalizarBusqueda() es esa misma, recortada, que es
    // lo que hace falta para comparar. Una sola regla, en un solo lugar: dos
    // normalizaciones conviviendo es exactamente cómo alguien usa la
    // equivocada.
    function textoPlano(t) {
      return String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    }

    function normalizarBusqueda(t) {
      return textoPlano(t).trim()
    }

    // Un producto es de chocolate por su TIPO DE MASA, que es el mismo dato con
    // el que la sala elige la receta. No se adivina por el nombre.
    function esProductoChocolate(p) {
      return normalizarBusqueda(p?.tipo_masa).includes('chocolate')
    }

    // Los comunes arriba y los de chocolate abajo, separados: es como se piden
    // en la fábrica, y es lo que evita tocar "Mini" cuando se quería "Mini
    // chocolate".
    function productosPorMasa(cat) {
      const todos = cat?.productos ?? []
      return { comunes: todos.filter(p => !esProductoChocolate(p)), chocolate: todos.filter(p => esProductoChocolate(p)) }
    }

    // Genérica: la usan también las listas de Configuración (conos e
    // insumos), que tienen sus propios criterios. No filtra estados.
    function marcasFiltradas(marcas, texto) {
      const q = normalizarBusqueda(texto)
      if (!q) return marcas ?? []
      return (marcas ?? []).filter(m => normalizarBusqueda(m.nombre).includes(q))
    }

    // "9:5" no es una hora; "9:05" sí y se guarda como "09:05". Lo que no sea
    // una hora del día devuelve '' y no se manda.
    function normalizarHora(t) {
      const m = /^\s*(\d{1,2})\s*[:.]?\s*(\d{2})\s*$/.exec(String(t ?? ''))
      if (!m) return ''
      const h = Number(m[1]), min = Number(m[2])
      if (h > 23 || min > 59) return ''
      return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`
    }

    // La hora de a 5 minutos, dando la vuelta en medianoche.
    function horaConPaso(hora, minutos) {
      const base = normalizarHora(hora)
      if (!base) return ''
      const total = ((Number(base.slice(0, 2)) * 60 + Number(base.slice(3)) + minutos) % 1440 + 1440) % 1440
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SALA DE MASA — cantidades y diferencias contra la receta
    // ═══════════════════════════════════════════════════════════════════════

    // Kilos con hasta 3 decimales, sin ruido de coma flotante.
    function redondearKg(n) {
      return Math.round(n * 1000) / 1000
    }

    // Diferencia contra la original, en gramos, solo los que cambian.
    function diferencias(cantidades, original) {
      const out = []
      for (const it of original.items) {
        const g = Math.round(((cantidades[it.ingrediente_id] ?? 0) - Number(it.cantidad_kg)) * 1000)
        if (g !== 0) out.push({ ingrediente_id: it.ingrediente_id, nombre: it.ingrediente, gramos: g })
      }
      return out
    }

    function textoGramos(g) {
      return `${g > 0 ? '+' : '−'}${formatearNumeroAr(Math.abs(g), { decimales: 0 })} g`
    }

    function textoDiferencias(difs, max = Infinity) {
      if (!difs.length) return 'Igual a la original'
      const partes = difs.slice(0, max).map(d => `${textoGramos(d.gramos)} ${d.nombre}`)
      return partes.join(' · ') + (difs.length > max ? ' · …' : '')
    }

    function textoKg(kg) {
      return `${formatearNumeroAr(kg, { decimales: 3, minimos: 0 })} kg`
    }

    // La diferencia de una masa YA REGISTRADA contra SU receta (la versión con
    // la que se hizo, no la vigente de hoy). La usa el detalle del turno en el
    // historial.
    function diferenciaDeMasa(masa, datos) {
      const nombres = new Map(datos.ingredientes.map(i => [i.id, i.nombre]))
      const original = {
        items: datos.recItems.filter(r => r.receta_id === masa.receta_id)
          .map(r => ({ ingrediente_id: r.ingrediente_id, ingrediente: nombres.get(r.ingrediente_id) ?? 'ingrediente', cantidad_kg: r.cantidad_kg })),
      }
      const cantidades = {}
      for (const it of datos.items.filter(x => x.masa_id === masa.id)) cantidades[it.ingrediente_id] = Number(it.cantidad_simple_kg)
      return diferencias(cantidades, original)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CONFIGURACIÓN (produccion:configurar), por unidad
    // ═══════════════════════════════════════════════════════════════════════

    const PESTANAS_CONFIG = [
      ['maquinas', 'Máquinas'], ['recetas', 'Recetas'], ['ingredientes', 'Ingredientes'],
      ['productos', 'Productos'], ['empaque', 'Empaque'], ['marcas', 'Marcas / Conos'], ['personal', 'Personal'],
    ]
    const PUESTOS = [['encargado', 'Encargado'], ['masero', 'Masero'], ['operario', 'Operario']]
    const CLAVE_AVISO_PRODUCTOS = 'produccion.aviso-productos-revisado'

    // A dónde vuelve "‹ Volver" desde Configuración, Historial o Stock: al
    // inicio de la gestión. La tablet vive en produccion.html.
    function volverDeOficina() {
      mostrarInicioOficina()
    }

    // El inicio de la gestión: los accesos a lo que esta cuenta puede ver.
    function mostrarInicioOficina() {
      document.getElementById('pr-inicio-texto').textContent = 'La carga de turnos, masas y lo producido se hace en la tablet de la planta.'
      pintarAccesosOficina()
      mostrarVista('pr-inicio')
    }

    const puedeVerHistorial = () => tieneTarea('ver') || tieneTarea('configurar')

    // ── La burbuja de conos por revisar (la misma cifra del dashboard) ────
    //
    // Sale de mis_pendientes() —('produccion', 'conos_por_revisar')—, que ya
    // filtra por produccion:configurar. Se pide al abrir y al volver a la
    // pestaña, con un turno para que una respuesta vieja no pise la nueva.
    // Si la llamada falla, o da 0, no se dibuja nada: nunca un número viejo
    // ni inventado. `estado.conosPendientes`: un entero > 0, o null.
    let turnoBurbujaConos = 0

    async function cargarBurbujaConos() {
      const turno = ++turnoBurbujaConos
      if (!tieneTarea('configurar')) {
        estado.conosPendientes = null
        return pintarBurbujaConos()
      }
      let n = null
      try {
        const { data, error } = await supabase.rpc('mis_pendientes')
        if (error) throw error
        const fila = (data ?? []).find(f => f?.modulo === 'produccion' && f?.clave === 'conos_por_revisar')
        const c = fila && fila.cantidad !== null && fila.cantidad !== '' ? Number(fila.cantidad) : NaN
        n = Number.isInteger(c) && c > 0 ? c : null
      } catch (err) {
        console.error('conos por revisar:', err)
        n = null
      }
      if (turno !== turnoBurbujaConos) return
      estado.conosPendientes = n
      pintarBurbujaConos()
    }

    function textoConosPendientes(n) {
      return `${n} ${n === 1 ? 'cono nuevo por revisar' : 'conos nuevos por revisar'}`
    }

    // El contenido del botón: "Configuración" y, si hay, la burbuja.
    function htmlBotonConfig(n) {
      if (!(Number.isInteger(n) && n > 0)) return 'Configuración'
      const texto = textoConosPendientes(n)
      return `Configuración<span class="pr-burbuja" title="${esc(texto)}" aria-label="${esc(texto)}">${esc(n > 99 ? '99+' : n)}</span>`
    }

    function pintarBurbujaConos() {
      const n = tieneTarea('configurar') ? estado.conosPendientes : null
      for (const id of ['pr-btn-ir-config', 'pr-menu-config']) {
        const b = document.getElementById(id)
        if (!b) continue
        b.innerHTML = htmlBotonConfig(n)
        if (Number.isInteger(n) && n > 0) b.setAttribute('aria-label', `Configuración: ${textoConosPendientes(n)}`)
        else b.removeAttribute('aria-label')
      }
    }

    // Tocar un acceso a Configuración: con conos por revisar, derecho a la
    // pestaña donde se aceptan o se rechazan.
    function abrirConfigDesdeAcceso() {
      return mostrarConfig(estado.conosPendientes > 0 ? 'marcas' : undefined)
    }

    function pintarAccesosOficina() {
      document.getElementById('pr-btn-ir-config').hidden = !tieneTarea('configurar')
      document.getElementById('pr-btn-ir-historial').hidden = !puedeVerHistorial()
      document.getElementById('pr-btn-ir-stock').hidden = !puedeVerHistorial()
      document.getElementById('pr-menu-config').hidden = !tieneTarea('configurar')
      document.getElementById('pr-menu-historial').hidden = !puedeVerHistorial()
      document.getElementById('pr-menu-stock').hidden = !puedeVerHistorial()
    }

    function unidadesDeConfig() {
      return unidadesCon('configurar')
    }

    function pintarSelectorUnidad(selectId, unidades, elegida) {
      const sel = document.getElementById(selectId)
      sel.innerHTML = unidades.map(id => `<option value="${esc(id)}"${id === elegida ? ' selected' : ''}>${esc(estado.unidades.get(id) ?? id)}</option>`).join('')
      sel.value = elegida ?? ''
      sel.closest?.('.pr-campo')?.toggleAttribute?.('hidden', unidades.length < 2)
    }

    // `tabPedida`: la pestaña con la que abre. La usan los accesos con la
    // burbuja de conos por revisar, que abren derecho en "Marcas / Conos".
    async function mostrarConfig(tabPedida) {
      const unidades = unidadesDeConfig()
      if (!unidades.length) return
      const actual = estado.config?.unidadId
      const tab = PESTANAS_CONFIG.some(([k]) => k === tabPedida) ? tabPedida : (estado.config?.tab ?? 'maquinas')
      estado.config = {
        unidadId: unidades.includes(actual) ? actual : (unidades.includes(estado.unidadId) ? estado.unidadId : unidades[0]),
        tab,
        busqueda: '', datos: null, recetaMaquina: null, recetaTipo: null,
        // Lo que se tocó en Personal y todavía no se guardó: id → puestos.
        cambios: new Map(),
        error: null,          // { texto, donde } — el error vive en el ESTADO
        pendientes: null,     // conos por revisar; null = no se pudo contar
        hoja: null,           // los PINes recién generados, SOLO en memoria
        salida: null,         // a dónde se quería ir con cambios sin guardar
        pinPara: null, temporal: null, guardando: false,
      }
      pintarSelectorUnidad('pr-config-unidad', unidades, estado.config.unidadId)
      mostrarVista('pr-config')
      await cargarPestanaConfig()
    }

    // El contador de conos por revisar de la pestaña "Marcas / Conos". Va como
    // número o como null: un contador inventado es peor que ninguno.
    function htmlPestanasConfig(tab, pendientes) {
      return PESTANAS_CONFIG.map(([claveTab, tituloTab]) => {
        const chapa = claveTab === 'marcas' && pendientes > 0 ? ` <span class="pr-cfg-tab__pend">${esc(pendientes)}</span>` : ''
        return `<button type="button" class="pr-cfg-tab${claveTab === tab ? ' pr-cfg-tab--activa' : ''}" data-config-tab="${claveTab}" aria-pressed="${claveTab === tab ? 'true' : 'false'}">${tituloTab}${chapa}</button>`
      }).join('')
    }

    // EL ERROR VA AL ESTADO, NO AL DOM: el catch guarda el mensaje y el único
    // que escribe en el DOM es el render, que lo dibuja PEGADO a su botón.
    // `donde` es el id de ese botón, y ahí va también el foco.
    function errorConfig(texto, donde = null) {
      const c = estado.config
      const habia = !!c?.error
      if (c) c.error = texto ? { texto: String(texto), donde } : null
      // Sin pestaña dibujada (falló la lectura) no hay botón al que pegarlo.
      const suelto = !!texto && !c?.datos
      const arriba = document.getElementById('pr-config-error')
      arriba.textContent = suelto ? texto : ''
      arriba.hidden = !suelto
      if (c?.datos && (texto || habia)) pintarPestanaConfig()
      if (texto && donde) document.getElementById(donde)?.focus?.()
    }

    // El error de ESTE botón, justo al lado del botón. Nunca arriba de todo.
    function htmlErrorPegado(c, donde) {
      return c?.error && c.error.donde === donde ? `<div class="pr-cfg-error" role="alert">${esc(c.error.texto)}</div>` : ''
    }

    // Los conos pendientes de revisar: una consulta chica que corre en cada
    // pestaña, para que el contador esté al día sin importar dónde se esté.
    // Devuelve null si no se pudo contar, y nunca tira: que falle el contador
    // no puede voltear la pestaña que la persona vino a mirar.
    async function contarPendientesMarcas() {
      try {
        const { data, error } = await supabase.from('marcas_personalizadas').select('id').eq('estado_alta', 'pendiente_revision')
        if (error) return null
        return (data ?? []).length
      } catch { return null }
    }

    async function cargarPestanaConfig() {
      const c = estado.config
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.innerHTML = '<p class="pr-texto-suave">Cargando…</p>'
      c.error = null
      document.getElementById('pr-config-error').hidden = true
      try {
        c.datos = await LECTORES_CONFIG[c.tab](c)
      } catch (err) {
        console.error('configuración:', err)
        c.datos = null
        document.getElementById('pr-config-tabs').innerHTML = htmlPestanasConfig(c.tab, c.pendientes)
        cuerpo.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo leer la configuración. Revisá la conexión.</div>'
        return
      }
      c.pendientes = await contarPendientesMarcas()
      pintarPestanaConfig()
    }

    function pintarPestanaConfig() {
      const c = estado.config
      document.getElementById('pr-config-tabs').innerHTML = htmlPestanasConfig(c.tab, c.pendientes)
      const cuerpo = document.getElementById('pr-config-cuerpo')
      cuerpo.innerHTML = c.salida ? htmlSalirSinGuardar(c) : RENDERS_CONFIG[c.tab](c)
      // Los números se escriben con ponerNumero, nunca con value=.
      for (const input of cuerpo.querySelectorAll('[data-numero]')) {
        enlazarCampoNumero(input, { decimales: Number(input.dataset.decimales ?? 3) })
        ponerNumero(input, input.dataset.numero === '' ? null : Number(input.dataset.numero))
      }
    }
