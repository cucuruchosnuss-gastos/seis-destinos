        `<button type="button" class="tl-btn tl-btn--primario" data-accion="venta-confirmar" id="tl-venta-confirmar"${m.enviando ? ' disabled' : ''}>${esc(textoConfirmar(m, r))}</button></div></div>`
    }

    function htmlModalHoras(m, personas) {
      const opciones = (personas || []).map(x => `<option value="${esc(x.id)}"${x.id === m.personaId ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')
      return '<div class="tl-ventana tl-ventana--angosta" role="dialog" aria-modal="true" aria-labelledby="tl-modal-titulo">' +
        `<div><h2 class="tl-ventana__titulo" id="tl-modal-titulo">Cargar horas</h2><p class="tl-ventana__sub">${esc(m.proyecto || '')}</p></div>` +
        '<div class="tl-fila-campos">' +
        '<div class="tl-campo"><label for="tl-horas-persona">¿Quién trabajó?</label><select id="tl-horas-persona">' + opciones + '</select></div>' +
        `<div class="tl-campo"><label for="tl-horas-fecha">Día</label><input type="date" class="tl-input" id="tl-horas-fecha" max="${esc(hoyArgentina())}" value="${esc(m.fecha || '')}"></div></div>` +
        '<div class="tl-fila-campos"><div class="tl-campo"><label for="tl-horas-cantidad">Horas</label><input type="text" class="tl-input" id="tl-horas-cantidad" autocomplete="off"></div>' +
        `<div class="tl-campo"><label for="tl-horas-tarea">¿Para qué?</label><input type="text" class="tl-input" id="tl-horas-tarea" maxlength="200" autocomplete="off" value="${esc(m.tarea || '')}" placeholder="Armado del tablero, soldadura…"></div></div>` +
        (m.error ? `<p class="tl-error-pegado">${esc(m.error)}</p>` : '') +
        '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="modal-cerrar">Cancelar</button>' +
        `<button type="button" class="tl-btn tl-btn--primario" data-accion="horas-guardar"${m.enviando ? ' disabled' : ''}>Guardar las horas</button></div></div>`
    }

    function htmlModalAnular(m) {
      return '<div class="tl-ventana tl-ventana--angosta" role="dialog" aria-modal="true" aria-labelledby="tl-modal-titulo">' +
        '<h2 class="tl-ventana__titulo" id="tl-modal-titulo">¿Anular estas horas?</h2>' +
        `<p class="tl-texto-suave">${esc(m.texto || '')}. Dejan de sumar al costo del proyecto.</p>` +
        (m.error ? `<p class="tl-error-pegado">${esc(m.error)}</p>` : '') +
        '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="modal-cerrar">Cancelar</button>' +
        `<button type="button" class="tl-btn tl-btn--peligro" data-accion="anular-horas-confirmar"${m.enviando ? ' disabled' : ''}>Anular las horas</button></div></div>`
    }

    // Lo que falta para cargar horas (lo mismo que pide la base).
    function faltaHoras(p) {
      if (!p.personaId) return 'Elegí quién trabajó.'
      if (p.horas === null || p.horas === undefined || !(p.horas > 0)) return 'Poné las horas.'
      if (p.horas > 24) return 'Las horas van de 0 a 24.'
      if (!p.fecha) return 'Poné el día.'
      if (p.fecha > hoyArgentina()) return 'No se pueden cargar horas a futuro.'
      return null
    }

    function htmlModal(m) {
      if (!m) return ''
      const r = estado.ficha?.r
      if ((m.tipo === 'facturar' || m.tipo === 'fabrica') && r) return htmlModalVenta(m, r)
      if (m.tipo === 'horas') return htmlModalHoras(m, estado.personas)
      if (m.tipo === 'anular-horas') return htmlModalAnular(m)
      if (m.tipo === 'horas-tarea') return htmlModalHorasTarea(m)
      if (m.tipo === 'avance') return htmlModalAvance(m)
      return ''
    }

    let focoAntesDelModal = null
    function pintarModal() {
      const velo = document.getElementById('tl-modal')
      const m = estado.modal
      if (!m) { velo.hidden = true; velo.innerHTML = ''; return }
      velo.innerHTML = htmlModal(m)
      velo.hidden = false
      const imp = document.getElementById('tl-venta-importe')
      if (imp) { enlazarCampoNumero(imp, { decimales: 2 }); if (m.importe != null) ponerNumero(imp, m.importe) }
      const hs = document.getElementById('tl-horas-cantidad') || document.getElementById('tl-mia-horas')
      if (hs) { enlazarCampoNumero(hs, { decimales: 2, max: 24 }); if (m.horas != null) ponerNumero(hs, m.horas) }
      const av = document.getElementById('tl-mia-avance')
      if (av) { enlazarCampoNumero(av, { decimales: 0, max: 100 }); if (m.avance != null) ponerNumero(av, m.avance) }
      velo.querySelector('input:not([type="date"]), select, textarea')?.focus?.()
    }
    function abrirModal(m) {
      if (!estado.modal) focoAntesDelModal = document.activeElement
      estado.modal = m
      pintarModal()
    }
    function cerrarModal() {
      estado.modal = null
      pintarModal()
      focoAntesDelModal?.focus?.()
      focoAntesDelModal = null
    }

    // Guarda lo tipeado en la ventana abierta antes de redibujar o mandar.
    function leerModal() {
      const m = estado.modal
      if (!m) return
      const val = id => document.getElementById(id)
      if (m.tipo === 'facturar' || m.tipo === 'fabrica') {
        if (val('tl-venta-importe')) m.importe = leerCampoNumero(val('tl-venta-importe'))
        if (val('tl-venta-concepto')) m.concepto = val('tl-venta-concepto').value
      }
      if (m.tipo === 'horas') {
        if (val('tl-horas-cantidad')) m.horas = leerCampoNumero(val('tl-horas-cantidad'))
        if (val('tl-horas-persona')) m.personaId = val('tl-horas-persona').value
        if (val('tl-horas-fecha')) m.fecha = val('tl-horas-fecha').value
        if (val('tl-horas-tarea')) m.tarea = val('tl-horas-tarea').value
      }
      if (m.tipo === 'horas-tarea') {
        if (val('tl-mia-horas')) m.horas = leerCampoNumero(val('tl-mia-horas'))
        if (val('tl-mia-fecha')) m.fecha = val('tl-mia-fecha').value
        if (val('tl-mia-nota')) m.nota = val('tl-mia-nota').value
      }
      if (m.tipo === 'avance' && val('tl-mia-avance')) m.avance = leerCampoNumero(val('tl-mia-avance'))
    }

    // Actualiza la caja de "pasa de … a …", la pista y el botón mientras se
    // escribe el importe, sin redibujar la ventana (no se pierde el foco).
    function refrescarVenta() {
      const m = estado.modal, r = estado.ficha?.r
      if (!m || !r || (m.tipo !== 'facturar' && m.tipo !== 'fabrica')) return
      leerModal()
      const res = resumenVenta(m, r)
      const caja = document.getElementById('tl-venta-resumen')
      if (caja) caja.innerHTML = `<p class="tl-aviso__titulo">${esc(res.linea1)}</p><p class="tl-aviso__texto">${esc(res.linea2)}</p>`
      const pista = document.getElementById('tl-venta-pista')
      if (pista) pista.textContent = pistaImporte(m, r)
      const boton = document.getElementById('tl-venta-confirmar')
      if (boton) boton.textContent = textoConfirmar(m, r)
    }

    function abrirModalVenta(tipo) {
      const r = estado.ficha?.r
      if (!r || !puedePrecios()) return
      const falta = resumenVenta({ tipo, importe: null }, r).falta
      if (tipo === 'fabrica') {
        abrirModal({ tipo, importe: falta !== null && falta > 0 ? falta : null, concepto: '', error: null, enviando: false })
        return
      }
      const clase = (numero(r.facturado) ?? 0) > 0 ? 'avance' : 'anticipo'
      abrirModal({ tipo, clase, importe: null, concepto: clase === 'avance' ? 'Avance' : 'Anticipo', error: null, enviando: false })
    }
    function elegirTipoFactura(clase) {
      const m = estado.modal, r = estado.ficha?.r
      if (!m || !r) return
      leerModal()
      const etiquetas = Object.fromEntries(TIPOS_FACTURA)
      // El concepto cambia solo si todavía es el del tipo anterior (no se
      // pisa lo que la persona escribió).
      if (!limpio(m.concepto) || Object.values(etiquetas).includes(limpio(m.concepto))) m.concepto = etiquetas[clase]
      m.clase = clase
      if (clase === 'saldo') {
        const falta = resumenVenta({ ...m, importe: null }, r).falta
        if (falta !== null && falta > 0) m.importe = falta
      }
      pintarModal()
    }

    function abrirModalHoras() {
      const f = estado.ficha
      if (!f?.r || !puedeCargar()) return
      abrirModal({ tipo: 'horas', proyecto: f.r.nombre, personaId: estado.miEmpleadoId, fecha: hoyArgentina(), horas: null, tarea: '', error: null, enviando: false })
      asegurarPersonas().then(() => { if (estado.modal?.tipo === 'horas') { leerModal(); pintarModal() } })
    }

    async function accionModal(accion) {
      const m = estado.modal
      if (!m) return
      leerModal()
      if (accion === 'modal-cerrar') { cerrarModal(); return }
      const f = estado.ficha
      if (accion === 'venta-confirmar') {
        if (m.enviando || !puedePrecios() || !f) return
        const falta = faltaVenta(m)
        if (falta) { m.error = falta; pintarModal(); return }
        m.enviando = true; m.error = null; pintarModal()
        const rpc = m.tipo === 'facturar' ? 'facturar_proyecto' : 'cargar_proyecto_a_fabrica'
        const { error } = await supabase.rpc(rpc, { p_proyecto_id: f.id, p_importe: m.importe, p_concepto: limpio(m.concepto), p_fecha: hoyArgentina() })
        m.enviando = false
        if (error) { m.error = error.message || 'No se pudo guardar.'; pintarModal(); return }
        cerrarModal()
        estado.resumenes.delete(f.id)
        mostrarExito(m.tipo === 'facturar' ? 'Facturado. Quedó en la cuenta del cliente.' : 'Cargado a la fábrica.')
        cargarFicha(); return
      }
      if (accion === 'horas-guardar') {
        if (m.enviando || !f) return
        const falta = faltaHoras(m)
        if (falta) { m.error = falta; pintarModal(); return }
        m.enviando = true; m.error = null; pintarModal()
        const { error } = await supabase.rpc('cargar_horas_proyecto', {
          p_proyecto_id: f.id, p_empleado_id: m.personaId, p_fecha: m.fecha, p_horas: m.horas, p_tarea: limpio(m.tarea) || null,
        })
        m.enviando = false
        if (error) { m.error = error.message || 'No se pudo guardar.'; pintarModal(); return }
        cerrarModal()
        mostrarExito('Horas cargadas.')
        cargarFicha(); return
      }
      if (accion === 'anular-horas-confirmar') {
        if (m.enviando || !f) return
        m.enviando = true; pintarModal()
        const { error } = await supabase.rpc('anular_horas_proyecto', { p_horas_id: m.horasId })
        m.enviando = false
        if (error) { m.error = error.message || 'No se pudo anular.'; pintarModal(); return }
        cerrarModal()
        mostrarExito('Horas anuladas.')
        cargarFicha(); return
      }
      if (accion === 'mia-horas-guardar') { await guardarHorasTarea(); return }
      if (accion === 'mia-avance-guardar') { await guardarAvanceTarea(); return }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PERSONAS Y CLIENTES
    // ═══════════════════════════════════════════════════════════════════════

    // Las personas que pueden cargar horas o ser responsables: activas, sin
    // las cuentas de las tablets (tipo 'sistema'), sin la Empresa y sin la
    // fábrica de pruebas. Una vista sin security_invoker (v_empleados_publico).
    function personasElegibles(filas, fabrica = estado.fabrica) {
      const reales = (filas || []).filter(p => p && p.activo !== false && p.tipo !== 'sistema' && p.tipo !== 'empresa')
      return sinPersonasDePrueba(reales, fabrica).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'))
    }
    let promesaPersonas = null
    async function asegurarPersonas() {
      if (estado.personas) return estado.personas
      if (!promesaPersonas) {
        promesaPersonas = (async () => {
          const { data, error } = await supabase.from('v_empleados_publico').select('id, nombre, unidad_negocio_id, tipo, activo')
          if (error) { console.error('personas:', error); estado.personas = []; promesaPersonas = null; return [] }
          // Los nombres quedan COMPLETOS (también bajas y tablets): resolver
          // "lo cambió" o el autor de un archivo no le ofrece a nadie.
          estado.nombres = new Map((data || []).map(p => [p.id, p.nombre]))
          estado.personas = personasElegibles(data)
          return estado.personas
        })()
      }
      return promesaPersonas
    }
    // La gente del Taller (los renglones del diagrama y "¿Quién la hace?").
    function personasDelTaller(personas = estado.personas, tallerId = estado.tallerId) {
      return (personas || []).filter(p => !tallerId || p.unidad_negocio_id === tallerId)
    }

    async function cargarClientes() {
      estado.errorClientes = null
      if (!estado.tallerId) { estado.clientes = []; estado.errorClientes = 'No se encontró la unidad Taller.'; return }
      const { data, error } = await supabase.from('clientes').select('id, nombre, razon_social, activo')
        .eq('unidad_negocio_id', estado.tallerId).order('nombre')
      if (error) { estado.clientes = []; estado.errorClientes = 'No se pudieron leer los clientes del Taller: ' + (error.message || 'error desconocido'); return }
      estado.clientes = (data || [])
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL EDITOR (nuevo y editar)
    // ═══════════════════════════════════════════════════════════════════════

    // Las fábricas que pueden recibir un trabajo interno: todas menos el
    // Taller y la de pruebas (para una cuenta real).
    function fabricasDestino() {
      const todas = [...estado.unidades.values()].filter(u => u.id !== estado.tallerId)
      return sinUnidadesDePrueba(todas, estado.fabrica)
    }

    // Lo que tiene el proyecto hoy, en la forma del editor.
    function originalDe(r) {
      if (!r) return { nombre: '', destino: 'externo', cliente_id: '', unidad_destino_id: '', categoria: '', estado: 'presupuestado',
        responsable_id: '', fecha_inicio: '', fecha_entrega_prometida: '', fecha_entrega_real: '', presupuesto_costo: null,
        horas_estimadas: null, moneda: 'ARS', precio_venta: null, ubicacion: '', descripcion: '', observaciones: '' }
      const fab = [...estado.unidades.values()].find(u => u.nombre === r.fabrica_destino)
      const resp = (estado.personas || []).find(p => p.nombre === r.responsable)
      return {
        nombre: r.nombre || '', destino: r.destino || 'externo', cliente_id: r.cliente?.id || '',
        unidad_destino_id: fab?.id || '', categoria: r.categoria || '', estado: r.estado || 'presupuestado',
        // El resumen da el nombre del responsable, no su id: si no se encuentra,
        // queda '' y no se manda (solo va lo que cambia).
        responsable_id: resp?.id || '',
        fecha_inicio: r.fecha_inicio || '', fecha_entrega_prometida: r.fecha_entrega_prometida || '', fecha_entrega_real: r.fecha_entrega_real || '',
        presupuesto_costo: numero(r.presupuesto_costo), horas_estimadas: numero(r.horas_estimadas), moneda: r.moneda || 'ARS',
        precio_venta: numero(r.precio_venta), ubicacion: r.ubicacion || '', descripcion: r.descripcion || '', observaciones: r.observaciones || '',
      }
    }

    // SOLO las claves que cambiaron (guardar_proyecto: una clave presente
    // con "" borra). precio_venta solo con permiso. En un proyecto nuevo, lo
    // que no está vacío.
    function datosCambiados(original, actual, { nuevo = false, precios = false } = {}) {
      const claves = ['nombre', 'destino', 'cliente_id', 'unidad_destino_id', 'categoria', 'estado', 'responsable_id',
        'fecha_inicio', 'fecha_entrega_prometida', 'fecha_entrega_real', 'presupuesto_costo', 'horas_estimadas', 'moneda',
        'ubicacion', 'descripcion', 'observaciones']
      if (precios) claves.push('precio_venta')
      const out = {}
      const norm = v => (v === null || v === undefined) ? '' : String(v)
      for (const k of claves) {
        const a = actual[k], o = original[k]
        if (nuevo ? norm(a) === '' : norm(a) === norm(o)) continue
        out[k] = (a === null || a === undefined) ? '' : a
      }
      // Un trabajo interno no lleva cliente y uno externo no lleva fábrica.
      if (actual.destino === 'interno' && original.cliente_id && !('cliente_id' in out)) out.cliente_id = ''
      if (actual.destino === 'externo' && original.unidad_destino_id && !('unidad_destino_id' in out)) out.unidad_destino_id = ''
      return out
    }

    function opcionesSelect(lista, valor, vacio) {
      return (vacio != null ? `<option value="">${esc(vacio)}</option>` : '') +
        lista.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(valor ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('')
    }

    function pintarDestinoEditor() {
      const d = estado.editor.destino
      document.querySelectorAll('#tl-ed-destino [data-destino]').forEach(b => b.setAttribute('aria-pressed', b.dataset.destino === d ? 'true' : 'false'))
      document.getElementById('tl-ed-bloque-cliente').hidden = d !== 'externo'
      document.getElementById('tl-ed-bloque-fabrica').hidden = d !== 'interno'
    }

    function pintarClientesEditor(valor) {
      const sel = document.getElementById('tl-ed-cliente')
      const activos = (estado.clientes || []).filter(c => c.activo !== false || c.id === valor)
      sel.innerHTML = opcionesSelect(activos.map(c => [c.id, c.nombre + (c.razon_social && c.razon_social !== c.nombre ? ` (${c.razon_social})` : '')]), valor, 'Sin elegir')
      const err = document.getElementById('tl-ed-clientes-error')
      err.textContent = estado.errorClientes || ''
      err.hidden = !estado.errorClientes
    }

    async function abrirEditor(r = null) {
      if (!puedeGestionar()) return
      await Promise.all([asegurarPersonas(), estado.clientes ? null : cargarClientes()])
      const original = originalDe(r)
      estado.editor = { id: r?.id || null, original, destino: original.destino, guardando: false }
      mostrarVista('tl-vista-editor', r ? 'Editar' : 'Nuevo')
      document.getElementById('tl-editor-titulo').textContent = r ? 'Editar el proyecto' : 'Proyecto nuevo'
      document.getElementById('tl-ed-nombre').value = original.nombre
      pintarDestinoEditor()
      pintarClientesEditor(original.cliente_id)
      document.getElementById('tl-ed-fabrica').innerHTML = opcionesSelect(fabricasDestino().map(u => [u.id, u.nombre]), original.unidad_destino_id, 'Sin elegir')
      document.getElementById('tl-ed-categoria').innerHTML = opcionesSelect(CATEGORIAS, original.categoria, 'Sin categoría')
      document.getElementById('tl-ed-estado').innerHTML = opcionesSelect(ESTADOS, original.estado, null)
      document.getElementById('tl-ed-responsable').innerHTML = opcionesSelect((estado.personas || []).map(p => [p.id, p.nombre]), original.responsable_id, 'Sin elegir')
      document.getElementById('tl-ed-inicio').value = original.fecha_inicio
      document.getElementById('tl-ed-entrega').value = original.fecha_entrega_prometida
      document.getElementById('tl-ed-entrega-real').value = original.fecha_entrega_real
      ponerNumero(document.getElementById('tl-ed-presupuesto'), original.presupuesto_costo)
      ponerNumero(document.getElementById('tl-ed-horas'), original.horas_estimadas)
      document.getElementById('tl-ed-moneda').value = original.moneda
      document.getElementById('tl-ed-ubicacion').value = original.ubicacion
      document.getElementById('tl-ed-descripcion').value = original.descripcion
      document.getElementById('tl-ed-observaciones').value = original.observaciones
      // El precio de venta: el campo existe SOLO con permiso.
      const slot = document.getElementById('tl-ed-slot-precio')
      slot.innerHTML = puedePrecios()
        ? '<div class="tl-campo"><label for="tl-ed-venta">Precio de venta</label><input type="text" class="tl-input" id="tl-ed-venta" autocomplete="off">' +
          '<span class="tl-campo__ayuda">Lo que se le cobra al cliente o a la fábrica.</span></div>'
        : ''
      const venta = document.getElementById('tl-ed-venta')
      if (venta) { enlazarCampoNumero(venta, { decimales: 2 }); ponerNumero(venta, original.precio_venta) }
      document.getElementById('tl-ed-cliente-form').hidden = true
      mostrarErrorEditor(null)
    }

    function leerEditor() {
      const venta = document.getElementById('tl-ed-venta')
      return {
        nombre: limpio(document.getElementById('tl-ed-nombre').value),
        destino: estado.editor.destino,
        cliente_id: estado.editor.destino === 'externo' ? document.getElementById('tl-ed-cliente').value : '',
        unidad_destino_id: estado.editor.destino === 'interno' ? document.getElementById('tl-ed-fabrica').value : '',
        categoria: document.getElementById('tl-ed-categoria').value,
        estado: document.getElementById('tl-ed-estado').value,
        responsable_id: document.getElementById('tl-ed-responsable').value,
        fecha_inicio: document.getElementById('tl-ed-inicio').value,
        fecha_entrega_prometida: document.getElementById('tl-ed-entrega').value,
        fecha_entrega_real: document.getElementById('tl-ed-entrega-real').value,
        presupuesto_costo: leerCampoNumero(document.getElementById('tl-ed-presupuesto')),
        horas_estimadas: leerCampoNumero(document.getElementById('tl-ed-horas')),
        moneda: document.getElementById('tl-ed-moneda').value,
        precio_venta: venta ? leerCampoNumero(venta) : null,
        ubicacion: limpio(document.getElementById('tl-ed-ubicacion').value),
        descripcion: String(document.getElementById('tl-ed-descripcion').value || '').trim(),
        observaciones: String(document.getElementById('tl-ed-observaciones').value || '').trim(),
      }
    }

    function faltaEditor(a) {
      if (a.nombre.length < 2) return 'Poné el nombre del proyecto.'
      if (a.fecha_entrega_real && a.fecha_inicio && a.fecha_entrega_real < a.fecha_inicio) return 'La entrega real no puede ser anterior al inicio.'
      return null
    }

    function mostrarErrorEditor(texto) {
      const el = document.getElementById('tl-ed-error')
      el.textContent = texto || ''
      el.hidden = !texto
    }

    async function guardarEditor() {
      const ed = estado.editor
      if (!ed || ed.guardando) return
      const actual = leerEditor()
      const falta = faltaEditor(actual)
      if (falta) { mostrarErrorEditor(falta); return }
      const datos = datosCambiados(ed.original, actual, { nuevo: !ed.id, precios: puedePrecios() })
      if (ed.id && !Object.keys(datos).length) { mostrarErrorEditor(null); abrirFicha(ed.id); return }
      ed.guardando = true
      const boton = document.getElementById('tl-ed-guardar')
      boton.disabled = true
      const { data, error } = await supabase.rpc('guardar_proyecto', { p_id: ed.id, p_datos: datos })
      ed.guardando = false
      boton.disabled = false
      if (error) { mostrarErrorEditor(error.message || 'No se pudo guardar.'); return }
      mostrarExito(ed.id ? 'Proyecto guardado.' : 'Proyecto creado.')
      estado.resumenes.delete(ed.id || data)
      estado.proyectos = null
      abrirFicha(data || ed.id)
    }

    // El alta rápida de un cliente del Taller (guardar_cliente).
    async function guardarClienteRapido() {
      const nombre = limpio(document.getElementById('tl-ed-cliente-nombre').value)
      const err = document.getElementById('tl-ed-cliente-error')
      if (nombre.length < 2) { err.textContent = 'Poné el nombre del cliente.'; err.hidden = false; return }
      const boton = document.getElementById('tl-ed-cliente-guardar')
      boton.disabled = true
      const { data, error } = await supabase.rpc('guardar_cliente', {
        p_id: null, p_unidad_negocio_id: estado.tallerId, p_nombre: nombre, p_apodos: [],
        p_localidad: limpio(document.getElementById('tl-ed-cliente-localidad').value) || null,
        p_telefono: String(document.getElementById('tl-ed-cliente-telefono').value || '').trim() || null,
        p_observaciones: null, p_activo: true,
      })
      boton.disabled = false
      if (error) { err.textContent = error.message || 'No se pudo dar de alta el cliente.'; err.hidden = false; return }
      err.hidden = true
      await cargarClientes()
      pintarClientesEditor(data)
      document.getElementById('tl-ed-cliente').value = data
      document.getElementById('tl-ed-cliente-form').hidden = true
      mostrarExito('Cliente dado de alta.')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL VALOR DE LA HORA — lo ve todo el que ve el Taller; lo cambia quien
    // tiene taller:precios. Rige desde una fecha: lo cargado antes queda con
    // su valor.
    // ═══════════════════════════════════════════════════════════════════════

    // El que rige a una fecha: el de vigente_desde más nuevo que no la pase.
    function valorVigente(lista, fecha = hoyArgentina()) {
      return [...(lista || [])].filter(v => v.vigente_desde <= fecha).sort((a, b) => b.vigente_desde.localeCompare(a.vigente_desde))[0] ?? null
    }
    function textoNotaHora(desde) {
      return desde ? `Las horas cargadas antes del ${fechaDiaMes(desde)} siguen con su valor. Las nuevas toman el nuevo.` : ''
    }

    function htmlValorHora(vh, { precios = false, guardando = false, error = null, nombres = estado.nombres } = {}) {
      if (!vh) return '<p class="tl-texto-suave">Cargando…</p>'
      if (vh.error) return `<div class="tl-aviso tl-aviso--grave">No se pudo leer el valor de la hora: ${esc(vh.error)}</div>`
      const hoy = hoyArgentina()
      const vigente = valorVigente(vh.lista, hoy)
      let h = vigente
        ? `<div class="tl-grande"><span class="tl-grande__v">${esc(importe(vigente.valor))}</span><span class="tl-grande__rot">la hora · desde el ${esc(fechaCorta(vigente.vigente_desde))}</span></div>`
        : '<div class="tl-grande"><span class="tl-grande__v tl-grande__v--mal">sin valor de hora</span><span class="tl-grande__rot">Las horas cargadas no suman al costo hasta que se cargue uno.</span></div>'
      const lista = [...(vh.lista || [])].sort((a, b) => b.vigente_desde.localeCompare(a.vigente_desde))
      const filas = lista.map(v => {
        const fuerte = vigente && v.vigente_desde === vigente.vigente_desde
        const futuro = v.vigente_desde > hoy
        return `<span class="${fuerte ? 'tl-c-fuerte' : 'tl-c-2'}">${esc(fechaCorta(v.vigente_desde))}${futuro ? ' · más adelante' : ''}</span>` +
          `<span class="tl-c-der tl-c-fuerte">${esc(importe(v.valor))}</span><span class="tl-c-2">${esc(nombres.get(v.cargado_por) || '—')}</span>`
      })
      h += htmlTabla('minmax(0,1fr) 110px minmax(0,1fr)', [['Desde'], ['Valor', true], ['Lo cambió']], filas, '', 'Todavía no se cargó ningún valor.')
      if (precios) {
        h += '<div class="tl-fila-campos">' +
          '<div class="tl-campo"><label for="tl-hora-valor">Nuevo valor</label><input type="text" class="tl-input" id="tl-hora-valor" autocomplete="off"></div>' +
          `<div class="tl-campo"><label for="tl-hora-desde">Desde</label><input type="date" class="tl-input" id="tl-hora-desde" value="${esc(hoy)}"></div></div>` +
          `<p class="tl-texto-suave" id="tl-hora-nota">${esc(textoNotaHora(hoy))}</p>` +
          (error ? `<p class="tl-error-pegado">${esc(error)}</p>` : '')
      } else {
        h += '<p class="tl-texto-suave">El valor lo cambia quien tiene permiso de precios.</p>'
      }
      return h + (guardando ? '<p class="tl-texto-suave">Guardando…</p>' : '')
    }

    async function cargarValorHora() {
      const { data, error } = await supabase.from('taller_valor_hora').select('valor, vigente_desde, cargado_por, cargado_en').order('vigente_desde', { ascending: false })
      estado.valorHora = error ? { lista: [], error: error.message || 'error desconocido' } : { lista: data || [], error: null }
    }

    function pintarValorHora() {
      document.getElementById('tl-hora').innerHTML = htmlValorHora(estado.valorHora, {
        precios: puedePrecios(), guardando: estado.guardandoHora, error: estado.errorHora,
      })
      document.getElementById('tl-hora-slot-guardar').innerHTML = puedePrecios() && estado.valorHora && !estado.valorHora.error
        ? `<button type="button" class="tl-btn tl-btn--primario" id="tl-hora-guardar"${estado.guardandoHora ? ' disabled' : ''}>Guardar el valor nuevo</button>`
        : ''
      const v = document.getElementById('tl-hora-valor')
      if (v) enlazarCampoNumero(v, { decimales: 2 })
    }

    let focoAntesDeLaHora = null
    async function mostrarValorHora() {
      focoAntesDeLaHora = document.activeElement
      estado.errorHora = null
      document.getElementById('tl-vista-hora').hidden = false
      pintarValorHora()
      document.getElementById('tl-hora-volver').focus()
      await Promise.all([cargarValorHora(), asegurarPersonas()])
      if (!document.getElementById('tl-vista-hora').hidden) pintarValorHora()
    }
    function cerrarValorHora() {
      document.getElementById('tl-vista-hora').hidden = true
      focoAntesDeLaHora?.focus?.()
      focoAntesDeLaHora = null
    }

    async function guardarValorHora() {
      if (estado.guardandoHora || !puedePrecios()) return
      const valor = leerCampoNumero(document.getElementById('tl-hora-valor'))
      const desde = document.getElementById('tl-hora-desde').value
      if (valor === null || !(valor > 0)) { estado.errorHora = 'El valor de la hora tiene que ser mayor a cero.'; pintarValorHora(); return }
      if (!desde) { estado.errorHora = 'Poné desde qué fecha rige.'; pintarValorHora(); return }
      estado.guardandoHora = true
      estado.errorHora = null
      pintarValorHora()
      const { error } = await supabase.rpc('guardar_valor_hora', { p_valor: valor, p_vigente_desde: desde })
      estado.guardandoHora = false
      if (error) { estado.errorHora = error.message || 'No se pudo guardar.'; pintarValorHora(); return }
      mostrarExito('Valor de la hora guardado.')
      await cargarValorHora()
      pintarValorHora()
      estado.resumenes.clear()
      if (estado.vista === 'tl-vista-lista') pintarAccionesLista()
      if (estado.vista === 'tl-vista-ficha') cargarFicha()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EL DIAGRAMA DE ACTIVIDADES (Gantt)
    // Lo arma quien tiene taller:gestionar (crea, mueve, estira y edita).
    // Quien carga sin gestionar ve y marca SOLO lo suyo. No muestra plata.
    // Horas disponibles: lunes a sábado, 8 h por día.
    // ═══════════════════════════════════════════════════════════════════════

    const HORAS_DIA = 8
    const RANGOS = [['semana', '1 semana', 1], ['2semanas', '2 semanas', 2], ['mes', 'Mes', 4]]
    // La paleta cerrada de los proyectos (la del diseño y más tonos cálidos,
    // sin azules). La base no guarda un color: se elige por el id.
    const PALETA_PROYECTO = [
      [0.52, 0.13, 330], [0.62, 0.13, 70], [0.55, 0.11, 125], [0.58, 0.14, 0],
      [0.52, 0.14, 290], [0.56, 0.12, 35], [0.5, 0.09, 165], [0.64, 0.12, 95],
    ]
    function indiceColor(id) {
      const hex = String(id ?? '').replace(/[^0-9a-f]/gi, '').slice(-6)
      const n = parseInt(hex || '0', 16)
      return Number.isFinite(n) ? n % PALETA_PROYECTO.length : 0
    }
    function colorProyecto(id) {
      const [L, C, H] = PALETA_PROYECTO[indiceColor(id)]
      return {
        c: `oklch(${L} ${C} ${H})`,
        t: `oklch(0.955 ${Math.round(C * 250) / 1000} ${H})`,
        t2: `oklch(0.86 ${Math.round(C * 600) / 1000} ${H})`,
      }
    }

    function semanasDelRango(rango) {
      return (RANGOS.find(r => r[0] === rango) || RANGOS[1])[2]
    }
    // Los días que se ven: de lunes a sábado (sin domingos).
    function diasVisibles(desde, semanas) {
      const out = []
      for (let i = 0; i < semanas * 7; i++) {
        const d = sumarDias(desde, i)
        if (d && diaSemana(d) !== 0) out.push(d)
      }
      return out
    }
    function avanceDe(t) {
      return Math.max(0, Math.min(100, numero(t.avance_pct) ?? 0))
    }
    // El intervalo planeado (inicio + días corridos − 1).
    function intervaloTarea(t) {
      if (!t?.fecha_inicio) return null
      const dias = Math.max(1, numero(t.dias) ?? 1)
      return { ini: t.fecha_inicio, fin: t.fecha_fin_plan || sumarDias(t.fecha_inicio, dias - 1) }
    }
    function esAtrasada(t, hoy = hoyArgentina()) {
      if (typeof t.atrasada === 'boolean') return t.atrasada
      const iv = intervaloTarea(t)
      return !!iv && avanceDe(t) < 100 && iv.fin < hoy
    }
    // Donde se DIBUJA: una atrasada se dibuja desde hoy, con sus mismos días.
    function intervaloDibujo(t, hoy = hoyArgentina()) {
      const iv = intervaloTarea(t)
      if (!iv) return null
      if (esAtrasada(t, hoy) && iv.fin < hoy) return { ini: hoy, fin: sumarDias(hoy, diasEntre(iv.ini, iv.fin)), movida: true }
      return iv
    }
    // Las columnas que ocupa (índices en `dias`), o null si no se ve.
    function columnasDe(dias, iv) {
      if (!iv) return null
      let a = -1, b = -1
      dias.forEach((d, i) => { if (d >= iv.ini && d <= iv.fin) { if (a < 0) a = i; b = i } })
      return a < 0 ? null : { a, b }
    }
    // Carriles: si dos actividades se pisan, el renglón se abre en dos.
    function asignarCarriles(items) {
      const fines = []
      for (const it of [...items].sort((x, y) => x.a - y.a || x.b - y.b)) {
        let l = fines.findIndex(f => f < it.a)
        if (l < 0) { l = fines.length; fines.push(it.b) } else fines[l] = it.b
        it.carril = l
      }
      return Math.max(1, fines.length)
    }
    function diasHabiles(ini, fin) {
      let n = 0
      for (let d = ini, i = 0; d && d <= fin && i < 800; d = sumarDias(d, 1), i++) if (diaSemana(d) !== 0) n++
      return n
    }
    // Las horas de una actividad que caen en el período (proporcional a los
    // días hábiles; sin horas estimadas, 8 h por día).
    function horasEnRango(t, dias, hoy = hoyArgentina()) {
      const iv = intervaloDibujo(t, hoy)
      if (!iv) return 0
      const total = Math.max(1, diasHabiles(iv.ini, iv.fin))
      const dentro = dias.filter(d => d >= iv.ini && d <= iv.fin).length
      const h = numero(t.horas_estimadas) ?? HORAS_DIA * total
      return h * dentro / total
    }

    // Choques: la misma persona con dos (o más) cosas el mismo día, con las
    // fechas PLANEADAS (el mismo criterio que se_superpone de la base). Uno
    // por persona y grupo de actividades, no uno por día.
    function choquesDe(tareas, dias) {
      const porPersona = new Map()
      for (const t of tareas || []) {
        if (avanceDe(t) >= 100) continue
        const iv = intervaloTarea(t)
        if (!iv) continue
        for (const p of t.personas || []) {
          if (!porPersona.has(p.id)) porPersona.set(p.id, { nombre: p.nombre, lista: [] })
          porPersona.get(p.id).lista.push({ t, iv })
        }
      }
      const out = []
      for (const [personaId, { nombre, lista }] of porPersona) {
        const vistos = new Set()
        for (const d of dias) {
          const en = lista.filter(x => x.iv.ini <= d && x.iv.fin >= d).map(x => x.t)
          if (en.length < 2) continue
          const clave = en.map(t => t.id).sort().join('|')
          if (vistos.has(clave)) continue
          vistos.add(clave)
          out.push({ personaId, nombre, dia: d, tareas: en })
        }
      }
      return out
    }

    // Lo que dice el aviso bordó y la burbuja de la pestaña. La burbuja
    // cuenta atrasadas + choques (el diseño dice 2 con 1 atrasada y 2
    // actividades que se superponen en UN choque: ver el traspaso).
    function problemasDiagrama(tareas, dias, hoy = hoyArgentina()) {
      const lista = tareas || []
      const atrasadas = lista.filter(t => avanceDe(t) < 100 && esAtrasada(t, hoy))
      const superpuestas = lista.filter(t => t.se_superpone === true && avanceDe(t) < 100)
      const choques = choquesDe(lista, dias)
      return { atrasadas, superpuestas, choques, burbuja: atrasadas.length + choques.length }
    }
    const NUMERO_PALABRA = { 2: 'dos', 3: 'tres', 4: 'cuatro' }
    function textoAviso(pr) {
      const partes = []
      const na = pr.atrasadas.length
      const ns = pr.superpuestas.length || pr.choques.reduce((s, c) => s + c.tareas.length, 0)
      if (na) partes.push(`${na} ${na === 1 ? 'actividad atrasada' : 'actividades atrasadas'}`)
      if (ns) partes.push(`${ns} que se superponen`)
      const titulo = partes.join(' y ')
      const detalle = [
        ...pr.atrasadas.map(t => {
          const quien = pila(t.personas?.[0]?.nombre)
          return `${t.titulo}${quien ? ` (${quien})` : ''} tenía que terminar el ${fechaDiaMes(intervaloTarea(t)?.fin)}`
        }),
        ...pr.choques.map(c => `${pila(c.nombre)} tiene ${NUMERO_PALABRA[c.tareas.length] || c.tareas.length} cosas el ${DIA_LARGO[diaSemana(c.dia)]} ${String(c.dia).slice(8, 10)}`),
      ].join(' · ')
      return { titulo, detalle }
    }

    // Las actividades que se dibujan: las que caen en el período y las
    // atrasadas (se dibujan desde hoy). Las canceladas no vienen de la base.
    function tareasVisibles(tareas, dias, hoy = hoyArgentina()) {
      return (tareas || []).filter(t => columnasDe(dias, intervaloDibujo(t, hoy)))
    }

    // Los renglones por operario: la gente del Taller y cualquiera que tenga
    // una actividad. Vos primero; después por la primera actividad del período.
    function filasOperario(tareas, personas, dias, { hoy = hoyArgentina(), yo = null, fabrica = estado.fabrica } = {}) {
      const filas = new Map()
      for (const p of personas || []) filas.set(p.id, { id: p.id, nombre: p.nombre, items: [] })
      for (const t of tareasVisibles(tareas, dias, hoy)) {
        const pos = columnasDe(dias, intervaloDibujo(t, hoy))
        const quienes = (t.personas || []).length ? t.personas : [{ id: '', nombre: 'Sin asignar' }]
        for (const q of quienes) {
          if (!filas.has(q.id)) filas.set(q.id, { id: q.id, nombre: q.nombre, items: [] })
          filas.get(q.id).items.push({ t, a: pos.a, b: pos.b })
        }
      }
      const choques = choquesDe(tareas, dias)
      const lista = sinPersonasDePrueba([...filas.values()], fabrica, f => f.id)
      for (const f of lista) {
        f.carriles = asignarCarriles(f.items)
        f.horas = f.items.reduce((s, it) => s + horasEnRango(it.t, dias, hoy), 0)
        f.choque = choques.find(c => c.personaId === f.id) || null
        f.primera = f.items.length ? Math.min(...f.items.map(i => i.a)) : Infinity
      }
      return lista.sort((x, y) => (x.id === yo ? -1 : 0) - (y.id === yo ? -1 : 0) || x.primera - y.primera ||
        String(x.nombre).localeCompare(String(y.nombre), 'es'))
    }

    function textoSubPersona(f, dias) {
      if (f.choque) return `${f.choque.tareas.length} cosas el ${diaCorto(f.choque.dia)}`
      return `${cantidadHoras(Math.round(f.horas))} h de ${cantidadHoras(HORAS_DIA * dias.length)} h`
    }

    function columnasCss(dias, ancho) {
      return `${ancho}px ` + dias.map(d => diaSemana(d) === 6 ? 'minmax(0,0.6fr)' : 'minmax(0,1fr)').join(' ')
    }

    function htmlCabeceraGantt(dias, hoy, rotulo, cols) {
      return `<div class="tl-gantt__cab" style="grid-template-columns:${esc(cols)}"><div class="tl-gantt__rot">${esc(rotulo)}</div>` +
        dias.map((d, i) => {
          const w = diaSemana(d)
          const clases = 'tl-gantt__dia' + (d === hoy ? ' tl-gantt__dia--hoy' : '') + (w === 6 ? ' tl-gantt__dia--sab' : '') + (w === 1 && i > 0 ? ' tl-gantt__dia--semana' : '')
          return `<div class="${clases}"><div class="tl-gantt__dia-s">${esc(d === hoy ? 'HOY' : DIA_CORTO[w])}</div><div class="tl-gantt__dia-n">${esc(d.slice(8, 10))}</div></div>`
        }).join('') + '</div>'
    }
    function htmlCeldas(dias, hoy, carriles) {
      return dias.map((d, i) => {
        const w = diaSemana(d)
        const clases = 'tl-gantt__celda' + (d === hoy ? ' tl-gantt__celda--hoy' : '') + (w === 6 ? ' tl-gantt__celda--sab' : '') + (w === 1 && i > 0 ? ' tl-gantt__celda--semana' : '')
        return `<div class="${clases}" style="grid-column:${esc(String(i + 2))};grid-row:1 / span ${esc(String(carriles))}"></div>`
      }).join('')
    }

    // Una barra. Del color de su proyecto: lo oscuro, de izquierda a
    // derecha, es el avance. Bordó lleno = atrasada; punteado = se superpone.
    function htmlBarraG(t, pos, ctx) {
      const col = colorProyecto(t.proyecto_id)
      const av = avanceDe(t)
      const uno = pos.a === pos.b
      const atr = esAtrasada(t, ctx.hoy) && av < 100
      const sup = t.se_superpone === true && av < 100
      const persona = t.personas?.[0]?.nombre || ''
      const h = numero(t.horas_estimadas)
      let texto, sub
      if (ctx.agrupar === 'proyecto') {
        texto = `${uno ? inicialesDe(persona || '—') : (pila(persona) || 'Sin asignar')}${h !== null ? ` · ${cantidadHoras(h)} h` : ''}`
        sub = atr ? `atrasada · era hasta el ${fechaDiaMes(intervaloTarea(t)?.fin)}` : (uno ? '' : (av > 0 ? `${av} % hecho` : 'sin empezar'))
      } else {
        texto = uno && t.nombre_corto ? t.nombre_corto : t.titulo
        sub = atr ? `atrasada · era hasta el ${fechaDiaMes(intervaloTarea(t)?.fin)}`
          : (uno ? '' : [t.proyecto, h !== null ? `${cantidadHoras(h)} h` : '', av > 0 ? `${av} %` : ''].filter(Boolean).join(' · '))
      }
      const clases = 'tl-barra-g' + (uno ? ' tl-barra-g--uno' : '') + (atr ? ' tl-barra-g--atrasada' : (sup ? ' tl-barra-g--superpone' : '')) +
        (ctx.sel === t.id ? ' tl-barra-g--sel' : '') + (ctx.gestionar ? ' tl-barra-g--movil' : '')
      const estilo = `grid-column:${pos.a + 2} / ${pos.b + 3};grid-row:${(pos.carril || 0) + 1};--c:${col.c};--t:${col.t};--t2:${col.t2};--av:${av}%`
      const titulo = [t.titulo, t.proyecto, persona, atr ? 'atrasada' : '', sup ? 'se superpone' : ''].filter(Boolean).join(' · ')
      return `<button type="button" class="${esc(clases)}" style="${esc(estilo)}" data-tarea="${esc(t.id)}" title="${esc(titulo)}">` +
        `<span class="tl-barra-g__t">${esc(texto)}</span>` +
        (sub ? `<span class="tl-barra-g__sub${atr ? ' tl-barra-g__sub--mal' : ''}">${esc(sub)}</span>` : '') +
        (ctx.gestionar ? '<span class="tl-barra-g__borde" data-borde="1" aria-hidden="true"></span>' : '') + '</button>'
    }

    function htmlFilasOperario(tareas, ctx) {
      const filas = filasOperario(tareas, ctx.personas, ctx.dias, { hoy: ctx.hoy, yo: ctx.yo })
      if (!filas.length) return '<p class="tl-texto-suave tl-tabla__vacio">No hay actividades en estas semanas.</p>'
      return filas.map(f => {
        const L = f.carriles
        for (const it of f.items) ctx.posiciones.set(it.t.id, { a: it.a, b: it.b })
        return `<div class="tl-gantt__fila" style="grid-template-columns:${esc(ctx.cols)};grid-template-rows:repeat(${esc(String(L))}, minmax(48px, auto))">` +
          `<div class="tl-gantt__quien" style="grid-row:1 / span ${esc(String(L))}">` +
          `<span class="tl-gantt__av" style="background:${esc(colorPersona(f.nombre))}" aria-hidden="true">${esc(inicialesAvatar(f.nombre))}</span>` +
          `<div class="tl-card__txt"><p class="tl-gantt__nombre">${esc(f.nombre)}</p><p class="tl-gantt__sub">${esc(textoSubPersona(f, ctx.dias))}</p></div></div>` +
          htmlCeldas(ctx.dias, ctx.hoy, L) + f.items.map(it => htmlBarraG(it.t, it, ctx)).join('') + '</div>'
      }).join('')
    }

    // Los grupos por proyecto, en el orden de la lista de proyectos.
    function gruposProyecto(tareas, dias, hoy, proyectos = estado.proyectos) {
      const orden = new Map((proyectos || []).map((p, i) => [p.id, i]))
      const grupos = new Map()
      for (const t of tareasVisibles(tareas, dias, hoy)) {
        const k = t.proyecto_id || ''
        if (!grupos.has(k)) grupos.set(k, { id: k, nombre: t.proyecto || 'Sin proyecto', tareas: [] })
        grupos.get(k).tareas.push(t)
      }
      return [...grupos.values()].sort((x, y) => (orden.get(x.id) ?? 999) - (orden.get(y.id) ?? 999) || String(x.nombre).localeCompare(String(y.nombre), 'es'))
    }

    function htmlFilasProyecto(tareas, ctx) {
      const grupos = gruposProyecto(tareas, ctx.dias, ctx.hoy)
      if (!grupos.length) return '<p class="tl-texto-suave tl-tabla__vacio">No hay actividades en estas semanas.</p>'
      const info = new Map((estado.proyectos || []).map(p => [p.id, p]))
      return grupos.map(g => {
        const col = colorProyecto(g.id)
        const p = info.get(g.id)
        const atr = p && p.atrasado && !CERRADOS.has(p.estado)
        const sub = p ? `${ETIQUETA_ESTADO[p.estado] || ''} · entrega ${atr ? 'era ' : ''}${fechaDiaMes(p.fecha_entrega_prometida)}` : ''
        return `<div class="tl-gantt__grupo" style="background:${esc(col.t)};border-color:${esc(col.c)}">` +
          `<span class="tl-gantt__grupo-cuadro" style="background:${esc(col.c)}"></span><span class="tl-gantt__grupo-nombre">${esc(g.nombre)}</span>` +
          `<span class="tl-gantt__grupo-sub">${esc(sub)}</span>` +
          (atr ? `<span class="tl-chip tl-chip--malo">Atrasado ${esc(String(diasAtraso(p.fecha_entrega_prometida, ctx.hoy)))} días</span>` : '') + '</div>' +
          g.tareas.map(t => {
            const pos = columnasDe(ctx.dias, intervaloDibujo(t, ctx.hoy))
            ctx.posiciones.set(t.id, pos)
            const persona = t.personas?.[0]?.nombre || 'Sin asignar'
            const h = numero(t.horas_estimadas)
            return `<div class="tl-gantt__fila" style="grid-template-columns:${esc(ctx.cols)};grid-template-rows:minmax(42px, auto)">` +
              `<div class="tl-gantt__quien"><div class="tl-card__txt"><p class="tl-gantt__nombre">${esc(t.titulo)}</p>` +
              `<p class="tl-gantt__sub">${esc(persona)}${h !== null ? ` · ${esc(cantidadHoras(h))} h` : ''}</p></div></div>` +
              htmlCeldas(ctx.dias, ctx.hoy, 1) + htmlBarraG(t, { ...pos, carril: 0 }, ctx) + '</div>'
          }).join('')
      }).join('')
    }

    function htmlLeyenda(tareas, ctx) {
      const vis = tareasVisibles(tareas, ctx.dias, ctx.hoy)
      const orden = new Map((estado.proyectos || []).map((p, i) => [p.id, i]))
      const proys = [...new Map(vis.map(t => [t.proyecto_id || '', t.proyecto || 'Sin proyecto'])).entries()]
        .sort((x, y) => (orden.get(x[0]) ?? 999) - (orden.get(y[0]) ?? 999))
      const sinFecha = (tareas || []).filter(t => !t.fecha_inicio).length
      return '<div class="tl-leyenda">' +
        (ctx.panel ? '' : proys.map(([id, n]) => `<span class="tl-leyenda__i"><span class="tl-leyenda__c" style="background:${esc(colorProyecto(id).c)}"></span>${esc(n)}</span>`).join('')) +
        '<span class="tl-tool__relleno"></span>' +
        '<span class="tl-leyenda__i"><span class="tl-leyenda__m tl-leyenda__m--atrasada"></span>atrasada</span>' +
        '<span class="tl-leyenda__i"><span class="tl-leyenda__m tl-leyenda__m--superpone"></span>se superpone</span>' +
        '<span class="tl-leyenda__i"><span class="tl-leyenda__m tl-leyenda__m--avance"></span>lo oscuro es el avance</span>' +
        (sinFecha ? `<span class="tl-leyenda__i">${esc(String(sinFecha))} sin fecha (no se dibujan)</span>` : '') + '</div>'
    }

    function htmlAvisoDiagrama(pr) {
      if (!pr.atrasadas.length && !pr.choques.length && !pr.superpuestas.length) return ''
      const { titulo, detalle } = textoAviso(pr)
      return '<div class="tl-aviso tl-aviso--grave"><svg class="tl-aviso__icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"></path><path d="M12 10v4.5M12 17.5v.01"></path></svg>' +
        `<div class="tl-aviso__cuerpo"><p class="tl-aviso__titulo">${esc(titulo)}</p><p class="tl-aviso__texto">${esc(detalle)}</p></div>` +
        '<button type="button" class="tl-btn tl-btn--link-malo" data-accion="diag-ver">Ver</button></div>'
    }

    function htmlBarraDiagrama(d, ctx) {
      return '<div class="tl-tool tl-solo-compu"><div class="tl-seg" role="group" aria-label="Cómo agrupar">' +
        [['operario', 'Por operario'], ['proyecto', 'Por proyecto']].map(([v, t]) =>
          `<button type="button" class="tl-seg__op" data-agrupar="${esc(v)}" aria-pressed="${d.agrupar === v ? 'true' : 'false'}">${esc(t)}</button>`).join('') +
        '</div><span class="tl-tool__relleno"></span>' +
        '<button type="button" class="tl-btn" data-accion="dia-atras" aria-label="Semana anterior">‹</button>' +
        '<button type="button" class="tl-btn" data-accion="dia-hoy">Hoy</button>' +
        '<button type="button" class="tl-btn" data-accion="dia-adelante" aria-label="Semana siguiente">›</button>' +
        '<label class="tl-solo-lector" for="tl-diag-rango">Cuánto mostrar</label><select class="tl-select" id="tl-diag-rango">' +
        RANGOS.map(([v, t]) => `<option value="${esc(v)}"${d.rango === v ? ' selected' : ''}>${esc(t)}</option>`).join('') + '</select>' +
        (ctx.gestionar ? '<button type="button" class="tl-btn tl-btn--primario" data-accion="act-nueva">+ Actividad</button>' : '') + '</div>'
    }

    // ── El panel de una actividad (7c) ─────────────────────────────────────
    function textoQuien(persona, p, tareas, seleccionado) {
      const otras = (tareas || []).filter(t => t.id !== p.id && avanceDe(t) < 100 && (t.personas || []).some(x => x.id === persona.id))
        .map(t => ({ t, iv: intervaloTarea(t) })).filter(x => x.iv && p.desde && p.hasta && x.iv.ini <= p.hasta && x.iv.fin >= p.desde)
      if (!otras.length) return p.desde === p.hasta ? 'libre ese día' : 'libre esos días'
      const x = otras[0]
      if (seleccionado) {
        const dia = x.iv.ini > p.desde ? x.iv.ini : p.desde
        return `ya tiene “${x.t.titulo}” el ${diaCorto(dia)}`
      }
      return `en ${otras.map(o => o.t.titulo).join(', ')}`
    }
    function choqueDelPanel(p, tareas) {
      if (!p.persona || !p.desde || !p.hasta) return null
      const x = (tareas || []).filter(t => t.id !== p.id && avanceDe(t) < 100 && (t.personas || []).some(q => q.id === p.persona))
        .map(t => ({ t, iv: intervaloTarea(t) })).find(o => o.iv && o.iv.ini <= p.hasta && o.iv.fin >= p.desde)
      if (!x) return null
      return { dia: x.iv.ini > p.desde ? x.iv.ini : p.desde, titulo: x.t.titulo }
    }

    function htmlPanelActividad(p, ctx) {
      const col = colorProyecto(p.proyecto_id)
      const proyecto = (estado.proyectos || []).find(x => x.id === p.proyecto_id)?.nombre || p.proyecto || ''
      const personas = ctx.personasPanel || []
      const choque = choqueDelPanel(p, ctx.tareas)
      const nombreElegido = personas.find(x => x.id === p.persona)?.nombre || ''
      const proyectos = (estado.proyectos || []).filter(x => !CERRADOS.has(x.estado) || x.id === p.proyecto_id)
      let h = `<div class="tl-panel tl-panel-act" role="region" aria-label="Actividad"><div class="tl-panel-act__banda" style="background:${esc(col.t)};border-color:${esc(col.c)}">` +
        `<h2 class="tl-panel-act__titulo">${esc(p.id ? p.titulo : 'Actividad nueva')}</h2><p class="tl-panel-act__sub">${esc(proyecto || 'Sin proyecto')}</p></div>`
      const camposNombre = `<div class="tl-campo"><label for="tl-act-titulo">Nombre</label><input type="text" class="tl-input" id="tl-act-titulo" maxlength="120" autocomplete="off" value="${esc(p.titulo || '')}"></div>` +
        '<div class="tl-campo"><label for="tl-act-proyecto">Proyecto</label><select id="tl-act-proyecto">' +
        opcionesSelect(proyectos.map(x => [x.id, x.nombre]), p.proyecto_id, 'Elegí el proyecto') + '</select></div>' +
        `<div class="tl-campo"><label for="tl-act-corto">Nombre corto (para las barras de un día)</label><input type="text" class="tl-input" id="tl-act-corto" maxlength="40" autocomplete="off" value="${esc(p.nombre_corto || '')}"></div>`
      h += p.id ? '<details class="tl-act-nombre"><summary class="tl-c-2">Nombre y proyecto</summary>' + camposNombre + '</details>' : camposNombre
      h += '<div class="tl-campo"><span class="tl-c-fuerte">¿Quién la hace?</span><div class="tl-opciones tl-opciones--columna" role="radiogroup" aria-label="Quién la hace">' +
        [...personas].sort((a, b) => (b.id === p.persona) - (a.id === p.persona)).map(x => {
          const sel = x.id === p.persona
          return `<button type="button" class="tl-opcion" role="radio" data-act-persona="${esc(x.id)}" aria-checked="${sel ? 'true' : 'false'}"><span class="tl-opcion__radio"></span>` +
            `<span class="tl-opcion__txt"><span class="tl-opcion__t">${esc(x.nombre)}</span><span class="tl-opcion__sub">${esc(textoQuien(x, p, ctx.tareas, sel))}</span></span></button>`
        }).join('') + '</div></div>'
      if (choque) {
        h += '<div class="tl-aviso tl-aviso--grave"><svg class="tl-aviso__icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"></path><path d="M12 10v4.5M12 17.5v.01"></path></svg>' +
          `<div class="tl-aviso__cuerpo"><p class="tl-aviso__titulo">${esc(pila(nombreElegido))} tiene dos cosas el ${esc(DIA_LARGO[diaSemana(choque.dia)])} ${esc(String(choque.dia).slice(8, 10))}</p>` +
          `<p class="tl-aviso__texto">También “${esc(choque.titulo)}”.</p></div></div>`
      }
      h += '<div class="tl-fila-campos">' +
        `<div class="tl-campo"><label for="tl-act-desde">Desde</label><input type="date" class="tl-input" id="tl-act-desde" value="${esc(p.desde || '')}"></div>` +
        `<div class="tl-campo"><label for="tl-act-hasta">Hasta</label><input type="date" class="tl-input" id="tl-act-hasta" value="${esc(p.hasta || '')}"></div></div>` +
        '<div class="tl-fila-campos"><div class="tl-campo"><label for="tl-act-horas">Horas estimadas</label><input type="text" class="tl-input" id="tl-act-horas" autocomplete="off"></div>' +
        '<div class="tl-campo"><label for="tl-act-avance">Avance (%)</label><input type="text" class="tl-input" id="tl-act-avance" autocomplete="off"></div></div>' +
        (p.error ? `<p class="tl-error-pegado">${esc(p.error)}</p>` : '')
      if (p.confirmarEliminar) {
        h += '<div class="tl-aviso tl-aviso--grave"><div class="tl-aviso__cuerpo"><p class="tl-aviso__titulo">¿Eliminar esta actividad?</p><p class="tl-aviso__texto">Deja de aparecer en el diagrama. Las horas ya cargadas quedan en el proyecto.</p></div></div>' +
          '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="act-eliminar-no">No</button>' +
          `<button type="button" class="tl-btn tl-btn--peligro" data-accion="act-eliminar-si"${p.enviando ? ' disabled' : ''}>Sí, eliminar</button></div>`
      } else {
        h += '<div class="tl-acciones">' + (p.id ? '<button type="button" class="tl-btn tl-btn--link-malo" data-accion="act-eliminar">Eliminar</button>' : '') +
          '<span class="tl-tool__relleno"></span><button type="button" class="tl-btn" data-accion="act-cancelar">Cancelar</button>' +
          `<button type="button" class="tl-btn tl-btn--primario" data-accion="act-guardar"${p.enviando ? ' disabled' : ''}>${p.enviando ? 'Guardando…' : 'Guardar'}</button></div>`
      }
      return h + '</div>'
    }

    // ── Mis actividades (7d, el celular; y lo de cada operario) ──────────────
    function misActividades(tareas, yo, hoy = hoyArgentina()) {
      const mias = (tareas || []).filter(t => avanceDe(t) < 100 && (t.personas || []).some(p => p.id === yo))
        .map(t => ({ t, iv: intervaloDibujo(t, hoy) })).filter(x => x.iv)
      return {
        hoy: mias.filter(x => x.iv.ini <= hoy && x.iv.fin >= hoy),
        viene: mias.filter(x => x.iv.ini > hoy).sort((a, b) => a.iv.ini.localeCompare(b.iv.ini)),
      }
    }
    function textoCuando(iv, hoy = hoyArgentina()) {
      if (iv.ini === iv.fin) return diaCorto(iv.ini)
      const base = `${diaCorto(iv.ini)} al ${diaCorto(iv.fin)}`
      if (iv.ini <= hoy && iv.fin >= hoy) return `${base} · día ${diasEntre(iv.ini, hoy) + 1} de ${diasEntre(iv.ini, iv.fin) + 1}`
      return base
    }
    function htmlTarjetaMia(x, ctx, enHoy) {
      const t = x.t, col = colorProyecto(t.proyecto_id), av = avanceDe(t)
      const atr = esAtrasada(t, ctx.hoy)
      return `<div class="tl-panel tl-mia"><div class="tl-card__banda" style="background:${esc(col.t)};border-color:${esc(col.c)}">` +
        `<div class="tl-card__txt"><div class="tl-card__nombre">${esc(t.titulo)}</div><div class="tl-card__sub">${esc(t.proyecto || 'Sin proyecto')}</div></div>` +
        (atr ? '<div class="tl-card__chips"><span class="tl-chip tl-chip--malo">Atrasada</span></div>' : '') + '</div>' +
        '<div class="tl-kv">' + kv('Cuándo', textoCuando(x.iv, ctx.hoy)) +
        kv('Horas', numero(t.horas_estimadas) !== null ? `${cantidadHoras(t.horas_estimadas)} h estimadas` : 'sin estimar') + '</div>' +
        `<div class="tl-barra"><div class="tl-barra__fila"><span class="tl-barra__rotulo">Avance</span><span class="tl-barra__der">${esc(porcentaje(av))}</span></div>` +
        `<div class="tl-barra__pista"><div class="tl-barra__lleno" style="width:${esc(String(av))}%;background:${esc(col.c)}"></div></div></div>` +
        (enHoy && ctx.cargar
          ? `<div class="tl-fila-campos"><button type="button" class="tl-btn tl-btn--primario tl-btn--grande" data-accion="mia-horas" data-tarea="${esc(t.id)}">Cargar horas</button>` +
            `<button type="button" class="tl-btn tl-btn--fantasma tl-btn--grande" data-accion="mia-avance" data-tarea="${esc(t.id)}">Marcar avance</button></div>`
          : '') + '</div>'
    }
    function htmlMisActividades(tareas, ctx) {
      const m = misActividades(tareas, ctx.yo, ctx.hoy)
      const w = diaSemana(ctx.hoy)
      return '<div class="tl-mis tl-solo-celu"><h2 class="tl-cabeza__nombre">Mis actividades</h2>' +
        `<p class="tl-mis__dia">HOY · ${esc(String(DIA_LARGO[w] || '').toUpperCase())} ${esc(fechaDiaMes(ctx.hoy))}</p>` +
        (m.hoy.length ? m.hoy.map(x => htmlTarjetaMia(x, ctx, true)).join('') : '<p class="tl-texto-suave">Hoy no tenés actividades.</p>') +
        '<p class="tl-mis__dia">LO QUE VIENE</p>' +
        (m.viene.length ? m.viene.map(x => htmlTarjetaMia(x, ctx, false)).join('') : '<p class="tl-texto-suave">No tenés nada más en el diagrama.</p>') + '</div>'
    }

    function htmlModalHorasTarea(m) {
      return '<div class="tl-ventana tl-ventana--angosta" role="dialog" aria-modal="true" aria-labelledby="tl-modal-titulo">' +
        `<div><h2 class="tl-ventana__titulo" id="tl-modal-titulo">Cargar horas</h2><p class="tl-ventana__sub">${esc(m.titulo || '')} · ${esc(m.proyecto || '')}</p></div>` +
        '<div class="tl-fila-campos">' +
        `<div class="tl-campo"><label for="tl-mia-fecha">Día</label><input type="date" class="tl-input" id="tl-mia-fecha" max="${esc(hoyArgentina())}" value="${esc(m.fecha || '')}"></div>` +
        '<div class="tl-campo"><label for="tl-mia-horas">Horas</label><input type="text" class="tl-input" id="tl-mia-horas" autocomplete="off"></div></div>' +
        `<div class="tl-campo"><label for="tl-mia-nota">Nota (opcional)</label><input type="text" class="tl-input" id="tl-mia-nota" maxlength="200" autocomplete="off" value="${esc(m.nota || '')}"></div>` +
        (m.error ? `<p class="tl-error-pegado">${esc(m.error)}</p>` : '') +
        '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="modal-cerrar">Cancelar</button>' +
        `<button type="button" class="tl-btn tl-btn--primario" data-accion="mia-horas-guardar"${m.enviando ? ' disabled' : ''}>Guardar las horas</button></div></div>`
    }
    function htmlModalAvance(m) {
      return '<div class="tl-ventana tl-ventana--angosta" role="dialog" aria-modal="true" aria-labelledby="tl-modal-titulo">' +
        `<div><h2 class="tl-ventana__titulo" id="tl-modal-titulo">Marcar avance</h2><p class="tl-ventana__sub">${esc(m.titulo || '')}</p></div>` +
        '<div class="tl-opciones">' + [0, 25, 50, 75, 100].map(v =>
          `<button type="button" class="tl-opcion" data-avance-rapido="${esc(String(v))}" aria-pressed="${m.avance === v ? 'true' : 'false'}"><span class="tl-opcion__t">${esc(String(v))} %</span></button>`).join('') + '</div>' +
        '<div class="tl-campo"><label for="tl-mia-avance">Avance (%)</label><input type="text" class="tl-input" id="tl-mia-avance" autocomplete="off"></div>' +
        '<p class="tl-texto-suave">Con 100 % la actividad queda hecha.</p>' +
        (m.error ? `<p class="tl-error-pegado">${esc(m.error)}</p>` : '') +
        '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="modal-cerrar">Cancelar</button>' +
        `<button type="button" class="tl-btn tl-btn--primario" data-accion="mia-avance-guardar"${m.enviando ? ' disabled' : ''}>Guardar</button></div></div>`
    }

    // ── Todo junto ─────────────────────────────────────────────────────────
    function contextoDiagrama() {
      const d = estado.diag
      const hoy = hoyArgentina()
      if (!d.desde) d.desde = lunesDe(hoy)
      // Con el panel abierto el diagrama pasa a 1 semana (7c).
      const dias = diasVisibles(d.desde, d.panel ? 1 : semanasDelRango(d.rango))
      const ancho = d.agrupar === 'proyecto' ? 210 : 170
      let personas = personasDelTaller()
      if (soloMias()) personas = personas.filter(p => p.id === estado.miEmpleadoId)
      return {
        hoy, dias, agrupar: d.agrupar, sel: d.sel, panel: d.panel, gestionar: puedeGestionar(), cargar: puedeCargar(),
        yo: estado.miEmpleadoId, personas, personasPanel: personasDelTaller(), tareas: d.tareas || [],
        cols: columnasCss(dias, ancho), ancho, posiciones: new Map(),
      }
    }

    function htmlDiagrama(d, ctx) {
      if (d.error) return `<div class="tl-aviso tl-aviso--grave">No se pudo leer el diagrama: ${esc(d.error)} <button type="button" class="tl-btn tl-btn--fantasma" data-accion="diag-reintentar">Reintentar</button></div>`
      if (d.tareas === null) return '<div class="tl-panel"><div class="tl-esqueleto"><div></div><div></div><p>Cargando…</p></div></div>'
      const pr = problemasDiagrama(d.tareas, ctx.dias, ctx.hoy)
      const minimo = ctx.ancho + ctx.dias.length * 48
      const filas = ctx.agrupar === 'proyecto' ? htmlFilasProyecto(d.tareas, ctx) : htmlFilasOperario(d.tareas, ctx)
      const gantt = '<div class="tl-panel tl-gantt-marco"><div class="tl-gantt"><div class="tl-gantt__scroll">' +
        `<div class="tl-gantt__lienzo" style="min-width:${esc(String(minimo))}px">` +
        htmlCabeceraGantt(ctx.dias, ctx.hoy, ctx.agrupar === 'proyecto' ? 'ACTIVIDAD' : 'OPERARIO', ctx.cols) +
        '<div class="tl-gantt__cuerpo">' + filas + '</div></div></div>' + htmlLeyenda(d.tareas, ctx) + '</div></div>'
      return '<div class="tl-diag-compu tl-solo-compu">' +
        (d.panel ? '' : htmlBarraDiagrama(d, ctx) + htmlAvisoDiagrama(pr)) +
        '<div class="tl-diag' + (d.panel ? ' tl-diag--con-panel' : '') + '">' + gantt + (d.panel ? htmlPanelActividad(d.panel, ctx) : '') + '</div></div>' +
        htmlMisActividades(d.tareas, ctx)
    }

    function pintarBurbuja() {
      const b = document.getElementById('tl-burbuja-diagrama')
      const d = estado.diag
      if (!b || !d.tareas || d.error) { if (b) b.hidden = true; return }
      const hoy = hoyArgentina()
      const dias = diasVisibles(d.desde || lunesDe(hoy), semanasDelRango(d.rango))
      const n = problemasDiagrama(d.tareas, dias, hoy).burbuja
      b.textContent = String(n)
      b.hidden = n === 0
      b.setAttribute('aria-label', `${n} ${n === 1 ? 'problema' : 'problemas'} en el diagrama`)
    }

    function pintarDiagrama() {
      const d = estado.diag
      const ctx = contextoDiagrama()
      d.dias = ctx.dias
      document.getElementById('tl-diagrama').innerHTML = htmlDiagrama(d, ctx)
      d.posiciones = ctx.posiciones
      const hs = document.getElementById('tl-act-horas')
      if (hs && d.panel) { enlazarCampoNumero(hs, { decimales: 1 }); if (d.panel.horas != null) ponerNumero(hs, d.panel.horas) }
      const av = document.getElementById('tl-act-avance')
      if (av && d.panel) { enlazarCampoNumero(av, { decimales: 0, max: 100 }); if (d.panel.avance != null) ponerNumero(av, d.panel.avance) }
      pintarBurbuja()
    }

    async function cargarTareas() {
      const d = estado.diag
      const mio = ++d.turno
      const hoy = hoyArgentina()
      if (!d.desde) d.desde = lunesDe(hoy)
      const dias = diasVisibles(d.desde, Math.max(semanasDelRango(d.rango), 1))
      // Sin p_desde: las atrasadas de antes del período también vienen (se
      // dibujan desde hoy). tareas_taller no devuelve las canceladas.
      const params = { p_hasta: dias[dias.length - 1] }
      if (soloMias()) params.p_empleado_id = estado.miEmpleadoId
      const { data, error } = await supabase.rpc('tareas_taller', params)
      if (mio !== d.turno) return
      if (error) { d.error = error.message || 'error desconocido'; d.tareas = [] }
      else if (data === null) { d.error = 'No tenés permiso para ver el diagrama.'; d.tareas = [] }
      else { d.error = null; d.tareas = Array.isArray(data) ? data : [] }
      if (estado.vista === 'tl-vista-diagrama') pintarDiagrama()
      else pintarBurbuja()
    }

    function mostrarDiagrama() {
      estado.ficha = null
      mostrarVista('tl-vista-diagrama', 'Diagrama de actividades')
      pintarDiagrama()
      Promise.all([asegurarPersonas(), estado.proyectos ? null : cargarProyectosEnSilencio()]).then(() => {
        if (estado.vista === 'tl-vista-diagrama') pintarDiagrama()
      })
      cargarTareas()
    }
    // Los proyectos para el orden de los grupos y los nombres (sin pintar la lista).
    async function cargarProyectosEnSilencio() {
      const { data, error } = await supabase.rpc('proyectos_taller', { p_solo_activos: false })
      if (!error && Array.isArray(data) && estado.proyectos === null) estado.proyectos = data
    }

    function tareaPorId(id) {
      return (estado.diag.tareas || []).find(t => t.id === id) || null
    }
    function panelDeTarea(t) {
      const iv = intervaloTarea(t)
      return {
        id: t.id, titulo: t.titulo || '', nombre_corto: t.nombre_corto || '', proyecto_id: t.proyecto_id || '', proyecto: t.proyecto || '',
        persona: t.personas?.[0]?.id || '', desde: iv?.ini || '', hasta: iv?.fin || '',
        horas: numero(t.horas_estimadas), avance: avanceDe(t), error: null, enviando: false, confirmarEliminar: false,
      }
    }
    function abrirPanel(id) {
      const t = tareaPorId(id)
      if (!t || !puedeGestionar()) { estado.diag.sel = id; pintarDiagrama(); return }
      estado.diag.sel = id
      estado.diag.panel = panelDeTarea(t)
      estado.diag.panel.original = panelDeTarea(t)
      // El panel muestra una semana: la de la actividad.
      if (estado.diag.panel.desde) estado.diag.desde = lunesDe(estado.diag.panel.desde < hoyArgentina() ? hoyArgentina() : estado.diag.panel.desde)
      pintarDiagrama()
      document.getElementById('tl-act-desde')?.focus()
    }
    function nuevaActividad() {
      if (!puedeGestionar()) return
      const hoy = hoyArgentina()
      estado.diag.sel = null
      estado.diag.panel = { id: null, titulo: '', nombre_corto: '', proyecto_id: '', persona: '', desde: hoy, hasta: hoy, horas: null, avance: 0, error: null, enviando: false, confirmarEliminar: false, original: null }
      pintarDiagrama()
      document.getElementById('tl-act-titulo')?.focus()
    }
    function cerrarPanel() {
      estado.diag.panel = null
      estado.diag.sel = null
      estado.diag.desde = lunesDe(hoyArgentina())
      pintarDiagrama()
    }
    function leerPanelAct() {
      const p = estado.diag.panel
      if (!p) return
      const val = id => document.getElementById(id)
      if (val('tl-act-titulo')) p.titulo = val('tl-act-titulo').value
      if (val('tl-act-proyecto')) p.proyecto_id = val('tl-act-proyecto').value
      if (val('tl-act-corto')) p.nombre_corto = val('tl-act-corto').value
      if (val('tl-act-desde')) p.desde = val('tl-act-desde').value
      if (val('tl-act-hasta')) p.hasta = val('tl-act-hasta').value
      if (val('tl-act-horas')) p.horas = leerCampoNumero(val('tl-act-horas'))
      if (val('tl-act-avance')) p.avance = leerCampoNumero(val('tl-act-avance'))
    }
    function faltaActividad(p) {
      if (limpio(p.titulo).length < 2) return 'Poné el nombre de la actividad.'
      if (!p.id && !p.proyecto_id) return 'Elegí el proyecto.'
      if (!p.desde) return 'Poné desde cuándo.'
      if (!p.hasta) return 'Poné hasta cuándo.'
      if (p.hasta < p.desde) return 'La fecha de fin no puede ser anterior a la de inicio.'
      if (p.horas !== null && p.horas !== undefined && p.horas < 0) return 'Las horas no pueden ser negativas.'
      if (p.avance !== null && p.avance !== undefined && (p.avance < 0 || p.avance > 100)) return 'El avance va de 0 a 100.'
      return null
    }
    // guardar_tarea_taller recibe SOLO lo que cambió (en una nueva, lo que
    // no está vacío). Una actividad la hace una sola persona: personas lleva
    // un id, o ninguno.
    function datosActividad(p, original = null) {
      const actual = {
        titulo: limpio(p.titulo), nombre_corto: limpio(p.nombre_corto), proyecto_id: p.proyecto_id || '',
        fecha_inicio: p.desde || '', fecha_fin: p.hasta || '', horas_estimadas: p.horas ?? null,
        avance_pct: p.avance ?? null, persona: p.persona || '',
      }
      const antes = original ? {
        titulo: limpio(original.titulo), nombre_corto: limpio(original.nombre_corto), proyecto_id: original.proyecto_id || '',
        fecha_inicio: original.desde || '', fecha_fin: original.hasta || '', horas_estimadas: original.horas ?? null,
        avance_pct: original.avance ?? null, persona: original.persona || '',
      } : null
      const out = {}
      const norm = v => (v === null || v === undefined) ? '' : String(v)
      for (const k of ['titulo', 'nombre_corto', 'proyecto_id', 'fecha_inicio', 'fecha_fin', 'horas_estimadas', 'avance_pct']) {
        if (antes ? norm(actual[k]) === norm(antes[k]) : norm(actual[k]) === '') continue
        out[k] = actual[k] === null ? '' : actual[k]
      }
      if (antes ? actual.persona !== antes.persona : !!actual.persona) out.personas = actual.persona ? [actual.persona] : []
      return out
    }

    async function accionDiagrama(accion, boton) {
      const d = estado.diag
      if (accion === 'diag-reintentar') { d.error = null; d.tareas = null; pintarDiagrama(); cargarTareas(); return }
      if (accion === 'dia-hoy') { d.desde = lunesDe(hoyArgentina()); pintarDiagrama(); cargarTareas(); return }
      if (accion === 'dia-atras' || accion === 'dia-adelante') {
        d.desde = sumarDias(d.desde || lunesDe(hoyArgentina()), accion === 'dia-atras' ? -7 : 7)
        pintarDiagrama(); cargarTareas(); return
      }
      if (accion === 'act-nueva') { nuevaActividad(); return }
      if (accion === 'diag-ver') {
        const pr = problemasDiagrama(d.tareas, d.dias, hoyArgentina())
        const t = pr.atrasadas[0] || pr.choques[0]?.tareas[0] || pr.superpuestas[0]
        if (t) abrirPanel(t.id)
        return
      }
      if (accion === 'mia-horas' || accion === 'mia-avance') {
        const t = tareaPorId(boton?.dataset.tarea)
        if (!t || !puedeCargar()) return
        if (accion === 'mia-horas') abrirModal({ tipo: 'horas-tarea', tareaId: t.id, titulo: t.titulo, proyecto: t.proyecto, fecha: hoyArgentina(), horas: null, nota: '', error: null, enviando: false })
        else abrirModal({ tipo: 'avance', tareaId: t.id, titulo: t.titulo, avance: avanceDe(t), error: null, enviando: false })
        return
      }
      const p = d.panel
      if (!p) return
      leerPanelAct()
      if (accion === 'act-cancelar') { cerrarPanel(); return }
      if (accion === 'act-eliminar') { p.confirmarEliminar = true; pintarDiagrama(); return }
      if (accion === 'act-eliminar-no') { p.confirmarEliminar = false; pintarDiagrama(); return }
      if (accion === 'act-eliminar-si') {
        if (p.enviando || !p.id) return
        p.enviando = true; pintarDiagrama()
        const { error } = await supabase.rpc('mover_tarea_taller', { p_id: p.id, p_estado: 'cancelada' })
        p.enviando = false
        if (error) { p.error = error.message || 'No se pudo eliminar.'; p.confirmarEliminar = false; pintarDiagrama(); return }
        mostrarExito('Actividad eliminada.')
        cerrarPanel(); cargarTareas(); return
      }
      if (accion === 'act-guardar') {
        if (p.enviando) return
        const falta = faltaActividad(p)
        if (falta) { p.error = falta; pintarDiagrama(); return }
        const datos = datosActividad(p, p.original)
        if (p.id && !Object.keys(datos).length) { cerrarPanel(); return }
        p.enviando = true; p.error = null; pintarDiagrama()
        const { error } = await supabase.rpc('guardar_tarea_taller', { p_id: p.id, p_datos: datos })
        p.enviando = false
        if (error) { p.error = error.message || 'No se pudo guardar.'; pintarDiagrama(); return }
        mostrarExito(p.id ? 'Actividad guardada.' : 'Actividad creada.')
        cerrarPanel(); cargarTareas()
      }
    }

    async function guardarHorasTarea() {
      const m = estado.modal
      if (!m || m.enviando) return
      const falta = faltaHoras({ ...m, personaId: estado.miEmpleadoId || 'yo' })
      if (falta) { m.error = falta; pintarModal(); return }
      m.enviando = true; m.error = null; pintarModal()
      const { error } = await supabase.rpc('cargar_horas_tarea', { p_tarea_id: m.tareaId, p_fecha: m.fecha, p_horas: m.horas, p_nota: limpio(m.nota) || null })
      m.enviando = false
      if (error) { m.error = error.message || 'No se pudo guardar.'; pintarModal(); return }
      cerrarModal()
      mostrarExito('Horas cargadas.')
      cargarTareas()
    }
    async function guardarAvanceTarea() {
      const m = estado.modal
      if (!m || m.enviando) return
      const av = numero(m.avance)
      if (av === null || av < 0 || av > 100) { m.error = 'El avance va de 0 a 100.'; pintarModal(); return }
      m.enviando = true; m.error = null; pintarModal()
      const { error } = await supabase.rpc('marcar_avance_tarea', { p_id: m.tareaId, p_avance_pct: Math.round(av) })
      m.enviando = false
      if (error) { m.error = error.message || 'No se pudo guardar.'; pintarModal(); return }
      cerrarModal()
      mostrarExito(av >= 100 ? 'Actividad hecha.' : 'Avance guardado.')
      cargarTareas()
    }

    // ── Arrastrar: mover de día, o estirar desde el borde derecho ──────────
    let arrastre = null
    function indiceBajo(x) {
      const dias = [...document.querySelectorAll('#tl-diagrama .tl-gantt__dia')]
      let idx = 0
      dias.forEach((el, i) => { if (el.getBoundingClientRect().left <= x) idx = i })
      return idx
    }
    function nuevasColumnas(modo, a, b, delta, n) {
      if (modo === 'estirar') return { a, b: Math.max(a, Math.min(n - 1, b + delta)) }
      const largo = b - a
      const na = Math.max(0, Math.min(n - 1 - largo, a + delta))
      return { a: na, b: na + largo }
    }
    function empezarArrastre(ev) {
      const bar = ev.target.closest('.tl-barra-g')
      if (!bar || ev.button !== 0) return
      const pos = estado.diag.posiciones.get(bar.dataset.tarea)
      if (!pos) return
      arrastre = {
        id: bar.dataset.tarea, bar, x0: ev.clientX, idx0: indiceBajo(ev.clientX), a: pos.a, b: pos.b, na: pos.a, nb: pos.b,
        modo: ev.target.closest('[data-borde]') ? 'estirar' : 'mover', movido: false, puede: puedeGestionar(),
      }
      bar.setPointerCapture?.(ev.pointerId)
    }
    function moverArrastre(ev) {
      if (!arrastre || !arrastre.puede) return
      if (!arrastre.movido && Math.abs(ev.clientX - arrastre.x0) < 5) return
      arrastre.movido = true
      const delta = indiceBajo(ev.clientX) - arrastre.idx0
      const c = nuevasColumnas(arrastre.modo, arrastre.a, arrastre.b, delta, estado.diag.dias.length)
      arrastre.na = c.a; arrastre.nb = c.b
      arrastre.bar.style.gridColumn = `${c.a + 2} / ${c.b + 3}`
      arrastre.bar.classList.add('tl-barra-g--arrastrando')
    }
    async function terminarArrastre() {
      const a = arrastre
      arrastre = null
      if (!a) return
      if (!a.movido) { abrirPanel(a.id); return }
      if (a.na === a.a && a.nb === a.b) { pintarDiagrama(); return }
      const t = tareaPorId(a.id)
      const dias = estado.diag.dias
      if (!t) return
      const datos = a.modo === 'estirar'
        ? { fecha_inicio: t.fecha_inicio, fecha_fin: dias[a.nb] }
        : { fecha_inicio: dias[a.na] }
      const { error } = await supabase.rpc('guardar_tarea_taller', { p_id: t.id, p_datos: datos })
      if (error) { mostrarError(error.message || 'No se pudo mover la actividad.'); pintarDiagrama(); return }
      cargarTareas()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VISTAS Y EVENTOS
    // ═══════════════════════════════════════════════════════════════════════

    const VISTAS = ['tl-vista-lista', 'tl-vista-ficha', 'tl-vista-editor', 'tl-vista-diagrama']
    function mostrarVista(id, subtitulo) {
      estado.vista = id
      for (const v of VISTAS) document.getElementById(v).hidden = v !== id
      document.getElementById('tl-subtitulo').textContent = subtitulo
      document.getElementById('tl-ficha-volver').hidden = id !== 'tl-vista-ficha'
      document.body.classList.toggle('tl-en-ficha', id === 'tl-vista-ficha')
      const diag = id === 'tl-vista-diagrama'
      document.querySelectorAll('[data-pestana]').forEach(b =>
        b.setAttribute('aria-pressed', (b.dataset.pestana === 'diagrama') === diag ? 'true' : 'false'))
      window.scrollTo(0, 0)
    }

    function conectarTodo() {
      document.querySelector('.tl-pestanas').addEventListener('click', ev => {
        const b = ev.target.closest('[data-pestana]')
        if (!b) return
        if (b.dataset.pestana === 'diagrama') mostrarDiagrama()
        else mostrarLista({ recargar: estado.proyectos === null })
      })
      document.getElementById('tl-btn-nuevo').addEventListener('click', () => abrirEditor(null))
      document.getElementById('tl-acciones-extra').addEventListener('click', ev => {
        if (ev.target.closest('#tl-btn-valor-hora')) mostrarValorHora()
      })
      const alFiltrarEstado = ev => {
        const b = ev.target.closest('[data-filtro-estado]')
        if (!b) return
        estado.filtros.estado = b.dataset.filtroEstado
        pintarFiltros(); pintarLista()
        cargarResumenes(filtrarProyectos(estado.proyectos))
      }
      document.getElementById('tl-filtro-estado').addEventListener('click', alFiltrarEstado)
      document.getElementById('tl-filtro-estado-corto').addEventListener('click', alFiltrarEstado)
      document.getElementById('tl-filtro-destino').addEventListener('change', ev => {
        estado.filtros.destino = ev.target.value
        pintarLista(); cargarResumenes(filtrarProyectos(estado.proyectos))
      })
      document.getElementById('tl-filtro-categoria').addEventListener('change', ev => {
        estado.filtros.categoria = ev.target.value
        pintarLista(); cargarResumenes(filtrarProyectos(estado.proyectos))
      })
      document.getElementById('tl-lista').addEventListener('click', ev => {
        if (ev.target.closest('[data-accion="sacar-filtros"]')) {
          estado.filtros = { estado: 'todos', destino: '', categoria: '' }
          pintarFiltros(); pintarLista(); return
        }
        const c = ev.target.closest('[data-proyecto]')
        if (c) abrirFicha(c.dataset.proyecto)
      })
      document.getElementById('tl-lista-aviso').addEventListener('click', ev => {
        if (ev.target.closest('[data-accion="reintentar-lista"]')) cargarProyectos()
      })
      document.getElementById('tl-ficha-volver').addEventListener('click', () => mostrarLista({ recargar: false }))
