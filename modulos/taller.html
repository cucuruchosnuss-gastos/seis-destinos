<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Proyectos Taller — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- PROYECTOS TALLER (28/09/2026; diseño "Proyectos Taller" y el diagrama
       de actividades el 29/09/2026, e2e/disenos/taller).

       El Taller es una unidad que VENDE: a clientes de afuera (máquinas,
       dispositivos, automatizaciones, mantenimientos, horas de trabajo) y a
       las otras fábricas del grupo (trabajos internos con precio). Cada
       proyecto tiene su COSTO (los gastos cargados en Gastos con ese proyecto
       + las horas por el valor de la hora) y su PRECIO, para saber qué rinde
       cada uno.

       Las reglas viven en la base y la pantalla no las repite ni las
       contradice: guardar_proyecto recibe SOLO las claves que cambian (una
       clave con "" borra), precio_venta pide taller:precios, y
       resumen_proyecto / proyectos_taller solo devuelven lo de venta con
       taller:precios.

       QUÉ VE CADA UNO (decisión de Facu del 29/09/2026, que corrige al diseño):
       con taller:ver se ven LOS COSTOS —presupuesto, gastos, costo de las
       horas, costo total, el valor de la hora y "se pasó $ …"—. Lo que pide
       taller:precios es LA VENTA: su precio, lo facturado, lo cobrado, el
       margen y el "precio a la fábrica" de un interno. Sin ese permiso NO HAY
       NINGUNO en la página, ni escondido: todo lo de venta se arma en JS y
       solo con el permiso. Por eso este HTML no nombra ninguna de esas
       palabras (lo exige test-taller.js).

       EL DIAGRAMA DE ACTIVIDADES lo arma quien tiene taller:gestionar (Tomás
       y Edgar): crea, mueve, estira y edita. Quien tiene taller:cargar sin
       gestionar ve y marca SOLO lo suyo. Las horas disponibles se cuentan de
       lunes a sábado, 8 h por día. -->

  <style>
    [hidden] { display: none !important; }

    body {
      overflow-x: hidden;
      /* El color del módulo (verde bosque del diseño; va solo en el ícono y en
         la barra de costo, nunca marca validez). */
      --tl-verde: oklch(0.42 0.07 150);
      --tl-verde-suave: oklch(0.955 0.02 150);
      --tl-barra: oklch(0.52 0.08 150);
      --tl-pista-tabs: #EDE9E3;
      --tl-pista-barra: #EDE9E3;
      --tl-fondo-suave: #FAF8F5;
      --tl-linea: #F3F0EB;
      --tl-bordo-borde: #E8CDD5;
      --tl-gris-chip: #F1EEE9;
      --tl-sombra-modal: 0 30px 60px rgba(0, 0, 0, 0.3);
    }

    .tl-app {
      display: flex; flex-direction: column; gap: 12px;
      padding: 12px 24px calc(18px + env(safe-area-inset-bottom));
      min-height: calc(100dvh - 52px); box-sizing: border-box; min-width: 0;
      font-family: var(--fuente); color: var(--color-texto);
    }
    .tl-titulo-fuente { font-family: var(--fuente-titulo); letter-spacing: -0.02em; }
    .tl-num { font-variant-numeric: tabular-nums; }
    .tl-solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── La cabecera del módulo: ícono, nombre y las dos pestañas ───────── */
    .tl-cabeza { display: flex; align-items: center; gap: 12px; flex-shrink: 0; min-width: 0; flex-wrap: wrap; }
    .tl-cabeza__icono { width: 30px; height: 30px; border-radius: 9px; background: var(--tl-verde-suave); color: var(--tl-verde);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tl-cabeza__nombre { font-family: var(--fuente-titulo); font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    .tl-pestanas { display: flex; gap: 2px; background: var(--tl-pista-tabs); border-radius: 11px; padding: 3px; margin-left: 6px; }
    .tl-pestana { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border-radius: 8px; border: 0; background: transparent;
      color: var(--color-texto-menu); font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .tl-pestana[aria-pressed="true"] { background: #fff; color: var(--naranja-oscuro); font-weight: 700; box-shadow: 0 1px 2px rgba(28, 26, 23, 0.12); }
    .tl-burbuja { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bordo); color: #fff;
      font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .tl-volver-celu { display: none; }

    /* ── Botones (los del diseño) ──────────────────────────────────────── */
    .tl-btn {
      height: 36px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13.5px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; cursor: pointer;
      background: #fff; color: var(--color-texto-menu); border: 1px solid var(--color-borde-boton); touch-action: manipulation;
    }
    .tl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tl-btn:focus-visible, .tl-pestana:focus-visible, .tl-seg__op:focus-visible, .tl-card:focus-visible, .tl-barra-g:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
    .tl-btn--primario { background: var(--naranja); color: #fff; border: 2px solid var(--naranja); }
    .tl-btn--fantasma { background: #fff; color: var(--naranja); border: 2px solid var(--naranja); }
    .tl-btn--link { background: transparent; color: var(--naranja); border: 1px solid transparent; padding: 0 4px; }
    .tl-btn--link-malo { background: transparent; color: var(--bordo); border: 1px solid transparent; padding: 0 4px; }
    .tl-btn--peligro { background: var(--bordo); color: #fff; border: 2px solid var(--bordo); }
    .tl-btn--grande { height: 48px; font-size: 15.5px; padding: 0 18px; border-radius: 11px; font-weight: 800; }
    .tl-btn--chico { height: 30px; padding: 0 10px; font-size: 12.5px; }
    .tl-btn--ancho { width: 100%; }
    .tl-select { height: 36px; padding: 0 30px 0 14px; border-radius: 10px; border: 1px solid var(--color-borde-boton); background: #fff;
      font: inherit; font-size: 13.5px; font-weight: 700; color: var(--color-texto-menu); cursor: pointer; max-width: 100%; }

    /* ── Barra de herramientas y segmentado ────────────────────────────── */
    .tl-tool { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; min-width: 0; }
    .tl-tool__relleno { flex: 1; }
    .tl-seg { display: flex; gap: 2px; background: var(--color-pista); border-radius: 10px; padding: 3px; min-width: 0; overflow-x: auto; }
    .tl-seg__op { height: 30px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--color-texto-menu); display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
    .tl-seg__op[aria-pressed="true"] { background: var(--naranja); color: #fff; font-weight: 700; }
    .tl-seg__n { opacity: 0.75; }
    .tl-seg--corto { display: none; }
    .tl-nota-unidad { font-size: 13px; color: var(--color-texto-2); margin: 0; }

    /* ── Paneles, chips, datos, barras ─────────────────────────────────── */
    .tl-panel { background: #fff; border: 1px solid var(--color-borde); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column;
      gap: 10px; min-width: 0; min-height: 0; overflow: hidden; }
    .tl-panel__cab { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-width: 0; }
    .tl-panel__titulo { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
    .tl-chip { height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center;
      white-space: nowrap; background: var(--tl-gris-chip); color: var(--color-texto-menu); }
    .tl-chip--blanco { background: #fff; color: var(--color-texto); }
    .tl-chip--malo { background: var(--bordo); color: #fff; }
    .tl-chip--en_curso { background: oklch(0.94 0.03 150); color: oklch(0.34 0.06 150); }
    .tl-chip--aprobado { background: #EDE9E3; color: var(--color-texto); }
    .tl-chip--terminado { background: var(--verde-suave); color: var(--verde-oscuro); }
    .tl-chip--entregado { background: #2B2723; color: #fff; }
    .tl-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; }
    .tl-kv__k { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-texto-suave); text-transform: uppercase; line-height: 1.25; }
    .tl-kv__v { font-size: 15px; font-weight: 700; color: var(--color-texto); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.25; margin: 0; }
    .tl-kv__v--grande { font-family: var(--fuente-titulo); font-weight: 800; }
    .tl-kv__v--mal { color: var(--bordo); }
    .tl-kv__v--bien { color: var(--verde-oscuro); }
    .tl-kv__sub { font-size: 12.5px; color: var(--color-texto-2); line-height: 1.25; }
    .tl-kv__sub--mal { color: var(--bordo); }
    .tl-kv__celda { min-width: 0; }
    .tl-rotulo-chico { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--color-texto-suave); }
    .tl-barra { display: flex; flex-direction: column; gap: 6px; }
    .tl-barra__fila { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; }
    .tl-barra__rotulo { font-weight: 600; color: var(--color-texto-menu); min-width: 0; }
    .tl-barra__der { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl-barra__der--mal { color: var(--bordo); }
    .tl-barra__pista { height: 9px; border-radius: 999px; background: var(--tl-pista-barra); overflow: hidden; }
    .tl-barra__lleno { height: 100%; background: var(--tl-barra); border-radius: 999px; }
    .tl-barra--pasado .tl-barra__lleno { background: var(--bordo); }
    .tl-texto-suave { color: var(--color-texto-2); font-size: 13.5px; margin: 0; line-height: 1.4; }
    .tl-error-pegado { color: var(--bordo-oscuro); font-weight: 600; font-size: 13.5px; margin: 0; overflow-wrap: anywhere; }
    .tl-aviso { border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; background: var(--tl-fondo-suave);
      border: 1.5px solid var(--color-divisor); color: var(--color-texto-menu); min-width: 0; }
    .tl-aviso__cuerpo { flex: 1; min-width: 0; line-height: 1.35; }
    .tl-aviso__titulo { font-size: 14.5px; font-weight: 800; margin: 0; overflow-wrap: anywhere; }
    .tl-aviso__texto { font-size: 13.5px; margin: 0; overflow-wrap: anywhere; }
    .tl-aviso--grave { background: var(--bordo-suave); border-color: var(--tl-bordo-borde); color: var(--bordo-oscuro); }
    .tl-aviso__icono { flex-shrink: 0; }

    /* ── La lista: tarjetas en grilla de 3 que llena el alto ───────────── */
    .tl-lista { flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(250px, 1fr); gap: 12px; min-height: 0; }
    .tl-lista--vacia { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); }
    .tl-card { text-align: left; font: inherit; color: var(--color-texto); cursor: pointer; }
    .tl-card--atrasado { border: 1.5px solid var(--tl-bordo-borde); }
    .tl-card__banda { display: flex; align-items: center; gap: 10px; margin: -14px -16px 0; padding: 12px 16px 11px; border-bottom: 3px solid; min-width: 0; }
    .tl-card__nombre { font-family: var(--fuente-titulo); font-size: 17px; font-weight: 700; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
    .tl-card__sub { font-size: 13.5px; margin: 1px 0 0; line-height: 1.2; overflow-wrap: anywhere; }
    .tl-card__txt { flex: 1; min-width: 0; }
    .tl-banda--presupuestado { background: #F1EEE9; border-color: #B8B0A4; }
    .tl-banda--presupuestado .tl-card__sub { color: #6B645A; }
    .tl-banda--aprobado { background: oklch(0.95 0.045 85); border-color: oklch(0.68 0.11 80); }
    .tl-banda--aprobado .tl-card__sub { color: oklch(0.42 0.07 75); }
    .tl-banda--en_curso { background: oklch(0.935 0.04 150); border-color: oklch(0.5 0.08 150); }
    .tl-banda--en_curso .tl-card__sub { color: oklch(0.36 0.05 150); }
    .tl-banda--terminado { background: var(--verde-suave); border-color: var(--verde); }
    .tl-banda--terminado .tl-card__sub { color: var(--verde-oscuro); }
    .tl-banda--entregado { background: #2B2723; border-color: #1C1A17; color: #fff; }
    .tl-banda--entregado .tl-card__sub { color: #D6CFC4; }
    .tl-banda--cancelado { background: #F1EEE9; border-color: #D6CFC4; color: #6B645A; }
    .tl-banda--cancelado .tl-card__sub { color: #9A9287; }
    .tl-banda--atrasado { background: var(--bordo-suave); border-color: var(--bordo); color: var(--bordo-oscuro); }
    .tl-banda--atrasado .tl-card__sub { color: var(--bordo-oscuro); }
    .tl-card__chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tl-esqueleto { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
    .tl-esqueleto > div:nth-child(1) { width: 35%; height: 38px; border-radius: 8px; background: #EDE9E3; }
    .tl-esqueleto > div:nth-child(2) { width: 70%; height: 12px; border-radius: 6px; background: #F1EEE9; }
    .tl-esqueleto > div:nth-child(3) { width: 55%; height: 12px; border-radius: 6px; background: #F5F3EF; }
    .tl-esqueleto > p { font-size: 13px; color: var(--color-texto-suave); margin: 0; }
    .tl-vacio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
    .tl-vacio__icono { width: 64px; height: 64px; border-radius: 18px; background: var(--verde-suave); display: flex; align-items: center; justify-content: center; }
    .tl-vacio__titulo { font-family: var(--fuente-titulo); font-size: 24px; font-weight: 700; margin: 0; }
    .tl-vacio__texto { font-size: 15px; color: var(--color-texto-2); max-width: 460px; line-height: 1.45; margin: 0; }
    .tl-vacio-simple { padding: 2rem 1rem; text-align: center; color: var(--color-texto-2); }

    /* ── La ficha: cabecera arriba, Datos y Plata a la izquierda, pestañas a
       la derecha ─────────────────────────────────────────────────────── */
    #tl-vista-ficha { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    #tl-vista-ficha[hidden] { display: none !important; }
    .tl-ficha { flex: 1 1 auto; display: grid; grid-template-columns: 420px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; min-height: 0; }
    .tl-ficha__cab { grid-column: 1 / -1; }
    .tl-ficha__cab .tl-panel__titulo { font-family: var(--fuente-titulo); font-size: 24px; letter-spacing: -0.01em; }
    .tl-ficha__sub { font-size: 13.5px; color: var(--color-texto-2); margin: 1px 0 0; overflow-wrap: anywhere; }
    .tl-ficha__datos { grid-column: 1; }
    .tl-ficha__plata { grid-column: 1; }
    .tl-ficha__der { grid-column: 2; grid-row: 2 / 4; }
    .tl-ficha__resumen-celu { display: none; }
    .tl-tabs { display: flex; gap: 2px; background: var(--color-pista); border-radius: 10px; padding: 3px; align-self: flex-start; }
    .tl-tab { height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600;
      color: var(--color-texto-menu); cursor: pointer; }
    .tl-tab[aria-pressed="true"] { background: #fff; color: var(--naranja-oscuro); font-weight: 700; box-shadow: 0 1px 2px rgba(28, 26, 23, 0.12); }
    .tl-tabla { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--color-divisor); border-radius: 12px; overflow: hidden; }
    .tl-tabla__cab, .tl-tabla__fila, .tl-tabla__pie { display: grid; gap: 12px; align-items: center; padding: 0 12px; }
    .tl-tabla__cab { min-height: 30px; border-bottom: 1px solid var(--color-divisor); font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em;
      color: var(--color-texto-suave); flex-shrink: 0; white-space: nowrap; }
    .tl-tabla__cuerpo { flex: 1; min-height: 0; overflow: auto; }
    .tl-tabla__fila { min-height: 44px; padding-top: 4px; padding-bottom: 4px; border-bottom: 1px solid var(--tl-linea); font-size: 14px; }
    .tl-tabla__pie { min-height: 44px; background: var(--tl-fondo-suave); border-top: 2px solid var(--color-borde); flex-shrink: 0; }
    .tl-tabla__pie-rot { font-size: 13px; font-weight: 800; color: var(--color-texto-2); white-space: nowrap; }
    .tl-tabla__pie-num { font-family: var(--fuente-titulo); font-size: 17px; font-weight: 800; text-align: right; white-space: nowrap; }
    .tl-c-der { text-align: right; }
    .tl-c-suave { color: var(--color-texto-2); }
    .tl-c-fuerte { font-weight: 700; }
    .tl-c-2 { color: var(--color-texto-menu); }
    .tl-c-min { min-width: 0; overflow-wrap: anywhere; }
    .tl-c-horas { font-family: var(--fuente-titulo); font-size: 16px; font-weight: 800; text-align: right; }
    .tl-c-mal { color: var(--bordo); font-weight: 700; }
    .tl-nota { padding: 10px 12px; border-bottom: 1px solid var(--tl-linea); }
    .tl-nota__texto { font-size: 14.5px; font-weight: 600; margin: 0; overflow-wrap: anywhere; line-height: 1.3; }
    .tl-nota__sub { font-size: 12.5px; color: var(--color-texto-2); margin: 2px 0 0; }
    .tl-campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin: 0; }
    .tl-campo > label, .tl-campo__rotulo { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-texto-suave); text-transform: uppercase; }
    .tl-campo__ayuda { font-size: 12px; color: var(--color-texto-2); }
    .tl-input, .tl-textarea, .tl-campo select {
      width: 100%; min-height: 40px; padding: 8px 11px; box-sizing: border-box; font: inherit; font-size: 14.5px; font-weight: 600;
      color: var(--color-texto); background: #fff; border: 1px solid var(--color-borde); border-radius: 10px;
    }
    .tl-textarea { min-height: 72px; resize: vertical; font-weight: 500; }
    .tl-input:focus, .tl-textarea:focus, .tl-campo select:focus { outline: none; border: 2px solid var(--naranja); padding: 7px 10px; }
    .tl-input--grande { font-family: var(--fuente-titulo); font-size: 20px; font-weight: 800; }
    .tl-fila-campos { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tl-fila-campos--venta { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }
    .tl-acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-acciones--fin { justify-content: flex-end; }
    .tl-archivos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; overflow: auto; min-height: 0; }
    .tl-archivo { display: flex; gap: 10px; align-items: center; border: 1px solid var(--color-divisor); border-radius: 12px; padding: 6px;
      background: #fff; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0; }
    .tl-archivo__vista { width: 92px; height: 54px; border-radius: 8px; flex-shrink: 0; border: 1px solid var(--color-borde);
      background: repeating-linear-gradient(135deg, #EDE9E3 0 8px, #F5F3EF 8px 16px); display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 700; color: var(--color-texto-suave); }
    .tl-archivo__txt { min-width: 0; line-height: 1.3; }
    .tl-archivo__nombre { font-size: 13.5px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
    .tl-archivo__sub { font-size: 12.5px; color: var(--color-texto-2); margin: 0; }
    .tl-archivo__tipo { font-size: 14.5px; font-weight: 800; margin: 0; }
    .tl-buscar { width: 260px; max-width: 100%; height: 36px; border-radius: 10px; background: var(--tl-fondo-suave); border: 1px solid var(--color-divisor);
      display: flex; align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box; }
    .tl-buscar input { border: 0; background: transparent; font: inherit; font-size: 14px; flex: 1; min-width: 0; outline: none; }
    .tl-subir { border: 1px solid var(--color-divisor); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--tl-fondo-suave); }

    /* ── Ventanas (facturar, cargar a la fábrica, valor de la hora) ────── */
    .tl-velo { position: fixed; inset: 0; background: rgba(28, 26, 23, 0.45); z-index: 950; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .tl-ventana { background: #fff; border-radius: 16px; padding: 14px 16px 16px; width: 560px; max-width: 100%; max-height: calc(100dvh - 32px);
      overflow: auto; box-shadow: var(--tl-sombra-modal); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
    .tl-ventana--angosta { width: 520px; }

    <!-- ══ LAS VENTANAS (facturar, horas, anular…): las arma el JS ══════════ -->

    <!-- ══ EL VALOR DE LA HORA: una ventana (lo arma el JS) ═══════════════ -->

  </div>
  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import {
      mostrarError, mostrarExito, enlazarCampoNumero, leerCampoNumero, ponerNumero, formatearNumeroAr,
      cargarFabricaDePruebas, sinUnidadesDePrueba, sinPersonasDePrueba, FABRICA_SIN_DATOS,
    } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'
    import { unidadesDeLaBarra, alCambiarUnidad, inicialesDe, colorPersona } from '../js/barra-unidad.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion: null,
      miEmpleadoId: null,
      miRolApp: null,
      misTareas: new Set(),       // las tareas de 'taller' habilitadas
      unidades: new Map(),        // id → { id, nombre }
      tallerId: null,             // la unidad "Taller"
      fabrica: FABRICA_SIN_DATOS,
      unidadBarra: null,          // la unidad elegida arriba (null = Todas)
      vista: null,
      proyectos: null,            // proyectos_taller(false) (null = todavía no)
      errorProyectos: null,
      turnoLista: 0,
      filtros: { estado: 'todos', destino: '', categoria: '' },
      resumenes: new Map(),       // id → resumen_proyecto (solo con precios; null = no se pudo)
      ficha: null,                // { id, r, error, tab, autores, notaBorrador, notaFoto, archivos, subir, enviando, error* }
      turnoFicha: 0,
      personas: null,             // v_empleados_publico, sin tablets ni prueba ni bajas
      nombres: new Map(),         // id → nombre de TODAS las personas (para "lo cambió", autores)
      clientes: null,             // los clientes de la unidad Taller
      errorClientes: null,
      valorHora: null,            // { lista, error } — lo lee todo el que ve el Taller
      guardandoHora: false,
      errorHora: null,
      editor: null,               // { id, original, destino, guardando }
      modal: null,                // la ventana abierta (facturar, horas, anular…)
      diag: {
        tareas: null, error: null, turno: 0, agrupar: 'operario', rango: '2semanas', desde: null,
        sel: null, panel: null, enviando: false, posiciones: new Map(), dias: [],
      },
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS PROPIOS
    // ═══════════════════════════════════════════════════════════════════════

    // Escape de TODO texto que venga de una persona o de la base antes de
    // meterlo en un innerHTML o en un atributo.
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function limpio(t) {
      return String(t ?? '').replace(/\s+/g, ' ').trim()
    }

    const ZONA_AR = 'America/Argentina/Buenos_Aires'
    // "Hoy" en Argentina, AAAA-MM-DD (no UTC: después de las 21 ya sería mañana).
    function hoyArgentina(ahora = new Date()) {
      return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AR, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ahora)
    }
    // AAAA-MM-DD → dd/mm/aaaa, sin pasar por Date (no se corre de día).
    function fechaCorta(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso ?? ''))
      return m ? `${m[3]}/${m[2]}/${m[1]}` : '—'
    }
    // AAAA-MM-DD → dd/mm.
    function fechaDiaMes(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso ?? ''))
      return m ? `${m[3]}/${m[2]}` : '—'
    }
    // Un momento (timestamptz) en hora argentina: dd/mm hh:mm.
    function momentoCorto(ts) {
      const d = new Date(ts)
      if (!ts || Number.isNaN(d.getTime())) return '—'
      const partes = Object.fromEntries(new Intl.DateTimeFormat('es-AR', {
        timeZone: ZONA_AR, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
      }).formatToParts(d).map(p => [p.type, p.value]))
      return `${partes.day}/${partes.month} ${partes.hour}:${partes.minute}`
    }
    // La fecha argentina de un momento, AAAA-MM-DD.
    function diaDeMomento(ts) {
      const d = new Date(ts)
      return !ts || Number.isNaN(d.getTime()) ? null : hoyArgentina(d)
    }

    // Un número que puede no estar: null / '' / NaN no son un cero.
    function numero(v) {
      if (v === null || v === undefined || v === '') return null
      const n = Number(v)
      return Number.isFinite(n) ? n : null
    }
    // Un importe: un dato ausente dice "—", nunca "$ 0". Sin centavos cuando
    // es redondo (así lo muestra el diseño); con centavos cuando los tiene.
    function importe(v, moneda = 'ARS') {
      const n = numero(v)
      if (n === null) return '—'
      const signo = moneda === 'USD' ? 'US$' : '$'
      const decimales = Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2
      return `${signo} ${formatearNumeroAr(n, { decimales, minimos: decimales })}`
    }
    function cantidadHoras(v) {
      const n = numero(v)
      return n === null ? '—' : formatearNumeroAr(n, { decimales: 2, minimos: 0 })
    }
    function horasTexto(v) {
      const n = numero(v)
      return n === null ? '—' : `${cantidadHoras(n)} h`
    }
    function porcentaje(v) {
      const n = numero(v)
      return n === null ? '—' : `${formatearNumeroAr(Math.round(n), { decimales: 0 })} %`
    }
    function pila(nombre) {
      return String(nombre ?? '').trim().split(/\s+/)[0] || ''
    }

    // ── Fechas del diagrama (siempre en UTC: son días, no momentos) ──────────
    function fechaUTC(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso ?? ''))
      return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null
    }
    function sumarDias(iso, n) {
      const d = fechaUTC(iso)
      if (!d) return null
      d.setUTCDate(d.getUTCDate() + n)
      return d.toISOString().slice(0, 10)
    }
    function diaSemana(iso) {
      const d = fechaUTC(iso)
      return d ? d.getUTCDay() : null
    }
    function lunesDe(iso) {
      const w = diaSemana(iso)
      return w === null ? null : sumarDias(iso, w === 0 ? -6 : 1 - w)
    }
    function diasEntre(a, b) {
      const x = fechaUTC(a), y = fechaUTC(b)
      return x && y ? Math.round((y - x) / 86400000) : null
    }
    const DIA_CORTO = ['DO', 'LU', 'MA', 'MI', 'JU', 'VI', 'SÁ']
    const DIA_MIN = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb']
    const DIA_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado']
    function diaCorto(iso) {
      const w = diaSemana(iso)
      return w === null ? '—' : `${DIA_MIN[w]} ${String(iso).slice(8, 10)}`
    }

    const ESTADOS = [
      ['presupuestado', 'Presupuestado'], ['aprobado', 'Aprobado'], ['en_curso', 'En curso'],
      ['terminado', 'Terminado'], ['entregado', 'Entregado'], ['cancelado', 'Cancelado'],
    ]
    const ETIQUETA_ESTADO = Object.fromEntries(ESTADOS)
    const PLURAL_ESTADO = {
      presupuestado: 'Presupuestados', aprobado: 'Aprobados', en_curso: 'En curso',
      terminado: 'Terminados', entregado: 'Entregados', cancelado: 'Cancelados', atrasados: 'Atrasados',
    }
    const CATEGORIAS = [
      ['maquina', 'Máquina'], ['dispositivo', 'Dispositivo'], ['automatizacion', 'Automatización'],
      ['mantenimiento', 'Mantenimiento'], ['horas', 'Horas'], ['otro', 'Otro'],
    ]
    const ETIQUETA_CATEGORIA = Object.fromEntries(CATEGORIAS)
    const TIPOS_ARCHIVO = [['plano', 'Plano'], ['presupuesto', 'Presupuesto'], ['foto', 'Foto'], ['otro', 'Otro']]
    const ETIQUETA_TIPO = Object.fromEntries(TIPOS_ARCHIVO)
    const PLURAL_TIPO = { plano: 'Planos', presupuesto: 'Presupuestos', foto: 'Fotos' }
    const CERRADOS = new Set(['entregado', 'cancelado'])
    const TOPE_RESUMENES = 24

    // ═══════════════════════════════════════════════════════════════════════
    // PERMISOS — el frontend solo oculta; la barrera real está en el servidor
    // ═══════════════════════════════════════════════════════════════════════

    // Con bypass de super_admin, igual que _puede_taller() en la base.
    function tieneTarea(tarea) {
      return estado.miRolApp === 'super_admin' || estado.misTareas.has(tarea)
    }
    const puedeEntrar = () => ['ver', 'cargar', 'gestionar', 'precios'].some(tieneTarea)
    const puedeCargar = () => tieneTarea('cargar')
    const puedeGestionar = () => tieneTarea('gestionar')
    const puedePrecios = () => tieneTarea('precios')
    // Quien carga sin gestionar ve y marca SOLO lo suyo en el diagrama.
    const soloMias = () => !puedeGestionar() && puedeCargar()

    function esMovil() {
      return typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 760px)').matches
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LA BARRA DE UNIDAD
    // ═══════════════════════════════════════════════════════════════════════

    // Todos los proyectos son del Taller. Con la barra en Todas o en el
    // Taller se ven todos; con OTRA fábrica elegida se ven los trabajos
    // internos que el Taller le hace a esa fábrica (los externos no son de
    // ella). proyectos_taller devuelve el NOMBRE de la fábrica destino, no el
    // id: se compara contra el nombre de la unidad elegida.
    function pasaUnidad(p, unidadId = estado.unidadBarra) {
      if (!unidadId || unidadId === estado.tallerId) return true
      const nombre = estado.unidades.get(unidadId)?.nombre
      return p.destino === 'interno' && !!nombre && p.fabrica_destino === nombre
    }
    function textoNotaUnidad(unidadId = estado.unidadBarra) {
      if (!unidadId || unidadId === estado.tallerId) return ''
      const nombre = estado.unidades.get(unidadId)?.nombre
      return nombre ? `Mostrando los trabajos que el Taller le hace a ${nombre}. Para ver todos, elegí "Todas" o "Taller" arriba.` : ''
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LA LISTA
    // ═══════════════════════════════════════════════════════════════════════

    function porUnidad(lista, unidadId = estado.unidadBarra) {
      return (lista || []).filter(p => pasaUnidad(p, unidadId))
    }
    function pasaEstado(p, filtro) {
      if (!filtro || filtro === 'todos') return true
      if (filtro === 'activos') return !CERRADOS.has(p.estado)
      if (filtro === 'atrasados') return !!p.atrasado && !CERRADOS.has(p.estado)
      return p.estado === filtro
    }
    function filtrarProyectos(lista, filtros = estado.filtros, unidadId = estado.unidadBarra) {
      return porUnidad(lista, unidadId).filter(p =>
        pasaEstado(p, filtros.estado) &&
        (!filtros.destino || p.destino === filtros.destino) &&
        (!filtros.categoria || p.categoria === filtros.categoria))
    }
    // Los números del segmentado: cuántos hay de cada estado entre los que
    // deja ver la barra de unidad (los otros filtros no cambian las cuentas).
    function contarEstados(lista, unidadId = estado.unidadBarra) {
      const base = porUnidad(lista, unidadId)
      const c = { todos: base.length, atrasados: base.filter(p => pasaEstado(p, 'atrasados')).length }
      for (const [v] of ESTADOS) c[v] = base.filter(p => p.estado === v).length
      return c
    }

    function htmlSegmento(opciones, actual, conteo) {
      return opciones.map(([v, t]) =>
        `<button type="button" class="tl-seg__op" data-filtro-estado="${esc(v)}" aria-pressed="${actual === v ? 'true' : 'false'}">${esc(t)}` +
        (conteo ? ` <span class="tl-seg__n">${esc(String(conteo[v] ?? 0))}</span>` : '') + '</button>').join('')
    }
    function htmlSegmentoEstados(conteo, actual) {
      return htmlSegmento([['todos', 'Todos'], ...ESTADOS.map(([v]) => [v, PLURAL_ESTADO[v]])], actual, conteo)
    }
    function htmlSegmentoCorto(conteo, actual) {
      return htmlSegmento([['todos', 'Todos'], ['en_curso', 'En curso'], ['atrasados', 'Atrasados']], actual, conteo)
    }

    function nombreCliente(c) {
      return typeof c === 'string' ? c : (c?.nombre || '')
    }
    // "Carrizo Hnos. SRL · Máquina" o "Interno → Dolce Pasta · Automatización".
    function subProyecto(p) {
      const cat = ETIQUETA_CATEGORIA[p.categoria] || 'Sin categoría'
      return p.destino === 'interno'
        ? `Interno → ${p.fabrica_destino || 'sin fábrica elegida'} · ${cat}`
        : `${nombreCliente(p.cliente) || 'Sin cliente elegido'} · ${cat}`
    }
    // La franja de color de la tarjeta: el estado, o bordó si está atrasado.
    function bandaDe(p) {
      if (p.atrasado && !CERRADOS.has(p.estado)) return 'atrasado'
      return ETIQUETA_ESTADO[p.estado] ? p.estado : 'presupuestado'
    }
    function diasAtraso(fecha, hoy = hoyArgentina()) {
      const n = diasEntre(fecha, hoy)
      return n !== null && n > 0 ? n : 0
    }

    // El avance del costo contra el presupuesto (en %), o null sin presupuesto.
    function avanceCosto(p) {
      const pres = numero(p.presupuesto_costo), costo = numero(p.costo_total)
      if (pres === null || pres <= 0 || costo === null) return null
      return Math.round(1000 * costo / pres) / 10
    }

    function htmlBarraCosto(avance, rotulo = 'Costo') {
      if (avance === null) return ''
      const ancho = Math.max(0, Math.min(100, avance))
      return `<div class="tl-barra__pista${avance > 100 ? ' tl-barra--pasado' : ''}" role="img" aria-label="${esc(rotulo)}: ${esc(porcentaje(avance))}">` +
        `<div class="tl-barra__lleno" style="width:${ancho}%"></div></div>`
    }

    // "Costo $ 4.820.000 de $ 5.200.000 · 93 %", o "se pasó $ …" en bordó.
    // Sin valor de hora: "Costo: solo gastos, sin las horas".
    function htmlCosto(costo, pres, moneda = 'ARS', { sinHora = false, gastado = null } = {}) {
      const pr = numero(pres)
      const c = sinHora ? numero(gastado) : numero(costo)
      if (sinHora) {
        const av = pr !== null && pr > 0 && c !== null ? Math.round(1000 * c / pr) / 10 : 0
        return '<div class="tl-barra' + (av > 100 ? ' tl-barra--pasado' : '') + '"><div class="tl-barra__fila">' +
          '<span class="tl-barra__rotulo">Costo: solo gastos, sin las horas</span>' +
          `<span class="tl-barra__der">${esc(importe(c, moneda))}</span></div>` + htmlBarraCosto(av) + '</div>'
      }
      if (pr === null || pr <= 0) {
        return '<div class="tl-barra"><div class="tl-barra__fila">' +
          `<span class="tl-barra__rotulo">Costo ${esc(importe(c, moneda))} · sin presupuesto de costo</span></div></div>`
      }
      const av = Math.round(1000 * (c ?? 0) / pr) / 10
      const pasado = (c ?? 0) > pr
      return '<div class="tl-barra' + (pasado ? ' tl-barra--pasado' : '') + '"><div class="tl-barra__fila">' +
        `<span class="tl-barra__rotulo">Costo ${esc(importe(c, moneda))} de ${esc(importe(pr, moneda))}</span>` +
        `<span class="tl-barra__der${pasado ? ' tl-barra__der--mal' : ''}">${esc(pasado ? `se pasó ${importe((c ?? 0) - pr, moneda)}` : porcentaje(av))}</span></div>` +
        htmlBarraCosto(av) + '</div>'
    }

    // El rótulo en mayúsculas, salvo la unidad de las horas ("HORAS · 112 h").
    function rotuloKv(rotulo) {
      return String(rotulo ?? '').toLocaleUpperCase('es').replace(/(\d) H\b/g, '$1 h')
    }
    // Las iniciales del círculo de una persona: con un solo nombre, sus dos primeras letras ("Tomás" → "TO").
    function inicialesAvatar(nombre) {
      const p = String(nombre ?? '').trim().split(/\s+/).filter(Boolean)
      if (p.length === 1) return p[0].slice(0, 2).toLocaleUpperCase('es')
      return inicialesDe(nombre)
    }
    // Una celda de "rótulo / valor" (los KV del diseño). Todo escapado.
    function kv(rotulo, valor, { mal = false, bien = false, grande = false, sub = '', subMal = false } = {}) {
      const clases = 'tl-kv__v' + (grande ? ' tl-kv__v--grande' : '') + (mal ? ' tl-kv__v--mal' : '') + (bien ? ' tl-kv__v--bien' : '')
      return `<div class="tl-kv__celda"><div class="tl-kv__k">${esc(rotuloKv(rotulo))}</div><div class="${clases}">${esc(valor)}</div>` +
        (sub ? `<div class="tl-kv__sub${subMal ? ' tl-kv__sub--mal' : ''}">${esc(sub)}</div>` : '') + '</div>'
    }

    function textoCobrado(res, precio, moneda) {
      const c = numero(res?.cobrado)
      if (c === null) return '—'
      const pr = numero(precio)
      return (pr !== null && pr > 0 ? `${porcentaje(100 * c / pr)} · ` : '') + importe(c, moneda)
    }
    // LA VENTA DE LA TARJETA. Solo se llama con taller:precios.
    // proyectos_taller no trae lo facturado ni lo cobrado: sale de
    // resumen_proyecto de cada proyecto (hueco de base, en el traspaso).
    // Mientras llega dice "…"; si no se pudo, "—".
    function htmlVentaTarjeta(p, resumenes = estado.resumenes) {
      const moneda = p.moneda || 'ARS'
      const interno = p.destino === 'interno'
      const tiene = resumenes.has(p.id)
      const res = resumenes.get(p.id)
      const segundo = !tiene ? '…' : (res === null ? '—' : (interno ? importe(res.facturado, moneda) : textoCobrado(res, p.precio_venta, moneda)))
      return '<div class="tl-kv">' +
        kv(interno ? 'Precio a la fábrica' : 'Venta', importe(p.precio_venta, moneda)) +
        kv(interno ? 'Cargado' : 'Cobrado', segundo) + '</div>'
    }

    function htmlTarjetaProyecto(p, ctx = {}) {
      const moneda = p.moneda || 'ARS'
      const banda = bandaDe(p)
      const atr = banda === 'atrasado'
      const hs = numero(p.horas), he = numero(p.horas_estimadas)
      const horas = he !== null ? `${cantidadHoras(hs ?? 0)} de ${cantidadHoras(he)} h` : horasTexto(hs ?? 0)
      const chips = `<span class="tl-chip tl-chip--blanco">${esc(ETIQUETA_ESTADO[p.estado] || p.estado || 'Sin estado')}</span>` +
        (atr ? '<span class="tl-chip tl-chip--malo">Atrasado</span>' : '')
      return `<button type="button" class="tl-panel tl-card${atr ? ' tl-card--atrasado' : ''}" data-proyecto="${esc(p.id)}">` +
        `<div class="tl-card__banda tl-banda--${esc(banda)}"><div class="tl-card__txt"><div class="tl-card__nombre">${esc(p.nombre)}</div>` +
        `<div class="tl-card__sub">${esc(subProyecto(p))}</div></div><div class="tl-card__chips">` + chips + '</div></div>' +
        '<div class="tl-kv">' +
        kv('Entrega prometida', p.fecha_entrega_prometida ? fechaCorta(p.fecha_entrega_prometida) : 'a definir',
          { mal: atr, sub: atr && p.fecha_entrega_prometida ? `atrasado ${diasAtraso(p.fecha_entrega_prometida)} días` : '' }) +
        kv('Horas', horas, { mal: he !== null && hs !== null && hs > he }) + '</div>' +
        htmlCosto(p.costo_total, p.presupuesto_costo, moneda) +
        (ctx.precios ? htmlVentaTarjeta(p, ctx.resumenes || estado.resumenes) : '') +
        '</button>'
    }

    function htmlEsqueletos(cantidad = 6) {
      return Array.from({ length: cantidad }, () =>
        '<div class="tl-panel"><div class="tl-esqueleto"><div></div><div></div><div></div><p>Cargando…</p></div></div>').join('')
    }

    // "No hay proyectos internos cancelados", según los filtros puestos.
    function textoVacio(filtros = estado.filtros) {
      const partes = ['No hay proyectos']
      if (filtros.destino === 'interno') partes.push('internos')
      if (filtros.destino === 'externo') partes.push('externos')
      if (filtros.estado && filtros.estado !== 'todos') partes.push(String(PLURAL_ESTADO[filtros.estado] || filtros.estado).toLowerCase())
      if (filtros.categoria) partes.push(`de ${String(ETIQUETA_CATEGORIA[filtros.categoria] || filtros.categoria).toLowerCase()}`)
      return partes.join(' ')
    }
    const hayFiltros = (f = estado.filtros) => (f.estado && f.estado !== 'todos') || !!f.destino || !!f.categoria

    function htmlLista(lista, error, ctx = {}) {
      if (error || lista === null) return htmlEsqueletos()
      if (!lista.length) {
        const filtros = ctx.filtros || estado.filtros
        const con = hayFiltros(filtros)
        return '<div class="tl-panel tl-vacio"><div class="tl-vacio__icono" aria-hidden="true">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>' +
          `<h2 class="tl-vacio__titulo">${esc(con ? textoVacio(filtros) : 'Todavía no hay proyectos')}</h2>` +
          `<p class="tl-vacio__texto">${esc(con ? 'Probá con otro estado o sacá los filtros.' : 'Cuando se cargue el primer proyecto del Taller, aparece acá.')}</p>` +
          (con ? '<button type="button" class="tl-btn tl-btn--fantasma" data-accion="sacar-filtros">Sacar los filtros</button>' : '') +
          '</div>'
      }
      return lista.map(p => htmlTarjetaProyecto(p, ctx)).join('')
    }

    function htmlAvisoLista(error) {
      if (!error) return ''
      return '<div class="tl-aviso tl-aviso--grave" role="alert"><svg class="tl-aviso__icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>' +
        `<div class="tl-aviso__cuerpo"><p class="tl-aviso__titulo">No se pudo cargar la lista de proyectos</p><p class="tl-aviso__texto">${esc(error)}</p></div>` +
        '<button type="button" class="tl-btn tl-btn--fantasma" data-accion="reintentar-lista">Reintentar</button></div>'
    }

    function pintarFiltros() {
      const f = estado.filtros
      const conteo = estado.proyectos && !estado.errorProyectos ? contarEstados(estado.proyectos) : null
      document.getElementById('tl-filtro-estado').innerHTML = htmlSegmentoEstados(conteo, f.estado)
      document.getElementById('tl-filtro-estado-corto').innerHTML = htmlSegmentoCorto(conteo, f.estado)
      document.getElementById('tl-filtro-destino').value = f.destino
      const sel = document.getElementById('tl-filtro-categoria')
      sel.innerHTML = '<option value="">Categoría: todas</option>' + CATEGORIAS.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')
      sel.value = f.categoria
    }

    function pintarLista() {
      const lista = estado.proyectos === null ? null : filtrarProyectos(estado.proyectos)
      const cont = document.getElementById('tl-lista')
      cont.innerHTML = htmlLista(lista, estado.errorProyectos, { precios: puedePrecios(), resumenes: estado.resumenes })
      cont.classList.toggle('tl-lista--vacia', !!lista && !estado.errorProyectos && !lista.length)
      document.getElementById('tl-lista-aviso').innerHTML = htmlAvisoLista(estado.errorProyectos)
      document.getElementById('tl-cuenta').textContent = lista && !estado.errorProyectos
        ? `${lista.length} ${lista.length === 1 ? 'proyecto' : 'proyectos'}` : ''
      const nota = document.getElementById('tl-nota-unidad')
      nota.textContent = textoNotaUnidad()
      nota.hidden = !nota.textContent
    }

    // El botón del valor de la hora lo ve TODO el que ve el Taller (el valor
    // de la hora es costo, no venta: decisión de Facu del 29/09/2026).
    function textoBotonHora(vh = estado.valorHora) {
      if (!vh || vh.error) return 'Valor de la hora'
      const v = valorVigente(vh.lista)
      return v ? `Valor de la hora · ${importe(v.valor)}` : 'Valor de la hora · sin cargar'
    }
    function pintarAccionesLista() {
      document.getElementById('tl-btn-nuevo').hidden = !puedeGestionar()
      document.getElementById('tl-acciones-extra').innerHTML =
        `<button type="button" class="tl-btn" id="tl-btn-valor-hora">${esc(textoBotonHora())}</button>`
    }

    async function cargarProyectos() {
      const mio = ++estado.turnoLista
      estado.proyectos = null
      estado.errorProyectos = null
      pintarLista()
      const { data, error } = await supabase.rpc('proyectos_taller', { p_solo_activos: false })
      if (mio !== estado.turnoLista) return
      if (error) estado.errorProyectos = 'Puede ser la conexión. ' + (error.message || '')
      else if (data === null) estado.errorProyectos = 'No tenés permiso para ver los proyectos del Taller.'
      estado.proyectos = error || data === null ? [] : (Array.isArray(data) ? data : [])
      if (estado.vista === 'tl-vista-lista') { pintarFiltros(); pintarLista() }
      cargarResumenes(filtrarProyectos(estado.proyectos))
    }

    // Lo facturado y lo cobrado de cada tarjeta (solo con precios).
    async function cargarResumenes(lista) {
      if (!puedePrecios()) return
      const ids = (lista || []).map(p => p.id).filter(id => !estado.resumenes.has(id)).slice(0, TOPE_RESUMENES)
      if (!ids.length) return
      await Promise.all(ids.map(async id => {
        const { data, error } = await supabase.rpc('resumen_proyecto', { p_proyecto_id: id })
        estado.resumenes.set(id, error ? null : (data ?? null))
      }))
      if (estado.vista === 'tl-vista-lista') pintarLista()
    }

    function mostrarLista({ recargar = true } = {}) {
      estado.ficha = null
      mostrarVista('tl-vista-lista', 'Lista')
      pintarAccionesLista()
      pintarFiltros()
      if (recargar || estado.proyectos === null) cargarProyectos()
      else pintarLista()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LA FICHA
    // ═══════════════════════════════════════════════════════════════════════

    // ¿Las horas están sin costo porque falta el valor de la hora? Se deduce
    // del propio resumen (horas cargadas y costo de horas en cero).
    function faltaValorHora(r) {
      return numero(r?.horas) > 0 && (numero(r?.costo_horas) ?? 0) === 0
    }

    // "Carrizo Hnos. SRL · externo · Máquina · entrega prometida 15/10/2026".
    function subFicha(r) {
      const cat = ETIQUETA_CATEGORIA[r.categoria] || 'Sin categoría'
      const entrega = r.fecha_entrega_prometida ? `entrega prometida ${fechaCorta(r.fecha_entrega_prometida)}` : 'entrega a definir'
      return r.destino === 'interno'
        ? `Interno → ${r.fabrica_destino || 'sin fábrica elegida'} · ${cat} · ${entrega}`
        : `${nombreCliente(r.cliente) || 'Sin cliente elegido'} · externo · ${cat} · ${entrega}`
    }

    function htmlChipEstado(r, { blanco = false } = {}) {
      const atr = r.atrasado && !CERRADOS.has(r.estado)
      return `<span class="tl-chip ${blanco ? 'tl-chip--blanco' : `tl-chip--${esc(r.estado)}`}">${esc(ETIQUETA_ESTADO[r.estado] || r.estado || 'Sin estado')}</span>` +
        (atr ? '<span class="tl-chip tl-chip--malo">Atrasado</span>' : '')
    }

    // Facturar al cliente / cargar a la fábrica: solo con taller:precios.
    function htmlBotonVenta(r, ctx) {
      if (!ctx.precios) return ''
      return r.destino === 'interno'
        ? `<button type="button" class="tl-btn tl-btn--primario" data-accion="fabrica"${r.fabrica_destino ? '' : ' disabled title="Elegí la fábrica en Datos"'}>Cargar a la fábrica</button>`
        : `<button type="button" class="tl-btn tl-btn--primario" data-accion="facturar"${r.cliente ? '' : ' disabled title="Elegí el cliente en Datos"'}>Facturar al cliente</button>`
    }

    function htmlFichaCabecera(r, ctx) {
      let botones = `<button type="button" class="tl-btn" data-accion="valor-hora">${esc(textoBotonHora(ctx.valorHora))}</button>`
      if (ctx.precios) {
        botones += htmlBotonVenta(r, ctx)
      } else if (ctx.cargar) {
        botones += '<button type="button" class="tl-btn tl-btn--fantasma" data-accion="horas">+ Cargar horas</button>'
      }
      return '<div class="tl-panel tl-ficha__cab"><div class="tl-panel__cab"><div class="tl-card__txt">' +
        `<div class="tl-panel__titulo">${esc(r.nombre)}</div><p class="tl-ficha__sub">${esc(subFicha(r))}</p></div>` +
        '<div class="tl-card__chips">' + htmlChipEstado(r) + '</div><div class="tl-acciones">' + botones + '</div></div></div>'
    }

    function htmlFichaDatos(r, ctx) {
      const interno = r.destino === 'interno'
      const atr = r.atrasado && !CERRADOS.has(r.estado)
      let h = '<div class="tl-panel tl-ficha__datos"><div class="tl-panel__cab"><h3 class="tl-panel__titulo">Datos</h3>' +
        (ctx.gestionar ? '<button type="button" class="tl-btn tl-btn--link" data-accion="editar">Editar</button>' : '') + '</div>' +
        '<div class="tl-kv">' +
        kv('Tipo', interno ? 'Interno' : 'Externo') +
        kv(interno ? 'Fábrica' : 'Cliente', interno ? (r.fabrica_destino || 'Sin elegir') : (nombreCliente(r.cliente) || 'Sin elegir')) +
        kv('Categoría', ETIQUETA_CATEGORIA[r.categoria] || 'Sin categoría') +
        kv('Entrega prometida', r.fecha_entrega_prometida ? fechaCorta(r.fecha_entrega_prometida) : 'a definir',
          { mal: atr, sub: atr && r.fecha_entrega_prometida ? `atrasado ${diasAtraso(r.fecha_entrega_prometida)} días` : '' }) +
        (r.responsable ? kv('Responsable', r.responsable) : '') +
        (r.fecha_entrega_real ? kv('Entrega real', fechaCorta(r.fecha_entrega_real)) : '') +
        (r.ubicacion ? kv('Ubicación', r.ubicacion) : '') +
        '</div>'
      if (r.descripcion) h += `<p class="tl-texto-suave">${esc(r.descripcion)}</p>`
      if (r.observaciones) h += `<p class="tl-texto-suave">${esc(r.observaciones)}</p>`
      return h + '</div>'
    }

    // LA PLATA. Los COSTOS (presupuesto, gastos, costo de las horas, costo
    // total, valor de la hora, "se pasó") los ve todo el que ve el Taller.
    // Sin taller:precios esta función NO escribe ningún precio, lo facturado,
    // lo cobrado ni el margen, aunque el objeto los traiga.
    function htmlFichaPlata(r, ctx) {
      const moneda = r.moneda || 'ARS'
      const sinHora = faltaValorHora(r)
      const vh = ctx.valorHora
      const vigente = vh && !vh.error ? valorVigente(vh.lista) : null
      let h = '<div class="tl-panel tl-ficha__plata"><div class="tl-panel__cab"><h3 class="tl-panel__titulo">Plata</h3></div>' +
        '<div class="tl-kv">' + kv('Presupuesto de costo', importe(r.presupuesto_costo, moneda), { grande: true }) +
        kv('Horas estimadas', horasTexto(r.horas_estimadas), { grande: true }) + '</div>' +
        htmlCosto(r.costo_total, r.presupuesto_costo, moneda, { sinHora, gastado: r.gastado }) +
        '<div class="tl-kv">' + kv('Gastos', importe(r.gastado, moneda), { grande: true }) +
        (sinHora
          ? kv(`Horas · ${horasTexto(r.horas)}`, 'sin valor de hora', { mal: true, sub: 'Cargá el valor para calcularlo', subMal: true })
          : kv(`Horas · ${horasTexto(r.horas)}`, importe(r.costo_horas, moneda), { grande: true, sub: vigente ? `× ${importe(vigente.valor)} la hora` : '' })) +
        '</div>'
      if (!ctx.precios) {
        return h + '<div class="tl-nota-permiso">Lo que se cobra por este trabajo lo ve quien tiene permiso de precios.</div></div>'
      }
      const interno = r.destino === 'interno'
      const margen = numero(r.margen)
      const textoMargen = sinHora ? 'falta el valor de hora'
        : (margen === null ? '—' : importe(margen, moneda) + (numero(r.margen_pct) !== null ? ` · ${porcentaje(r.margen_pct)}` : ''))
      h += '<div class="tl-rotulo-chico">CON PERMISO DE PRECIOS</div><div class="tl-kv">' +
        kv(interno ? 'Precio a la fábrica' : 'Precio de venta', importe(r.precio_venta, moneda), { grande: true }) +
        kv(interno ? 'Cargado a la fábrica' : 'Facturado', importe(r.facturado, moneda), { grande: true }) +
        (interno ? '' : kv('Cobrado', importe(r.cobrado, moneda), { grande: true, bien: numero(r.cobrado) > 0 })) +
        kv('Margen hoy', textoMargen, { grande: true, mal: sinHora || (margen !== null && margen < 0), bien: !sinHora && margen !== null && margen >= 0 }) +
        '</div>'
      if (!interno && !r.cliente) h += '<p class="tl-texto-suave">Para facturar, elegí el cliente en Datos.</p>'
      if (interno && !r.fabrica_destino) h += '<p class="tl-texto-suave">Para cargarlo a una fábrica, elegila en Datos.</p>'
      return h + '</div>'
    }

    function htmlBarraSimple(rotulo, pct) {
      return '<div class="tl-barra' + (pct !== null && pct > 100 ? ' tl-barra--pasado' : '') + '"><div class="tl-barra__fila">' +
        `<span class="tl-barra__rotulo">${esc(rotulo)}</span><span class="tl-barra__der">${esc(porcentaje(pct))}</span></div>` +
        htmlBarraCosto(pct ?? 0, rotulo) + '</div>'
    }
    // El resumen del celular (6b): costo y horas contra lo previsto.
    function htmlResumenCelu(r, ctx = {}) {
      const quien = r.destino === 'interno' ? `Interno → ${r.fabrica_destino || 'sin fábrica'}` : (nombreCliente(r.cliente) || 'Sin cliente')
      return '<div class="tl-panel tl-ficha__resumen-celu"><div class="tl-panel__cab"><div class="tl-card__txt">' +
        `<div class="tl-c-fuerte">${esc(quien)} · ${esc(ETIQUETA_CATEGORIA[r.categoria] || 'Sin categoría')}</div>` +
        `<p class="tl-ficha__sub">Entrega prometida ${esc(fechaCorta(r.fecha_entrega_prometida))}</p></div>` +
        '<div class="tl-card__chips">' + htmlChipEstado(r) + '</div></div>' +
        htmlBarraSimple('Costo contra presupuesto', numero(r.presupuesto_usado_pct)) +
        htmlBarraSimple('Horas contra lo estimado', numero(r.horas_usadas_pct)) +
        ((ctx.gestionar || ctx.precios) ? '<div class="tl-acciones">' +
          (ctx.gestionar ? '<button type="button" class="tl-btn" data-accion="editar">Editar el proyecto</button>' : '') +
          htmlBotonVenta(r, ctx) + '</div>' : '') + '</div>'
    }

    const PESTANAS_FICHA = [['gastos', 'Gastos'], ['horas', 'Horas'], ['notas', 'Notas'], ['archivos', 'Archivos']]

    // Una tabla con cabecera fija, cuerpo con scroll y pie de totales.
    function htmlTabla(columnas, titulos, filas, pie, vacio) {
      const estilo = `grid-template-columns:${esc(columnas)}`
      return '<div class="tl-tabla">' +
        `<div class="tl-tabla__cab" style="${estilo}">` + titulos.map(([t, der]) => `<span${der ? ' class="tl-c-der"' : ''}>${esc(t)}</span>`).join('') + '</div>' +
        '<div class="tl-tabla__cuerpo">' + (filas.length ? filas.map(f => `<div class="tl-tabla__fila" style="${estilo}">` + f + '</div>').join('')
          : `<p class="tl-texto-suave tl-tabla__vacio">${esc(vacio)}</p>`) + '</div>' +
        (pie ? `<div class="tl-tabla__pie" style="grid-template-columns:1fr auto">` + pie + '</div>' : '') + '</div>'
    }

    function htmlTabGastos(r) {
      const lista = Array.isArray(r.gastos) ? r.gastos : []
      const filas = lista.map(g =>
        `<span class="tl-c-suave">${esc(fechaDiaMes(g.fecha))}</span><span class="tl-c-fuerte tl-c-min">${esc(g.descripcion || 'Gasto')}</span>` +
        `<span class="tl-c-2 tl-c-min">${esc(g.razon_social || '—')}</span><span class="tl-c-der tl-c-fuerte">${esc(importe(g.importe, g.moneda || r.moneda || 'ARS'))}</span>`)
      return '<div class="tl-tool"><p class="tl-texto-suave">Se cargan desde Gastos eligiendo este proyecto. Acá solo se ven.</p><span class="tl-tool__relleno"></span>' +
        '<a class="tl-btn tl-btn--link" href="gastos.html">Cargar un gasto</a></div>' +
        htmlTabla('56px minmax(0,1.4fr) minmax(0,1fr) 120px', [['Fecha'], ['Qué'], ['Proveedor'], ['Importe', true]], filas,
          lista.length ? `<span class="tl-tabla__pie-rot">TOTAL · ${esc(String(lista.length))} ${lista.length === 1 ? 'GASTO' : 'GASTOS'}</span>` +
            `<span class="tl-tabla__pie-num">${esc(importe(r.gastado, r.moneda || 'ARS'))}</span>` : '',
          'Todavía no hay gastos con este proyecto.')
    }

    // El costo de UNA carga de horas: horas × el valor que regía ese día
    // (igual que _valor_hora(fecha) de la base). Sin valor: "sin valor".
    function costoDeHoras(h, vh) {
      if (!vh || vh.error) return { texto: '—', mal: false }
      const v = valorVigente(vh.lista, h.fecha)
      const n = numero(h.horas)
      if (!v) return { texto: 'sin valor', mal: true }
      return { texto: n === null ? '—' : importe(n * Number(v.valor)), mal: false }
    }

    function htmlTabHoras(r, ctx) {
      const lista = Array.isArray(r.horas_detalle) ? r.horas_detalle : []
      const anula = ctx.cargar || ctx.gestionar
      const filas = lista.map(h => {
        const c = costoDeHoras(h, ctx.valorHora)
        return `<span class="tl-c-suave">${esc(fechaDiaMes(h.fecha))}</span><span class="tl-c-fuerte tl-c-min">${esc(h.persona || 'Sin nombre')}</span>` +
          `<span class="tl-c-horas">${esc(horasTexto(h.horas))}</span><span class="tl-c-2 tl-c-min">${esc(h.tarea || '—')}</span>` +
          `<span class="tl-c-der${c.mal ? ' tl-c-mal' : ' tl-c-fuerte'}">${esc(c.texto)}</span>` +
          (anula ? `<span class="tl-c-der"><button type="button" class="tl-btn tl-btn--link-malo tl-btn--chico" data-anular-horas="${esc(h.id)}">Anular</button></span>` : '')
      })
      const total = lista.reduce((s, h) => s + (numero(h.horas) ?? 0), 0)
      const costoTotal = faltaValorHora(r) ? '—' : importe(r.costo_horas, r.moneda || 'ARS')
      // Quien tiene precios tiene "+ Cargar horas" acá; el resto, arriba (y
      // en el celular, siempre acá).
      const boton = ctx.cargar
        ? `<div class="tl-tool${ctx.precios ? '' : ' tl-solo-celu'}"><span class="tl-tool__relleno"></span><button type="button" class="tl-btn tl-btn--fantasma tl-btn--chico" data-accion="horas">+ Cargar horas</button></div>`
        : ''
      return boton + htmlTabla('56px minmax(0,1fr) 56px minmax(0,1.3fr) 96px' + (anula ? ' 72px' : ''),
        [['Fecha'], ['Quién'], ['Horas', true], ['Para qué'], ['Costo', true], ...(anula ? [['']] : [])], filas,
        lista.length ? `<span class="tl-tabla__pie-rot">TOTAL · ${esc(cantidadHoras(total))} h cargadas</span><span class="tl-tabla__pie-num">${esc(costoTotal)}</span>` : '',
        'Todavía no hay horas cargadas.')
    }

    function htmlTabNotas(r, ctx, f) {
      const lista = (Array.isArray(r.notas) ? [...r.notas] : []).sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')))
      let h = ''
      if (ctx.cargar) {
        h += '<div class="tl-campo"><label for="tl-nota-texto">Nueva nota</label>' +
          `<textarea class="tl-textarea tl-textarea--corta" id="tl-nota-texto" maxlength="2000" placeholder="Contá cómo va el proyecto…">${esc(f.notaBorrador || '')}</textarea></div>` +
          '<div class="tl-tool"><button type="button" class="tl-btn" data-accion="nota-foto">Adjuntar foto</button>' +
          '<input type="file" id="tl-nota-foto" accept="image/*" hidden>' +
          (f.notaFoto ? `<span class="tl-texto-suave">${esc(f.notaFoto.name || 'foto')}</span>` : '') +
          '<span class="tl-tool__relleno"></span>' +
          `<button type="button" class="tl-btn tl-btn--primario" data-accion="nota-guardar"${f.enviando ? ' disabled' : ''}>${f.enviando === 'nota' ? 'Guardando…' : 'Agregar nota'}</button></div>` +
          (f.errorNota ? `<p class="tl-error-pegado">${esc(f.errorNota)}</p>` : '')
      }
      h += '<div class="tl-tabla"><div class="tl-tabla__cab" style="grid-template-columns:1fr"><span>BITÁCORA · LO MÁS NUEVO ARRIBA</span></div><div class="tl-tabla__cuerpo">' +
        (lista.length ? lista.map(n => `<div class="tl-nota"><p class="tl-nota__texto">${esc(n.texto)}</p>` +
          `<p class="tl-nota__sub">${esc(n.autor || 'Sin nombre')} · ${esc(momentoCorto(n.fecha))}</p></div>`).join('')
          : '<p class="tl-texto-suave tl-tabla__vacio">Todavía no hay notas.</p>') + '</div></div>'
      return h
    }

    function extensionDe(nombre) {
      const m = /\.([A-Za-z0-9]{1,5})$/.exec(String(nombre || ''))
      return m ? m[1].toUpperCase() : 'archivo'
    }
    function filtrarArchivos(lista, filtro, busca) {
      const b = limpio(busca).toLowerCase()
      return (lista || []).filter(a => (!filtro || filtro === 'todos' || a.tipo === filtro) &&
        (!b || String(a.nombre || '').toLowerCase().includes(b)))
    }
    function htmlGrillaArchivos(lista, autores = new Map()) {
      if (!lista.length) return '<p class="tl-texto-suave">No hay archivos con esta búsqueda.</p>'
      return lista.map(a => {
        const autor = autores.get(a.id)
        const sub = (autor ? `${autor} · ` : '') + fechaDiaMes(diaDeMomento(a.fecha))
        return `<button type="button" class="tl-archivo" data-ver-archivo="${esc(a.id)}">` +
          `<span class="tl-archivo__vista" aria-hidden="true">${esc(a.tipo === 'foto' ? 'foto' : extensionDe(a.nombre))}</span>` +
          `<span class="tl-archivo__txt"><span class="tl-archivo__nombre">${esc(a.nombre || 'Archivo')}</span>` +
          `<span class="tl-archivo__sub">${esc(sub)}</span><span class="tl-archivo__tipo">${esc(ETIQUETA_TIPO[a.tipo] || 'Otro')}</span></span></button>`
      }).join('')
    }

    function htmlTabArchivos(r, ctx, f) {
      const lista = Array.isArray(r.archivos) ? r.archivos : []
      const filtro = f.archivos?.filtro || 'todos'
      const cuenta = t => lista.filter(a => a.tipo === t).length
      const ops = [['todos', 'Todos', lista.length], ...Object.entries(PLURAL_TIPO).map(([t, n]) => [t, n, cuenta(t)])]
      let h = '<div class="tl-tool tl-solo-compu"><label class="tl-buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>' +
        `<span class="tl-solo-lector">Buscar archivo</span><input type="search" id="tl-archivo-buscar" placeholder="Buscar archivo" autocomplete="off" value="${esc(f.archivos?.busca || '')}"></label>` +
        '<div class="tl-seg" role="group" aria-label="Qué archivos">' + ops.map(([v, t, n]) =>
          `<button type="button" class="tl-seg__op" data-filtro-archivo="${esc(v)}" aria-pressed="${filtro === v ? 'true' : 'false'}">${esc(t)} <span class="tl-seg__n">${esc(String(n))}</span></button>`).join('') + '</div></div>'
      if (ctx.cargar) {
        h += '<div class="tl-tool"><button type="button" class="tl-btn tl-btn--primario tl-btn--grande tl-solo-celu" data-accion="archivo-camara">Sacar foto</button>' +
          '<input type="file" id="tl-archivo-camara" accept="image/*" capture="environment" hidden>' +
          '<button type="button" class="tl-btn tl-btn--fantasma" data-accion="archivo-abrir">Subir archivo</button></div>'
        if (f.subir) {
          const tipos = TIPOS_ARCHIVO.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')
          h += '<div class="tl-subir"><div class="tl-fila-campos">' +
            '<div class="tl-campo"><label for="tl-archivo-input">Un plano, un presupuesto o una foto</label>' +
            '<input type="file" class="tl-input" id="tl-archivo-input" accept="image/*,application/pdf,.dwg,.dxf,.xlsx,.xls,.docx,.doc"></div>' +
            '<div class="tl-campo"><label for="tl-archivo-tipo">¿Qué es?</label><select id="tl-archivo-tipo">' + tipos + '</select></div></div>' +
            '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="archivo-cerrar">Cancelar</button>' +
            `<button type="button" class="tl-btn tl-btn--primario" data-accion="archivo-subir"${f.enviando ? ' disabled' : ''}>${f.enviando === 'archivo' ? 'Subiendo…' : 'Subir'}</button></div></div>`
        }
      }
      if (f.errorArchivo) h += `<p class="tl-error-pegado">${esc(f.errorArchivo)}</p>`
      h += '<div class="tl-archivos" id="tl-archivos-grilla">' + (lista.length
        ? htmlGrillaArchivos(filtrarArchivos(lista, filtro, f.archivos?.busca), f.autores || new Map())
        : '<p class="tl-texto-suave">Todavía no hay archivos.</p>') + '</div>'
      return h + '<p class="tl-texto-suave tl-solo-compu">Las fotos se pueden subir desde el celular, con la cámara, en la ficha del proyecto.</p>'
    }

    function htmlFichaPestanas(r, ctx, f) {
      const tab = f.tab || 'gastos'
      const cuerpo = tab === 'horas' ? htmlTabHoras(r, ctx) : tab === 'notas' ? htmlTabNotas(r, ctx, f)
        : tab === 'archivos' ? htmlTabArchivos(r, ctx, f) : htmlTabGastos(r)
      return '<div class="tl-panel tl-ficha__der"><div class="tl-tabs" role="group" aria-label="Qué mirar del proyecto">' +
        PESTANAS_FICHA.map(([v, t]) => `<button type="button" class="tl-tab${v === 'gastos' ? ' tl-tab--gastos' : ''}" data-tab="${esc(v)}" aria-pressed="${tab === v ? 'true' : 'false'}">${esc(t)}</button>`).join('') +
        '</div>' + cuerpo + '</div>'
    }

    function htmlFicha(ficha, ctx) {
      if (ficha.error) return `<div class="tl-aviso tl-aviso--grave tl-ficha__cab">No se pudo leer el proyecto: ${esc(ficha.error)}</div>`
      if (!ficha.r) return '<div class="tl-panel tl-ficha__cab"><div class="tl-esqueleto"><div></div><div></div><p>Cargando…</p></div></div>'
      const r = ficha.r
      return htmlFichaCabecera(r, ctx) + htmlResumenCelu(r, ctx) + htmlFichaDatos(r, ctx) + htmlFichaPlata(r, ctx) + htmlFichaPestanas(r, ctx, ficha)
    }

    function contextoFicha() {
      return { precios: puedePrecios(), cargar: puedeCargar(), gestionar: puedeGestionar(), personas: estado.personas || [], valorHora: estado.valorHora }
    }

    function pintarFicha() {
      const f = estado.ficha
      if (!f) return
      // En el celular no hay pestaña de gastos (6b): arranca en horas.
      if (f.tab === 'gastos' && esMovil()) f.tab = 'horas'
      document.getElementById('tl-ficha-titulo').textContent = f.r?.nombre || 'Proyecto'
      document.getElementById('tl-cabeza-proyecto-nombre').textContent = f.r?.nombre || 'Proyecto'
      document.getElementById('tl-ficha').innerHTML = htmlFicha(f, contextoFicha())
    }

    async function cargarFicha() {
      const f = estado.ficha
      if (!f) return
      const mio = ++estado.turnoFicha
      const [res, arch] = await Promise.all([
        supabase.rpc('resumen_proyecto', { p_proyecto_id: f.id }),
        cargarAutores(f.id),
      ])
      if (mio !== estado.turnoFicha || estado.ficha !== f) return
      if (res.error) { f.error = res.error.message || 'error desconocido'; f.r = null }
      else if (res.data === null) { f.error = 'No tenés permiso para ver este proyecto.'; f.r = null }
      else { f.error = null; f.r = res.data }
      f.autores = arch
      if (f.r && puedePrecios()) estado.resumenes.set(f.id, f.r)
      pintarFicha()
    }

    // Quién subió cada archivo (resumen_proyecto no lo trae; la tabla sí,
    // con taller:ver). Si no se puede leer, los archivos salen sin autor.
    async function cargarAutores(proyectoId) {
      try {
        const { data, error } = await supabase.from('proyecto_archivos').select('id, subido_por').eq('proyecto_id', proyectoId)
        if (error || !Array.isArray(data)) return new Map()
        await asegurarPersonas()
        return new Map(data.filter(a => estado.nombres.has(a.subido_por)).map(a => [a.id, estado.nombres.get(a.subido_por)]))
      } catch { return new Map() }
    }

    function abrirFicha(id, { tab = 'gastos' } = {}) {
      estado.ficha = {
        id, r: null, error: null, tab, autores: new Map(), notaBorrador: '', notaFoto: null,
        archivos: { filtro: 'todos', busca: '' }, subir: false, enviando: false, errorNota: null, errorArchivo: null,
      }
      mostrarVista('tl-vista-ficha', 'Proyecto')
      pintarFicha()
      cargarFicha()
      asegurarPersonas()
    }

    async function accionFicha(accion, boton) {
      const f = estado.ficha
      if (!f || !f.r) return
      if (accion === 'editar') { abrirEditor(f.r); return }
      if (accion === 'valor-hora') { mostrarValorHora(); return }
      if (accion === 'facturar' || accion === 'fabrica') { abrirModalVenta(accion); return }
      if (accion === 'horas') { abrirModalHoras(); return }
      if (accion === 'nota-foto') { document.getElementById('tl-nota-foto')?.click(); return }
      if (accion === 'nota-guardar') { await guardarNota(); return }
      if (accion === 'archivo-abrir') { f.subir = true; f.errorArchivo = null; pintarFicha(); return }
      if (accion === 'archivo-cerrar') { f.subir = false; f.errorArchivo = null; pintarFicha(); return }
      if (accion === 'archivo-camara') { document.getElementById('tl-archivo-camara')?.click(); return }
      if (accion === 'archivo-subir') { await subirDesdePanel(); return }
    }

    async function guardarNota() {
      const f = estado.ficha
      if (!f || f.enviando || !puedeCargar()) return
      const texto = limpio(document.getElementById('tl-nota-texto')?.value ?? f.notaBorrador)
      if (!texto) { f.errorNota = 'Escribí la nota.'; pintarFicha(); return }
      f.enviando = 'nota'; f.errorNota = null; pintarFicha()
      try {
        // La foto va a los archivos del proyecto (las notas no guardan foto).
        if (f.notaFoto) await subirArchivoProyecto(f.notaFoto, 'foto')
        const { error } = await supabase.rpc('agregar_nota_proyecto', { p_proyecto_id: f.id, p_texto: texto })
        if (error) throw new Error(error.message || 'No se pudo guardar la nota.')
        f.enviando = false; f.notaBorrador = ''; f.notaFoto = null
        mostrarExito('Nota agregada.')
        cargarFicha()
      } catch (err) {
        f.enviando = false
        f.errorNota = err.message || 'No se pudo guardar la nota.'
        pintarFicha()
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARCHIVOS — se guarda la RUTA y se firma a 300 s al abrir
    // ═══════════════════════════════════════════════════════════════════════

    const LADO_MAXIMO_FOTO = 2576
    const CALIDAD_JPEG_FOTO = 0.85
    const MAXIMO_BYTES = 15 * 1024 * 1024

    // Un nombre de archivo seguro para la ruta: sin acentos, sin espacios,
    // sin barras ni "..".
    function nombreSeguro(nombre) {
      const base = String(nombre || 'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Za-z0-9._-]+/g, '-').replace(/\.{2,}/g, '.').replace(/^[-.]+/, '').toLowerCase()
      return (base || 'archivo').slice(0, 80)
    }
    function rutaArchivo(proyectoId, nombre, ahora = Date.now()) {
      return `${proyectoId}/${ahora}-${nombreSeguro(nombre)}`
    }
    function tipoSugerido(archivo) {
      return String(archivo?.type || '').startsWith('image/') ? 'foto' : 'otro'
    }

    async function comprimirFoto(archivo) {
      if (!String(archivo.type || '').startsWith('image/') || typeof createImageBitmap !== 'function') return archivo
      try {
        let fuente
        try { fuente = await createImageBitmap(archivo, { imageOrientation: 'from-image' }) } catch { fuente = await createImageBitmap(archivo) }
        const lado = Math.max(fuente.width, fuente.height)
        const escala = lado > LADO_MAXIMO_FOTO ? LADO_MAXIMO_FOTO / lado : 1
        const lienzo = document.createElement('canvas')
        lienzo.width = Math.round(fuente.width * escala)
        lienzo.height = Math.round(fuente.height * escala)
        lienzo.getContext('2d').drawImage(fuente, 0, 0, lienzo.width, lienzo.height)
        if (typeof fuente.close === 'function') fuente.close()
        const blob = await new Promise(r => lienzo.toBlob(r, 'image/jpeg', CALIDAD_JPEG_FOTO))
        if (!blob) return archivo
        return new File([blob], String(archivo.name || 'foto').replace(/\.[^.]*$/, '') + '.jpg', { type: 'image/jpeg' })
      } catch {
        return archivo   // un HEIC que el navegador no decodifica: va el original
      }
    }

    // Sube el archivo al bucket 'proyectos' y lo anota en el proyecto. Tira
    // un Error con el mensaje para la persona.
    async function subirArchivoProyecto(original, tipo) {
      const f = estado.ficha
      const archivo = await comprimirFoto(original)
      if (archivo.size > MAXIMO_BYTES) throw new Error('El archivo pesa más de 15 MB.')
      const ruta = rutaArchivo(f.id, archivo.name)
      const { error: e1 } = await supabase.storage.from('proyectos').upload(ruta, archivo, { contentType: archivo.type || 'application/octet-stream', upsert: false })
      if (e1) throw new Error('No se pudo subir el archivo: ' + (e1.message || 'error desconocido'))
      const { error: e2 } = await supabase.rpc('registrar_archivo_proyecto', { p_proyecto_id: f.id, p_tipo: tipo, p_nombre: original.name || 'archivo', p_ruta: ruta })
      // El archivo quedó subido y la base no lo registró: queda huérfano en
      // el bucket (no se borra solo). Se dice.
      if (e2) throw new Error((e2.message || 'No se pudo registrar el archivo.') + ' El archivo quedó subido pero sin anotarse en el proyecto: volvé a intentar.')
    }

    async function subirYRecargar(original, tipo) {
      const f = estado.ficha
      if (!f || f.enviando || !puedeCargar()) return
      if (!original) { f.errorArchivo = 'Elegí el archivo.'; pintarFicha(); return }
      f.enviando = 'archivo'; f.errorArchivo = null; pintarFicha()
      try {
        await subirArchivoProyecto(original, tipo)
        f.enviando = false; f.subir = false
        mostrarExito('Archivo subido.')
        cargarFicha()
      } catch (err) {
        f.enviando = false
        f.errorArchivo = err.message || 'No se pudo subir.'
        pintarFicha()
      }
    }
    async function subirDesdePanel() {
      const original = document.getElementById('tl-archivo-input')?.files?.[0]
      const tipo = document.getElementById('tl-archivo-tipo')?.value || 'otro'
      await subirYRecargar(original, tipo)
    }

    async function verArchivo(id) {
      const a = (estado.ficha?.r?.archivos || []).find(x => x.id === id)
      if (!a?.ruta) return
      const { data, error } = await supabase.storage.from('proyectos').createSignedUrl(a.ruta, 300)
      if (error || !data?.signedUrl) { mostrarError('No se pudo abrir el archivo: ' + (error?.message || 'sin permiso o no existe')); return }
      window.open(data.signedUrl, '_blank', 'noopener')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LAS VENTANAS (facturar, cargar a la fábrica, horas, anular horas…)
    // ═══════════════════════════════════════════════════════════════════════

    const TIPOS_FACTURA = [['anticipo', 'Anticipo'], ['avance', 'Avance'], ['saldo', 'Saldo final']]

    // Lo que dice la caja de abajo de facturar / cargar a la fábrica.
    function resumenVenta(m, r) {
      const moneda = r?.moneda || 'ARS'
      const precio = numero(r?.precio_venta)
      const hecho = numero(r?.facturado) ?? 0
      const imp = numero(m.importe)
      const nuevo = hecho + (imp !== null && imp > 0 ? imp : 0)
      const falta = precio !== null ? Math.round(100 * (precio - nuevo)) / 100 : null
      const facturar = m.tipo === 'facturar'
      const linea1 = facturar
        ? `Facturado pasa de ${importe(hecho, moneda)} a ${importe(nuevo, moneda)}`
        : `Cargado a ${r?.fabrica_destino || 'la fábrica'} pasa de ${importe(hecho, moneda)} a ${importe(nuevo, moneda)}`
      let linea2
      if (precio === null) linea2 = facturar ? 'El proyecto no tiene precio de venta cargado.' : 'El proyecto no tiene precio a la fábrica cargado.'
      else if (falta > 0) linea2 = `${facturar ? 'Falta facturar' : 'Falta cargar'} ${importe(falta, moneda)} de ${importe(precio, moneda)}`
      else if (falta === 0) linea2 = facturar ? 'Con esto queda facturado todo el precio de venta' : 'Con esto queda cargado todo el precio a la fábrica'
      else linea2 = `Queda ${importe(-falta, moneda)} por encima del precio ${facturar ? 'de venta' : 'a la fábrica'}`
      return { linea1, linea2, falta: precio !== null ? Math.round(100 * (precio - hecho)) / 100 : null }
    }
    function pistaImporte(m, r) {
      const precio = numero(r?.precio_venta), imp = numero(m.importe)
      if (m.tipo === 'fabrica') {
        const falta = resumenVenta({ ...m, importe: null }, r).falta
        if (imp !== null && falta !== null && Math.abs(imp - falta) < 0.005) return 'Lo que falta del precio a la fábrica'
        return precio > 0 && imp > 0 ? `${porcentaje(100 * imp / precio)} del precio a la fábrica` : ''
      }
      return precio > 0 && imp > 0 ? `${porcentaje(100 * imp / precio)} del precio de venta` : ''
    }
    function textoConfirmar(m, r) {
      const imp = numero(m.importe)
      return imp !== null && imp > 0 ? `Confirmar · ${importe(imp, r?.moneda || 'ARS')}` : 'Confirmar'
    }
    // Lo que falta para facturar o cargar a la fábrica (lo mismo que pide la base).
    function faltaVenta(m) {
      if (m.importe === null || m.importe === undefined || !(m.importe > 0)) return 'Poné el importe.'
      if (limpio(m.concepto).length < 3) return 'Poné el concepto (anticipo, avance, saldo final…).'
      return null
    }

    function htmlModalVenta(m, r) {
      const facturar = m.tipo === 'facturar'
      const titulo = facturar ? 'Facturar al cliente' : 'Cargar a la fábrica'
      const sub = `${r.nombre} · ${facturar ? (nombreCliente(r.cliente) || 'sin cliente') : (r.fabrica_destino || 'sin fábrica')}`
      const res = resumenVenta(m, r)
      return '<div class="tl-ventana" role="dialog" aria-modal="true" aria-labelledby="tl-modal-titulo">' +
        `<div><h2 class="tl-ventana__titulo" id="tl-modal-titulo">${esc(titulo)}</h2><p class="tl-ventana__sub">${esc(sub)}</p></div>` +
        (facturar
          ? '<div class="tl-campo"><span class="tl-c-fuerte">¿Qué se factura?</span><div class="tl-opciones" role="radiogroup">' +
            TIPOS_FACTURA.map(([v, t]) => `<button type="button" class="tl-opcion" role="radio" data-tipo-factura="${esc(v)}" aria-checked="${m.clase === v ? 'true' : 'false'}"><span class="tl-opcion__radio"></span><span class="tl-opcion__t">${esc(t)}</span></button>`).join('') +
            '</div></div>'
          : '') +
        '<div class="tl-fila-campos tl-fila-campos--venta">' +
        '<div class="tl-campo"><label for="tl-venta-importe">Importe</label><input type="text" class="tl-input tl-input--grande" id="tl-venta-importe" autocomplete="off">' +
        `<span class="tl-campo__ayuda" id="tl-venta-pista">${esc(pistaImporte(m, r))}</span></div>` +
        `<div class="tl-campo"><label for="tl-venta-concepto">Concepto</label><input type="text" class="tl-input" id="tl-venta-concepto" maxlength="200" autocomplete="off" placeholder="Anticipo, avance, saldo final…" value="${esc(m.concepto || '')}"></div></div>` +
        '<div class="tl-aviso"><svg class="tl-aviso__icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>' +
        `<div class="tl-aviso__cuerpo" id="tl-venta-resumen"><p class="tl-aviso__titulo">${esc(res.linea1)}</p><p class="tl-aviso__texto">${esc(res.linea2)}</p></div></div>` +
        (m.error ? `<p class="tl-error-pegado">${esc(m.error)}</p>` : '') +
        '<div class="tl-acciones tl-acciones--fin"><button type="button" class="tl-btn" data-accion="modal-cerrar">Cancelar</button>' +
