      const ficha = document.getElementById('tl-ficha')
      ficha.addEventListener('click', ev => {
        const f = estado.ficha
        if (!f) return
        const tab = ev.target.closest('[data-tab]')
        if (tab) { f.tab = tab.dataset.tab; pintarFicha(); return }
        const filtro = ev.target.closest('[data-filtro-archivo]')
        if (filtro) { f.archivos.filtro = filtro.dataset.filtroArchivo; pintarFicha(); return }
        const anular = ev.target.closest('[data-anular-horas]')
        if (anular) {
          const h = (f.r?.horas_detalle || []).find(x => String(x.id) === anular.dataset.anularHoras)
          abrirModal({ tipo: 'anular-horas', horasId: anular.dataset.anularHoras,
            texto: h ? `${h.persona || 'Sin nombre'} · ${horasTexto(h.horas)} el ${fechaDiaMes(h.fecha)}` : 'Esas horas', error: null, enviando: false })
          return
        }
        const ver = ev.target.closest('[data-ver-archivo]')
        if (ver) { verArchivo(ver.dataset.verArchivo); return }
        const b = ev.target.closest('[data-accion]')
        if (b && !b.disabled) accionFicha(b.dataset.accion, b)
      })
      ficha.addEventListener('input', ev => {
        const f = estado.ficha
        if (!f) return
        if (ev.target.id === 'tl-nota-texto') f.notaBorrador = ev.target.value
        if (ev.target.id === 'tl-archivo-buscar') {
          f.archivos.busca = ev.target.value
          const grilla = document.getElementById('tl-archivos-grilla')
          if (grilla) grilla.innerHTML = htmlGrillaArchivos(filtrarArchivos(f.r?.archivos, f.archivos.filtro, f.archivos.busca), f.autores)
        }
      })
      ficha.addEventListener('change', ev => {
        const f = estado.ficha
        if (!f) return
        if (ev.target.id === 'tl-archivo-input') {
          const t = document.getElementById('tl-archivo-tipo')
          if (t && ev.target.files?.[0]) t.value = tipoSugerido(ev.target.files[0])
        }
        if (ev.target.id === 'tl-nota-foto') { f.notaFoto = ev.target.files?.[0] || null; pintarFicha() }
        if (ev.target.id === 'tl-archivo-camara' && ev.target.files?.[0]) subirYRecargar(ev.target.files[0], 'foto')
      })
      // Las ventanas.
      const modal = document.getElementById('tl-modal')
      modal.addEventListener('click', ev => {
        if (ev.target === modal) { cerrarModal(); return }
        const tipo = ev.target.closest('[data-tipo-factura]')
        if (tipo) { elegirTipoFactura(tipo.dataset.tipoFactura); return }
        const rapido = ev.target.closest('[data-avance-rapido]')
        if (rapido && estado.modal) { estado.modal.avance = Number(rapido.dataset.avanceRapido); pintarModal(); return }
        const b = ev.target.closest('[data-accion]')
        if (b && !b.disabled) accionModal(b.dataset.accion)
      })
      modal.addEventListener('input', ev => { if (ev.target.id === 'tl-venta-importe') refrescarVenta() })
      const velo = document.getElementById('tl-vista-hora')
      velo.addEventListener('click', ev => {
        if (ev.target === velo || ev.target.closest('#tl-hora-volver')) { cerrarValorHora(); return }
        if (ev.target.closest('#tl-hora-guardar')) guardarValorHora()
      })
      velo.addEventListener('input', ev => {
        if (ev.target.id === 'tl-hora-desde') {
          const nota = document.getElementById('tl-hora-nota')
          if (nota) nota.textContent = textoNotaHora(ev.target.value)
        }
      })
      document.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape') return
        if (estado.modal) { cerrarModal(); return }
        if (!velo.hidden) { cerrarValorHora(); return }
        if (estado.diag.panel && estado.vista === 'tl-vista-diagrama') cerrarPanel()
      })
      // El diagrama.
      const diag = document.getElementById('tl-diagrama')
      diag.addEventListener('click', ev => {
        const agrupar = ev.target.closest('[data-agrupar]')
        if (agrupar) { estado.diag.agrupar = agrupar.dataset.agrupar; pintarDiagrama(); return }
        const persona = ev.target.closest('[data-act-persona]')
        if (persona && estado.diag.panel) { leerPanelAct(); estado.diag.panel.persona = persona.dataset.actPersona; pintarDiagrama(); return }
        const bar = ev.target.closest('.tl-barra-g')
        // El mouse y el dedo abren al soltar (terminarArrastre); el teclado
        // (Enter o espacio) llega como un click sin puntero.
        if (bar) { if (ev.detail === 0) abrirPanel(bar.dataset.tarea); return }
        const b = ev.target.closest('[data-accion]')
        if (b && !b.disabled) accionDiagrama(b.dataset.accion, b)
      })
      diag.addEventListener('change', ev => {
        if (ev.target.id === 'tl-diag-rango') { estado.diag.rango = ev.target.value; pintarDiagrama(); cargarTareas() }
        if (['tl-act-desde', 'tl-act-hasta'].includes(ev.target.id) && estado.diag.panel) { leerPanelAct(); pintarDiagrama() }
      })
      diag.addEventListener('pointerdown', empezarArrastre)
      diag.addEventListener('pointermove', moverArrastre)
      diag.addEventListener('pointerup', terminarArrastre)
      diag.addEventListener('pointercancel', () => { arrastre = null; pintarDiagrama() })
      // El editor.
      document.getElementById('tl-editor-volver').addEventListener('click', () => {
        const id = estado.editor?.id
        estado.editor = null
        if (id) abrirFicha(id); else mostrarLista({ recargar: false })
      })
      document.getElementById('tl-ed-destino').addEventListener('click', ev => {
        const b = ev.target.closest('[data-destino]')
        if (!b || !estado.editor) return
        estado.editor.destino = b.dataset.destino
        pintarDestinoEditor()
      })
      document.getElementById('tl-ed-cliente-nuevo').addEventListener('click', () => {
        document.getElementById('tl-ed-cliente-form').hidden = false
        document.getElementById('tl-ed-cliente-nombre').focus()
      })
      document.getElementById('tl-ed-cliente-cancelar').addEventListener('click', () => { document.getElementById('tl-ed-cliente-form').hidden = true })
      document.getElementById('tl-ed-cliente-guardar').addEventListener('click', guardarClienteRapido)
      document.getElementById('tl-ed-guardar').addEventListener('click', guardarEditor)
      enlazarCampoNumero(document.getElementById('tl-ed-presupuesto'), { decimales: 2 })
      enlazarCampoNumero(document.getElementById('tl-ed-horas'), { decimales: 2 })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    async function cargarPermisos() {
      const { data: emp, error } = await supabase
        .from('empleados').select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.miEmpleadoId = emp.id
      estado.miRolApp = emp.rol_app
      const { data: tareas, error: e2 } = await supabase
        .from('empleado_tareas').select('tarea')
        .eq('empleado_id', emp.id).eq('modulo', 'taller').eq('habilitado', true)
      if (e2) throw e2
      estado.misTareas = new Set((tareas ?? []).map(t => t.tarea))
      const { data: unidades, error: e3 } = await supabase
        .from('unidades_negocio').select('id, nombre').eq('activo', true).order('nombre')
      if (e3) throw e3
      estado.unidades = new Map((unidades ?? []).map(u => [u.id, u]))
      // La base identifica al Taller por su nombre (guardar_proyecto,
      // guardar_cliente): la pantalla usa el mismo criterio.
      estado.tallerId = [...estado.unidades.values()].find(u => u.nombre === 'Taller')?.id ?? null
    }

    function sinAcceso(texto) {
      document.getElementById('tl-cargando').hidden = true
      const el = document.getElementById('tl-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    // ?proyecto=<uuid> abre ese proyecto; ?vista=diagrama abre el diagrama.
    function leerLinkDirecto(search = window.location.search) {
      const id = new URLSearchParams(search).get('proyecto')
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '') ? id : null
    }
    function leerVistaDirecta(search = window.location.search) {
      return new URLSearchParams(search).get('vista') === 'diagrama' ? 'diagrama' : null
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      const fabrica = cargarFabricaDePruebas(supabase)
      const barra = unidadesDeLaBarra().catch(() => ({ elegida: null }))
      try {
        const [, f, b] = await Promise.all([cargarPermisos(), fabrica, barra])
        estado.fabrica = f
        estado.unidadBarra = b?.elegida ?? null
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }
      if (!puedeEntrar()) { sinAcceso('No tenés acceso a Proyectos Taller. Te llevamos al inicio…'); return }
      document.getElementById('tl-cargando').hidden = true
      conectarTodo()
      alCambiarUnidad(({ elegida }) => {
        estado.unidadBarra = elegida ?? null
        if (estado.vista === 'tl-vista-lista') { pintarFiltros(); pintarLista(); cargarResumenes(filtrarProyectos(estado.proyectos)) }
      })
      // El valor de la hora (para el botón y el costo de cada hora) y el
      // diagrama (para la burbuja de la pestaña), en paralelo.
      cargarValorHora().then(() => {
        if (estado.vista === 'tl-vista-lista') pintarAccionesLista()
        if (estado.vista === 'tl-vista-ficha') pintarFicha()
      })
      asegurarPersonas()
      const directo = leerLinkDirecto()
      const vista = leerVistaDirecta()
      if (directo || vista) history.replaceState(null, '', window.location.pathname)
      if (vista === 'diagrama') { cargarProyectosEnSilencio(); mostrarDiagrama() }
      else {
        mostrarLista()
        cargarTareas()
        if (directo) abrirFicha(directo)
      }
      if (window.lucide) window.lucide.createIcons()
    }

    init()
  </script>
