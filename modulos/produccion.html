<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Producción — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- PRODUCCIÓN (22/09/2026). La tablet de la fábrica, en modo kiosco.

       Cómo trabaja la fábrica, y es lo que manda sobre el diseño:
       1. El ENCARGADO abre el turno: quién es, qué turno, qué máquinas
          arrancan y con qué operario. Cada máquina abierta recibe su LOTE.
       2. Recién ahí esas máquinas le aparecen al MASERO en la sala de masa.
       3. Al terminar, el encargado cierra la planilla de CADA máquina: la
          hora en que se apagó el fuego, el scrap y lo producido EN ORDEN. Cada
          renglón es un SUBLOTE (7023-1, 7023-2…), el número que se sella en la
          caja; suma al stock de producto terminado.
       4. Una máquina que sigue al turno siguiente se vuelve a abrir: es un
          lote nuevo.

       Todas las reglas de fondo (el origen de la masa, el descuento de los
       lotes, el sublote, quién puede figurar como encargado o masero) viven en
       la base. La pantalla no las repite ni las contradice. -->

  <style>
    [hidden] { display: none !important; }

    body {
      overflow-x: hidden;
      --borde-tarjeta:  rgba(26, 42, 82, 0.10);
      --sombra-tarjeta: 0 1px 2px rgba(26, 42, 82, 0.05);
      --pr-texto-secundario: #4a5670;
      /* Tablet: todo más grande. Botones de 56 px como mínimo y texto de 18 px
         o más, porque se usa de pie, con guantes o harina en las manos. */
      --pr-alto-boton: 56px;
      font-size: 18px;
    }

    .pr-app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem calc(2rem + env(safe-area-inset-bottom));
      min-width: 0;
    }

    /* ── Cabecera ─────────────────────────────────────────────────────── */
    .pr-header {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.875rem 1rem; margin: 0.75rem 0 1rem;
      background: var(--color-fondo); border-radius: var(--radio-tarjeta);
      border: 1px solid var(--borde-tarjeta); box-shadow: var(--sombra-tarjeta);
    }
    .pr-header__volver {
      display: inline-flex; align-items: center; min-height: var(--pr-alto-boton);
      padding: 0 0.75rem; color: var(--color-acento); font-weight: 600;
      text-decoration: none; border-radius: var(--radio-boton);
    }
    .pr-header__col { display: flex; flex-direction: column; min-width: 0; flex: 1 1 12rem; }
    .pr-header__marca { font-size: 0.8rem; color: var(--pr-texto-secundario); font-weight: 600; letter-spacing: 0.02em; }
    .pr-header__titulo { font-size: 1.35rem; font-weight: 800; color: var(--color-texto); }
    .pr-header__punto { color: var(--azul); font-size: 0.8em; }
    .pr-header__contexto { font-size: 1rem; color: var(--pr-texto-secundario); overflow-wrap: anywhere; }
    .pr-header__acciones { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* ── Botones ──────────────────────────────────────────────────────── */
    .pr-btn {
      min-height: var(--pr-alto-boton); padding: 0 1.25rem;
      font: inherit; font-size: 1.125rem; font-weight: 700;
      border-radius: var(--radio-boton); border: 2px solid var(--azul);
      background: var(--azul); color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      text-align: center; touch-action: manipulation;
    }
    .pr-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .pr-btn--secundario { background: var(--color-fondo); color: var(--azul-oscuro); }
    .pr-btn--peligro { background: var(--bordo); border-color: var(--bordo); color: #fff; }
    .pr-btn--ancho { width: 100%; }
    .pr-btn--grande { min-height: 80px; font-size: 1.35rem; }

    /* ── Tarjetas y avisos ────────────────────────────────────────────── */
    .pr-tarjeta {
      background: var(--color-fondo); border-radius: var(--radio-tarjeta);
      border: 1px solid var(--borde-tarjeta); box-shadow: var(--sombra-tarjeta);
      padding: 1.25rem; margin-bottom: 1rem; min-width: 0;
    }
    .pr-titulo { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.75rem; color: var(--color-texto); }
    .pr-subtitulo { font-size: 1.2rem; font-weight: 700; margin: 1rem 0 0.5rem; color: var(--color-texto); }
    .pr-texto-suave { color: var(--pr-texto-secundario); }
    .pr-vacio { padding: 2rem 1rem; text-align: center; font-size: 1.2rem; color: var(--pr-texto-secundario); }
    .pr-aviso {
      padding: 0.875rem 1rem; border-radius: var(--radio-input); margin: 0.75rem 0;
      background: var(--color-superficie); border-left: 5px solid var(--color-acento-gris);
      color: var(--color-texto); font-size: 1.05rem;
    }
    .pr-aviso--grave { background: var(--bordo-suave); border-left-color: var(--bordo); color: var(--bordo-oscuro); font-weight: 600; }

    /* ── Grillas de botones grandes (modo, unidad, "¿Quién sos?") ─────── */
    .pr-grilla {
      display: grid; gap: 0.875rem;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
    }
    .pr-opcion {
      min-height: 88px; padding: 1rem; font: inherit; font-size: 1.3rem; font-weight: 700;
      text-align: left; border-radius: var(--radio-tarjeta); cursor: pointer;
      border: 2px solid var(--borde-tarjeta); background: var(--color-fondo); color: var(--color-texto);
      box-shadow: var(--sombra-tarjeta); display: flex; flex-direction: column; justify-content: center; gap: 0.25rem;
      overflow-wrap: anywhere; touch-action: manipulation;
    }
    .pr-opcion:focus-visible, .pr-btn:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
    .pr-opcion__detalle { font-size: 1rem; font-weight: 500; color: var(--pr-texto-secundario); }
    .pr-opcion--modo { min-height: 120px; border-color: var(--azul); }
    .pr-opcion--modo .pr-opcion__titulo { color: var(--azul-oscuro); font-size: 1.45rem; }

    /* La persona que está usando la tablet, siempre a la vista. */
    .pr-persona {
      display: inline-flex; align-items: center; min-height: var(--pr-alto-boton); padding: 0 1rem;
      border-radius: var(--radio-boton); background: var(--azul-suave); color: var(--azul-oscuro);
      font-weight: 700; overflow-wrap: anywhere;
    }

    /* El menú de la tablet: un panel que se despliega bajo la cabecera. */
    .pr-menu { display: grid; gap: 0.625rem; }
    .pr-menu .pr-btn { justify-content: flex-start; }

    @media (max-width: 600px) {
      .pr-header__acciones { width: 100%; }
      .pr-header__acciones .pr-btn, .pr-header__acciones .pr-persona { flex: 1 1 auto; }
    }
  </style>
</head>

<body class="pagina-modulo">
  <div class="pr-app">

    <header class="pr-header">
      <a href="../dashboard.html" class="pr-header__volver" id="pr-volver-dashboard" title="Volver al dashboard">&lsaquo; Volver</a>
      <div class="pr-header__col">
        <span class="pr-header__marca">Seis Destinos</span>
        <span class="pr-header__titulo">Producción <span class="pr-header__punto">&#9679;</span> <span id="pr-header-seccion">Tablet</span></span>
        <span class="pr-header__contexto" id="pr-header-contexto"></span>
      </div>
      <div class="pr-header__acciones" id="pr-header-acciones">
        <span class="pr-persona" id="pr-persona-actual" hidden></span>
        <!-- Siempre visible mientras haya alguien elegido: en la fábrica la
             tablet pasa de mano en mano y no hay contraseña en esta versión. -->
        <button type="button" class="pr-btn" id="pr-btn-cambiar-persona" hidden>Cambiar de persona</button>
        <button type="button" class="pr-btn pr-btn--secundario" id="pr-btn-menu" aria-expanded="false" aria-controls="pr-menu" hidden>Menú</button>
      </div>
    </header>

    <nav class="pr-tarjeta pr-menu" id="pr-menu" hidden aria-label="Menú de la tablet">
      <button type="button" class="pr-btn pr-btn--secundario" data-menu="modo">Cambiar el modo de esta tablet</button>
      <button type="button" class="pr-btn pr-btn--secundario" data-menu="unidad" id="pr-menu-unidad">Cambiar de unidad</button>
      <a class="pr-btn pr-btn--secundario" href="../dashboard.html" id="pr-menu-dashboard">Volver al inicio de la app</a>
    </nav>

    <!-- Sin ninguna de las tres tareas no hay nada que mostrar: se dice y se
         vuelve al dashboard. El frontend solo oculta: la barrera real son las
         policies y las RPCs. -->
    <div class="pr-vacio" id="pr-sin-acceso" hidden></div>
    <div class="pr-vacio" id="pr-cargando">Cargando…</div>

    <main id="pr-vista" hidden>
      <section class="pr-tarjeta" id="pr-inicio">
        <h1 class="pr-titulo">Producción</h1>
        <p class="pr-texto-suave" id="pr-inicio-texto"></p>
      </section>

      <!-- B2: la unidad, si la cuenta puede cargar en más de una. Se elige una
           vez y se recuerda en esta tablet. -->
      <section class="pr-tarjeta" id="pr-elegir-unidad" hidden>
        <h1 class="pr-titulo">¿En qué fábrica está esta tablet?</h1>
        <div class="pr-grilla" id="pr-unidades"></div>
      </section>

      <!-- B2: el modo del equipo. Se recuerda en esta tablet y se cambia desde
           el menú. -->
      <section class="pr-tarjeta" id="pr-elegir-modo" hidden>
        <h1 class="pr-titulo">¿Para qué se usa esta tablet?</h1>
        <div class="pr-grilla">
          <button type="button" class="pr-opcion pr-opcion--modo" data-modo="produccion">
            <span class="pr-opcion__titulo">Producción (encargado)</span>
            <span class="pr-opcion__detalle">Abrir y cerrar turnos, paradas y lo producido</span>
          </button>
          <button type="button" class="pr-opcion pr-opcion--modo" data-modo="masa">
            <span class="pr-opcion__titulo">Sala de masa (masero)</span>
            <span class="pr-opcion__detalle">Registrar las masas de las máquinas abiertas</span>
          </button>
        </div>
      </section>

      <!-- B2: "¿Quién sos?". Cada vez que alguien empieza a usar la tablet. -->
      <section class="pr-tarjeta" id="pr-quien" hidden>
        <h1 class="pr-titulo">¿Quién sos?</h1>
        <div id="pr-quien-aviso"></div>
        <div class="pr-grilla" id="pr-quien-lista"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { mostrarError, mostrarExito } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion: null,
      miEmpleadoId: null,
      miRolApp: null,
      // Tareas de produccion habilitadas: tarea → alcance (jsonb o null).
      misTareas: new Map(),
      // Todas las unidades activas: id → nombre.
      unidades: new Map(),
      // La tablet: en qué unidad está, en qué modo, y quién la está usando.
      unidadId: null,
      unidadesPosibles: [],
      modo: null,          // 'produccion' | 'masa'
      persona: null,       // { id, nombre }
      personal: [],        // lo que devuelve personal_produccion
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS PROPIOS
    // ═══════════════════════════════════════════════════════════════════════

    // Escape de TODO texto que venga de una persona o de la base antes de
    // meterlo en un innerHTML. Cada módulo tiene el suyo.
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PERMISOS — el frontend solo oculta; la barrera real está en el servidor
    // ═══════════════════════════════════════════════════════════════════════

    const TAREAS_PRODUCCION = ['cargar', 'ver', 'configurar']

    // Con bypass de super_admin, igual que tiene_tarea() en la base.
    function tieneTarea(tarea) {
      return estado.miRolApp === 'super_admin' || estado.misTareas.has(tarea)
    }
    const puedeEntrar = () => TAREAS_PRODUCCION.some(tieneTarea)

    // Las unidades donde la persona tiene esa tarea, con la MISMA regla que
    // tiene_tarea_alcance(): super_admin todas; {"todas": true} todas; si no,
    // las de {"unidades": [...]}. Solo unidades activas. No hay una vista
    // v_mis_unidades_* para producción, así que se resuelve acá — si la regla
    // del servidor cambia, esto tiene que cambiar con ella.
    function unidadesCon(tarea) {
      const activas = [...estado.unidades.keys()]
      if (estado.miRolApp === 'super_admin') return activas
      if (!estado.misTareas.has(tarea)) return []
      const alcance = estado.misTareas.get(tarea)
      if (alcance && alcance.todas === true) return activas
      const lista = Array.isArray(alcance?.unidades) ? alcance.unidades.map(String) : []
      return activas.filter(id => lista.includes(id))
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PREFERENCIAS DE ESTA TABLET (localStorage, siempre con try/catch)
    // ═══════════════════════════════════════════════════════════════════════

    const CLAVE_MODO = 'produccion.modo'
    const CLAVE_UNIDAD = 'produccion.unidad'

    // Qué puesto responde "¿Quién sos?" en cada modo.
    const PUESTO_DE_MODO = { produccion: 'encargado', masa: 'masero' }
    const TITULO_DE_MODO = { produccion: 'Producción', masa: 'Sala de masa' }
    const PLURAL_PUESTO = { encargado: 'encargados', masero: 'maseros', operario: 'operarios' }

    // En un navegador privado, sin espacio o con el sitio bloqueado,
    // localStorage puede tirar: la tablet sigue andando, solo que no recuerda.
    function leerPreferencia(clave) {
      try { return localStorage.getItem(clave) } catch { return null }
    }
    function guardarPreferencia(clave, valor) {
      try {
        if (valor == null) localStorage.removeItem(clave)
        else localStorage.setItem(clave, valor)
      } catch { /* sin memoria: se vuelve a preguntar la próxima vez */ }
    }

    function modoGuardado() {
      const m = leerPreferencia(CLAVE_MODO)
      return Object.prototype.hasOwnProperty.call(PUESTO_DE_MODO, m ?? '') ? m : null
    }

    // Con una sola unidad posible no se pregunta nada. Con varias, la que se
    // eligió antes en esta tablet si todavía es posible; si no, hay que elegir.
    function unidadInicial(candidatas, guardada) {
      if (candidatas.length === 1) return candidatas[0]
      if (guardada && candidatas.includes(guardada)) return guardada
      return null
    }

    // ═══════════════════════════════════════════════════════════════════════
    // "¿QUIÉN SOS?"
    // ═══════════════════════════════════════════════════════════════════════

    // Las personas que pueden responder para un puesto. Si la unidad tiene a
    // alguien con ese puesto, SOLO esas (la base exige lo mismo: abrir_turnos
    // rechaza a quien no figure como encargado y registrar_masa a quien no
    // figure como masero, cuando la unidad los tiene configurados). Si nadie
    // tiene el puesto, todo el personal activo, con un aviso.
    function personasParaPuesto(personal, puesto) {
      const lista = Array.isArray(personal) ? personal : []
      const conPuesto = lista.filter(p => Array.isArray(p.puestos) && p.puestos.includes(puesto))
      if (conPuesto.length) return { personas: conPuesto, sinConfigurar: false }
      return { personas: lista, sinConfigurar: true }
    }

    function htmlBotonPersona(p) {
      const otra = p.misma_unidad === false ? '<span class="pr-opcion__detalle">De otra unidad</span>' : ''
      return `<button type="button" class="pr-opcion" data-persona="${esc(p.id)}"><span>${esc(p.nombre)}</span>${otra}</button>`
    }

    function htmlAvisoPuestos(sinConfigurar, puesto) {
      if (!sinConfigurar) return ''
      return `<div class="pr-aviso">Esta unidad todavía no tiene ${esc(PLURAL_PUESTO[puesto] ?? puesto)} configurados, así que aparece todo el personal. Pedí que los carguen en Configuración → Personal.</div>`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // NAVEGACIÓN
    // ═══════════════════════════════════════════════════════════════════════

    const VISTAS = ['pr-inicio', 'pr-elegir-unidad', 'pr-elegir-modo', 'pr-quien']

    function mostrarVista(id) {
      for (const v of VISTAS) document.getElementById(v).hidden = v !== id
      cerrarMenu()
      pintarCabecera()
      if (window.scrollTo) window.scrollTo(0, 0)
    }

    function pintarCabecera() {
      const partes = []
      if (estado.unidadId) partes.push(estado.unidades.get(estado.unidadId) ?? 'Unidad')
      if (estado.modo) partes.push(TITULO_DE_MODO[estado.modo])
      document.getElementById('pr-header-contexto').textContent = partes.join(' · ')
      document.getElementById('pr-header-seccion').textContent = estado.modo ? TITULO_DE_MODO[estado.modo] : 'Tablet'
      const chip = document.getElementById('pr-persona-actual')
      chip.textContent = estado.persona ? estado.persona.nombre : ''
      chip.hidden = !estado.persona
      document.getElementById('pr-btn-cambiar-persona').hidden = !estado.persona
      document.getElementById('pr-btn-menu').hidden = !tieneTarea('cargar')
      document.getElementById('pr-menu-unidad').hidden = estado.unidadesPosibles.length < 2
    }

    function cerrarMenu() {
      document.getElementById('pr-menu').hidden = true
      document.getElementById('pr-btn-menu').setAttribute('aria-expanded', 'false')
    }

    function alternarMenu() {
      const menu = document.getElementById('pr-menu')
      menu.hidden = !menu.hidden
      document.getElementById('pr-btn-menu').setAttribute('aria-expanded', menu.hidden ? 'false' : 'true')
    }

    // El orden de las preguntas: unidad → modo → persona → el modo.
    function siguientePaso() {
      if (!estado.unidadId) return mostrarElegirUnidad()
      if (!estado.modo) return mostrarVista('pr-elegir-modo')
      if (!estado.persona) return mostrarQuien()
      return entrarAlModo()
    }

    function mostrarElegirUnidad() {
      document.getElementById('pr-unidades').innerHTML = estado.unidadesPosibles
        .map(id => `<button type="button" class="pr-opcion" data-unidad="${esc(id)}">${esc(estado.unidades.get(id) ?? id)}</button>`)
        .join('')
      mostrarVista('pr-elegir-unidad')
    }

    function elegirUnidad(id) {
      if (!estado.unidadesPosibles.includes(id)) return
      estado.unidadId = id
      estado.persona = null
      guardarPreferencia(CLAVE_UNIDAD, id)
      siguientePaso()
    }

    function elegirModo(modo) {
      if (!Object.prototype.hasOwnProperty.call(PUESTO_DE_MODO, modo)) return
      estado.modo = modo
      // Cambiar de modo cambia quién puede responder "¿Quién sos?".
      estado.persona = null
      guardarPreferencia(CLAVE_MODO, modo)
      siguientePaso()
    }

    async function mostrarQuien() {
      const lista = document.getElementById('pr-quien-lista')
      const aviso = document.getElementById('pr-quien-aviso')
      lista.innerHTML = '<p class="pr-texto-suave">Cargando el personal…</p>'
      aviso.innerHTML = ''
      mostrarVista('pr-quien')
      try {
        const { data, error } = await supabase.rpc('personal_produccion', { p_unidad_negocio_id: estado.unidadId })
        if (error) throw error
        estado.personal = data ?? []
      } catch (err) {
        console.error('personal_produccion:', err)
        lista.innerHTML = '<button type="button" class="pr-btn" id="pr-quien-reintentar">Reintentar</button>'
        aviso.innerHTML = '<div class="pr-aviso pr-aviso--grave">No se pudo cargar el personal. Revisá la conexión.</div>'
        return
      }
      const puesto = PUESTO_DE_MODO[estado.modo]
      const { personas, sinConfigurar } = personasParaPuesto(estado.personal, puesto)
      aviso.innerHTML = htmlAvisoPuestos(sinConfigurar, puesto)
      lista.innerHTML = personas.length
        ? personas.map(htmlBotonPersona).join('')
        : '<p class="pr-texto-suave">No hay personal activo para elegir.</p>'
    }

    function elegirPersona(id) {
      const p = estado.personal.find(x => x.id === id)
      if (!p) return
      estado.persona = { id: p.id, nombre: p.nombre }
      siguientePaso()
    }

    function cambiarDePersona() {
      estado.persona = null
      siguientePaso()
    }

    function accionDelMenu(que) {
      if (que === 'modo') {
        estado.modo = null
        estado.persona = null
        guardarPreferencia(CLAVE_MODO, null)
      } else if (que === 'unidad') {
        estado.unidadId = null
        estado.persona = null
        guardarPreferencia(CLAVE_UNIDAD, null)
      }
      siguientePaso()
    }

    // Lo que se ve una vez que se sabe unidad, modo y persona.
    function entrarAlModo() {
      document.getElementById('pr-inicio-texto').textContent =
        `${TITULO_DE_MODO[estado.modo]} — ${estado.persona?.nombre ?? ''}`
      mostrarVista('pr-inicio')
    }

    // Las unidades donde esta cuenta carga y que tienen alguna máquina activa.
    // Si ninguna tiene máquinas, todas las de carga (así se ve el aviso de que
    // falta configurarlas, en vez de una pantalla vacía).
    async function unidadesDeCarga() {
      const permitidas = unidadesCon('cargar')
      if (!permitidas.length) return []
      const { data, error } = await supabase.from('maquinas').select('unidad_negocio_id')
        .eq('activa', true).in('unidad_negocio_id', permitidas)
      if (error) throw error
      const con = new Set((data ?? []).map(m => m.unidad_negocio_id))
      const conMaquinas = permitidas.filter(id => con.has(id))
      return conMaquinas.length ? conMaquinas : permitidas
    }

    function conectarTodo() {
      document.getElementById('pr-unidades').addEventListener('click', ev => {
        const b = ev.target.closest('[data-unidad]'); if (b) elegirUnidad(b.dataset.unidad)
      })
      document.getElementById('pr-elegir-modo').addEventListener('click', ev => {
        const b = ev.target.closest('[data-modo]'); if (b) elegirModo(b.dataset.modo)
      })
      document.getElementById('pr-quien-lista').addEventListener('click', ev => {
        if (ev.target.closest('#pr-quien-reintentar')) { mostrarQuien(); return }
        const b = ev.target.closest('[data-persona]'); if (b) elegirPersona(b.dataset.persona)
      })
      document.getElementById('pr-btn-cambiar-persona').addEventListener('click', cambiarDePersona)
      document.getElementById('pr-btn-menu').addEventListener('click', alternarMenu)
      document.getElementById('pr-menu').addEventListener('click', ev => {
        const b = ev.target.closest('[data-menu]'); if (b) accionDelMenu(b.dataset.menu)
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    // Sin permiso se dice y se vuelve al dashboard: quedarse en una pantalla
    // vacía no le dice a nadie por qué no ve nada.
    function sinAcceso(texto) {
      document.getElementById('pr-cargando').hidden = true
      const el = document.getElementById('pr-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    async function cargarPermisos() {
      const { data: emp, error } = await supabase
        .from('empleados').select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.miEmpleadoId = emp.id
      estado.miRolApp = emp.rol_app
      const { data: tareas, error: e2 } = await supabase
        .from('empleado_tareas').select('tarea, alcance')
        .eq('empleado_id', emp.id).eq('modulo', 'produccion').eq('habilitado', true)
      if (e2) throw e2
      estado.misTareas = new Map((tareas ?? []).map(t => [t.tarea, t.alcance ?? null]))
      const { data: unidades, error: e3 } = await supabase
        .from('unidades_negocio').select('id, nombre').eq('activo', true).order('nombre')
      if (e3) throw e3
      estado.unidades = new Map((unidades ?? []).map(u => [u.id, u.nombre]))
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      try {
        await cargarPermisos()
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }
      if (!puedeEntrar()) {
        sinAcceso('No tenés acceso a Producción. Te llevamos al inicio…')
        return
      }
      document.getElementById('pr-cargando').hidden = true
      document.getElementById('pr-vista').hidden = false
      conectarTodo()
      if (window.lucide) window.lucide.createIcons()

      // Sin produccion:cargar no es una tablet: es alguien de la oficina que
      // mira el historial o configura.
      if (!tieneTarea('cargar')) {
        document.getElementById('pr-inicio-texto').textContent = 'Tu usuario puede ver o configurar Producción, pero no cargar desde la tablet.'
        mostrarVista('pr-inicio')
        return
      }
      try {
        estado.unidadesPosibles = await unidadesDeCarga()
      } catch (err) {
        console.error('No se pudieron leer las máquinas:', err)
        document.getElementById('pr-inicio-texto').textContent = 'No se pudieron leer las máquinas. Revisá la conexión y recargá la página.'
        mostrarVista('pr-inicio')
        return
      }
      estado.unidadId = unidadInicial(estado.unidadesPosibles, leerPreferencia(CLAVE_UNIDAD))
      estado.modo = modoGuardado()
      siguientePaso()
    }

    init()
  </script>
</body>
