<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    body {
      overflow-x: hidden;
      --violeta:        #6E56CF;
      --violeta-suave:  #F1EDFC;
      --violeta-oscuro: #5B45AD;
    }

    /* Cualquier regla de autor con display (.empleados-toolbar/-stats,
       .bloque-importar acá; .btn en main.css) le gana al [hidden] del
       user-agent — bug conocido del proyecto (ver CLAUDE.md). Esta regla
       restaura la semántica de hidden para todo el archivo. */
    [hidden] { display: none !important; }

    /* ── Stats ─────────────────────────────────────────────────────────────── */

    .empleados-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .stat-card {
      min-width: 0;
      border-radius: 18px;
      padding: 1.125rem 1.25rem;
    }

    .stat-card--principal {
      background: linear-gradient(135deg, var(--violeta), var(--violeta-oscuro));
      color: #fff;
      box-shadow: 0 8px 24px rgba(91,79,163,0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .stat-card--secundario {
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stat-card__label {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .stat-card--secundario .stat-card__label {
      opacity: 1;
      color: var(--color-texto-suave);
    }

    .stat-card__valor {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0.25rem;
    }

    .stat-card--secundario .stat-card__valor {
      color: var(--color-texto);
    }

    .stat-card__submetrics {
      display: none;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .stat-card__submetric {
      background: #fff;
      border-radius: 12px;
      padding: 0.5rem 0.75rem;
      text-align: center;
    }

    .stat-card__submetric-label {
      font-size: 0.5625rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
    }

    .stat-card__submetric-valor {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-acento);
      margin-top: 0.125rem;
    }

    @media (max-width: 640px) {
      .stat-card--secundario { display: none; }
      .stat-card__submetrics { display: flex !important; }
      .empleados-stats { grid-template-columns: 1fr; }
    }

    /* ── Toolbar: buscador + importar Excel ───────────────────────────────── */

    .empleados-toolbar {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .empleados-toolbar__buscar {
      flex: 1;
      min-width: 180px;
    }

    #filtro-busqueda-empleados {
      width: 100%;
      height: 38px;
      padding: 0 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: 999px;
      font-family: var(--fuente);
      font-size: 0.8125rem;
      background: var(--color-fondo);
      color: var(--color-texto);
      outline: none;
    }

    #filtro-busqueda-empleados:focus {
      border-color: var(--violeta);
    }

    .bloque-importar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
      background: var(--violeta-suave);
      border: 1px dashed var(--violeta);
      border-radius: 12px;
      padding: 0.375rem 0.625rem 0.375rem 0.75rem;
      flex-shrink: 0;
    }

    .bloque-importar__icono {
      display: flex;
      align-items: center;
      color: var(--violeta);
      flex-shrink: 0;
      cursor: help;
    }

    .bloque-importar__icono svg { width: 16px; height: 16px; }

    .bloque-importar select {
      height: 30px;
      max-width: 150px;
      padding: 0 0.5rem;
      border: 1.5px solid var(--color-borde);
      border-radius: 999px;
      font-family: var(--fuente);
      font-size: 0.75rem;
      background: var(--color-fondo);
      color: var(--color-texto);
      outline: none;
    }

    @media (max-width: 640px) {
      .bloque-importar select { max-width: 110px; }
    }

    /* ── Grupos y filas ────────────────────────────────────────────────────── */

    .grupo-empleados { margin-bottom: 1.5rem; }

    .grupo-empleados__titulo {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-texto-suave);
      margin-bottom: 0.5rem;
    }

    .grupo-empleados__punto {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--violeta);
      flex-shrink: 0;
    }

    .grupo-empleados__contador { font-weight: 500; }

    .lista-accesos {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* .tarjeta-empleado--incompleta y __alerta son modificadores propios de
       Empleados, se aplican junto con .tarjeta-lista. */
    .tarjeta-empleado--incompleta {
      border: 1.5px dashed var(--violeta);
    }

    .tarjeta-empleado__alerta {
      width: 16px;
      height: 16px;
      color: var(--violeta);
      flex-shrink: 0;
    }

    /* Ajustes locales sobre la card compartida: texto blanco en el avatar
       (iniciales), y el título necesita min-width:0 + flex:1 porque acá vive
       dentro de .acceso__fila1 (flex), no como bloque suelto — sin esto el
       truncado con ellipsis no funciona (los hijos flex no encogen por
       debajo de su contenido si no se les fuerza min-width:0). */
    .tarjeta-lista__avatar { color: #fff; }
    .tarjeta-lista__titulo { min-width: 0; flex: 1; }

    /* .acceso__avatar/__nombre/__email siguen existiendo tal cual: además de
       la card las usa el modal de ficha (#ficha-avatar/#ficha-nombre/
       #ficha-email), que no se toca en esta migración. */
    .acceso__avatar {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .acceso__fila1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .acceso__nombre {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--color-texto);
    }

    .acceso__email {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
      margin-top: 0.125rem;
    }

    .chip-rol {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .chip-rol--usuario     { background: var(--color-superficie); color: var(--color-texto-suave); }
    .chip-rol--admin       { background: var(--color-acento-suave); color: var(--color-acento); }
    .chip-rol--super_admin { background: var(--violeta-suave); color: var(--violeta-oscuro); }

    .chip-sin-acceso {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      background: var(--color-superficie);
      color: var(--color-texto-suave);
    }

    .chip-modulo {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      background: #fff;
      color: var(--violeta-oscuro);
      font-size: 0.6875rem;
      font-weight: 600;
    }

    /* ── Modal ficha ───────────────────────────────────────────────────────── */

    #modal-ficha {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #modal-ficha[hidden] { display: none; }

    #modal-ficha__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17,17,17,0.45);
    }

    #modal-ficha__panel {
      position: relative;
      background: var(--color-fondo);
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.25rem 1.5rem;
    }

    @media (min-width: 641px) {
      #modal-ficha { align-items: center; }
      #modal-ficha__panel {
        max-width: 440px;
        border-radius: 20px;
        box-shadow: var(--sombra-hover);
      }
    }

    .modal-ficha__cerrar {
      position: absolute;
      top: 0.875rem;
      right: 0.875rem;
    }

    .modal-ficha__usuario {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0 1.25rem;
    }

    .modal-ficha__seccion-titulo {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-texto-suave);
      margin: 1rem 0 0.5rem;
    }

    .ficha-campo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--color-borde);
      font-size: 0.875rem;
      gap: 0.75rem;
    }

    .ficha-campo:last-child { border-bottom: none; }

    .ficha-campo span:first-child { color: var(--color-texto-suave); }
    .ficha-campo span:last-child  { color: var(--color-texto); font-weight: 500; text-align: right; }

    .ficha-acceso__caja {
      background: var(--violeta-suave);
      border-radius: 12px;
      padding: 0.875rem 1rem;
    }

    .ficha-acceso__fila1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--violeta-oscuro);
    }

    .ficha-acceso__modulos {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.625rem;
    }

    .ficha-sin-modulos, .ficha-sin-acceso {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
    }

    /* PIN de producción. El chip usa los colores del SISTEMA (gris / ámbar /
       verde) y no el violeta del módulo: dice un estado, no de qué pantalla es.
       Mismos tres estados y mismos nombres que la configuración de Producción. */
    .ficha-pin__caja {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .chip-pin {
      display: inline-block;
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .chip-tablet {
      display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em;
      background: var(--color-superficie); color: var(--color-texto);
      border: 1px solid var(--color-borde);
    }
    .tarjeta-empleado__avatar-tablet { background: var(--color-texto); color: #fff; }
    .tarjeta-empleado__avatar-tablet svg { width: 1.125rem; height: 1.125rem; }
    .chip-pin--gris   { background: var(--color-superficie);  color: var(--color-texto-suave); }
    .chip-pin--alerta { background: var(--amarillo-suave);    color: var(--amarillo-oscuro); }
    .chip-pin--ok     { background: var(--verde-suave);       color: var(--verde-oscuro); }

    .ficha-pin__caja .btn {
      width: auto;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .ficha-pin__panel {
      margin-top: 0.75rem;
      background: var(--color-superficie);
      border-radius: 12px;
      padding: 0.875rem 1rem;
    }

    .ficha-pin__ayuda {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
      margin: 0 0 0.625rem;
    }

    /* El PIN es un IDENTIFICADOR, no una cantidad: el campo es type="text" y
       NUNCA pasa por enlazarCampoNumero, que le metería separador de miles. */
    .ficha-pin__panel input {
      width: 100%;
      padding: 0.6875rem 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-input);
      background: var(--color-fondo);
      font-family: var(--fuente);
      font-size: 1.125rem;
      letter-spacing: 0.3em;
      color: var(--color-texto);
      outline: none;
    }

    /* El error va PEGADO al botón que lo provoca, nunca en un banner arriba. */
    .ficha-pin__error {
      font-size: 0.8125rem;
      color: var(--rojo);
      margin-top: 0.625rem;
    }

    /* ── Dar de baja / Reactivar (28/09/2026) ─────────────────────────────
       "Dado de baja" es un ESTADO, no un error: el chip va neutro, igual que
       el de la tablet. El bordó queda solo para la consecuencia que hay que
       leer antes de confirmar ("Pierde el acceso a la app al instante"). */
    .chip-baja {
      display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em;
      background: var(--color-superficie); color: var(--color-texto);
      border: 1px solid var(--color-borde); flex-shrink: 0;
    }

    .empleados-toolbar__bajas {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0 0.25rem;
      font-size: 0.8125rem;
      color: var(--color-texto);
      cursor: pointer;
      flex-shrink: 0;
    }
    .empleados-toolbar__bajas input {
      width: 1.125rem; height: 1.125rem; margin: 0;
      accent-color: var(--violeta);
    }
    .empleados-toolbar__bajas-n { color: var(--color-texto-suave); }

    .ficha-baja__caja {
      background: var(--color-superficie);
      border-radius: 12px;
      padding: 0.875rem 1rem;
      margin-bottom: 0.25rem;
    }
    .ficha-baja__fila1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .ficha-baja__fila1 .btn {
      width: auto;
      min-height: 44px;
      padding: 0.375rem 0.875rem;
      font-size: 0.8125rem;
      font-weight: 600;
    }
    .ficha-baja__dato {
      font-size: 0.8125rem;
      color: var(--color-texto);
      margin-top: 0.375rem;
      overflow-wrap: anywhere;
    }
    .ficha-baja__dato--suave { color: var(--color-texto-suave); }

    #ficha-baja { margin-top: 1.25rem; }
    .ficha-baja__boton {
      width: 100%;
      min-height: 44px;
      color: var(--bordo-oscuro);
      border-color: var(--bordo);
    }
    .ficha-baja__panel {
      margin-top: 0.75rem;
      background: var(--color-superficie);
      border-radius: 12px;
      padding: 0.875rem 1rem;
    }
    .ficha-baja__titulo {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-texto);
      margin: 0 0 0.375rem;
      overflow-wrap: anywhere;
    }
    .ficha-baja__ayuda {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
      margin: 0 0 0.625rem;
    }
    .ficha-baja__alerta {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--bordo-oscuro);
      background: var(--bordo-suave);
      border-left: 3px solid var(--bordo);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      margin: 0 0 0.75rem;
    }
    .ficha-baja__panel label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-texto);
      margin-bottom: 0.375rem;
    }
    .ficha-baja__panel input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: 0.6875rem 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-input);
      background: var(--color-fondo);
      font-family: var(--fuente);
      font-size: 0.9375rem;
      color: var(--color-texto);
      outline: none;
    }
    .ficha-baja__panel input[type="text"]:focus { border-color: var(--violeta); }
    /* El error de la base va PEGADO a los botones, tal cual. */
    .ficha-baja__error {
      font-size: 0.8125rem;
      color: var(--rojo);
      margin-top: 0.625rem;
      overflow-wrap: anywhere;
    }
    .ficha-baja__panel .modal-ficha__form-acciones { margin-top: 0.75rem; }
    .ficha-baja__panel .modal-ficha__form-acciones .btn { min-height: 44px; }

    #ficha-datos-laborales .grupo-campo { margin-bottom: 0.75rem; }
    #ficha-datos-laborales select {
      width: 100%;
      padding: 0.6875rem 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-input);
      background: var(--color-fondo);
      font-family: var(--fuente);
      font-size: 0.9375rem;
      color: var(--color-texto);
      outline: none;
    }

    #ficha-acciones {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      margin-top: 1.5rem;
    }

    #ficha-acciones .btn { width: 100%; text-align: center; }

    .modal-ficha__form-acciones {
      display: flex;
      gap: 0.625rem;
      margin-top: 0.5rem;
    }

    .modal-ficha__form-acciones .btn { flex: 1; }
  </style>
  <!-- La barra lateral de la compu (desde 1024 px): js/barra-lateral.js. Es un
       módulo: corre después de armar la página. -->
  <script type="module" src="../js/barra-lateral.js"></script>
  <!-- La barra de unidad de negocio, arriba (js/barra-unidad.js, 28/09/2026). -->
  <script type="module" src="../js/barra-unidad.js"></script>
  <!-- Esta pantalla no filtra por unidad: la barra lo dice en chico. -->
  <meta name="sd-unidad" content="no-filtra">
</head>
<body class="pagina-modulo">

  <header style="position:sticky; top:0; z-index:20; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(255,255,255,0.72); border-bottom:1px solid var(--color-borde); display:flex; align-items:center; justify-content:space-between; padding:0.875rem 1.25rem;">
    <a href="../dashboard.html" class="btn btn--icono" title="Volver al dashboard">‹ Volver</a>
    <div>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <img src="../logo.png" alt="" style="width:20px; height:20px; object-fit:contain;">
        <span style="font-size:0.6875rem; font-weight:700; letter-spacing:0.08em; color:var(--color-texto-suave); text-transform:uppercase;">Seis Destinos</span>
      </div>
      <div style="font-size:1.375rem; font-weight:700; letter-spacing:-0.02em; color:var(--color-texto); display:flex; align-items:center; gap:0.375rem;">
        Empleados <span style="color:var(--violeta); font-size:1rem; line-height:1;">●</span>
      </div>
    </div>
  </header>

  <div class="vista-lista__contenedor" style="max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 3rem;">

    <div class="empleados-stats" id="empleados-stats" hidden></div>

    <div class="empleados-toolbar" id="empleados-toolbar">
      <div class="empleados-toolbar__buscar" id="empleados-toolbar-buscar">
        <input type="text" id="filtro-busqueda-empleados" placeholder="🔍 Buscar empleado…">
      </div>
      <!-- Apagado por defecto: los dados de baja no aparecen salvo que se
           tilde. Se dibuja solo si hay alguno (ver renderizarListado). -->
      <label class="empleados-toolbar__bajas" id="empleados-toolbar-bajas" hidden>
        <input type="checkbox" id="filtro-mostrar-bajas">
        <span>Mostrar dados de baja</span>
        <span class="empleados-toolbar__bajas-n" id="contador-bajas"></span>
      </label>
      <div class="bloque-importar" id="bloque-importar" hidden>
        <span class="bloque-importar__icono" title="Naaloo entrega un Excel por empresa — elegí cuál es antes de subirlo">
          <i data-lucide="upload"></i>
        </span>
        <select id="select-empresa-import"></select>
        <input type="file" id="input-excel" accept=".xlsx,.xls" hidden>
        <button type="button" class="btn btn--secundario" id="btn-elegir-excel" style="width:auto; padding:0.375rem 0.75rem; font-size:0.75rem;">Subir Excel</button>
      </div>
    </div>

    <div id="lista-empleados"></div>
    <div id="estado-vacio-empleados" class="estado-vacio" hidden>
      <div class="estado-vacio__icono">👥</div>
      <div class="estado-vacio__titulo">No hay empleados activos cargados</div>
    </div>

    <div id="estado-cargando" class="estado-vacio">
      <div class="spinner"></div>
      <p class="estado-vacio__descripcion">Cargando…</p>
    </div>

  </div>

  <!-- Modal: Ficha de empleado -->
  <div id="modal-ficha" hidden>
    <div id="modal-ficha__backdrop"></div>
    <div id="modal-ficha__panel">
      <button type="button" class="btn btn--icono modal-ficha__cerrar" id="btn-cerrar-ficha" title="Cerrar">✕</button>
      <h2>Ficha de empleado</h2>

      <div class="modal-ficha__usuario">
        <div class="acceso__avatar" id="ficha-avatar"></div>
        <div>
          <div class="acceso__nombre" id="ficha-nombre"></div>
          <div class="acceso__email" id="ficha-email"></div>
        </div>
      </div>

      <!-- Si la persona está DADA DE BAJA: cuándo, quién, el motivo y
           "Reactivar". Vacío para una persona activa (ver renderizarBaja). -->
      <div id="ficha-estado-baja"></div>

      <div class="modal-ficha__seccion-titulo">Datos · Naaloo</div>
      <div id="ficha-datos-naaloo"></div>

      <div class="modal-ficha__seccion-titulo">Datos laborales</div>
      <div id="ficha-datos-laborales"></div>

      <div class="modal-ficha__seccion-titulo" style="display:flex; align-items:center; justify-content:space-between;">
        <span>Contacto de emergencia</span>
        <button type="button" class="btn btn--secundario" id="btn-editar-contacto" style="width:auto; padding:0.25rem 0.625rem; font-size:0.6875rem; text-transform:none; letter-spacing:normal; font-weight:600;" hidden>Editar</button>
      </div>
      <div id="ficha-contacto-emergencia"></div>

      <div class="modal-ficha__seccion-titulo">Acceso a la app</div>
      <div id="ficha-acceso"></div>

      <!-- PIN de producción. El TÍTULO de la sección se dibuja adentro de este
           contenedor a propósito: así, cuando la base dice que no hay nada que
           mostrar, el innerHTML queda vacío y la sección entera desaparece —
           un título solo, sin contenido, sería peor que no tener la sección. -->
      <div id="ficha-pin"></div>

      <div id="ficha-acciones"></div>

      <!-- "Dar de baja", al final y separado: es la única acción de la ficha
           que saca a la persona de todas las listas. Vacío si no corresponde. -->
      <div id="ficha-baja"></div>
    </div>
  </div>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { mostrarError, mostrarExito, formatearFecha, cargarFabricaDePruebas, sinUnidadesDePrueba, sinPersonasDePrueba, FABRICA_SIN_DATOS } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO GLOBAL
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion:          null,
      miEmpleado:      null,
      empleados:       [],
      empleadoModulos: [],
      maestros:        { unidadesNegocio: [] },
      fichaAbierta:    null,
      modoEdicionFicha: false,
      modoEdicionContacto: false,
      // mostrarBajas: el interruptor "Mostrar dados de baja", apagado por
      // defecto (los dados de baja no aparecen salvo que se tilde).
      filtros:         { busqueda: '', mostrarBajas: false },
      // Nombres por id de TODAS las personas (activas y dadas de baja), de
      // v_empleados_publico: para decir quién dio de baja a alguien aunque
      // esa persona sea de una unidad que quien mira no lee en `empleados`.
      // Es un mapa para BUSCAR un nombre, nunca una lista para elegir.
      nombres:         new Map(),
      // El panel de "Dar de baja" / "Reactivar" de la ficha abierta.
      // panel: null | 'baja' | 'reactivar'. error: el mensaje de la base TAL
      // CUAL, que se dibuja pegado a los botones.
      baja: { empleadoId: null, panel: null, motivo: '', enviando: false, error: null },
      misTareasEmpleados: new Set(), // tareas granulares en empleado_tareas (modulo='empleados')
      // La fábrica de pruebas (unidad "Pruebas (robot)" y sus personas). Ver
      // unidadesVisibles() / personasVisibles(). Arranca sin datos: si no se
      // pudo leer, los filtros no sacan nada.
      fabrica:         FABRICA_SIN_DATOS,
      // PIN de producción de la persona de la ficha. `datos` es lo que
      // devolvió estado_pin_produccion(): null = no hay nada que mostrar.
      pin: { empleadoId: null, cargando: false, datos: null, error: false, panel: false, guardando: false, error_texto: null },
    }

    const MODULOS_INFO = [
      { key: 'gastos',    label: 'Gastos' },
      { key: 'caja',      label: 'Caja' },
      { key: 'accesos',   label: 'Accesos' },
      { key: 'empleados', label: 'Empleados' },
    ]

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════

    // Todo texto que no sea literal del código se escapa antes de entrar a
    // innerHTML (regla del proyecto, ver CLAUDE.md). Nombre, puesto,
    // domicilio, teléfono y contacto de emergencia los carga la propia persona
    // o vienen del Excel de Naaloo, y los mira quien tiene empleados:ver_editar.
    // Mismo helper que gastos.html.
    function esc(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    }

    function soloDigitos(s) {
      return (s || '').replace(/\D/g, '')
    }

    // Devuelve el CUIL CRUDO si no tiene 11 dígitos: escapar el resultado.
    function formatearCuil(cuil) {
      const d = soloDigitos(cuil)
      if (d.length !== 11) return cuil || '—'
      return `${d.slice(0, 2)}-${d.slice(2, 10)}-${d.slice(10)}`
    }

    // Devuelve texto crudo (los primeros caracteres): escapar el resultado.
    function iniciales(nombre) {
      const palabras = (nombre || '').trim().split(/\s+/).filter(Boolean)
      if (!palabras.length) return '—'
      if (palabras.length === 1) return palabras[0].slice(0, 2).toUpperCase()
      return (palabras[0][0] + palabras[1][0]).toUpperCase()
    }

    const PALETA_AVATAR = ['#6E56CF', '#5B45AD', '#8B75DB', '#4A5568', '#6E3B5C']
    function colorAvatar(texto) {
      let hash = 0
      for (let i = 0; i < (texto || '').length; i++) hash = texto.charCodeAt(i) + ((hash << 5) - hash)
      return PALETA_AVATAR[Math.abs(hash) % PALETA_AVATAR.length]
    }

    function modulosDeEmpleado(empleadoId) {
      return estado.empleadoModulos.filter(m => m.empleado_id === empleadoId).map(m => m.modulo)
    }

    // Tareas granulares (empleado_tareas) — mismo patrón que caja.html:
    // super_admin tiene bypass total, el resto depende de lo cargado en
    // estado.misTareasEmpleados (modulo='empleados', ver init()). El alcance
    // real de 'ver_editar' (todas las unidades vs. un subconjunto) ya lo
    // aplica la RLS al traer los datos — acá solo importa el booleano.
    function tieneTarea(modulo, tarea) {
      return estado.miEmpleado?.rol_app === 'super_admin' || estado.misTareasEmpleados.has(tarea)
    }

    function limpiarTexto(valor) {
      if (valor === null || valor === undefined) return null
      const t = String(valor).trim()
      return t ? t : null
    }

    function valorFila(fila, ...claves) {
      for (const clave of claves) {
        if (fila[clave] !== undefined && fila[clave] !== null && fila[clave] !== '') return fila[clave]
      }
      return null
    }

    function formatearFechaISO(valor) {
      if (!valor) return null
      if (valor instanceof Date && !isNaN(valor)) return valor.toISOString().slice(0, 10)
      if (typeof valor === 'string') {
        const m = valor.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`
      }
      return null
    }

    // La fecha de una baja: empleados.baja_en es timestamptz, así que no sirve
    // formatearFecha() de utils.js (que parte un AAAA-MM-DD). El día es el de
    // Argentina: Supabase guarda en UTC, y una baja a las 22 h saldría con el
    // día siguiente. Sin dato, o con uno que no es una fecha, devuelve '' y la
    // pantalla no dice nada — nunca "NaN" ni una fecha inventada.
    function fechaBajaAr(valor) {
      if (valor === null || valor === undefined || valor === '') return ''
      const d = new Date(valor)
      if (isNaN(d.getTime())) return ''
      return new Intl.DateTimeFormat('es-AR', {
        timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', year: 'numeric',
      }).format(d)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CARGA DE DATOS
    // ═══════════════════════════════════════════════════════════════════════

    async function cargarTodo() {
      document.getElementById('estado-cargando').hidden = false

      // Trae TAMBIÉN a los dados de baja (activo = false): los necesita el
      // interruptor "Mostrar dados de baja" y la ficha de cada uno. Se separan
      // EN EL CLIENTE (personasVisibles / dadosDeBajaVisibles), no en la
      // consulta. La Cuenta de Empresa (tipo 'empresa', activo = false a
      // propósito) llega también y no se muestra en ninguna de las dos listas.
      // Sin empleados:ver_editar el RLS devuelve solo la fila propia, igual que
      // antes.
      const [empRes, modRes, unidRes, nomRes] = await Promise.all([
        supabase.from('empleados')
          .select('id, nombre, cuil, activo, baja_en_app, baja_motivo, baja_por, baja_en, auth_user_id, rol_app, tipo, origen, unidad_negocio_id, rol, email, domicilio, legajo, fecha_alta, fecha_nacimiento, telefono, contacto_emergencia_nombre, contacto_emergencia_telefono, es_dispositivo, es_prueba'),
        supabase.from('empleado_modulos').select('empleado_id, modulo, habilitado').eq('habilitado', true),
        supabase.from('unidades_negocio').select('id, nombre').order('nombre'),
        // Solo para resolver "dado de baja por X": si falla, la ficha no dice
        // quién y nada más se rompe.
        supabase.from('v_empleados_publico').select('id, nombre'),
      ])

      document.getElementById('estado-cargando').hidden = true

      if (empRes.error || modRes.error || unidRes.error) {
        mostrarError('No se pudieron cargar los datos de Empleados.')
        return
      }

      estado.empleados       = empRes.data || []
      estado.empleadoModulos = modRes.data || []
      estado.maestros.unidadesNegocio = unidRes.data || []
      if (nomRes && !nomRes.error) estado.nombres = new Map((nomRes.data || []).map(e => [e.id, e.nombre]))

      renderizarStats()
      renderizarListado()
      if (estado.fichaAbierta) renderizarFicha()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER — Stats
    // ═══════════════════════════════════════════════════════════════════════

    // Las cuentas de las tablets de la fábrica (empleados.es_dispositivo) NO
    // son personas: tienen login y una unidad, pero no son personal. Van en un
    // grupo aparte con la etiqueta "Tablet", no cuentan en las cifras de
    // personas y su ficha no ofrece PIN de producción (un PIN identifica a
    // una persona que usa la tablet, no a la tablet).
    function esDispositivo(emp) {
      return emp?.es_dispositivo === true
    }

    // Una persona DADA DE BAJA: activo = false. La Cuenta de Empresa también
    // tiene activo = false, a propósito, y NO es una baja; y las cuentas
    // 'sistema' (las tablets y las personas del robot) no se dan de baja ni se
    // reactivan desde acá. Exige === false: un valor raro (null, ausente) no
    // saca a nadie de la lista de activos.
    function esDadoDeBaja(emp) {
      return emp?.activo === false && emp?.tipo !== 'empresa' && emp?.tipo !== 'sistema'
    }

    // "Dar de baja" en la ficha: con empleados:ver_editar, a una persona
    // ACTIVA que no sea una tablet ni una cuenta 'empresa' / 'sistema', que no
    // sea quien mira y que no sea super_admin. La base igual rechaza las dos
    // últimas (dar_de_baja_empleado): no ofrecer el botón evita un error
    // seguro, no reemplaza a la barrera de la base.
    function puedeDarDeBaja(emp) {
      if (!emp || !tieneTarea('empleados', 'ver_editar')) return false
      if (emp.activo === false || esDispositivo(emp)) return false
      if (emp.tipo === 'empresa' || emp.tipo === 'sistema') return false
      if (emp.id === estado.miEmpleado?.id) return false
      return emp.rol_app !== 'super_admin'
    }

    function puedeReactivar(emp) {
      return esDadoDeBaja(emp) && tieneTarea('empleados', 'ver_editar')
    }

    // El renglón de un dado de baja en el listado: el motivo y la fecha, lo
    // que haya. TEXTO PLANO: se escapa su resultado. Una baja que vino del
    // Excel de Naaloo (baja_en_app = false) no tiene motivo ni fecha en la app.
    function resumenBaja(emp) {
      const fecha = fechaBajaAr(emp?.baja_en)
      const partes = [String(emp?.baja_motivo ?? '').trim(), fecha ? `desde el ${fecha}` : ''].filter(Boolean)
      if (partes.length) return partes.join(' · ')
      return emp?.baja_en_app === false ? 'Dado de baja en el Excel de Naaloo' : 'Sin motivo registrado'
    }

    // Quién la dio de baja: primero entre las filas que se leen de `empleados`
    // y, si no está (otra unidad), en el mapa completo de v_empleados_publico.
    function nombrePorId(id) {
      if (!id) return ''
      return estado.empleados.find(e => e.id === id)?.nombre || estado.nombres?.get?.(id) || ''
    }

    // "Desde el 28/09/2026 · por Ana Pérez" en la ficha, con lo que haya.
    // TEXTO PLANO: se escapa su resultado.
    function detalleBaja(emp) {
      const fecha = fechaBajaAr(emp?.baja_en)
      const quien = nombrePorId(emp?.baja_por)
      const partes = [fecha ? `Desde el ${fecha}` : '', quien ? `por ${quien}` : ''].filter(Boolean)
      if (partes.length) return partes.join(' · ')
      return emp?.baja_en_app === false ? 'La baja vino del Excel de Naaloo.' : 'Sin fecha registrada.'
    }

    // La FÁBRICA DE PRUEBAS (26/09/2026): la unidad "Pruebas (robot)" y sus
    // personas existen para Playwright y NO se muestran a una cuenta real, ni
    // como grupo ni como opción de unidad ni en la lista (tampoco en el grupo
    // de tablets). Una cuenta de la fábrica de pruebas sí las ve. Se filtra
    // donde se ARMA cada lista, no en la consulta ni en estado.*: las
    // búsquedas por id (el nombre de la unidad de una ficha) usan los datos
    // completos. Además de la regla compartida (por unidad), una fila marcada
    // es_prueba tampoco se muestra — pero solo si la fábrica se pudo leer:
    // sin saber si la cuenta es de prueba, no se saca nada.
    function unidadesVisibles() {
      return sinUnidadesDePrueba(estado.maestros.unidadesNegocio, estado.fabrica)
    }
    // OJO: devuelve TODAS las filas que se pueden mostrar, activas y dadas de
    // baja (y la Cuenta de Empresa, que no se muestra nunca). Quien la usa
    // separa: las cifras y los grupos cuentan solo las activas, y el grupo
    // "Dados de baja" sale de dadosDeBajaVisibles().
    function personasVisibles() {
      const f = estado.fabrica
      const lista = sinPersonasDePrueba(estado.empleados, f)
      return (f?.ok && !f.soyDePrueba) ? lista.filter(e => e?.es_prueba !== true) : lista
    }

    // Los dados de baja que se pueden mostrar: la misma regla de la fábrica de
    // pruebas que el resto (una persona de prueba dada de baja tampoco se ve).
    function dadosDeBajaVisibles() {
      return personasVisibles().filter(esDadoDeBaja)
    }

    function renderizarStats() {
      const personas  = personasVisibles().filter(e => !esDispositivo(e))
      // Las cifras son de personas ACTIVAS: ni los dados de baja ni la Cuenta
      // de Empresa cuentan (los dos tienen activo = false).
      const activas   = personas.filter(e => e?.activo !== false)
      const total     = activas.length
      const conAcceso = activas.filter(e => e.auth_user_id).length
      const empresas  = new Set(activas.filter(e => e.unidad_negocio_id).map(e => e.unidad_negocio_id)).size

      document.getElementById('empleados-stats').innerHTML = `
        <div class="stat-card stat-card--principal">
          <div>
            <div class="stat-card__label">Total empleados</div>
            <div class="stat-card__valor">${total}</div>
          </div>
          <div class="stat-card__submetrics">
            <div class="stat-card__submetric">
              <div class="stat-card__submetric-label">Con acceso</div>
              <div class="stat-card__submetric-valor">${conAcceso}</div>
            </div>
            <div class="stat-card__submetric">
              <div class="stat-card__submetric-label">Empresas</div>
              <div class="stat-card__submetric-valor">${empresas}</div>
            </div>
          </div>
        </div>
        <div class="stat-card stat-card--secundario">
          <div class="stat-card__label">Con acceso a la app</div>
          <div class="stat-card__valor">${conAcceso}</div>
        </div>
        <div class="stat-card stat-card--secundario">
          <div class="stat-card__label">Empresas</div>
          <div class="stat-card__valor">${empresas}</div>
        </div>
      `
      document.getElementById('empleados-stats').hidden = false
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER — Listado agrupado
    // ═══════════════════════════════════════════════════════════════════════

    function ordenarGrupo(lista) {
      return [...lista].sort((a, b) => {
        const tieneAccesoA = a.auth_user_id ? 0 : 1
        const tieneAccesoB = b.auth_user_id ? 0 : 1
        if (tieneAccesoA !== tieneAccesoB) return tieneAccesoA - tieneAccesoB
        return (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' })
      })
    }

    function agruparEmpleados() {
      const porUnidad = new Map()
      unidadesVisibles().forEach(u => porUnidad.set(u.id, { nombre: u.nombre, lista: [] }))
      const sinEmpresaConAcceso = []
      const sinEmpresaSinAcceso = []
      const tablets = []
      const bajas = []

      personasVisibles().forEach(emp => {
        // Una fila inactiva nunca entra a un grupo de personas: si es un dado
        // de baja va a su grupo (solo con el interruptor prendido); la Cuenta
        // de Empresa no se muestra.
        if (emp?.activo === false) {
          if (esDadoDeBaja(emp)) bajas.push(emp)
          return
        }
        if (esDispositivo(emp)) {
          tablets.push(emp)
        } else if (emp.unidad_negocio_id && porUnidad.has(emp.unidad_negocio_id)) {
          porUnidad.get(emp.unidad_negocio_id).lista.push(emp)
        } else if (emp.auth_user_id) {
          sinEmpresaConAcceso.push(emp)
        } else {
          sinEmpresaSinAcceso.push(emp)
        }
      })

      const grupos = [...porUnidad.values()].filter(g => g.lista.length)
      if (sinEmpresaConAcceso.length) grupos.push({ nombre: 'Con acceso a la app, sin empresa asignada', lista: sinEmpresaConAcceso })
      if (sinEmpresaSinAcceso.length) grupos.push({ nombre: 'Sin empresa asignada', lista: sinEmpresaSinAcceso })
      // Los dados de baja, después de todas las personas activas y apagados
      // por defecto: solo con "Mostrar dados de baja".
      if (bajas.length && estado.filtros?.mostrarBajas === true) grupos.push({ nombre: 'Dados de baja', lista: bajas })
      // Siempre al final: no es personal de ninguna empresa.
      if (tablets.length) grupos.push({ nombre: 'Tablets de la fábrica', lista: tablets })

      grupos.forEach(g => { g.lista = ordenarGrupo(g.lista) })
      return grupos
    }

    function renderizarFilaEmpleado(emp) {
      if (esDispositivo(emp)) {
        const unidad = estado.maestros.unidadesNegocio.find(u => u.id === emp.unidad_negocio_id)?.nombre
        return `
        <div class="tarjeta-lista tarjeta-empleado--tablet" data-id="${esc(emp.id)}">
          <div class="tarjeta-lista__avatar tarjeta-empleado__avatar-tablet"><i data-lucide="tablet"></i></div>
          <div class="tarjeta-lista__info">
            <div class="acceso__fila1">
              <span class="tarjeta-lista__titulo">${esc(emp.nombre)}</span>
              <span class="chip-tablet">Tablet</span>
            </div>
            <div class="tarjeta-lista__subtitulo">Cuenta de la tablet de la fábrica${unidad ? ' · ' + esc(unidad) : ''}</div>
          </div>
        </div>
      `
      }
      // Un dado de baja: el chip "Dado de baja" en vez del rol, y debajo el
      // motivo y la fecha si los hay. El motivo lo tipeó una persona: va
      // escapado como todo lo demás.
      if (esDadoDeBaja(emp)) {
        return `
        <div class="tarjeta-lista tarjeta-empleado--baja" data-id="${esc(emp.id)}">
          <div class="tarjeta-lista__avatar" style="background: ${colorAvatar(emp.nombre)};">${esc(iniciales(emp.nombre))}</div>
          <div class="tarjeta-lista__info">
            <div class="acceso__fila1">
              <span class="tarjeta-lista__titulo">${esc(emp.nombre)}</span>
              <span class="chip-baja">Dado de baja</span>
            </div>
            <div class="tarjeta-lista__subtitulo">${esc(resumenBaja(emp))}</div>
          </div>
        </div>
      `
      }
      const tieneAcceso = !!emp.auth_user_id
      const incompleto  = emp.origen === 'app_registro' && !emp.rol
      const etiquetaRol = emp.rol_app === 'super_admin' ? 'Super admin' : emp.rol_app === 'admin' ? 'Admin' : 'Usuario'

      const badgeAcceso = tieneAcceso
        ? `<span class="chip-rol chip-rol--${esc(emp.rol_app)}">${etiquetaRol}</span>`
        : `<span class="chip-sin-acceso">Sin acceso</span>`

      return `
        <div class="tarjeta-lista ${incompleto ? 'tarjeta-empleado--incompleta' : ''}" data-id="${esc(emp.id)}">
          <div class="tarjeta-lista__avatar" style="background:${colorAvatar(emp.nombre)};">${esc(iniciales(emp.nombre))}</div>
          <div class="tarjeta-lista__info">
            <div class="acceso__fila1">
              <span class="tarjeta-lista__titulo">${esc(emp.nombre)}</span>
              ${badgeAcceso}
            </div>
            <div class="tarjeta-lista__subtitulo">${esc(emp.rol || (incompleto ? 'Datos incompletos' : 'Sin puesto registrado'))}</div>
          </div>
          ${incompleto ? '<i data-lucide="alert-triangle" class="tarjeta-empleado__alerta"></i>' : ''}
        </div>
      `
    }

    function renderizarListado() {
      const cont  = document.getElementById('lista-empleados')
      const termino = (estado.filtros.busqueda || '').trim().toLowerCase()

      // "Mostrar dados de baja": solo si hay alguno para mostrar (un
      // interruptor que no cambia nada entrena a ignorarlo), y solo con
      // empleados:ver_editar (sin esa tarea el RLS ya no los trae).
      const cantBajas = tieneTarea('empleados', 'ver_editar') ? dadosDeBajaVisibles().length : 0
      const interruptor = document.getElementById('empleados-toolbar-bajas')
      if (interruptor) interruptor.hidden = cantBajas === 0
      const contador = document.getElementById('contador-bajas')
      if (contador) contador.textContent = cantBajas ? `(${cantBajas})` : ''
      const casilla = document.getElementById('filtro-mostrar-bajas')
      if (casilla) casilla.checked = estado.filtros.mostrarBajas === true

      // El filtro solo oculta filas que no matchean — el agrupamiento y el
      // orden ya calculados en agruparEmpleados() no se tocan.
      const grupos = agruparEmpleados()
        .map(g => ({ ...g, lista: termino ? g.lista.filter(e => (e.nombre || '').toLowerCase().includes(termino)) : g.lista }))
        .filter(g => g.lista.length)

      if (!grupos.length) {
        cont.innerHTML = ''
        document.getElementById('estado-vacio-empleados').hidden = false
        return
      }
      document.getElementById('estado-vacio-empleados').hidden = true

      cont.innerHTML = grupos.map(g => `
        <div class="grupo-empleados">
          <div class="grupo-empleados__titulo">
            <span class="grupo-empleados__punto"></span>${esc(g.nombre)}
            <span class="grupo-empleados__contador">· ${g.lista.length}</span>
          </div>
          <div class="lista-accesos">
            ${g.lista.map(renderizarFilaEmpleado).join('')}
          </div>
        </div>
      `).join('')

      lucide.createIcons()

      cont.querySelectorAll('.tarjeta-lista').forEach(el => {
        el.addEventListener('click', () => abrirFicha(el.dataset.id))
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // MODAL — Ficha de empleado
    // ═══════════════════════════════════════════════════════════════════════

    function abrirFicha(empleadoId) {
      const emp = estado.empleados.find(e => e.id === empleadoId)
      if (!emp) return
      estado.fichaAbierta = empleadoId
      estado.modoEdicionFicha = false
      estado.modoEdicionContacto = false
      reiniciarPin(empleadoId)
      reiniciarBaja(empleadoId)
      renderizarFicha()
      document.getElementById('modal-ficha').hidden = false
      // Una tablet no tiene PIN de producción: ni se pregunta a la base.
      if (esDispositivo(emp)) return
      // Un dado de baja tampoco: no puede usar la planta (personal_produccion
      // lo saca). Si se lo reactiva, reactivar vuelve a pedir el estado.
      if (esDadoDeBaja(emp)) return
      // Arranca sin await: la ficha se abre ya y la sección del PIN aparece
      // cuando la base contesta. Hasta entonces no se dibuja NADA, para no
      // mostrar un título que después puede tener que desaparecer.
      cargarEstadoPin(empleadoId)
    }

    function renderizarFicha() {

      document.getElementById('ficha-datos-naaloo').innerHTML = esDispositivo(emp) ? `

      // Un dado de baja se mira, no se edita: primero se lo reactiva.
      const deBaja = esDadoDeBaja(emp)
      document.getElementById('btn-editar-contacto').hidden = estado.modoEdicionContacto || !tieneTarea('empleados', 'ver_editar') || deBaja
      if (estado.modoEdicionContacto) {
        renderizarFormularioContacto(emp)
      } else {
        document.getElementById('ficha-contacto-emergencia').innerHTML = `
          <div class="ficha-campo"><span>Nombre</span><span>${esc(emp.contacto_emergencia_nombre || '—')}</span></div>
          <div class="ficha-campo"><span>Teléfono</span><span>${esc(emp.contacto_emergencia_telefono || '—')}</span></div>

      const modulos = modulosDeEmpleado(emp.id)
      if (emp.auth_user_id && deBaja) {

              const info = MODULOS_INFO.find(i => i.key === m)

            }).join('')
          : `<span class="ficha-sin-modulos">Sin módulos habilitados</span>`

        document.getElementById('ficha-acceso').innerHTML = `

      } else {
        document.getElementById('ficha-acceso').innerHTML = `<div class="ficha-sin-acceso">Sin acceso a la app</div>`
      }

      const acciones = []
      if (incompleto && !estado.modoEdicionFicha && tieneTarea('empleados', 'ver_editar') && !deBaja) {
        acciones.push(`<button type="button" class="btn btn--secundario" id="btn-completar-datos">Completar datos</button>`)
      }
      // Los permisos de un dado de baja quedan guardados pero no sirven
      // (mi_empleado_id() ya no lo reconoce): no se ofrece editarlos.
      if (emp.auth_user_id && !deBaja) {
        acciones.push(`<a href="accesos.html" class="btn btn--secundario">Editar permisos de acceso →</a>`)
      }

      if (btnCompletar) {
        btnCompletar.addEventListener('click', () => {

    // ═══════════════════════════════════════════════════════════════════════
    // PIN de producción
    // ═══════════════════════════════════════════════════════════════════════
    //
    // QUIÉN VE QUÉ LO DECIDE LA BASE, y no un gate propio de esta pantalla:
    // estado_pin_produccion() devuelve NULL a quien no tiene ni
    // produccion:configurar ni empleados:ver_editar —y ahí no se dibuja nada—,
    // y su 'puede_asignar' es produccion:configurar, que es MÁS restrictivo que
    // ver la sección: con solo empleados:ver_editar se ve el estado y no aparece
    // ningún botón. Un tieneTarea() propio acá sería una segunda tabla de
    // decisión que se desincroniza de aquella en silencio — y además este módulo
    // ni siquiera carga las tareas de 'produccion'.
    const LARGO_PIN_PRODUCCION = 4
    const TITULO_PIN = '<div class="modal-ficha__seccion-titulo">PIN de producción</div>'

    function reiniciarPin(empleadoId) {
      olvidarCampoPin()
      estado.pin = {
        empleadoId, cargando: Boolean(empleadoId), datos: null, error: false,
        panel: false, guardando: false, error_texto: null,
      }
    }

    // El PIN tipeado se borra del campo a mano antes de soltarlo. El re-render
    // lo reemplaza igual, pero no tiene que sobrevivir ni un instante de más.
    function olvidarCampoPin() {
      const el = document.getElementById('pin-valor')
      if (el) el.value = ''
    }

    // Los tres estados, con los MISMOS nombres que usa la configuración de
    // Producción. No hay "Bloqueado": la RPC no lo dice, y un chip que no se
    // puede saber sería inventarlo.
    function estadoDelPin(p) {
      if (!p?.tiene_pin) return { texto: 'Sin PIN', clase: 'chip-pin--gris' }
      if (p.debe_cambiar) return { texto: 'PIN pendiente de cambiar', clase: 'chip-pin--alerta' }
      return { texto: 'PIN propio', clase: 'chip-pin--ok' }
    }

    async function cargarEstadoPin(empleadoId) {
      const { data, error } = await supabase.rpc('estado_pin_produccion', { p_empleado_id: empleadoId })
      // Una respuesta que llega tarde no pisa la ficha que está abierta AHORA.
      if (estado.pin.empleadoId !== empleadoId) return
      estado.pin.cargando = false
      // Si la llamada falla NO se inventa un estado: un "Sin PIN" falso llevaría
      // a asignarle un PIN nuevo a alguien que ya tiene el suyo.
      estado.pin.error = Boolean(error)
      estado.pin.datos = error ? null : (data ?? null)
      renderizarPin()
    }

    // El panel para asignar o resetear. Un PIN es un IDENTIFICADOR, no una
    // cantidad: va como texto, NUNCA por enlazarCampoNumero (que le metería
    // separador de miles) y NUNCA en un type="number" (que se come la coma y
    // acepta notación que no es un PIN).
    function htmlPanelPin(emp) {
      const p = estado.pin
      return `
        <div class="ficha-pin__panel">
          <p class="ficha-pin__ayuda">${LARGO_PIN_PRODUCCION} números para ${esc(emp?.nombre || 'esta persona')}. Se los pasás a mano; la primera vez que entre va a tener que elegir uno suyo.</p>
          <input type="text" id="pin-valor" inputmode="numeric" autocomplete="off" maxlength="${LARGO_PIN_PRODUCCION}" placeholder="0000" aria-label="PIN de producción">
          ${p.error_texto ? `<div class="ficha-pin__error">${esc(p.error_texto)}</div>` : ''}
          <div class="modal-ficha__form-acciones">
            <button type="button" class="btn btn--secundario" id="btn-pin-cancelar">Cancelar</button>
            <button type="button" class="btn btn--exito" id="btn-pin-guardar"${p.guardando ? ' disabled' : ''}>Guardar el PIN</button>
          </div>
        </div>
      `
    }

    function htmlSeccionPin() {
      const p = estado.pin
      // Mientras se espera la respuesta no se dibuja NADA: un título que
      // después puede tener que desaparecer es peor que uno que aparece tarde.
      if (p.cargando) return ''
      if (esDispositivo(estado.empleados.find(e => e.id === p.empleadoId))) return ''
      // Un dado de baja no usa la planta: ni el estado ni "Asignar PIN".
      if (esDadoDeBaja(estado.empleados.find(e => e.id === p.empleadoId))) return ''
      if (p.error) return TITULO_PIN + '<div class="ficha-sin-acceso">No se pudo leer el estado del PIN.</div>'
      // null = la base dice que quien mira no puede ver esto. Sección entera fuera.
      if (!p.datos) return ''
      const emp = estado.empleados.find(e => e.id === p.empleadoId)
      const est = estadoDelPin(p.datos)
      const boton = p.datos.puede_asignar
        ? `<button type="button" class="btn btn--secundario" id="btn-pin-asignar">${p.datos.tiene_pin ? 'Resetear PIN' : 'Asignar PIN'}</button>`
        : ''
      return TITULO_PIN + `
        <div class="ficha-pin__caja">
          <span class="chip-pin ${est.clase}">${est.texto}</span>
          ${boton}
        </div>
        ${p.panel ? htmlPanelPin(emp) : ''}
      `
    }

    function renderizarPin() {
      const cont = document.getElementById('ficha-pin')
      if (!cont) return
      cont.innerHTML = htmlSeccionPin()

      document.getElementById('btn-pin-asignar')?.addEventListener('click', () => {
        estado.pin.panel = true
        estado.pin.error_texto = null
        renderizarPin()
        document.getElementById('pin-valor')?.focus?.()
      })
      document.getElementById('btn-pin-cancelar')?.addEventListener('click', cerrarPanelPin)
      document.getElementById('btn-pin-guardar')?.addEventListener('click', guardarPin)
    }

    function cerrarPanelPin() {
      olvidarCampoPin()
      estado.pin.panel = false
      estado.pin.error_texto = null
      renderizarPin()
    }

    async function guardarPin() {
      const p = estado.pin
      // El botón se traba SOLO mientras se manda, nunca por lo que falta: un
      // botón apagado no puede explicar por qué, y el error va pegado a él.
      if (p.guardando || !p.datos?.puede_asignar) return
      const pin = String(document.getElementById('pin-valor')?.value ?? '').trim()
      if (!new RegExp(`^[0-9]{${LARGO_PIN_PRODUCCION}}$`).test(pin)) {
        p.error_texto = `El PIN tiene que ser de ${LARGO_PIN_PRODUCCION} números.`
        renderizarPin()
        return
      }
      p.guardando = true
      p.error_texto = null
      renderizarPin()
      const { error } = await supabase.rpc('asignar_pin_produccion', { p_empleado_id: p.empleadoId, p_pin: pin })
      olvidarCampoPin()
      p.guardando = false
      if (error) {
        // El mensaje de la base ya está escrito para una persona —incluido el
        // del PIN demasiado obvio—. Esa lista NO se replica acá: una segunda
        // copia se desincroniza en silencio y rechazaría lo que la base acepta.
        p.error_texto = error.message || 'No se pudo guardar el PIN.'
        renderizarPin()
        return
      }
      p.panel = false
      mostrarExito('PIN asignado.')
      await cargarEstadoPin(p.empleadoId)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // DAR DE BAJA / REACTIVAR (28/09/2026)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Las reglas viven en la base: dar_de_baja_empleado(p_empleado_id,
    // p_motivo) exige empleados:ver_editar, rechaza darse de baja a uno mismo y
    // a un super_admin, pone activo = false y guarda baja_motivo / baja_por /
    // baja_en; si la persona tenía cuenta, pierde el acceso al instante
    // (mi_empleado_id() exige activo). reactivar_empleado(p_empleado_id) lo
    // deshace. La pantalla NO repite esas validaciones: solo no ofrece el botón
    // donde la base va a decir que no, y muestra el mensaje de la base TAL CUAL,
    // pegado a los botones del panel. El panel ES la confirmación: nada se manda
    // hasta tocar "Sí, …" (sin window.confirm ni prompt).

    function reiniciarBaja(empleadoId) {
      estado.baja = { empleadoId, panel: null, motivo: '', enviando: false, error: null }
    }

    function renderizarBaja() {
      const arriba = document.getElementById('ficha-estado-baja')
      const abajo  = document.getElementById('ficha-baja')
      if (!arriba || !abajo) return
      const emp = estado.empleados.find(e => e.id === estado.fichaAbierta)
      const b = estado.baja
      const deBaja = esDadoDeBaja(emp)
      const reactivable = deBaja && puedeReactivar(emp)

      // ARRIBA: el estado de un dado de baja (cuándo, quién, el motivo) y
      // "Reactivar" si se puede.
      arriba.innerHTML = deBaja ? `
        <div class="ficha-baja__caja">
          <div class="ficha-baja__fila1">
            <span class="chip-baja">Dado de baja</span>
            ${reactivable && b.panel !== 'reactivar' ? '<button type="button" class="btn btn--secundario" id="btn-reactivar">Reactivar</button>' : ''}
          </div>
          <div class="ficha-baja__dato ficha-baja__dato--suave">${esc(detalleBaja(emp))}</div>
          ${String(emp.baja_motivo ?? '').trim() ? `<div class="ficha-baja__dato">Motivo: ${esc(emp.baja_motivo)}</div>` : ''}
          ${reactivable && b.panel === 'reactivar' ? `
          <div class="ficha-baja__panel" role="group" aria-labelledby="reactivar-titulo">
            <p class="ficha-baja__titulo" id="reactivar-titulo">¿Reactivar a ${esc(emp.nombre)}?</p>
            <p class="ficha-baja__ayuda">Vuelve a aparecer en las listas de personas${emp.auth_user_id ? ' y puede volver a entrar a la app con los permisos que tenía' : ''}.</p>
            ${emp.baja_en_app === false ? '<p class="ficha-baja__ayuda">La baja vino del Excel de Naaloo: si ahí sigue de baja, la próxima importación la vuelve a dar de baja.</p>' : ''}
            ${b.error ? `<div class="ficha-baja__error" role="alert">${esc(b.error)}</div>` : ''}
            <div class="modal-ficha__form-acciones">
              <button type="button" class="btn btn--secundario" id="btn-reactivar-cancelar">Cancelar</button>
              <button type="button" class="btn btn--exito" id="btn-reactivar-confirmar"${b.enviando ? ' disabled' : ''}>Sí, reactivar</button>
            </div>
          </div>` : ''}
        </div>
      ` : ''

      // ABAJO: "Dar de baja" y, al tocarlo, el panel con el motivo y la
      // confirmación. Solo donde la base lo va a aceptar (puedeDarDeBaja).
      abajo.innerHTML = puedeDarDeBaja(emp) ? (b.panel === 'baja' ? `
        <div class="ficha-baja__panel" role="group" aria-labelledby="baja-titulo">
          <p class="ficha-baja__titulo" id="baja-titulo">¿Dar de baja a ${esc(emp.nombre)}?</p>
          <p class="ficha-baja__ayuda">Deja de aparecer en las listas de personas (Producción, Caja, Gastos). Lo que ya cargó queda como está, y se puede reactivar.</p>
          ${emp.auth_user_id ? '<p class="ficha-baja__alerta">Pierde el acceso a la app al instante.</p>' : ''}
          <label for="baja-motivo">Motivo (opcional)</label>
          <input type="text" id="baja-motivo" autocomplete="off" placeholder="Ej.: renunció, terminó el contrato" value="${esc(b.motivo)}">
          ${b.error ? `<div class="ficha-baja__error" role="alert">${esc(b.error)}</div>` : ''}
          <div class="modal-ficha__form-acciones">
            <button type="button" class="btn btn--secundario" id="btn-baja-cancelar">Cancelar</button>
            <button type="button" class="btn btn--peligro" id="btn-baja-confirmar"${b.enviando ? ' disabled' : ''}>Sí, dar de baja</button>
          </div>
        </div>
      ` : `<button type="button" class="btn btn--secundario ficha-baja__boton" id="btn-dar-baja">Dar de baja</button>`) : ''

      document.getElementById('btn-reactivar')?.addEventListener('click', () => {
        estado.baja.panel = 'reactivar'
        estado.baja.error = null
        renderizarBaja()
        document.getElementById('btn-reactivar-confirmar')?.focus?.()
      })
      document.getElementById('btn-reactivar-cancelar')?.addEventListener('click', () => {
        estado.baja.panel = null
        estado.baja.error = null
        renderizarBaja()
      })
      document.getElementById('btn-reactivar-confirmar')?.addEventListener('click', confirmarReactivar)
      document.getElementById('btn-dar-baja')?.addEventListener('click', () => {
        estado.baja.panel = 'baja'
        estado.baja.error = null
        renderizarBaja()
        document.getElementById('baja-motivo')?.focus?.()
      })
      document.getElementById('btn-baja-cancelar')?.addEventListener('click', () => {
        estado.baja.panel = null
        estado.baja.motivo = ''
        estado.baja.error = null
        renderizarBaja()
      })
      // El motivo se guarda en el estado al tipear: un re-render (un error de
      // la base) no lo borra.
      document.getElementById('baja-motivo')?.addEventListener('input', (e) => { estado.baja.motivo = e.target.value })
      document.getElementById('btn-baja-confirmar')?.addEventListener('click', confirmarBaja)
    }

    // Una llamada a la base que no tira: una caída de red vuelve como error y
    // el botón no queda trabado para siempre.
    async function llamarRpcBaja(nombre, args) {
      try {
        return await supabase.rpc(nombre, args)
      } catch (err) {
        return { data: null, error: { message: err?.message || 'No se pudo conectar con la base.' } }
      }
    }

    async function confirmarBaja() {
      const b = estado.baja
      const emp = estado.empleados.find(e => e.id === b.empleadoId)
      // El botón se traba SOLO mientras se manda, nunca por lo que falta.
      if (b.enviando || !puedeDarDeBaja(emp)) return
      const motivo = String(document.getElementById('baja-motivo')?.value ?? b.motivo ?? '').trim()
      b.motivo = motivo
      b.enviando = true
      b.error = null
      renderizarBaja()
      const { data, error } = await llamarRpcBaja('dar_de_baja_empleado', { p_empleado_id: emp.id, p_motivo: motivo || null })
      b.enviando = false
      // Si mientras tanto se cerró la ficha o se abrió otra, el panel ya no es
      // este: el error va a un cartel en vez de perderse.
      const sigue = estado.baja === b
      if (error) {
        const texto = error.message || 'No se pudo dar de baja.'
        if (sigue) { b.error = texto; renderizarBaja() } else mostrarError(texto)
        return
      }
      mostrarExito(data?.tenia_cuenta
        ? `${emp.nombre} quedó dado de baja y ya no puede entrar a la app.`
        : `${emp.nombre} quedó dado de baja.`)
      if (sigue) reiniciarBaja(emp.id)
      // La ficha queda abierta y se redibuja con el estado nuevo (dado de baja,
      // con "Reactivar"): se ve que pasó.
      await cargarTodo()
    }

    async function confirmarReactivar() {
      const b = estado.baja
      const emp = estado.empleados.find(e => e.id === b.empleadoId)
      if (b.enviando || !puedeReactivar(emp)) return
      b.enviando = true
      b.error = null
      renderizarBaja()
      const { error } = await llamarRpcBaja('reactivar_empleado', { p_empleado_id: emp.id })
      b.enviando = false
      const sigue = estado.baja === b
      if (error) {
        const texto = error.message || 'No se pudo reactivar.'
        if (sigue) { b.error = texto; renderizarBaja() } else mostrarError(texto)
        return
      }
      mostrarExito(`${emp.nombre} volvió a estar activo.`)
      if (sigue) { reiniciarBaja(emp.id); reiniciarPin(emp.id) }
      await cargarTodo()
      // Activo otra vez: la sección del PIN vuelve a preguntarle a la base.
      if (sigue && estado.fichaAbierta === emp.id && !esDispositivo(emp)) cargarEstadoPin(emp.id)
    }

    async function guardarDatosCompletos(empleadoId) {
      const rol       = document.getElementById('edit-rol').value.trim()
      const unidadId  = document.getElementById('edit-unidad').value
      const domicilio = document.getElementById('edit-domicilio').value.trim()
      const telefono  = document.getElementById('edit-telefono').value.trim()

      if (!rol || !unidadId) {
        mostrarError('Completá al menos la categoría y la unidad de negocio.')
        return
      }

      const btn = document.getElementById('btn-guardar-edicion')
      btn.classList.add('btn--cargando')
      btn.disabled = true

      try {
        const { error } = await supabase.rpc('completar_datos_empleado', {
          p_empleado_id: empleadoId,
          p_rol: rol,
          p_unidad_negocio_id: unidadId,
          p_domicilio: domicilio || null,
          p_telefono: telefono || null,
        })
        if (error) throw error
        mostrarExito('Datos actualizados.')
        estado.modoEdicionFicha = false
        await cargarTodo()
      } catch (err) {
        mostrarError(err.message || 'No se pudo guardar.')
        btn.classList.remove('btn--cargando')
        btn.disabled = false
      }
    }

    async function guardarContactoEmergencia(empleadoId) {
      const nombre   = document.getElementById('edit-contacto-nombre').value.trim()
      const telefono = document.getElementById('edit-contacto-telefono').value.trim()

      const btn = document.getElementById('btn-guardar-contacto')
      btn.classList.add('btn--cargando')
      btn.disabled = true

      try {
        const { error } = await supabase.rpc('actualizar_contacto_emergencia', {
          p_empleado_id: empleadoId,
          p_nombre: nombre || null,
          p_telefono: telefono || null,
        })
        if (error) throw error
        mostrarExito('Contacto de emergencia actualizado.')
        estado.modoEdicionContacto = false
        await cargarTodo()
      } catch (err) {
        mostrarError(err.message || 'No se pudo guardar.')
        btn.classList.remove('btn--cargando')
        btn.disabled = false
      }
    }

    function cerrarFicha() {
      document.getElementById('modal-ficha').hidden = true
      estado.fichaAbierta = null
      estado.modoEdicionFicha = false
      estado.modoEdicionContacto = false
      reiniciarPin(null)
      reiniciarBaja(null)
    }

    document.getElementById('btn-cerrar-ficha').addEventListener('click', cerrarFicha)
    document.getElementById('modal-ficha__backdrop').addEventListener('click', cerrarFicha)

    document.getElementById('btn-editar-contacto').addEventListener('click', () => {
      estado.modoEdicionContacto = true
      renderizarFicha()
    })

    // ═══════════════════════════════════════════════════════════════════════
    // IMPORTAR EXCEL DE NAALOO
    // ═══════════════════════════════════════════════════════════════════════

    async function manejarArchivoExcel(file) {
      const unidadId = document.getElementById('select-empresa-import').value
      if (!unidadId) {
        mostrarError('Elegí una empresa antes de subir el Excel.')
        return
      }

      const btn = document.getElementById('btn-elegir-excel')
      btn.classList.add('btn--cargando')
      btn.disabled = true

      try {
        const buffer = await file.arrayBuffer()
        const libro = XLSX.read(buffer, { type: 'array', cellDates: true })
        const nombreHoja = libro.SheetNames.find(n => n.trim().toLowerCase() === 'colaboradores') || libro.SheetNames[0]
        const hoja = libro.Sheets[nombreHoja]
        if (!hoja) throw new Error('No se encontró una hoja con datos en el Excel.')

        // Headers en fila 8 del Excel → índice 7 (0-based) para SheetJS
        const filas = XLSX.utils.sheet_to_json(hoja, { range: 7, defval: null })

        const filasMapeadas = filas.map(fila => {
          const apellido = limpiarTexto(valorFila(fila, 'Apellidos', 'Apellido'))
          const nombrePila = limpiarTexto(valorFila(fila, 'Nombres', 'Nombre'))
          const nombreCompleto = [apellido, nombrePila].filter(Boolean).join(' ') || limpiarTexto(valorFila(fila, 'Apellidos y Nombres'))
          const categoria = limpiarTexto(valorFila(fila, 'Categoría', 'Categoria'))
          const subcategoria = limpiarTexto(valorFila(fila, 'Subcategoría', 'Subcategoria'))

          return {
            cuil: limpiarTexto(valorFila(fila, 'CUIL', 'Cuil')),
            nombre: nombreCompleto,
            email: limpiarTexto(valorFila(fila, 'Dirección de correo', 'Direccion de correo', 'Email')),
            fecha_nacimiento: formatearFechaISO(valorFila(fila, 'Fecha de nacimiento (dd/mm/yyyy)', 'Fecha de nacimiento')),
            telefono: limpiarTexto(valorFila(fila, 'Teléfonos', 'Telefono', 'Teléfono')),
            domicilio: limpiarTexto(valorFila(fila, 'Domicilio')),
            legajo: limpiarTexto(valorFila(fila, 'Legajo')),
            fecha_alta: formatearFechaISO(valorFila(fila, 'Fecha alta (dd/mm/yyyy)', 'Fecha alta', 'Fecha de alta')),
            rol: [categoria, subcategoria].filter(Boolean).join(' · ') || null,
            activo: !valorFila(fila, 'Fecha baja (dd/mm/yyyy)', 'Fecha baja', 'Fecha de baja'),
          }
        }).filter(f => f.cuil)

        if (!filasMapeadas.length) throw new Error('No se encontraron filas válidas con CUIL en el Excel.')

        const { data, error } = await supabase.rpc('importar_empleados_naaloo', {
          p_filas: filasMapeadas,
          p_unidad_negocio_id: unidadId,
        })
        if (error) throw error

        mostrarExito(`${data.altas} altas, ${data.actualizaciones} actualizaciones.`)
        await cargarTodo()
      } catch (err) {
        mostrarError(err.message || 'No se pudo importar el Excel.')
      } finally {
        btn.classList.remove('btn--cargando')
        btn.disabled = false
      }
    }

    document.getElementById('btn-elegir-excel').addEventListener('click', () => {
      const unidadId = document.getElementById('select-empresa-import').value
      if (!unidadId) {
        mostrarError('Elegí una empresa antes de subir el Excel.')
        return
      }
      document.getElementById('input-excel').click()
    })

    document.getElementById('input-excel').addEventListener('change', async (e) => {
      const file = e.target.files[0]
      if (file) await manejarArchivoExcel(file)
      e.target.value = ''
    })

    // ═══════════════════════════════════════════════════════════════════════
    // BÚSQUEDA LOCAL (mismo patrón que gastos.html: debounce 250ms, filtra
    // sobre lo ya cargado en memoria, sin volver a consultar Supabase)
    // ═══════════════════════════════════════════════════════════════════════

    let debounceBusquedaEmpleados
    document.getElementById('filtro-busqueda-empleados').addEventListener('input', (e) => {
      clearTimeout(debounceBusquedaEmpleados)
      const valor = e.target.value
      debounceBusquedaEmpleados = setTimeout(() => {
        estado.filtros.busqueda = valor
        renderizarListado()
      }, 250)
    })

    // "Mostrar dados de baja": filtra lo que ya está en memoria, sin volver a
    // consultar (la consulta ya los trae).
    document.getElementById('filtro-mostrar-bajas').addEventListener('change', (e) => {
      estado.filtros.mostrarBajas = e.target.checked === true
      renderizarListado()
    })

    // Las opciones del selector de empresa de la importación de Naaloo.
    function htmlOpcionesEmpresaImport() {
      return `<option value="">Elegí una empresa…</option>` +
        unidadesVisibles().map(u => `<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join('')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return

      // La fábrica de pruebas se lee en paralelo con el resto del arranque;
      // nunca tira (si falla, FABRICA_SIN_DATOS y no se filtra nada).
      const fabricaP = cargarFabricaDePruebas(supabase)

      const { data: emp, error } = await supabase
        .from('empleados')
        .select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id)
        .maybeSingle()

      if (error || !emp) {
        mostrarError('No tenés permiso para acceder a este módulo.')
        setTimeout(() => window.location.replace('../dashboard.html'), 1500)
        return
      }

      estado.miEmpleado = emp

      // Tareas granulares del módulo (ver tieneTarea() más arriba).
      const { data: tareas } = await supabase
        .from('empleado_tareas')
        .select('tarea')
        .eq('empleado_id', emp.id)
        .eq('modulo', 'empleados')
        .eq('habilitado', true)
      estado.misTareasEmpleados = new Set((tareas ?? []).map(t => t.tarea))

      lucide.createIcons()

      estado.fabrica = await fabricaP
      await cargarTodo()

      // Las 3 tareas del módulo son independientes entre sí — dos gates
      // separados a propósito, ninguno anidado en el otro.

      // 'importar_naaloo': el bloque de importación se muestra solo con
      // esta tarea, tenga o no ver_editar (el RPC del servidor ya lo
      // permite así).
      if (tieneTarea('empleados', 'importar_naaloo')) {
        document.getElementById('bloque-importar').hidden = false
        document.getElementById('select-empresa-import').innerHTML = htmlOpcionesEmpresaImport()
      }

      // Sin 'ver_editar' la consulta de cargarTodo() ya vuelve acotada por
      // RLS (en la práctica, solo la propia fila) — acá solo ocultamos el
      // chrome de directorio (búsqueda + stats agregados) que no tiene
      // sentido para quien ve una sola persona. Ojo: se oculta la búsqueda
      // puntual, NO #empleados-toolbar entero — bloque-importar vive dentro
      // del toolbar y tiene que poder quedar visible con solo
      // importar_naaloo. El contenedor completo solo se oculta cuando no
      // queda nada visible adentro.
      if (!tieneTarea('empleados', 'ver_editar')) {
        document.getElementById('empleados-stats').hidden = true
        document.getElementById('empleados-toolbar-buscar').hidden = true
        if (!tieneTarea('empleados', 'importar_naaloo')) {
          document.getElementById('empleados-toolbar').hidden = true
        }
      }
    }

    init()
  </script>
