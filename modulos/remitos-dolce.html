    function htmlResumenLotesRemito(r) {
      const a = asignacionRemito(r)
      const ins = !!r?.insumoId
      if (a.pedido === null) return `<span class="ad-rm-lotes__resumen">${ins ? 'Poné la cantidad y escribí de qué lotes sale.' : 'Poné las cajas y escribí de qué lotes salen.'}</span>`
      if (!(a.asignado > 0)) return '<span class="ad-rm-estado-lotes ad-rm-estado-lotes--falta">Va sin lote</span> ' +
        `<span class="ad-rm-lotes__resumen">${ins ? 'Sin lotes escritos sale de los lotes más viejos con stock.' : 'Sin lotes escritos sale como «SIN LOTE».'}</span>`
      // "falta repartir 6 cajas" (29/10/2026): cuánto queda sin lote.
      const rmEstadoLotes = a.falta > 0 ? `<span class="ad-rm-estado-lotes ad-rm-estado-lotes--falta">falta repartir ${esc(cantidadRenglonRemito(r, a.falta))}</span>`
        : a.falta < 0 ? `<span class="ad-rm-estado-lotes ad-rm-estado-lotes--falta">${esc(ins ? cantidadRenglonRemito(r, -a.falta) : enteroHoja(-a.falta))} de más</span>`
        : '<span class="ad-rm-estado-lotes ad-rm-estado-lotes--ok">✓ Asignado completo</span>'
      // "Lotes: 25 de 31 cajas" / "Lotes: 20,5 de 25 kg" (29/10/2026), en
      // amarillo mientras no suman: confirmar_remito_precarga lo rechaza
      // ("los lotes suman X y el renglón dice Y").
      const deCuanto = ins ? `${esc(cantidadRenglonRemito(r, a.asignado).replace(/ \S+$/, ''))} de ${esc(cantidadRenglonRemito(r, a.pedido))}`
        : `${esc(enteroHoja(a.asignado))} de ${esc(enteroHoja(a.pedido))} cajas`
      return `<span class="ad-rm-lotes__asignado${a.falta === 0 ? '' : ' ad-rm-lotes__asignado--falta'}">Lotes: ${deCuanto}</span> · ${rmEstadoLotes}`
    }

    // "Aceptar sugerencia": la IA reconoció el producto (o el insumo) y la
    // cantidad pero lo marcó; aceptar no cambia nada más que el amarillo.
    function puedeAceptarSugerencia(r) {
      return !!r && r.revisar === true && r.omitir !== true && !!(r.presentacionId || r.insumoId) && Number(r.cantidad) > 0
    }

    function textoResumenRemito(renglones) {
      const lista = Array.isArray(renglones) ? renglones : []
      const omitidos = lista.filter(r => r.omitir === true).length
      const amarillos = lista.filter(r => r.revisar === true && r.omitir !== true).length
      return [`${lista.length} ${lista.length === 1 ? 'renglón' : 'renglones'}`, amarillos ? `${amarillos} en amarillo` : '',
        omitidos ? `${omitidos} no ${omitidos === 1 ? 'va' : 'van'} en la orden` : ''].filter(Boolean).join(' · ')
    }







    function htmlOpcionesRemito(i, cat, busqueda) {
      if (!cat) return '<p class="ad-texto-suave">Cargando los productos…</p>'
      const grupos = gruposRemito(cat, busqueda, CATEGORIAS_PRODUCTO)
      const q = limpio(busqueda)
      const pista = q ? '' : '<p class="ad-texto-suave">Escribí para buscar también los insumos.</p>'
      if (!grupos.length) return q ? `<p class="ad-texto-suave">${esc('Nada coincide con «' + q + '».')}</p>` : pista
      return grupos.map(g => `<div class="ad-rm-grupo"><p class="ad-rm-grupo__titulo">${esc(g.titulo)}</p>` +
        g.lista.map(o => o.grupo === 'insumos'
          ? `<button type="button" class="ad-rm-opcion" data-rm-insumo="${esc(i)}" data-id="${esc(o.insumoId)}">${esc(o.nombre)}</button>`
          : `<button type="button" class="ad-rm-opcion" data-rm-producto="${esc(i)}" data-presentacion="${esc(o.presentacionId)}">${esc(o.nombre)}` +
            `${o.conCono ? '<span class="ad-rm-opcion__detalle">elegí el cono</span>' : ''}</button>`).join('') +
        '</div>').join('') + pista
    }

    function htmlSelectorRemito(r, i, cat) {
      const rmVolver = r.eligiendo && (r.presentacionId || r.insumoId) ? `<button type="button" class="ad-link" data-rm-cambiar-no="${esc(i)}">Dejar ${esc(nombreRenglonRemito(cat, r) || 'el que estaba')}</button>` : ''
      return `<div class="ad-rm-selector"><label class="ad-campo__rotulo" for="ad-rm-buscar-${esc(i)}">Producto, cono o insumo</label>` +
        `<input type="search" class="ad-input" id="ad-rm-buscar-${esc(i)}" data-rm-buscar="${esc(i)}" value="${esc(r.busqueda ?? '')}" autocomplete="off" maxlength="60" placeholder="Buscar producto, cono o insumo">` +
        `${rmVolver}<div class="ad-rm-opciones" role="group" aria-label="Producto o insumo" data-rm-opciones="${esc(i)}">${htmlOpcionesRemito(i, cat, r.busqueda ?? '')}</div></div>`
    }

    // EL BUSCADOR DE CONOS (29/10/2026, pedido de Facu: antes salían de
    // entrada 12 conos por la A, sin scroll, estirando la pantalla). Con menos
    // de MIN_LETRAS_CONO letras, ninguno; con más, primero los que EMPIEZAN
    // así (el nombre o una de sus palabras), después los que lo contienen; sin
    // tildes ni mayúsculas y hasta MAX_CONOS_REMITO.
    const MIN_LETRAS_CONO = 2
    const MAX_CONOS_REMITO = 20

    function conosParaBuscar(marcas, busqueda) {
      const q = normalizar(busqueda)
      if (q.length < MIN_LETRAS_CONO) return []
      const empiezan = []
      const contienen = []
      for (const m of Array.isArray(marcas) ? marcas : []) {
        const n = normalizar(m?.nombre)
        if (!m?.id || !n) continue
        if (n.startsWith(q) || n.split(/[^a-z0-9ñ]+/).some(p => p && p.startsWith(q))) empiezan.push(m)
        else if (n.includes(q)) contienen.push(m)
      }
      const alfabetico = (a, b) => normalizar(a.nombre).localeCompare(normalizar(b.nombre))
      return [...empiezan.sort(alfabetico), ...contienen.sort(alfabetico)].slice(0, MAX_CONOS_REMITO)
    }

    function htmlMarcasRemito(r, i, cat) {
      if (normalizar(r.marcaBusqueda).length < MIN_LETRAS_CONO) return '<p class="ad-rm-pista">Escribí 2 o 3 letras del cono</p>'
      const lista = conosParaBuscar(cat?.marcas, r.marcaBusqueda)
      if (!lista.length) return `<p class="ad-rm-pista">${esc('Ningún cono coincide con «' + limpio(r.marcaBusqueda) + '».')}</p>`
      return lista.map(m => `<button type="button" class="ad-rm-opcion ad-rm-opcion--cono" data-rm-marca="${esc(i)}" data-id="${esc(m.id)}" aria-pressed="${m.id === r.marcaId ? 'true' : 'false'}">${esc(m.nombre)}</button>`).join('')
    }

    // Con el cono elegido (también el que leyó la IA), la lista cerrada y el
    // cono a la vista con "Cambiar"; si no, el buscador.
    function htmlConoRemito(r, i, cat) {
      const elegido = r.marcaId ? ((cat?.marcas ?? []).find(m => m.id === r.marcaId)?.nombre ?? 'Cono que no se pudo leer') : ''
      if (r.marcaId && !r.cambiandoCono) {
        return '<div class="ad-campo"><span class="ad-campo__rotulo">Cono</span>' +
          `<div class="ad-rm-cono-elegido" data-rm-cono-elegido="${esc(i)}"><span class="ad-rm-cono-elegido__nombre">${esc(elegido)}</span>` +
          `<button type="button" class="ad-link" data-rm-cono-cambiar="${esc(i)}">Cambiar</button></div></div>`
      }
      const rmDejarCono = r.marcaId ? `<button type="button" class="ad-link" data-rm-cono-dejar="${esc(i)}">${esc('Dejar ' + elegido)}</button>` : ''
      return `<div class="ad-campo"><label for="ad-rm-cono-${esc(i)}">Cono</label>` +
        `<input type="search" class="ad-input" id="ad-rm-cono-${esc(i)}" data-rm-cono-buscar="${esc(i)}" value="${esc(r.marcaBusqueda ?? '')}" autocomplete="off" maxlength="60" placeholder="Buscar el cono…">` +
        `${rmDejarCono}<div class="ad-rm-opciones ad-rm-opciones--conos" role="group" aria-label="Conos" data-rm-marcas="${esc(i)}">${htmlMarcasRemito(r, i, cat)}</div></div>`
    }

    // El nombre del renglón elegido con "× 252 u." en negrita.
    function htmlNombreRenglonRemito(cat, r) {
      const t = nombreRenglonRemito(cat, r)
      const u = r?.presentacionId ? textoUnidadesRemito(presentacionRemito(cat, r.presentacionId)) : ''
      const k = u ? t.indexOf(u) : -1
      if (k < 0) return esc(t)
      return `${esc(t.slice(0, k))}<strong class="ad-rm-unidades">${esc(u)}</strong>${esc(t.slice(k + u.length))}`
    }

    function filasLotesRemito(r) {
      return Array.isArray(r?.lotes) && r.lotes.length ? r.lotes : [{ lote: '', cajas: null }]
    }

    // Un insumo: la cantidad de cada lote en su unidad, con decimales (29/10/2026).
    function rotuloCantidadLote(r, cat = estado.catalogo) {
      if (!r?.insumoId) return 'Cajas'
      const u = unidadHoja(insumoDe(cat, r.insumoId)?.unidad_medida)
      return u ? `Cantidad (${u})` : 'Cantidad'
    }

    function htmlLotesRemito(r, i) {
      const filas = filasLotesRemito(r)
      const rotulo = rotuloCantidadLote(r)
      const cuerpo = filas.map((l, k) => '<div class="ad-rm-lote">' +
        `<label class="ad-rm-lote__campo"><span>Lote</span><input type="text" class="ad-input" data-rm-lote="${esc(i)}" data-k="${esc(k)}" value="${esc(l.lote ?? '')}" ` +
        `maxlength="${LARGO_LOTE_REMITO}" autocomplete="off" autocapitalize="characters" placeholder="Ej. 10430" aria-label="${esc('Lote ' + (k + 1))}"></label>` +
        `<label class="ad-rm-lote__campo ad-rm-lote__campo--cajas"><span>${esc(rotulo)}</span><input type="text" class="ad-input" data-rm-lote-cajas="${esc(i)}" data-k="${esc(k)}" ` +
        `inputmode="${r?.insumoId ? 'decimal' : 'numeric'}" autocomplete="off" aria-label="${esc((r?.insumoId ? 'Cantidad del lote ' : 'Cajas del lote ') + (k + 1))}"></label>` +
        (filas.length > 1 ? `<button type="button" class="ad-rm-lote__quitar" data-rm-lote-quitar="${esc(i)}" data-k="${esc(k)}" aria-label="${esc('Quitar el lote ' + (k + 1))}">×</button>` : '') +
        '</div>').join('')
      return `<div class="ad-rm-lotes"><p class="ad-campo__rotulo">¿De qué lotes?</p>${cuerpo}` +
        `<button type="button" class="ad-link" data-rm-lote-agregar="${esc(i)}">+ Agregar lote</button>` +
        `<p class="ad-rm-lotes__pie" data-rm-lotes-pie="${esc(i)}">${htmlResumenLotesRemito(r)}</p></div>`
    }

    // UN RENGLÓN: en AMARILLO si la IA lo marcó (revisar), con lo que leyó y
    // su nota; el selector si no tiene producto (o se tocó "Cambiar"); la
    // cantidad y los lotes; "Aceptar sugerencia", "No va en la orden" y
    // "Quitar". Omitido: tachado en gris, con "Va en la orden".
    function htmlRenglonRemito(r, i, cat, rm = estado.remito) {
      const rmLeido = limpio(r.texto_leido) ? `<p class="ad-rm-leido">Leído: «${esc(limpio(r.texto_leido))}»</p>` : ''
      const rmNota = limpio(r.nota) ? `<p class="ad-rm-nota">${esc(limpio(r.nota))}</p>` : ''
      // (El omitido sale antes, tachado: acá nunca es amarillo.)
      const amarillo = r.revisar === true && r.omitir !== true
      const sello = r.omitir === true ? '<span class="ad-sello ad-sello--omitido">No va en la orden</span>'
        : amarillo ? '<span class="ad-sello ad-sello--amarillo">Controlar</span>' : ''
      const rmCab = `<div class="ad-rm-renglon__cab"><span class="ad-rm-renglon__n">${esc('Renglón ' + (i + 1))}</span>${sello}</div>`
      if (r.omitir === true) {
        return `<div class="ad-rm-renglon ad-rm-renglon--omitido" data-rm-renglon="${esc(i)}">${rmCab}${rmLeido}${rmNota}` +
          `<p class="ad-rm-omitido__texto">${esc(nombreRenglonRemito(cat, r) || limpio(r.texto_leido) || 'Renglón sin producto')}</p>` +
          `<div class="ad-rm-renglon__acciones"><button type="button" class="ad-btn ad-btn--suave" data-rm-omitir="${esc(i)}" data-valor="no">Va en la orden</button></div></div>`
      }
      const elegido = !!(r.presentacionId || r.insumoId) && !r.eligiendo
      let cuerpo
      if (!elegido) cuerpo = htmlSelectorRemito(r, i, cat)
      else {
        const pr = presentacionRemito(cat, r.presentacionId)
        const ins = r.insumoId ? insumoDe(cat, r.insumoId) : null
        const rotulo = r.insumoId ? `Cantidad (${unidadHoja(ins?.unidad_medida) || 'unidad'})` : 'Cajas'
        cuerpo = `<div class="ad-rm-elegido"><span class="ad-rm-elegido__nombre">${htmlNombreRenglonRemito(cat, r)}</span>` +
          (r.insumoId ? '<span class="ad-sello">Insumo</span>' : '') +
          `<button type="button" class="ad-link" data-rm-cambiar="${esc(i)}">Cambiar</button></div>` +
          (pr?.con_cono ? htmlConoRemito(r, i, cat) : '') +
          `<div class="ad-campo ad-rm-cantidad"><label for="ad-rm-cantidad-${esc(i)}">${esc(rotulo)}</label>` +
          `<input type="text" class="ad-input" id="ad-rm-cantidad-${esc(i)}" data-rm-cantidad="${esc(i)}" inputmode="decimal" autocomplete="off"></div>` +
          // Talonario Acopio: el saldo del acopio que va a descontar (27/10/2026).
          (r.presentacionId ? htmlSaldoAcopioRemito(rm, r, i) + htmlLotesRemito(r, i) : r.insumoId ? htmlLotesRemito(r, i) : '')
      }
      const rmAceptar = puedeAceptarSugerencia(r) ? `<button type="button" class="ad-btn ad-btn--secundario" data-rm-aceptar="${esc(i)}">Aceptar sugerencia</button>` : ''
      return `<div class="ad-rm-renglon${amarillo ? ' ad-rm-renglon--revisar' : ''}" data-rm-renglon="${esc(i)}">${rmCab}${rmLeido}${rmNota}${cuerpo}` +
        `<div class="ad-rm-renglon__acciones">${rmAceptar}` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-omitir="${esc(i)}" data-valor="si">No va en la orden</button>` +
        `<button type="button" class="ad-link" data-rm-quitar="${esc(i)}">Quitar el renglón</button></div></div>`
    }

    // El buscador de clientes de siempre del módulo (el de Retenciones y
    // Asentar: nombre, razón social, apodo), entre los activos de la fábrica.
    function htmlClientesRemito(rm) {
      const q = limpio(rm?.form?.clienteBusqueda)
      if (q.length < MIN_LETRAS_BUSCAR) return `<p class="ad-texto-suave">${esc('Escribí al menos ' + MIN_LETRAS_BUSCAR + ' letras para buscar el cliente.')}</p>`
      if (!Array.isArray(estado.clientes)) return '<p class="ad-texto-suave">Cargando los clientes…</p>'
      const lista = clientesParaAsentar(estado.clientes.filter(c => c.activo !== false), q).slice(0, MAX_RESULTADOS_CLIENTES)
      if (!lista.length) return '<p class="ad-texto-suave">Ningún cliente de esta fábrica coincide.</p>'
      return '<div class="ad-opciones-clientes">' + lista.map(c => {
        const apodo = apodoMostrarRet(c, q)
        const razon = limpio(c.razon_social) && normalizar(c.razon_social) !== normalizar(c.nombre) ? limpio(c.razon_social) : ''
        const detalle = [razon, limpio(c.localidad)].filter(Boolean).join(' · ')
        return `<button type="button" class="ad-opcion-cliente" data-rm-cliente="${esc(c.id)}">` +
          `<span class="ad-opcion-cliente__nombre">${esc(limpio(c.nombre) + textoTambienEn(c) + (apodo ? ' · ' + apodo : ''))}</span>` +
          `${detalle ? `<span class="ad-opcion-cliente__detalle">${esc(detalle)}</span>` : ''}</button>`
      }).join('') + '</div>'
    }

    function htmlClienteRemito(rm) {
      const f = rm.form
      const leido = limpio(rm.fila?.cliente_leido)
      const rmAyuda = leido ? `<p class="ad-campo__ayuda">Leído en la foto: «${esc(leido)}»` +
        (f.clienteId ? '' : ' <button type="button" class="ad-link" data-rm-cliente-leido>Buscar así</button>') + '</p>' : ''
      if (f.clienteId) {
        const c = clienteDe(f.clienteId)
        return '<div class="ad-campo"><span class="ad-campo__rotulo">Cliente</span>' +
          `<div class="ad-ret-elegido"><span class="ad-ret-elegido__nombre">${esc(c?.nombre ?? 'Cliente (no se pudo leer)')}</span>` +
          `<button type="button" class="ad-btn ad-btn--suave" data-rm-cliente-cambiar>Cambiar</button></div>${rmAyuda}</div>`
      }
      return '<div class="ad-campo"><label for="ad-rm-cliente-buscar">Cliente</label>' +
        `<input type="search" class="ad-input" id="ad-rm-cliente-buscar" data-rm-cliente-buscar value="${esc(f.clienteBusqueda)}" autocomplete="off" maxlength="80" placeholder="Nombre, razón social o apodo">` +
        `${rmAyuda}<div id="ad-rm-clientes">${htmlClientesRemito(rm)}</div></div>`
    }

    function htmlEncabezadoRemito(rm) {
      const f = rm.form
      const rmTal = TALONARIOS.map(t => `<button type="button" class="ad-segmento__opcion" data-rm-talonario="${esc(t.id)}" aria-pressed="${f.talonario === t.id ? 'true' : 'false'}">${esc(t.nombre)}</button>`).join('')
      return '<div class="ad-tarjeta ad-rm-encabezado">' +
        `<div class="ad-campo"><span class="ad-campo__rotulo">Talonario</span><div class="ad-segmento" role="group" aria-label="Talonario">${rmTal}</div>` +
        `<span class="ad-campo__ayuda">${esc(f.talonario === 'acopio' ? 'Acopio: el talonario celeste con número rojo, para retirar lo ya facturado como acopio.' : 'Oficial: el talonario de Dolce Pasta (0001-0000…).')}</span></div>` +
        '<div class="ad-fila-campos">' +
        `<div class="ad-campo"><label for="ad-rm-numero">N° de remito</label><input type="text" class="ad-input" id="ad-rm-numero" data-rm-campo="numero" value="${esc(f.numero)}" maxlength="30" autocomplete="off"></div>` +
        `<div class="ad-campo"><label for="ad-rm-fecha">Fecha</label><input type="date" class="ad-input" id="ad-rm-fecha" data-rm-campo="fecha" value="${esc(f.fecha)}" max="${esc(hoyArgentina())}"></div></div>` +
        htmlClienteRemito(rm) +
        `<div class="ad-campo"><label for="ad-rm-transporte">Transporte</label><input type="text" class="ad-input" id="ad-rm-transporte" data-rm-campo="transporte" value="${esc(f.transporte)}" maxlength="120" autocomplete="off"></div>` +
        `<div class="ad-campo"><label for="ad-rm-observaciones">Observaciones</label><textarea class="ad-textarea" id="ad-rm-observaciones" data-rm-campo="observaciones" maxlength="500">${esc(f.observaciones)}</textarea></div></div>`
    }

    // La foto, firmada (createSignedUrl): solo un link https, un blob o una
    // imagen en data: (la maqueta) se dibuja.
    function urlFotoSegura(u) {
      const t = String(u ?? '')
      return /^https?:\/\//i.test(t) || /^blob:/i.test(t) || /^data:image\//i.test(t) ? t : null
    }

    function htmlFotoRemito(rm) {
      const ft = rm?.foto
      const z = Math.min(Math.max(Number(rm?.zoom) || 0, 0), ZOOM_FOTO_REMITO.length - 1)
      let rmLienzo
      if (!ft || ft.cargando) rmLienzo = '<div class="ad-vacio">Cargando la foto…</div>'
      else if (ft.error || !urlFotoSegura(ft.url)) rmLienzo = `<div class="ad-aviso">${esc(ft.error || 'No se pudo mostrar la foto.')}</div>`
      else rmLienzo = `<div class="ad-rm-foto__lienzo"><img class="ad-rm-foto__img" data-rm-foto alt="Foto del remito" style="width: ${esc(ZOOM_FOTO_REMITO[z] * 100)}%"></div>`
      const rmZoom = '<div class="ad-rm-foto__zoom" role="group" aria-label="Zoom de la foto">' +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-zoom="-1" aria-label="Achicar la foto"${z <= 0 ? ' disabled' : ''}>−</button>` +
        `<span class="ad-rm-foto__nivel">${esc(Math.round(ZOOM_FOTO_REMITO[z] * 100) + ' %')}</span>` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-zoom="1" aria-label="Agrandar la foto"${z >= ZOOM_FOTO_REMITO.length - 1 ? ' disabled' : ''}>+</button></div>`
      return `<div class="ad-tarjeta ad-rm-foto">${rmZoom}${rmLienzo}</div>`
    }

    // ORDEN INTERNA (29/10/2026): el cliente ES otra empresa del grupo
    // (clientes.unidad_grupo_id). Al confirmar, la base (_orden_grupo_espejar)
    // arma la recepción EN TRÁNSITO: la mercadería entra al stock de esa
    // empresa recién cuando la reciben (recibir_orden_grupo, en Stock).
    // Devuelve el nombre de esa empresa, o null.
    function empresaGrupoRemito(rm) {
      const c = clienteDe(rm?.form?.clienteId)
      const u = c?.unidad_grupo_id
      if (!u || u === (rm?.fila?.unidad_negocio_id ?? estado.empresaId)) return null
      return limpio((estado.unidades ?? []).find(x => x.id === u)?.nombre) || 'la otra empresa del grupo'
    }

    function textoOrdenInterna(empresa) {
      return `Es una orden interna: la mercadería va en tránsito hasta que ${empresa} la reciba.`
    }

    function htmlAccionesRemito(rm) {
      if (!puedeEn('retiros', 'cargar', rm.fila?.unidad_negocio_id ?? estado.empresaId)) {
        return '<div class="ad-aviso">Con tu usuario podés mirar el remito, pero no corregirlo ni confirmarlo (hace falta Retiros · cargar en esta fábrica).</div>'
      }
      const rmDis = rm.trabajando ? ' disabled' : ''
      const rmError = rm.mensaje ? `<p class="ad-error-pegado" id="ad-rm-error" role="alert">${esc(rm.mensaje)}</p>` +
        (rm.yaIngresado ? `<button type="button" class="ad-btn ad-btn--peligro" data-rm-accion="ya-ingresado"${rmDis}>Descartar (ya ingresado)</button>` : '') : ''
      const rmAviso = rm.aviso ? `<p class="ad-aviso" id="ad-rm-aviso">${esc(rm.aviso)}</p>` : ''
      const rmLeer = rm.confirmarLeer ? '<div class="ad-panel" id="ad-rm-panel-leer">' +
        `<p>${esc('Volver a leer la foto con la IA pisa todo lo de este remito, también lo que ya corregiste.')}</p>` +
        `<div class="ad-panel__acciones"><button type="button" class="ad-btn" data-rm-accion="leer-si"${rmDis}>Sí, volver a leer</button>` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-accion="leer-no"${rmDis}>Cancelar</button></div></div>` : ''
      const rmDescartar = rm.descartar ? '<div class="ad-panel ad-panel--peligro" id="ad-rm-panel-descartar"><div class="ad-campo">' +
        '<label for="ad-rm-motivo">¿Por qué se descarta? (obligatorio)</label>' +
        `<textarea class="ad-textarea" id="ad-rm-motivo" data-rm-motivo maxlength="300" placeholder="Foto repetida, no es un remito…">${esc(rm.descartar.motivo)}</textarea></div>` +
        (rm.descartar.error ? `<p class="ad-error-pegado" id="ad-rm-descartar-error">${esc(rm.descartar.error)}</p>` : '') +
        `<div class="ad-panel__acciones"><button type="button" class="ad-btn ad-btn--peligro" data-rm-accion="descartar-si"${rmDis}>Descartar el remito</button>` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-accion="descartar-no"${rmDis}>Cancelar</button></div></div>` : ''
      const grupo = empresaGrupoRemito(rm)
      const rmInterna = grupo ? `<p class="ad-aviso ad-rm-interna" id="ad-rm-interna" role="note">${esc(textoOrdenInterna(grupo))}</p>` : ''
      return `<div class="ad-rm-acciones">${rmError}${rmAviso}${rmLeer}${rmDescartar}${rmInterna}<div class="ad-barra-acciones">` +
        `<button type="button" class="ad-btn" data-rm-accion="confirmar"${rmDis}>Confirmar</button>` +
        htmlGuardadoRemito(rm) +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-accion="leer"${rmDis}>Volver a leer</button>` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-accion="descartar"${rmDis}>Descartar</button></div></div>`
    }

    function pintarTituloRemito() {
      const rm = estado.remito
      const f = rm?.form
      document.getElementById('ad-remito-titulo').textContent = f ? (textoNumeroRemito({ numero_remito: f.numero, talonario: f.talonario }) || 'Remito sin número') : 'Remito'
    }

    function pintarFotoRemito() {
      const el = document.getElementById('ad-rm-foto-caja')
      if (el && estado.remito) el.innerHTML = htmlFotoRemito(estado.remito)
      ponerSrcFotoRemito()
    }

    // El link firmado va a la propiedad src (nunca dentro del HTML), y solo
    // si es uno que se puede mostrar (urlFotoSegura).
    function ponerSrcFotoRemito() {
      const url = urlFotoSegura(estado.remito?.foto?.url)
      const img = document.getElementById('ad-rm-foto-caja')?.querySelector?.('[data-rm-foto]')
      if (img && url) img.src = url
    }

    function pintarRemito() {
      const rm = estado.remito
      const cuerpo = document.getElementById('ad-remito-cuerpo')
      if (!rm || !cuerpo) return
      pintarTituloRemito()
      if (rm.error) { cuerpo.innerHTML = `<div class="ad-aviso ad-aviso--grave">${esc(rm.error)}</div>`; return }
      if (!rm.form) { cuerpo.innerHTML = '<div class="ad-vacio">Cargando el remito…</div>'; return }
      const cat = estado.catalogo
      const rmLectura = rm.fila?.estado === 'error' ? `<div class="ad-aviso ad-aviso--grave">${esc('La IA no pudo leerlo' + (limpio(rm.fila?.error) ? ': ' + limpio(rm.fila.error) : '.') + ' Cargalo a mano o tocá Volver a leer.')}</div>`
        : rm.fila?.estado === 'leyendo' ? '<div class="ad-aviso">La IA todavía lo está leyendo. Podés esperar y volver, o cargarlo a mano.</div>' : ''
      const rmRenglones = rm.form.renglones.map((r, i) => htmlRenglonRemito(r, i, cat)).join('')
      cuerpo.innerHTML = `<div class="ad-rm"><div class="ad-rm__foto" id="ad-rm-foto-caja">${htmlFotoRemito(rm)}</div>` +
        `<div class="ad-rm__datos">${rmLectura}${htmlEncabezadoRemito(rm)}` +
        `<div class="ad-tarjeta"><h2 class="ad-subtitulo" id="ad-rm-resumen">${esc(textoResumenRemito(rm.form.renglones))}</h2>` +
        `<div class="ad-rm-renglones">${rmRenglones || '<p class="ad-texto-suave">Sin renglones: agregá uno.</p>'}</div>` +
        `<button type="button" class="ad-btn ad-btn--suave" data-rm-agregar>+ Agregar renglón</button></div>${htmlAccionesRemito(rm)}</div></div>`
      ponerSrcFotoRemito()
      // Los números se enlazan DESPUÉS de dibujarlos y se escriben con
      // ponerNumero(): nunca un número en un value="…".
      for (const input of cuerpo.querySelectorAll('[data-rm-cantidad]')) {
        const r = rm.form.renglones[Number(input.dataset.rmCantidad)]
        const ins = r?.insumoId ? insumoDe(cat, r.insumoId) : null
        enlazarCampoNumero(input, { decimales: r?.insumoId ? (ins?.unidad_medida === 'un' ? 0 : 3) : 0 })
        if (r) ponerNumero(input, r.cantidad)
      }
      for (const input of cuerpo.querySelectorAll('[data-rm-lote-cajas]')) {
        const r = rm.form.renglones[Number(input.dataset.rmLoteCajas)]
        // Cajas enteras; un insumo, con los decimales de su unidad (29/10/2026).
        enlazarCampoNumero(input, { decimales: r?.insumoId ? decimalesDeUnidad(insumoDe(cat, r.insumoId)?.unidad_medida) : 0 })
        ponerNumero(input, filasLotesRemito(r)[Number(input.dataset.k)]?.cajas ?? null)
      }
    }

    function renglonRemito(i) {
      return estado.remito?.form?.renglones?.[Number(i)] ?? null
    }

    // Cada cambio se guarda solo: lo que se escribe, con retardo (conRetardo);
    // lo que se toca, ya. La versión dice si lo que volvió de la base es lo
    // último que se cambió.
    function marcarSucioRemito(conRetardo = false) {
      const rm = estado.remito
      if (!rm) return
      rm.sucio = true
      rm.aviso = null
      rm.saliendo = false
      rm.version = (Number(rm.version) || 0) + 1
      if (rm.temporizador !== null && rm.temporizador !== undefined) clearTimeout(rm.temporizador)
      rm.temporizador = null
      if (conRetardo) {
        rm.temporizador = setTimeout(() => { rm.temporizador = null; autoguardarRemito(rm) }, RETARDO_AUTOGUARDADO_REMITO)
        pintarGuardadoRemito(rm)
      } else autoguardarRemito(rm)
    }

    // Elegir el producto saca el amarillo (revisar = false).
    function elegirProductoRemito(i, presentacionId) {
      const r = renglonRemito(i)
      const pr = presentacionRemito(estado.catalogo, presentacionId)
      if (!r || !pr) return
      // El cono que ya tenía queda si la nueva también lleva cono.
      if (!pr.con_cono) r.marcaId = null
      // Los lotes de un insumo (con decimales) no sirven para cajas.
      if (r.insumoId) r.lotes = []
      r.presentacionId = pr.id
      r.insumoId = null
      r.revisar = false
      r.eligiendo = false
      r.busqueda = ''
      marcarSucioRemito()
      pintarRemito()
    }

    function elegirInsumoRemito(i, insumoId) {
      const r = renglonRemito(i)
      if (!r || !insumoDe(estado.catalogo, insumoId)) return
      r.insumoId = insumoId
      r.presentacionId = null
      r.marcaId = null
      r.lotes = []
      r.revisar = false
      r.eligiendo = false
      r.busqueda = ''
      marcarSucioRemito()
      pintarRemito()
    }

    function elegirMarcaRemito(i, marcaId) {
      const r = renglonRemito(i)
      if (!r || !(estado.catalogo?.marcas ?? []).some(m => m.id === marcaId)) return
      r.marcaId = marcaId
      r.marcaBusqueda = ''
      // Elegido, la lista se cierra y queda el cono con "Cambiar".
      r.cambiandoCono = false
      marcarSucioRemito()
      pintarRemito()
    }

    // "Cambiar" abre el buscador del cono (vacío: la pista); "Dejar X" lo
    // cierra con el que estaba. No guarda nada: solo elegir guarda.
    function cambiarConoRemito(i, si) {
      const r = renglonRemito(i)
      if (!r) return
      r.cambiandoCono = !!si
      r.marcaBusqueda = ''
      pintarRemito()
      if (si) document.getElementById(`ad-rm-cono-${Number(i)}`)?.focus?.()
    }

    function cambiarProductoRemito(i, si) {
      const r = renglonRemito(i)
      if (!r) return
      r.eligiendo = !!si
      r.busqueda = ''
      pintarRemito()
      if (si) document.getElementById(`ad-rm-buscar-${Number(i)}`)?.focus?.()
    }

    function aceptarSugerenciaRemito(i) {
      const r = renglonRemito(i)
      if (!puedeAceptarSugerencia(r)) return
      r.revisar = false
      marcarSucioRemito()
      pintarRemito()
    }

    function omitirRenglonRemito(i, si) {
      const r = renglonRemito(i)
      if (!r) return
      r.omitir = !!si
      marcarSucioRemito()
      pintarRemito()
    }

    function quitarRenglonRemito(i) {
      const rm = estado.remito
      if (!renglonRemito(i)) return
      rm.form.renglones.splice(Number(i), 1)
      marcarSucioRemito()
      pintarRemito()
    }

    function agregarRenglonRemito() {
      const rm = estado.remito
      if (!rm?.form) return
      rm.form.renglones.push(renglonRemitoNuevo())
      marcarSucioRemito()
      pintarRemito()
      document.getElementById(`ad-rm-buscar-${rm.form.renglones.length - 1}`)?.focus?.()
    }

    function agregarLoteRemito(i) {
      const r = renglonRemito(i)
      if (!r) return
      r.lotes = [...filasLotesRemito(r).map(l => ({ ...l })), { lote: '', cajas: null }]
      marcarSucioRemito()
      pintarRemito()
      const campos = document.getElementById('ad-remito-cuerpo')?.querySelectorAll?.(`[data-rm-lote="${Number(i)}"]`)
      campos?.[campos.length - 1]?.focus?.()
    }

    function quitarLoteRemito(i, k) {
      const r = renglonRemito(i)
      if (!r) return
      r.lotes = filasLotesRemito(r).filter((_, j) => j !== Number(k))
      marcarSucioRemito()
      pintarRemito()
    }

    function pintarPieLotesRemito(i) {
      const r = renglonRemito(i)
      const el = document.getElementById('ad-remito-cuerpo')?.querySelector?.(`[data-rm-lotes-pie="${Number(i)}"]`)
      if (r && el) el.innerHTML = htmlResumenLotesRemito(r)
    }

    function elegirTalonarioRemito(t) {
      const f = estado.remito?.form
      if (!f || !TALONARIOS.some(x => x.id === t) || f.talonario === t) return
      f.talonario = t
      marcarSucioRemito()
      pintarRemito()
      cargarAcopiosRemito()
    }

    function elegirClienteRemito(id) {
      const f = estado.remito?.form
      const c = clienteDe(id)
      if (!f || !c || c.activo === false) return
      f.clienteId = id
      f.clienteBusqueda = ''
      marcarSucioRemito()
      pintarRemito()
      cargarAcopiosRemito()
    }

    function cambiarClienteRemito() {
      const f = estado.remito?.form
      if (!f) return
      f.clienteId = null
      marcarSucioRemito()
      pintarRemito()
      document.getElementById('ad-rm-cliente-buscar')?.focus?.()
    }

    function buscarClienteLeidoRemito() {
      const rm = estado.remito
      if (!rm?.form) return
      rm.form.clienteBusqueda = limpio(rm.fila?.cliente_leido)
      pintarRemito()
    }

    function zoomFotoRemito(paso) {
      const rm = estado.remito
      if (!rm) return
      rm.zoom = Math.min(Math.max((Number(rm.zoom) || 0) + (Number(paso) || 0), 0), ZOOM_FOTO_REMITO.length - 1)
      pintarFotoRemito()
    }

    // Lo que se escribe no redibuja (el foco no se pierde): solo lo que
    // depende de eso (los resultados del buscador, el pie de los lotes).
    function alEscribirRemito(e) {
      const t = e?.target
      const rm = estado.remito
      if (!rm?.form || !t?.dataset) return
      const d = t.dataset
      if (d.rmCampo !== undefined) {
        if (!['numero', 'fecha', 'transporte', 'observaciones'].includes(d.rmCampo)) return
        rm.form[d.rmCampo] = t.value
        marcarSucioRemito(true)
        if (d.rmCampo === 'numero') pintarTituloRemito()
      } else if (d.rmClienteBuscar !== undefined) {
        rm.form.clienteBusqueda = t.value
        const el = document.getElementById('ad-rm-clientes')
        if (el) el.innerHTML = htmlClientesRemito(rm)
      } else if (d.rmBuscar !== undefined) {
        const r = renglonRemito(d.rmBuscar)
        if (!r) return
        r.busqueda = t.value
        const el = document.getElementById('ad-remito-cuerpo')?.querySelector?.(`[data-rm-opciones="${Number(d.rmBuscar)}"]`)
        if (el) el.innerHTML = htmlOpcionesRemito(Number(d.rmBuscar), estado.catalogo, r.busqueda)
      } else if (d.rmConoBuscar !== undefined) {
        const r = renglonRemito(d.rmConoBuscar)
        if (!r) return
        r.marcaBusqueda = t.value
        const el = document.getElementById('ad-remito-cuerpo')?.querySelector?.(`[data-rm-marcas="${Number(d.rmConoBuscar)}"]`)
        if (el) el.innerHTML = htmlMarcasRemito(r, Number(d.rmConoBuscar), estado.catalogo)
      } else if (d.rmCantidad !== undefined) {
        const r = renglonRemito(d.rmCantidad)
        if (!r) return
        r.cantidad = leerCampoNumero(t)
        marcarSucioRemito(true)
        pintarPieLotesRemito(d.rmCantidad)
        pintarAcopiosRemito()
      } else if (d.rmLote !== undefined || d.rmLoteCajas !== undefined) {
        const i = d.rmLote !== undefined ? d.rmLote : d.rmLoteCajas
        const r = renglonRemito(i)
        if (!r) return
        r.lotes = filasLotesRemito(r).map(l => ({ ...l }))
        const l = r.lotes[Number(d.k)]
        if (!l) return
        if (d.rmLote !== undefined) {
          const may = String(t.value).toUpperCase()
          if (may !== t.value) {
            const a = t.selectionStart, b = t.selectionEnd
            t.value = may
            try { t.setSelectionRange(a, b) } catch { /* sin selección */ }
          }
          l.lote = t.value
        } else l.cajas = leerCampoNumero(t)
        marcarSucioRemito(true)
        pintarPieLotesRemito(i)
      } else if (d.rmMotivo !== undefined && rm.descartar) {
        rm.descartar.motivo = t.value
      }
    }

    function alTocarRemito(e) {
      const b = e?.target?.closest?.('button')
      if (!b || b.disabled) return
      const d = b.dataset
      if (d.rmProducto !== undefined) elegirProductoRemito(d.rmProducto, d.presentacion)
      else if (d.rmInsumo !== undefined) elegirInsumoRemito(d.rmInsumo, d.id)
      else if (d.rmMarca !== undefined) elegirMarcaRemito(d.rmMarca, d.id)
      else if (d.rmConoCambiar !== undefined) cambiarConoRemito(d.rmConoCambiar, true)
      else if (d.rmConoDejar !== undefined) cambiarConoRemito(d.rmConoDejar, false)
      else if (d.rmCambiar !== undefined) cambiarProductoRemito(d.rmCambiar, true)
      else if (d.rmCambiarNo !== undefined) cambiarProductoRemito(d.rmCambiarNo, false)
      else if (d.rmAceptar !== undefined) aceptarSugerenciaRemito(d.rmAceptar)
      else if (d.rmOmitir !== undefined) omitirRenglonRemito(d.rmOmitir, d.valor === 'si')
      else if (d.rmQuitar !== undefined) quitarRenglonRemito(d.rmQuitar)
      else if (d.rmAgregar !== undefined) agregarRenglonRemito()
      else if (d.rmLoteAgregar !== undefined) agregarLoteRemito(d.rmLoteAgregar)
      else if (d.rmLoteQuitar !== undefined) quitarLoteRemito(d.rmLoteQuitar, d.k)
      else if (d.rmTalonario !== undefined) elegirTalonarioRemito(d.rmTalonario)
      else if (d.rmCliente !== undefined) elegirClienteRemito(d.rmCliente)
      else if (d.rmClienteCambiar !== undefined) cambiarClienteRemito()
      else if (d.rmClienteLeido !== undefined) buscarClienteLeidoRemito()
      else if (d.rmZoom !== undefined) zoomFotoRemito(Number(d.rmZoom))
      else if (d.rmAccion !== undefined) accionRemito(d.rmAccion)
    }

    function accionRemito(a) {
      const rm = estado.remito
      if (!rm?.form || rm.trabajando) return
      if (a === 'confirmar') confirmarRemito()
      else if (a === 'leer') { rm.confirmarLeer = true; rm.descartar = null; pintarRemito() }
      else if (a === 'leer-no') { rm.confirmarLeer = false; pintarRemito() }
      else if (a === 'leer-si') volverALeerRemito()
      else if (a === 'descartar') {
        rm.descartar = { motivo: '', error: null }
        rm.confirmarLeer = false
        pintarRemito()
        document.getElementById('ad-rm-motivo')?.focus?.()
      } else if (a === 'descartar-no') { rm.descartar = null; pintarRemito() }
      else if (a === 'descartar-si') descartarRemito(rm.descartar?.motivo)
      else if (a === 'ya-ingresado') descartarRemito('ya ingresado')
    }

    // ── Abrir, guardar, confirmar, volver a leer, descartar ──────────────
    // origen: 'subir' (la tarjeta naranja de Subir, 29/10/2026) o 'revisar'
    // (Órdenes cargadas): "‹ Remitos", Confirmar y Descartar vuelven ahí.
    async function abrirRemito(id, origen = 'revisar') {
      if (!id) return
      estado.origenRemito = origen === 'subir' ? 'subir' : 'revisar'
      // La fábrica del remito (desde Subir puede no ser la de Órdenes cargadas).
      const deSubida = (estado.subida?.filas ?? []).find(f => f?.id === id)
      if (deSubida?.unidad_negocio_id) usarEmpresaRemito(deSubida.unidad_negocio_id)
      const fila = (estado.remitos?.filas ?? []).find(r => r.id === id) ?? null
      const rm = {
        id, fila, form: fila ? formDesdeRemito(fila) : null, error: null, sucio: false, saliendo: false,
        foto: { cargando: true }, zoom: 0, trabajando: false, mensaje: null, aviso: null, yaIngresado: false, confirmarLeer: false, descartar: null,
        version: 0, temporizador: null, guardando: null, errorGuardado: null, ultimoGuardado: null, filaAlDia: false,
      }
      estado.remito = rm
      mostrarVista('ad-vista-remito')
      pintarRemito()
      try {
        await asegurarDatosEmpresa()
        if (!rm.fila) {
          const f = await leerRemito(id)
          if (!f) rm.error = 'No se encontró el remito: puede ser de una fábrica que no ves.'
          else { rm.fila = f; rm.form = formDesdeRemito(f) }
        }
      } catch (err) {
        console.error('No se pudo leer el remito:', err)
        if (!rm.form) rm.error = 'No se pudo leer el remito. Revisá la conexión y volvé a entrar.'
      }
      if (estado.remito !== rm) return
      pintarRemito()
      // De acopio: el saldo de cada renglón, al costado de la foto (no la frena).
      cargarAcopiosRemito(rm)
      await cargarFotoRemito(rm)
    }

    // Pasa a la fábrica del remito: si es otra, lo leído de la anterior
    // (clientes, catálogo, listas) se vuelve a leer.
    function usarEmpresaRemito(unidadId) {
      if (!unidadId || estado.empresaId === unidadId) return
      estado.empresaId = unidadId
      estado.clientes = null
      estado.catalogo = null
      estado.catalogoEmpresa = null
      estado.remitos = null
      estado.ordenes = null
    }

    async function cargarFotoRemito(rm) {
      const ruta = rm?.fila?.foto_path
      if (!ruta) rm.foto = { error: 'Este remito no tiene foto.' }
      else {
        try {
          const { data, error } = await supabase.storage.from('comprobantes').createSignedUrl(ruta, 600)
          if (error) throw error
          rm.foto = data?.signedUrl ? { url: data.signedUrl } : { error: 'No se pudo mostrar la foto.' }
        } catch (err) {
          console.error('No se pudo abrir la foto del remito:', err)
          rm.foto = { error: 'No se pudo abrir la foto. Revisá la conexión.' }
        }
      }
      if (estado.remito === rm) pintarFotoRemito()
    }

    // Lo que vuelve de la base (normalizado) deja al día la fila y la lista de
    // arriba. El formulario se rearma con eso solo si se pide (Volver a leer,
    // Confirmar): el autoguardado NO lo rearma, porque pisaría lo que se está
    // escribiendo, un renglón recién agregado o un lote a medio cargar.
    function aplicarFilaRemito(rm, fila, rearmar = true) {
      rm.fila = { ...(rm.fila ?? {}), ...fila }
      if (rearmar) {
        rm.form = formDesdeRemito(rm.fila)
        rm.sucio = false
      }
      const rr = estado.remitos
      if (Array.isArray(rr?.filas)) rr.filas = remitosPorRevisar(rr.filas.map(x => x.id === rm.id ? { ...x, ...fila } : x))
    }

    // El estado chico al lado de Confirmar: "Guardando…", "Guardado" o el
    // error de la base TAL CUAL. Se pinta solo (pintarGuardadoRemito) para no
    // redibujar lo que se está escribiendo.
    function estadoGuardadoRemito(rm) {
      if (!rm) return { clase: '', texto: '' }
      const esperando = rm.temporizador !== null && rm.temporizador !== undefined
      if (esperando || rm.guardando) return { clase: '', texto: 'Guardando…' }
      if (rm.sucio && rm.errorGuardado) return { clase: ' ad-rm-guardado--error', texto: rm.errorGuardado }
      if (rm.ultimoGuardado !== null && rm.ultimoGuardado !== undefined && !rm.sucio) return { clase: '', texto: 'Guardado' }
      return { clase: '', texto: 'Los cambios se guardan solos.' }
    }

    function htmlGuardadoRemito(rm) {
      const g = estadoGuardadoRemito(rm)
      return `<span class="ad-rm-guardado${g.clase}" id="ad-rm-guardado" role="status" aria-live="polite">${esc(g.texto)}</span>`
    }

    function pintarGuardadoRemito(rm) {
      if (estado.remito !== rm) return
      const el = document.getElementById('ad-rm-guardado')
      if (!el) return
      const g = estadoGuardadoRemito(rm)
      el.className = 'ad-rm-guardado' + g.clase
      el.textContent = g.texto
    }

    // Manda lo último a actualizar_remito_precarga. Si ya hay una llamada en
    // curso, no manda otra: cuando esa vuelve, si quedó algo nuevo (y no se
    // está escribiendo), lo manda. Lo que no cambió desde lo último guardado
    // no se vuelve a mandar. Sin Retiros · cargar no se guarda nada.
    function autoguardarRemito(rm) {
      if (!rm?.form) return Promise.resolve()
      if (rm.guardando) return rm.guardando
      // En pausa mientras se confirma, se vuelve a leer o se descarta: lo
      // que se cambie queda pendiente y se manda al terminar (si sigue).
      if (rm.pausado || !rm.sucio || !puedeGuardarRemito(rm)) return Promise.resolve()
      rm.guardando = (async () => {
        // Primero se suelta el hilo: si no hay nada que mandar, la vuelta
        // terminaría ANTES de que rm.guardando quede asignado, y quedaría
        // para siempre una promesa vieja ahí.
        await null
        while (rm.sucio && !rm.pausado && (rm.temporizador === null || rm.temporizador === undefined)) {
          const version = rm.version
          const params = parametrosActualizarRemito(rm)
          const clave = JSON.stringify(params)
          try {
            if (clave !== rm.ultimoGuardado) {
              const { data, error } = await supabase.rpc('actualizar_remito_precarga', params)
              if (error) throw error
              // filaAlDia: la fila es la que dejó la base con lo último (si no
              // vino, Confirmar no rearma con una fila vieja).
              rm.filaAlDia = !!(data && typeof data === 'object' && !Array.isArray(data))
              if (rm.filaAlDia) aplicarFilaRemito(rm, data, false)
            }
            rm.ultimoGuardado = clave
            rm.errorGuardado = null
            if (rm.version === version) rm.sucio = false
          } catch (err) {
            console.error('No se pudo guardar el remito:', err)
            // Si mientras tanto se cambió algo, se manda eso (puede arreglarlo);
            // si no, queda el error a la vista hasta el próximo cambio.
            if (rm.version !== version) continue
            rm.errorGuardado = err?.message || 'No se pudo guardar el remito. Revisá la conexión.'
            break
          }
        }
        rm.guardando = null
        pintarGuardadoRemito(rm)
      })()
      pintarGuardadoRemito(rm)
      return rm.guardando
    }

    // Lo que se escribió y todavía espera el retardo, se manda ya (al salir
    // del campo, al salir del remito, al esconder la página).
    function guardarYaRemito(rm = estado.remito) {
      if (!rm || rm.temporizador === null || rm.temporizador === undefined) return rm?.guardando ?? Promise.resolve()
      clearTimeout(rm.temporizador)
      rm.temporizador = null
      return autoguardarRemito(rm)
    }

    // Espera que termine el guardado en curso y manda lo que quedó sin
    // mandar. true si todo quedó guardado.
    async function esperarGuardadoRemito(rm) {
      const enCamino = !!rm.guardando || (rm.temporizador !== null && rm.temporizador !== undefined)
      // guardarYaRemito devuelve la vuelta en curso (que también manda lo
      // que cambió mientras tanto) o la que arranca.
      await guardarYaRemito(rm)
      // Si no había nada en camino (quedó el error de un guardado anterior),
      // se reintenta UNA vez; si recién falló, no se insiste.
      if (rm.sucio && !enCamino) await autoguardarRemito(rm)
      return !rm.sucio
    }

    // Antes de Volver a leer o Descartar: lo que espera el retardo ya no se
    // manda (se pisa o se tira), pero la llamada en curso se espera, para
    // que no caiga en la base DESPUÉS.
    async function frenarAutoguardadoRemito(rm) {
      rm.pausado = true
      if (rm.temporizador !== null && rm.temporizador !== undefined) clearTimeout(rm.temporizador)
      rm.temporizador = null
      while (rm.guardando) await rm.guardando
    }

    // Sale de la pausa y, si quedó algo sin mandar (y el remito sigue
    // abierto), lo manda.
    function seguirAutoguardadoRemito(rm) {
      rm.pausado = false
      if (rm.sucio && estado.remito === rm) autoguardarRemito(rm)
      else pintarGuardadoRemito(rm)
    }

    // Confirmar primero espera el guardado (y manda lo que quedó); recién
    // después llama a confirmar_remito_precarga. El error de la base va TAL
    // CUAL; si dice que ya entró como ingreso en la otra empresa, aparece
    // "Descartar (ya ingresado)".
    async function confirmarRemito() {
      const rm = estado.remito
      if (!rm?.form || rm.trabajando) return
      rm.trabajando = true
      rm.mensaje = null
      rm.yaIngresado = false
      rm.aviso = null
      rm.confirmarLeer = false
      rm.descartar = null
      pintarRemito()
      let res = null
      try {
        if (!(await esperarGuardadoRemito(rm))) throw new Error(rm.errorGuardado || 'No se pudo guardar el remito. Revisá la conexión.')
        // Con lo guardado a la vista (el amarillo es el de la base): si
        // confirmar dice "el renglón 2 está en amarillo", se ve cuál.
        if (rm.ultimoGuardado !== null && rm.filaAlDia) aplicarFilaRemito(rm, {}, true)
        rm.pausado = true
        const { data, error } = await supabase.rpc('confirmar_remito_precarga', { p_id: rm.id })
        if (error) throw error
        res = data ?? {}
      } catch (err) {
        console.error('No se pudo confirmar el remito:', err)
        rm.mensaje = err?.message || 'No se pudo confirmar el remito. Probá de nuevo.'
        rm.yaIngresado = RE_YA_INGRESADO.test(rm.mensaje)
        rm.trabajando = false
        if (estado.remito === rm) pintarRemito()
        if (rm.pausado) seguirAutoguardadoRemito(rm)
        return
      }
      rm.trabajando = false
      if (rm.temporizador !== null && rm.temporizador !== undefined) clearTimeout(rm.temporizador)
      rm.temporizador = null
      quitarRemitoDeLaLista(rm.id)
      // En Subir, la tarjeta pasa a VERDE "Orden cargada · D-00XX" (el código
      // de la respuesta; la lectura siguiente trae orden_codigo de la base).
      marcarSubidoRemito(rm.id, { estado: 'confirmada', orden_id: res.orden_id ?? null, orden_codigo: res.codigo ?? null,
        numero_remito: res.numero_remito ?? (limpio(rm.form.numero) || null), talonario: res.talonario ?? rm.form.talonario })
      const numero = textoNumeroRemito({ numero_remito: res.numero_remito ?? rm.form.numero, talonario: res.talonario ?? rm.form.talonario }) || 'El remito'
      const grupo = empresaGrupoRemito(rm)
      mostrarExito(`${numero} confirmado: ${res.codigo ? 'es la orden ' + res.codigo : 'ya es una orden'}. ` +
        (grupo ? `Va en tránsito hasta que ${grupo} la reciba. ` : '') + 'Ya se puede valorizar en Administración.')
      if (estado.remito === rm) estado.remito = null
      estado.ordenes = null
      if (estado.vista === 'ad-vista-remito') await salirDeRemito()
    }

    // El mensaje de una Edge Function que respondió con error: el que trae
    // en su cuerpo ({ error }), si no el de supabase-js.
    async function mensajeDeFuncion(error) {
      try {
        const cuerpo = await error?.context?.json?.()
        if (cuerpo?.error) return String(cuerpo.error)
      } catch { /* sin cuerpo */ }
      return error?.message || 'No se pudo volver a leer la foto. Probá de nuevo.'
    }

    async function volverALeerRemito() {
      const rm = estado.remito
      if (!rm?.form || rm.trabajando) return
      rm.trabajando = true
      rm.confirmarLeer = false
      rm.mensaje = null
      rm.yaIngresado = false
      rm.aviso = 'Leyendo la foto de nuevo…'
      pintarRemito()
      await frenarAutoguardadoRemito(rm)
      try {
        const { data, error } = await supabase.functions.invoke('ocr-remito', { body: { remito_id: rm.id } })
        if (error) throw new Error(await mensajeDeFuncion(error))
        if (data?.error) throw new Error(String(data.error))
        let fila = data?.id === rm.id ? data : (data?.remito?.id === rm.id ? data.remito : null)
        if (!fila) fila = await leerRemito(rm.id)
        if (!fila) throw new Error('No se encontró el remito.')
        if (estado.remito === rm) {
          // Lo leído pisa todo, también lo que se cambió mientras leía.
          aplicarFilaRemito(rm, fila)
          rm.ultimoGuardado = null
          rm.errorGuardado = null
          rm.aviso = fila.estado === 'error' ? null : 'Listo: se volvió a leer la foto.'
        }
      } catch (err) {
        console.error('No se pudo volver a leer el remito:', err)
        rm.aviso = null
        rm.mensaje = err?.message || 'No se pudo volver a leer la foto. Probá de nuevo.'
      }
      rm.trabajando = false
      if (estado.remito === rm) pintarRemito()
      seguirAutoguardadoRemito(rm)
    }

    async function descartarRemito(motivo) {
      const rm = estado.remito
      if (!rm?.form || rm.trabajando) return
      const m = limpio(motivo)
      if (m.length < LARGO_MINIMO_MOTIVO_REMITO) {
        rm.descartar = { motivo: String(motivo ?? ''), error: `Poné el motivo (al menos ${LARGO_MINIMO_MOTIVO_REMITO} letras): foto repetida, no es un remito…` }
        pintarRemito()
        return
      }
      rm.trabajando = true
      if (rm.descartar) rm.descartar.error = null
      rm.mensaje = null
      pintarRemito()
      await frenarAutoguardadoRemito(rm)
      try {
        const { error } = await supabase.rpc('descartar_remito_precarga', { p_id: rm.id, p_motivo: m })
        if (error) throw error
      } catch (err) {
        console.error('No se pudo descartar el remito:', err)
        const texto = err?.message || 'No se pudo descartar el remito. Probá de nuevo.'
        if (rm.descartar) rm.descartar.error = texto
        else rm.mensaje = texto
        rm.trabajando = false
        if (estado.remito === rm) pintarRemito()
        seguirAutoguardadoRemito(rm)
        return
      }
      rm.trabajando = false
      quitarRemitoDeLaLista(rm.id)
      marcarSubidoRemito(rm.id, { estado: 'descartada', descartado_motivo: m })
      mostrarExito(`${textoNumeroRemito({ numero_remito: rm.form.numero, talonario: rm.form.talonario }) || 'El remito'} se descartó (${m}).`)
      if (estado.remito === rm) estado.remito = null
      if (estado.vista === 'ad-vista-remito') await salirDeRemito()
    }

    function puedeGuardarRemito(rm) {
      return !!rm && puedeEn('retiros', 'cargar', rm.fila?.unidad_negocio_id ?? estado.empresaId)
    }

    // Algo sin mandar o mandándose (sin permiso para guardar, nada).
    function pendienteRemito(rm) {
      if (!puedeGuardarRemito(rm)) return false
      return !!(rm.sucio || rm.guardando || (rm.temporizador !== null && rm.temporizador !== undefined))
    }

    // "‹ Remitos": lo que quedó sin mandar se manda igual, y se sale cuando la
    // base respondió. Si lo rechaza, se queda con el error a la vista; el
    // segundo toque sale igual. Sale a donde se abrió (Subir u Órdenes
    // cargadas) o a la pestaña tocada (destino).
    async function volverDeRemito(destino) {
      const rm = estado.remito
      if (rm?.trabajando) return
      if (rm && !rm.saliendo && pendienteRemito(rm)) {
        rm.saliendo = true
        const ok = await esperarGuardadoRemito(rm)
        if (estado.remito !== rm || !rm.saliendo) return
        if (!ok) {
          rm.aviso = 'No se pudo guardar el último cambio (el error está al lado de Confirmar). Volvé a tocar «‹ Remitos» para salir igual.'
          pintarRemito()
          return
        }
      }
      estado.remito = null
      salirDeRemito(destino)
    }

    // A la pestaña de donde se abrió el remito (o la pedida), si la ve; si
    // no, a la otra.
    function salirDeRemito(destino = estado.origenRemito) {
      estado.remito = null
      const p = destino === 'subir' ? 'subir' : 'revisar'
      if (p === 'subir' && puedeSubirRemitos()) return abrirSubirRemitos()
      if (empresasDeRevision().length) return mostrarRevisar()
      if (puedeSubirRemitos()) return abrirSubirRemitos()
    }

    // ── En la revisión de un remito de talonario ACOPIO (27/10/2026) ───────
    // Al lado de cada renglón, el saldo del acopio que va a descontar
    // confirmar_remito_precarga: los activos del cliente con el MISMO
    // producto y cono (si hay varios, se suman). Si no hay o no alcanza, en
    // amarillo; es solo un aviso: el error definitivo lo da la base al
    // confirmar, tal cual.
    function claveAcopio(presentacionId, marcaId) {
      return String(presentacionId ?? '') + '|' + String(marcaId ?? '')
    }

    async function cargarAcopiosRemito(rm = estado.remito) {
      const f = rm?.form
      if (!f || f.talonario !== 'acopio' || !f.clienteId) return
      if (rm.acopios?.clienteId === f.clienteId && !rm.acopios.error) return
      const a = { clienteId: f.clienteId, filas: null, error: null, cargando: true }
      rm.acopios = a
      pintarAcopiosRemito(rm)
      try {
        a.filas = await leerAcopios(rm.fila?.unidad_negocio_id ?? estado.empresaId, a.clienteId)
      } catch (err) {
        console.error('No se pudo leer el acopio del cliente:', err)
        a.error = 'No se pudo leer el acopio del cliente: revisá la conexión.'
      }
      a.cargando = false
      if (estado.remito === rm && rm.acopios === a) pintarAcopiosRemito(rm)
    }

    // null (no va), { cargando }, { error } o { saldo, pide, alcanza }.
    function saldoAcopioRemito(rm, r) {
      const f = rm?.form
      if (!f || f.talonario !== 'acopio' || !f.clienteId || !r?.presentacionId || r.omitir === true) return null
      const a = rm.acopios
      if (!a || a.clienteId !== f.clienteId || a.cargando) return { cargando: true }
      if (a.error) return { error: a.error }
      const k = claveAcopio(r.presentacionId, r.marcaId)
      const saldo = (a.filas ?? []).filter(x => estadoAcopio(x) === 'activo' && claveAcopio(x.presentacion_id, x.marca_id) === k)
        .reduce((s, x) => s + Math.max(cajasAcopio(x.saldo), 0), 0)
      const pide = (f.renglones ?? []).filter(x => x.omitir !== true && x.presentacionId && claveAcopio(x.presentacionId, x.marcaId) === k)
        .reduce((s, x) => s + (Number(x.cantidad) > 0 ? Number(x.cantidad) : 0), 0)
      return { saldo, pide, alcanza: saldo > 0 && pide <= saldo }
    }

    function htmlSaldoAcopioRemito(rm, r, i) {
      const s = saldoAcopioRemito(rm, r)
      if (!s) return ''
      let texto
      let clase = 'ad-rm-acopio'
      if (s.cargando) texto = 'Buscando el acopio del cliente…'
      else if (s.error) texto = s.error
      else if (!s.alcanza) {
        clase += ' ad-rm-acopio--falta'
        texto = s.saldo > 0 ? `No hay acopio de esto para el cliente: quedan ${enteroHoja(s.saldo)} ${s.saldo === 1 ? 'caja' : 'cajas'} y el remito pide ${enteroHoja(s.pide)}.`
          : 'No hay acopio de esto para el cliente.'
      } else texto = `Acopio: quedan ${enteroHoja(s.saldo)} ${s.saldo === 1 ? 'caja' : 'cajas'}` + (s.pide > 0 ? `; después de este remito, ${enteroHoja(s.saldo - s.pide)}.` : '.')
      return `<p class="${esc(clase)}" data-rm-acopio="${esc(i)}">${esc(texto)}</p>`
    }

    // Sin redibujar el remito (el foco no se pierde): solo los saldos.
    function pintarAcopiosRemito(rm = estado.remito) {
      const cuerpo = document.getElementById('ad-remito-cuerpo')
      if (!rm?.form || !cuerpo) return
      for (const el of cuerpo.querySelectorAll?.('[data-rm-acopio]') ?? []) {
        const i = Number(el.dataset.rmAcopio)
        const r = rm.form.renglones[i]
        el.outerHTML = r ? htmlSaldoAcopioRemito(rm, r, i) : ''
      }
    }

    // ── Abajo: las órdenes de la fábrica por N° de remito ─────────────────
    // ordenes_retiro (retiros:ver): las de los últimos DIAS_ORDENES_REMITO
    // días, con su N° de remito y su talonario. Se valorizan en
    // Administración (el link de abajo).
    const DIAS_ORDENES_REMITO = 120
    const TOPE_ORDENES_REMITO = 400
    const ETIQUETA_ESTADO_ORDEN = { anulada: 'Anulada', pendiente: 'Por valorizar', valorizada: 'Valorizada' }

    async function cargarOrdenesRemito() {
      const turno = ++estado.turnoOrdenes
      const empresaId = estado.empresaId
      estado.ordenes = null
      estado.errorOrdenes = null
      pintarOrdenesRemito()
      try {
        const desde = new Date(Date.now() - DIAS_ORDENES_REMITO * 86400000).toISOString().slice(0, 10)
        const { data, error } = await supabase.from('ordenes_retiro')
          .select('id, codigo, fecha, estado, estado_valorizacion, cliente_id, numero_remito, numero_remito_n, talonario')
          .eq('unidad_negocio_id', empresaId).gte('fecha', desde)
          .order('fecha', { ascending: false }).limit(TOPE_ORDENES_REMITO)
        if (error) throw error
        if (turno !== estado.turnoOrdenes) return
        estado.ordenes = (Array.isArray(data) ? data : []).filter(o => o?.id)
      } catch (err) {
        if (turno !== estado.turnoOrdenes) return
        console.error('No se pudieron leer las órdenes:', err)
        estado.errorOrdenes = 'No se pudieron leer las órdenes. Revisá la conexión y volvé a entrar.'
      }
      pintarOrdenesRemito()
    }

    function estadoOrdenRemito(o) {
      if (o?.estado === 'anulada') return 'anulada'
      return o?.estado_valorizacion === 'valorizada' ? 'valorizada' : 'pendiente'
    }

    // La fila de una orden: el N° de remito grande, si está valorizada, el
    // cliente, la fecha y el código de la orden.
    function htmlFilaOrdenRemito(o) {
      const cli = clienteDe(o.cliente_id)
      const numero = textoNumeroRemito(o) || 'Sin N° de remito'
      const est = estadoOrdenRemito(o)
      const meta = [cli?.nombre ?? 'Cliente', fechaCorta(o.fecha), o.codigo ? 'Orden ' + o.codigo : ''].filter(Boolean).join(' · ')
      return `<div class="ad-fila ad-fila--remito rd-fila-orden${est === 'anulada' ? ' ad-fila--anulada' : ''}${est === 'pendiente' ? ' ad-fila--atencion' : ''}" data-orden="${esc(o.id)}">` +
        `<span class="ad-fila__linea"><span class="ad-rm-numero${limpio(o.numero_remito) ? '' : ' ad-rm-numero--sin'}">${esc(numero)}</span>` +
        `<span class="ad-fila__sellos"><span class="ad-sello ad-sello--orden-${esc(est)}">${esc(ETIQUETA_ESTADO_ORDEN[est])}</span>${htmlSelloAcopio(o)}</span></span>` +
        `<span class="ad-fila__linea"><span class="ad-fila__meta">${esc(meta)}</span></span></div>`
    }

    function htmlListaOrdenesRemito() {
      if (estado.errorOrdenes) return `<div class="ad-aviso ad-aviso--grave">${esc(estado.errorOrdenes)}</div>`
      if (estado.ordenes === null) return '<div class="ad-vacio">Cargando las órdenes…</div>'
      const lista = ordenesVisibles()
      const q = limpio(estado.buscarOrden)
      if (!lista.length && digitosRemito(q)) return `<div class="ad-vacio">${esc('Ningún remito de este talonario tiene «' + q + '» en el número.')}</div>`
      if (!lista.length) return '<div class="ad-vacio">No hay órdenes de este talonario en los últimos meses.</div>'
      return lista.map(htmlFilaOrdenRemito).join('')
    }

    function pintarOrdenesRemito() {
      const tal = document.getElementById('rd-ordenes-talonario')
      const lista = document.getElementById('rd-ordenes-lista')
      if (tal) tal.innerHTML = htmlTalonariosOrdenes()
      if (lista) lista.innerHTML = htmlListaOrdenesRemito()
      // El buscador por N° de remito, con las órdenes ya leídas.
      const caja = document.getElementById('rd-buscar-orden-caja')
      if (caja) caja.hidden = !(sinControlStockEmpresa() && Array.isArray(estado.ordenes) && estado.ordenes.length)
      const link = document.getElementById('rd-link-admin')
      if (link) link.hidden = !puedeEn('retiros', 'precios')
    }

    // ── La fábrica de Revisar (con una sola, esa) ─────────────────────────
    const CLAVE_PESTANA = 'remitos-dolce.pestana'
    const CLAVE_FABRICA_REVISAR = 'remitos-dolce.fabrica'

    function htmlFabricaRevisar() {
      const lista = empresasDeRevision()
      if (lista.length < 2) return ''
      return '<div class="rd-fabricas" role="group" aria-label="Fábrica">' + lista.map(e =>
        `<button type="button" class="ad-segmento__opcion" data-rd-fabrica="${esc(e.id)}" aria-pressed="${e.id === estado.empresaId ? 'true' : 'false'}">${esc(e.nombre)}</button>`).join('') + '</div>'
    }

    function elegirFabricaRevisar(id) {
      if (!empresasDeRevision().some(e => e.id === id) || estado.empresaId === id) return
      estado.empresaId = id
      estado.clientes = null
      estado.catalogo = null
      estado.catalogoEmpresa = null
      estado.remitos = null
      estado.ordenes = null
      guardarPreferencia(CLAVE_FABRICA_REVISAR, id)
      mostrarRevisar()
    }

    async function mostrarRevisar() {
      if (!empresasDeRevision().length) return
      if (!empresasDeRevision().some(e => e.id === estado.empresaId)) {
        const ultima = leerPreferencia(CLAVE_FABRICA_REVISAR)
        estado.empresaId = (empresasDeRevision().find(e => e.id === ultima) ?? empresasDeRevision()[0]).id
      }
      estado.pestana = 'revisar'
      pintarPestanas()
      mostrarVista('rd-vista-revisar')
      document.getElementById('rd-revisar-fabrica').innerHTML = htmlFabricaRevisar()
      // Los clientes nombran las filas de abajo: se leen al costado (no frenan).
      asegurarDatosEmpresa().then(() => { pintarRemitosPrecarga(); pintarOrdenesRemito() })
        .catch(err => console.error('No se pudieron leer los clientes o el catálogo:', err))
      cargarRemitosPrecarga()
      await cargarOrdenesRemito()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EVENTOS
    // ═══════════════════════════════════════════════════════════════════════

    function conectarTodo() {
      document.getElementById('rd-tabs').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pestana]')
        if (b) elegirPestana(b.dataset.pestana)
      })
      // Subir
      document.getElementById('rt-remitos-camara').addEventListener('change', (e) => fotosElegidas(e.target))
      document.getElementById('rt-remitos-galeria').addEventListener('change', (e) => fotosElegidas(e.target))
      document.getElementById('rt-vista-remitos').addEventListener('click', (e) => {
        let b
        if ((b = e.target.closest('[data-remito-fabrica]'))) elegirFabricaRemitos(b.dataset.remitoFabrica)
        else if ((b = e.target.closest('[data-remito-reintentar]'))) reintentarRemito(b.dataset.remitoReintentar)
        else if ((b = e.target.closest('[data-remito-quitar]'))) quitarRemitoDeCola(b.dataset.remitoQuitar)
        // La tarjeta naranja "Listo para cargar lotes": el remito, ahí mismo.
        else if ((b = e.target.closest('[data-remito-abrir]'))) abrirRemito(b.dataset.remitoAbrir, 'subir')
      })
      // Revisar
      document.getElementById('rd-revisar-fabrica').addEventListener('click', (e) => {
        const b = e.target.closest('[data-rd-fabrica]')
        if (b) elegirFabricaRevisar(b.dataset.rdFabrica)
      })
      document.getElementById('rd-buscar-orden').addEventListener('input', (e) => buscarOrdenRemito(e.target.value))
      document.getElementById('ad-remitos').addEventListener('click', (e) => {
        const b = e.target.closest('[data-remito]')
        if (b) abrirRemito(b.dataset.remito)
      })
      document.getElementById('rd-ordenes-talonario').addEventListener('click', (e) => {
        const b = e.target.closest('[data-talonario-ordenes]')
        if (b) elegirTalonarioOrdenes(b.dataset.talonarioOrdenes)
      })
      document.getElementById('ad-remito-volver').addEventListener('click', () => volverDeRemito())
      document.getElementById('ad-remito-cuerpo').addEventListener('click', (e) => alTocarRemito(e))
      document.getElementById('ad-remito-cuerpo').addEventListener('input', (e) => alEscribirRemito(e))
      // Al salir de un campo, lo escrito se manda sin esperar el retardo.
      document.getElementById('ad-remito-cuerpo').addEventListener('change', () => guardarYaRemito())
      // Al esconder o cerrar la página, lo que quedó sin mandar se manda ya;
      // si todavía no llegó, el navegador pregunta antes de cerrar.
      document.addEventListener('visibilitychange', () => { if (document.hidden) guardarYaRemito() })
      window.addEventListener('pagehide', () => guardarYaRemito())
      window.addEventListener('beforeunload', (e) => {
        if (!pendienteRemito(estado.remito)) return
        guardarYaRemito()
        e.preventDefault()
        e.returnValue = ''
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    function sinAcceso(texto) {
      document.getElementById('rd-cargando').hidden = true
      const el = document.getElementById('rd-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    async function cargarPermisos() {
      const { data: emp, error } = await supabase
        .from('empleados').select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.miEmpleadoId = emp.id
      estado.miRolApp = emp.rol_app
      const { data: tareas, error: e2 } = await supabase
        .from('empleado_tareas').select('modulo, tarea, alcance')
        .eq('empleado_id', emp.id).eq('modulo', 'retiros').eq('habilitado', true)
      if (e2) throw e2
      estado.misTareas = new Map((tareas ?? []).map(t => [`${t.modulo}:${t.tarea}`, t.alcance ?? null]))
    }

    // Las fábricas: todas (para nombrarlas) y las SIN control de stock
    // (controla_stock_terminado = false) donde carga o ve retiros. La de
    // pruebas no cuenta para una cuenta real.
    async function cargarFabricas() {
      const { data, error } = await supabase.from('unidades_negocio').select('id, nombre, activo, controla_stock_terminado')
      if (error) throw error
      const activas = sinUnidadesDePrueba((data ?? []).filter(u => u?.id && u.activo !== false), estado.fabrica)
      estado.unidades = activas.map(u => ({ id: u.id, nombre: limpio(u.nombre) }))
      const sin = activas.filter(u => u.controla_stock_terminado === false)
      estado.sinControlIds = new Set(sin.map(u => u.id))
      estado.sinControl = new Map(activas.map(u => [u.id, u.controla_stock_terminado === false]))
      estado.empresas = sin.map(u => ({ id: u.id, nombre: limpio(u.nombre) }))
        .filter(e => puedeEn('retiros', 'cargar', e.id) || puedeEn('retiros', 'ver', e.id))
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      try {
        const [, f] = await Promise.all([cargarPermisos(), cargarFabricaDePruebas(supabase)])
        estado.fabrica = f
        await cargarFabricas()
      } catch (err) {
        console.error('No se pudieron leer los permisos o las fábricas:', err)
        sinAcceso('No pudimos identificar tu usuario o tus fábricas. Te llevamos al inicio…')
        return
      }
      if (!pestanasVisibles().length) {
        sinAcceso('No tenés permiso para subir ni ver los remitos de Dolce Pasta. Te llevamos al inicio…')
        return
      }
      document.getElementById('rd-cargando').hidden = true
      conectarTodo()
      const pedida = new URLSearchParams(window.location.search).get('pestana') || leerPreferencia(CLAVE_PESTANA)
      const p = pestanasVisibles().includes(pedida) ? pedida : pestanasVisibles()[0]
      elegirPestana(p)
    }

    mostrarBannerVersion()
    init()
  </script>
</body>
</html>
