<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Remitos Dolce — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#FFFFFF">

  <!-- REMITOS DOLCE (28/10/2026, rama ci-prueba/modulo-remitos-dolce). Pedido
       de Facu: los remitos de Rosario en un MÓDULO APARTE, para que no se
       mezclen con la Carga ni con Administración. Antes (27/10/2026) subir
       estaba en la Carga (retiros.html, "Subir remitos Rosario") y revisar en
       Administración → Órdenes. El código se MUDÓ (no se copió): lo que usan
       dos pantallas vive en js/remitos-comun.js (decimoséptima excepción).

       Dos pestañas:
       - SUBIR (retiros:cargar con alcance en una fábrica SIN control de stock,
         hoy solo Dolce Pasta): la foto de cada remito hecho a mano, la cola
         sin señal y "Mis remitos subidos" con su estado ("Confirmado: Orden
         D-0012" con remitos_precarga.orden_codigo, que Manuel puede leer).
       - REVISAR (retiros:ver en esa fábrica; corregir y confirmar piden
         además retiros:cargar, como la base): los precargados arriba y abajo
         las órdenes por N° de remito, el más nuevo primero, en solapas
         Oficial / Acopio. Corregir, confirmar, descartar, talonario, saldo de
         acopio y zoom de la foto: lo mismo que había en Administración.

       Los nombres de clase quedaron como venían (rt-* lo de Subir, ad-* lo de
       Revisar) para mover el código tal cual; rd-* es lo propio del módulo.

       UN SOLO RECORRIDO (29/10/2026, rama ci-prueba/remitos-mas-simple, pedido
       de Facu: "que Manuel suba la foto y cargue los lotes en el mismo lugar").
       En Subir, cuando la IA termina, el remito queda en NARANJA "Listo para
       cargar lotes" y tocarlo abre el editor (ad-vista-remito) ahí mismo;
       confirmado, en VERDE "Orden cargada · D-00XX". La segunda pestaña se
       llama "Órdenes cargadas" (por dentro sigue siendo 'revisar': los links
       ?pestana=revisar de la Carga y de Administración la abren). En la base
       los estados siguen siendo 'precargada' y 'confirmada'. -->

  <style>
    [hidden] { display: none !important; }

    body {
      --rt-segmento-fondo: #EDE9E3;
      --rt-texto-2: #6B645A;
      --rt-modulo: oklch(0.5 0.13 250);
      --rt-borde-faltante: #E8CDD5;
      --rt-fila-faltante: #FBF1F4;
      --rt-viejo-pastilla: oklch(0.93 0.07 90);
      --rt-viejo-letra: #3B2E00;
      --ad-texto-secundario: var(--color-texto-2);
      --borde-tarjeta: var(--color-borde);
      --sombra-tarjeta: none;
      --ad-segmento-fondo: color-mix(in srgb, var(--naranja) 9%, transparent);
    }

    .rd-app { max-width: 1120px; margin: 0 auto; padding: 0 1rem 6rem; min-width: 0; }

    /* ── El encabezado: el de todos los módulos, .cab-modulo de main.css, con
       el color de Remitos Dolce (PALETA_MODULO de js/modulos.js: el azul de
       Rosario, 250). ── */
    .cab-modulo { --cab-modulo: oklch(0.5 0.13 250); --cab-modulo-suave: oklch(0.955 0.036 250); }

    .rd-vacio { padding: 2rem 0; text-align: center; color: var(--color-texto-2); }

    /* Las pestañas Subir / Revisar. */
    .rd-tabs { display: flex; gap: 8px; margin: 12px 0 4px; min-width: 0; }
    .rd-tab {
      flex: 1; min-height: 48px; border-radius: 12px; border: 2px solid var(--color-borde); background: var(--color-fondo);
      color: var(--color-texto); font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; padding: 0 12px;
    }
    .rd-tab[aria-pressed="true"] { border-color: oklch(0.5 0.13 250); color: oklch(0.42 0.13 250); background: oklch(0.955 0.036 250); }
    .rd-tab:focus-visible { outline: 3px solid oklch(0.42 0.13 250); outline-offset: 2px; }
    @media (min-width: 1024px) { .rd-tabs { max-width: 420px; } }

    .rd-link-admin { display: inline-block; margin: 4px 0 12px; font-weight: 700; color: var(--naranja-oscuro); }
    .rd-fabricas { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .rd-fila-orden { cursor: default; }

    /* ── Subir (de la Carga, 27/10/2026) ──────────────────────────────────
       La cámara, la galería y "Mis remitos subidos" con su estado. Naranja para
       lo que se toca, dorado del módulo para "Leyendo…", verde para
       confirmado y bordó para lo que no se pudo. */
    .rt-remitos-fabrica:focus-visible { outline: 3px solid var(--naranja-oscuro); outline-offset: 2px; }
    .rt-remitos-acciones { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .rt-remitos-camara {
      min-height: 124px; border-radius: 16px; background: var(--naranja); color: #fff; border: 2px solid var(--naranja);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; text-align: center; padding: 12px; touch-action: manipulation;
    }
    .rt-remitos-camara svg { width: 40px; height: 40px; }
    .rt-remitos-camara strong { font-family: var(--fuente-titulo); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .rt-remitos-camara small { font-size: 13.5px; font-weight: 600; }
    .rt-remitos-galeria {
      min-height: 48px; border-radius: var(--radio-boton); border: 2px solid var(--naranja); color: var(--naranja); background: var(--color-fondo);
      font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 0 12px; text-align: center;
    }
    .rt-remitos-galeria svg { width: 20px; height: 20px; flex-shrink: 0; }
    .rt-remitos-acciones:focus-within label { outline: 3px solid var(--naranja-oscuro); outline-offset: 2px; }
    .rt-remitos-acciones--apagadas label { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .rt-remitos-fabricas { display: flex; flex-wrap: wrap; gap: 8px; }
    .rt-remitos-fabrica {
      min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--color-borde); background: var(--color-fondo);
      font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--color-texto); max-width: 100%; overflow-wrap: anywhere;
    }
    .rt-remitos-fabrica[aria-pressed="true"] { border-color: var(--naranja); color: var(--naranja-oscuro); }
    .rt-remito { display: flex; align-items: center; gap: 10px; background: var(--color-fondo); border: 1px solid var(--color-borde); border-radius: 14px; padding: 8px 10px; min-width: 0; }
    .rt-remito__foto {
      width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--rt-segmento-fondo);
      display: flex; align-items: center; justify-content: center; color: var(--rt-texto-2);
    }
    .rt-remito__foto svg { width: 22px; height: 22px; }
    .rt-remito__texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; line-height: 1.25; }
    .rt-remito__estado { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; color: var(--color-texto); }
    .rt-remito__detalle { font-size: 13px; color: var(--color-texto-menu); overflow-wrap: anywhere; }
    /* Los estados (29/10/2026): "Leyendo…" en gris → "Listo para cargar
       lotes" en NARANJA (se toca y abre el remito) → "Orden cargada · D-00XX"
       en VERDE; "No se pudo leer" en bordó. */
    .rt-remito--subiendo .rt-remito__estado, .rt-remito--leyendo .rt-remito__estado { color: var(--rt-texto-2); }
    .rt-remito--precargada { border: 2px solid var(--naranja); background: var(--naranja-suave); }
    .rt-remito--precargada .rt-remito__estado { color: var(--naranja-oscuro); }
    .rt-remito--confirmada { border-color: var(--verde); background: var(--verde-suave); }
    .rt-remito--confirmada .rt-remito__estado { color: var(--verde-oscuro); }
    button.rt-remito { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; touch-action: manipulation; }
    button.rt-remito:focus-visible { outline: 3px solid var(--naranja-oscuro); outline-offset: 2px; }
    .rt-remito__ir { flex-shrink: 0; font-weight: 800; font-size: 14px; color: var(--naranja-oscuro); white-space: nowrap; }
    .rt-remito--error { border-color: var(--rt-borde-faltante); background: var(--rt-fila-faltante); }
    .rt-remito--error .rt-remito__estado { color: var(--bordo-oscuro); }
    .rt-remito--descartada .rt-remito__estado { color: var(--rt-texto-2); }
    /* El talonario de acopio (el celeste genérico, número rojo): un sello chico al lado del N°. */
    .rt-remito__sello {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--rt-viejo-pastilla); color: var(--rt-viejo-letra);
    }
    .rt-remito__accion { flex-shrink: 0; min-height: 44px; padding: 0 12px; font-size: 14px; }
    @media (min-width: 1024px) {
      #rt-vista-remitos { max-width: 820px; padding: 14px 0; }
      .rt-remitos-acciones { flex-direction: row; align-items: stretch; }
      .rt-remitos-camara { flex: 2; }
      .rt-remitos-galeria { flex: 1; min-height: 124px; border-radius: 16px; }
    }

    /* ── Los remitos precargados de Rosario (27/10/2026) ─────────────────
       Arriba de Revisar (antes en Administración → Órdenes). El
       renglón que la IA marcó, en AMARILLO; el que no va en la orden,
       tachado en gris. La foto al lado en la compu y arriba en el celular. */
    .ad-rm-seccion { margin: 0 0 1rem; min-width: 0; }
    .ad-rm-titulo { display: flex; align-items: center; gap: 0.5rem; margin-top: 0; }
    .ad-rm-contador { display: inline-flex; align-items: center; justify-content: center; min-width: 1.5rem; height: 1.5rem; padding: 0 0.375rem; border-radius: 999px; background: var(--amarillo-oscuro); color: #fff; font-size: 0.8125rem; letter-spacing: 0; }
    .ad-rm-numero { font-weight: 900; font-size: 1.125rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
    .ad-rm-numero--sin { color: var(--ad-texto-secundario); font-weight: 700; font-size: 1rem; }
    .ad-fila__sellos { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; min-width: 0; }
    /* .ad-sello.ad-sello--x (29/10/2026): la regla base .ad-sello va más abajo
       y pisaba el color; con las dos clases, cada sello tiene el suyo. */
    .ad-sello.ad-sello--acopio { background: #E4F2FB; color: #0B4F7A; border-color: #5AA9DA; }
    .ad-sello.ad-sello--amarillo { background: var(--amarillo-suave); color: var(--amarillo-oscuro); border-color: var(--amarillo); }
    .ad-sello.ad-sello--omitido { background: var(--color-superficie); color: var(--ad-texto-secundario); border-color: var(--color-borde); }
    .ad-sello.ad-sello--rm-error { background: var(--bordo-suave); color: var(--bordo-oscuro); border-color: var(--bordo); }
    .ad-sello.ad-sello--rm-precargada { background: var(--naranja-suave); color: var(--naranja-oscuro); border-color: var(--naranja); white-space: normal; }
    .ad-rm-tarjeta__error { color: var(--bordo-oscuro); font-weight: 600; }
    .ad-orden-remito { margin: 0 0 0.375rem; font-size: 1.25rem; font-weight: 900; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .ad-rm { display: grid; gap: 0.75rem; grid-template-columns: minmax(0, 1fr); min-width: 0; }
    @media (min-width: 1024px) {
      .ad-rm { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; }
      .ad-rm__foto { position: sticky; top: 0.75rem; }
    }
    .ad-rm__foto, .ad-rm__datos { min-width: 0; }
    .ad-rm-foto { padding: 0.5rem; }
    .ad-rm-foto__zoom { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.5rem; }
    .ad-rm-foto__nivel { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.5rem; text-align: center; }
    .ad-rm-foto__lienzo { overflow: auto; max-height: 70vh; border-radius: var(--radio-input); background: var(--color-superficie); }
    @media (max-width: 1023.98px) { .ad-rm-foto__lienzo { max-height: 45vh; } }
    .ad-rm-foto__img { display: block; max-width: none; height: auto; }
    .ad-rm-renglones { display: flex; flex-direction: column; gap: 0.625rem; margin: 0 0 0.75rem; min-width: 0; }
    .ad-rm-renglon { border: 1px solid var(--color-borde); border-radius: 12px; padding: 0.75rem; min-width: 0; background: var(--color-fondo); }
    .ad-rm-renglon--revisar { background: var(--amarillo-suave); border: 2px solid var(--amarillo); }
    .ad-rm-renglon--omitido { background: var(--color-superficie); color: var(--ad-texto-secundario); }
    .ad-rm-omitido__texto { margin: 0; text-decoration: line-through; overflow-wrap: anywhere; }
    .ad-rm-renglon__cab { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin: 0 0 0.375rem; }
    .ad-rm-renglon__n { font-weight: 800; font-size: 0.875rem; }
    .ad-rm-leido { margin: 0 0 0.25rem; font-size: 0.875rem; overflow-wrap: anywhere; }
    .ad-rm-nota { margin: 0 0 0.5rem; font-size: 0.875rem; font-weight: 700; color: var(--amarillo-oscuro); overflow-wrap: anywhere; }
    .ad-rm-renglon--omitido .ad-rm-nota { color: var(--ad-texto-secundario); }
    .ad-rm-elegido { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0 0 0.5rem; min-width: 0; }
    .ad-rm-elegido__nombre { font-weight: 700; overflow-wrap: anywhere; min-width: 0; flex: 1 1 12rem; }
    .rd-buscar-orden { margin: 0 0 0.75rem; max-width: 22rem; }
    /* Las listas del buscador (29/10/2026): de a una opción por renglón, con
       altura máxima y scroll propio (también en el celular); la página no se
       estira. Los conos, recién con 2 letras (htmlMarcasRemito). */
    .ad-rm-opciones { display: flex; flex-direction: column; gap: 0.375rem; margin: 0.375rem 0 0; max-height: 16rem; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-width: 0; }
    .ad-rm-opciones--conos { flex-direction: column; flex-wrap: nowrap; }
    .ad-rm-opciones--vacia { max-height: none; overflow: visible; }
    .ad-rm-pista { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--ad-texto-secundario); }
    .ad-rm-cono-elegido { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; min-width: 0; padding: 0.375rem 0.75rem; border: 2px solid var(--naranja); border-radius: var(--radio-input); background: var(--naranja-suave); }
    .ad-rm-cono-elegido__nombre { font-weight: 800; overflow-wrap: anywhere; min-width: 0; flex: 1 1 8rem; }
    /* "× 252 u." en negrita y sin cortarse en dos renglones. */
    .ad-rm-unidades { font-weight: 900; white-space: nowrap; }
    .ad-rm-grupo { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
    .ad-rm-grupo__titulo { margin: 0.375rem 0 0; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ad-texto-secundario); }
    .ad-rm-opcion {
      display: flex; flex-direction: column; align-items: flex-start; gap: 0.125rem; width: 100%; min-height: 44px; box-sizing: border-box;
      text-align: left; padding: 0.5rem 0.75rem; border: 1px solid var(--color-borde); border-radius: var(--radio-input);
      background: var(--color-fondo); font: inherit; color: var(--color-texto); cursor: pointer; overflow-wrap: anywhere; min-width: 0;
    }
    .ad-rm-opcion:hover { border-color: var(--color-borde-fuerte); }
    .ad-rm-opcion[aria-pressed="true"] { border-color: var(--naranja); background: var(--naranja-suave); font-weight: 700; }
    .ad-rm-opcion--cono { width: 100%; flex-shrink: 0; }
    .ad-rm-opciones > .ad-rm-opcion, .ad-rm-grupo > .ad-rm-opcion { flex-shrink: 0; }
    .ad-rm-opcion__detalle { font-size: 0.8125rem; color: var(--ad-texto-secundario); }
    .ad-rm-cantidad .ad-input { max-width: 10rem; }
    .ad-rm-lotes { margin: 0 0 0.5rem; min-width: 0; }
    .ad-rm-lotes > .ad-campo__rotulo { display: block; margin: 0 0 0.375rem; }
    .ad-rm-lote { display: flex; gap: 0.5rem; align-items: flex-end; margin: 0 0 0.375rem; min-width: 0; }
    .ad-rm-lote__campo { display: flex; flex-direction: column; gap: 0.125rem; flex: 1 1 0; min-width: 0; font-size: 0.8125rem; font-weight: 700; }
    .ad-rm-lote__campo--cajas { flex: 0 0 6rem; }
    .ad-rm-lote__quitar { min-width: 44px; min-height: 44px; border: 1px solid var(--color-borde); background: var(--color-fondo); border-radius: var(--radio-input); font-size: 1.25rem; cursor: pointer; }
    .ad-rm-lotes__pie { margin: 0.25rem 0 0; font-size: 0.875rem; overflow-wrap: anywhere; }
    .ad-rm-estado-lotes--falta { color: var(--bordo-oscuro); font-weight: 700; }
    .ad-rm-estado-lotes--ok { color: var(--verde-oscuro); font-weight: 700; }
    .ad-rm-lotes__asignado { font-weight: 700; }
    .ad-rm-lotes__asignado--falta { background: var(--amarillo-suave); border: 1px solid var(--amarillo); border-radius: 6px; padding: 0 0.375rem; color: var(--amarillo-oscuro); }
    .ad-rm-renglon__acciones { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0.5rem 0 0; }
    .ad-rm-acciones { min-width: 0; }
    .ad-rm-acciones > .ad-btn { margin: 0.375rem 0 0.5rem; }
    .ad-rm-guardado { font-size: 0.8125rem; color: var(--ad-texto-secundario); min-width: 0; overflow-wrap: anywhere; }
    .ad-rm-guardado--error { color: var(--bordo-oscuro); font-weight: 600; }
    /* El saldo del acopio al lado de cada renglón (de los Acopios). */
    .ad-rm-acopio { margin: 0 0 0.5rem; font-size: 0.875rem; font-weight: 700; color: #0B4F7A; overflow-wrap: anywhere; }
    .ad-rm-acopio--falta { background: var(--amarillo-suave); color: var(--amarillo-oscuro); border: 2px solid var(--amarillo); border-radius: 8px; padding: 0.375rem 0.5rem; }

    /* ── Lo de base que usa lo mudado (copiado de la Carga y de Administración, 28/10/2026) ── */
    .rt-contenido { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .rt-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .rt-num { font-family: var(--fuente-titulo); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .rt-btn { min-height: 44px; padding: 0 1rem; font: inherit; font-size: 15px; font-weight: 800;
      border-radius: var(--radio-boton); border: 2px solid var(--naranja);
      background: var(--naranja); color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
      text-align: center; touch-action: manipulation; }
    .rt-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .rt-btn--secundario { background: var(--color-fondo); color: var(--naranja); }
    .rt-btn--suave { background: var(--color-fondo); color: var(--color-texto); border-color: var(--color-borde-boton); }
    .rt-texto-suave { color: var(--rt-texto-2); font-size: 14px; margin: 0; }
    .rt-pista { color: var(--rt-texto-2); font-size: 12.5px; margin: 0; padding: 0 4px; }
    .rt-vacio { padding: 2rem 1rem; text-align: center; color: var(--rt-texto-2); }
    .rt-aviso { padding: 10px 12px; border-radius: 14px; margin: 0;
      background: var(--color-fondo); border: 1.5px solid var(--color-borde);
      color: var(--color-texto-menu); font-size: 14px; overflow-wrap: anywhere; line-height: 1.35; }
    .rt-aviso--grave { background: var(--bordo-suave); border-color: var(--rt-borde-faltante); color: var(--bordo-oscuro); font-weight: 600; }
    .rt-aviso strong { font-weight: 800; }
    .rt-campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .rt-campo > label, .rt-campo__rotulo { font-size: 11.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-texto-suave); }
    .rt-lista { display: flex; flex-direction: column; gap: 6px; }
    .rt-mis-cabecera { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
    .rt-mis-cabecera .rt-texto-suave { flex: 1; font-size: 14.5px; }
    .rt-mis-cabecera .rt-num { font-size: 18px; }
    .rt-fila__meta { font-size: 12.5px; color: var(--rt-texto-2); }
    .rt-remitos-camara { min-height: 124px; border-radius: 16px; background: var(--naranja); color: #fff; border: 2px solid var(--naranja);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; text-align: center; padding: 12px; touch-action: manipulation; }
    .rt-remitos-galeria { min-height: 48px; border-radius: var(--radio-boton); border: 2px solid var(--naranja); color: var(--naranja); background: var(--color-fondo);
      font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 0 12px; text-align: center; }

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════
    const estado = {
      sesion: null,
      miEmpleadoId: null,
      miRolApp: null,
      // 'retiros:cargar' → alcance ({"todas": true} | {"unidades": [...]} | null)

      fabrica: FABRICA_SIN_DATOS,

      // control de stock donde la persona carga o ve retiros (los remitos).

      empresas: [],
      sinControlIds: new Set(),
      sinControl: new Map(),
      vista: null,
      pestana: null,

      subida: null,
      // REVISAR: la fábrica, sus clientes y su catálogo, los precargados
      // ({ empresaId, filas, error }), el abierto, las órdenes por N° de
      // remito y la solapa del talonario ('oficial' | 'acopio').
      empresaId: null,
      clientes: null,
      catalogo: null,
      catalogoEmpresa: null,
      principales: new Map(),
      remitos: null,
      remito: null,
      remitosResueltos: new Set(),
      turnoRemitos: 0,
      ordenes: null,
      errorOrdenes: null,
      turnoOrdenes: 0,
      talonarioOrdenes: 'oficial',
      // Lo escrito en "Buscar por N° de remito" (Órdenes cargadas).
      buscarOrden: '',
      // De dónde se abrió el remito ('subir' | 'revisar'): "‹ Remitos" vuelve ahí.
      origenRemito: null,
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS PROPIOS
    // ═══════════════════════════════════════════════════════════════════════

    // Escape de TODO texto que venga de una persona o de la base antes de
    // meterlo en un innerHTML. Cada módulo tiene el suyo.
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function normalizar(t) {
      return String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim()
    }

    function limpio(t) {
      return String(t ?? '').replace(/\s+/g, ' ').trim()
    }

    const ZONA_AR = 'America/Argentina/Buenos_Aires'

    function hoyArgentina() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AR, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date())
    }

    function esFechaIso(t) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(t ?? ''))
    }

    function fechaCorta(iso) {
      if (!esFechaIso(iso)) return '—'
      const [a, m, d] = iso.split('-')
      return `${d}/${m}/${a}`
    }

    // El buscador de clientes (el de Administración): hasta tantos
    // resultados, desde tantas letras.
    const MAX_RESULTADOS_CLIENTES = 30

    const MIN_LETRAS_BUSCAR = 2

    const ESTADOS_ACOPIO = ['activo', 'terminado', 'anulado']


    function nuevoUuid() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID()
      const b = new Uint8Array(16)
      globalThis.crypto.getRandomValues(b)
      b[6] = (b[6] & 0x0f) | 0x40
      b[8] = (b[8] & 0x3f) | 0x80
      const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('')
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`
    }

    function leerPreferencia(clave) {
      try { return localStorage.getItem(clave) } catch { return null }
    }

    function guardarPreferencia(clave, valor) {
      try {
        if (valor == null) localStorage.removeItem(clave)
        else localStorage.setItem(clave, valor)
      } catch { /* sin memoria: se vuelve a elegir la próxima vez */ }
    }

    function esErrorDeRed(err) {
      return !err?.code && /fetch|network|red|conexi|Failed/i.test(String(err?.message ?? err ?? ''))
    }

    function claveBusquedaCliente(texto) {
      return normalizar(texto).replace(/[^a-z0-9]+/g, '').replace(/^(.)y(.)$/, '$1$2')
    }

    function clientesParaAsentar(lista, busqueda) {
      const q = normalizar(busqueda)
      const qc = claveBusquedaCliente(busqueda)
      const porClave = (t) => qc.length >= MIN_LETRAS_BUSCAR && claveBusquedaCliente(t).startsWith(qc)
      const todos = Array.isArray(lista) ? lista : []
      const ok = !q ? todos : todos.filter(c => normalizar(c.nombre).includes(q) || normalizar(c.razon_social).includes(q) ||
        porClave(c.nombre) || porClave(c.razon_social) ||
        (Array.isArray(c.apodos) && c.apodos.some(a => normalizar(a).includes(q))))
      return [...ok].sort((a, b) => normalizar(a.nombre).localeCompare(normalizar(b.nombre)))
    }

    function apodoMostrarRet(cl, busqueda) {
      const q = normalizar(busqueda)
      if (!q) return ''
      if (normalizar(cl?.nombre).includes(q) || normalizar(cl?.razon_social).includes(q)) return ''
      const apodo = limpio(cl?.apodo_coincide) || (Array.isArray(cl?.apodos) ? (cl.apodos.find(a => normalizar(a).includes(q)) ?? '') : '')
      return limpio(apodo)
    }

    function momentoAr(ts) {
      const d = new Date(ts)
      if (Number.isNaN(d.getTime())) return '—'
      return new Intl.DateTimeFormat('es-AR', { timeZone: ZONA_AR, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(d)
    }

    async function leerClientes(unidadId) {
      // cliente_principal_id (27/10/2026): el mismo cliente en otra empresa
      // del grupo (FERNANDEZ RICARDO de Dolce → el de Nuss).
      const { data, error } = await supabase.from('clientes')
        .select('id, nombre, razon_social, cuit, domicilio, localidad, email, lista_precio_id, limite_credito, activo, codigo_anterior, proveedor_id, pct_parte_a, cliente_principal_id, comision_habitual, apodos, provisorio, unidad_grupo_id')
        .eq('unidad_negocio_id', unidadId).order('nombre')
      if (error) throw error
      return data ?? []
    }

    function insumoDe(cat, id) {
      return id ? (cat?.insumos ?? []).find(i => i.id === id) ?? null : null
    }

    async function asegurarDatosEmpresa() {
      const unidad = estado.empresaId
      const tareas = []
      if (estado.clientes === null) tareas.push(leerClientes(unidad).then(c => { if (unidad === estado.empresaId) estado.clientes = c }))
      if (!estado.catalogo || estado.catalogoEmpresa !== unidad) {
        tareas.push(leerCatalogo(unidad).then(c => { if (unidad === estado.empresaId) { estado.catalogo = c; estado.catalogoEmpresa = unidad } }))
      }
      await Promise.all(tareas)
      // De qué empresa es el principal de cada vinculado (27/10/2026): solo
      // si hay alguno, y nunca frena (si falla, "otra empresa del grupo").
      await leerPrincipales(estado.clientes)
    }

    async function leerPrincipales(clientes) {
      const ids = [...new Set((Array.isArray(clientes) ? clientes : []).map(c => c?.cliente_principal_id).filter(Boolean))]
      if (!(estado.principales instanceof Map)) estado.principales = new Map()
      const faltan = ids.filter(id => !estado.principales.has(id))
      if (!faltan.length) return
      try {
        const { data, error } = await supabase.from('clientes').select('id, unidad_negocio_id').in('id', faltan)
        if (error) throw error
        for (const f of Array.isArray(data) ? data : []) if (f?.id) estado.principales.set(f.id, f.unidad_negocio_id ?? null)
      } catch (err) {
        console.error('No se pudo leer la empresa de los clientes vinculados:', err)
      }
      for (const id of faltan) if (!estado.principales.has(id)) estado.principales.set(id, null)
    }

    function textoTambienEn(c) {
      if (!c?.cliente_principal_id) return ''
      const u = estado.principales?.get?.(c.cliente_principal_id) ?? null
      // El principal en esta misma empresa no es "otra" cuenta del grupo.
      if (u && u === estado.empresaId) return ''
      const e = u ? (estado.unidades ?? []).find(x => x.id === u) : null
      return ` (también en ${e ? nombreCorto(e) : 'otra empresa del grupo'})`
    }

    function clienteDe(id) {
      return (estado.clientes ?? []).find(c => c.id === id) ?? null
    }

    async function leerAcopios(unidadId, clienteId = null) {
      const { data, error } = await supabase.rpc('acopios_lista', { p_unidad_negocio_id: unidadId, p_cliente_id: clienteId })
      if (error) throw error
      return (Array.isArray(data) ? data : []).filter(a => a && a.id)
    }

    function estadoAcopio(a) {
      return ESTADOS_ACOPIO.includes(a?.estado) ? a.estado : 'activo'
    }

    function cajasAcopio(n) {
      const v = Number(n)
      return n === null || n === undefined || n === '' || !Number.isFinite(v) ? 0 : Math.trunc(v)
    }

    // El catálogo de la fábrica para los renglones: productos (con su
    // categoría) y presentaciones, los conos y los INSUMOS (uno para las
    // cuatro empresas: se leen todos, activos o no, para nombrar el de un
    // remito viejo).
    async function leerCatalogo(unidadId) {
      const { data: productos, error: e1 } = await supabase.from('productos_terminados')
        .select('id, nombre, categoria, orden, activo').eq('unidad_negocio_id', unidadId).order('orden').order('nombre')
      if (e1) throw e1
      const ids = (productos ?? []).map(p => p.id)
      let presentaciones = []
      if (ids.length) {
        const r = await supabase.from('producto_presentaciones')
          .select('id, producto_id, nombre, con_cono, media_caja, unidades_por_caja, activa, orden').in('producto_id', ids).order('orden')
        if (r.error) throw r.error
        presentaciones = r.data ?? []
      }
      const { data: marcas, error: e3 } = await supabase.from('marcas_personalizadas').select('id, nombre')
      if (e3) throw e3
      const { data: insumos, error: e4 } = await supabase.from('insumos')
        .select('id, nombre, marca, unidad_medida, categoria, activo').order('categoria').order('nombre')
      if (e4) throw e4
      return { productos: productos ?? [], presentaciones, marcas: marcas ?? [], insumos: insumos ?? [] }
    }

    // Las categorías del producto terminado, en el orden en que se muestran
    // (el mismo de la Carga y de Administración).
    const CATEGORIAS_PRODUCTO = [
      { clave: 'cucuruchones', titulo: 'Cucuruchones' },
      { clave: 'barquillos', titulo: 'Barquillos' },
      { clave: 'especiales', titulo: 'Especiales' },
      { clave: 'pasta', titulo: 'Pasta' },
    ]

    // ═══════════════════════════════════════════════════════════════════════
    // PERMISOS — el frontend solo oculta; la barrera real está en el servidor
    // ═══════════════════════════════════════════════════════════════════════

    // La MISMA regla que tiene_tarea_alcance(): super_admin todas;
    // {"todas": true} todas; si no, las de {"unidades": [...]}; null, ninguna.
    function puedeEn(modulo, tarea, unidadId = estado.empresaId) {
      if (!unidadId) return false
      if (estado.miRolApp === 'super_admin') return true
      const clave = `${modulo}:${tarea}`
      if (!estado.misTareas.has(clave)) return false
      const alcance = estado.misTareas.get(clave)
      if (alcance && alcance.todas === true) return true
      return Array.isArray(alcance?.unidades) && alcance.unidades.map(String).includes(String(unidadId))
    }

    // Las fábricas donde SUBE remitos (retiros:cargar) y donde los REVISA
    // (retiros:ver). Todas son sin control de stock (estado.empresas).
    function empresasDeCarga() {
      return (estado.empresas ?? []).filter(e => puedeEn('retiros', 'cargar', e.id))
    }

    function empresasDeRevision() {
      return (estado.empresas ?? []).filter(e => puedeEn('retiros', 'ver', e.id))
    }

    // ¿La fábrica NO controla el stock del producto terminado? (Las de este
    // módulo, todas; si no se pudo leer, ninguna.)
    function sinControlStockEmpresa(unidadId = estado.empresaId) {
      return !!unidadId && estado.sinControl?.get?.(unidadId) === true
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VISTAS Y PESTAÑAS
    // ═══════════════════════════════════════════════════════════════════════

    const VISTAS = ['rt-vista-remitos', 'rd-vista-revisar', 'ad-vista-remito']
    // Lo que ve el usuario (29/10/2026): la pestaña 'revisar' se llama
    // "Órdenes cargadas" y adentro de un remito se cargan los lotes.
    const SUB_DE_VISTA = { 'rt-vista-remitos': 'Subir', 'rd-vista-revisar': 'Órdenes cargadas', 'ad-vista-remito': 'Cargar lotes' }

    function mostrarVista(id) {
      for (const v of VISTAS) document.getElementById(v).hidden = v !== id
      estado.vista = id
      document.getElementById('rd-sub').textContent = SUB_DE_VISTA[id] ?? ''
      // Adentro de un remito no hay pestañas: se sale con "‹ Remitos".
      document.getElementById('rd-tabs').hidden = id === 'ad-vista-remito' || pestanasVisibles().length < 2
      window.scrollTo(0, 0)
    }

    // Las pestañas que ve: Subir con retiros:cargar, Órdenes cargadas
    // ('revisar') con retiros:ver.
    function pestanasVisibles() {
      return [empresasDeCarga().length ? 'subir' : null, empresasDeRevision().length ? 'revisar' : null].filter(Boolean)
    }

    function pintarPestanas() {
      for (const p of ['subir', 'revisar']) {
        const b = document.getElementById(`rd-tab-${p}`)
        b.hidden = !pestanasVisibles().includes(p)
        b.setAttribute('aria-pressed', estado.pestana === p ? 'true' : 'false')
      }
    }

    function elegirPestana(p) {
      if (!pestanasVisibles().includes(p)) return
      // Con un remito abierto y algo sin mandar, se manda y sale a esa
      // pestaña (volverDeRemito).
      if (estado.vista === 'ad-vista-remito' && pendienteRemito(estado.remito)) { volverDeRemito(p); return }
      estado.pestana = p
      guardarPreferencia(CLAVE_PESTANA, p)
      pintarPestanas()
      if (p === 'subir') abrirSubirRemitos()
      else mostrarRevisar()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SUBIR (de la Carga, 27/10/2026; acá desde el 28/10/2026)
    // ═══════════════════════════════════════════════════════════════════════
    // En Rosario (Dolce Pasta) no hay compu ni impresora: el remito se hace a
    // mano y acá se le saca una foto. Cada foto se achica (1600 px de lado
    // mayor, JPEG 0,82), se sube a comprobantes/<auth.uid>/remitos/<uuid>.jpg,
    // crear_remito_precarga la registra con un client_uuid POR FOTO que se
    // REUSA en cada reintento (la base devuelve el mismo remito) y la Edge
    // Function ocr-remito la lee en segundo plano, sin trabar la pantalla.
    // Leído, el remito queda "Listo para cargar lotes" (naranja): tocarlo
    // abre el editor ahí mismo, se corrige, se cargan los lotes y se confirma
    // (29/10/2026; antes se iba a la pestaña Revisar).
    // La pestaña se ve solo con retiros:cargar (con alcance) en una fábrica que
    // NO controla el stock terminado (unidades_negocio.controla_stock_terminado
    // = false; cargarFabricas()).

    const LADO_MAXIMO_FOTO = 1600
    const CALIDAD_FOTO = 0.82
    const DIAS_MIS_REMITOS = 7
    const SONDEO_REMITOS_MS = 6000
    const LECTURAS_A_LA_VEZ = 2
    // Un "Leyendo…" de más de esto ya no se espera: se ofrece "Reintentar".
    const LECTURA_TRABADA_MS = 3 * 60 * 1000
    const SEGUNDOS_MINIATURA = 3600
    const CLAVE_REMITOS_COLA = 'retiros.remitos.cola'
    const CLAVE_REMITOS_FABRICA = 'retiros.remitos.fabrica'
    const TEXTO_FOTO_PERDIDA = 'La foto no llegó a subirse antes de cerrar la página: sacala de nuevo.'
    const ICONO_REMITO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM9 9h6M9 13h6M9 17h4"/></svg>'

    // Lo de esta pantalla, armado la primera vez que se usa.
    function datosRemitos() {
      if (!estado.subida) {
        estado.subida = {
          fabricaId: null, filas: null, error: null, cargando: false, turno: 0,
          miniaturas: new Map(),
          // Las fotos que todavía no son un remito en la base (o que la lista
          // todavía no trajo): { clientUuid, unidadId, ruta, paso, error, remitoId, ... }
          cola: leerColaRemitos(), trabajando: false,
          // Las lecturas: en espera, en curso (de a LECTURAS_A_LA_VEZ) y las
          // que fallaron antes de llegar a la base (id → texto).
          lecturas: [], leyendo: new Set(), lecturaFallida: new Map(), sondeo: null,
        }
      }
      return estado.subida
    }

    // ── Quién sube ─────────────────────────────────────────────────────────
    // Las fábricas donde se suben remitos: donde carga (cargarFabricas ya
    // saca la de pruebas para una cuenta real) y que no controlan el stock.
    function fabricasRemitos() {
      const sin = estado.sinControlIds
      if (!(sin instanceof Set) || !sin.size) return []
      return empresasDeCarga().filter(e => sin.has(e.id))
    }

    function puedeSubirRemitos() {
      return fabricasRemitos().length > 0
    }


    // La fábrica de los remitos: la elegida; con una sola, esa; si no, la
    // última que se usó. Con varias y ninguna, null (se pregunta).
    function fabricaRemitos() {
      const lista = fabricasRemitos()
      const d = datosRemitos()
      const elegida = lista.find(e => e.id === d.fabricaId)
      if (elegida) return elegida
      if (lista.length === 1) return lista[0]
      const ultima = leerPreferencia(CLAVE_REMITOS_FABRICA)
      return lista.find(e => e.id === ultima) ?? null
    }

    function elegirFabricaRemitos(id) {
      if (!fabricasRemitos().some(e => e.id === id)) return
      datosRemitos().fabricaId = id
      guardarPreferencia(CLAVE_REMITOS_FABRICA, id)
      pintarRemitos()
    }


    function abrirSubirRemitos() {
      if (!puedeSubirRemitos()) return
      estado.pestana = 'subir'
      pintarPestanas()
      mostrarVista('rt-vista-remitos')
      pintarRemitos()
      leerMisRemitos()
      // Lo que quedó a medias de antes (se subió la foto pero no se registró).
      procesarCola()
    }


    // ── La foto ────────────────────────────────────────────────────────────
    function rutaFotoRemito(uid, uuid) {
      return `${uid}/remitos/${uuid}.jpg`
    }

    // Las medidas de la foto achicada: el lado mayor a 1600 px como mucho
    // (una más chica queda como está).
    function medidasAchicadas(ancho, alto, max = LADO_MAXIMO_FOTO) {
      const w = Number(ancho) || 0
      const h = Number(alto) || 0
      if (w <= 0 || h <= 0) return null
      const k = Math.min(1, max / Math.max(w, h))
      return { ancho: Math.max(1, Math.round(w * k)), alto: Math.max(1, Math.round(h * k)) }
    }

    async function cargarImagenRemito(archivo) {
      if (typeof createImageBitmap === 'function') {
        try { return await createImageBitmap(archivo, { imageOrientation: 'from-image' }) } catch { /* sigue con <img> */ }
      }
      return await new Promise((res, rej) => {
        const url = URL.createObjectURL(archivo)
        const img = new Image()
        img.onload = () => { URL.revokeObjectURL(url); res(img) }
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo abrir la foto.')) }
        img.src = url
      })
    }

    // La foto achicada en JPEG. Si el celular no la puede abrir (un formato
    // raro), va como vino: mejor una foto pesada que ninguna.
    async function achicarFoto(archivo, max = LADO_MAXIMO_FOTO, calidad = CALIDAD_FOTO) {
      try {
        const img = await cargarImagenRemito(archivo)
        const m = medidasAchicadas(img.naturalWidth || img.width, img.naturalHeight || img.height, max)
        if (!m) throw new Error('La foto no tiene medidas.')
        const lienzo = document.createElement('canvas')
        lienzo.width = m.ancho
        lienzo.height = m.alto
        lienzo.getContext('2d').drawImage(img, 0, 0, m.ancho, m.alto)
        if (typeof img.close === 'function') img.close()
        const blob = await new Promise(res => lienzo.toBlob(res, 'image/jpeg', calidad))
        if (!blob) throw new Error('No se pudo armar el JPEG.')
        return blob
      } catch (err) {
        console.warn('No se pudo achicar la foto, va como vino:', err)
        return archivo
      }
    }

    function urlLocalDeFoto(blob) {
      try { return blob && typeof URL !== 'undefined' && URL.createObjectURL ? URL.createObjectURL(blob) : null } catch { return null }
    }

    // ── La cola (en segundo plano, de a una foto) ──────────────────────────
    function itemColaRemito(archivo, unidadId, uid) {
      return {
        clientUuid: nuevoUuid(), unidadId, ruta: rutaFotoRemito(uid, nuevoUuid()),
        archivo, blob: null, vista: null, paso: 'achicar', error: null, remitoId: null, creadoEn: new Date().toISOString(),
      }
    }

    // La cola sobrevive a una recarga, sin la foto: lo que ya se subió se
    // vuelve a registrar con el MISMO client_uuid; lo que no, se perdió.
    function guardarColaRemitos() {
      const d = datosRemitos()
      const lista = d.cola.filter(i => !i.remitoId)
        .map(({ clientUuid, unidadId, ruta, paso, error, creadoEn }) => ({ clientUuid, unidadId, ruta, paso, error, creadoEn }))
      try { guardarPreferencia(CLAVE_REMITOS_COLA, lista.length ? JSON.stringify(lista) : null) } catch { /* nada */ }
    }

    function leerColaRemitos() {
      try {
        const l = JSON.parse(leerPreferencia(CLAVE_REMITOS_COLA) || '[]')
        if (!Array.isArray(l)) return []
        return l.filter(i => i && typeof i.clientUuid === 'string' && typeof i.ruta === 'string' && i.unidadId).map(i => {
          const subida = i.paso === 'crear'
          return {
            clientUuid: i.clientUuid, unidadId: i.unidadId, ruta: i.ruta, creadoEn: i.creadoEn ?? null,
            archivo: null, blob: null, vista: null, remitoId: null,
            paso: subida ? 'crear' : 'perdida', error: subida ? (i.error ?? null) : TEXTO_FOTO_PERDIDA,
          }
        })
      } catch { return [] }
    }

    // Las fotos elegidas (cámara o galería) entran a la cola y la pantalla
    // queda libre para sacar la siguiente.
    function fotosElegidas(input) {
      const archivos = [...(input?.files ?? [])].filter(f => f && (!f.type || String(f.type).startsWith('image/')))
      try { input.value = '' } catch { /* nada */ }
      return encolarFotos(archivos)
    }

    function encolarFotos(archivos) {
      if (!archivos?.length) return 0
      const fab = fabricaRemitos()
      if (!fab) { mostrarError('Elegí de qué fábrica son los remitos.'); return 0 }
      const uid = estado.sesion?.user?.id
      if (!uid) { mostrarError('No pudimos identificar tu usuario. Volvé a entrar.'); return 0 }
      const d = datosRemitos()
      for (const a of archivos) d.cola.unshift(itemColaRemito(a, fab.id, uid))
      guardarPreferencia(CLAVE_REMITOS_FABRICA, fab.id)
      guardarColaRemitos()
      pintarRemitos()
      // Sin await: la cola sigue sola.
      procesarCola()
      return archivos.length
    }

    async function procesarCola() {
      const d = datosRemitos()
      if (d.trabajando) return
      d.trabajando = true
      try {
        let item
        while ((item = d.cola.find(i => ['achicar', 'subir', 'crear'].includes(i.paso) && !i.error))) await procesarRemito(item)
      } finally {
        d.trabajando = false
      }
    }

    // Un reintento de una foto que SÍ había llegado (se cortó la respuesta):
    // la base dice que ya existe, y está bien.
    function yaEstabaSubida(error) {
      return String(error?.statusCode ?? error?.status ?? '') === '409' || /already exists|duplicate/i.test(String(error?.message ?? ''))
    }

    function textoErrorRemito(err, paso) {
      if (esErrorDeRed(err)) return 'Sin señal: no se pudo subir. Tocá «Reintentar».'
      const msg = limpio(err?.message)
      if (paso === 'crear') return msg ? `No se pudo registrar: ${msg}` : 'No se pudo registrar el remito.'
      return msg ? `No se pudo subir la foto: ${msg}` : 'No se pudo subir la foto.'
    }

    async function procesarRemito(item) {
      item.error = null
      try {
        if (item.paso === 'achicar') {
          item.blob = await achicarFoto(item.archivo)
          item.archivo = null
          item.vista = urlLocalDeFoto(item.blob)
          item.paso = 'subir'
          pintarRemitos()
        }
        if (item.paso === 'subir') {
          if (!item.blob) throw new Error(TEXTO_FOTO_PERDIDA)
          const { error } = await supabase.storage.from('comprobantes')
            .upload(item.ruta, item.blob, { contentType: item.blob.type || 'image/jpeg', upsert: false })
          if (error && !yaEstabaSubida(error)) throw error
          item.paso = 'crear'
          guardarColaRemitos()
        }
        if (item.paso === 'crear') {
          const { data, error } = await supabase.rpc('crear_remito_precarga', {
            p_unidad_negocio_id: item.unidadId, p_foto_path: item.ruta, p_client_uuid: item.clientUuid,
          })
          if (error) throw error
          if (!data) throw new Error('La base no devolvió el remito.')
          item.remitoId = String(data)
          item.blob = null
          item.paso = 'leer'
          guardarColaRemitos()
          lanzarLectura(item.remitoId)
        }
      } catch (err) {
        console.error('No se pudo subir el remito:', err)
        item.error = textoErrorRemito(err, item.paso)
        guardarColaRemitos()
      }
      pintarRemitos()
    }

    // ── La lectura (ocr-remito), de a LECTURAS_A_LA_VEZ y sin esperarla ────
    function lanzarLectura(remitoId) {
      const d = datosRemitos()
      d.lecturaFallida.delete(remitoId)
      if (!d.lecturas.includes(remitoId) && !d.leyendo.has(remitoId)) d.lecturas.push(remitoId)
      seguirLecturas()
      programarSondeo()
    }

    function seguirLecturas() {
      const d = datosRemitos()
      while (d.leyendo.size < LECTURAS_A_LA_VEZ && d.lecturas.length) {
        const id = d.lecturas.shift()
        d.leyendo.add(id)
        // SIN await: se pueden seguir sacando fotos mientras la IA lee.
        leerRemitoConIa(id).finally(() => { d.leyendo.delete(id); seguirLecturas() })
      }
    }

    async function leerRemitoConIa(id) {
      const d = datosRemitos()
      try {
        const { data, error } = await supabase.functions.invoke('ocr-remito', { body: { remito_id: id } })
        if (error) throw error
        if (data?.error) throw new Error(String(data.error))
      } catch (err) {
        console.error('No se pudo leer el remito:', err)
        d.lecturaFallida.set(id, esErrorDeRed(err) ? 'Sin señal: no se pudo pedir la lectura.' : (limpio(err?.message) || 'La IA no pudo leerlo.'))
      }
      d.leyendo.delete(id)
      await leerMisRemitos()
    }

    // "Reintentar": lo que falló antes de ser un remito se vuelve a mandar
    // desde el paso que falló, con el MISMO client_uuid; un remito que no se
    // pudo leer se vuelve a leer.
    function reintentarRemito(clave) {
      const d = datosRemitos()
      const item = d.cola.find(i => i.clientUuid === clave)
      if (item && !item.remitoId) {
        if (item.paso === 'perdida') return
        item.error = null
        pintarRemitos()
        procesarCola()
        return
      }
      lanzarLectura(item?.remitoId ?? clave)
      pintarRemitos()
    }

    function quitarRemitoDeCola(clave) {
      const d = datosRemitos()
      d.cola = d.cola.filter(i => !(i.clientUuid === clave && i.paso === 'perdida'))
      guardarColaRemitos()
      pintarRemitos()
    }

    // ── Mis remitos subidos ────────────────────────────────────────────────
    async function leerMisRemitos() {
      const d = datosRemitos()
      const turno = ++d.turno
      if (d.filas === null) { d.cargando = true; pintarRemitos() }
      try {
        const desde = new Date(Date.now() - DIAS_MIS_REMITOS * 86400000).toISOString()
        const { data, error } = await supabase.from('remitos_precarga')
          // cliente_id, cliente_leido e items (29/10/2026): la tarjeta naranja
          // dice el cliente y cuántos renglones tiene.
          .select('id, unidad_negocio_id, foto_path, subido_en, estado, numero_remito, talonario, error, orden_id, orden_codigo, descartado_motivo, client_uuid, cliente_id, cliente_leido, items')
          .eq('subido_por', estado.miEmpleadoId).gte('subido_en', desde)
          .order('subido_en', { ascending: false }).limit(60)
        if (error) throw error
        if (turno !== d.turno) return
        const filas = conResueltosSubida((Array.isArray(data) ? data : []).filter(f => f?.id)
          .sort((a, b) => String(b.subido_en ?? '').localeCompare(String(a.subido_en ?? ''))), d)
        // Lo que ya está en la base sale de la cola (con su foto local como miniatura).
        const enBase = new Set(filas.map(f => f.id))
        for (const i of d.cola) if (i.remitoId && enBase.has(i.remitoId) && i.vista && !d.miniaturas.has(i.ruta)) d.miniaturas.set(i.ruta, i.vista)
        d.cola = d.cola.filter(i => !(i.remitoId && enBase.has(i.remitoId)))
        guardarColaRemitos()
        d.filas = filas
        d.error = null
        d.cargando = false
        pedirMiniaturas(filas)
        asegurarClientesSubida(filas, d)
      } catch (err) {
        console.error('No se pudieron leer los remitos subidos:', err)
        if (turno !== d.turno) return
        d.error = 'No se pudieron leer tus remitos subidos. Revisá la conexión.'
        d.cargando = false
      }
      pintarRemitos()
      programarSondeo()
    }

    // Las miniaturas: un link firmado por foto, una sola vez.
    function pedirMiniaturas(filas) {
      const d = datosRemitos()
      const faltan = filas.map(f => f.foto_path).filter(p => p && !d.miniaturas.has(p))
      if (!faltan.length) return
      for (const p of faltan) d.miniaturas.set(p, null)
      Promise.all(faltan.map(async (p) => {
        try {
          const { data, error } = await supabase.storage.from('comprobantes').createSignedUrl(p, SEGUNDOS_MINIATURA)
          if (!error && data?.signedUrl) d.miniaturas.set(p, data.signedUrl)
        } catch { /* sin miniatura: va el ícono */ }
      })).then(() => pintarRemitos())
    }

    // Solo links de la base (https) o de la foto recién sacada (blob:).
    function urlMiniaturaSegura(u) {
      const s = String(u ?? '')
      return /^(https:\/\/|blob:)/i.test(s) ? s : null
    }

    function fechaHoraRemito(iso) {
      const t = Date.parse(String(iso ?? ''))
      if (!Number.isFinite(t)) return ''
      const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
        timeZone: ZONA_AR, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(new Date(t)).map(x => [x.type, x.value]))
      return `${p.day}/${p.month} · ${p.hour}:${p.minute}`
    }

    // El N° leído, si hay, con el talonario de acopio marcado.
    function numeroLeido(f) {
      const n = limpio(f?.numero_remito)
      return n ? { texto: `Remito N° ${n}`, acopio: f?.talonario === 'acopio' } : null
    }

    // El cliente de la tarjeta naranja: el elegido (si ya se leyeron los
    // clientes de esa fábrica, asegurarClientesSubida) o lo que leyó la IA.
    function clienteTarjetaSubida(f) {
      const c = f?.cliente_id && estado.empresaId === f.unidad_negocio_id ? clienteDe(f.cliente_id) : null
      return limpio(c?.nombre) || limpio(f?.cliente_leido)
    }

    // "Remito N° 0001-00003100 · Almacén Rosario · 3 renglones".
    function detalleListoSubida(f, n = numeroLeido(f)) {
      const k = Array.isArray(f?.items) ? f.items.length : 0
      return [n ? n.texto : 'Sin N° leído', clienteTarjetaSubida(f) || 'sin cliente', `${k} ${k === 1 ? 'renglón' : 'renglones'}`].join(' · ')
    }

    // Los clientes de la fábrica de un remito listo (para nombrarlo en la
    // tarjeta): una sola lectura, al costado; si falla, va lo leído.
    function asegurarClientesSubida(filas, d = datosRemitos()) {
      const f = (Array.isArray(filas) ? filas : []).find(x => x?.estado === 'precargada' && x.cliente_id && x.unidad_negocio_id)
      if (!f || d.pidiendoClientes) return
      if (estado.empresaId && estado.empresaId !== f.unidad_negocio_id) return
      if (estado.empresaId === f.unidad_negocio_id && Array.isArray(estado.clientes)) return
      const unidad = f.unidad_negocio_id
      d.pidiendoClientes = true
      leerClientes(unidad).then(c => {
        if (!estado.empresaId) estado.empresaId = unidad
        if (estado.empresaId === unidad && !Array.isArray(estado.clientes)) estado.clientes = c
        pintarRemitos()
      }).catch(err => console.error('No se pudieron leer los clientes:', err))
        .finally(() => { d.pidiendoClientes = false })
    }

    // Lo confirmado o descartado en esta visita (los cambios de la fila): una
    // lectura vieja que todavía lo trae 'precargada' no lo vuelve naranja.
    function marcarSubidoRemito(id, cambios) {
      const d = datosRemitos()
      if (!(d.resueltos instanceof Map)) d.resueltos = new Map()
      d.resueltos.set(id, cambios)
      if (Array.isArray(d.filas)) d.filas = d.filas.map(f => f.id === id ? { ...f, ...cambios } : f)
    }

    function conResueltosSubida(filas, d = datosRemitos()) {
      const r = d.resueltos instanceof Map ? d.resueltos : null
      return !r ? filas : filas.map(f => r.has(f.id) && f.estado === 'precargada' ? { ...f, ...r.get(f.id) } : f)
    }

    // El estado de un remito de la base, en palabras.
    function estadoRemitoSubido(f, d = datosRemitos(), ahora = Date.now()) {
      // Pidiendo la lectura (o releyendo uno que falló): "Leyendo…", salvo que
      // la base ya tenga el resultado.
      const pidiendo = d.leyendo.has(f.id) || d.lecturas.includes(f.id)
      if (pidiendo && ['leyendo', 'error'].includes(f.estado)) return { tipo: 'leyendo', texto: 'Leyendo…', detalle: '' }
      const n = numeroLeido(f)
      switch (f.estado) {
        case 'precargada':
          // NARANJA (29/10/2026): se toca y abre el remito para cargar los
          // lotes y confirmar, ahí mismo (abrir).
          return { tipo: 'precargada', texto: 'Listo para cargar lotes', detalle: detalleListoSubida(f, n), acopio: !!n?.acopio, abrir: true }
        case 'confirmada': {
          // El código de la orden: remitos_precarga.orden_codigo (28/10/2026,
          // verificada con information_schema), que se lee con lo mismo que el
          // remito: Manuel (solo retiros:cargar) también lo ve. VERDE.
          const codigo = limpio(f.orden_codigo)
          return { tipo: 'confirmada', texto: codigo ? `Orden cargada · ${codigo}` : 'Orden cargada', detalle: n ? n.texto : '', acopio: !!n?.acopio }
        }
        case 'descartada':
          return { tipo: 'descartada', texto: `Descartado: ${limpio(f.descartado_motivo) || 'sin motivo'}`, detalle: '' }
        case 'error':
          return { tipo: 'error', texto: 'No se pudo leer', detalle: limpio(f.error), reintentar: true }
        default: {
          const fallo = d.lecturaFallida.get(f.id)
          if (fallo) return { tipo: 'error', texto: 'No se pudo leer', detalle: fallo, reintentar: true }
          const trabado = ahora - Date.parse(String(f.subido_en ?? '')) > LECTURA_TRABADA_MS
          return { tipo: 'leyendo', texto: 'Leyendo…', detalle: trabado ? 'Tarda más de lo normal' : '', reintentar: trabado }
        }
      }
    }

    // El estado de una foto que todavía no está en la lista de la base.
    function estadoRemitoEnCola(i, d = datosRemitos()) {
      if (i.paso === 'perdida') return { tipo: 'error', texto: 'No se subió', detalle: i.error || TEXTO_FOTO_PERDIDA, quitar: true }
      if (i.error) return { tipo: 'error', texto: i.paso === 'crear' ? 'No se pudo registrar' : 'No se pudo subir', detalle: i.error, reintentar: true }
      if (i.remitoId) return estadoRemitoSubido({ id: i.remitoId, estado: 'leyendo', subido_en: i.creadoEn }, d)
      return { tipo: 'subiendo', texto: 'Subiendo…', detalle: '' }
    }

    // Lo que se muestra, más nuevo primero: la cola arriba y después la base.
    function remitosParaMostrar(d = datosRemitos()) {
      const enCola = d.cola.map(i => ({
        clave: i.clientUuid, cuando: i.creadoEn, unidadId: i.unidadId, miniatura: i.vista, estado: estadoRemitoEnCola(i, d),
        reintentarCon: i.remitoId ?? i.clientUuid,
      }))
      const deBase = (d.filas ?? []).map(f => ({
        clave: f.id, cuando: f.subido_en, unidadId: f.unidad_negocio_id, miniatura: d.miniaturas.get(f.foto_path) ?? null,
        estado: estadoRemitoSubido(f, d), reintentarCon: f.id,
      }))
      return [...enCola, ...deBase]
    }

    // La miniatura NO va en el HTML: pintarRemitos() le pone el src por el
    // DOM (urlMiniaturaSegura), así ningún link entra a un atributo.
    function htmlRemitoSubido(x, varias = fabricasRemitos().length > 1) {
      const e = x.estado
      const tipoRemito = e.tipo
      const fotoRemito = urlMiniaturaSegura(x.miniatura)
        ? `<img class="rt-remito__foto" data-remito-miniatura="${esc(x.clave)}" alt="Foto del remito">`
        : `<span class="rt-remito__foto" aria-hidden="true">${ICONO_REMITO}</span>`
      const fabrica = varias ? limpio(empresasDeCarga().find(f => f.id === x.unidadId)?.nombre) : ''
      const meta = [fechaHoraRemito(x.cuando), fabrica].filter(Boolean).join(' · ')
      const selloAcopio = e.acopio ? '<span class="rt-remito__sello">Acopio</span>' : ''
      // "Listo para cargar lotes": la tarjeta entera es un botón que abre el
      // remito (con Retiros · cargar en esa fábrica; sin eso, se ve igual).
      // Adentro de un botón va un <span> (un <div> no se puede).
      const boton = !!e.abrir && puedeEn('retiros', 'cargar', x.unidadId)
      const caja = boton ? 'span' : 'div'
      const rmInterior = `${fotoRemito}<${caja} class="rt-remito__texto"><span class="rt-remito__estado">${esc(e.texto)}</span>` +
        (e.detalle || selloAcopio ? `<span class="rt-remito__detalle">${esc(e.detalle)}${selloAcopio}</span>` : '') +
        (meta ? `<span class="rt-fila__meta">${esc(meta)}</span>` : '') + `</${caja}>`
      const rmAtributos = `class="rt-remito rt-remito--${tipoRemito}" data-remito="${esc(x.clave)}" data-remito-estado="${tipoRemito}"`
      if (boton) {
        return `<button type="button" ${rmAtributos} data-remito-abrir="${esc(x.clave)}">${rmInterior}` +
          '<span class="rt-remito__ir" aria-hidden="true">Cargar ›</span></button>'
      }
      return `<div ${rmAtributos}>${rmInterior}` +
        (e.reintentar ? `<button type="button" class="rt-btn rt-btn--secundario rt-remito__accion" data-remito-reintentar="${esc(x.reintentarCon)}">Reintentar</button>` : '') +
        (e.quitar ? `<button type="button" class="rt-btn rt-btn--suave rt-remito__accion" data-remito-quitar="${esc(x.clave)}">Quitar</button>` : '') +
        '</div>'
    }

    function htmlMisRemitos(d = datosRemitos()) {
      const lista = remitosParaMostrar(d)
      if (!lista.length) {
        if (d.cargando) return '<p class="rt-vacio">Cargando…</p>'
        if (d.error) return `<p class="rt-aviso rt-aviso--grave">${esc(d.error)}</p>`
        return '<p class="rt-vacio">Todavía no subiste remitos en los últimos 7 días.</p>'
      }
      const varias = fabricasRemitos().length > 1
      return (d.error ? `<p class="rt-aviso rt-aviso--grave">${esc(d.error)}</p>` : '') + lista.map(x => htmlRemitoSubido(x, varias)).join('')
    }

    function htmlFabricaRemitos() {
      const lista = fabricasRemitos()
      const fab = fabricaRemitos()
      if (lista.length === 1) return `<p class="rt-aviso">Los remitos van a <strong>${esc(lista[0].nombre)}</strong>.</p>`
      return '<div class="rt-campo"><span class="rt-campo__rotulo">¿De qué fábrica son los remitos?</span><div class="rt-remitos-fabricas">' +
        lista.map(e => `<button type="button" class="rt-remitos-fabrica" data-remito-fabrica="${esc(e.id)}" aria-pressed="${fab?.id === e.id ? 'true' : 'false'}">${esc(e.nombre)}</button>`).join('') +
        '</div>' + (fab ? '' : '<p class="rt-pista">Elegí la fábrica antes de sacar la foto.</p>') + '</div>'
    }

    function textoColaRemitos(d = datosRemitos()) {
      const subiendo = d.cola.filter(i => ['achicar', 'subir', 'crear'].includes(i.paso) && !i.error).length
      const leyendo = d.leyendo.size + d.lecturas.length
      const partes = []
      if (subiendo) partes.push(subiendo === 1 ? 'Subiendo 1 foto…' : `Subiendo ${subiendo} fotos…`)
      if (leyendo) partes.push(leyendo === 1 ? 'La IA está leyendo 1 remito.' : `La IA está leyendo ${leyendo} remitos.`)
      return partes.length ? `${partes.join(' ')} Podés seguir sacando fotos.` : ''
    }

    function pintarRemitos() {
      if (estado.vista !== 'rt-vista-remitos') return
      const d = datosRemitos()
      const fab = fabricaRemitos()
      document.getElementById('rt-remitos-fabrica').innerHTML = htmlFabricaRemitos()
      document.getElementById('rt-remitos-acciones').classList.toggle('rt-remitos-acciones--apagadas', !fab)
      document.getElementById('rt-remitos-camara').disabled = !fab
      document.getElementById('rt-remitos-galeria').disabled = !fab
      document.getElementById('rt-remitos-cola').textContent = textoColaRemitos(d)
      const n = remitosParaMostrar(d).length
      document.getElementById('rt-remitos-cuenta').textContent = n ? String(n) : ''
      const lista = document.getElementById('rt-remitos-lista')
      lista.innerHTML = htmlMisRemitos(d)
      const urls = new Map(remitosParaMostrar(d).map(x => [x.clave, urlMiniaturaSegura(x.miniatura)]))
      for (const img of lista.querySelectorAll('img[data-remito-miniatura]')) {
        const u = urls.get(img.dataset.remitoMiniatura)
        if (u) img.src = u
      }
    }

    // ── El sondeo: mientras alguno se esté leyendo, la lista se vuelve a
    // pedir cada 6 segundos (solo con esta pantalla a la vista).
    function hayRemitosLeyendo(d = datosRemitos()) {
      return d.cola.some(i => i.remitoId) || d.leyendo.size > 0 || d.lecturas.length > 0 ||
        (d.filas ?? []).some(f => f.estado === 'leyendo' && !d.lecturaFallida.has(f.id))
    }

    function programarSondeo() {
      const d = datosRemitos()
      if (d.sondeo || estado.vista !== 'rt-vista-remitos' || !hayRemitosLeyendo(d)) return
      d.sondeo = setTimeout(() => {
        d.sondeo = null
        if (estado.vista !== 'rt-vista-remitos') return
        if (document.hidden) { programarSondeo(); return }
        leerMisRemitos()
      }, SONDEO_REMITOS_MS)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // REVISAR: LOS REMITOS PRECARGADOS (de Administración → Órdenes,
    // 27/10/2026; acá desde el 28/10/2026)
    // ═══════════════════════════════════════════════════════════════════════
    // En Rosario (Dolce Pasta, controla_stock_terminado = false) Manuel saca
    // la foto de un remito escrito a mano y la IA (Edge Function ocr-remito)
    // deja una PRECARGA (remitos_precarga) que acá se revisa, se corrige y se
    // confirma; la orden que sale se valoriza en Administración como
    // cualquier otra.
    // La base (verificada con pg_get_functiondef el 27/10/2026):
    //  - actualizar_remito_precarga(p_id, p_numero_remito, p_fecha,
    //    p_cliente_id, p_transporte, p_observaciones, p_items, p_talonario):
    //    deja 'precargada' y normaliza los renglones: revisar = revisar || sin
    //    producto ni insumo || sin cantidad (salvo omitir, que nunca queda en
    //    revisar). Por eso va revisar:false en lo que Yanina ya corrigió.
    //  - confirmar_remito_precarga(p_id): arma la orden con
    //    registrar_orden_retiro (saltea los omitidos) y le pone numero_remito y
    //    talonario. Sus errores van TAL CUAL, pegados a los botones.
    //  - descartar_remito_precarga(p_id, p_motivo): motivo de 3 letras o más.
    //  - Volver a leer: functions.invoke('ocr-remito', { body: { remito_id } }).
    // EL TALONARIO: 'oficial' (el de Dolce Pasta, 0001-0000XXXX) o 'acopio'
    // (el celeste con número rojo, para retirar lo ya facturado como acopio).
    // Cada uno con su numeración: el listado de órdenes va por solapas.
    // UN RENGLÓN OMITIDO ("No va en la orden"): mercadería de terceros que
    // está en el papel (envases térmicos, salsas): se tacha en gris, no cuenta
    // en los amarillos ni en la orden.
    const ESTADOS_REMITO_POR_REVISAR = ['precargada', 'error', 'leyendo']
    const ETIQUETA_ESTADO_REMITO = { precargada: 'Listo para cargar lotes', error: 'No se pudo leer', leyendo: 'Leyendo…' }
    const TALONARIOS = [{ id: 'oficial', nombre: 'Oficial' }, { id: 'acopio', nombre: 'Acopio' }]
    const CAMPOS_REMITO = 'id, unidad_negocio_id, foto_path, subido_por, subido_en, estado, talonario, numero_remito, numero_remito_n, fecha, cliente_id, cliente_leido, transporte, observaciones, items, error, leido_en'
    const ZOOM_FOTO_REMITO = [1, 1.5, 2, 3]
    const LARGO_LOTE_REMITO = 40
    const LARGO_MINIMO_MOTIVO_REMITO = 3
    // El error de confirmar que pide descartar: el remito a una empresa del
    // grupo que ya entró como ingreso allá.
    const RE_YA_INGRESADO = /ya entró como ingreso/i
    // AUTOGUARDADO (29/10/2026, pedido de Facu: "Guardar" y "Confirmar"
    // confundían). Cada cambio se manda solo a actualizar_remito_precarga;
    // lo que se escribe, después de este rato sin tocar nada (no una llamada
    // por tecla). Una sola llamada a la vez: la que vuelve, si quedó algo
    // nuevo, manda eso; así una respuesta vieja nunca pisa a una nueva, ni
    // en la pantalla ni en la base.
    const RETARDO_AUTOGUARDADO_REMITO = 800





    function numeroRemitoN(o) {
      const v = o?.numero_remito_n
      if (v === null || v === undefined || v === '') return null
      const n = Number(v)
      return Number.isFinite(n) ? n : null
    }

    // Por N° de remito, el más nuevo arriba; las sin número al final, en el
    // orden en que vinieron (fecha y número de orden).
    function ordenarPorRemito(lista) {
      return (Array.isArray(lista) ? lista : []).map((o, i) => [o, i]).sort(([a, i], [b, j]) => {
        const x = numeroRemitoN(a), y = numeroRemitoN(b)
        if (x === null && y === null) return i - j
        if (x === null) return 1
        if (y === null) return -1
        return y - x || i - j
      }).map(([o]) => o)
    }

    // Lo que muestra la lista de órdenes de abajo: las del talonario
    // elegido, por N° de remito (las sin número al final).
    function ordenesVisibles(lista = estado.ordenes) {
      if (!Array.isArray(lista)) return []
      if (!sinControlStockEmpresa()) return lista
      const tal = estado.talonarioOrdenes === 'acopio' ? 'acopio' : 'oficial'
      // "Buscar por N° de remito" (29/10/2026): los dígitos escritos, en
      // cualquier parte del número ("3100" encuentra 0001-00003100).
      const q = digitosRemito(estado.buscarOrden)
      return ordenarPorRemito(lista.filter(o => talonarioDe(o) === tal && (!q || digitosRemito(o.numero_remito).includes(q))))
    }

    function digitosRemito(t) {
      return String(t ?? '').replace(/\D+/g, '')
    }

    function htmlTalonariosOrdenes() {
      if (!sinControlStockEmpresa() || !Array.isArray(estado.ordenes)) return ''
      const tal = estado.talonarioOrdenes === 'acopio' ? 'acopio' : 'oficial'
      return '<h2 class="ad-subtitulo">Órdenes cargadas por N° de remito</h2><div class="ad-segmento" role="group" aria-label="Talonario">' + TALONARIOS.map(t => {
        const n = estado.ordenes.filter(o => talonarioDe(o) === t.id).length
        return `<button type="button" class="ad-segmento__opcion" data-talonario-ordenes="${esc(t.id)}" aria-pressed="${t.id === tal ? 'true' : 'false'}">${esc(t.nombre + ' · ' + n)}</button>`
      }).join('') + '</div>'
    }

    // Lo escrito en el buscador: solo se redibuja la lista (el foco queda).
    function buscarOrdenRemito(texto) {
      estado.buscarOrden = String(texto ?? '')
      const lista = document.getElementById('rd-ordenes-lista')
      if (lista) lista.innerHTML = htmlListaOrdenesRemito()
    }

    function elegirTalonarioOrdenes(t) {
      if (!TALONARIOS.some(x => x.id === t) || estado.talonarioOrdenes === t) return
      estado.talonarioOrdenes = t
      pintarOrdenesRemito()
    }


    // ── La lista de arriba: los remitos por revisar ───────────────────────
    // Los ya confirmados o descartados en esta visita no vuelven aunque una
    // lectura vieja los traiga.
    function remitosPorRevisar(filas) {
      const resueltos = estado.remitosResueltos
      return (Array.isArray(filas) ? filas : [])
        .filter(r => r && ESTADOS_REMITO_POR_REVISAR.includes(r.estado) && !(resueltos instanceof Set && resueltos.has(r.id)))
        .sort((a, b) => String(b.subido_en ?? '').localeCompare(String(a.subido_en ?? '')))
    }

    async function leerRemitosPrecarga(unidadId) {
      const { data, error } = await supabase.from('remitos_precarga').select(CAMPOS_REMITO)
        .eq('unidad_negocio_id', unidadId).in('estado', ESTADOS_REMITO_POR_REVISAR).order('subido_en', { ascending: false })
      if (error) throw error
      return remitosPorRevisar(data)
    }

    async function leerRemito(id) {
      const { data, error } = await supabase.from('remitos_precarga').select(CAMPOS_REMITO).eq('id', id).maybeSingle()
      if (error) throw error
      return data ?? null
    }

    async function cargarRemitosPrecarga() {
      const turno = estado.turnoRemitos = (estado.turnoRemitos ?? 0) + 1
      const empresaId = estado.empresaId
      estado.remitos = { empresaId, filas: null, error: null }
      pintarRemitosPrecarga()
      try {
        const filas = await leerRemitosPrecarga(empresaId)
        if (turno !== estado.turnoRemitos || estado.empresaId !== empresaId) return
        estado.remitos = { empresaId, filas, error: null }
      } catch (err) {
        if (turno !== estado.turnoRemitos) return
        console.error('No se pudieron leer los remitos precargados:', err)
        estado.remitos = { empresaId, filas: null, error: 'No se pudieron leer los remitos sin terminar. Revisá la conexión y volvé a entrar.' }
      }
      pintarRemitosPrecarga()
    }

    // Los renglones en amarillo: para revisar y que van en la orden.
    function amarillosDe(items) {
      return (Array.isArray(items) ? items : []).filter(it => it?.revisar === true && it?.omitir !== true).length
    }

    function nombreClienteRemito(r) {
      const c = clienteDe(r?.cliente_id)
      if (c) return c.nombre
      return limpio(r?.cliente_leido) ? `«${limpio(r.cliente_leido)}» (leído)` : 'Sin cliente'
    }

    function htmlTarjetaRemito(r) {
      const items = Array.isArray(r.items) ? r.items : []
      const amarillos = amarillosDe(items)
      const numero = textoNumeroRemito(r) || 'Sin número'
      const meta = [nombreClienteRemito(r), esFechaIso(r.fecha) ? fechaCorta(r.fecha) : 'sin fecha', `${items.length} ${items.length === 1 ? 'renglón' : 'renglones'}`].join(' · ')
      const estadoR = ETIQUETA_ESTADO_REMITO[r.estado] ?? r.estado
      return `<button type="button" class="ad-fila ad-rm-tarjeta" data-remito="${esc(r.id)}">` +
        `<span class="ad-fila__linea"><span class="ad-rm-numero">${esc(numero)}</span><span class="ad-fila__sellos">` +
        `<span class="ad-sello ad-sello--rm-${esc(r.estado)}">${esc(estadoR)}</span>${htmlSelloAcopio(r)}` +
        (amarillos ? `<span class="ad-sello ad-sello--amarillo">${esc(amarillos + ' en amarillo')}</span>` : '') + '</span></span>' +
        `<span class="ad-fila__meta">${esc(meta)}</span>` +
        (r.estado === 'error' && limpio(r.error) ? `<span class="ad-fila__meta ad-rm-tarjeta__error">${esc(limpio(r.error))}</span>` : '') +
        `<span class="ad-fila__meta">${esc('Subido ' + momentoAr(r.subido_en))}</span></button>`
    }

    function htmlRemitosPrecarga() {
      const rr = estado.remitos
      if (!sinControlStockEmpresa() || !rr || rr.empresaId !== estado.empresaId) return ''
      const n = Array.isArray(rr.filas) ? rr.filas.length : null
      // Los que quedaron sin terminar, de cualquiera (29/10/2026): para que
      // otro los termine. Sin ninguno, la sección no se ve.
      if (n === 0 && !rr.error) return ''
      const rmTitulo = `<h2 class="ad-subtitulo ad-rm-titulo">Sin terminar · para cargar lotes${n !== null ? ` <span class="ad-rm-contador" data-remitos-cuenta>${esc(n)}</span>` : ''}</h2>`
      let rmLista
      if (rr.error) rmLista = `<div class="ad-aviso ad-aviso--grave">${esc(rr.error)}</div>`
      else if (rr.filas === null) rmLista = '<div class="ad-vacio">Cargando los remitos…</div>'
      else rmLista = `<div class="ad-lista">${rr.filas.map(htmlTarjetaRemito).join('')}</div>`
      return `<section class="ad-rm-seccion" aria-label="Remitos sin terminar">${rmTitulo}${rmLista}</section>`
    }

    function pintarRemitosPrecarga() {
      const el = document.getElementById('ad-remitos')
      if (el) el.innerHTML = htmlRemitosPrecarga()
    }

    function quitarRemitoDeLaLista(id) {
      if (!(estado.remitosResueltos instanceof Set)) estado.remitosResueltos = new Set()
      estado.remitosResueltos.add(id)
      if (Array.isArray(estado.remitos?.filas)) estado.remitos.filas = remitosPorRevisar(estado.remitos.filas)
    }

    // ── El remito abierto: el formulario ──────────────────────────────────
    function cajasLoteRemito(l) {
      const n = Number(l?.cajas)
      return l?.cajas !== null && l?.cajas !== undefined && l?.cajas !== '' && Number.isInteger(n) && n > 0 ? n : 0
    }

    function normalizarLoteRemito(t) {
      return String(t ?? '').trim().toUpperCase()
    }

    // LOTES DE UN INSUMO (29/10/2026, rama ci-prueba/corregir-orden): la base
    // ya acepta lotes en un renglón de insumo (materia prima e insumos que van
    // de Rosario a Córdoba), cada uno {lote, cantidad} en la unidad del insumo
    // y con decimales (_remito_items_normalizar y confirmar_remito_precarga,
    // pg_get_functiondef el 29/10/2026: confirmar exige que sumen el renglón;
    // sin lotes, registrar_orden_retiro lo saca de los lotes más viejos con
    // stock). En el formulario cada fila guarda su número en `cajas` (como las
    // de producto); a la base va como `cantidad`.
    function cantidadLoteInsumo(l) {
      const v = l?.cajas ?? l?.cantidad
      const n = Number(v)
      return v !== null && v !== undefined && v !== '' && Number.isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : 0
    }

    function cantidadLoteRemito(r, l) {
      return r?.insumoId ? cantidadLoteInsumo(l) : cajasLoteRemito(l)
    }

    function renglonDesdeItem(it) {
      const pres = typeof it?.presentacion_id === 'string' && it.presentacion_id ? it.presentacion_id : null
      const cant = Number(it?.cantidad)
      return {
        texto_leido: String(it?.texto_leido ?? ''), nota: String(it?.nota ?? ''),
        revisar: it?.revisar === true, omitir: it?.omitir === true,
        cantidad: it?.cantidad !== null && it?.cantidad !== undefined && it?.cantidad !== '' && Number.isFinite(cant) && cant > 0 ? cant : null,
        presentacionId: pres,
        marcaId: pres && typeof it?.marca_id === 'string' && it.marca_id ? it.marca_id : null,
        insumoId: !pres && typeof it?.insumo_id === 'string' && it.insumo_id ? it.insumo_id : null,
        lotes: pres ? (Array.isArray(it?.lotes) ? it.lotes : []).map(l => ({ lote: String(l?.lote ?? ''), cajas: cajasLoteRemito(l) || null }))
          : typeof it?.insumo_id === 'string' && it.insumo_id ? (Array.isArray(it?.lotes) ? it.lotes : []).map(l => ({ lote: String(l?.lote ?? ''), cajas: cantidadLoteInsumo(l) || null })) : [],
        // cambiandoCono: el buscador del cono abierto con un cono ya elegido.
        eligiendo: false, busqueda: '', marcaBusqueda: '', cambiandoCono: false,
      }
    }

    function renglonRemitoNuevo() {
      return { texto_leido: '', nota: '', revisar: false, omitir: false, cantidad: null, presentacionId: null, marcaId: null, insumoId: null,
        lotes: [], eligiendo: true, busqueda: '', marcaBusqueda: '', cambiandoCono: false }
    }

    function formDesdeRemito(f) {
      return {
        numero: String(f?.numero_remito ?? ''), fecha: esFechaIso(f?.fecha) ? f.fecha : '', talonario: talonarioDe(f),
        clienteId: f?.cliente_id ?? null, clienteBusqueda: '',
        transporte: String(f?.transporte ?? ''), observaciones: String(f?.observaciones ?? ''),
        renglones: (Array.isArray(f?.items) ? f.items : []).map(renglonDesdeItem),
      }
    }

    function lotesRemitoParaBase(r) {
      const lotes = (r?.lotes ?? []).filter(l => cantidadLoteRemito(r, l) > 0 && normalizarLoteRemito(l.lote))
      if (r?.insumoId) return lotes.map(l => ({ lote: normalizarLoteRemito(l.lote).slice(0, LARGO_LOTE_REMITO), cantidad: cantidadLoteInsumo(l) }))
      return lotes.map(l => ({ lote: normalizarLoteRemito(l.lote).slice(0, LARGO_LOTE_REMITO), cajas: cajasLoteRemito(l) }))
    }

    // Un renglón como lo pide actualizar_remito_precarga.
    function itemRemitoParaBase(r) {
      const pres = r?.presentacionId ?? null
      const cant = r?.cantidad === null || r?.cantidad === undefined || r?.cantidad === '' ? null : Number(r.cantidad)
      return {
        texto_leido: String(r?.texto_leido ?? ''),
        cantidad: Number.isFinite(cant) ? cant : null,
        presentacion_id: pres,
        marca_id: pres ? (r.marcaId ?? null) : null,
        insumo_id: pres ? null : (r?.insumoId ?? null),
        lotes: pres || r?.insumoId ? lotesRemitoParaBase(r) : [],
        revisar: r?.omitir === true ? false : r?.revisar === true,
        omitir: r?.omitir === true,
        nota: String(r?.nota ?? ''),
      }
    }

    function parametrosActualizarRemito(rm) {
      const f = rm.form
      return {
        p_id: rm.id, p_numero_remito: limpio(f.numero) || null, p_fecha: esFechaIso(f.fecha) ? f.fecha : null,
        p_cliente_id: f.clienteId || null, p_transporte: limpio(f.transporte) || null, p_observaciones: limpio(f.observaciones) || null,
        p_items: f.renglones.map(itemRemitoParaBase), p_talonario: f.talonario === 'acopio' ? 'acopio' : 'oficial',
      }
    }

    // Lo pedido, lo asignado a los lotes escritos y lo que falta (como la
    // Carga sin control de stock).
    function asignacionRemito(r) {
      const pedido = r?.cantidad === null || r?.cantidad === undefined || r?.cantidad === '' ? null : Number(r.cantidad)
      const asignado = Math.round((r?.lotes ?? []).reduce((s, l) => s + cantidadLoteRemito(r, l), 0) * 1000) / 1000
      // La suma, redondeada a milésimas: 10,1 + 10,2 tiene que dar 20,3 (y no
      // 20,299999…); así, si suman el renglón, lo que falta da 0 exacto.
      return { pedido, asignado, falta: pedido === null ? null : pedido - asignado }
    }

    // "31 cajas" / "1 caja" / "20,5 kg": la cantidad de un renglón en su unidad.
    function cantidadRenglonRemito(r, n) {
      if (!r?.insumoId) return `${enteroHoja(n)} ${n === 1 ? 'caja' : 'cajas'}`
      return cantidadInsumoHoja(n, insumoDe(estado.catalogo, r.insumoId)?.unidad_medida)
    }

    // El pie: "Asignado X de Y · faltan Z", o "Va sin lote".
