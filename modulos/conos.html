    async function confirmarAgregar() {
      const p = pliegoPorId(estado.pliegoId)
      const err = document.getElementById('cn-agr-error')
      const cant = leerCampoNumero(document.getElementById('cn-agr-cantidad'))
      if (!estado.agregar.marcaId) { err.textContent = 'Elegí el cono.'; err.hidden = false; return }
      if (!(cant > 0)) { err.textContent = 'Poné la cantidad.'; err.hidden = false; return }
      const ya = itemsDe(p.id).find(i => i.marca_id === estado.agregar.marcaId)
      const nueva = (ya ? Number(ya.cantidad) : 0) + cant
      const ch = chequeoAsignar(itemsDe(p.id), Number(p.cantidad_total), estado.agregar.marcaId, nueva)
      if (!ch.ok) { err.textContent = ch.error; err.hidden = false; return }
      await ponerCono(p, estado.agregar.marcaId, nueva, err, () => { estado.agregar = { abierto: true, marcaId: null, buscar: '' } })
    }

    async function ponerCono(p, marcaId, cantidad, errEl, despues) {
      if (estado.enviando) return
      estado.enviando = true
      try {
        await rpc('poner_cono_pliego', { p_pliego_id: p.id, p_marca_id: marcaId, p_cantidad: cantidad })
        if (despues) despues()
        await Promise.all([cargarPliegos(), cargarStock()])
        pintarArmado()
        return true
      } catch (e) {
        if (errEl) { errEl.textContent = mensajeDe(e); errEl.hidden = false } else mostrarError(mensajeDe(e))
        return false
      } finally {
        estado.enviando = false
      }
    }

    // "+ Cono nuevo": proponer_marca y el cono queda ELEGIDO en el formulario
    // de donde salió ('anotar' = Anotar para pedir; si no, Agregar cono al
    // pliego). Con ya_existia (estaba, quizás apagado) también queda elegido.
    // Los errores de la base ("Ese cono está marcado como rechazado…") van
    // tal cual al formulario.
    async function proponerCono(nombre, destino = 'agregar') {
      if (estado.proponiendo) return
      estado.proponiendo = true
      const err = document.getElementById(destino === 'anotar' ? 'cn-anotar-error' : 'cn-agr-error')
      try {
        const r = await rpc('proponer_marca', { p_nombre: textoConoNuevo(nombre) })
        const id = r?.marca_id
        if (!id) throw new Error('La base no devolvió el cono.')
        // El catálogo se refresca (el nuevo ya está en la base); si la lectura
        // todavía no lo trae, se agrega a mano para poder nombrarlo.
        await Promise.allSettled([cargarStock(), cargarCatalogo()])
        if (!estado.conoPorId.has(id)) {
          const fila = { marca_id: id, cono: textoConoNuevo(nombre).toUpperCase(), activa: true, papel_ilustracion: false, stock: 0, en_camino: 0, en_armado: 0, consumo_30d: 0 }
          estado.conos.push(fila)
          estado.conoPorId.set(id, fila)
        }
        if (err) err.hidden = true
        if (destino === 'anotar') await elegirConoAnotar(id)
        else { estado.agregar.marcaId = id; pintarAgregar() }
        if (r.ya_existia) mostrarExito('Ese cono ya existía: quedó elegido.')
      } catch (e) {
        if (err) { err.textContent = mensajeDe(e); err.hidden = false } else mostrarError(mensajeDe(e))
      } finally {
        estado.proponiendo = false
      }
    }

    async function cargarCambios(id) {
      const { data, error } = await supabase.from('cono_pliego_cambios').select('*').eq('pliego_id', id).order('hecho_en')
      if (error) throw error
      const ids = [...new Set((data ?? []).map(c => c.hecho_por).filter(Boolean))].filter(x => !estado.nombres.has('emp:' + x))
      if (ids.length) {
        const { data: emps } = await supabase.from('v_empleados_publico').select('id, nombre').in('id', ids)
        for (const e of emps ?? []) estado.nombres.set('emp:' + e.id, e.nombre)
      }
      return data ?? []
    }

    function textoCambio(c) {
      const quien = estado.nombres.get('emp:' + c.hecho_por) ?? ''
      const cuando = fechaHora(c.hecho_en)
      let que = c.tipo
      if (c.tipo === 'reabierto') que = 'Se modificó el pedido (volvió a armado)'
      if (c.tipo === 'correccion_recepcion') {
        const lista = (Array.isArray(c.detalle) ? c.detalle : []).map(d => `${nombreCono(d.marca_id)} ${Number(d.cantidad) > 0 ? '+' : ''}${miles(d.cantidad)}`)
        que = 'Corrección de lo recibido' + (lista.length ? ': ' + lista.join(', ') : '')
      }
      return { que, motivo: c.motivo, quien, cuando }
    }

    async function pintarHistorial(p) {
      const ul = document.getElementById('cn-historial')
      const base = []
      if (p.creado_en) base.push({ cuando: p.creado_en, texto: 'Se armó el pliego' })
      if (p.pedido_en) base.push({ cuando: p.pedido_en, texto: 'Se confirmó el pedido' })
      if (p.recibido_en) base.push({ cuando: p.recibido_en, texto: 'Última recepción' })
      if (p.anulado_en) base.push({ cuando: p.anulado_en, texto: 'Se anuló' })
      let cambios = []
      try { cambios = await cargarCambios(p.id) } catch (e) {
        if (estado.pliegoId === p.id && ul.isConnected) ul.innerHTML = `<li class="cn-error">No se pudo leer el historial: ${esc(mensajeDe(e))}</li>`
        return
      }
      if (estado.pliegoId !== p.id || !ul.isConnected) return
      const filas = [
        ...base.map(b => ({ t: b.cuando, html: `${esc(fechaHora(b.cuando))} · ${esc(b.texto)}` })),
        ...cambios.map(c => { const x = textoCambio(c); return { t: c.hecho_en, html: `${esc(x.cuando)} · ${esc(x.que)}${x.motivo ? ' · Motivo: ' + esc(x.motivo) : ''}${x.quien ? ' · ' + esc(x.quien) : ''}` } }),
      ].sort((a, b) => String(a.t).localeCompare(String(b.t)))
      ul.innerHTML = filas.map(f => `<li>${f.html}</li>`).join('') || '<li>Sin cambios.</li>'
    }

    const LIBRERIAS_PDF = [
      'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    ]
    function cargarScript(url) {
      return new Promise((ok, mal) => {
        if (document.querySelector(`script[src="${url}"]`)) return ok()
        const s = document.createElement('script')
        s.src = url; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + url))
        document.head.appendChild(s)
      })
    }

    async function generarPdfOC(p) {
      for (const url of LIBRERIAS_PDF) await cargarScript(url)
      const cont = document.createElement('div')
      cont.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff'
      const hoja = document.createElement('div')
      hoja.className = 'cn-oc-hoja'
      hoja.innerHTML = htmlOrdenCompra(datosOC(p))
      cont.appendChild(hoja)
      document.body.appendChild(cont)
      try {
        const imgs = [...hoja.querySelectorAll('img')]
        await Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = r; img.onerror = r })))
        const canvas = await window.html2canvas(hoja, { scale: 2, backgroundColor: '#ffffff', useCORS: true })
        const { jsPDF } = window.jspdf
        const pdf = new jsPDF({ unit: 'mm', format: 'a4' })
        const ancho = 190, alto = Math.min(canvas.height * ancho / canvas.width, 277)
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, ancho, alto)
        return pdf.output('blob')
      } finally {
        cont.remove()
      }
    }

    function descargar(blob, nombre) {
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = nombre
      document.body.appendChild(a); a.click(); a.remove()
      setTimeout(() => URL.revokeObjectURL(url), 60000)
    }

    async function compartirOC(p) {
      const texto = `Pliego N° ${numeroOC(p)}`
      let blob
      try { blob = await generarPdfOC(p) } catch (e) { mostrarError('No se pudo armar el PDF: ' + mensajeDe(e)); return }
      const nombre = nombreArchivoOC(p)
      const archivo = typeof File === 'function' ? new File([blob], nombre, { type: 'application/pdf' }) : null
      if (archivo && navigator.canShare && navigator.canShare({ files: [archivo] })) {
        try { await navigator.share({ files: [archivo], title: texto, text: texto }); return } catch (err) {
          if (err && err.name === 'AbortError') return
        }
      }
      descargar(blob, nombre)
      window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank', 'noopener')
      mostrarExito('Se descargó el PDF: adjuntalo en WhatsApp.')
    }

    async function descargarOC(p) {
      try { descargar(await generarPdfOC(p), nombreArchivoOC(p)) } catch (e) { mostrarError('No se pudo armar el PDF: ' + mensajeDe(e)) }
    }

    let accionModal = null
    let focoAntes = null

    function abrirModal(titulo, cuerpo, { textoBoton = 'Confirmar', peligro = false, alAbrir = null, accion }) {
      focoAntes = document.activeElement
      accionModal = accion
      const m = document.getElementById('cn-modal')
      m.innerHTML = `<h2 id="cn-modal-titulo">${esc(titulo)}</h2>${cuerpo}
        <div class="cn-error" id="cn-modal-error" hidden></div>
        <div class="cn-modal__acciones">
          <button type="button" class="cn-btn cn-btn--suave" data-modal-cerrar>Cancelar</button>
          ${accion ? `<button type="button" class="cn-btn${peligro ? ' cn-btn--peligro' : ''}" id="cn-modal-ok">${esc(textoBoton)}</button>` : ''}
        </div>`
      document.getElementById('cn-modal-fondo').hidden = false
      if (alAbrir) alAbrir(m)
      const primero = m.querySelector('input, select, textarea, button')
      if (primero) primero.focus()
    }
    function cerrarModal() {
      document.getElementById('cn-modal-fondo').hidden = true
      document.getElementById('cn-modal').innerHTML = ''
      accionModal = null
      if (focoAntes && focoAntes.isConnected) focoAntes.focus()
    }
    function errorModal(texto) {
      const e = document.getElementById('cn-modal-error')
      if (!e) return
      e.textContent = texto; e.hidden = false
    }
    async function ejecutarModal() {
      if (!accionModal || estado.enviando) return
      const ok = document.getElementById('cn-modal-ok')
      estado.enviando = true
      if (ok) ok.disabled = true
      try {
        const r = await accionModal()
        if (r !== false) cerrarModal()
      } catch (e) {
        errorModal(mensajeDe(e))
      } finally {
        estado.enviando = false
        if (ok && ok.isConnected) ok.disabled = false
      }
    }

    // Iniciar un pedido con lo anotado de un papel.
    function abrirIniciar(papel) {
      const g = agruparPorPapel(estado.pendientes).find(x => x.papel === papel)
      const cuerpo = `
        <p>${esc(nombrePapel(papel))}: ${esc(miles(g?.total ?? 0))} anotados.</p>
        <div class="cn-segmento" id="cn-ini-tam">${TAMANOS_PLIEGO.map(t => `<button type="button" data-tam="${t}" aria-pressed="false">${esc(miles(t))}</button>`).join('')}<button type="button" data-tam="otra" aria-pressed="false">Otra</button></div>
        <div class="cn-campo" id="cn-ini-otra-campo" hidden><label for="cn-ini-otra">Cantidad del pliego</label><input type="text" id="cn-ini-otra" inputmode="numeric"></div>
        <div class="cn-campo"><label for="cn-ini-fecha">Entrega estimada</label><input type="date" id="cn-ini-fecha" min="${esc(hoyAr())}"></div>
        <div class="cn-campo"><label for="cn-ini-coment">Comentarios (van en la orden de compra)</label><textarea id="cn-ini-coment" maxlength="500"></textarea></div>`
      let tam = null
      abrirModal('Iniciar pedido', cuerpo, {
        textoBoton: 'Armar el pliego',
        alAbrir: m => {
          enlazarCampoNumero(m.querySelector('#cn-ini-otra'), { decimales: 0 })
          m.querySelector('#cn-ini-tam').addEventListener('click', ev => {
            const b = ev.target.closest('[data-tam]')
            if (!b) return
            tam = b.dataset.tam
            m.querySelectorAll('[data-tam]').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
            m.querySelector('#cn-ini-otra-campo').hidden = tam !== 'otra'
          })
        },
        accion: async () => {
          const total = tam === 'otra' ? leerCampoNumero(document.getElementById('cn-ini-otra')) : Number(tam)
          if (!(total > 0)) { errorModal('Elegí el tamaño del pliego.'); return false }
          const r = await rpc('crear_pliego_desde_pendientes', {
            p_papel: papel, p_cantidad_total: total,
            p_fecha_entrega_estimada: document.getElementById('cn-ini-fecha').value || null,
            p_comentarios: document.getElementById('cn-ini-coment').value.trim() || null,
          })
          await recargar()
          const avisos = [`Pliego N° ${r.numero} armado con ${miles(r.cargado)}.`]
          if (Number(r.quedaron_anotados) > 0) avisos.push(`Quedaron anotados ${miles(r.quedaron_anotados)} que no entraron.`)
          if (Number(r.falta) > 0) avisos.push(`Faltan asignar ${miles(r.falta)}.`)
          mostrarExito(avisos.join(' '))
          estado.agregar = { abierto: false, marcaId: null, buscar: '' }
          abrirPliego(r.id)
        },
      })
    }

    function abrirRecibir(id) {
      const p = pliegoPorId(id)
      const its = itemsOrdenados(itemsDe(id), nombreCono).filter(i => i.cantidad > i.recibido)
      let modo = 'todo'
      abrirModal(`Recibir el pliego N° ${numeroOC(p)}`, `
        <div class="cn-segmento" id="cn-rec-modo">
          <button type="button" data-rec-modo="todo" aria-pressed="true">Llegó todo</button>
          <button type="button" data-rec-modo="parte" aria-pressed="false">Llegó una parte</button>
        </div>
        <div id="cn-rec-todo"><p>Se recibe lo que falta de cada cono: ${esc(miles(its.reduce((a, i) => a + i.cantidad - i.recibido, 0)))} en total.</p></div>
        <div id="cn-rec-parte" hidden>
          ${its.map(i => `<div class="cn-campo"><label for="cn-rec-${esc(i.marca_id)}">${esc(nombreCono(i.marca_id))} · faltan ${esc(miles(i.cantidad - i.recibido))}</label><input type="text" inputmode="numeric" id="cn-rec-${esc(i.marca_id)}" data-rec-cant="${esc(i.marca_id)}"></div>`).join('')}
        </div>
        <div class="cn-campo"><label for="cn-rec-fecha">Fecha de llegada</label><input type="date" id="cn-rec-fecha" value="${esc(hoyAr())}" max="${esc(hoyAr())}"></div>`, {
        textoBoton: 'Recibir',
        alAbrir: m => {
          m.querySelectorAll('[data-rec-cant]').forEach(inp => enlazarCampoNumero(inp, { decimales: 0 }))
          m.querySelector('#cn-rec-modo').addEventListener('click', ev => {
            const b = ev.target.closest('[data-rec-modo]')
            if (!b) return
            modo = b.dataset.recModo
            m.querySelectorAll('[data-rec-modo]').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
            m.querySelector('#cn-rec-todo').hidden = modo !== 'todo'
            m.querySelector('#cn-rec-parte').hidden = modo !== 'parte'
          })
        },
        accion: async () => {
          let items = null
          if (modo === 'parte') {
            items = [...document.querySelectorAll('[data-rec-cant]')]
              .map(inp => ({ marca_id: inp.dataset.recCant, cantidad: leerCampoNumero(inp) }))
              .filter(x => x.cantidad !== null && x.cantidad > 0)
            if (!items.length) { errorModal('Poné cuánto llegó de al menos un cono.'); return false }
            const mal = items.find(x => { const i = its.find(y => y.marca_id === x.marca_id); return i && x.cantidad > i.cantidad - i.recibido })
            if (mal) { errorModal(`De ${nombreCono(mal.marca_id)} llegó más de lo que faltaba: si vino de más, usá "Corregir lo recibido".`); return false }
          }
          const r = await rpc('recibir_pliego', { p_pliego_id: id, p_items: items, p_fecha: document.getElementById('cn-rec-fecha').value || null })
          await recargar()
          mostrarExito(`Recibidos ${miles(r?.recibido)} conos del pliego N° ${p.numero}.`)
          estado.pliegoId = id
          mostrar(estado.vista === 'entregas' ? 'entregas' : 'detalle')
        },
      })
    }

      abrirModal(`Corregir lo recibido · N° ${numeroOC(p)}`, `

        ${its.map(i => `<div class="cn-campo"><label for="cn-cor-${esc(i.marca_id)}">${esc(nombreCono(i.marca_id))} · recibido ${esc(miles(i.recibido))}</label><input type="text" id="cn-cor-${esc(i.marca_id)}" data-cor-cant="${esc(i.marca_id)}" inputmode="text"></div>`).join('')}

        alAbrir: m => m.querySelectorAll('[data-cor-cant]').forEach(inp => enlazarCampoNumero(inp, { decimales: 0, negativos: true })),
        accion: async () => {

      try {
        await rpc('editar_pliego', { p_pliego_id: p.id, p_papel: document.getElementById('cn-arm-papel').value, p_cantidad_total: total, p_fecha_entrega_estimada: document.getElementById('cn-arm-fecha').value || null, p_nota: p.nota ?? null })
        await cargarPliegos(); pintarArmado(); mostrarExito('Pliego guardado.')

    function conectarTodo() {
      document.getElementById('cn-tabs').addEventListener('click', ev => {
        const b = ev.target.closest('[data-vista]')
        if (b) mostrar(b.dataset.vista)
      })
      const cantAnotar = document.getElementById('cn-anotar-cantidad')
      enlazarCampoNumero(cantAnotar, { decimales: 0 })
      document.getElementById('cn-anotar-buscar').addEventListener('input', ev => {
        document.getElementById('cn-anotar-resultados').innerHTML = htmlResultados(buscarConos(ev.target.value), 'data-anotar-cono', ofrecerConoNuevo(ev.target.value), 'anotar')
      })
      document.getElementById('cn-btn-anotar').addEventListener('click', anotar)
      document.getElementById('cn-anotar-papel').addEventListener('change', () => { estado.anotar.sugerido = false; pintarAnotar() })
      document.getElementById('cn-stock-buscar').addEventListener('input', ev => { estado.buscarStock = ev.target.value; pintarStock() })
      document.getElementById('cn-stock-todos').addEventListener('change', ev => { estado.stockTodos = ev.target.checked; pintarStock() })
      document.getElementById('cn-todos-buscar').addEventListener('input', ev => buscarEnTodos(ev.target.value))
      document.getElementById('cn-pliegos-papel').addEventListener('change', ev => { estado.filtroPapel = ev.target.value; pintarPliegos() })
      document.getElementById('cn-pliegos-buscar').addEventListener('input', ev => { estado.buscarPliego = ev.target.value; pintarPliegos() })
      document.getElementById('cn-btn-pliego-nuevo').addEventListener('click', abrirPliegoNuevo)
      document.getElementById('cn-oc-volver').addEventListener('click', () => mostrar(pliegoPorId(estado.pliegoId)?.estado === 'armando' && estado.perm.pedir ? 'armado' : 'detalle'))
      document.getElementById('cn-oc-imprimir').addEventListener('click', () => window.print())
      document.getElementById('cn-oc-pdf').addEventListener('click', () => descargarOC(pliegoPorId(estado.pliegoId)))
      document.getElementById('cn-oc-whatsapp').addEventListener('click', () => compartirOC(pliegoPorId(estado.pliegoId)))

      document.getElementById('cn-modal-fondo').addEventListener('click', ev => {
        if (ev.target.id === 'cn-modal-fondo' || ev.target.closest('[data-modal-cerrar]')) { cerrarModal(); return }
        if (ev.target.closest('#cn-modal-ok')) ejecutarModal()
      })
      document.addEventListener('keydown', ev => {
        if (ev.key === 'Escape' && !document.getElementById('cn-modal-fondo').hidden && !estado.enviando) cerrarModal()
      })

      document.getElementById('cn-app').addEventListener('input', ev => {
        if (ev.target.id === 'cn-agr-buscar') { estado.agregar.buscar = ev.target.value; pintarResultadosAgregar() }
        if (ev.target.id === 'cn-arm-total' ) return
      })
      document.getElementById('cn-app').addEventListener('change', ev => {
        if (ev.target.id === 'cn-arm-total') document.getElementById('cn-arm-total-otra').hidden = ev.target.value !== 'otra'
        const logo = ev.target.closest('[data-logo-nuevo]')
        if (logo) marcarLogo(logo.dataset.logoNuevo, logo.checked, logo)
        const sw = ev.target.closest('[data-configurar]')
        if (sw) tocarInterruptor(sw.dataset.configurar, sw.dataset.campo, sw.checked)
      })

      document.body.addEventListener('click', ev => {
        const t = ev.target
        const b = sel => t.closest(sel)
        let el
        if ((el = b('[data-sumar-anotar]'))) {
          const n = Number(el.dataset.sumarAnotar)
          ponerNumero(cantAnotar, n === 0 ? null : sumarCantidad(leerCampoNumero(cantAnotar), n))
          return
        }
        if ((el = b('[data-anotar-cono]'))) { elegirConoAnotar(el.dataset.anotarCono); return }
        if (b('[data-anotar-cambiar]')) { estado.anotar = { marcaId: null, sugerido: false }; pintarAnotar(); document.getElementById('cn-anotar-buscar').focus(); return }
        if ((el = b('[data-iniciar]'))) { abrirIniciar(el.dataset.iniciar); return }
        if ((el = b('[data-editar-pend]'))) { abrirEditarPendiente(el.dataset.editarPend, el.dataset.pendMarca); return }
        if ((el = b('[data-borrar-pend]'))) { abrirBorrarPendiente(el.dataset.borrarPend); return }
        if ((el = b('[data-conteo]'))) { abrirConteoAjuste(el.dataset.conteo, 'conteo'); return }
        if ((el = b('[data-ajuste]'))) { abrirConteoAjuste(el.dataset.ajuste, 'ajuste'); return }
        if ((el = b('[data-filtro-estado]'))) { estado.filtroEstado = el.dataset.filtroEstado; pintarPliegos(); return }
        if ((el = b('[data-filtro-todos]'))) { elegirFiltroTodos(el.dataset.filtroTodos); return }
        if ((el = b('[data-recibir]'))) { abrirRecibir(el.dataset.recibir); return }
        if ((el = b('[data-pliego]'))) { abrirPliego(el.dataset.pliego); return }
        if (b('[data-volver-pliegos]')) { mostrar(estado.perm.pedir ? 'pliegos' : 'entregas'); return }
        if ((el = b('[data-abrir-armado]'))) { abrirPliego(el.dataset.abrirArmado); return }
        if ((el = b('[data-modificar]'))) { abrirModificar(el.dataset.modificar); return }
        if ((el = b('[data-corregir]'))) { abrirCorregir(el.dataset.corregir); return }
        if ((el = b('[data-cambiar-fecha]'))) { abrirCambiarFecha(el.dataset.cambiarFecha); return }
        if ((el = b('[data-anular]'))) { abrirAnular(el.dataset.anular); return }
        if ((el = b('[data-ver-oc]'))) { if (!document.getElementById('cn-modal-fondo').hidden) cerrarModal(); estado.pliegoId = el.dataset.verOc; mostrar('oc'); window.scrollTo(0, 0); return }
        if ((el = b('[data-cargar-precio]'))) { abrirCargarPrecio(el.dataset.cargarPrecio, Number(el.dataset.precioCant)); return }
        if (b('#cn-arm-guardar')) { guardarDatosArmado(); return }
        if (b('#cn-arm-guardar-coment')) { guardarComentariosArmado(); return }
        if (b('#cn-arm-confirmar')) { abrirConfirmar(); return }
        if (b('#cn-arm-agregar-abrir')) { estado.agregar = { abierto: true, marcaId: null, buscar: '' }; pintarAgregar(); document.getElementById('cn-agr-buscar')?.focus(); return }
        if (b('#cn-agr-cerrar')) { estado.agregar = { abierto: false, marcaId: null, buscar: '' }; pintarAgregar(); return }
        if (b('#cn-agr-confirmar')) { confirmarAgregar(); return }
        if ((el = b('[data-agregar-cono]'))) { estado.agregar.marcaId = el.dataset.agregarCono; pintarAgregar(); return }
        if (b('[data-agregar-cambiar]')) { estado.agregar.marcaId = null; pintarAgregar(); return }
        if ((el = b('[data-cono-nuevo]'))) { proponerCono(el.dataset.conoNuevo, el.dataset.conoDestino); return }
        if ((el = b('[data-sumar-agregar]'))) {
          const c = document.getElementById('cn-agr-cantidad')
          const n = Number(el.dataset.sumarAgregar)
          ponerNumero(c, n === 0 ? null : sumarCantidad(leerCampoNumero(c), n))
          return
        }
        if ((el = b('[data-editar-item]'))) { abrirEditarItem(el.dataset.editarItem); return }
        if ((el = b('[data-quitar-item]'))) { abrirQuitarItem(el.dataset.quitarItem); return }
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════════════════════════════

    function sinAcceso(texto) {
      document.getElementById('cn-cargando').hidden = true
      const el = document.getElementById('cn-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return
      try {
        await cargarPermisos()
      } catch (err) {
        console.error('permisos', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }
      estado.vistas = vistasDe(estado.perm)
      if (!estado.vistas.length) { sinAcceso('No tenés acceso a Conos de papel. Te llevamos al inicio…'); return }
      try { await cargarConfig() } catch (err) { console.error('config', err) }
      await recargar()
      document.getElementById('cn-cargando').hidden = true
      conectarTodo()
      const params = new URLSearchParams(location.search)
      const pedida = params.get('vista')
      const pliego = params.get('pliego')
      if (pedida || pliego) history.replaceState(null, '', location.pathname)
      if (pliego && pliegoPorId(pliego)) { abrirPliego(pliego); return }
      const vista = estado.vistas.find(v => v.clave === pedida)?.clave ?? estado.vistas[0].clave
      mostrar(vista)
    }

    init()
  </script>
</body>
</html>
