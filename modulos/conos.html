<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Conos de papel — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- CONOS DE PAPEL (10/10/2026). Los papelitos impresos con el logo de cada
       cliente que van alrededor del cucurucho. Se piden por PLIEGO a la gráfica
       Musumeci (120.000 o 240.000 conos por pliego, en papel Ilustración, Obra
       blanco u Obra nature), llegan, y la producción los consume.

       Toda la lógica vive en la base (conos_stock, crear_pliego, poner_cono_pliego,
       confirmar_pliego, recibir_pliego, …): la pantalla llama y dice el resultado.
       Los errores de la base se muestran TAL CUAL.

       Permisos (empleado_tareas, módulo 'conos'; la base NO tiene una fila
       'conos' en la tabla modulos, así que la pantalla se abre por tener alguna
       de las cuatro tareas):
       - conos:ver     → Stock y "Pendientes de entrega".
       - conos:pedir   → Por pedir, Pliegos (armar, confirmar, modificar,
                         recibir, corregir, anular), conteo y ajuste de stock.
       - conos:precios → ver y cargar el precio del papel. Sin esta tarea no se
                         ve NINGÚN precio en ninguna parte (tampoco en la O.C.).
       - conos:recibir → recibir un pliego pedido.
       Mauricio Silva tiene ver + recibir: ve Stock y Pendientes de entrega.

       TODOS LOS CONOS (14/10/2026): todas las marcas (conos_catalogo()) con tres
       interruptores que se guardan al tocarlos con configurar_cono (solo el
       campo tocado; los otros van null). Lo ven conos:ver, conos:pedir o
       quien tenga producción (ver/cargar/configurar), como deja la base.
       "En producción" y "Doble bolsa" piden produccion:configurar;
       "Ilustración", produccion:configurar o conos:pedir o conos:precios. Es
       lo mismo que Producción → Configuración → Marcas / Conos; los nuevos
       (pendiente_revision) se aceptan ALLÁ, acá solo se avisa. -->

  <style>
    [hidden] { display: none !important; }

    /* main.css pone overflow-x: hidden en html y body, y eso vuelve al body
       un contenedor de scroll que no scrollea: un position: sticky NO se pega
       a la pantalla. "clip" corta igual lo que se sale de costado sin ser un
       contenedor de scroll, así "Asignado X de Y" queda fijo arriba. */
    html, body { overflow-x: clip; }

    body {
      --cn-borde: rgba(28, 26, 23, 0.08);
      --cn-sombra: 0 1px 2px rgba(28, 26, 23, 0.05);
      --cn-segmento-fondo: color-mix(in srgb, var(--naranja) 9%, transparent);
      --cn-logo-nuevo: #C81E1E;
    }

    .cn-app { max-width: 1120px; margin: 0 auto; padding: 0 1rem 6rem; }

    /* ── El encabezado (23/10/2026): el de todos los módulos, .cab-modulo de
       main.css, con el color de Conos de papel (PALETA_MODULO de js/modulos.js). ── */
    .cab-modulo { --cab-modulo: oklch(0.55 0.12 45); --cab-modulo-suave: oklch(0.955 0.034 45); }

    .cn-tabs { display: flex; gap: 0.375rem; overflow-x: auto; padding: 0.25rem 0 0.75rem; }
    .cn-tab {
      flex: 0 0 auto; min-height: 44px; padding: 0 1rem; border-radius: 999px;
      border: 1px solid var(--color-borde); background: var(--color-fondo); color: var(--color-texto);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .cn-tab[aria-pressed="true"] { background: var(--color-acento); border-color: var(--color-acento); color: #fff; }

    .cn-tarjeta { background: var(--color-fondo); border: 1px solid var(--cn-borde); box-shadow: var(--cn-sombra); border-radius: 16px; padding: 1rem; margin-bottom: 0.75rem; }
    .cn-tarjeta h2, .cn-tarjeta h3 { margin: 0 0 0.5rem; font-family: var(--fuente-titulo); letter-spacing: -0.02em; }
    .cn-tarjeta h2 { font-size: 1.125rem; }
    .cn-tarjeta h3 { font-size: 1rem; }

    .cn-fila { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .cn-campo { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; min-width: 0; }
    .cn-campo label, .cn-campo .cn-rotulo { font-size: 0.8125rem; font-weight: 600; color: var(--color-texto-2, #6B645A); }
    .cn-campo input, .cn-campo select, .cn-campo textarea {
      min-height: 44px; padding: 0.5rem 0.75rem; border: 1px solid var(--color-borde-fuerte);
      border-radius: 12px; font: inherit; font-size: 16px; background: #fff; color: var(--color-texto); width: 100%; box-sizing: border-box;
    }
    .cn-campo textarea { min-height: 72px; resize: vertical; }

    .cn-btn {
      min-height: 44px; padding: 0 1rem; border-radius: 12px; border: 1px solid var(--color-acento);
      background: var(--color-acento); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    .cn-btn:disabled { opacity: 0.55; cursor: default; }
    .cn-btn--suave { background: #fff; color: var(--color-texto); border-color: var(--color-borde-boton); font-weight: 600; }
    .cn-btn--peligro { background: #fff; color: var(--bordo); border-color: var(--bordo); }
    .cn-btn--chico { min-height: 36px; padding: 0 0.75rem; font-size: 0.875rem; }
    .cn-sumar { display: flex; flex-wrap: wrap; gap: 0.375rem; }
    .cn-sumar .cn-btn { min-width: 64px; }

    .cn-cantidad-grande { font-family: var(--fuente-titulo); font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .cn-error { color: var(--bordo); font-weight: 600; margin: 0.375rem 0; }
    .cn-aviso { background: var(--color-superficie); border-left: 3px solid var(--color-borde-fuerte); padding: 0.5rem 0.75rem; border-radius: 8px; margin: 0.5rem 0; color: var(--color-texto-menu, #3D3831); }
    .cn-aviso--grave { background: var(--bordo-suave); border-left-color: var(--bordo); color: var(--bordo-oscuro); font-weight: 600; }
    .cn-vacio { padding: 1.5rem 0.5rem; color: var(--color-texto-2, #6B645A); text-align: center; }

    .cn-resultados { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.25rem; }
    .cn-resultado { text-align: left; min-height: 44px; padding: 0.375rem 0.75rem; border: 1px solid var(--color-borde); border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
    .cn-resultado:hover { background: var(--color-fila-hover); }
    .cn-elegido { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; border-radius: 999px; background: var(--color-acento-suave); color: var(--naranja-oscuro); font-weight: 700; }

    .cn-chip { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--color-pista); color: var(--color-texto-menu, #3D3831); white-space: nowrap; }
    .cn-chip--ilus { background: var(--marron-suave); color: var(--marron-oscuro); }
    .cn-chip--logo { background: #FDECEC; color: var(--cn-logo-nuevo); letter-spacing: 0.04em; }
    .cn-chip--armando { background: var(--color-acento-suave); color: var(--naranja-oscuro); }
    .cn-chip--pedido { background: var(--celeste-suave); color: var(--celeste-oscuro); }
    .cn-chip--recibido_parcial { background: var(--amarillo-suave); color: var(--amarillo-oscuro); }
    .cn-chip--recibido { background: var(--verde-suave); color: var(--verde-oscuro); }
    .cn-chip--anulado { background: var(--bordo-suave); color: var(--bordo-oscuro); }

    /* Stock: un renglón por cono. */
    .cn-stock-fila { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(5, minmax(0, 1fr)); gap: 0.5rem; align-items: center; padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--color-divisor); }
    .cn-stock-fila--cab { font-size: 0.75rem; font-weight: 700; color: var(--color-texto-2, #6B645A); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--color-borde); }
    .cn-stock-fila .cn-num { text-align: right; font-variant-numeric: tabular-nums; }
    .cn-stock-fila .cn-num small { display: none; }
    .cn-stock-nombre { font-weight: 700; overflow-wrap: anywhere; }
    .cn-stock-acciones { grid-column: 1 / -1; display: flex; gap: 0.375rem; flex-wrap: wrap; }
    .cn-negativo { color: var(--bordo); font-weight: 700; }
    @media (max-width: 720px) {
      .cn-stock-fila { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cn-stock-fila--cab { display: none; }
      .cn-stock-nombre { grid-column: 1 / -1; }
      .cn-stock-fila .cn-num { text-align: left; }
      .cn-stock-fila .cn-num small { display: block; font-size: 0.6875rem; color: var(--color-texto-2, #6B645A); font-weight: 600; }
    }

    /* Todos los conos (14/10/2026): un renglón por marca con el stock (solo
       con conos:ver) y los tres interruptores, cada uno con su nombre al lado.
       En el celular el nombre va arriba y los tres interruptores abajo, en
       tres columnas iguales. */
    .cn-chip--revisar { background: var(--color-acento-suave); color: var(--naranja-oscuro); }
    .cn-chip--rechazado { background: var(--bordo-suave); color: var(--bordo-oscuro); }
    .cn-seg-n { font-variant-numeric: tabular-nums; opacity: 0.7; margin-left: 0.25rem; }
    .cn-todos-cuenta { font-size: 0.875rem; color: var(--color-texto-2, #6B645A); margin: 0 0 0.5rem; }
    .cn-cat-fila { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem auto; gap: 0.25rem 1rem; align-items: center; padding: 0.375rem 0.75rem; border-bottom: 1px solid var(--color-divisor); }
    .cn-cat-fila--sin-stock { grid-template-columns: minmax(0, 1fr) auto; }
    .cn-cat-nombre { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .cn-cat-fila--apagado .cn-cat-nombre { color: var(--color-texto-2, #6B645A); }
    .cn-cat-stock { text-align: right; font-variant-numeric: tabular-nums; }
    .cn-cat-stock small { font-size: 0.75rem; color: var(--color-texto-2, #6B645A); font-weight: 600; margin-right: 0.25rem; }
    .cn-cat-sws { display: grid; grid-template-columns: repeat(3, 9rem); gap: 0.25rem 0.5rem; }
    .cn-cat-error { grid-column: 1 / -1; margin: 0 0 0.25rem; }
    .cn-sw { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; cursor: pointer; font-size: 0.875rem; font-weight: 600; min-width: 0; }
    .cn-sw__input {
      appearance: none; -webkit-appearance: none; position: relative; flex: 0 0 auto;
      width: 40px; height: 24px; margin: 0; border-radius: 999px; background: var(--color-pista);
      border: 1px solid var(--color-borde-fuerte); cursor: pointer; transition: background 0.15s;
    }
    .cn-sw__input::before {
      content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(28, 26, 23, 0.3); transition: transform 0.15s;
    }
    .cn-sw__input:checked { background: var(--color-acento); border-color: var(--color-acento); }
    .cn-sw__input:checked::before { transform: translateX(16px); }
    .cn-sw__input:focus-visible { outline: 2px solid var(--color-acento); outline-offset: 2px; }
    .cn-sw__input:disabled { cursor: not-allowed; opacity: 0.45; }
    .cn-sw--sin-permiso { cursor: not-allowed; color: var(--color-texto-2, #6B645A); }
    @media (max-width: 720px) {
      .cn-cat-fila, .cn-cat-fila--sin-stock { grid-template-columns: minmax(0, 1fr) auto; padding: 0.5rem 0.75rem; }
      .cn-cat-sws { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cn-sw { flex-direction: column; gap: 0.125rem; font-size: 0.75rem; text-align: center; min-height: 48px; justify-content: center; }
    }

    /* Por pedir: grupos por papel. */
    .cn-grupo__cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .cn-grupo__total { font-family: var(--fuente-titulo); font-weight: 700; font-size: 1.0625rem; }
    .cn-pend { padding: 0.5rem 0; border-top: 1px solid var(--color-divisor); }
    .cn-pend__nombre { font-weight: 700; }
    .cn-pend__anotado { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.25rem; font-size: 0.9375rem; }

    /* Pliego en armado */
    .cn-asignado {
      position: sticky; top: calc(var(--alto-barra-arriba, 52px) + 0px); z-index: 5;
      background: var(--color-fondo); border: 1px solid var(--color-borde); border-radius: 12px;
      padding: 0.625rem 0.875rem; margin-bottom: 0.75rem; font-weight: 700; box-shadow: var(--cn-sombra);
    }
    .cn-asignado--falta { border-color: var(--amarillo); }
    .cn-asignado--completo { border-color: var(--verde); color: var(--verde-oscuro); }
    .cn-item { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.625rem 0; border-top: 1px solid var(--color-divisor); }
    .cn-item__nombre { flex: 1 1 10rem; font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .cn-item__cant { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 5.5rem; text-align: right; }
    .cn-item--logo .cn-item__nombre { color: var(--cn-logo-nuevo); }
    .cn-tilde { display: inline-flex; align-items: center; gap: 0.375rem; min-height: 44px; cursor: pointer; }
    .cn-tilde input { width: 20px; height: 20px; }

    /* Pliegos */
    .cn-pliego { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 0.25rem 0.75rem; align-items: center; width: 100%; text-align: left; padding: 0.75rem; border: 1px solid var(--color-borde); border-radius: 12px; background: #fff; font: inherit; cursor: pointer; margin-bottom: 0.5rem; }
    .cn-pliego:hover { background: var(--color-fila-hover); }
    .cn-pliego__num { font-family: var(--fuente-titulo); font-weight: 700; font-size: 1.125rem; }
    .cn-pliego__datos { color: var(--color-texto-2, #6B645A); font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; }
    .cn-pliego__plata { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cn-pliego-entrega { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.75rem; border: 1px solid var(--color-borde); border-radius: 12px; background: #fff; margin-bottom: 0.5rem; }
    .cn-pliego-entrega > div { flex: 1 1 12rem; min-width: 0; }

    .cn-tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .cn-tabla th, .cn-tabla td { padding: 0.5rem 0.375rem; border-bottom: 1px solid var(--color-divisor); text-align: left; }
    .cn-tabla th { font-size: 0.75rem; text-transform: uppercase; color: var(--color-texto-2, #6B645A); }
    .cn-tabla td.n, .cn-tabla th.n { text-align: right; }
    .cn-tabla-scroll { overflow-x: auto; }

    .cn-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.5rem 1rem; margin-bottom: 0.75rem; }
    .cn-datos dt { font-size: 0.75rem; color: var(--color-texto-2, #6B645A); font-weight: 600; }
    .cn-datos dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }

    .cn-historial li { padding: 0.375rem 0; border-bottom: 1px solid var(--color-divisor); }
    .cn-historial { list-style: none; padding: 0; margin: 0; }

    /* Precios */
    .cn-precios { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }
    .cn-precio__valor { font-family: var(--fuente-titulo); font-size: 1.375rem; font-weight: 700; }
    .cn-precio__sin { color: var(--bordo); font-weight: 700; }
    .cn-precio__hist { font-size: 0.875rem; color: var(--color-texto-2, #6B645A); margin: 0.5rem 0 0; padding-left: 1rem; }

    /* La ventana (modal) de cada acción */
    .cn-modal-fondo { position: fixed; inset: 0; background: rgba(28, 26, 23, 0.45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .cn-modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
    @media (min-width: 640px) { .cn-modal-fondo { align-items: center; } .cn-modal { border-radius: 16px; } }
    .cn-modal h2 { margin: 0 0 0.75rem; font-family: var(--fuente-titulo); font-size: 1.25rem; }
    .cn-modal__acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }
    .cn-segmento { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 0.75rem; }
    .cn-segmento button { min-height: 44px; padding: 0 0.875rem; border-radius: 999px; border: 1px solid var(--color-borde); background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .cn-segmento button[aria-pressed="true"] { background: var(--cn-segmento-fondo); border-color: var(--color-acento); color: var(--naranja-oscuro); }
    .cn-cuentas { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-variant-numeric: tabular-nums; }
    .cn-cuentas td { padding: 0.25rem 0; }
    .cn-cuentas td.n { text-align: right; font-weight: 700; }
    .cn-cuentas tr.total td { border-top: 1px solid var(--color-borde); font-size: 1.125rem; }

    /* La orden de compra: una hoja A4 como las de Musumeci. */
    .cn-oc-barra { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
    .cn-oc-marco { overflow-x: auto; background: var(--color-superficie); padding: 0.5rem; border-radius: 12px; }
    .cn-oc-hoja {
      width: 190mm; min-height: 270mm; margin: 0 auto; background: #fff; color: #000; box-sizing: border-box;
      border: 2px solid #000; padding: 6mm 4mm; font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; line-height: 1.25;
    }
    .cn-oc-hoja * { box-sizing: border-box; }
    .oc-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; }
    .oc-cab img { height: 24mm; width: auto; display: block; margin-bottom: 2mm; }
    .oc-titulo { font-size: 26pt; font-weight: 800; letter-spacing: 0.01em; text-align: right; margin-top: 8mm; }
    .oc-num { display: grid; grid-template-columns: auto 30mm; gap: 1mm 2mm; justify-content: end; margin-top: 2mm; font-size: 10pt; }
    .oc-num span:nth-child(odd) { text-align: right; }
    .oc-num span:nth-child(even) { border: 1px solid #888; text-align: center; padding: 0 1mm; }
    .oc-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18mm; margin-top: 5mm; }
    .oc-barra-verde { background: #3F8A1D; color: #fff; font-weight: 700; padding: 1mm 4mm; margin-bottom: 2mm; }
    .oc-dos p { margin: 0 0 1mm; }
    .oc-tres { display: grid; grid-template-columns: 30mm 1fr 1fr; margin-top: 2mm; border-top: 2px solid #2F4F8F; }
    .oc-tres > div { border-right: 1px solid #000; }
    .oc-tres .oc-barra-verde { margin: 0; text-align: center; }
    .oc-tres .oc-valor { text-align: center; padding: 1mm; border-top: 1px solid #000; border-bottom: 1px solid #000; min-height: 6mm; }
    .oc-tabla { width: 100%; border-collapse: collapse; margin-top: 4mm; font-size: 9.5pt; }
    .oc-tabla th { background: #3F8A1D; color: #fff; padding: 1.2mm 1mm; font-weight: 700; }
    .oc-tabla td { border-bottom: 1px solid #ccc; border-right: 1px solid #000; padding: 0.6mm 1.2mm; height: 5mm; }
    .oc-tabla td:first-child { border-left: 1px solid #000; background: #F2F2F2; }
    .oc-tabla td.n { text-align: right; }
    .oc-tabla td.c { text-align: center; }
    .oc-tabla td.gris { background: #F2F2F2; }
    .oc-tabla tr.oc-logo td:not(:first-child) { color: #D00000; font-weight: 700; }
    .oc-tabla tr.oc-final td { border-bottom: 2px solid #000; }
    .oc-pie { display: grid; grid-template-columns: 1fr 75mm; gap: 6mm; margin-top: 2mm; }
    .oc-coment { border: 1px solid #999; align-self: start; }
    .oc-coment__cab { background: #92D050; color: #fff; font-weight: 700; padding: 1mm 1.5mm; }
    .oc-coment p { margin: 1.5mm 1.5mm; }
    .oc-rojo { color: #D00000; }
    .oc-totales { width: 100%; border-collapse: collapse; }
    .oc-totales td { padding: 1mm 1.5mm; }
    .oc-totales td.n { text-align: right; background: #F2F2F2; }
    .oc-totales tr.oc-total td { font-weight: 800; border-top: 2px solid #000; }
    .oc-totales tr.oc-total td.n { background: #92D050; }

    @media print {
      @page { size: A4; margin: 10mm; }
      body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
      body * { visibility: hidden !important; }
      .cn-oc-hoja, .cn-oc-hoja * { visibility: visible !important; }
      .cn-oc-hoja { position: absolute; left: 0; top: 0; border: 2px solid #000; }
      .cn-oc-marco { padding: 0; background: none; overflow: visible; }
    }

    /* En el celular, un botón fijo abajo va arriba de la barra de abajo de la
       app (regla de CLAUDE.md, "Revisión en el celular"). */
    @media (max-width: 1023.98px) {
      body.con-barra-lateral .cn-modal { padding-bottom: calc(1rem + 68px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { mostrarError, mostrarExito, enlazarCampoNumero, leerCampoNumero, ponerNumero, formatearNumeroAr } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // CONSTANTES Y FUNCIONES PURAS (las ejecuta pruebas/test-conos.js)
    // ═══════════════════════════════════════════════════════════════════════

    // Los tres papeles, con el nombre que se dice en la fábrica.
    const NOMBRE_PAPEL = { ilustracion: 'Ilustración', obra: 'Obra blanco', obra_nature: 'Obra nature' }
    const ORDEN_PAPELES = ['obra', 'obra_nature', 'ilustracion']
    // Los dos tamaños de pliego que se piden.
    const TAMANOS_PLIEGO = [120000, 240000]
    // Por pedir: ×½ = 5.000, ×1 = 10.000 … y SUMAN a lo que ya está.
    const BOTONES_ANOTAR = [
      { texto: '×½', n: 5000 }, { texto: '×1', n: 10000 }, { texto: '×2', n: 20000 },
      { texto: '×3', n: 30000 }, { texto: '×4', n: 40000 },
    ]
    // En el pliego en armado: 5.000 y 10.000, que también suman.
    const BOTONES_PLIEGO = [5000, 10000]
    const IVA_PCT = 21
    // Un cono que alcanza para menos de esto se avisa arriba del stock.
    const DIAS_AVISO = 30
    // TEMPORAL (21/10/2026, pedido de Facu): no mostrar negativos hasta
    // terminar de armar los conos. Con false, un stock negativo se muestra
    // como 0 (sin el bordó), no hay aviso de "Stock negativo", no cuenta como
    // "pocos" y su "Alcanza" dice "—". Para volver a como era: true.
    const MOSTRAR_NEGATIVOS_CONOS = false
    // La O.C. tiene al menos esta cantidad de renglones de conos (como las de
    // Musumeci: los que sobran van con "-  X  -").
    const RENGLONES_MINIMOS_OC = 15
    const ETIQUETA_ESTADO = {
      armando: 'En armado', pedido: 'Pedido · en camino', recibido_parcial: 'Recibido en parte',
      recibido: 'Recibido', anulado: 'Anulado',
    }
    const FILTROS_ESTADO = [
      { v: '', t: 'Todos' }, { v: 'armando', t: 'En armado' }, { v: 'en_camino', t: 'En camino' },
      { v: 'recibido', t: 'Recibidos' }, { v: 'anulado', t: 'Anulados' },
    ]
    const ZONA_AR = 'America/Argentina/Buenos_Aires'

    function esc(texto) {
      return String(texto ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    }

    function nombrePapel(p) {
      return NOMBRE_PAPEL[p] ?? String(p ?? '—')
    }

    // Una cantidad de conos: "20.000". Un dato ausente es "—", nunca "0".
    function miles(n) {
      if (n === null || n === undefined || n === '' || !Number.isFinite(Number(n))) return '—'
      return formatearNumeroAr(Number(n), { decimales: 0 })
    }
    // Plata: "$ 2.160.000,00". Ausente: "—".
    function plata(n) {
      if (n === null || n === undefined || n === '' || !Number.isFinite(Number(n))) return '—'
      return '$ ' + formatearNumeroAr(Number(n), { decimales: 2 })
    }
    // El precio por cono, con 3 decimales como en la O.C.: "9,000".
    function precio3(n) {
      if (n === null || n === undefined || n === '' || !Number.isFinite(Number(n))) return '—'
      return formatearNumeroAr(Number(n), { decimales: 3 })
    }

    function hoyAr(ahora = new Date()) {
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AR, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(ahora)
      const v = t => p.find(x => x.type === t)?.value
      return `${v('year')}-${v('month')}-${v('day')}`
    }
    function fechaCorta(iso) {
      if (!iso) return '—'
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso))
      return m ? `${m[3]}/${m[2]}/${m[1]}` : '—'
    }
    function fechaHora(ts) {
      if (!ts) return '—'
      const d = new Date(ts)
      if (Number.isNaN(d.getTime())) return '—'
      return new Intl.DateTimeFormat('es-AR', { timeZone: ZONA_AR, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d)
    }

    // Sumar con un botón: lo que ya había más n. Lo vacío cuenta como cero.
    function sumarCantidad(actual, n) {
      const a = Number.isFinite(Number(actual)) && actual !== null && actual !== '' ? Number(actual) : 0
      return a + n
    }

    // Los permisos de la persona: ver, pedir, precios, recibir (de conos) y,
    // de producción, configurar y si tiene alguna (ver/cargar/configurar, lo
    // que mira puede_ver_produccion()). Un super_admin los tiene todos (como
    // tiene_tarea() en la base, que no mira el alcance).
    function permisosDe(tareas, esSuper, tareasProduccion = []) {
      const t = new Set(tareas ?? [])
      const tiene = x => !!esSuper || t.has(x)
      const pr = new Set(tareasProduccion ?? [])
      const tieneP = x => !!esSuper || pr.has(x)
      return {
        ver: tiene('ver'), pedir: tiene('pedir'), precios: tiene('precios'), recibir: tiene('recibir'),
        configurar: tieneP('configurar'), cargar: tieneP('cargar'),
        produccion: tieneP('configurar') || tieneP('ver') || tieneP('cargar'),
      }
    }

    // ── "+ Cono nuevo" (14/10/2026, también al anotar para pedir) ─────────
    // proponer_marca(p_nombre) lo deja a produccion:cargar, produccion:configurar
    // o conos:pedir (verificado el 14/10/2026): a los demás no se les ofrece.
    function puedeProponer(perm) {
      return !!(perm?.pedir || perm?.configurar || perm?.cargar)
    }
    // El texto que viaja: sin espacios en los bordes y los del medio de a uno.
    // La base compara upper(btrim(p_nombre)) EXACTO y no los colapsa: así
    // "LE   CREMME" no queda como otro cono distinto de "LE CREMME".
    function textoConoNuevo(texto) {
      return String(texto ?? '').trim().replace(/\s+/g, ' ')
    }
    // Se ofrece crear con 2 letras o más y si NINGÚN cono (de todos, no solo
    // de los que muestra la lista) se llama igual, sin mirar mayúsculas,
    // acentos ni espacios. Devuelve el texto a proponer, o null.
    function conoNuevoOfrecido(texto, conos) {
      const t = textoConoNuevo(texto)
      if (t.length < 2) return null
      const q = normalizarBusqueda(t)
      const igual = (conos ?? []).some(c => normalizarBusqueda(textoConoNuevo(c.cono)) === q)
      return igual ? null : t
    }

    // Las pestañas que ve cada uno, en orden. "Por pedir" primero (es lo que más
    // se usa). Sin pedir, la lista de pliegos es solo "Pendientes de entrega".
    function vistasDe(p) {
      const v = []
      if (p.pedir) v.push({ clave: 'porpedir', texto: 'Por pedir' })
      if (p.ver || p.pedir) v.push({ clave: 'stock', texto: 'Stock' })
      if (p.pedir) v.push({ clave: 'pliegos', texto: 'Pliegos' })
      else if (p.ver) v.push({ clave: 'entregas', texto: 'Pendientes de entrega' })
      if (p.ver || p.pedir || p.produccion) v.push({ clave: 'todos', texto: 'Todos los conos' })
      if (p.precios) v.push({ clave: 'precios', texto: 'Precios del papel' })
      return v
    }

    // Para cuántos días alcanza: stock ÷ (consumo de 30 días ÷ 30). Sin
    // consumo, null (no se sabe: no es "infinito"). Con stock 0 o negativo, 0.
    function diasAlcanza(stock, consumo30) {
      const c = Number(consumo30)
      if (!Number.isFinite(c) || c <= 0) return null
      const s = Number(stock)
      if (!Number.isFinite(s) || s <= 0) return 0
      return Math.floor(s / (c / 30))
    }
    function textoAlcanza(dias) {
      if (dias === null) return 'sin consumo'
      if (dias === 0) return 'no alcanza'
      return `~${miles(dias)} ${dias === 1 ? 'día' : 'días'}`
    }

    // El stock como se muestra: con MOSTRAR_NEGATIVOS_CONOS en false, un
    // negativo se ve 0. Es solo lo que se MUESTRA: el número de la base no se
    // toca. ¿Se pinta en bordó? Solo si los negativos se muestran.
    function stockVisible(stock) {
      return !MOSTRAR_NEGATIVOS_CONOS && Number(stock) < 0 ? 0 : stock
    }
    function stockEnRojo(stock) {
      return MOSTRAR_NEGATIVOS_CONOS && Number(stock) < 0
    }

    // "Alcanza" de una fila: con un negativo escondido, "—" (sin rojo).
    function alcanzaDeFila(f) {
      if (!MOSTRAR_NEGATIVOS_CONOS && Number(f.stock) < 0) return { texto: '—', bajo: false }
      const dias = diasAlcanza(f.stock, f.consumo_30d)
      return { texto: textoAlcanza(dias), bajo: Number(f.stock) < 0 || (dias !== null && dias < DIAS_AVISO) }
    }

    // Los que hay que mirar: stock negativo, y los que alcanzan para menos de
    // DIAS_AVISO (los sin consumo no se avisan). Con los negativos escondidos
    // (MOSTRAR_NEGATIVOS_CONOS), un negativo no se avisa ni cuenta como pocos.
    function alertasStock(filas) {
      const negativos = [], pocos = []
      for (const f of filas ?? []) {
        if (Number(f.stock) < 0) { if (MOSTRAR_NEGATIVOS_CONOS) negativos.push(f); continue }
        const d = diasAlcanza(f.stock, f.consumo_30d)
        if (d !== null && d < DIAS_AVISO) pocos.push(f)
      }
      return { negativos, pocos }
    }

    // Un cono se lista en Stock si está activo o tiene algún número distinto de cero.
    function conoEnUso(f) {
      return f.activa !== false || [f.stock, f.en_camino, f.en_armado, f.consumo_30d].some(x => Number(x) !== 0)
    }

    function normalizarBusqueda(t) {
      return String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim()
    }

    // Por pedir agrupado por papel (el orden de ORDEN_PAPELES), con el total.
    function agruparPorPapel(filas) {
      const grupos = new Map()
      for (const f of filas ?? []) {
        if (!grupos.has(f.papel)) grupos.set(f.papel, { papel: f.papel, total: 0, conos: [] })
        const g = grupos.get(f.papel)
        g.total += Number(f.cantidad) || 0
        g.conos.push(f)
      }
      const orden = p => { const i = ORDEN_PAPELES.indexOf(p); return i === -1 ? 99 : i }
      return [...grupos.values()].sort((a, b) => orden(a.papel) - orden(b.papel))
    }

    // ── Todos los conos (14/10/2026) ──────────────────────────────────────
    // Las mismas marcas que Producción → Configuración → Marcas / Conos: TODAS,
    // también las rechazadas (allá están en Todos y en Apagados con
    // "Rechazado"; acá igual) y las nuevas, con "nuevo, a revisar".
    const FILTROS_TODOS = [
      { v: 'produccion', t: 'En producción' }, { v: 'apagados', t: 'Apagados' },
      { v: 'doble', t: 'Doble bolsa' }, { v: 'ilus', t: 'Ilustración' }, { v: 'todos', t: 'Todos' },
    ]
    // Los tres interruptores, con el nombre que tienen en las dos pantallas y
    // el parámetro de configurar_cono que mueve cada uno.
    const INTERRUPTORES = [
      { campo: 'activa', param: 'p_activa', texto: 'En producción' },
      { campo: 'doble_bolsa', param: 'p_doble_bolsa', texto: 'Doble bolsa' },
      { campo: 'papel_ilustracion', param: 'p_papel_ilustracion', texto: 'Ilustración' },
    ]
    const ETIQUETA_ALTA = { pendiente_revision: 'nuevo, a revisar', rechazada: 'Rechazado' }
    const DONDE_SE_APRUEBA = 'Producción → Configuración → Marcas / Conos'

    function pasaFiltroTodos(f, filtro) {
      if (filtro === 'produccion') return f.activa === true
      if (filtro === 'apagados') return f.activa !== true
      if (filtro === 'doble') return f.doble_bolsa === true
      if (filtro === 'ilus') return f.papel_ilustracion === true
      return true
    }

    // El filtro y el buscador (sin acentos ni mayúsculas; el nombre ya viene
    // normalizado en _buscar para no rehacerlo en cada tecla con 357 conos).
    function conosDeTodos(filas, filtro, busqueda) {
      const q = normalizarBusqueda(busqueda)
      return (filas ?? []).filter(f => pasaFiltroTodos(f, filtro) && (!q || (f._buscar ?? normalizarBusqueda(f.cono)).includes(q)))
    }

    function cuentaTodos(filas) {
      return Object.fromEntries(FILTROS_TODOS.map(x => [x.v, (filas ?? []).filter(f => pasaFiltroTodos(f, x.v)).length]))
    }

    // Lo mismo que exige configurar_cono (pg_get_functiondef, 14/10/2026).
    function puedeTocar(perm, campo) {
      if (campo === 'papel_ilustracion') return !!(perm?.configurar || perm?.pedir || perm?.precios)
      return !!perm?.configurar
    }
    function porQueNoSePuede(campo) {
      return campo === 'papel_ilustracion'
        ? 'Para cambiar el papel hace falta el permiso de configurar producción, de armar pedidos de conos o de precios del papel.'
        : 'Hace falta el permiso de configurar producción.'
    }

    // SOLO el campo tocado; los otros van null (la base deja como está lo null).
    function paramsConfigurarCono(marcaId, campo, valor) {
      const i = INTERRUPTORES.find(x => x.campo === campo)
      if (!i) return null
      const p = { p_marca_id: marcaId, p_activa: null, p_doble_bolsa: null, p_papel_ilustracion: null }
      p[i.param] = !!valor
      return p
    }

    // La fila queda como la devolvió configurar_cono (si es la de ese cono).
    function aplicarRespuestaCono(f, r) {
      if (!f || !r || typeof r !== 'object' || r.marca_id !== f.marca_id) return f
      for (const k of ['activa', 'doble_bolsa', 'papel_ilustracion']) if (typeof r[k] === 'boolean') f[k] = r[k]
      if (typeof r.cono === 'string' && r.cono) { f.cono = r.cono; f._buscar = normalizarBusqueda(r.cono) }
      return f
    }

    // Toca un interruptor: lo pone, avisa (para trabarlo y pintarlo), llama a
    // la base y deja lo que devolvió. Si la base lo rechaza, VUELVE al valor
    // de antes y devuelve el error tal cual.
    async function guardarInterruptor(f, campo, valor, llamar, alCambiar = () => {}) {
      const params = paramsConfigurarCono(f.marca_id, campo, valor)
      if (!params) return { ok: false, error: 'No se puede cambiar eso.' }
      const anterior = f[campo]
      f[campo] = !!valor
      alCambiar()
      try {
        aplicarRespuestaCono(f, await llamar('configurar_cono', params))
        return { ok: true }
      } catch (e) {
        f[campo] = anterior
        return { ok: false, error: mensajeDe(e) }
      }
    }

    function textoGuardado(f, campo) {
      if (campo === 'activa') return f.activa ? `${f.cono}: en producción.` : `${f.cono}: apagado.`
      if (campo === 'doble_bolsa') return f.doble_bolsa ? `${f.cono} va con doble bolsa.` : `${f.cono} ya no va con doble bolsa.`
      return f.papel_ilustracion ? `${f.cono} va en papel Ilustración.` : `${f.cono} ya no va en papel Ilustración.`
    }

    // Un renglón. El stock, solo con conos:ver (sin ese permiso la base
    // devuelve 0, no null: no se puede decidir por el valor).
    function htmlFilaTodos(f, perm, ocupado = false, error = '') {
      const etiqueta = ETIQUETA_ALTA[f.estado_alta]
      const chip = etiqueta ? ` <span class="cn-chip cn-chip--${f.estado_alta === 'rechazada' ? 'rechazado' : 'revisar'}">${esc(etiqueta)}</span>` : ''
      const stock = perm?.ver
        ? `<span class="cn-cat-stock${stockEnRojo(f.stock) ? ' cn-negativo' : ''}"><small>Stock</small>${esc(miles(stockVisible(f.stock)))}</span>` : ''
      const sws = INTERRUPTORES.map(i => {
        const puede = puedeTocar(perm, i.campo)
        return `<label class="cn-sw${puede ? '' : ' cn-sw--sin-permiso'}"${puede ? '' : ` title="${esc(porQueNoSePuede(i.campo))}"`}>` +
          `<input type="checkbox" role="switch" class="cn-sw__input" data-configurar="${esc(f.marca_id)}" data-campo="${esc(i.campo)}"` +
          `${f[i.campo] ? ' checked' : ''}${!puede || ocupado ? ' disabled' : ''} aria-label="${esc(i.texto)}: ${esc(f.cono)}">` +
          `<span class="cn-sw__txt">${esc(i.texto)}</span></label>`
      }).join('')
      return `<div class="cn-cat-fila${f.activa ? '' : ' cn-cat-fila--apagado'}${perm?.ver ? '' : ' cn-cat-fila--sin-stock'}" data-cat-cono="${esc(f.marca_id)}">` +
        `<span class="cn-cat-nombre">${esc(f.cono)}${chip}</span>${stock}<span class="cn-cat-sws">${sws}</span>` +
        (error ? `<div class="cn-error cn-cat-error" role="alert">${esc(error)}</div>` : '') + `</div>`
    }

    // Los nuevos se aceptan donde ya se aceptan: acá solo se avisa (con el
    // enlace para quien puede aceptarlos).
    function htmlAvisoRevisar(filas, perm) {
      const n = (filas ?? []).filter(f => f.estado_alta === 'pendiente_revision').length
      if (!n) return ''
      const donde = perm?.configurar ? `<a href="produccion-gestion.html?vista=conos">${esc(DONDE_SE_APRUEBA)}</a>` : esc(DONDE_SE_APRUEBA)
      return `<div class="cn-aviso">${n === 1 ? 'Hay 1 cono nuevo, a revisar' : `Hay ${esc(miles(n))} conos nuevos, a revisar`}. Se aceptan o se rechazan en ${donde}; mientras tanto se pueden usar igual.</div>`
    }

    // El precio por cono vigente para un pliego: la MISMA regla que
    // confirmar_pliego() en la base (el del papel, con la cantidad más
    // parecida al total del pliego, vigente hasta hoy, el más nuevo).
    function precioVigente(precios, papel, cantidadTotal, hoy) {
      const cands = (precios ?? []).filter(p => p.papel === papel && String(p.vigente_desde) <= hoy)
      cands.sort((a, b) =>
        Math.abs(a.cantidad - cantidadTotal) - Math.abs(b.cantidad - cantidadTotal)
        || String(b.vigente_desde).localeCompare(String(a.vigente_desde))
        || String(b.cargado_en ?? '').localeCompare(String(a.cargado_en ?? '')))
      return cands.length ? Number(cands[0].precio_unitario) : null
    }

    // El precio de una celda de la tabla de precios (papel × cantidad exacta).
    function precioDeCelda(precios, papel, cantidad, hoy) {
      const c = (precios ?? []).filter(p => p.papel === papel && Number(p.cantidad) === cantidad)
        .sort((a, b) => String(b.vigente_desde).localeCompare(String(a.vigente_desde)) || String(b.cargado_en ?? '').localeCompare(String(a.cargado_en ?? '')))
      const vigente = c.find(p => String(p.vigente_desde) <= hoy) ?? null
      const futuro = c.filter(p => String(p.vigente_desde) > hoy).at(-1) ?? null
      return { vigente, futuro, historial: c }
    }

    // Las cuentas del pliego: cantidad × precio, IVA y total, EN CENTAVOS.
    function cuentasPliego(cantidad, precio, ivaPct = IVA_PCT) {
      const cant = Number(cantidad) || 0
      if (precio === null || precio === undefined || !Number.isFinite(Number(precio))) {
        return { cantidad: cant, subtotal: null, impuesto: null, total: null }
      }
      const sub = Math.round(cant * Number(precio) * 100)
      const imp = Math.round(sub * Number(ivaPct) / 100)
      return { cantidad: cant, subtotal: sub / 100, impuesto: imp / 100, total: (sub + imp) / 100 }
    }

    function asignadoDe(items) {
      return (items ?? []).reduce((a, i) => a + (Number(i.cantidad) || 0), 0)
    }

    // ¿Entra en el pliego? Lo mismo que poner_cono_pliego(): lo de los otros
    // conos más la cantidad nueva de este no puede pasar el total.
    function chequeoAsignar(items, total, marcaId, cantidadNueva) {
      const otros = (items ?? []).filter(i => i.marca_id !== marcaId).reduce((a, i) => a + (Number(i.cantidad) || 0), 0)
      if (!Number.isFinite(cantidadNueva) || cantidadNueva < 0) return { ok: false, error: 'La cantidad no puede ser negativa.' }
      if (otros + cantidadNueva > total) return { ok: false, error: `No entra: quedan ${miles(total - otros)} por asignar en este pliego.` }
      return { ok: true, asignado: otros + cantidadNueva, falta: total - otros - cantidadNueva }
    }

    function textoAsignado(asignado, total) {
      const falta = total - asignado
      return `Asignado ${miles(asignado)} de ${miles(total)} · ${falta > 0 ? 'faltan ' + miles(falta) : (falta === 0 ? 'completo' : 'sobran ' + miles(-falta))}`
    }

    // El número de la O.C.: el del pliego, y la versión si se modificó.
    function numeroOC(pliego) {
      return String(pliego.numero) + (Number(pliego.version) > 1 ? ` · v${pliego.version}` : '')
    }
    function nombreArchivoOC(pliego) {
      return `Pliego-${pliego.numero}${Number(pliego.version) > 1 ? '-v' + pliego.version : ''}-Musumeci.pdf`
    }

    // Los textos de conos_config vienen con " · " entre renglón y renglón.
    function renglones(texto) {
      return String(texto ?? '').split(/\s+·\s+/).map(s => s.trim()).filter(Boolean)
    }

    // Los ítems de la O.C., en orden alfabético (la base no guarda el orden de carga).
    function itemsOrdenados(items, nombreDe) {
      return [...(items ?? [])].sort((a, b) => String(nombreDe(a.marca_id)).localeCompare(String(nombreDe(b.marca_id)), 'es'))
    }

    // LA ORDEN DE COMPRA (A4), como las de Musumeci. conPrecios = false (sin
    // conos:precios) deja los precios y los totales en "-".
    function htmlOrdenCompra({ pliego, items, papel, config, nuss, nombreDe, precio, conPrecios }) {
      const cfg = config ?? {}
      const lista = itemsOrdenados(items, nombreDe)
      const cuentas = cuentasPliego(asignadoDe(lista), conPrecios ? precio : null, pliego.iva_pct ?? IVA_PCT)
      const precioTxt = conPrecios ? precio3(precio) : '-'
      const fila = (cod, desc, cant, pu, iva, tot, clase = '') =>
        `<tr${clase ? ` class="${clase}"` : ''}><td>${cod}</td><td>${desc}</td><td class="n">${cant}</td><td class="n">${pu}</td><td class="c">${iva}</td><td class="n">${tot}</td></tr>`
      const conos = lista.map(i => fila('', esc(nombreDe(i.marca_id)), esc(miles(i.cantidad)), esc(precioTxt), 'X',
        conPrecios ? esc(cuentasPliego(i.cantidad, precio).subtotal === null ? '-' : formatearNumeroAr(cuentasPliego(i.cantidad, precio).subtotal, { decimales: 2 })) : '-',
        i.logo_nuevo ? 'oc-logo' : ''))
      while (conos.length < RENGLONES_MINIMOS_OC) conos.push(fila('', '', '', '-', 'X', '-'))
      const nuevos = lista.filter(i => i.logo_nuevo).map(i => nombreDe(i.marca_id))
      const prov = renglones(cfg.oc_proveedor_texto)
      const dom = renglones(cfg.oc_domicilio)
      const nussDom = renglones(nuss?.domicilio)
      const plataOC = n => conPrecios && n !== null ? esc(formatearNumeroAr(n, { decimales: 2 })) : '-'
      return `
        <div class="oc-cab">
          <div>
            <img src="../logo-cucuruchos-nuss.png" alt="Nuss">
            ${nussDom.map(r => `<div>${esc(r)}</div>`).join('')}
            ${nuss?.telefono ? `<div>Tel: ${esc(nuss.telefono)}</div>` : ''}
          </div>
          <div>
            <div class="oc-titulo">ORDEN DE COMPRA</div>
            <div class="oc-num"><span>FECHA</span><span>${esc(fechaCorta(pliego.fecha_pedido))}</span><span>O.C. Nº</span><span>${esc(numeroOC(pliego))}</span></div>
          </div>
        </div>
        <div class="oc-dos">
          <div>
            <div class="oc-barra-verde">PROVEEDOR</div>
            ${prov.map(r => `<p>${esc(r)}</p>`).join('') || '<p>—</p>'}
          </div>
          <div>
            <div class="oc-barra-verde">RAZÓN SOCIAL</div>
            <p>${esc(cfg.oc_razon_social ?? '—')}</p>
            <p>C.U.I.T: ${esc(cfg.oc_cuit ?? '—')}</p>
            ${dom.map(r => `<p>${esc(r)}</p>`).join('')}
            ${cfg.oc_telefono ? `<p>Teléfono: ${esc(cfg.oc_telefono)}</p>` : ''}
          </div>
        </div>
        <div class="oc-tres">
          <div><div class="oc-barra-verde">SOLICITANTE</div><div class="oc-valor">${esc(cfg.oc_solicitante ?? '')}</div></div>
          <div><div class="oc-barra-verde">ENVIAR VÍA</div><div class="oc-valor">${esc(cfg.oc_envio ?? '')}</div></div>
          <div><div class="oc-barra-verde">CONDICIONES DE ENVÍO</div><div class="oc-valor"></div></div>
        </div>
        <table class="oc-tabla">
          <thead><tr><th style="width:24mm">CÓDIGO</th><th>DESCRIPCIÓN</th><th style="width:20mm">CANT.</th><th style="width:24mm">PRECIO UNIT.</th><th style="width:9mm">IVA</th><th style="width:26mm">TOTAL</th></tr></thead>
          <tbody>
            ${fila('0', esc(papel?.descripcion_oc ?? nombrePapel(pliego.papel)), '-', '-', '', '-')}
            ${fila('', '', '', '-', 'X', '-')}
            ${conos.join('')}
            ${fila('0', '', esc(miles(cuentas.cantidad)), '', '', '', 'oc-final')}
          </tbody>
        </table>
        <div class="oc-pie">
          <div class="oc-coment">
            <div class="oc-coment__cab">Comentarios o instrucciones especiales</div>
            <p><b>FECHA DE ENTREGA</b>: ${esc(fechaCorta(pliego.fecha_entrega_estimada))}</p>
            <p>Se adjunta Logos Nuevos:${nuevos.length ? '' : ' —'}</p>
            ${nuevos.length ? `<p class="oc-rojo">${esc(nuevos.join(', '))}</p>` : ''}
            ${renglones(pliego.comentarios).map(r => `<p><b>${esc(r)}</b></p>`).join('')}
          </div>
          <table class="oc-totales">
            <tr><td>SUBTOTAL</td><td class="n">${plataOC(cuentas.subtotal)}</td></tr>
            <tr><td>IMPONIBLE</td><td class="n">${plataOC(cuentas.subtotal)}</td></tr>
            <tr><td>% DE IMPUESTO</td><td class="n">${esc(formatearNumeroAr(Number(pliego.iva_pct ?? IVA_PCT), { decimales: 3 }))}%</td></tr>
            <tr><td>IMPUESTO</td><td class="n">${plataOC(cuentas.impuesto)}</td></tr>
            <tr><td>ENVÍO</td><td class="n">-</td></tr>
            <tr><td>OTROS</td><td class="n">-</td></tr>
            <tr class="oc-total"><td>TOTAL</td><td class="n">${conPrecios && cuentas.total !== null ? '$' + esc(formatearNumeroAr(cuentas.total, { decimales: 2 })) : '-'}</td></tr>
          </table>
        </div>`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion: null,
      yo: null,
      perm: { ver: false, pedir: false, precios: false, recibir: false, configurar: false, produccion: false },
      vistas: [],
      vista: null,
      conos: [],
      conoPorId: new Map(),
      papeles: new Map(),
      config: {},
      nuss: null,
      pliegos: [],
      items: [],
      pendientes: [],
      precios: [],
      nombres: new Map(),
      pliegoId: null,
      volverA: null,
      filtroEstado: '',
      filtroPapel: '',
      buscarPliego: '',
      buscarStock: '',
      stockTodos: false,
      anotar: { marcaId: null, sugerido: false },
      agregar: { abierto: false, marcaId: null, buscar: '' },
      enviando: false,
      proponiendo: false,
      // Todos los conos
      catalogo: [],
      catalogoPorId: new Map(),
      errorCatalogo: null,
      filtroTodos: 'todos',
      buscarTodos: '',
      listaTodos: null,
      conosOcupados: new Set(),
      errorTodos: null,
    }

    function nombreCono(id) {
      return estado.conoPorId.get(id)?.cono ?? estado.nombres.get(id) ?? 'Cono'
    }
    function pliegoPorId(id) {
      return estado.pliegos.find(p => p.id === id) ?? null
    }
    function itemsDe(pliegoId) {
      return estado.items.filter(i => i.pliego_id === pliegoId)
    }

    // Los mensajes de la base van TAL CUAL (ya vienen escritos para una persona).
    function mensajeDe(err) {
      return String(err?.message || err || 'No se pudo hacer. Revisá la conexión y probá de nuevo.')
    }

    async function rpc(nombre, params) {
      const { data, error } = await supabase.rpc(nombre, params)
      if (error) throw error
      return data
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CARGA
    // ═══════════════════════════════════════════════════════════════════════

    async function cargarPermisos() {
      const { data: emp, error } = await supabase.from('empleados').select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
      if (error || !emp) throw error ?? new Error('sin empleado')
      estado.yo = emp
      const { data: tareas, error: e2 } = await supabase.from('empleado_tareas').select('modulo, tarea')
        .eq('empleado_id', emp.id).in('modulo', ['conos', 'produccion']).eq('habilitado', true)
      if (e2) throw e2
      const de = m => (tareas ?? []).filter(t => t.modulo === m).map(t => t.tarea)
      estado.perm = permisosDe(de('conos'), emp.rol_app === 'super_admin', de('produccion'))
    }

    async function cargarStock() {
      // conos_stock() pide conos:ver o conos:pedir (quien entra solo por
      // producción ve únicamente "Todos los conos").
      if (!estado.perm.ver && !estado.perm.pedir) { estado.conos = []; estado.conoPorId = new Map(); return }
      const filas = await rpc('conos_stock')
      estado.conos = (filas ?? []).map(f => ({ ...f }))
      estado.conoPorId = new Map(estado.conos.map(f => [f.marca_id, f]))
    }

    async function cargarPliegos() {
      const [pl, it] = await Promise.all([
        supabase.from('cono_pliegos').select('*').order('numero', { ascending: false }),
        supabase.from('cono_pliego_items').select('id, pliego_id, marca_id, cantidad, recibido, logo_nuevo'),
      ])
      if (pl.error) throw pl.error
      if (it.error) throw it.error
      estado.pliegos = pl.data ?? []
      estado.items = it.data ?? []
    }

    async function cargarPendientes() {
      if (!estado.perm.pedir) { estado.pendientes = []; return }
      estado.pendientes = (await rpc('conos_por_pedir')) ?? []
    }

    async function cargarPrecios() {
      if (!estado.perm.precios) { estado.precios = []; return }
      const { data, error } = await supabase.from('cono_papel_precios').select('*')
      if (error) throw error
      estado.precios = data ?? []
    }

    async function cargarConfig() {
      const [pa, cf, un] = await Promise.all([
        supabase.from('cono_papeles').select('papel, nombre, descripcion_oc, gramaje'),
        supabase.from('conos_config').select('clave, valor'),
        supabase.from('unidades_negocio').select('id, nombre, domicilio, telefono').ilike('nombre', '%nuss%'),
      ])
      estado.papeles = new Map((pa.data ?? []).map(p => [p.papel, p]))
      estado.config = Object.fromEntries((cf.data ?? []).map(c => [c.clave, c.valor]))
      estado.nuss = (un.data ?? [])[0] ?? null
    }

    // Todos los conos: conos_catalogo() (activos primero, por nombre). El
    // nombre normalizado se guarda una vez para que el buscador no lo rehaga.
    async function cargarCatalogo() {
      if (!estado.vistas.some(v => v.clave === 'todos')) return
      try {
        const filas = (await rpc('conos_catalogo')) ?? []
        estado.catalogo = filas.map(f => ({ ...f, _buscar: normalizarBusqueda(f.cono) }))
        estado.errorCatalogo = null
      } catch (err) {
        estado.errorCatalogo = mensajeDe(err)
        throw err
      } finally {
        estado.catalogoPorId = new Map(estado.catalogo.map(f => [f.marca_id, f]))
        estado.listaTodos = null
      }
    }

    async function recargar() {
      const tareas = [cargarStock(), cargarPendientes(), cargarPrecios(), cargarCatalogo()]
      if (estado.perm.ver || estado.perm.pedir) tareas.push(cargarPliegos())
      const r = await Promise.allSettled(tareas)
      const fallo = r.find(x => x.status === 'rejected')
      if (fallo) mostrarError('No se pudo leer todo: ' + mensajeDe(fallo.reason))
    }

    // ═══════════════════════════════════════════════════════════════════════
    // NAVEGACIÓN
    // ═══════════════════════════════════════════════════════════════════════

    const SECCIONES = ['porpedir', 'stock', 'todos', 'pliegos', 'armado', 'detalle', 'oc', 'precios']

    function pintarTabs() {
      const nav = document.getElementById('cn-tabs')
      nav.innerHTML = estado.vistas.map(v =>
        `<button type="button" class="cn-tab" data-vista="${esc(v.clave)}" aria-pressed="${pestanaActiva() === v.clave}">${esc(v.texto)}</button>`).join('')
      nav.hidden = estado.vistas.length < 2
    }
    function pestanaActiva() {
      if (['armado', 'detalle', 'oc'].includes(estado.vista)) return estado.perm.pedir ? 'pliegos' : 'entregas'
      return estado.vista
    }

    function mostrar(vista) {
      estado.vista = vista
      const seccion = vista === 'entregas' ? 'pliegos' : vista
      for (const s of SECCIONES) document.getElementById('cn-vista-' + s).hidden = s !== seccion
      pintarTabs()
      if (vista === 'porpedir') pintarPorPedir()
      if (vista === 'stock') pintarStock()
      if (vista === 'todos') pintarTodos()
      if (vista === 'pliegos' || vista === 'entregas') pintarPliegos()
      if (vista === 'armado') pintarArmado()
      if (vista === 'detalle') pintarDetalle()
      if (vista === 'oc') pintarOC()
      if (vista === 'precios') pintarPrecios()
      if (window.lucide) window.lucide.createIcons()
    }

    function abrirPliego(id) {
      estado.pliegoId = id
      const p = pliegoPorId(id)
      mostrar(p && p.estado === 'armando' && estado.perm.pedir ? 'armado' : 'detalle')
      window.scrollTo(0, 0)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // POR PEDIR
    // ═══════════════════════════════════════════════════════════════════════

    function opcionesPapel(elegido) {
      return ORDEN_PAPELES.map(p => `<option value="${esc(p)}"${p === elegido ? ' selected' : ''}>${esc(nombrePapel(p))}</option>`).join('')
    }

    function buscarConos(texto, tope = 8) {
      const q = normalizarBusqueda(texto)
      if (!q) return []
      return estado.conos
        .filter(c => normalizarBusqueda(c.cono).includes(q))
        .sort((a, b) => (b.activa === true) - (a.activa === true) || String(a.cono).localeCompare(String(b.cono), 'es'))
        .slice(0, tope)
    }

    // La lista del buscador y, al final, "+ Cono nuevo" con el formulario al
    // que vuelve el cono creado ('anotar' o 'agregar').
    function htmlResultados(lista, atributo, textoNuevo, destino) {
      const filas = lista.map(c => `<button type="button" class="cn-resultado" ${atributo}="${esc(c.marca_id)}">${esc(c.cono)}${c.papel_ilustracion ? ' <span class="cn-chip cn-chip--ilus">Ilustración</span>' : ''}</button>`)
      if (textoNuevo) filas.push(`<button type="button" class="cn-resultado" data-cono-nuevo="${esc(textoNuevo)}" data-cono-destino="${esc(destino)}">+ Cono nuevo: «${esc(textoNuevo.toUpperCase())}»</button>`)
      return filas.join('')
    }

    function ofrecerConoNuevo(texto) {
      return puedeProponer(estado.perm) ? conoNuevoOfrecido(texto, estado.conos) : null
    }

    function pintarAnotar() {
      const a = estado.anotar
      const elegido = document.getElementById('cn-anotar-elegido')
      const buscar = document.getElementById('cn-anotar-buscar')
      if (a.marcaId) {
        elegido.innerHTML = `<span class="cn-elegido">${esc(nombreCono(a.marcaId))} <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-anotar-cambiar>Cambiar</button></span>`
        elegido.hidden = false
        buscar.hidden = true
        document.getElementById('cn-anotar-resultados').innerHTML = ''
      } else {
        elegido.innerHTML = ''
        elegido.hidden = true
        buscar.hidden = false
      }
      document.getElementById('cn-anotar-sugerido').hidden = !a.sugerido
    }

    function pintarPorPedir() {
      const sumar = document.getElementById('cn-anotar-sumar')
      if (!sumar.dataset.listo) {
        sumar.innerHTML = BOTONES_ANOTAR.map(b => `<button type="button" class="cn-btn cn-btn--suave" data-sumar-anotar="${b.n}" title="Suma ${esc(miles(b.n))}">${esc(b.texto)}</button>`).join('')
          + '<button type="button" class="cn-btn cn-btn--suave" data-sumar-anotar="0">Borrar</button>'
        sumar.dataset.listo = '1'
        document.getElementById('cn-anotar-papel').innerHTML = opcionesPapel('obra')
      }
      pintarAnotar()
      pintarPendientes()
    }

    function anotadosDe(c) {
      return Array.isArray(c?.anotados) ? c.anotados : []
    }

    function pintarPendientes() {
      const cont = document.getElementById('cn-pendientes')
      const grupos = agruparPorPapel(estado.pendientes)
      if (!grupos.length) {
        cont.innerHTML = '<div class="cn-tarjeta cn-vacio">No hay nada anotado para pedir.</div>'
        return
      }
      cont.innerHTML = grupos.map(g => `
        <div class="cn-tarjeta" data-grupo-papel="${esc(g.papel)}">
          <div class="cn-grupo__cab">
            <div class="cn-grupo__total">${esc(nombrePapel(g.papel))}: ${esc(miles(g.total))} anotados</div>
            <button type="button" class="cn-btn" data-iniciar="${esc(g.papel)}">Iniciar pedido con esto</button>
          </div>
          ${g.conos.map(c => `
            <div class="cn-pend">
              <div class="cn-pend__nombre">${esc(c.cono)} · ${esc(miles(c.cantidad))}</div>
              ${anotadosDe(c).map(an => `
                <div class="cn-pend__anotado">
                  <span>${esc(miles(an.cantidad))}${an.nota ? ' · ' + esc(an.nota) : ''} · ${esc(fechaCorta(String(an.creado_en ?? '').slice(0, 10)))}</span>
                  <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-editar-pend="${esc(an.id)}" data-pend-marca="${esc(c.marca_id)}">Editar</button>
                  <button type="button" class="cn-btn cn-btn--peligro cn-btn--chico" data-borrar-pend="${esc(an.id)}">Borrar</button>
                </div>`).join('')}
            </div>`).join('')}
        </div>`).join('')
    }

    async function elegirConoAnotar(id) {
      estado.anotar.marcaId = id
      estado.anotar.sugerido = false
      document.getElementById('cn-anotar-buscar').value = ''
      pintarAnotar()
      try {
        const papel = await rpc('cono_papel_sugerido', { p_marca_id: id })
        if (estado.anotar.marcaId !== id) return
        if (papel && NOMBRE_PAPEL[papel]) {
          document.getElementById('cn-anotar-papel').value = papel
          estado.anotar.sugerido = true
          pintarAnotar()
        }
      } catch (err) { console.error('cono_papel_sugerido', err) }
    }

    async function anotar() {
      const err = document.getElementById('cn-anotar-error')
      const cant = leerCampoNumero(document.getElementById('cn-anotar-cantidad'))
      const faltas = []
      if (!estado.anotar.marcaId) faltas.push('Elegí el cono.')
      if (!(cant > 0)) faltas.push('Poné la cantidad.')
      if (faltas.length) { err.textContent = faltas.join(' '); err.hidden = false; return }
      if (estado.enviando) return
      estado.enviando = true
      const btn = document.getElementById('cn-btn-anotar')
      btn.disabled = true
      try {
        await rpc('anotar_cono_pendiente', {
          p_marca_id: estado.anotar.marcaId, p_cantidad: cant,
          p_papel: document.getElementById('cn-anotar-papel').value,
          p_nota: document.getElementById('cn-anotar-nota').value.trim() || null,
        })
        mostrarExito(`Anotado: ${nombreCono(estado.anotar.marcaId)} · ${miles(cant)}`)
        estado.anotar = { marcaId: null, sugerido: false }
        ponerNumero(document.getElementById('cn-anotar-cantidad'), null)
        document.getElementById('cn-anotar-nota').value = ''
        err.hidden = true
        await cargarPendientes()
        pintarPorPedir()
      } catch (e) {
        err.textContent = mensajeDe(e); err.hidden = false
      } finally {
        estado.enviando = false
        btn.disabled = false
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // STOCK
    // ═══════════════════════════════════════════════════════════════════════

    function pintarStock() {
      const q = normalizarBusqueda(estado.buscarStock)
      const filas = estado.conos
        .filter(f => estado.stockTodos || conoEnUso(f))
        .filter(f => !q || normalizarBusqueda(f.cono).includes(q))
      const { negativos, pocos } = alertasStock(estado.conos.filter(conoEnUso))
      const alertas = []
      if (negativos.length) alertas.push(`<div class="cn-aviso cn-aviso--grave">Stock negativo: ${negativos.map(f => esc(f.cono) + ' (' + esc(miles(f.stock)) + ')').join(', ')}</div>`)
      if (pocos.length) alertas.push(`<div class="cn-aviso cn-aviso--grave">Alcanzan para menos de ${DIAS_AVISO} días: ${pocos.map(f => esc(f.cono) + ' (' + esc(textoAlcanza(diasAlcanza(f.stock, f.consumo_30d))) + ')').join(', ')}</div>`)
      document.getElementById('cn-stock-alertas').innerHTML = alertas.join('')
      const cont = document.getElementById('cn-stock-lista')
      if (!filas.length) { cont.innerHTML = '<div class="cn-vacio">No hay conos para mostrar.</div>'; return }
      const cab = `<div class="cn-stock-fila cn-stock-fila--cab"><span>Cono</span><span class="cn-num">Stock</span><span class="cn-num">En camino</span><span class="cn-num">En armado</span><span class="cn-num">Consumo 30 días</span><span class="cn-num">Alcanza</span></div>`
      cont.innerHTML = cab + filas.map(f => {
        const alcanza = alcanzaDeFila(f)
        return `<div class="cn-stock-fila" data-stock-cono="${esc(f.marca_id)}">
          <span class="cn-stock-nombre">${esc(f.cono)}${f.papel_ilustracion ? ' <span class="cn-chip cn-chip--ilus">Ilustración</span>' : ''}${f.activa === false ? ' <span class="cn-chip">Apagado</span>' : ''}</span>
          <span class="cn-num${stockEnRojo(f.stock) ? ' cn-negativo' : ''}"><small>Stock</small>${esc(miles(stockVisible(f.stock)))}</span>
          <span class="cn-num"><small>En camino</small>${esc(miles(f.en_camino))}</span>
          <span class="cn-num"><small>En armado</small>${esc(miles(f.en_armado))}</span>
          <span class="cn-num"><small>Consumo 30 días</small>${esc(miles(f.consumo_30d))}</span>
          <span class="cn-num${alcanza.bajo ? ' cn-negativo' : ''}"><small>Alcanza</small>${esc(alcanza.texto)}</span>
          ${estado.perm.pedir ? `<span class="cn-stock-acciones">
            <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-conteo="${esc(f.marca_id)}">Conteo</button>
            <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-ajuste="${esc(f.marca_id)}">Ajuste</button>
          </span>` : ''}
        </div>`
      }).join('')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TODOS LOS CONOS
    // ═══════════════════════════════════════════════════════════════════════

    // La lista se arma al entrar, al filtrar o al buscar, y NO al tocar un
    // interruptor: apagar un cono con el filtro "En producción" no lo hace
    // desaparecer bajo el dedo (igual que en Producción → Configuración).
    function listaTodos() {
      if (!estado.listaTodos) estado.listaTodos = conosDeTodos(estado.catalogo, estado.filtroTodos, estado.buscarTodos).map(f => f.marca_id)
      return estado.listaTodos.map(id => estado.catalogoPorId.get(id)).filter(Boolean)
    }

    function htmlFilaDe(f) {
      const error = estado.errorTodos?.id === f.marca_id ? estado.errorTodos.texto : ''
      return htmlFilaTodos(f, estado.perm, estado.conosOcupados.has(f.marca_id), error)
    }

    function pintarFiltrosTodos() {
      const n = cuentaTodos(estado.catalogo)
      document.getElementById('cn-todos-filtros').innerHTML = FILTROS_TODOS.map(x =>
        `<button type="button" data-filtro-todos="${esc(x.v)}" aria-pressed="${x.v === estado.filtroTodos}">${esc(x.t)}<span class="cn-seg-n">${esc(miles(n[x.v]))}</span></button>`).join('')
    }

    function pintarListaTodos() {
      const lista = listaTodos()
      const q = estado.buscarTodos.trim()
      document.getElementById('cn-todos-cuenta').textContent =
        `${miles(lista.length)} ${lista.length === 1 ? 'cono' : 'conos'}${q ? ` con «${q}»` : ''}`
      document.getElementById('cn-todos-lista').innerHTML = lista.length ? lista.map(htmlFilaDe).join('')
        : `<div class="cn-vacio">${q ? 'Ningún cono coincide con la búsqueda.' : 'No hay conos acá.'}</div>`
    }

    function pintarTodos() {
      const aviso = estado.errorCatalogo
        ? `<div class="cn-aviso cn-aviso--grave">No se pudo leer la lista de conos: ${esc(estado.errorCatalogo)}</div>`
        : htmlAvisoRevisar(estado.catalogo, estado.perm)
      document.getElementById('cn-todos-aviso').innerHTML = aviso
      const buscar = document.getElementById('cn-todos-buscar')
      if (buscar.value !== estado.buscarTodos) buscar.value = estado.buscarTodos
      pintarFiltrosTodos()
      pintarListaTodos()
    }

    // Repinta un solo renglón (con 357 no se rearma la lista entera) y le
    // devuelve el foco al interruptor que lo tenía (o al recién tocado, que
    // lo perdió al quedar trabado mientras se guardaba).
    function pintarFilaTodos(id, campoTocado = null) {
      const f = estado.catalogoPorId.get(id)
      const el = [...document.querySelectorAll('[data-cat-cono]')].find(x => x.dataset.catCono === id)
      if (!f || !el) return
      const activo = document.activeElement
      const foco = activo?.closest?.('[data-cat-cono]') === el ? activo.dataset.campo
        : (!activo || activo === document.body ? campoTocado : null)
      el.outerHTML = htmlFilaDe(f)
      if (foco) {
        const nuevo = [...document.querySelectorAll('[data-configurar]')].find(x => x.dataset.configurar === id && x.dataset.campo === foco)
        if (nuevo && !nuevo.disabled) nuevo.focus({ preventScroll: true })
      }
    }

    // Buscar en cada tecla, sin trabarse: se pinta una vez por cuadro.
    let cuadroTodos = 0
    function buscarEnTodos(texto) {
      estado.buscarTodos = texto
      estado.listaTodos = null
      if (cuadroTodos) return
      cuadroTodos = requestAnimationFrame(() => { cuadroTodos = 0; pintarListaTodos() })
    }

    function elegirFiltroTodos(filtro) {
      if (!FILTROS_TODOS.some(x => x.v === filtro)) return
      estado.filtroTodos = filtro
      estado.listaTodos = null
      estado.errorTodos = null
      pintarFiltrosTodos()
      pintarListaTodos()
    }

    async function tocarInterruptor(marcaId, campo, valor) {
      const f = estado.catalogoPorId.get(marcaId)
      if (!f || estado.conosOcupados.has(marcaId) || !puedeTocar(estado.perm, campo)) { pintarFilaTodos(marcaId); return }
      estado.conosOcupados.add(marcaId)
      if (estado.errorTodos?.id === marcaId) estado.errorTodos = null
      const r = await guardarInterruptor(f, campo, valor, rpc, () => pintarFilaTodos(marcaId))
      estado.conosOcupados.delete(marcaId)
      if (r.ok) mostrarExito(textoGuardado(f, campo))
      else estado.errorTodos = { id: marcaId, texto: r.error }
      pintarFilaTodos(marcaId, campo)
      pintarFiltrosTodos()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PLIEGOS
    // ═══════════════════════════════════════════════════════════════════════

    function precioDePliego(p) {
      if (p.precio_unitario !== null && p.precio_unitario !== undefined) return Number(p.precio_unitario)
      return precioVigente(estado.precios, p.papel, p.cantidad_total, hoyAr())
    }

    function pasaFiltroEstado(p, filtro) {
      if (!filtro) return true
      if (filtro === 'en_camino') return p.estado === 'pedido' || p.estado === 'recibido_parcial'
      return p.estado === filtro
    }

    function pliegosVisibles() {
      if (estado.vista === 'entregas') return estado.pliegos.filter(p => p.estado === 'pedido' || p.estado === 'recibido_parcial')
      const q = normalizarBusqueda(estado.buscarPliego)
      return estado.pliegos
        .filter(p => pasaFiltroEstado(p, estado.filtroEstado))
        .filter(p => !estado.filtroPapel || p.papel === estado.filtroPapel)
        .filter(p => !q || String(p.numero).includes(q)
          || itemsDe(p.id).some(i => normalizarBusqueda(nombreCono(i.marca_id)).includes(q)))
    }

    function htmlChipEstado(e) {
      return `<span class="cn-chip cn-chip--${esc(e)}">${esc(ETIQUETA_ESTADO[e] ?? e)}</span>`
    }

    function pintarPliegos() {
      const entregas = estado.vista === 'entregas'
      document.getElementById('cn-pliegos-filtros').hidden = entregas
      if (!entregas) {
        document.getElementById('cn-pliegos-estados').innerHTML = FILTROS_ESTADO.map(f =>
          `<button type="button" data-filtro-estado="${esc(f.v)}" aria-pressed="${estado.filtroEstado === f.v}">${esc(f.t)}</button>`).join('')
        const sel = document.getElementById('cn-pliegos-papel')
        sel.innerHTML = `<option value="">Todos los papeles</option>` + opcionesPapel(estado.filtroPapel)
      }
      const lista = pliegosVisibles()
      const cont = document.getElementById('cn-pliegos-lista')
      if (!lista.length) {
        cont.innerHTML = `<div class="cn-tarjeta cn-vacio">${entregas ? 'No hay pliegos pendientes de entrega.' : 'No hay pliegos con esos filtros.'}</div>`
        return
      }
      const q = normalizarBusqueda(estado.buscarPliego)
      cont.innerHTML = lista.map(p => {
        const its = itemsDe(p.id)
        const asignado = asignadoDe(its)
        const coincide = !entregas && q ? its.filter(i => normalizarBusqueda(nombreCono(i.marca_id)).includes(q)) : []
        const totalIva = estado.perm.precios ? cuentasPliego(asignado, precioDePliego(p), p.iva_pct).total : null
        if (entregas) {
          const pendiente = its.reduce((a, i) => a + Math.max(0, i.cantidad - i.recibido), 0)
          return `<div class="cn-pliego-entrega">
            <div>
              <div class="cn-pliego__num">N° ${esc(numeroOC(p))} · ${esc(nombrePapel(p.papel))}</div>
              <div class="cn-pliego__datos">Entrega estimada ${esc(fechaCorta(p.fecha_entrega_estimada))} · faltan recibir ${esc(miles(pendiente))} de ${esc(miles(asignado))} · ${htmlChipEstado(p.estado)}</div>
            </div>
            <button type="button" class="cn-btn cn-btn--suave" data-pliego="${esc(p.id)}">Ver</button>
            ${estado.perm.recibir || estado.perm.pedir ? `<button type="button" class="cn-btn" data-recibir="${esc(p.id)}">Recibir</button>` : ''}
          </div>`
        }
        return `<button type="button" class="cn-pliego" data-pliego="${esc(p.id)}">
          <span class="cn-pliego__num">N° ${esc(numeroOC(p))}</span>
          <span class="cn-pliego__datos">${esc(fechaCorta(p.fecha_pedido))} · ${esc(nombrePapel(p.papel))} · ${esc(miles(p.cantidad_total))} · ${htmlChipEstado(p.estado)}<br>
            Entrega estimada ${esc(fechaCorta(p.fecha_entrega_estimada))}${coincide.length ? ' · ' + coincide.map(i => esc(nombreCono(i.marca_id)) + ' ' + esc(miles(i.cantidad))).join(', ') : ''}</span>
          <span class="cn-pliego__plata">${estado.perm.precios ? esc(plata(totalIva)) + '<br><small>con IVA</small>' : ''}</span>
        </button>`
      }).join('')
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PLIEGO EN ARMADO
    // ═══════════════════════════════════════════════════════════════════════

    function pintarArmado() {
      const p = pliegoPorId(estado.pliegoId)
      const cont = document.getElementById('cn-armado')
      if (!p) { cont.innerHTML = '<div class="cn-vacio">No se encontró el pliego.</div>'; return }
      const its = itemsOrdenados(itemsDe(p.id), nombreCono)
      const asignado = asignadoDe(its)
      const falta = p.cantidad_total - asignado
      const total = Number(p.cantidad_total)
      const otraCant = !TAMANOS_PLIEGO.includes(total)
      cont.innerHTML = `
        <div class="cn-tarjeta">
          <h2>Pliego N° ${esc(numeroOC(p))} · ${htmlChipEstado(p.estado)}</h2>
          <div class="cn-fila">
            <div class="cn-campo" style="flex: 1 1 10rem;"><label for="cn-arm-papel">Papel</label><select id="cn-arm-papel">${opcionesPapel(p.papel)}</select></div>
            <div class="cn-campo" style="flex: 1 1 10rem;"><label for="cn-arm-total">Total del pliego</label>
              <select id="cn-arm-total">${TAMANOS_PLIEGO.map(t => `<option value="${t}"${t === total ? ' selected' : ''}>${esc(miles(t))}</option>`).join('')}<option value="otra"${otraCant ? ' selected' : ''}>Otra</option></select>
              <input type="text" id="cn-arm-total-otra" inputmode="numeric" aria-label="Otra cantidad"${otraCant ? '' : ' hidden'}>
            </div>
            <div class="cn-campo" style="flex: 1 1 10rem;"><label for="cn-arm-fecha">Entrega estimada</label><input type="date" id="cn-arm-fecha" value="${esc(p.fecha_entrega_estimada ?? '')}"></div>
          </div>
          <button type="button" class="cn-btn cn-btn--suave" id="cn-arm-guardar">Guardar papel, total y fecha</button>
          <div class="cn-campo" style="margin-top: 0.75rem;"><label for="cn-arm-coment">Comentarios (van en la orden de compra)</label><textarea id="cn-arm-coment" maxlength="500">${esc(p.comentarios ?? '')}</textarea></div>
          <button type="button" class="cn-btn cn-btn--suave" id="cn-arm-guardar-coment">Guardar comentarios</button>
          <div class="cn-error" id="cn-arm-error" hidden></div>
        </div>
        <div class="cn-asignado ${falta > 0 ? 'cn-asignado--falta' : 'cn-asignado--completo'}" id="cn-asignado">${esc(textoAsignado(asignado, total))}</div>
        <div class="cn-tarjeta">
          <div class="cn-fila" style="justify-content: space-between;">
            <h3>Conos del pliego</h3>
            <button type="button" class="cn-btn cn-btn--suave" id="cn-arm-agregar-abrir">+ Agregar cono</button>
          </div>
          <div id="cn-arm-agregar" hidden></div>
          ${its.length ? its.map(i => `
            <div class="cn-item${i.logo_nuevo ? ' cn-item--logo' : ''}" data-item-marca="${esc(i.marca_id)}">
              <span class="cn-item__nombre">${esc(nombreCono(i.marca_id))}${i.logo_nuevo ? ' <span class="cn-chip cn-chip--logo">LOGO NUEVO</span>' : ''}</span>
              <span class="cn-item__cant">${esc(miles(i.cantidad))}</span>
              <label class="cn-tilde"><input type="checkbox" data-logo-nuevo="${esc(i.marca_id)}"${i.logo_nuevo ? ' checked' : ''}> Logo nuevo</label>
              <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-editar-item="${esc(i.marca_id)}">Editar</button>
              <button type="button" class="cn-btn cn-btn--peligro cn-btn--chico" data-quitar-item="${esc(i.marca_id)}">Quitar</button>
            </div>`).join('') : '<div class="cn-vacio">Todavía no tiene conos.</div>'}
        </div>
        <div class="cn-fila">
          <button type="button" class="cn-btn" id="cn-arm-confirmar">Confirmar pedido</button>
          <button type="button" class="cn-btn cn-btn--suave" data-ver-oc="${esc(p.id)}">Ver la orden de compra</button>
          <button type="button" class="cn-btn cn-btn--peligro" data-anular="${esc(p.id)}">Anular</button>
        </div>`
      const otra = document.getElementById('cn-arm-total-otra')
      enlazarCampoNumero(otra, { decimales: 0 })
      if (otraCant) ponerNumero(otra, total)
      pintarAgregar()
    }

    function pintarAgregar() {
      const cont = document.getElementById('cn-arm-agregar')
      if (!cont) return
      const a = estado.agregar
      cont.hidden = !a.abierto
      if (!a.abierto) { cont.innerHTML = ''; return }
      cont.innerHTML = `
        <div class="cn-tarjeta" style="background: var(--color-superficie);">
          <div class="cn-campo">
            <label for="cn-agr-buscar">Cono</label>
            ${a.marcaId ? `<span class="cn-elegido">${esc(nombreCono(a.marcaId))} <button type="button" class="cn-btn cn-btn--suave cn-btn--chico" data-agregar-cambiar>Cambiar</button></span>`
              : `<input type="text" id="cn-agr-buscar" placeholder="Buscar el cono…" autocomplete="off" value="${esc(a.buscar)}"><div class="cn-resultados" id="cn-agr-resultados"></div>`}
          </div>
          <div class="cn-campo">
            <span class="cn-rotulo">Cantidad (los botones suman)</span>
            <div class="cn-fila">
              <input type="text" id="cn-agr-cantidad" inputmode="numeric" placeholder="0" style="max-width: 11rem;" aria-label="Cantidad a agregar">

    function pintarResultadosAgregar() {
      const res = document.getElementById('cn-agr-resultados')
      if (!res) return
      const texto = estado.agregar.buscar.trim()
      const lista = buscarConos(texto)
      res.innerHTML = htmlResultados(lista, 'data-agregar-cono', ofrecerConoNuevo(texto), 'agregar')
