<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cheques — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <!-- LA CARTERA DE CHEQUES SE MUDÓ A ADMINISTRACIÓN (26/09/2026): vive en
       modulos/administracion.html, sección "Cheques". Esta página queda para
       que no se rompa ningún link ni favorito: redirige a esa sección y
       conserva el cheque pedido (?cheque=<uuid>, el link "Ver en Cheques" de
       Cobranzas). El volver= que Cobranzas recibe también apunta acá. -->
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search)
      var destino = new URLSearchParams()
      destino.set('seccion', 'cheques')
      var cheque = q.get('cheque')
      // Solo un uuid: nada que venga en la dirección se pasa sin mirar.
      if (cheque && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(cheque)) destino.set('cheque', cheque)
      window.location.replace('administracion.html?' + destino.toString())
    })()
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=administracion.html?seccion=cheques"></noscript>
</head>
<body class="pagina-modulo">
  <p class="texto-centro" style="padding:2rem 1rem">La cartera de cheques se mudó a <a href="administracion.html?seccion=cheques">Administración</a>.</p>
</body>
</html>
