<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cheques — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">

  <!-- CARTERA DE CHEQUES (22/09/2026). Salió de Cobranzas: Cobranzas es para
       cobrar, cargar, ver y controlar/asentar; la cartera es administración de
       la plata de la empresa. Acá se ven todos los cheques, se filtran y se les
       da salida (depositado / endosado). Los cheques siguen siendo de su
       cobranza: tocar uno abre esa cobranza en cobranzas.html. -->

  <style>
    /* Cualquier regla de autor con `display` le gana al [hidden] del
       user-agent: va PRIMERO y con !important (main.css ya lo tiene global;
       se repite acá para que el módulo no dependa de eso). */
    [hidden] { display: none !important; }

    body {
      overflow-x: hidden;
      /* Receta de tarjeta del proyecto, como variables locales. */
      --borde-tarjeta:  rgba(26, 42, 82, 0.06);
      --sombra-tarjeta: 0 1px 2px rgba(26, 42, 82, 0.04);
      /* Fondo del segmentado: el naranja del módulo al 9%, desde la variable. */
      --chq-segmento-fondo: color-mix(in srgb, var(--naranja) 9%, transparent);
      --chq-texto-secundario: #55617d;
      /* Plazo para depositar YA VENCIDO: el bordó suave del sistema, más
         cargado. Sale de las variables, nunca de un hex suelto. */
      --chq-vencido-fondo: color-mix(in srgb, var(--bordo) 18%, var(--bordo-suave));
    }

    .chq-contenedor {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      min-width: 0;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .chq-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-width: 0;
      background: var(--color-fondo);
      border-radius: var(--radio-tarjeta);
      box-shadow: var(--sombra-suave);
      padding: 0.875rem 1rem;
      margin: 1rem 0;
    }
    .chq-header__volver {
      color: var(--color-texto-suave);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      min-height: 44px;
      padding-right: 0.5rem;
    }
    .chq-header__col { display: flex; flex-direction: column; min-width: 0; text-align: right; }
    .chq-header__marca {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
    }
    .chq-header__titulo { font-size: 1.0625rem; font-weight: 700; color: var(--color-texto); min-width: 0; overflow-wrap: anywhere; }
    .chq-header__punto { color: var(--naranja); font-size: 0.875rem; line-height: 1; }

    /* Link de vuelta a Cobranzas: navegación, no acción. */
    .chq-nav { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; min-width: 0; }
    .chq-nav__link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-boton);
      background: var(--color-fondo);
      color: var(--naranja-oscuro);
      font-size: 0.875rem;
      font-weight: 650;
      text-decoration: none;
    }

    /* ── Avisos ─────────────────────────────────────────────────────────── */
    /* Dos escalones, como en Cobranzas: neutro INFORMA; --grave dice que un
       dato está mal o no se puede seguir. El naranja nunca es un aviso. */
    .chq-aviso {
      border-radius: 12px;
      padding: 0.75rem 0.875rem;
      font-size: 0.78125rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
      min-width: 0;
      overflow-wrap: anywhere;
      background: var(--color-superficie);
      color: var(--chq-texto-secundario);
      border-left: 4px solid var(--color-texto-suave);
    }
    .chq-aviso--grave { background: var(--bordo-suave); border-left-color: var(--bordo); color: var(--bordo-oscuro); font-weight: 600; }

    .chq-vacio {
      text-align: center;
      color: var(--color-texto-suave);
      font-size: 0.9375rem;
      line-height: 1.6;
      padding: 2rem 1rem;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* ── Botones ─────────────────────────────────────────────────────────── */
    .chq-btn {
      min-height: 44px;
      padding: 0.6875rem 1rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-boton);
      background: var(--color-fondo);
      font-family: var(--fuente);
      font-size: 0.9375rem;
      font-weight: 650;
      color: var(--color-texto);
      cursor: pointer;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .chq-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .chq-btn--primario { background: var(--naranja); border-color: var(--naranja); color: #fff; }
    .chq-btn--alerta { border-color: var(--bordo); color: var(--bordo-oscuro); }
    .chq-btn--chico { min-height: 40px; padding: 0.5rem 0.75rem; font-size: 0.8125rem; }
    .chq-btn--grande { min-height: 64px; font-size: 1.0625rem; }
    /* El elegido. DESPUÉS de .chq-btn y de .chq-btn--grande. */
    .chq-btn--elegido { border-color: var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); }
    .chq-acciones { display: flex; flex-wrap: wrap; gap: 0.5rem; min-width: 0; margin-top: 0.75rem; }

    /* ── Cartera ─────────────────────────────────────────────────────────── */
    .chq-cartera {
      background: var(--color-fondo);
      border-radius: var(--radio-tarjeta);
      box-shadow: var(--sombra-tarjeta);
      border: 1px solid var(--borde-tarjeta);
      padding: 0.875rem 1rem;
      margin-bottom: 0.75rem;
      min-width: 0;
    }
    .chq-cartera__k { font-size: 0.75rem; font-weight: 700; color: var(--color-texto-suave); }
    /* Un total: tinta neutra, nunca el color del módulo. */
    .chq-cartera__v {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--color-texto);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .chq-cartera__sub { font-size: 0.8125rem; color: var(--color-texto-suave); margin-top: 0.125rem; }

    /* ── Filtros ─────────────────────────────────────────────────────────── */
    .chq-filtros { margin-bottom: 0.875rem; min-width: 0; }
    .chq-filtros__fila { display: flex; flex-wrap: wrap; gap: 0.5rem; min-width: 0; margin-bottom: 0.5rem; }
    .chq-filtros__fila > * { flex: 1 1 6rem; min-width: 0; }
    .chq-segmento {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 10px;
      background: var(--chq-segmento-fondo);
      min-width: 0;
      margin-bottom: 0.5rem;
    }
    .chq-segmento__opcion {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      padding: 0 0.5rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-family: var(--fuente);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--naranja-oscuro);
      white-space: nowrap;
      cursor: pointer;
    }
    .chq-segmento__opcion--activo { background: var(--naranja); color: #fff; font-weight: 700; }

    .chq-campo { margin-bottom: 0.875rem; min-width: 0; }
    .chq-campo:last-child { margin-bottom: 0; }
    .chq-campo label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-texto);
      margin-bottom: 0.375rem;
    }
    .chq-campo input,
    .chq-campo select,
    .chq-campo textarea {
      width: 100%;
      min-height: 44px;
      padding: 0.6875rem 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-input);
      font-family: var(--fuente);
      font-size: 1rem;
      background: var(--color-fondo);
      color: var(--color-texto);
      min-width: 0;
    }
    .chq-campo textarea { min-height: 88px; resize: vertical; }
    .chq-campo input:focus, .chq-campo select:focus, .chq-campo textarea:focus {
      outline: none; border-color: var(--naranja); box-shadow: 0 0 0 4px var(--naranja-suave);
    }
    .chq-campo__ayuda { font-size: 0.78125rem; color: var(--color-texto-suave); margin-top: 0.375rem; line-height: 1.45; overflow-wrap: anywhere; }
    .chq-campo__error { font-size: 0.8125rem; color: var(--bordo-oscuro); font-weight: 600; margin-top: 0.5rem; overflow-wrap: anywhere; }

    /* ── Tabla ───────────────────────────────────────────────────────────── */
    /* LA TABLA SCROLLEA DE COSTADO ADENTRO DE SU CAJA, NUNCA LA PÁGINA. */
    .chq-tabla-scroll {
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--color-fondo);
      border: 1px solid var(--borde-tarjeta);
      border-radius: var(--radio-tarjeta);
      box-shadow: var(--sombra-tarjeta);
      min-width: 0;
    }
    /* `separate` y no `collapse`: con bordes colapsados la columna sticky
       pierde el borde al scrollear en varios navegadores. */
    .chq-tabla {
      width: 100%;
      min-width: 46rem;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.875rem;
    }
    .chq-tabla th {
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
      padding: 0.625rem;
      border-bottom: 1px solid var(--color-borde);
      white-space: nowrap;
      background: var(--color-fondo);
    }
    .chq-tabla td {
      padding: 0.625rem;
      border-bottom: 1px solid var(--borde-tarjeta);
      color: var(--color-texto);
      vertical-align: top;
      background: var(--color-fondo);
    }
    .chq-tabla tbody tr { cursor: pointer; }
    .chq-tabla tbody tr:last-child td { border-bottom: none; }
    /* La columna del número queda FIJA al scrollear. Fondo OPACO. */
    .chq-tabla th:first-child,
    .chq-tabla td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 1px solid var(--color-borde);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
    }
    .chq-tabla__num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chq-tabla__fecha { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chq-tabla__sub { font-size: 0.75rem; color: var(--color-texto-suave); overflow-wrap: anywhere; }
    .chq-tabla__destino { max-width: 14rem; overflow-wrap: anywhere; }
    /* Banco y cliente en UN renglón, cortados con puntos suspensivos (el
       texto entero en title): un nombre largo que bajara de renglón haría esa
       fila más alta que las otras. */
    .chq-tabla__texto { max-width: 10rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chq-tabla__banco { max-width: 9rem; }
    /* Quién cargó la cobranza (Parte 4): un nombre, en un renglón. */
    .chq-tabla__persona { max-width: 9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* ATENUADO CON COLOR Y NO CON opacity: una celda sticky con opacity se
       vuelve transparente. DESPUÉS de la regla base de td. */
    .chq-tabla__fila--salido td { color: var(--color-texto-suave); }
    .chq-tabla__fila--anulado td { color: var(--color-texto-suave); text-decoration: line-through; }
    /* TODAS LAS FILAS MIDEN LO MISMO (Parte 2): cada celda en un renglón y
       centrada; el alto sale de acá y no del contenido, así una fila con
       botón no queda más alta que una sin él. */
    .chq-tabla tbody td { height: 3.5rem; vertical-align: middle; padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .chq-tabla th, .chq-tabla td { padding-left: 0.5rem; padding-right: 0.5rem; }
    .chq-tabla__salida { white-space: nowrap; }
    .chq-salida { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .chq-salida__texto {
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .chq-salida__nota {
      display: inline-block;
      max-width: 12rem;
      white-space: normal;
      font-size: 0.75rem;
      line-height: 1.3;
      color: var(--color-texto-suave);
    }
    /* ── Orden por columna (Parte 3) ── */
    /* El botón ocupa el encabezado entero: se toca el título, no una flechita. */
    .chq-th-orden {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      min-height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .chq-th-orden--activo { color: var(--naranja-oscuro); }
    .chq-th-orden__flecha { font-size: 0.625rem; min-width: 0.625rem; }

    /* En escritorio se ordena tocando los encabezados. */
    @media (min-width: 900px) {
      .chq-orden-movil { display: none; }
    }

    /* ── Celular: tarjetas de dos renglones (Parte 5) ─────────────────────
       Una lista compacta en UNA caja, con divisores y no tarjetas separadas:
       el espacio entre tarjetas es lo que no deja entrar seis cheques en
       390px. Desde 900px se ve la tabla y esto no se dibuja. */
    .chq-lista {
      background: var(--color-fondo);
      border: 1px solid var(--borde-tarjeta);
      border-radius: var(--radio-tarjeta);
      box-shadow: var(--sombra-tarjeta);
      overflow: hidden;
      min-width: 0;
    }
    .chq-tarjeta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 56px;
      padding: 0.4375rem 0.75rem;
      border-top: 1px solid var(--borde-tarjeta);
      cursor: pointer;
      min-width: 0;
    }
    .chq-tarjeta:first-child { border-top: none; }
    .chq-tarjeta__cuerpo { flex: 1 1 auto; min-width: 0; }
    .chq-tarjeta__l1 { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; overflow: hidden; }
    /* Un importe: tinta neutra, nunca el color del módulo. */
    .chq-tarjeta__importe {
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--color-texto);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chq-tarjeta__pago { font-size: 0.8125rem; color: var(--color-texto); white-space: nowrap; font-variant-numeric: tabular-nums; }
    /* El estado, chiquito, al final del segundo renglón: nunca se corta (los
       datos de antes se achican con puntos suspensivos). */
    .chq-tarjeta__estado { flex: 0 0 auto; margin-left: auto; font-size: 0.625rem; padding: 0.0625rem 0.4375rem; align-self: center; }
    .chq-tarjeta__l2 {
      display: flex;
      align-items: center;
      min-width: 0;
      overflow: hidden;
      margin-top: 0.125rem;
      font-size: 0.75rem;
      color: var(--color-texto-suave);
      white-space: nowrap;
    }
    /* Cada dato se corta con puntos suspensivos; el separador " · " sale del
       CSS, así un dato vacío no deja dos puntos seguidos. */
    .chq-tarjeta__dato { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .chq-tarjeta__dato + .chq-tarjeta__dato::before { content: ' · '; }
    .chq-tarjeta__num,
    .chq-tarjeta__salida { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    /* El banco y el cliente se achican, pero nunca hasta desaparecer. */
    /* Lo único que NUNCA se achica es el número y el estado: el banco, el
       cliente y la salida se cortan con puntos suspensivos (el texto entero
       queda en title). */
    .chq-tarjeta__banco { flex: 1 1 auto; }
    .chq-tarjeta__cliente { flex: 0 1 auto; }
    .chq-tarjeta__salida { flex: 0 1 auto; }
    /* El costado tiene un ancho FIJO: así el renglón de datos mide lo mismo en
       todas las tarjetas y el estado nunca queda tapado por el botón. */
    .chq-tarjeta__lado { flex: 0 0 5.75rem; display: flex; align-items: center; justify-content: flex-end; }
    /* El costado es angosto: "Volver a cartera" baja a dos renglones antes
       que comerle lugar a los datos. Sigue midiendo 44px de alto. */
    .chq-tarjeta__lado .chq-btn { min-height: 44px; width: 100%; padding: 0.25rem 0.5rem; line-height: 1.15; white-space: normal; }
    .chq-tarjeta__lado .chq-salida__nota { max-width: 100%; font-size: 0.625rem; text-align: right; }
    /* Atenuado con color, como la tabla. DESPUÉS de las reglas base. */
    .chq-tarjeta--salido .chq-tarjeta__importe,
    .chq-tarjeta--salido .chq-tarjeta__pago { color: var(--color-texto-suave); }
    .chq-tarjeta--anulado .chq-tarjeta__importe { color: var(--color-texto-suave); text-decoration: line-through; }

    /* ── Vencimiento del plazo para depositar (Parte 6) ──────────────────
       SE TIENE QUE VER DE UN VISTAZO, SIN LEER: la fila (o la tarjeta) entera
       con fondo bordó suave a 7 días o menos del plazo, y más intenso si ya
       venció. NUNCA naranja: la franja naranja es "por controlar" y el fondo
       naranja suave es la selección. Van DESPUÉS de la regla base de td y
       ANTES de la de la selección, que les gana. */
    .chq-tabla__fila--vence td { background: var(--bordo-suave); }
    .chq-tabla__fila--vencido td { background: var(--chq-vencido-fondo); }
    .chq-tarjeta--vence { background: var(--bordo-suave); }
    .chq-tarjeta--vencido { background: var(--chq-vencido-fondo); }
    .chq-tabla__pago { line-height: 1.2; }
    .chq-vence__fecha { display: block; color: var(--bordo); font-weight: 700; }
    .chq-vence__etiqueta { display: block; font-size: 0.6875rem; font-weight: 700; color: var(--bordo-oscuro); white-space: nowrap; }
    .chq-tabla__fila--vence .chq-tabla__pago,
    .chq-tabla__fila--vencido .chq-tabla__pago { color: var(--bordo); }
    .chq-tarjeta--vence .chq-tarjeta__pago,
    .chq-tarjeta--vencido .chq-tarjeta__pago { color: var(--bordo); font-weight: 700; }
    /* En la tarjeta la etiqueta (corta) NUNCA se corta: es lo que hay que
       ver. Lo que se achica es el número y el banco. */
    .chq-tarjeta__l2 .chq-vence__etiqueta { display: inline; font-size: inherit; flex: 0 0 auto; }
    .chq-tarjeta--vence .chq-tarjeta__num,
    .chq-tarjeta--vencido .chq-tarjeta__num { flex-shrink: 1; }
    /* El aviso de arriba, tocable: "3 cheques vencen esta semana · $ …". */
    .chq-vencen {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem 0.75rem;
      width: 100%;
      min-height: 44px;
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--bordo);
      border-radius: var(--radio-boton);
      background: var(--bordo-suave);
      color: var(--bordo-oscuro);
      font-family: var(--fuente);
      font-size: 0.875rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      min-width: 0;
    }
    .chq-vencen--vencido { background: var(--chq-vencido-fondo); }
    .chq-vencen[aria-pressed="true"] { border-width: 2.5px; }
    .chq-vencen__texto { min-width: 0; overflow-wrap: anywhere; }
    .chq-vencen__accion { font-size: 0.8125rem; text-decoration: underline; white-space: nowrap; }

    /* Una sola de las dos vistas a la vez. En el celular además se achica lo
       de arriba de la lista: cada renglón que se ahorra es un cheque más a la
       vista. */
    @media (max-width: 899.98px) {
      .chq-tabla-scroll { display: none; }
      .chq-header { margin: 0.75rem 0; padding: 0.625rem 0.875rem; }
      .chq-nav { margin-bottom: 0.5rem; }
      .chq-cartera { padding: 0.625rem 0.875rem; margin-bottom: 0.5rem; }
      .chq-cartera__v { font-size: 1.25rem; }
      .chq-filtros { margin-bottom: 0.625rem; }
      .chq-filtros .chq-campo label { font-size: 0.75rem; margin-bottom: 0.25rem; }
    }
    @media (min-width: 900px) {
      .chq-lista { display: none; }
    }

    /* ── Selección (Parte 7) ─────────────────────────────────────────────
       Lo elegido va con fondo --naranja-suave. Va DESPUÉS de las marcas de
       vencimiento: la selección les gana el fondo, y la etiqueta bordó del
       plazo sigue a la vista porque es texto, no fondo. */
    /* También el cheque que se pidió ver desde una cobranza (?cheque=). */
    .chq-tabla__fila--destacada td,
    .chq-tabla__fila--elegida td { background: var(--naranja-suave); }
    .chq-tarjeta--destacada,
    .chq-tarjeta--elegida { background: var(--naranja-suave); }
    .chq-tabla__elegir { width: 2.75rem; text-align: center; }
    .chq-tarjeta__elegir { flex: 0 0 auto; display: flex; align-items: center; }
    .chq-casilla { width: 1.25rem; height: 1.25rem; accent-color: var(--naranja); cursor: pointer; }
    .chq-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .chq-nav { justify-content: space-between; align-items: center; }
    .chq-nav__seleccionar[aria-pressed="true"] { border-color: var(--naranja); background: var(--naranja-suave); color: var(--naranja-oscuro); }
    .chq-aviso-chico { font-size: 0.75rem; color: var(--chq-texto-secundario); margin: -0.25rem 0 0.5rem; }
    /* La barra fija de abajo, con el resumen de lo elegido. Respeta la barra
       de gestos del celular (safe-area). */
    .chq-barra {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      background: var(--color-fondo);
      border-top: 1px solid var(--color-borde);
      box-shadow: 0 -2px 12px rgba(26, 42, 82, 0.08);
      padding: 0.625rem 1rem calc(0.625rem + env(safe-area-inset-bottom, 0px));

    .chq-barra__texto { display: flex; flex-direction: column; min-width: 0; }
    .chq-barra__cifras { font-size: 0.9375rem; font-weight: 700; color: var(--color-texto); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .chq-barra__vencen { font-size: 0.8125rem; font-weight: 700; color: var(--bordo-oscuro); }
    .chq-barra__acciones { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chq-barra__acciones .chq-btn { min-height: 44px; }
    .chq-barra__no-salen { flex-basis: 100%; font-size: 0.8125rem; font-weight: 600; color: var(--bordo-oscuro); }
    /* Los elegidos que no pueden salir: una franja BORDÓ a la izquierda (el
       naranja es "por controlar" y la selección). */
    .chq-tabla__fila--no-sale td:first-child { box-shadow: inset 4px 0 0 var(--bordo); }
    .chq-tarjeta--no-sale { box-shadow: inset 4px 0 0 var(--bordo); }
    /* Con la barra a la vista, lo último de la lista no queda tapado. */
    body.chq-con-barra .chq-contenedor { padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }

    /* El botón de la columna: el de la acción principal de la fila. */
    .chq-btn--salida { border-color: var(--naranja); color: var(--naranja-oscuro); }

    /* ── Estado del cheque ───────────────────────────────────────────────── */
    .chq-estado {
      font-size: 0.6875rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.125rem 0.5rem;
      white-space: nowrap;
      background: var(--color-superficie);
      color: var(--color-texto-suave);
    }
    /* En cartera es el estado NORMAL: neutro. */
    .chq-estado--en_cartera { color: var(--color-acento); }
    .chq-estado--anulado { background: var(--bordo-suave); color: var(--bordo-oscuro); }

    /* ── Modal ───────────────────────────────────────────────────────────── */
    .chq-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(12, 16, 28, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 1rem;
      min-width: 0;
    }
    .chq-modal__caja {
      background: var(--color-fondo);
      border-radius: var(--radio-tarjeta);
      padding: 1.25rem;
      width: 100%;
      max-width: 480px;
      max-height: 86vh;
      overflow-y: auto;
      min-width: 0;
    }
    .chq-modal__titulo { font-size: 1.0625rem; font-weight: 700; color: var(--color-texto); margin-bottom: 0.75rem; overflow-wrap: anywhere; }
    .chq-salida-tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; min-width: 0; }

    @media (min-width: 640px) {
      .chq-modal { align-items: center; }
    }
  </style>
