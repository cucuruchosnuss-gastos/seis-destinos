<body class="pagina-modulo">

  <div class="chq-contenedor">

    <header class="chq-header">
      <a href="../dashboard.html" class="chq-header__volver" title="Volver al dashboard">&lsaquo; Volver</a>
      <div class="chq-header__col">
        <span class="chq-header__marca">Seis Destinos</span>
        <span class="chq-header__titulo">Cheques <span class="chq-header__punto">&#9679;</span> Cartera</span>
      </div>
    </header>

    <!-- Sin ver_todo ni procesar no hay cartera que mostrar. El frontend solo
         oculta: la barrera real son las policies y las RPCs. -->
    <div class="chq-vacio" id="chq-sin-acceso" hidden></div>
    <div class="chq-vacio" id="chq-cargando">Cargando…</div>

    <div id="chq-vista" hidden>
      <nav class="chq-nav">
        <a id="chq-link-cobranzas" class="chq-nav__link" href="cobranzas.html">&lsaquo; Cobranzas</a>
        <!-- Selección con resumen (Parte 7): una casilla en cada cheque y la
             barra de abajo con la cantidad, el total y el plazo. -->
        <button type="button" class="chq-btn chq-btn--chico chq-nav__seleccionar" id="chq-btn-seleccionar" aria-pressed="false">Seleccionar</button>
      </nav>

      <div class="chq-cartera" id="chq-cartera"></div>

      <div class="chq-filtros">
        <div class="chq-segmento" id="chq-chips-estado" role="group" aria-label="Filtrar cheques por estado"></div>
        <div class="chq-filtros__fila">
          <div class="chq-campo" style="margin-bottom:0">
            <label for="chq-filtro-numero">N&deg; de cheque</label>
            <input type="search" id="chq-filtro-numero" inputmode="numeric"
                   placeholder="66259862" autocomplete="off" maxlength="20">
          </div>
          <!-- Las opciones salen de TODOS los cheques que la persona puede
               ver, sin ningún otro filtro puesto: ver cargarResumenCheques(). -->
          <div class="chq-campo" id="chq-campo-banco" style="margin-bottom:0" hidden>
            <label for="chq-filtro-banco">Banco</label>
            <select id="chq-filtro-banco"></select>
          </div>
          <!-- En el celular no hay encabezados que tocar: el orden se elige acá,
               columna y sentido en UN solo select, en la misma fila que los
               filtros (cada renglón de más es un cheque menos en pantalla). En
               escritorio no se dibuja: los encabezados ordenan. -->
          <div class="chq-campo chq-orden-movil" style="margin-bottom:0">
            <label for="chq-orden-campo">Ordenar por</label>
            <select id="chq-orden-campo"></select>
          </div>
        </div>
        <!-- pre-line: las líneas del aviso van por textContent. -->
        <div class="chq-aviso" id="chq-aviso-numero" style="white-space:pre-line" hidden></div>
        <button type="button" class="chq-btn chq-btn--chico" id="chq-btn-limpiar" hidden>Limpiar filtros</button>
      </div>

      <div class="chq-aviso" id="chq-aviso" style="white-space:pre-line" hidden></div>
      <!-- Un aviso CHICO: cambiar un filtro limpió la selección. -->
      <div class="chq-aviso-chico" id="chq-aviso-seleccion" role="status" hidden></div>
      <div class="chq-tabla-scroll" id="chq-tabla-caja" hidden>
        <table class="chq-tabla" id="chq-tabla"></table>
      </div>
      <!-- En el celular, en lugar de la tabla: una tarjeta de dos renglones por
           cheque. Las dos se dibujan con los mismos datos; el CSS muestra una. -->
      <div class="chq-lista" id="chq-lista" hidden></div>
      <div class="chq-vacio" id="chq-vacio" hidden></div>
    </div>
  </div>

  <!-- ══ BARRA DE LA SELECCIÓN (Parte 7) ════════════════════════════════ -->
  <!-- Fija abajo, respetando el safe-area. Solo con la selección activa. -->
  <div class="chq-barra" id="chq-barra-seleccion" hidden>
    <div class="chq-barra__interno">
      <div class="chq-barra__texto">
        <span class="chq-barra__cifras" id="chq-sel-resumen"></span>
        <span class="chq-barra__vencen" id="chq-sel-vencen" hidden></span>
      </div>
      <div class="chq-barra__acciones" id="chq-sel-acciones">
        <!-- Parte 8: dar salida a todos los elegidos de una vez (todo o nada).
             Solo con cobranzas:procesar; se habilita desde JS. -->
        <button type="button" class="chq-btn chq-btn--chico chq-btn--primario" id="chq-sel-dar-salida" hidden>Dar salida</button>
        <button type="button" class="chq-btn chq-btn--chico" id="chq-sel-cancelar">Cancelar</button>
      </div>
      <div class="chq-barra__no-salen" id="chq-sel-no-salen" hidden></div>
    </div>
  </div>

  <!-- ══ DIÁLOGO DE SALIDA DE UN CHEQUE ═════════════════════════════════ -->
  <!-- Un diálogo propio y no prompt()/confirm(): no se pueden estilar y
       algunos webviews los bloquean. -->
  <div class="chq-modal" id="chq-modal-salida" hidden role="dialog" aria-modal="true" aria-labelledby="chq-salida-titulo">
    <div class="chq-modal__caja">
      <div class="chq-modal__titulo" id="chq-salida-titulo">Salida del cheque</div>
      <div class="chq-campo__ayuda" id="chq-salida-cheques" style="margin:-.25rem 0 .875rem;white-space:pre-line"></div>
      <div class="chq-campo">
        <label>¿Qué pasó con el cheque?</label>
        <div class="chq-salida-tipos">
          <button type="button" class="chq-btn chq-btn--grande" data-salida-tipo="depositado">Depositado</button>
          <button type="button" class="chq-btn chq-btn--grande" data-salida-tipo="endosado">Endosado</button>
        </div>
      </div>
      <div class="chq-campo">
        <label for="chq-salida-fecha">Fecha</label>
        <input type="date" id="chq-salida-fecha">
      </div>
      <div class="chq-campo" id="chq-salida-campo-destino" hidden>
        <label for="chq-salida-destino" id="chq-salida-label-destino">¿A quién se lo pasaste?</label>
        <input type="text" id="chq-salida-destino" maxlength="150" autocomplete="off">
        <div class="chq-campo__ayuda" id="chq-salida-ayuda-destino"></div>
      </div>
      <div class="chq-campo__error" id="chq-salida-error" hidden></div>
      <div class="chq-acciones">
        <button type="button" class="chq-btn" id="chq-salida-cancelar">Cancelar</button>
        <button type="button" class="chq-btn chq-btn--primario" id="chq-salida-confirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- ══ DIÁLOGO DE MOTIVO (volver a cartera) ═══════════════════════════ -->
  <div class="chq-modal" id="chq-modal-motivo" hidden role="dialog" aria-modal="true" aria-labelledby="chq-motivo-titulo">
    <div class="chq-modal__caja">
      <div class="chq-modal__titulo" id="chq-motivo-titulo">Motivo</div>
      <div class="chq-campo">
        <label for="chq-motivo-texto" id="chq-motivo-label">Motivo</label>
        <textarea id="chq-motivo-texto" maxlength="500" placeholder="Por qué"></textarea>
        <div class="chq-campo__error" id="chq-motivo-error" hidden></div>
      </div>
      <div class="chq-acciones">
        <button type="button" class="chq-btn" id="chq-motivo-cancelar">Cancelar</button>
        <button type="button" class="chq-btn chq-btn--alerta" id="chq-motivo-confirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { mostrarError, mostrarExito } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'
    import {
      dvBcra, formatearImporte, hoyArgentina, esFechaIso, diasEntre, formatearFechaCob,
      ETIQUETA_ESTADO_CHEQUE, nombreBancoDe,
    } from '../js/cobranzas-comun.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion: null,
      miEmpleadoId: null,
      miRolApp: null,
      misTareas: new Set(),
      // Catálogo de bancos: código → nombre.
      bancos: new Map(),
      // Los filtros arrancan en "en cartera". soloVencen: el recorte "los que
      // vencen esta semana" del aviso de arriba (Parte 6).
      filtros: { estado: 'en_cartera', numero: '', banco: '', soloVencen: false },
      // { cantidad, vencidos, total } de toda la cartera; null = no se pudo saber.
      vencimientos: null,
      // El orden de la lista: por defecto, lo que se cobra primero arriba.
      orden: { campo: 'pago', sentido: 'asc' },
      filas: [],
      cobranzas: new Map(),   // id → { id, cliente, estado, fecha, cargada_por_nombre }
      cartera: null,          // { cantidad, total } — null = no se pudo saber
      tope: false,
      topeResumen: false,
      error: null,
      // Los códigos de banco que de verdad tienen algún cheque a la vista.
      bancosDeCheques: [],
      // El cheque que se pidió ver desde una cobranza (?cheque=).
      destacado: null,
      // La selección (Parte 7): { activa, ids: Set de ids de cheque, ultimo }.
      // `ultimo` es el último tocado, para marcar un tramo con Shift + clic.
      // `noPueden` (Parte 8): los elegidos que no pueden salir, marcados.
      seleccion: { activa: false, ids: new Set(), ultimo: null, noPueden: new Set() },
      // El diálogo de salida abierto: { cheque, cobranza, tipo } o null.
      salida: null,
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS PROPIOS
    // ═══════════════════════════════════════════════════════════════════════

    // Escape de TODO texto que venga de una persona o de la base antes de
    // meterlo en un innerHTML. Cada módulo tiene el suyo.
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function nombreBanco(codigo) {
      return nombreBancoDe(estado.bancos, codigo)
    }

    // Un texto opcional viaja como null si queda vacío: la base distingue "no
    // hay dato" de "hay un dato que es la cadena vacía".
    function textoOpcional(v) {
      const t = String(v ?? '').trim()
      return t === '' ? null : t
    }

    // A dónde lleva tocar un cheque: su cobranza, en Cobranzas, con un volver=
    // a esta pantalla. Cobranzas valida ese volver= (misma app, http/https).
    function urlDeCobranza(cobranzaId, volverA) {
      return `cobranzas.html?cobranza=${encodeURIComponent(cobranzaId)}&volver=${encodeURIComponent(volverA)}`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PERMISOS — el frontend solo oculta; la barrera real está en el servidor
    // ═══════════════════════════════════════════════════════════════════════

    // Las tareas son las de Cobranzas: los cheques son de una cobranza, y las
    // RPCs de salida exigen cobranzas:procesar. Con bypass de super_admin,
    // igual que tiene_tarea() en la base.
    function tieneTarea(tarea) {
      return estado.miRolApp === 'super_admin' || estado.misTareas.has(`cobranzas:${tarea}`)
    }
    const puedeProcesar = () => tieneTarea('procesar')
    // Ver la cartera: quien ve todas las cobranzas o quien las procesa. Con
    // solo `cargar` la persona vería nada más que sus propios cheques, y eso
    // no es una cartera.
    const puedeVerCartera = () => tieneTarea('ver_todo') || tieneTarea('procesar')

    // ═══════════════════════════════════════════════════════════════════════
    // CATÁLOGO DE BANCOS
    // ═══════════════════════════════════════════════════════════════════════

    // Sin caché local: esta pantalla es de administración, no se usa sin
    // señal. Si el catálogo no llega, nombreBanco() dice el código.
    async function cargarBancos() {
      try {
        const { data, error } = await supabase
          .from('bancos_bcra').select('codigo, denominacion').eq('activo', true)
        if (error) throw error
        estado.bancos = new Map((data ?? []).map(b => [String(b.codigo), b.denominacion]))
      } catch (err) {
        console.error('No se pudo cargar el catálogo de bancos:', err)
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CHEQUES — una fila por cheque
    // ═══════════════════════════════════════════════════════════════════════

    // PostgREST devuelve 1000 filas por defecto. Si una consulta llega a eso,
    // la lista está cortada y SE DICE: cortar en silencio es el peor final.
    const TOPE_FILAS_POSTGREST = 1000

    const AVISO_CARTERA_PARCIAL = 'Ves solo los cheques de las cobranzas que cargaste vos. Para ver toda la cartera hace falta la tarea «Ver las cobranzas de todas las personas».'

    const FILTROS_CHEQUES_DEFECTO = { estado: 'en_cartera', numero: '', banco: '' }

    const ESTADOS_FILTRO_CHEQUES = [
      { id: 'en_cartera', nombre: 'En cartera' },
      { id: 'salidos', nombre: 'Salidos' },
      // "Todos" es el ÚNICO que muestra los anulados.
      { id: 'todos', nombre: 'Todos' },
    ]

    // Qué hacer con lo que se escribió en el filtro de número de cheque:
    //
    //   sin dígitos   -> NO se muestra ningún cheque, y se avisa
    //   menos de 8    -> búsqueda PARCIAL
    //   exactamente 8 -> el número, búsqueda EXACTA
    //   exactamente 9 -> número + dígito de control: se usan los PRIMEROS 8
    //   más de 9      -> NO se adivina: se avisa y NO se filtra por número
    //
    // El caso de más de 9 no filtra en vez de recortar: cortar "los primeros
    // 8" de un número que la persona escribió mal devolvería resultados que
    // parecen buenos y no lo son.
    function filtroNumeroCheque(texto) {
      // PRIMERO se extraen los dígitos y RECIÉN DESPUÉS se arma el patrón del
      // like. En SQL el % y el _ son comodines: un '%' tipeado que llegara
      // crudo al patrón devolvería TODOS los cheques sin ningún error.
      const crudo = String(texto ?? '').trim()
      const d = crudo.replace(/\D/g, '')
      if (!crudo) return { modo: 'ninguno', digitos: '', aviso: '' }
      if (!d) {
        return {
          modo: 'sin_digitos', digitos: '',
          aviso: 'El número de cheque se busca por sus dígitos y lo que escribiste no tiene ninguno. No se muestra ningún cheque: borralo o escribí el número.',
        }
      }
      // CONTIENE, no empieza-con: uno se acuerda de los ÚLTIMOS dígitos.
      if (d.length < 8) return { modo: 'parcial', digitos: d, aviso: '' }
      if (d.length === 8) return { modo: 'exacto', digitos: d, aviso: '' }
      if (d.length === 9) {
        const cuerpo = d.slice(0, 8)
        // dvBcra() viene de js/cobranzas-comun.js: la fórmula vive en tres
        // lugares (public.dv_bcra, la Edge Function ocr-cheques y ese archivo)
        // y una cuarta sería una más que mantener sincronizada.
        const cierra = dvBcra(cuerpo) === Number(d[8])
        return {
          modo: 'exacto', digitos: cuerpo,
          aviso: cierra
            ? `Buscamos ${cuerpo}: el último dígito es el de control del banco y no es parte del número.`
            : `Buscamos ${cuerpo} igual, pero el último dígito no coincide con el de control: revisá el número.`,
        }
      }
      return {
        modo: 'demasiado', digitos: '',
        aviso: `Un número de cheque tiene 8 dígitos (9 con el de control) y escribiste ${d.length}. No estamos filtrando por número: revisalo.`,
      }
    }

    // Aplica los filtros a una consulta sobre cobranza_cheques. Separada de la
    // carga para poder EJECUTARLA en la suite contra un constructor que anota
    // qué se le pidió. Devuelve sinResultados cuando no hay que consultar.
    function aplicarFiltrosCheques(q, f) {
      if (f.estado === 'en_cartera') q = q.eq('estado', 'en_cartera')
      else if (f.estado === 'salidos') q = q.in('estado', ['depositado', 'endosado'])
      // 'todos': sin filtro de estado, que es lo que trae también los anulados.
      if (f.banco) q = q.eq('banco_codigo', f.banco)
      const fn = filtroNumeroCheque(f.numero)
      if (fn.modo === 'sin_digitos') return { q, sinResultados: true }
      // El patrón se arma con fn.digitos —ya sin comodines— y NUNCA con el
      // texto crudo del input.
      if (fn.modo === 'exacto') q = q.eq('numero', fn.digitos)
      else if (fn.modo === 'parcial') q = q.like('numero', `%${fn.digitos}%`)
      return { q, sinResultados: false }
    }

    function hayFiltrosCheques() {
      const f = estado.filtros
      return f.estado !== FILTROS_CHEQUES_DEFECTO.estado || String(f.numero ?? '').trim() !== '' || !!f.banco || !!f.soloVencen
    }

    // ── Vencimiento del plazo para depositar (Parte 6) ───────────────────
    // Un cheque se tiene que depositar dentro de los 30 días de su fecha de
    // pago, o de su emisión si es común. MISMA regla que la función de la base
    // public.cheque_plazo_presentacion(tipo, emision, pago):
    //   case when tipo = 'diferido' then pago else emision end + 30
    // (un diferido sin fecha de pago da null, igual que allá). La prueba
    // compara las dos con los mismos casos medidos en la base.
    const DIAS_PLAZO_PRESENTACION = 30
    // A cuántos días del plazo se empieza a marcar. El mismo 7 que usa
    // mis_pendientes() para la burbuja del dashboard.
    const DIAS_AVISO_VENCIMIENTO = 7

    function plazoPresentacion(ch) {
      const base = ch.tipo === 'diferido' ? ch.fecha_pago : ch.fecha_emision
      if (!esFechaIso(base)) return null
      const d = new Date(base + 'T00:00:00Z')
      d.setUTCDate(d.getUTCDate() + DIAS_PLAZO_PRESENTACION)
      return d.toISOString().slice(0, 10)
    }

    // Solo cheques EN CARTERA: uno que ya salió o está anulado no se deposita.
    // null = no hay nada que marcar.
    function estadoVencimiento(ch, hoy) {
      if (ch.estado !== 'en_cartera') return null
      const plazo = plazoPresentacion(ch)
      const dias = diasEntre(hoy, plazo)
      if (dias === null) return null
      if (dias < 0) return { nivel: 'vencido', plazo, dias }
      if (dias <= DIAS_AVISO_VENCIMIENTO) return { nivel: 'por_vencer', plazo, dias }
      return null
    }

    // "Vence el 22/10 · quedan 5 días" / "Plazo vencido el 22/10".
    function textoVencimiento(v) {
      if (!v) return ''
      const [, m, d] = v.plazo.split('-')
      const fecha = `${d}/${m}`
      if (v.nivel === 'vencido') return `Plazo vencido el ${fecha}`
      if (v.dias === 0) return `Vence hoy, ${fecha}`
      return `Vence el ${fecha} · ${v.dias === 1 ? 'queda 1 día' : `quedan ${v.dias} días`}`
    }

    // La versión corta, para la tarjeta del celular: el renglón no da para la
    // larga y cortada con puntos suspensivos no se lee. "Vence 22/10 · 5 días"
    // / "Vence hoy" / "Vencido el 22/10".
    function textoVencimientoCorto(v) {
      if (!v) return ''
      const [, m, d] = v.plazo.split('-')
      if (v.nivel === 'vencido') return `Vencido el ${d}/${m}`
      if (v.dias === 0) return 'Vence hoy'
      return `Vence ${d}/${m} · ${v.dias === 1 ? '1 día' : `${v.dias} días`}`
    }

    // Los que vencen esta semana (o ya vencieron), de TODA la cartera: la
    // misma cuenta que la burbuja del dashboard. Se suma en centavos.
    function resumenVencimientos(filas, hoy) {
      let cantidad = 0, vencidos = 0, centavos = 0
      for (const ch of filas) {
        const v = estadoVencimiento(ch, hoy)
        if (!v) continue
        cantidad++
        if (v.nivel === 'vencido') vencidos++
        centavos += Math.round(Number(ch.importe) * 100)
      }
      return { cantidad, vencidos, total: centavos / 100 }
    }

    // Lo que se ve: con "solo los que vencen" puesto, se filtra acá lo que ya
    // trajo la consulta (en cartera).
    function filasVisibles() {
      if (!estado.filtros.soloVencen) return estado.filas
      const hoy = hoyArgentina()
      return estado.filas.filter(ch => estadoVencimiento(ch, hoy))
    }

    // Tocar el aviso de arriba: mostrar solo los que vencen (o volver a todos).
    function alternarSoloVencen() {
      const activo = !estado.filtros.soloVencen
      estado.filtros.soloVencen = activo
      if (activo) estado.filtros.estado = 'en_cartera'
      guardarPreferencias()
      soltarSeleccionPorFiltro()
      cargarCheques()
    }

    // ── Selección con resumen (Parte 7) ──────────────────────────────────
    // Los días de un cheque: cuántos faltan para poder cobrarlo, contados
    // desde hoy. Uno a la vista (común) o con la fecha de pago ya pasada
    // cuenta 0: se puede cobrar ya, y un número negativo bajaría el promedio
    // de los demás sin significar nada.
    function diasHastaCobro(ch, hoy) {
      if (ch.tipo !== 'diferido') return 0
      const d = diasEntre(hoy, ch.fecha_pago)
      return d === null ? 0 : Math.max(0, d)
    }

    // El resumen de lo elegido: cantidad, total (en centavos), plazo simple
    // (promedio de días) y ponderado (cada cheque pesa por su importe), los
    // dos redondeados a días enteros, y cuántos vencen pronto (Parte 6).
    // $100.000 a 0 días y $4.000.000 a 60: simple 30, ponderado 59.
    function resumenSeleccion(filas, hoy) {
      let centavos = 0, sumaDias = 0, sumaPonderada = 0, vencenPronto = 0
      for (const ch of filas) {
        const c = Math.round(Number(ch.importe) * 100)
        const d = diasHastaCobro(ch, hoy)
        centavos += c
        sumaDias += d
        sumaPonderada += d * c
        if (estadoVencimiento(ch, hoy)) vencenPronto++
      }
      const n = filas.length
      return {
        cantidad: n,
        total: centavos / 100,
        simple: n ? Math.round(sumaDias / n) : null,
        // Sin importe no hay con qué ponderar: se dice "—" y no un cero.
        ponderado: centavos > 0 ? Math.round(sumaPonderada / centavos) : null,
        vencenPronto,
      }
    }

    // "N cheques · $ TOTAL · plazo X días (ponderado Y)".
    function textoResumenSeleccion(r) {
      const cheques = r.cantidad === 1 ? '1 cheque' : `${r.cantidad} cheques`
      const dias = (n) => n === null ? '—' : n === 1 ? '1 día' : `${n} días`
      const plazo = r.cantidad ? ` · plazo ${dias(r.simple)} (ponderado ${r.ponderado === null ? '—' : r.ponderado})` : ''
      return `${cheques} · ${formatearImporte(r.total)}${plazo}`
    }

    // Los elegidos, en el orden de la lista.
    function chequesElegidos() {
      return estado.filas.filter(ch => estado.seleccion.ids.has(ch.id))
    }

    function activarSeleccion() {
      estado.seleccion = { activa: true, ids: new Set(), ultimo: null }
      renderizarCheques()
      pintarSeleccion()
    }

    function cancelarSeleccion() {
      estado.seleccion = { activa: false, ids: new Set(), ultimo: null }
      renderizarCheques()
      pintarSeleccion()
    }

    // Tocar un cheque con la selección activa: lo marca o lo desmarca. Con
    // Shift (escritorio) marca el TRAMO desde el último tocado, en el orden
    // en que está la lista a la vista.
    function tocarParaElegir(id, conShift) {
      const s = estado.seleccion
      if (!s.activa || !id) return
      const orden = filasVisibles().map(ch => ch.id)
      if (conShift && s.ultimo && orden.includes(s.ultimo) && orden.includes(id)) {
        const [a, b] = [orden.indexOf(s.ultimo), orden.indexOf(id)].sort((x, y) => x - y)
        for (const x of orden.slice(a, b + 1)) s.ids.add(x)
      } else if (s.ids.has(id)) {
        s.ids.delete(id)
      } else {
        s.ids.add(id)
      }
      s.ultimo = id
      marcarElegidosEnPantalla()
      pintarSeleccion()
    }

    // Marca las filas y tarjetas SIN redibujar la lista (redibujarla perdería
    // el scroll de quien está recorriendo la tabla).
    function marcarElegidosEnPantalla() {
      document.querySelectorAll('[data-cheque-fila]').forEach(el => {
        const elegido = estado.seleccion.ids.has(el.dataset.chequeFila)
        el.classList.toggle(el.tagName === 'TR' ? 'chq-tabla__fila--elegida' : 'chq-tarjeta--elegida', elegido)
        el.setAttribute('aria-selected', elegido ? 'true' : 'false')
        const casilla = el.querySelector('[data-elegir-cheque]')
        if (casilla) casilla.checked = elegido
      })
    }

    // La barra de abajo y el botón "Seleccionar".
    function pintarSeleccion() {
      const s = estado.seleccion
      const btn = document.getElementById('chq-btn-seleccionar')
      btn.setAttribute('aria-pressed', s.activa ? 'true' : 'false')
      btn.textContent = s.activa ? 'Listo' : 'Seleccionar'
      const barra = document.getElementById('chq-barra-seleccion')
      barra.hidden = !s.activa
      document.body.classList.toggle('chq-con-barra', s.activa)
      if (!s.activa) return
      const r = resumenSeleccion(chequesElegidos(), hoyArgentina())
      document.getElementById('chq-sel-resumen').textContent =
        r.cantidad ? textoResumenSeleccion(r) : 'Tocá los cheques para elegirlos.'
      const vencen = document.getElementById('chq-sel-vencen')
      vencen.textContent = r.vencenPronto ? `Vencen pronto: ${r.vencenPronto}` : ''
      vencen.hidden = !r.vencenPronto
      pintarSalidaLote()
    }

    // ── Dar salida a los elegidos (Parte 8) ──────────────────────────────
    // marcar_salida_cheques(p_cheque_ids, p_tipo, p_fecha, p_destino) es TODO
    // O NADA: si uno no puede salir, no sale ninguno y el mensaje de la base
    // dice cuál y por qué. Tope: 100 por vez. La pantalla habilita el botón
    // solo si TODOS pueden salir (en cartera y de una cobranza asentada); la
    // base igual lo vuelve a controlar.
    const TOPE_SALIDA_LOTE = 100

    // Si un cheque, por lo que se ve acá, puede salir.
    function puedeSalir(ch) {
      return ch.estado === 'en_cartera' && estado.cobranzas.get(ch.cobranza_id)?.estado === 'procesada'
    }

    // ¿Se puede dar salida a lo elegido? { puede, noPueden: [ids], motivo }.
    function validarSalidaLote(elegidos) {
      const noPueden = elegidos.filter(ch => !puedeSalir(ch)).map(ch => ch.id)
      if (!elegidos.length) return { puede: false, noPueden, motivo: '' }
      if (noPueden.length) {
        return { puede: false, noPueden, motivo: noPueden.length === 1
          ? 'Hay 1 cheque que no puede salir (no está en cartera o su cobranza no está asentada). Está marcado.'
          : `Hay ${noPueden.length} cheques que no pueden salir (no están en cartera o su cobranza no está asentada). Están marcados.` }
      }
      if (elegidos.length > TOPE_SALIDA_LOTE) {
        return { puede: false, noPueden, motivo: `Se puede dar salida hasta ${TOPE_SALIDA_LOTE} cheques a la vez: elegiste ${elegidos.length}.` }
      }
      return { puede: true, noPueden, motivo: '' }
    }

    // El botón "Dar salida a N" y lo que no puede salir, marcado.
    function pintarSalidaLote() {
      const btn = document.getElementById('chq-sel-dar-salida')
      const aviso = document.getElementById('chq-sel-no-salen')
      const elegidos = chequesElegidos()
      // Sin la tarea no hay botón (la RPC lo rechazaría) ni aviso.
      if (!puedeProcesar() || !elegidos.length) {
        btn.hidden = true
        aviso.hidden = true
        estado.seleccion.noPueden = new Set()
        marcarNoSalen()
        return
      }
      const v = validarSalidaLote(elegidos)
      btn.hidden = false
      btn.disabled = !v.puede
      btn.textContent = `Dar salida a ${elegidos.length}`
      aviso.textContent = v.motivo
      aviso.hidden = !v.motivo
      estado.seleccion.noPueden = new Set(v.noPueden)
      marcarNoSalen()
    }

    // Marca en la lista los elegidos que no pueden salir (sin redibujar).
    function marcarNoSalen() {
      const no = estado.seleccion.noPueden ?? new Set()
      document.querySelectorAll('[data-cheque-fila]').forEach(el => {
        el.classList.toggle(el.tagName === 'TR' ? 'chq-tabla__fila--no-sale' : 'chq-tarjeta--no-sale', no.has(el.dataset.chequeFila))
      })
    }

    // Los parámetros tal cual viajan, en el orden de la lista.
    function parametrosSalidaLote(ids, { tipo, fecha, destino }) {
      return { p_cheque_ids: [...ids], p_tipo: tipo, p_fecha: fecha, p_destino: textoOpcional(destino) }
    }

    // La fecha más nueva de las cobranzas de los elegidos: la salida no puede
    // ser anterior a NINGUNA (la base valida cheque por cheque).
    function fechaMinimaLote(cheques) {
      let max = null
      for (const ch of cheques) {
        const f = estado.cobranzas.get(ch.cobranza_id)?.fecha
        if (esFechaIso(f) && (max === null || f > max)) max = f
      }
      return max
    }

    // El MISMO diálogo de salida, con el título "Dar salida a N cheques ·
    // $ TOTAL" y la lista corta de los cheques.
    function abrirModalSalidaLote() {
      const elegidos = chequesElegidos()
      const v = validarSalidaLote(elegidos)
      if (!v.puede) return
      const total = resumenSeleccion(elegidos, hoyArgentina()).total
      const minima = fechaMinimaLote(elegidos)
      estado.salida = { lote: true, cheques: elegidos, cobranza: minima ? { fecha: minima } : null, tipo: null }
      document.getElementById('chq-salida-titulo').textContent =
        `Dar salida a ${elegidos.length} ${elegidos.length === 1 ? 'cheque' : 'cheques'} · ${formatearImporte(total)}`
      // textContent (el cliente va crudo acá): una línea por cheque, hasta 6.
      const MAX_LINEAS = 6
      const lineas = elegidos.slice(0, MAX_LINEAS).map(ch => {
        const cob = estado.cobranzas.get(ch.cobranza_id)
        return `N° ${ch.numero ?? '—'} · ${nombreBanco(ch.banco_codigo)} · ${formatearImporte(ch.importe)}${cob?.cliente ? ` · ${cob.cliente}` : ''}`
      })
      if (elegidos.length > MAX_LINEAS) lineas.push(`y ${elegidos.length - MAX_LINEAS} más`)
      document.getElementById('chq-salida-cheques').textContent = lineas.join('\n')
      const fecha = document.getElementById('chq-salida-fecha')
      fecha.value = hoyArgentina()
      fecha.max = hoyArgentina()
      fecha.min = minima ?? ''
      document.getElementById('chq-salida-destino').value = ''
      pintarModalSalida()
      document.getElementById('chq-modal-salida').hidden = false
    }

    // Cambiar un filtro LIMPIA la selección (lo elegido podría quedar
    // escondido y seguir contando), con un aviso chico que se va solo.
    // Reordenar NO: los mismos cheques siguen a la vista.
    let temporizadorAvisoSeleccion = null
    function soltarSeleccionPorFiltro() {
      const s = estado.seleccion
      if (!s.activa || !s.ids.size) return
      s.ids = new Set()
      s.ultimo = null
      pintarSeleccion()
      const aviso = document.getElementById('chq-aviso-seleccion')
      aviso.textContent = 'Se limpió la selección porque cambiaste un filtro.'
      aviso.hidden = false
      clearTimeout(temporizadorAvisoSeleccion)
      temporizadorAvisoSeleccion = setTimeout(() => { aviso.hidden = true }, 5000)
    }

    // La fecha en que el cheque se puede cobrar: la de pago en un diferido, la
    // de emisión en uno común (un común se cobra desde que se emite).
    function fechaDeCobroCheque(ch) {
      return ch.tipo === 'diferido' && esFechaIso(ch.fecha_pago) ? ch.fecha_pago : ch.fecha_emision
    }

    // ── Orden (Parte 3) ──────────────────────────────────────────────────
    // Por defecto, lo que se cobra primero arriba: la fecha de pago, y en un
    // común la de emisión (se cobra desde que se emite). Tocar un encabezado
    // ordena por esa columna; el segundo toque invierte.
    //
    // SE ORDENA EN EL CLIENTE, y es una decisión: el cliente, el banco por su
    // NOMBRE y quién cargó no son columnas de cobranza_cheques, así que un
    // .order() de la base no los puede ordenar. Vale mientras la consulta no
    // llegue al tope de 1000 filas de PostgREST; si llega, la pantalla ya dice
    // que la lista está cortada y además que el orden es solo sobre esas.
    const ORDEN_DEFECTO = { campo: 'pago', sentido: 'asc' }

    // Las columnas ordenables, con el texto de la opción del celular. El tipo
    // dice CÓMO se compara: fechas por fecha, importes por monto, textos con
    // localeCompare en castellano sin distinguir mayúsculas ni acentos.
    const COLUMNAS_ORDEN = [
      { id: 'numero', nombre: 'N° de cheque', tipo: 'texto' },
      { id: 'banco', nombre: 'Banco', tipo: 'texto' },
      { id: 'emision', nombre: 'Emisión', tipo: 'fecha' },
      { id: 'pago', nombre: 'Pago', tipo: 'fecha' },
      { id: 'importe', nombre: 'Importe', tipo: 'numero' },
      { id: 'cliente', nombre: 'Cliente', tipo: 'texto' },
      { id: 'cargo', nombre: 'Cargó', tipo: 'texto' },
      { id: 'estado', nombre: 'Estado', tipo: 'texto' },
    ]

    // El valor por el que se ordena una columna. null = no hay dato, y lo sin
    // dato va SIEMPRE al final, en los dos sentidos: invertir el orden no
    // tiene que subir arriba los cheques sin fecha.
    function valorDeOrden(ch, campo, cobranzas) {
      const cob = cobranzas?.get?.(ch.cobranza_id)
      switch (campo) {
        case 'numero': return ch.numero ? String(ch.numero) : null
        case 'banco': return ch.banco_codigo ? nombreBanco(ch.banco_codigo) : null
        case 'emision': return esFechaIso(ch.fecha_emision) ? ch.fecha_emision : null
        case 'pago': return esFechaIso(fechaDeCobroCheque(ch)) ? fechaDeCobroCheque(ch) : null
        case 'importe': {
          if (ch.importe === null || ch.importe === undefined || ch.importe === '') return null
          const n = Number(ch.importe)
          return Number.isFinite(n) ? n : null
        }
        case 'cliente': return cob?.cliente ? String(cob.cliente) : null
        case 'cargo': return cob?.cargada_por_nombre ? String(cob.cargada_por_nombre) : null
        case 'estado': return ETIQUETA_ESTADO_CHEQUE[ch.estado] ?? (ch.estado ? String(ch.estado) : null)
        default: return null
      }
    }

    function compararValores(a, b, tipo) {
      if (tipo === 'numero') return a === b ? 0 : (a < b ? -1 : 1)
      if (tipo === 'fecha') return a === b ? 0 : (a < b ? -1 : 1)
      return String(a).localeCompare(String(b), 'es', { sensitivity: 'base' })
    }

    // Ordena una COPIA. A igual valor, por fecha de cobro y después por
    // número: el orden no cambia entre una carga y otra.
    function ordenarCheques(filas, orden = ORDEN_DEFECTO, cobranzas = new Map()) {
      const col = COLUMNAS_ORDEN.find(c => c.id === orden?.campo) ?? COLUMNAS_ORDEN.find(c => c.id === ORDEN_DEFECTO.campo)
      const signo = orden?.sentido === 'desc' ? -1 : 1
      const desempate = (a, b) => {
        const fa = valorDeOrden(a, 'pago'), fb = valorDeOrden(b, 'pago')
        if (fa !== fb) {
          if (fa === null) return 1
          if (fb === null) return -1
          return fa < fb ? -1 : 1
        }
        return String(a.numero ?? '').localeCompare(String(b.numero ?? ''))
      }
      return [...filas].sort((a, b) => {
        const va = valorDeOrden(a, col.id, cobranzas), vb = valorDeOrden(b, col.id, cobranzas)
        if (va === null && vb === null) return desempate(a, b)
        if (va === null) return 1
        if (vb === null) return -1
        const c = compararValores(va, vb, col.tipo)
        return c !== 0 ? signo * c : desempate(a, b)
      })
    }

    // Tocar un encabezado: la misma columna invierte; otra columna la
    // reemplaza, ascendente. Devuelve el orden nuevo (no toca el estado).
    function siguienteOrden(actual, campo) {
      if (actual?.campo === campo) return { campo, sentido: actual.sentido === 'asc' ? 'desc' : 'asc' }
      return { campo, sentido: 'asc' }
    }

    // Reordena lo que ya está cargado, sin volver a consultar.
    function aplicarOrden(orden) {
      if (!COLUMNAS_ORDEN.some(c => c.id === orden?.campo)) return
      estado.orden = { campo: orden.campo, sentido: orden.sentido === 'desc' ? 'desc' : 'asc' }
      guardarPreferencias()
      estado.filas = ordenarCheques(estado.filas, estado.orden, estado.cobranzas)
      pintarOrdenMovil()
      renderizarCheques()
    }

    // El selector del celular: cada columna dos veces, una por sentido, con
    // valor "campo:sentido". Las fechas y los importes dicen el sentido en
    // palabras ("más antiguo primero"), los textos A→Z / Z→A.
    const SENTIDO_EN_PALABRAS = {
      fecha: { asc: 'más antiguo primero', desc: 'más nuevo primero' },
      numero: { asc: 'menor primero', desc: 'mayor primero' },
      texto: { asc: 'A → Z', desc: 'Z → A' },
    }
    function pintarOrdenMovil() {
      const sel = document.getElementById('chq-orden-campo')
      sel.innerHTML = COLUMNAS_ORDEN.flatMap(c => ['asc', 'desc'].map(s => {
        const textoOpcion = c.nombre + ' ' + (s === 'asc' ? '▲' : '▼') + ' ' + SENTIDO_EN_PALABRAS[c.tipo][s]
        return `<option value="${esc(c.id + ':' + s)}">${esc(textoOpcion)}</option>`
      })).join('')
      sel.value = `${estado.orden.campo}:${estado.orden.sentido}`
    }

    // Cuánto hay en cartera. Se suma en CENTAVOS: sumar decimales de a uno
    // arrastra error de punto flotante en una pantalla de plata.
    function resumenCartera(filas) {
      let centavos = 0, cantidad = 0
      for (const ch of filas) {
        if (ch.estado !== 'en_cartera') continue
        cantidad++
        centavos += Math.round(Number(ch.importe) * 100)
      }
      return { cantidad, total: centavos / 100 }
    }

    // UNA SOLA CONSULTA, SIN NINGÚN FILTRO, arma dos cosas: el total en
    // cartera y la lista del selector de banco.
    //
    // LA LISTA DE BANCOS SALE DE TODOS LOS CHEQUES QUE LA PERSONA PUEDE VER.
    // Si se derivara de los cheques que quedaron después de filtrar, poner un
    // filtro BORRARÍA bancos del selector sin que nada lo avise. Por eso hay
    // UNA SOLA FUNCIÓN que la arma, y la llaman la carga inicial y
    // refrescarTodo() después de dar salida o volver a cartera.
    async function cargarResumenCheques() {
      try {
        const { data, error } = await supabase
          .from('cobranza_cheques').select('id, banco_codigo, estado, importe, tipo, fecha_emision, fecha_pago')
        if (error) throw error
        const filas = data ?? []
        estado.cartera = resumenCartera(filas)
        estado.vencimientos = resumenVencimientos(filas, hoyArgentina())
        estado.topeResumen = filas.length >= TOPE_FILAS_POSTGREST
        const codigos = [...new Set(filas.map(x => String(x.banco_codigo ?? '')).filter(Boolean))]
        estado.bancosDeCheques = codigos.sort((a, b) => nombreBanco(a).localeCompare(nombreBanco(b), 'es'))
      } catch (err) {
        console.error('No se pudo calcular la cartera de cheques:', err)
        // null y NO cero: un total que no se pudo calcular no es "$ 0,00".
        estado.cartera = null
        estado.vencimientos = null
      }
      pintarSelectorBancos()
      pintarCartera()
    }

    function pintarSelectorBancos() {
      const sel = document.getElementById('chq-filtro-banco')
      const elegido = estado.filtros.banco
      const codigos = [...estado.bancosDeCheques]
      // Si el banco elegido ya no tiene cheques a la vista, se deja como
      // opción igual: si no, el selector diría "Todos" con el filtro puesto.
      if (elegido && !codigos.includes(elegido)) codigos.push(elegido)
      sel.innerHTML = '<option value="">Todos</option>' +
        codigos.map(c => `<option value="${esc(c)}">${esc(nombreBanco(c))}</option>`).join('')
      sel.value = elegido || ''
      // Sin ningún cheque a la vista, un selector vacío es ruido.
      document.getElementById('chq-campo-banco').hidden = codigos.length === 0
    }

    function pintarCartera() {
      const caja = document.getElementById('chq-cartera')
      caja.innerHTML = htmlCartera(estado.cartera, hayFiltrosCheques(), estado.topeResumen) +
        htmlAvisoVencimientos(estado.vencimientos, !!estado.filtros.soloVencen)
      const btn = caja.querySelector('[data-ver-vencen]')
      if (btn) btn.addEventListener('click', alternarSoloVencen)
    }

    // Junto al total: "3 cheques vencen esta semana · $ TOTAL", tocable. Si no
    // hay ninguno no se dibuja (un aviso en cero entrena a ignorarlo), salvo
    // que el filtro esté puesto: ahí hace falta el botón para sacarlo.
    function htmlAvisoVencimientos(v, activo) {
      if (!v || (!v.cantidad && !activo)) return ''
      const cheques = v.cantidad === 1 ? '1 cheque vence' : `${v.cantidad} cheques vencen`
      const vencidos = v.vencidos ? ` (${v.vencidos === 1 ? '1 ya vencido' : `${v.vencidos} ya vencidos`})` : ''
      const texto = `${cheques} esta semana${vencidos} · ${formatearImporte(v.total)}`
      return `<button type="button" class="chq-vencen${v.vencidos ? ' chq-vencen--vencido' : ''}" data-ver-vencen aria-pressed="${activo ? 'true' : 'false'}">
          <span class="chq-vencen__texto">${esc(texto)}</span>
          <span class="chq-vencen__accion">${activo ? 'Ver todos' : 'Ver solo esos'}</span>
        </button>`
    }

    // Función pura, para ejecutarla en la suite.
    function htmlCartera(cartera, conFiltros, tope) {
      if (!cartera) {
        return '<div class="chq-cartera__sub">No se pudo calcular el total en cartera. Revisá la señal.</div>'
      }
      const cantidadCartera = cartera.cantidad
      const notas = []
      // El total NO sigue a los filtros: responde "cuánto tengo en cartera".
      if (conFiltros) notas.push('Es el total de toda la cartera, no de los filtros de abajo.')
      if (tope) notas.push(`Se sumaron los primeros ${TOPE_FILAS_POSTGREST} cheques: el total puede estar incompleto.`)
      return `
        <div class="chq-cartera__k">En cartera</div>
        <div class="chq-cartera__v">${esc(formatearImporte(cartera.total))}</div>
        <div class="chq-cartera__sub">${cantidadCartera} ${cantidadCartera === 1 ? 'cheque' : 'cheques'}</div>
        ${notas.map(t => `<div class="chq-cartera__sub">${esc(t)}</div>`).join('')}`
    }

    // El segmentado de estado, el aviso del número y el botón de limpiar.
    function pintarFiltrosCheques() {
      const f = estado.filtros
      const cont = document.getElementById('chq-chips-estado')
      cont.innerHTML = ESTADOS_FILTRO_CHEQUES.map(e => `
        <button type="button" class="chq-segmento__opcion ${f.estado === e.id ? 'chq-segmento__opcion--activo' : ''}" aria-pressed="${f.estado === e.id ? 'true' : 'false'}" data-estado-cheque="${esc(e.id)}">${esc(e.nombre)}</button>
      `).join('')
      cont.querySelectorAll('[data-estado-cheque]').forEach(b => {
        b.addEventListener('click', () => {
          estado.filtros.estado = b.dataset.estadoCheque
          // "Solo los que vencen" es un recorte de la cartera: cambiar de
          // estado lo saca.
          estado.filtros.soloVencen = false
          guardarPreferencias()
          soltarSeleccionPorFiltro()
          cargarCheques()
        })
      })
      // El aviso va por textContent: es texto, no HTML.
      const caja = document.getElementById('chq-aviso-numero')
      const aviso = filtroNumeroCheque(f.numero).aviso
      caja.textContent = aviso
      caja.hidden = !aviso
      // Solo con algún filtro distinto del de arranque.
      document.getElementById('chq-btn-limpiar').hidden = !hayFiltrosCheques()
      pintarCartera()
    }

    // Limpia TODOS los filtros, en el estado Y en los campos. Si quedara uno en
    // el campo y no en el estado (o al revés), la pantalla diría una cosa y la
    // consulta haría otra.
    function limpiarFiltrosCheques() {
      estado.filtros = { ...FILTROS_CHEQUES_DEFECTO, soloVencen: false }
      document.getElementById('chq-filtro-numero').value = ''
      document.getElementById('chq-filtro-banco').value = ''
      guardarPreferencias()
      soltarSeleccionPorFiltro()
      cargarCheques()
    }

    // Contador de turno: si los filtros cambian mientras una consulta está en
    // vuelo, la respuesta vieja NO pisa a la nueva.
    let turnoCheques = 0

    async function cargarCheques() {
      const turno = ++turnoCheques
      pintarFiltrosCheques()
      const { q, sinResultados } = aplicarFiltrosCheques(
        supabase.from('cobranza_cheques').select(
          'id, cobranza_id, foto_id, banco_codigo, numero, tipo, fecha_emision, fecha_pago, importe, estado, salida_fecha, salida_destino'),
        estado.filtros)
      if (sinResultados) {
        estado.filas = []; estado.error = null; estado.tope = false
        renderizarCheques()
        return
      }
      try {
        // El cliente de cada cheque sale de OTRA consulta y no de un embed.
        // Se traen todas las cobranzas visibles y no un .in() con los ids,
        // que tiene tope por el largo de la URL.
        const [ch, cob] = await Promise.all([
          q,
          // v_cobranzas y no cobranzas: trae además el NOMBRE de quien la cargó
          // (cargada_por_nombre), resuelto por la vista contra
          // v_empleados_publico. Nunca un embed a empleados, cuyo RLS solo deja
          // leer la fila propia. La vista es security_invoker: ve lo mismo que
          // cobranzas.
          supabase.from('v_cobranzas').select('id, cliente, estado, fecha, cargada_por_nombre'),
        ])
        if (turno !== turnoCheques) return
        if (ch.error) throw ch.error
        if (cob.error) throw cob.error
        const filas = ch.data ?? []
        const cobs = cob.data ?? []
        estado.filas = ordenarCheques(filas, estado.orden, new Map(cobs.map(x => [x.id, x])))
        estado.cobranzas = new Map(cobs.map(x => [x.id, x]))
        estado.tope = filas.length >= TOPE_FILAS_POSTGREST || cobs.length >= TOPE_FILAS_POSTGREST
        estado.error = null
      } catch (err) {
        if (turno !== turnoCheques) return
        console.error('No se pudieron cargar los cheques:', err)
        // Se vacía la tabla: dejar las filas de OTRO filtro bajo el filtro
        // nuevo sería mostrar algo que no es lo que se pidió.
        estado.filas = []
        estado.error = 'No se pudieron cargar los cheques. Revisá la señal.'
        estado.tope = false
      }
      renderizarCheques()
    }

    function renderizarCheques() {
      const aviso = document.getElementById('chq-aviso')
      const lineas = []
      if (estado.error) lineas.push(estado.error)
      if (estado.tope) lineas.push(`Hay más de ${TOPE_FILAS_POSTGREST} filas y se muestran las primeras: afiná la búsqueda. El orden es solo sobre esas.`)
      // LA CARTERA DE QUIEN NO TIENE ver_todo ESTÁ INCOMPLETA, y se dice. La
      // policy de cobranzas deja leer solo las propias sin esa tarea
      // (cobranzas: leer propias o con ver_todo), así que alguien con solo
      // `procesar` vería nada más que los cheques de lo que cargó. Un listado
      // incompleto que no se declara es peor que no tener el dato.
      if (!tieneTarea('ver_todo')) lineas.push(AVISO_CARTERA_PARCIAL)
      aviso.textContent = lineas.join('\n')
      aviso.hidden = lineas.length === 0

      const caja = document.getElementById('chq-tabla-caja')
      const tabla = document.getElementById('chq-tabla')
      const vacio = document.getElementById('chq-vacio')
      const lista = document.getElementById('chq-lista')
      const visibles = filasVisibles()
      if (estado.error || !visibles.length) {
        caja.hidden = true
        tabla.innerHTML = ''
        lista.hidden = true
        lista.innerHTML = ''
        vacio.hidden = !!estado.error
        vacio.textContent = estado.filtros.soloVencen ? 'No hay cheques en cartera que venzan esta semana.'
          : hayFiltrosCheques() ? 'No hay cheques con esos filtros.' : 'No hay cheques en cartera.'
        return
      }
      vacio.hidden = true
      caja.hidden = false
      lista.hidden = false
      tabla.innerHTML = htmlTablaCheques(visibles, estado.cobranzas)
      lista.innerHTML = htmlListaCheques(visibles, estado.cobranzas)
      // Tocar un encabezado ordena por esa columna.
      tabla.querySelectorAll('[data-orden]').forEach(b => b.addEventListener('click', () => {
        aplicarOrden(siguienteOrden(estado.orden, b.dataset.orden))
      }))
      conectarFilas(tabla)
      conectarFilas(lista)
      if (estado.destacado) {
        // La que está a la vista: en escritorio la fila, en el celular la
        // tarjeta (la otra está escondida por el CSS y no tiene dónde ir).
        const candidatas = document.querySelectorAll(`[data-cheque-fila="${CSS.escape(estado.destacado)}"]`)
        const fila = [...candidatas].find(el => el.offsetParent !== null)
        if (fila && typeof fila.scrollIntoView === 'function') fila.scrollIntoView({ block: 'center' })
      }
    }

    function htmlListaCheques(filas, cobranzas) {
      return filas.map(ch => htmlTarjetaCheque(ch, cobranzas.get(ch.cobranza_id))).join('')
    }

    // Tocar una fila o una tarjeta abre la cobranza; sus botones hacen lo suyo.
    function conectarFilas(cont) {
      cont.querySelectorAll('[data-cheque-fila]').forEach(tr => {
        // Con la selección activa, tocar el cheque lo elige (y no abre la
        // cobranza); sin ella, abre la cobranza como siempre.
        const tocar = (conShift) => {
          if (estado.seleccion.activa) tocarParaElegir(tr.dataset.chequeFila, conShift)
          else abrirCobranza(tr.dataset.chequeCobranza)
        }
        tr.addEventListener('click', (ev) => {
          // La casilla cambia sola al tocarla; se deja que decida la fila.
          if (ev.target?.matches?.('[data-elegir-cheque]')) ev.preventDefault()
          tocar(!!ev.shiftKey)
        })
        tr.addEventListener('keydown', (ev) => {
          // Solo la fila misma: un Enter sobre el botón de adentro burbujea.
          if (ev.target !== tr) return
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tocar(!!ev.shiftKey) }
        })
      })
      // Los botones de la fila NO abren la cobranza: stopPropagation.
      cont.querySelectorAll('[data-dar-salida]').forEach(b => b.addEventListener('click', (ev) => {
        ev.stopPropagation(); abrirModalSalida(b.dataset.darSalida)
      }))
      cont.querySelectorAll('[data-volver-cartera]').forEach(b => b.addEventListener('click', (ev) => {
        ev.stopPropagation(); abrirVolverACartera(b.dataset.volverCartera)
      }))
    }

    // Tocar un cheque abre su cobranza en Cobranzas, que sabe volver acá.
    function abrirCobranza(cobranzaId) {
      if (!cobranzaId) return
      window.location.href = urlDeCobranza(cobranzaId, window.location.href)
    }

    // Función pura de la tabla, para EJECUTARLA en la suite.
    function htmlTablaCheques(filas, cobranzas) {
      return `
        <thead>
          <tr>
            ${estado.seleccion.activa ? '<th scope="col" class="chq-tabla__elegir"><span class="chq-oculto">Elegir</span></th>' : ''}
            ${htmlEncabezadoOrden('numero', 'N&deg; de cheque')}
            ${htmlEncabezadoOrden('banco', 'Banco')}
            ${htmlEncabezadoOrden('emision', 'Emisión')}
            ${htmlEncabezadoOrden('pago', 'Pago')}
            ${htmlEncabezadoOrden('importe', 'Importe', 'chq-tabla__num')}
            ${htmlEncabezadoOrden('cliente', 'Cliente')}
            ${htmlEncabezadoOrden('cargo', 'Cargó')}
            ${htmlEncabezadoOrden('estado', 'Estado')}
            <th scope="col">Salida</th>
          </tr>
        </thead>
        <tbody>${filas.map(ch => htmlFilaCheque(ch, cobranzas.get(ch.cobranza_id))).join('')}</tbody>`
    }

    // Un encabezado ordenable: un botón adentro del <th>, con la flecha y el
    // aria-sort. `rotulo` es HTML CONSTANTE del código (lleva &deg;), nunca un
    // dato.
    function htmlEncabezadoOrden(campo, rotulo, clase = '') {
      const activo = estado.orden?.campo === campo
      const sentido = activo ? estado.orden.sentido : null
      const ariaSort = !activo ? 'none' : sentido === 'desc' ? 'descending' : 'ascending'
      const flecha = !activo ? '' : sentido === 'desc' ? '▼' : '▲'
      return `<th scope="col" class="${esc(clase)}" aria-sort="${esc(ariaSort)}"><button type="button" class="chq-th-orden${activo ? ' chq-th-orden--activo' : ''}" data-orden="${esc(campo)}">${rotulo}<span class="chq-th-orden__flecha" aria-hidden="true">${esc(flecha)}</span></button></th>`
    }

    function htmlFilaCheque(ch, cob) {
      const salido = ch.estado === 'depositado' || ch.estado === 'endosado'
      // Un cheque común no tiene fecha de pago: es "a la vista".
      const pago = ch.tipo === 'diferido' ? formatearFechaCob(ch.fecha_pago) : 'A la vista'
      const etiqueta = ETIQUETA_ESTADO_CHEQUE[ch.estado] ?? ch.estado
      const venc = estadoVencimiento(ch, hoyArgentina())
      const clases = [
        salido ? 'chq-tabla__fila--salido' : ch.estado === 'anulado' ? 'chq-tabla__fila--anulado' : '',
        venc ? (venc.nivel === 'vencido' ? 'chq-tabla__fila--vencido' : 'chq-tabla__fila--vence') : '',
        ch.id === estado.destacado ? 'chq-tabla__fila--destacada' : '',
        estado.seleccion.ids.has(ch.id) ? 'chq-tabla__fila--elegida' : '',
        estado.seleccion.noPueden?.has(ch.id) ? 'chq-tabla__fila--no-sale' : '',
      ].filter(Boolean).join(' ')
      // Por vencer: la fecha de pago en bordó y negrita, y debajo la etiqueta.
      const celdaPago = venc
        ? `<span class="chq-vence__fecha">${esc(pago)}</span><span class="chq-vence__etiqueta">${esc(textoVencimiento(venc))}</span>`
        : esc(pago)
      return `
        <tr class="${esc(clases)}" data-cheque-fila="${esc(ch.id)}" data-cheque-cobranza="${esc(ch.cobranza_id)}" tabindex="0"${htmlAriaElegido(ch)}>
          ${estado.seleccion.activa ? `<td class="chq-tabla__elegir">${htmlCasillaElegir(ch)}</td>` : ''}
          <td>${esc(ch.numero ?? '—')}</td>
          <td class="chq-tabla__texto chq-tabla__banco" title="${esc(nombreBanco(ch.banco_codigo))}">${esc(nombreBanco(ch.banco_codigo))}</td>
          <td class="chq-tabla__fecha">${esc(formatearFechaCob(ch.fecha_emision))}</td>
          <td class="chq-tabla__fecha chq-tabla__pago">${celdaPago}</td>
          <td class="chq-tabla__num">${esc(formatearImporte(ch.importe))}</td>
          <td class="chq-tabla__texto" title="${esc(cob?.cliente ?? '')}">${esc(cob?.cliente ?? '—')}</td>
          <td class="chq-tabla__persona" title="${esc(cob?.cargada_por_nombre ?? '')}">${esc(cob?.cargada_por_nombre ?? '—')}</td>
          <td><span class="chq-estado chq-estado--${esc(ch.estado)}">${esc(etiqueta)}</span></td>
          <td class="chq-tabla__salida">${htmlSalidaCheque(ch, cob)}</td>
        </tr>`
    }

    // LA COLUMNA "SALIDA" (Parte 2, 22/09/2026). Antes el botón "Salió" iba
    // debajo del número, en la columna fija, y estiraba la fila al doble. Ahora
    // todo lo de la salida vive en su columna, en UN renglón, así todas las
    // filas miden lo mismo:
    //   - en cartera, cobranza asentada, con `procesar` → botón "Dar salida";
    //   - en cartera, cobranza por controlar, con `procesar` → el texto chico
    //     "Asentá la cobranza para darle salida" (la RPC rechaza la salida de
    //     un cheque de una cobranza sin asentar: un botón ahí siempre fallaría);
    //   - ya salió → la fecha y el destino, y con `procesar` "Volver a
    //     cartera" (la RPC no mira el estado de la cobranza). Sin la tarea se
    //     ven igual la fecha y el destino: es información, no una acción;
    //   - sin permiso, un anulado o una cobranza que no se ve → "—".
    // QUÉ SE PUEDE HACER con la salida de un cheque. La deciden acá, en UN solo
    // lugar, la tabla de escritorio y la tarjeta del celular:
    //   'dar'    → en cartera, cobranza asentada, con `procesar`
    //   'nota'   → en cartera, cobranza por controlar, con `procesar`
    //   'volver' → ya salió, con `procesar`
    //   null     → nada (sin permiso, anulado, cobranza que no se ve)
    function accionSalida(ch, cob) {
      const salido = ch.estado === 'depositado' || ch.estado === 'endosado'
      if (salido) return puedeProcesar() ? 'volver' : null
      if (ch.estado !== 'en_cartera' || !puedeProcesar()) return null
      if (cob?.estado === 'procesada') return 'dar'
      if (cob?.estado === 'registrada') return 'nota'
      return null
    }

    // El botón (o el texto) de esa acción. '' si no hay ninguna.
    function htmlAccionSalida(ch, accion) {
      if (accion === 'dar') return `<button type="button" class="chq-btn chq-btn--chico chq-btn--salida" data-dar-salida="${esc(ch.id)}">Dar salida</button>`
      if (accion === 'volver') return `<button type="button" class="chq-btn chq-btn--chico" data-volver-cartera="${esc(ch.id)}">Volver a cartera</button>`
      if (accion === 'nota') return '<span class="chq-salida__nota">Asentá la cobranza para darle salida</span>'
      return ''
    }

    // La fecha y el destino de un cheque que salió, en una línea de texto
    // plano. El destino lo TIPEA una persona: quien la muestre, la escapa.
    function textoSalidaCorto(ch) {
      return [formatearFechaCob(ch.salida_fecha), String(ch.salida_destino ?? '').trim()].filter(Boolean).join(' · ')
    }

    function htmlSalidaCheque(ch, cob) {
      const salido = ch.estado === 'depositado' || ch.estado === 'endosado'
      const accion = accionSalida(ch, cob)
      if (salido) {
        const texto = textoSalidaCorto(ch)
        return `<div class="chq-salida"><span class="chq-salida__texto" title="${esc(texto)}">${esc(texto)}</span>${htmlAccionSalida(ch, accion)}</div>`
      }
      return htmlAccionSalida(ch, accion) || '—'
    }

    // ── La tarjeta del celular (Parte 5) ─────────────────────────────────
    // DOS RENGLONES, para que entren al menos seis cheques en una pantalla de
    // 390px:
    //   arriba: el importe, grande, y cuándo se cobra ("a la vista" si es
    //           común); el estado, chiquito, a la derecha;
    //   abajo:  chico y gris, "Nº 00000353 · Santander · JyM" — el banco se
    //           corta con puntos suspensivos y el nombre entero va en title.
    // A la derecha de la tarjeta, lo mismo que la columna Salida de la tabla:
    // el botón o el texto, con 44px de alto. Sin acción no se dibuja nada: un
    // "—" solo en el costado de una tarjeta no dice nada.
    // dd/mm/aa, para la tarjeta del celular. Una fecha que no es válida dice
    // "—", igual que formatearFechaCob.
    function fechaCorta(iso) {
      if (!esFechaIso(iso)) return '—'
      const [a, m, d] = iso.split('-')
      return `${d}/${m}/${a.slice(2)}`
    }

    // La casilla de un cheque, con la selección activa. El texto para el
    // lector de pantalla dice qué cheque es.
    function htmlCasillaElegir(ch) {
      const marcado = estado.seleccion.ids.has(ch.id)
      const nombreCasilla = 'Elegir el cheque Nº ' + (ch.numero ?? '—')
      return `<input type="checkbox" class="chq-casilla" data-elegir-cheque="${esc(ch.id)}" aria-label="${esc(nombreCasilla)}"${marcado ? ' checked' : ''} tabindex="-1">`
    }

    // aria-selected solo con la selección activa (sin ella no hay nada que
    // elegir y el atributo diría algo falso).
    function htmlAriaElegido(ch) {
      if (!estado.seleccion.activa) return ''
      return ` aria-selected="${estado.seleccion.ids.has(ch.id) ? 'true' : 'false'}"`
    }

    function htmlTarjetaCheque(ch, cob) {
      const salido = ch.estado === 'depositado' || ch.estado === 'endosado'
      // La fecha corta (dd/mm/aa): con el año entero no entraba al lado de un
      // importe de millones y se cortaba a la mitad del año.
      const pago = ch.tipo === 'diferido' ? `paga ${fechaCorta(ch.fecha_pago)}` : 'a la vista'
      const banco = nombreBanco(ch.banco_codigo)
      const cliente = cob?.cliente ?? '—'
      const etiqueta = ETIQUETA_ESTADO_CHEQUE[ch.estado] ?? ch.estado
      // Un cheque que salió muestra CUÁNDO y A QUIÉN en lugar del cliente: el
      // renglón no da para los dos, y el cliente está en la cobranza.
      const salida = salido ? textoSalidaCorto(ch) : ''
      const venc = estadoVencimiento(ch, hoyArgentina())
      const clases = [
        'chq-tarjeta',
        salido ? 'chq-tarjeta--salido' : ch.estado === 'anulado' ? 'chq-tarjeta--anulado' : '',
        venc ? (venc.nivel === 'vencido' ? 'chq-tarjeta--vencido' : 'chq-tarjeta--vence') : '',
        ch.id === estado.destacado ? 'chq-tarjeta--destacada' : '',
        estado.seleccion.ids.has(ch.id) ? 'chq-tarjeta--elegida' : '',
        estado.seleccion.noPueden?.has(ch.id) ? 'chq-tarjeta--no-sale' : '',
      ].filter(Boolean).join(' ')
      const accion = htmlAccionSalida(ch, accionSalida(ch, cob))
      return `
        <div class="${esc(clases)}" data-cheque-fila="${esc(ch.id)}" data-cheque-cobranza="${esc(ch.cobranza_id)}" tabindex="0"${htmlAriaElegido(ch)}>
          ${estado.seleccion.activa ? `<div class="chq-tarjeta__elegir">${htmlCasillaElegir(ch)}</div>` : ''}
          <div class="chq-tarjeta__cuerpo">
            <div class="chq-tarjeta__l1">
              <span class="chq-tarjeta__importe">${esc(formatearImporte(ch.importe))}</span>
              <span class="chq-tarjeta__pago">${esc(pago)}</span>
            </div>
            <div class="chq-tarjeta__l2">${venc ? `<span class="chq-tarjeta__dato chq-vence__etiqueta" title="${esc(textoVencimiento(venc))}">${esc(textoVencimientoCorto(venc))}</span>` : ''}${salida ? `<span class="chq-tarjeta__dato chq-tarjeta__salida" title="${esc(salida)}">${esc(salida)}</span>` : ''}<span class="chq-tarjeta__dato chq-tarjeta__num">Nº ${esc(ch.numero ?? '—')}</span><span class="chq-tarjeta__dato chq-tarjeta__banco" title="${esc(banco)}">${esc(banco)}</span>${salido ? '' : `<span class="chq-tarjeta__dato chq-tarjeta__cliente" title="${esc(cliente)}">${esc(cliente)}</span>`}<span class="chq-estado chq-estado--${esc(ch.estado)} chq-tarjeta__estado">${esc(etiqueta)}</span></div>
          </div>
          ${accion ? `<div class="chq-tarjeta__lado">${accion}</div>` : ''}
        </div>`
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SALIDA DE UN CHEQUE
    // Depositado o endosado. SOLO EL ENDOSADO va a descontar la cuenta
    // corriente de un proveedor el día que se conecte con Cuentas Corrientes:
    // por eso el destino es obligatorio ahí y opcional en un depósito.
    // ═══════════════════════════════════════════════════════════════════════

    const LARGO_MAXIMO_DESTINO = 150

    // Lo que se valida ANTES de llamar, con las MISMAS reglas que
    // marcar_salida_cheque: una validación más permisiva deja pasar lo que el
    // servidor rechaza, y una más estricta bloquea lo que sí entra.
    function erroresSalida({ tipo, fecha, destino }, fechaCobranza, hoy) {
      const e = []
      if (tipo !== 'depositado' && tipo !== 'endosado') e.push('Elegí si se depositó o se endosó.')
      if (!esFechaIso(fecha)) e.push('Falta la fecha.')
      else {
        if (diasEntre(hoy, fecha) > 0) e.push('La fecha no puede ser posterior a hoy.')
        if (esFechaIso(fechaCobranza) && diasEntre(fechaCobranza, fecha) < 0) {
          e.push(`La fecha no puede ser anterior a la cobranza (${formatearFechaCob(fechaCobranza)}).`)
        }
      }
      const d = String(destino ?? '').trim()
      if (tipo === 'endosado' && !d) e.push('Escribí a quién se lo pasaste.')
      if (d.length > LARGO_MAXIMO_DESTINO) e.push(`El destino no puede tener más de ${LARGO_MAXIMO_DESTINO} caracteres.`)
      return e
    }

    // Los parámetros tal cual viajan. Un destino vacío va como null.
    function parametrosSalida(chequeId, { tipo, fecha, destino }) {
      return { p_cheque_id: chequeId, p_tipo: tipo, p_fecha: fecha, p_destino: textoOpcional(destino) }
    }

    function abrirModalSalida(chequeId) {
      const ch = estado.filas.find(x => x.id === chequeId)
      if (!ch) return
      const cob = estado.cobranzas.get(ch.cobranza_id) ?? null
      estado.salida = { cheque: ch, cobranza: cob, tipo: null }
      document.getElementById('chq-salida-titulo').textContent = 'Salida del cheque'
      // textContent: el cliente va crudo acá, no es HTML.
      document.getElementById('chq-salida-cheques').textContent =
        `N° ${ch.numero ?? '—'} · ${nombreBanco(ch.banco_codigo)} · ${formatearImporte(ch.importe)}${cob?.cliente ? ` · ${cob.cliente}` : ''}`
      const fecha = document.getElementById('chq-salida-fecha')
      fecha.value = hoyArgentina()
      fecha.max = hoyArgentina()
      fecha.min = esFechaIso(cob?.fecha) ? cob.fecha : ''
      document.getElementById('chq-salida-destino').value = ''
      pintarModalSalida()
      document.getElementById('chq-modal-salida').hidden = false
    }

    function cerrarModalSalida() {
      document.getElementById('chq-modal-salida').hidden = true
      estado.salida = null
    }

    // Lo que cambia según el tipo elegido: el botón marcado, la pregunta del
    // destino y si es obligatorio. El error se limpia: era sobre otro estado.
    function pintarModalSalida() {
      const s = estado.salida
      if (!s) return
      document.querySelectorAll('[data-salida-tipo]').forEach(b => {
        b.classList.toggle('chq-btn--elegido', b.dataset.salidaTipo === s.tipo)
      })
      document.getElementById('chq-salida-campo-destino').hidden = !s.tipo
      document.getElementById('chq-salida-label-destino').textContent =
        s.tipo === 'endosado' ? '¿A quién se lo pasaste?' : '¿En qué banco o cuenta? (opcional)'
      document.getElementById('chq-salida-ayuda-destino').textContent =
        s.tipo === 'endosado' ? 'Obligatorio: el nombre de quien lo recibió.' : 'Si no lo sabés, dejalo vacío.'
      document.getElementById('chq-salida-error').hidden = true
    }

    async function confirmarSalida() {
      const s = estado.salida
      if (!s) return
      const datos = {
        tipo: s.tipo,
        fecha: document.getElementById('chq-salida-fecha').value,
        destino: document.getElementById('chq-salida-destino').value,
      }
      const err = document.getElementById('chq-salida-error')
      const errores = erroresSalida(datos, s.cobranza?.fecha, hoyArgentina())
      if (errores.length) {
        err.textContent = errores.join(' ')
        err.hidden = false
        return
      }
      const btn = document.getElementById('chq-salida-confirmar')
      btn.disabled = true
      try {
        if (s.lote) {
          // TODO O NADA: si la base rechaza, no salió ninguno y el mensaje dice
          // cuál y por qué ("No salió ninguno. El cheque 007 Nº … no puede
          // salir: …"). Se muestra ENTERO.
          const ids = s.cheques.map(ch => ch.id)
          const { data, error } = await supabase.rpc('marcar_salida_cheques', parametrosSalidaLote(ids, datos))
          if (error) throw error
          const n = Number.isInteger(data) ? data : ids.length
          cerrarModalSalida()
          cancelarSeleccion()
          mostrarExito(n === 1 ? 'Salió 1 cheque.' : `Salieron ${n} cheques.`)
          await refrescarTodo()
          return
        }
        const { error } = await supabase.rpc('marcar_salida_cheque', parametrosSalida(s.cheque.id, datos))
        if (error) throw error
        cerrarModalSalida()
        mostrarExito(datos.tipo === 'endosado' ? 'Cheque marcado como endosado.' : 'Cheque marcado como depositado.')
        await refrescarTodo()
      } catch (e) {
        console.error(s.lote ? 'Falló marcar_salida_cheques:' : 'Falló marcar_salida_cheque:', e)
        // El mensaje del servidor ya viene en castellano: se muestra TAL CUAL.
        err.textContent = e?.message || 'No se pudo marcar la salida.'
        err.hidden = false
      } finally {
        btn.disabled = false
      }
    }

    // ── Volver a cartera: pide un motivo en un diálogo propio ─────────────

    let accionDelMotivo = null

    function abrirModalMotivo({ titulo, etiqueta, alConfirmar }) {
      document.getElementById('chq-motivo-titulo').textContent = titulo
      document.getElementById('chq-motivo-label').textContent = etiqueta
      document.getElementById('chq-motivo-texto').value = ''
      document.getElementById('chq-motivo-error').hidden = true
      accionDelMotivo = alConfirmar
      document.getElementById('chq-modal-motivo').hidden = false
    }

    function cerrarModalMotivo() {
      document.getElementById('chq-modal-motivo').hidden = true
      accionDelMotivo = null
    }

    function abrirVolverACartera(chequeId) {
      const ch = estado.filas.find(x => x.id === chequeId)
      if (!ch) return
      abrirModalMotivo({
        titulo: `Volver a cartera el cheque N° ${ch.numero ?? '—'}`,
        etiqueta: 'Por qué vuelve a cartera',
        alConfirmar: async (motivo) => {
          try {
            const { error } = await supabase.rpc('volver_cheque_a_cartera', { p_cheque_id: ch.id, p_motivo: motivo })
            if (error) throw error
            cerrarModalMotivo()
            mostrarExito('El cheque volvió a cartera.')
            await refrescarTodo()
          } catch (e) {
            console.error('Falló volver_cheque_a_cartera:', e)
            // El mensaje de la base, entero.
            mostrarError(e?.message || 'No se pudo volver el cheque a cartera.')
          }
        },
      })
    }

    // Después de dar salida o volver a cartera: la lista, el total y los
    // bancos. Una sola función, así los dos caminos no divergen.
    async function refrescarTodo() {
      await Promise.all([cargarCheques(), cargarResumenCheques()])
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PREFERENCIAS DE ESTA PERSONA (filtros), en sessionStorage
    // Tocar un cheque abre Cobranzas y "Volver" trae de vuelta acá: sin esto
    // los filtros se perderían en cada ida y vuelta. Es una comodidad por
    // pestaña; si el navegador no deja guardar, se arranca con los de siempre.
    // ═══════════════════════════════════════════════════════════════════════

    const CLAVE_PREFERENCIAS = 'cheques-preferencias'

    function guardarPreferencias() {
      try {
        sessionStorage.setItem(CLAVE_PREFERENCIAS, JSON.stringify({ filtros: estado.filtros, orden: estado.orden }))
      } catch { /* sin almacenamiento: no pasa nada */ }
    }

    function leerPreferencias() {
      try {
        const p = JSON.parse(sessionStorage.getItem(CLAVE_PREFERENCIAS) || 'null')
        const o = p?.orden
        if (o && COLUMNAS_ORDEN.some(c => c.id === o.campo)) {
          estado.orden = { campo: o.campo, sentido: o.sentido === 'desc' ? 'desc' : 'asc' }
        }
        const f = p?.filtros
        if (!f) return
        if (ESTADOS_FILTRO_CHEQUES.some(e => e.id === f.estado)) estado.filtros.estado = f.estado
        estado.filtros.numero = typeof f.numero === 'string' ? f.numero : ''
        estado.filtros.banco = typeof f.banco === 'string' && /^[0-9]{3}$/.test(f.banco) ? f.banco : ''
        estado.filtros.soloVencen = f.soloVencen === true
      } catch { /* datos viejos o ilegibles: se ignoran */ }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CONEXIONES
    // ═══════════════════════════════════════════════════════════════════════

    function conectarTodo() {
      let temporizadorCheque = null
      document.getElementById('chq-filtro-numero').addEventListener('input', (ev) => {
        estado.filtros.numero = ev.target.value
        guardarPreferencias()
        soltarSeleccionPorFiltro()
        // El aviso se pinta en el acto —sin esperar el debounce—.
        pintarFiltrosCheques()
        clearTimeout(temporizadorCheque)
        temporizadorCheque = setTimeout(cargarCheques, 350)
      })
      document.getElementById('chq-filtro-banco').addEventListener('change', (ev) => {
        estado.filtros.banco = ev.target.value
        guardarPreferencias()
        soltarSeleccionPorFiltro()
        cargarCheques()
      })
      document.getElementById('chq-orden-campo').addEventListener('change', (ev) => {
        const [campo, sentido] = String(ev.target.value).split(':')
        aplicarOrden({ campo, sentido })
      })
      document.getElementById('chq-btn-limpiar').addEventListener('click', () => {
        clearTimeout(temporizadorCheque)
        limpiarFiltrosCheques()
      })

      // ── Diálogo de salida ──
      document.querySelectorAll('[data-salida-tipo]').forEach(b => b.addEventListener('click', () => {
        if (!estado.salida) return
        estado.salida.tipo = b.dataset.salidaTipo
        pintarModalSalida()
        if (!document.getElementById('chq-salida-campo-destino').hidden) document.getElementById('chq-salida-destino').focus()
      }))
      document.getElementById('chq-salida-cancelar').addEventListener('click', cerrarModalSalida)
      document.getElementById('chq-salida-confirmar').addEventListener('click', confirmarSalida)

      // ── Diálogo de motivo ──
      document.getElementById('chq-motivo-cancelar').addEventListener('click', cerrarModalMotivo)
      document.getElementById('chq-motivo-confirmar').addEventListener('click', () => {
        const texto = document.getElementById('chq-motivo-texto').value.trim()
        if (!texto) {
          const err = document.getElementById('chq-motivo-error')
          err.hidden = false
          err.textContent = 'El motivo es obligatorio.'
          return
        }
        if (accionDelMotivo) accionDelMotivo(texto)
      })

      // Escape cierra el diálogo que esté abierto.
      // ── Selección ──
      document.getElementById('chq-btn-seleccionar').addEventListener('click', () => {
        if (estado.seleccion.activa) cancelarSeleccion()
        else activarSeleccion()
      })
      document.getElementById('chq-sel-cancelar').addEventListener('click', cancelarSeleccion)
      document.getElementById('chq-sel-dar-salida').addEventListener('click', abrirModalSalidaLote)

      // Escape cierra el diálogo que esté abierto; si no hay ninguno, limpia
      // la selección.
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return
        if (!document.getElementById('chq-modal-salida').hidden) cerrarModalSalida()
        else if (!document.getElementById('chq-modal-motivo').hidden) cerrarModalMotivo()
        else if (estado.seleccion.activa) cancelarSeleccion()
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════

    const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i

    // Sin permiso se dice y se vuelve al dashboard: quedarse en una pantalla
    // vacía no le dice a nadie por qué no ve nada.
    function sinAcceso(texto) {
      document.getElementById('chq-cargando').hidden = true
      const el = document.getElementById('chq-sin-acceso')
      el.textContent = texto
      el.hidden = false
      mostrarError(texto)
      setTimeout(() => { window.location.href = '../dashboard.html' }, 2500)
    }

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return

      try {
        const { data: emp, error } = await supabase
          .from('empleados').select('id, rol_app')
          .eq('auth_user_id', estado.sesion.user.id).maybeSingle()
        if (error || !emp) throw error ?? new Error('sin empleado')
        estado.miEmpleadoId = emp.id
        estado.miRolApp = emp.rol_app
      } catch (err) {
        console.error('No se pudo identificar al empleado:', err)
        sinAcceso('No pudimos identificar tu usuario. Te llevamos al inicio…')
        return
      }

      try {
        const { data: tareas } = await supabase
          .from('empleado_tareas').select('modulo, tarea')
          .eq('empleado_id', estado.miEmpleadoId)
          .eq('modulo', 'cobranzas')
          .eq('habilitado', true)
        estado.misTareas = new Set((tareas ?? []).map(t => `${t.modulo}:${t.tarea}`))
      } catch (err) {
        console.error('No se pudieron leer los permisos:', err)
      }

      if (!puedeVerCartera()) {
        sinAcceso('No tenés acceso a la cartera de cheques. Te llevamos al inicio…')
        return
      }

      // ?cheque=<id>: se pidió ver un cheque puntual desde una cobranza. Se
      // muestran TODOS los estados (puede estar salido) y se marca la fila. El
      // parámetro se limpia para que recargar no lo vuelva a marcar.
      leerPreferencias()
      const params = new URLSearchParams(window.location.search)
      const pedido = params.get('cheque')
      if (pedido) {
        history.replaceState(null, '', window.location.pathname)
        if (UUID.test(pedido)) {
          estado.destacado = pedido
          estado.filtros = { ...FILTROS_CHEQUES_DEFECTO, estado: 'todos' }
        }
      }

      document.getElementById('chq-cargando').hidden = true
      document.getElementById('chq-vista').hidden = false
      document.getElementById('chq-filtro-numero').value = estado.filtros.numero
      pintarOrdenMovil()
      conectarTodo()

      await cargarBancos()
      await refrescarTodo()
    }

    init()

  </script>

</body>
</html>
