<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesos — Seis Destinos</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1a2a52">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    body {
      overflow-x: hidden;
      --rojo:         #C23B3B;
      --rojo-suave:   #FBEAEA;
      --rojo-oscuro:  #9B2E2E;
    }

    /* Cualquier regla de autor con display (.accesos-stats acá, .btn en
       main.css — #btn-modal-rechazar se togglea con hidden) le gana al
       [hidden] del user-agent — bug conocido del proyecto (ver CLAUDE.md).
       Esta regla restaura la semántica de hidden para todo el archivo. */
    [hidden] { display: none !important; }

    /* ── Stats ─────────────────────────────────────────────────────────────── */

    .accesos-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .stat-card {
      min-width: 0;
      border-radius: 18px;
      padding: 1.125rem 1.25rem;
    }

    .stat-card--principal {
      background: linear-gradient(135deg, var(--rojo), var(--rojo-oscuro));
      color: #fff;
      box-shadow: 0 8px 24px rgba(194,59,59,0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .stat-card--secundario {
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stat-card__label {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .stat-card--secundario .stat-card__label {
      opacity: 1;
      color: var(--color-texto-suave);
    }

    .stat-card__valor {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0.25rem;
    }

    .stat-card--secundario .stat-card__valor {
      color: var(--color-texto);
    }

    .stat-card__submetrics {
      display: none;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .stat-card__submetric {
      background: #fff;
      border-radius: 12px;
      padding: 0.5rem 0.75rem;
      text-align: center;
    }

    .stat-card__submetric-label {
      font-size: 0.5625rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
    }

    .stat-card__submetric-valor {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-acento);
      margin-top: 0.125rem;
    }

    @media (max-width: 640px) {
      .stat-card--secundario { display: none; }
      .stat-card__submetrics { display: flex !important; }
      .accesos-stats { grid-template-columns: 1fr; }
    }

    /* ── Tabs ──────────────────────────────────────────────────────────────── */

    .tabs-accesos {
      display: inline-flex;
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      border-radius: 10px;
      padding: 0.25rem;
      gap: 0.25rem;
      margin: 0 0 1rem;
    }

    .tabs-accesos__opcion {
      border: none;
      border-radius: 7px;
      background: transparent;
      padding: 0.5rem 1rem;
      font-family: var(--fuente);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-texto-suave);
      cursor: pointer;
      transition: background var(--transicion), color var(--transicion);
      -webkit-tap-highlight-color: transparent;
    }

    .tabs-accesos__opcion--activa {
      background: var(--rojo);
      color: #fff;
    }

    /* ── Filtros (Vista 2) ─────────────────────────────────────────────────── */

    .filtros-accesos {
      display: flex;
      gap: 0.625rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    #filtro-nombre-usuarios,
    .filtros-accesos select {
      height: 36px;
      padding: 0 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: 999px;
      font-family: var(--fuente);
      font-size: 0.8125rem;
      background: var(--color-fondo);
      color: var(--color-texto);
      outline: none;
    }

    #filtro-nombre-usuarios {
      flex: 1;
      min-width: 180px;
    }

    @media (max-width: 640px) {
      .filtros-accesos {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 0.375rem;
      }
      #filtro-nombre-usuarios,
      .filtros-accesos select {
        height: 32px !important;
        font-size: 0.75rem;
        padding: 0 0.625rem;
      }
      #filtro-nombre-usuarios {
        min-width: 110px;
        flex: 0 1 110px;
      }
    }

    /* ── Cards ─────────────────────────────────────────────────────────────── */

    .lista-accesos {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tarjeta-acceso {
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      padding: 0.875rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .acceso__avatar {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .acceso__cuerpo { flex: 1; min-width: 0; }

    .acceso__fila1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .acceso__nombre {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--color-texto);
    }

    .acceso__email {
      font-size: 0.8125rem;
      color: var(--color-texto-suave);
      margin-top: 0.125rem;
    }

    .acceso__chip-unidad {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .acceso__estado-texto {
      font-size: 0.8125rem;
      margin-top: 0.375rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .acceso__estado-texto--match  { color: #059669; }
    .acceso__estado-texto--alerta { color: var(--rojo); }
    .acceso__estado-texto--neutro { color: var(--color-texto-suave); }

    .acceso__acciones {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.625rem;
      flex-wrap: wrap;
    }

    .btn--rechazar {
      background: var(--color-fondo);
      border: 1.5px solid var(--rojo);
      color: var(--rojo);
    }

    .btn--rechazar:hover { background: var(--rojo-suave); }

    /* ── Chips de rol / módulo (Vista 2) ──────────────────────────────────────── */

    .chip-rol {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .chip-rol--usuario     { background: var(--color-superficie); color: var(--color-texto-suave); }
    .chip-rol--super_admin { background: var(--rojo-suave); color: var(--rojo-oscuro); }

    .chip-modulo {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      background: var(--color-superficie);
      color: var(--color-texto-suave);
      font-size: 0.6875rem;
      font-weight: 600;
    }

    /* ── Modal compartido (Aprobar / Editar) ──────────────────────────────────── */

    #modal-permisos {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #modal-permisos[hidden] { display: none; }

    #modal-permisos__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17,17,17,0.45);
    }

    #modal-permisos__panel {
      position: relative;
      background: var(--color-fondo);
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.25rem 1.5rem;
    }

    @media (min-width: 641px) {
      #modal-permisos { align-items: center; }
      #modal-permisos__panel {
        max-width: 420px;
        border-radius: 20px;
        box-shadow: var(--sombra-hover);
      }
    }

    .modal-permisos__cerrar {
      position: absolute;
      top: 0.875rem;
      right: 0.875rem;
    }

    .modal-permisos__usuario {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0 1.25rem;
    }

    .modal-permisos__seccion-titulo {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-texto-suave);
      margin: 1rem 0 0.5rem;
    }

    /* ── Permisos por tarea (checkboxes agrupados por módulo) ─────────────── */

    .grupo-tareas { margin-bottom: 0.875rem; }

    .grupo-tareas__titulo {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-texto);
      margin: 0.625rem 0 0.125rem;
    }

    .grupo-tareas__nota {
      font-weight: 400;
      font-size: 0.6875rem;
      color: var(--color-texto-suave);
    }

    .fila-tarea {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.3125rem 0;
      font-size: 0.8125rem;
      color: var(--color-texto);
      cursor: pointer;
    }

    .fila-tarea input {
      margin-top: 0.1875rem;
      flex-shrink: 0;
      accent-color: var(--rojo);
      cursor: pointer;
    }

    /* Sub-bloque de alcance de empleados/ver_editar */
    .sub-alcance {
      margin: 0.125rem 0 0.375rem 1.5rem;
      padding: 0.375rem 0.75rem;
      background: var(--color-superficie);
      border-radius: 8px;
    }

    /* El (?) va como hermano del <label>, no adentro: dentro de un label,
       tocarlo tildaría la tarea. El wrapper los alinea. */
    .fila-tarea-wrap {
      display: flex;
      align-items: flex-start;
      gap: 0.375rem;
    }
    .fila-tarea-wrap .fila-tarea { flex: 1; min-width: 0; }

    .btn-ayuda {
      flex: none;
      margin-top: 0.25rem;
      width: 1.125rem;
      height: 1.125rem;
      border: 1px solid var(--color-borde);
      border-radius: 50%;
      background: transparent;
      color: var(--color-texto-suave);
      font-family: var(--fuente);
      font-size: 0.6875rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .btn-ayuda:hover { background: var(--color-superficie); }
    .btn-ayuda--activo {
      background: var(--rojo);
      border-color: var(--rojo);
      color: #fff;
    }

    /* Misma geometría que .sub-alcance — se lee como parte del mismo sistema
       de sub-bloques contextuales. */
    .ayuda-tarea {
      margin: 0.125rem 0 0.5rem 1.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--color-superficie);
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--color-texto);
    }

    .tareas-vacio {
      padding: 0.75rem 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--color-texto-suave);
    }

    /* Misma geometría que .sub-alcance para que se lea como parte del mismo
       sistema, pero en colores de advertencia: no es una opción más, es algo
       que falta. */
    .sub-dependencia {
      margin: 0.125rem 0 0.375rem 1.5rem;
      padding: 0.5rem 0.75rem;
      background: #FDF3E3;
      border: 1px solid #E8C98A;
      border-radius: 8px;
      font-size: 0.8125rem;
      line-height: 1.4;
      color: var(--color-texto);
    }

    #modal-select-unidad {
      width: 100%;
      padding: 0.6875rem 0.875rem;
      border: 1.5px solid var(--color-borde);
      border-radius: var(--radio-input);
      background: var(--color-fondo);
      font-family: var(--fuente);
      font-size: 0.9375rem;
      color: var(--color-texto);
      outline: none;
      cursor: pointer;
    }

    .fila-modulo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--color-borde);
      gap: 0.5rem;
    }

    .fila-modulo:last-child { border-bottom: none; }

    .fila-modulo__nombre {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .fila-modulo__candado {
      font-size: 0.6875rem;
      color: var(--color-texto-suave);
      font-weight: 400;
    }

    .fila-modulo--deshabilitada { opacity: 0.45; }

    .toggle {
      position: relative;
      display: inline-block;
      width: 2.5rem;
      height: 1.5rem;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle__riel {
      position: absolute;
      inset: 0;
      background: var(--color-borde);
      border-radius: 999px;
      cursor: pointer;
      transition: background var(--transicion);
    }

    .toggle__riel::before {
      content: '';
      position: absolute;
      width: 1.125rem;
      height: 1.125rem;
      left: 0.1875rem;
      top: 0.1875rem;
      background: #fff;
      border-radius: 50%;
      transition: transform var(--transicion);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .toggle input:checked + .toggle__riel { background: var(--color-acento-highlight); }
    .toggle input:checked + .toggle__riel::before { transform: translateX(1rem); }
    .toggle input:disabled + .toggle__riel { cursor: not-allowed; opacity: 0.5; }

    .modal-permisos__acciones {
      display: flex;
      gap: 0.625rem;
      margin-top: 1.5rem;
    }

    .modal-permisos__acciones .btn { flex: 1; }
  </style>
</head>
<body class="pagina-modulo">

  <header style="position:sticky; top:0; z-index:20; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(255,255,255,0.72); border-bottom:1px solid var(--color-borde); display:flex; align-items:center; justify-content:space-between; padding:0.875rem 1.25rem;">
    <a href="../dashboard.html" class="btn btn--icono" title="Volver al dashboard">‹ Volver</a>
    <div>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <img src="../logo.png" alt="" style="width:20px; height:20px; object-fit:contain;">
        <span style="font-size:0.6875rem; font-weight:700; letter-spacing:0.08em; color:var(--color-texto-suave); text-transform:uppercase;">Seis Destinos</span>
      </div>
      <div style="font-size:1.375rem; font-weight:700; letter-spacing:-0.02em; color:var(--color-texto); display:flex; align-items:center; gap:0.375rem;">
        Accesos <span style="color:var(--rojo); font-size:1rem; line-height:1;">●</span>
      </div>
    </div>
  </header>

  <div class="vista-lista__contenedor" style="max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 3rem;">

    <div class="accesos-stats" id="accesos-stats" hidden></div>

    <div class="tabs-accesos" id="tabs-accesos">
      <button type="button" class="tabs-accesos__opcion tabs-accesos__opcion--activa" data-tab="solicitudes">
        Solicitudes (<span id="contador-tab-solicitudes">0</span>)
      </button>
      <button type="button" class="tabs-accesos__opcion" data-tab="usuarios">Usuarios y roles</button>
    </div>

    <div id="vista-solicitudes">
      <div class="lista-accesos" id="lista-solicitudes"></div>
      <div id="estado-vacio-solicitudes" class="estado-vacio" hidden>
        <div class="estado-vacio__icono">✅</div>
        <div class="estado-vacio__titulo">No hay solicitudes pendientes</div>
      </div>
    </div>

    <div id="vista-usuarios" hidden>
      <div class="filtros-accesos">
        <input type="text" id="filtro-nombre-usuarios" placeholder="🔍 Buscar por nombre">
        <select id="filtro-rol-usuarios"></select>
        <select id="filtro-modulo-usuarios"></select>
      </div>
      <div class="lista-accesos" id="lista-usuarios"></div>
      <div id="estado-vacio-usuarios" class="estado-vacio" hidden>
        <div class="estado-vacio__icono">👥</div>
        <div class="estado-vacio__titulo">No se encontraron usuarios</div>
      </div>
    </div>

    <div id="estado-cargando" class="estado-vacio">
      <div class="spinner"></div>
      <p class="estado-vacio__descripcion">Cargando…</p>
    </div>

  </div>

  <!-- Modal compartido: Revisar solicitud (aprobar) / Editar permisos -->
  <div id="modal-permisos" hidden>
    <div id="modal-permisos__backdrop"></div>
    <div id="modal-permisos__panel">
      <button type="button" class="btn btn--icono modal-permisos__cerrar" id="btn-cerrar-modal" title="Cerrar">✕</button>
      <h2 id="modal-permisos__titulo">Revisar solicitud</h2>

      <div class="modal-permisos__usuario">
        <div class="acceso__avatar" id="modal-avatar"></div>
        <div>
          <div class="acceso__nombre" id="modal-nombre"></div>
          <div class="acceso__email" id="modal-email"></div>
        </div>
      </div>

      <div class="modal-permisos__seccion-titulo">Módulos habilitados</div>
      <div id="modal-modulos"></div>

      <div class="modal-permisos__seccion-titulo">Permisos por tarea</div>
      <div id="modal-tareas"></div>

      <div class="modal-permisos__seccion-titulo" id="modal-unidad-titulo" hidden>Unidad de negocio</div>
      <select id="modal-select-unidad" hidden></select>

      <div class="modal-permisos__acciones">
        <button type="button" class="btn btn--rechazar" id="btn-modal-rechazar">Rechazar solicitud</button>
        <button type="button" class="btn btn--exito" id="btn-modal-guardar">Aprobar y guardar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { verificarSesion } from '../js/auth.js'
    import { mostrarError, mostrarExito } from '../js/utils.js'
    import { supabase } from '../js/supabase.js'
    import { mostrarBannerVersion } from '../js/version-banner.js'

    mostrarBannerVersion()

    // ═══════════════════════════════════════════════════════════════════════
    // ESTADO GLOBAL
    // ═══════════════════════════════════════════════════════════════════════

    const estado = {
      sesion:      null,
      miEmpleado:  null, // { id, rol_app }
      solicitudes: [],
      empleados:   [],
      empleadoModulos: [],
      maestros: { unidadesNegocio: [] },
      tabActiva:   'solicitudes',
      filtrosUsuarios: { texto: '', rol: '', modulo: '' },
      modal: null, // { modo: 'aprobar' | 'editar', solicitud?, empleado, esNuevoEmpleado,
                   //   modulosElegidos: Set<clave>, unidadElegida,
                   //   tareasElegidas: Set<'modulo:tarea'>,
                   //   alcances: Map<'modulo:tarea', { todas: bool, unidades: Set<uuid> }>
                   //     — una entrada por cada tarea `conAlcance` del catálogo }
    }

    // Se cargan desde la tabla `modulos` (fetch al principio de init(),
    // ver construirListasModulos()) — ya no están hardcodeados, agregar
    // un módulo nuevo no requiere tocar este archivo.
    let MODULOS_INFO = []
    let MODULOS_MODAL = []

    // `filas` = SELECT * FROM modulos WHERE activo = true ORDER BY orden.
    // MODULOS_INFO: una entrada por fila, sin agrupar.
    // MODULOS_MODAL: las filas con el mismo grupo_clave (no nulo) se
    // combinan en un solo control ({keys: [...], label: grupo_label});
    // las de grupo_clave null quedan como entrada individual.
    function construirListasModulos(filas) {
      MODULOS_INFO = filas.map(f => ({ key: f.clave, label: f.nombre_visible }))

      const grupos = new Map()
      MODULOS_MODAL = []
      filas.forEach(f => {
        if (f.grupo_clave) {
          let entrada = grupos.get(f.grupo_clave)
          if (!entrada) {
            entrada = { keys: [], label: f.grupo_label }
            grupos.set(f.grupo_clave, entrada)
            MODULOS_MODAL.push(entrada)
          }
          entrada.keys.push(f.clave)
        } else {
          MODULOS_MODAL.push({ keys: [f.clave], label: f.nombre_visible })
        }
      })

      // El campo `modulos` de CATALOGO_TAREAS va a mano contra claves que
      // vienen de la BASE. Si alguna cambia allá, el vínculo se rompe y el
      // grupo no aparecería NUNCA, sin ningún error. Esto convierte esa falla
      // muda en una ruidosa.
      const claves = new Set(MODULOS_INFO.map(m => m.key))
      CATALOGO_TAREAS.forEach(g => {
        (g.modulos ?? []).forEach(m => {
          if (!claves.has(m)) {
            console.warn(`[accesos] El grupo "${g.grupo}" declara el módulo "${m}", que no existe en la tabla \`modulos\`. Sus tareas no se van a mostrar nunca.`)
          }
        })
      })
    }

    // Catálogo COMPLETO y FIJO de tareas granulares (empleado_tareas) —

    // Entrada del catálogo por clave 'modulo:tarea', o null si la clave no está
    // en el catálogo. Devolver null es parte del contrato: una tarea otorgada
    // por SQL que todavía no está acá tiene que poder atravesar el guardado sin
    // alcance y sin romperse (ver el passthrough en armarTareasPayload).
    function tareaDeCatalogo(clave) {
      for (const grupo of CATALOGO_TAREAS) {
        const t = grupo.tareas.find(t => `${t.modulo}:${t.tarea}` === clave)
        if (t) return t
      }
      return null
    }

    function labelDeTarea(clave) {
      return tareaDeCatalogo(clave)?.label ?? clave
    }

    // Todas las tareas del catálogo marcadas con `conAlcance`. Antes esto era
    // la constante CLAVE_VER_EDITAR, con UNA clave hardcodeada: el render ya
    // miraba `t.conAlcance`, pero el estado, el prefill, la validación y el
    // payload seguían atados a esa única clave. Agregar una segunda tarea con
    // alcance dibujaba el sub-bloque y no guardaba nada.
    function tareasConAlcance() {
      return CATALOGO_TAREAS.flatMap(g => g.tareas.filter(t => t.conAlcance))
    }

    // ── Vínculo grupo → módulos ────────────────────────────────────────────

    // Semántica "any": alcanza con UNO de los módulos del grupo. Ver el
    // comentario de CATALOGO_TAREAS.
    function grupoEsVisible(grupo) {
      return (grupo.modulos ?? []).some(m => estado.modal.modulosElegidos.has(m))
    }

    function gruposVisibles() {
      return new Set(CATALOGO_TAREAS.filter(grupoEsVisible).map(g => g.grupo))
    }

    // El grupo al que pertenece una clave 'modulo:tarea', o null si la clave
    // no está en el catálogo (passthrough — ver armarTareasPayload).
    function grupoDeClave(clave) {
      return CATALOGO_TAREAS.find(g =>
        g.tareas.some(t => `${t.modulo}:${t.tarea}` === clave)) ?? null
    }

    // Label visible del TOGGLE que contiene ese módulo — el que la persona
    // tiene que prender. Sale de MODULOS_MODAL (o sea de la base) y no se
    // hardcodea: 'gastos' y 'caja' viven bajo un solo control, "Gastos y Caja".
    function labelDeModulo(claveModulo) {
      const entrada = MODULOS_MODAL.find(m => m.keys.includes(claveModulo))
      return entrada?.label ?? claveModulo
    }

    // Mueve tareas entre el Set activo y la memoria de sesión cuando cambia
    // la visibilidad de los grupos. SE LLAMA SOLO DESDE EL HANDLER DE LOS
    // TOGGLES DE MÓDULOS, nunca al abrir el modal ni desde un render.
    //
    // TRES INVARIANTES, y romper cualquiera de las tres pierde permisos en
    // silencio:
    //
    // 1. `alcances` NO SE TOCA NUNCA. Al restaurar una tarea su alcance
    //    reaparece solo, porque nunca se fue. Es lo que mantiene válido el
    //    fix de 0e70708 (un passthrough a medias es peor que ninguno).
    //
    // 2. Solo se mueve lo que está EN EL CATÁLOGO **y** EN EL SET. Una clave
    //    otorgada por SQL que no está en CATALOGO_TAREAS no pertenece a
    //    ningún grupo, así que ninguna rama la alcanza: atraviesa intacta.
    //
    // 3. AL ABRIR NO SE MUEVE NADA. Una tarea otorgada por SQL cuyo módulo
    //    está destildado queda en el Set, oculta pero viva: abrir y guardar
    //    sin tocar nada tiene que producir el payload idéntico al que había.
    //    Solo la ACCIÓN de destildar revoca; no tocar preserva.
    function moverTareasPorCambioDeModulos(visiblesAntes) {
      const visiblesAhora = gruposVisibles()

      for (const grupo of CATALOGO_TAREAS) {
        const estaba = visiblesAntes.has(grupo.grupo)
        const esta   = visiblesAhora.has(grupo.grupo)
        if (estaba === esta) continue

        if (!esta) {
          // Se ocultó por este evento: sus tareas del catálogo salen del Set
          // y quedan guardadas para poder volver.
          const recordadas = new Set()
          for (const t of grupo.tareas) {
            const clave = `${t.modulo}:${t.tarea}`
            if (estado.modal.tareasElegidas.delete(clave)) recordadas.add(clave)
          }
          if (recordadas.size) estado.modal.tareasRecordadas.set(grupo.grupo, recordadas)
        } else {
          // Volvió a estar visible: se restaura lo que ESTA sesión guardó.
          const recordadas = estado.modal.tareasRecordadas.get(grupo.grupo)
          if (recordadas) {
            recordadas.forEach(c => estado.modal.tareasElegidas.add(c))
            estado.modal.tareasRecordadas.delete(grupo.grupo)
          }
        }
      }
    }

    // Alcance de UNA tarea dentro del modal, creando la entrada vacía la
    // primera vez. Arranca sin nada a propósito: tildar una tarea con alcance
    // obliga a elegirlo de forma explícita, nunca hereda "todas" por defecto.
    function alcanceDe(clave) {
      let a = estado.modal.alcances.get(clave)
      if (!a) {
        a = { todas: false, unidades: new Set() }
        estado.modal.alcances.set(clave, a)
      }
      return a
    }

    // Recorre las dependencias declaradas con `requiere` en el catálogo y
    // devuelve el mensaje de la primera que falte, o null si está todo bien.
    //
    // OJO — solo LEE del Set con .has(). No lo filtra ni lo reconstruye: las
    // tareas otorgadas por SQL que no están en CATALOGO_TAREAS (hoy las cuatro
    // de materia_prima) no participan de esta regla y tienen que seguir
    // pasando intactas al payload. Ver el comentario de armarTareasPayload.
    // Caso nuevo desde el despliegue condicional: la tarea requerida puede
    // tener su grupo OCULTO porque su módulo está destildado. Sin esta frase,
    // el mensaje nombra una tarea que no está en pantalla y no hay forma de
    // saber cómo llegar a ella. Devuelve '' cuando el grupo sí está visible.
    function avisoModuloDeRequerida(claveRequerida) {
      const grupo = grupoDeClave(claveRequerida)
      if (!grupo || grupoEsVisible(grupo)) return ''
      const modulos = (grupo.modulos ?? []).map(labelDeModulo)
      const lista = [...new Set(modulos)].map(m => `"${m}"`).join(' o ')
      return `Para poder tildarla, primero hay que habilitar el módulo ${lista}. `
    }

    function mensajeDeDependenciaFaltante() {
      const elegidas = estado.modal.tareasElegidas

      for (const grupo of CATALOGO_TAREAS) {
        for (const t of grupo.tareas) {
          if (!t.requiere) continue
          const clave = `${t.modulo}:${t.tarea}`
          if (elegidas.has(clave) && !elegidas.has(t.requiere)) {
            return `"${t.label}" necesita además "${labelDeTarea(t.requiere)}". `
              + avisoModuloDeRequerida(t.requiere)
              + 'Sin esa tarea, los pagos a proveedor quedan filtrados por la seguridad de la base y '
              + 'los saldos de cuenta corriente se muestran INCOMPLETOS, sin ningún error a la vista.'
          }
        }
      }
      return null
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════

    function soloDigitos(s) {
      return (s || '').replace(/\D/g, '')
    }

    function formatearCuil(cuil) {
      const d = soloDigitos(cuil)
      if (d.length !== 11) return cuil || '—'
      return `${d.slice(0, 2)}-${d.slice(2, 10)}-${d.slice(10)}`
    }

    function iniciales(nombre) {
      const palabras = (nombre || '').trim().split(/\s+/).filter(Boolean)
      if (!palabras.length) return '—'
      if (palabras.length === 1) return palabras[0].slice(0, 2).toUpperCase()
      return (palabras[0][0] + palabras[1][0]).toUpperCase()
    }

    const PALETA_AVATAR = ['#9B2E2E', '#7A3B3B', '#8C4A2F', '#6E3B5C', '#4A5568']
    function colorAvatar(texto) {
      let hash = 0
      for (let i = 0; i < (texto || '').length; i++) hash = texto.charCodeAt(i) + ((hash << 5) - hash)
      return PALETA_AVATAR[Math.abs(hash) % PALETA_AVATAR.length]
    }

    const PALETA_UNIDAD = ['#E3F0FF', '#E6F7EC', '#FFF3DA', '#F1E7FC', '#FDE7E7']
    function colorUnidad(texto) {
      let hash = 0
      for (let i = 0; i < (texto || '').length; i++) hash = texto.charCodeAt(i) + ((hash << 5) - hash)
      return PALETA_UNIDAD[Math.abs(hash) % PALETA_UNIDAD.length]
    }

    function calcularEstadoMatch(solicitud) {
      const cuilSolicitud = soloDigitos(solicitud.cuil)
      const empleado = estado.empleados.find(e => soloDigitos(e.cuil) === cuilSolicitud)
      if (!empleado) return { tipo: 'sin_match', empleado: null }
      if (empleado.auth_user_id) return { tipo: 'ya_tiene_acceso', empleado }
      if (!empleado.activo) return { tipo: 'inactivo', empleado }
      return { tipo: 'match', empleado }
    }

    function empleadosConAcceso() {
      return estado.empleados.filter(e => e.auth_user_id)
    }

    function modulosDeEmpleado(empleadoId) {
      return estado.empleadoModulos.filter(m => m.empleado_id === empleadoId).map(m => m.modulo)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // CARGA DE DATOS
    // ═══════════════════════════════════════════════════════════════════════

    async function cargarTodo() {
      document.getElementById('estado-cargando').hidden = false

      const [solRes, empRes, modRes, unidRes] = await Promise.all([
        supabase.from('solicitudes_acceso').select('*').eq('estado', 'pendiente').order('fecha_solicitud', { ascending: false }),
        supabase.from('empleados').select('id, nombre, rol, cuil, activo, auth_user_id, rol_app, unidades_negocio (nombre)'),
        supabase.from('empleado_modulos').select('empleado_id, modulo, habilitado').eq('habilitado', true),
        supabase.from('unidades_negocio').select('id, nombre').order('nombre'),
      ])

      document.getElementById('estado-cargando').hidden = true

      if (solRes.error || empRes.error || modRes.error || unidRes.error) {
        mostrarError('No se pudieron cargar los datos de Accesos.')
        return
      }

      estado.solicitudes     = solRes.data || []
      estado.empleados       = empRes.data || []
      estado.empleadoModulos = modRes.data || []
      estado.maestros.unidadesNegocio = unidRes.data || []

      renderizarStats()
      renderizarSolicitudes()
      renderizarUsuarios()
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER — Stats
    // ═══════════════════════════════════════════════════════════════════════

    function renderizarStats() {
      const pendientes  = estado.solicitudes.length
      const conAcceso   = empleadosConAcceso()
      const activos     = conAcceso.length
      const superAdmins = conAcceso.filter(e => e.rol_app === 'super_admin').length

      document.getElementById('accesos-stats').innerHTML = `
        <div class="stat-card stat-card--principal">
          <div>
            <div class="stat-card__label">Solicitudes pendientes</div>
            <div class="stat-card__valor">${pendientes}</div>
          </div>
          <div class="stat-card__submetrics">
            <div class="stat-card__submetric">
              <div class="stat-card__submetric-label">Activos</div>
              <div class="stat-card__submetric-valor">${activos}</div>
            </div>
            <div class="stat-card__submetric">
              <div class="stat-card__submetric-label">Super admins</div>
              <div class="stat-card__submetric-valor">${superAdmins}</div>
            </div>
          </div>
        </div>
        <div class="stat-card stat-card--secundario">
          <div class="stat-card__label">Usuarios activos</div>
          <div class="stat-card__valor">${activos}</div>
        </div>

          <div class="stat-card__label">Super admins</div>

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER — Vista 1: Solicitudes pendientes
    // ═══════════════════════════════════════════════════════════════════════

    function renderizarSolicitudes() {
      const cont  = document.getElementById('lista-solicitudes')
      const vacio = document.getElementById('estado-vacio-solicitudes')

      if (!estado.solicitudes.length) {
        cont.innerHTML = ''
        vacio.hidden = false
        return
      }
      vacio.hidden = true

      cont.innerHTML = estado.solicitudes.map(sol => {
        const match = calcularEstadoMatch(sol)
        const emp = match.empleado
        const unidadNombre = emp?.unidades_negocio?.nombre
        const chipUnidad = unidadNombre
          ? `<span class="acceso__chip-unidad" style="background:${colorUnidad(unidadNombre)};">${unidadNombre}</span>`
          : ''

        let bloqueEstado = ''
        let acciones = `<button type="button" class="btn btn--rechazar btn-rechazar-solicitud" data-id="${sol.id}">Rechazar</button>`

        if (match.tipo === 'match') {
          bloqueEstado = `<div class="acceso__estado-texto acceso__estado-texto--match"><i data-lucide="check-circle" style="width:14px;height:14px;"></i> Match encontrado — ${emp.rol || 'sin puesto registrado'}</div>`
          acciones = `
            <button type="button" class="btn btn--rechazar btn-rechazar-solicitud" data-id="${sol.id}">Rechazar</button>
            <button type="button" class="btn btn--exito btn-aprobar-solicitud" data-id="${sol.id}">Aprobar</button>
          `
        } else if (match.tipo === 'sin_match') {
          bloqueEstado = `<div class="acceso__estado-texto acceso__estado-texto--alerta"><i data-lucide="alert-triangle" style="width:14px;height:14px;"></i> No se encontró un empleado con este CUIL — se puede crear uno nuevo al aprobar</div>`
          acciones = `
            <button type="button" class="btn btn--rechazar btn-rechazar-solicitud" data-id="${sol.id}">Rechazar</button>
            <button type="button" class="btn btn--exito btn-aprobar-solicitud" data-id="${sol.id}">Aprobar</button>
          `
        } else if (match.tipo === 'inactivo') {
          bloqueEstado = `<div class="acceso__estado-texto acceso__estado-texto--alerta"><i data-lucide="user-x" style="width:14px;height:14px;"></i> El CUIL corresponde a un empleado marcado como inactivo</div>`
        } else if (match.tipo === 'ya_tiene_acceso') {
          bloqueEstado = `<div class="acceso__estado-texto acceso__estado-texto--neutro"><i data-lucide="copy" style="width:14px;height:14px;"></i> Solicitud duplicada — este empleado ya tiene acceso</div>`
        }

        const nombreCompleto = [sol.nombre, sol.apellido].filter(Boolean).join(' ')

        return `
          <div class="tarjeta-acceso" data-id="${sol.id}">
            <div class="acceso__avatar" style="background:${colorAvatar(nombreCompleto)};">${iniciales(nombreCompleto)}</div>
            <div class="acceso__cuerpo">
              <div class="acceso__fila1">
                <span class="acceso__nombre">${nombreCompleto}</span>
                ${chipUnidad}
              </div>
              <div class="acceso__email">${sol.email}</div>
              ${bloqueEstado}
              <div class="acceso__acciones">${acciones}</div>
            </div>
          </div>
        `
      }).join('')

      lucide.createIcons()

      cont.querySelectorAll('.btn-aprobar-solicitud').forEach(btn => {
        btn.addEventListener('click', () => abrirModalAprobar(btn.dataset.id))
      })
      cont.querySelectorAll('.btn-rechazar-solicitud').forEach(btn => {
        btn.addEventListener('click', () => confirmarRechazo(btn.dataset.id))
      })
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER — Vista 2: Usuarios y roles
    // ═══════════════════════════════════════════════════════════════════════

    function renderizarUsuarios() {
      const cont  = document.getElementById('lista-usuarios')
      const vacio = document.getElementById('estado-vacio-usuarios')

      const { texto, rol, modulo } = estado.filtrosUsuarios
      let lista = empleadosConAcceso()

      if (texto) {
        const t = texto.toLowerCase()
        lista = lista.filter(e => (e.nombre || '').toLowerCase().includes(t))
      }
      if (rol) lista = lista.filter(e => e.rol_app === rol)
      if (modulo) lista = lista.filter(e => modulosDeEmpleado(e.id).includes(modulo))

      if (!lista.length) {
        cont.innerHTML = ''
        vacio.hidden = false
        return
      }
      vacio.hidden = true

      // El viewer siempre es super_admin acá (init() ya lo exige) — la única
      // restricción real que queda es no poder editar a otro super_admin.
      cont.innerHTML = lista.map(emp => {
        const puedeEditar = emp.rol_app !== 'super_admin'

        // Condición APARTE de puedeEditar, a propósito: el rescate de MFA sí
        // tiene que estar disponible sobre un super_admin — es justamente el
        // caso principal, los super_admin se rescatan entre ellos. Lo único
        // que se excluye es la tarjeta propia (para eso está el menú de
        // perfil, y así nadie se saca el MFA creyendo que se lo saca a otro).
        const puedeQuitarMfa = emp.id !== estado.miEmpleado?.id
        const modulos = modulosDeEmpleado(emp.id)
        const chipsModulos = modulos.length
          ? modulos.map(m => {
              const info = MODULOS_INFO.find(i => i.key === m)
              return `<span class="chip-modulo">${info ? info.label : m}</span>`
            }).join('')
          : `<span class="acceso__estado-texto--neutro" style="font-size:0.75rem;">Sin módulos habilitados</span>`

        // El rol 'admin' desapareció — el chip solo distingue super_admin
        // vs. usuario (cualquier otro valor legado cae en Usuario).
        const esSuperAdmin = emp.rol_app === 'super_admin'
        const etiquetaRol  = esSuperAdmin ? 'Super admin' : 'Usuario'

        return `
          <div class="tarjeta-acceso" data-id="${emp.id}">
            <div class="acceso__avatar" style="background:${colorAvatar(emp.nombre)};">${iniciales(emp.nombre)}</div>
            <div class="acceso__cuerpo">
              <div class="acceso__fila1">
                <span class="acceso__nombre">${emp.nombre}</span>
                <span class="chip-rol chip-rol--${esSuperAdmin ? 'super_admin' : 'usuario'}">${etiquetaRol}</span>
              </div>
              <div class="acceso__email">${formatearCuil(emp.cuil)}</div>
              <div class="acceso__acciones" style="margin-top:0.5rem;">${chipsModulos}</div>
              ${(puedeEditar || puedeQuitarMfa) ? `
                <div class="acceso__acciones">
                  ${puedeEditar ? `<button type="button" class="btn btn--secundario btn-editar-usuario" data-id="${emp.id}" style="width:auto; padding:0.4375rem 0.875rem; font-size:0.8125rem;">Editar</button>` : ''}
                  ${puedeQuitarMfa ? `<button type="button" class="btn btn--rechazar btn-quitar-mfa" data-id="${emp.id}" style="width:auto; padding:0.4375rem 0.875rem; font-size:0.8125rem;">Quitar verificación en dos pasos</button>` : ''}
                </div>
              ` : ''}
            </div>
          </div>
        `
      }).join('')

      cont.querySelectorAll('.btn-editar-usuario').forEach(btn => {
        btn.addEventListener('click', () => abrirModalEditar(btn.dataset.id))
      })
      cont.querySelectorAll('.btn-quitar-mfa').forEach(btn => {
        btn.addEventListener('click', () => confirmarQuitarMfa(btn.dataset.id))
      })
    }

    // Rescate de alguien que perdió su dispositivo. Supabase no tiene códigos
    // de recuperación, así que sin esto la única salida sería tocar la base a
    // mano. Vía Edge Function: listar y borrar factores de OTRA persona exige
    // service_role, no se puede hacer desde el navegador.
    async function quitarMfa(empleadoId) {
      const { data, error } = await supabase.functions.invoke('quitar-mfa-empleado', {
        body: { empleado_id: empleadoId },
      })

      if (error || !data?.ok) {
        mostrarError(data?.mensaje || 'No se pudo quitar la verificación en dos pasos.')
        return
      }

      if (data.factoresBorrados === 0) {
        mostrarError('Esa persona no tenía la verificación en dos pasos activa — no había nada que quitar.')
      } else {
        mostrarExito('Listo. Esa persona ya puede entrar solo con su contraseña y volver a configurar la verificación.')
      }
      await cargarTodo()
    }

    function confirmarQuitarMfa(empleadoId) {
      // El nombre se busca acá y no viaja en un data-attribute: meterlo en un
      // atributo HTML sin escapar rompería la tarjeta ante una comilla.
      const emp = estado.empleados.find(e => e.id === empleadoId)
      if (!emp) return

      const mensaje =
        `¿Quitarle la verificación en dos pasos a ${emp.nombre}?\n\n` +
        `• Va a perder la verificación en dos pasos de todos sus dispositivos.\n` +
        `• Se le van a cerrar todas las sesiones abiertas.\n` +
        `• Va a tener que configurarla de nuevo desde su menú de perfil.\n\n` +
        `Hacelo solo si esa persona te lo pidió porque no puede entrar.`
      if (!window.confirm(mensaje)) return
      quitarMfa(empleadoId)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // MODAL — Aprobar / Editar
    // ═══════════════════════════════════════════════════════════════════════

    // Checkboxes de tareas agrupados por módulo (ver CATALOGO_TAREAS).
    // Se re-renderiza entero en cada cambio — el estado vive en los Sets
    // del modal, no en el DOM, así que no se pierde nada.
    function renderizarModalTareas() {
      const el = document.getElementById('modal-tareas')

      // Solo los grupos cuyos módulos están tildados. El orden es el del
      // catálogo, así que un grupo que reaparece lo hace en su lugar de
      // siempre y no al final.
      const visibles = CATALOGO_TAREAS.filter(grupoEsVisible)

      if (!visibles.length) {
        el.innerHTML = `<div class="tareas-vacio">Habilitá al menos un módulo arriba para elegir qué puede hacer dentro.</div>`
        return
      }

      el.innerHTML = visibles.map(grupo => `
        <div class="grupo-tareas">
          <div class="grupo-tareas__titulo">${grupo.grupo}${grupo.nota ? ` <span class="grupo-tareas__nota">— ${grupo.nota}</span>` : ''}</div>
          ${grupo.tareas.map(t => {
            const clave = `${t.modulo}:${t.tarea}`
            const marcada = estado.modal.tareasElegidas.has(clave)

            // Sub-bloque de alcance: uno por CADA tarea `conAlcance` tildada,
            // cada uno con su propio estado. "todas" O lista de unidades.
            //
            // Los checkboxes se identifican por data attribute y no por id
            // porque la clave lleva dos puntos ('empleados:ver_editar') y en un
            // selector de id habría que escaparlos — `:` es sintaxis de
            // pseudo-selector.
            let subAlcance = ''
            if (t.conAlcance && marcada) {
              const a = alcanceDe(clave)
              subAlcance = `
                <div class="sub-alcance">
                  <label class="fila-tarea">
                    <input type="checkbox" data-alcance-todas="${clave}" ${a.todas ? 'checked' : ''}>
                    <span>Todas las unidades de negocio</span>
                  </label>
                  ${a.todas ? '' : estado.maestros.unidadesNegocio.map(u => `
                    <label class="fila-tarea">
                      <input type="checkbox" data-alcance-clave="${clave}" data-alcance-unidad="${u.id}" ${a.unidades.has(u.id) ? 'checked' : ''}>
                      <span>${u.nombre}</span>
                    </label>
                  `).join('')}
                </div>`
            }

            // Aviso de dependencia faltante, mismo patrón contextual que el
            // sub-bloque de alcance: aparece debajo de la tarea que la exige,
            // apenas se la tilda, para no enterarse recién al apretar Guardar.
            let subDependencia = ''
            if (t.requiere && marcada && !estado.modal.tareasElegidas.has(t.requiere)) {
              const avisoModulo = avisoModuloDeRequerida(t.requiere)
              subDependencia = `
                <div class="sub-dependencia">
                  Falta tildar <strong>"${labelDeTarea(t.requiere)}"</strong>.
                  ${avisoModulo}Sin esa tarea los saldos de cuenta corriente se calculan incompletos, sin ningún aviso.
                </div>`
            }

            // El botón (?) va FUERA del <label>: adentro, tocarlo tildaría la
            // tarea, porque un label propaga el click a su checkbox. Por eso
            // el wrapper.
            //
            // Y la descripción va como contenido de un div, no en un
            // title=""; varias llevan comillas dobles adentro y romperían el
            // atributo.
            const ayudaAbierta = estado.modal.ayudaAbierta === clave
            const ayuda = t.descripcion ? `
              <button type="button" class="btn-ayuda${ayudaAbierta ? ' btn-ayuda--activo' : ''}"
                      data-ayuda="${clave}" aria-expanded="${ayudaAbierta}"
                      title="Qué habilita esta tarea">?</button>` : ''
            const globoAyuda = (t.descripcion && ayudaAbierta)
              ? `<div class="ayuda-tarea">${t.descripcion}</div>` : ''

            return `
              <div class="fila-tarea-wrap">
                <label class="fila-tarea">
                  <input type="checkbox" data-tarea="${clave}" ${marcada ? 'checked' : ''}>
                  <span>${t.label}</span>
                </label>
                ${ayuda}
              </div>
              ${globoAyuda}${subAlcance}${subDependencia}`
          }).join('')}
        </div>
      `).join('')

      el.querySelectorAll('input[data-tarea]').forEach(chk => {
        chk.addEventListener('change', () => {
          if (chk.checked) estado.modal.tareasElegidas.add(chk.dataset.tarea)
          else estado.modal.tareasElegidas.delete(chk.dataset.tarea)
          renderizarModalTareas()
        })
      })
      // querySelectorAll y no querySelector: hay un checkbox "todas" por cada
      // tarea con alcance tildada. Con el querySelector singular de antes, solo
      // el primer bloque quedaba cableado.
      el.querySelectorAll('input[data-alcance-todas]').forEach(chk => {
        chk.addEventListener('change', () => {
          alcanceDe(chk.dataset.alcanceTodas).todas = chk.checked
          renderizarModalTareas()
        })
      })
      // Click/tap y no hover: esto se usa en el celular. Un solo globo abierto
      // a la vez — tocar otro cierra el anterior, y tocar el mismo lo cierra.
      // El estado vive en estado.modal y no en el DOM, para sobrevivir al
      // re-render completo que hace esta función en cada cambio.
      el.querySelectorAll('button[data-ayuda]').forEach(btn => {
        btn.addEventListener('click', () => {
          const clave = btn.dataset.ayuda
          estado.modal.ayudaAbierta = estado.modal.ayudaAbierta === clave ? null : clave
          renderizarModalTareas()
        })
      })
      el.querySelectorAll('input[data-alcance-unidad]').forEach(chk => {
        chk.addEventListener('change', () => {
          // La unidad se guarda en el alcance de SU tarea: sin data-alcance-clave
          // los checkboxes de los distintos bloques escribían todos en el mismo
          // Set.
          const a = alcanceDe(chk.dataset.alcanceClave)
          if (chk.checked) a.unidades.add(chk.dataset.alcanceUnidad)
          else a.unidades.delete(chk.dataset.alcanceUnidad)
        })
      })
    }

    // Array p_tareas para las RPCs. El alcance sale del catálogo (`conAlcance`)
    // y no de una clave hardcodeada; las tareas sin alcance van con null.
    //
    // La forma del jsonb es contrato con tiene_tarea_alcance(), que lee
    // exactamente dos claves: {"todas": true} O {"unidades": [uuid, ...]}.
    // Nunca las dos juntas.
    //
    // PASSTHROUGH — una clave que NO está en el catálogo (otorgada por SQL
    // directo, porque entró al CHECK antes que acá) atraviesa el guardado
    // conservando el permiso Y SU ALCANCE. El Set no se filtra contra el
    // catálogo: hacerlo revocaría esas tareas en silencio en cada guardado.
    //
    // Preservar el alcance importa tanto como preservar el permiso: la RPC
    // pisa la columna con lo que le llegue, así que mandar null borraría un
    // alcance que esta pantalla ni siquiera sabe dibujar. El prefill ya lo
    // carga al Map sin filtrar por catálogo; acá se devuelve tal cual vino.
    //
    // Quién manda según el caso:
    //   - en catálogo  → decide `conAlcance` (una tarea sin alcance va null
    //                    aunque el Map tenga algo viejo)
    //   - fuera        → decide si el Map trae algo (lo que había en la base)
    function armarTareasPayload() {
      return [...estado.modal.tareasElegidas].map(clave => {
        const [modulo, tarea] = clave.split(':')
        const def = tareaDeCatalogo(clave)
        const a = estado.modal.alcances.get(clave)
        const llevaAlcance = def ? !!def.conAlcance : !!a

        let alcance = null
        if (llevaAlcance) {
          // Forma del contrato con tiene_tarea_alcance(): {"todas": true} O
          // {"unidades": [...]}, nunca las dos.
          alcance = a?.todas ? { todas: true } : { unidades: [...(a?.unidades ?? [])] }
        }
        return { modulo, tarea, alcance }
      })
    }

    // Recorre las tareas `conAlcance` tildadas y devuelve el mensaje de la
    // primera que no tenga alcance elegido, nombrándola. Mismo patrón que
    // mensajeDeDependenciaFaltante().
    function mensajeDeAlcanceFaltante() {
      for (const t of tareasConAlcance()) {
        const clave = `${t.modulo}:${t.tarea}`
        if (!estado.modal.tareasElegidas.has(clave)) continue
        const a = estado.modal.alcances.get(clave)
        if (!a || (!a.todas && !a.unidades.size)) {
          return `"${t.label}" necesita un alcance: marcá "Todas las unidades de negocio" o elegí al menos una unidad.`
        }
      }
      return null
    }

    function renderizarModalModulos() {
      const el = document.getElementById('modal-modulos')
      el.innerHTML = MODULOS_MODAL.map(info => {
        const checked = info.keys.every(k => estado.modal.modulosElegidos.has(k))
        const candado = info.proximamente ? `<span class="fila-modulo__candado">Próximamente</span>` : ''

        return `
          <div class="fila-modulo ${info.proximamente ? 'fila-modulo--deshabilitada' : ''}">
            <span class="fila-modulo__nombre">${info.label} ${candado}</span>
            <label class="toggle">
              <input type="checkbox" data-modulos="${info.keys.join(',')}" ${checked ? 'checked' : ''} ${info.proximamente ? 'disabled' : ''}>
              <span class="toggle__riel"></span>
            </label>
          </div>
        `
      }).join('')

      el.querySelectorAll('input[type="checkbox"]').forEach(chk => {
        chk.addEventListener('change', () => {
          // La foto de "qué grupos se veían" se saca ANTES de mutar: es la
          // única forma de saber cuáles cambiaron por ESTE evento.
          const visiblesAntes = gruposVisibles()

          const keys = chk.dataset.modulos.split(',')
          keys.forEach(k => {
            if (chk.checked) estado.modal.modulosElegidos.add(k)
            else estado.modal.modulosElegidos.delete(k)
          })

          moverTareasPorCambioDeModulos(visiblesAntes)
          renderizarModalModulos()
          // El despliegue condicional depende de los módulos, así que tocar un
          // toggle tiene que repintar las tareas. Antes esta función solo se
          // re-renderizaba a sí misma.
          renderizarModalTareas()
        })
      })
    }

    function renderizarSelectorUnidad() {
      const titulo = document.getElementById('modal-unidad-titulo')
      const select = document.getElementById('modal-select-unidad')

      if (!estado.modal.esNuevoEmpleado) {
        titulo.hidden = true
        select.hidden = true
        return
      }

      titulo.hidden = false
      select.hidden = false
      select.innerHTML = `<option value="">Elegí una unidad de negocio…</option>` +
        estado.maestros.unidadesNegocio.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('')
      select.value = estado.modal.unidadElegida || ''
    }

    function actualizarEstadoBotonGuardar() {
      const btn = document.getElementById('btn-modal-guardar')
      btn.disabled = !!(estado.modal?.esNuevoEmpleado && !estado.modal.unidadElegida)
    }

    document.getElementById('modal-select-unidad').addEventListener('change', (e) => {
      if (!estado.modal) return
      estado.modal.unidadElegida = e.target.value || null
      actualizarEstadoBotonGuardar()
    })

    function abrirModalAprobar(solicitudId) {
      const sol = estado.solicitudes.find(s => s.id === solicitudId)
      const match = calcularEstadoMatch(sol)
      if (match.tipo !== 'match' && match.tipo !== 'sin_match') return

      const esNuevoEmpleado = match.tipo === 'sin_match'
      const nombreMostrar = esNuevoEmpleado
        ? [sol.nombre, sol.apellido].filter(Boolean).join(' ')
        : match.empleado.nombre

      estado.modal = {
        modo: 'aprobar',
        solicitud: sol,
        empleado: match.empleado,
        esNuevoEmpleado,
        modulosElegidos: new Set(),
        unidadElegida: null,
        tareasElegidas: new Set(),
        // Vacío: una solicitud nueva no tiene alcances previos. Cada tarea
        // con alcance que se tilde crea el suyo al vuelo (ver alcanceDe).
        alcances: new Map(),
        // Memoria de sesión del despliegue condicional. Arranca vacía SIEMPRE:
        // solo se llena al destildar un módulo durante esta sesión del modal.
        tareasRecordadas: new Map(),
        ayudaAbierta: null,
      }

      document.getElementById('modal-permisos__titulo').textContent = 'Revisar solicitud'
      document.getElementById('modal-avatar').style.background = colorAvatar(nombreMostrar)
      document.getElementById('modal-avatar').textContent = iniciales(nombreMostrar)
      document.getElementById('modal-nombre').textContent = nombreMostrar
      document.getElementById('modal-email').textContent = sol.email

      renderizarModalModulos()
      renderizarModalTareas()
      renderizarSelectorUnidad()
      document.getElementById('btn-modal-guardar').classList.remove('btn--cargando')
      actualizarEstadoBotonGuardar()

      document.getElementById('btn-modal-rechazar').hidden = false
      document.getElementById('btn-modal-rechazar').textContent = 'Rechazar solicitud'
      document.getElementById('btn-modal-guardar').textContent = 'Aprobar y guardar'

      document.getElementById('modal-permisos').hidden = false
    }

    async function abrirModalEditar(empleadoId) {
      const emp = estado.empleados.find(e => e.id === empleadoId)
      if (!emp || emp.rol_app === 'super_admin') return // salvaguarda — nunca editable desde acá

      // Tareas actuales de la persona, para pre-tildar (incluido el alcance
      // de ver_editar). Si falla, mejor no abrir el modal que abrirlo vacío:
      // guardar con reemplazo total desde un estado mal cargado apagaría
      // todas sus tareas reales.
      const { data: tareasData, error: errTareas } = await supabase
        .from('empleado_tareas')
        .select('modulo, tarea, alcance')
        .eq('empleado_id', empleadoId)
        .eq('habilitado', true)
      if (errTareas) {
        mostrarError('No se pudieron cargar los permisos por tarea de esta persona.')
        return
      }

      const tareasElegidas = new Set((tareasData ?? []).map(t => `${t.modulo}:${t.tarea}`))

      // TODAS las filas que traigan alcance, no solo la de ver_editar. Se lee
      // lo que hay en la base sin filtrar contra el catálogo: si una tarea
      // tiene alcance guardado, se precarga aunque todavía no esté acá, para
      // que el round-trip no lo pierda.
      const alcances = new Map()
      ;(tareasData ?? []).forEach(t => {
        if (!t.alcance) return
        alcances.set(`${t.modulo}:${t.tarea}`, {
          todas: t.alcance.todas === true,
          unidades: new Set(t.alcance.unidades ?? []),
        })
      })

      estado.modal = {
        modo: 'editar',
        empleado: emp,
        esNuevoEmpleado: false,
        modulosElegidos: new Set(modulosDeEmpleado(empleadoId)),
        unidadElegida: null,
        tareasElegidas,
        alcances,
        // Arranca vacía a propósito: las tareas que vienen de la base con su
        // módulo destildado (otorgadas por SQL) NO se mueven acá al abrir.
        // Quedan en tareasElegidas, ocultas pero vivas, para que abrir y
        // guardar sin tocar nada devuelva el payload idéntico. Solo la acción
        // de destildar un módulo las mueve — ver moverTareasPorCambioDeModulos.
        tareasRecordadas: new Map(),
        ayudaAbierta: null,
      }

      document.getElementById('modal-permisos__titulo').textContent = 'Editar permisos'
      document.getElementById('modal-avatar').style.background = colorAvatar(emp.nombre)
      document.getElementById('modal-avatar').textContent = iniciales(emp.nombre)
      document.getElementById('modal-nombre').textContent = emp.nombre
      document.getElementById('modal-email').textContent = formatearCuil(emp.cuil)

      renderizarModalModulos()
      renderizarModalTareas()
      renderizarSelectorUnidad()
      document.getElementById('btn-modal-guardar').classList.remove('btn--cargando')
      actualizarEstadoBotonGuardar()

      document.getElementById('btn-modal-rechazar').hidden = true
      document.getElementById('btn-modal-guardar').textContent = 'Guardar cambios'

      document.getElementById('modal-permisos').hidden = false
    }

    function cerrarModal() {
      document.getElementById('modal-permisos').hidden = true
      estado.modal = null
    }

    document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal)
    document.getElementById('modal-permisos__backdrop').addEventListener('click', cerrarModal)

    document.getElementById('btn-modal-guardar').addEventListener('click', async () => {
      if (!estado.modal) return
      if (estado.modal.esNuevoEmpleado && !estado.modal.unidadElegida) return // salvaguarda, el botón ya viene disabled

      // Toda tarea con alcance tildada exige uno: "todas" o al menos una
      // unidad. El mensaje nombra cuál falta — con varias tareas con alcance,
      // "elegí un alcance" a secas no diría de cuál.
      const faltaAlcance = mensajeDeAlcanceFaltante()
      if (faltaAlcance) {
        mostrarError(faltaAlcance)
        return
      }

      // Dependencias duras entre tareas (campo `requiere` del catálogo). El
      // servidor también las valida en actualizar_permisos_empleado, así que
      // esto es UI: evita el viaje de ida y vuelta y explica el motivo, que es
      // lo que un error crudo de la RPC no haría.
      const faltaDependencia = mensajeDeDependenciaFaltante()
      if (faltaDependencia) {
        mostrarError(faltaDependencia)
        return
      }

      const btn = document.getElementById('btn-modal-guardar')
      btn.classList.add('btn--cargando')
      btn.disabled = true

      const modulos = [...estado.modal.modulosElegidos]
      const tareas  = armarTareasPayload()

      try {
        if (estado.modal.modo === 'aprobar') {
          // Firma nueva, sin p_rol_asignado — todo aprobado entra como 'usuario'.
          const { error } = await supabase.rpc('aprobar_solicitud_acceso', {
            p_solicitud_id: estado.modal.solicitud.id,
            p_modulos: modulos,
            p_tareas: tareas,
            p_unidad_negocio_id: estado.modal.esNuevoEmpleado ? estado.modal.unidadElegida : null,
          })
          if (error) throw error
          mostrarExito('Solicitud aprobada.')
        } else {
          // Firma nueva, sin p_nuevo_rol_app. Reemplazo total: lo no
          // incluido (módulos y tareas) se apaga en el servidor.
          const { error } = await supabase.rpc('actualizar_permisos_empleado', {
            p_empleado_id: estado.modal.empleado.id,
            p_modulos: modulos,
            p_tareas: tareas,
          })
          if (error) throw error
          mostrarExito('Permisos actualizados.')
        }
        cerrarModal()
        await cargarTodo()
      } catch (err) {
        mostrarError(err.message || 'Ocurrió un error al guardar.')
        btn.classList.remove('btn--cargando')
        actualizarEstadoBotonGuardar()
      }
    })

    document.getElementById('btn-modal-rechazar').addEventListener('click', () => {
      if (!estado.modal || estado.modal.modo !== 'aprobar') return
      const solicitudId = estado.modal.solicitud.id
      cerrarModal()
      confirmarRechazo(solicitudId)
    })

    async function rechazarSolicitud(solicitudId) {
      // Vía Edge Function (no la RPC vieja): además de marcar la solicitud
      // como rechazada, borra la cuenta de Auth asociada — si no, la persona
      // no puede volver a registrarse con el mismo email ("ya existe una
      // cuenta con ese email"), porque rechazar no elimina la cuenta.
      const { data, error } = await supabase.functions.invoke('rechazar-solicitud-acceso', {
        body: { solicitud_id: solicitudId },
      })

      if (error || !data?.ok) {
        mostrarError(data?.mensaje || 'No se pudo rechazar la solicitud.')
        return
      }

      if (data.cuentaAuthNoEliminada) {
        mostrarError('La solicitud se rechazó, pero no se pudo borrar la cuenta de acceso asociada. Avisá a soporte.')
      } else {
        mostrarExito('Solicitud rechazada.')
      }
      await cargarTodo()
    }

    function confirmarRechazo(solicitudId) {
      if (!window.confirm('¿Rechazar esta solicitud de acceso?')) return
      rechazarSolicitud(solicitudId)
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TABS Y FILTROS
    // ═══════════════════════════════════════════════════════════════════════

    document.querySelectorAll('.tabs-accesos__opcion').forEach(btn => {
      btn.addEventListener('click', () => {
        estado.tabActiva = btn.dataset.tab
        document.querySelectorAll('.tabs-accesos__opcion').forEach(b => b.classList.toggle('tabs-accesos__opcion--activa', b === btn))
        document.getElementById('vista-solicitudes').hidden = estado.tabActiva !== 'solicitudes'
        document.getElementById('vista-usuarios').hidden    = estado.tabActiva !== 'usuarios'
      })
    })

    document.getElementById('filtro-nombre-usuarios').addEventListener('input', (e) => {
      estado.filtrosUsuarios.texto = e.target.value
      renderizarUsuarios()
    })
    document.getElementById('filtro-rol-usuarios').addEventListener('change', (e) => {
      estado.filtrosUsuarios.rol = e.target.value
      renderizarUsuarios()
    })
    document.getElementById('filtro-modulo-usuarios').addEventListener('change', (e) => {
      estado.filtrosUsuarios.modulo = e.target.value
      renderizarUsuarios()
    })

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════

    async function init() {
      estado.sesion = await verificarSesion()
      if (!estado.sesion) return

      const { data: emp, error } = await supabase
        .from('empleados')
        .select('id, rol_app')
        .eq('auth_user_id', estado.sesion.user.id)
        .maybeSingle()

      if (error || !emp || emp.rol_app !== 'super_admin') {
        mostrarError('No tenés permiso para acceder a este módulo.')
        setTimeout(() => window.location.replace('../dashboard.html'), 1500)
        return
      }

      estado.miEmpleado = emp

      const { data: modulosData, error: errorModulos } = await supabase
        .from('modulos')
        .select('*')
        .eq('activo', true)
        .order('orden')

      if (errorModulos) {
        mostrarError('No se pudieron cargar los módulos.')
        return
      }
      construirListasModulos(modulosData || [])

      document.getElementById('filtro-rol-usuarios').innerHTML = `
        <option value="">Todos los roles</option>
        <option value="usuario">Usuario</option>
        <option value="super_admin">Super admin</option>
      `
      document.getElementById('filtro-modulo-usuarios').innerHTML = `
        <option value="">Todos los módulos</option>
        ${MODULOS_INFO.filter(m => !m.proximamente).map(m => `<option value="${m.key}">${m.label}</option>`).join('')}
      `

      await cargarTodo()
    }

    init()
  </script>

</body>
